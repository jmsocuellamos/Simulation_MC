com, esc, aj[\"nsim\"], aj[\"replicas\"], aj[\"semilla\"], progreso)\n    mB = simular_B(com, esc, aj[\"ndias\"], aj[\"replicas_B\"], aj[\"semilla\"], progreso)\n    return {\"esc\": dict(esc), \"teoria\": t, \"mcA\": mA, \"mcB\": mB, \"resA\": resumen_A(mA, t[\"A\"], com[\"umbral_Y\"]),\n            \"resB\": resumen_B(mB, t[\"B\"]), \"objetivos\": evaluar_objetivos(t, com[\"objetivos\"], com)}\n\n\ndef diferencias(res, base, com):\n    \"\"\"Ahorro de cada escenario frente al base: teórico y simulado (diferencias pareadas por réplica, mismas semillas).\"\"\"\n    if base not in res:\n        return None\n    rb = res[base]\n    filas = []\n    for n, r in res.items():\n        if n == base:\n            continue\n        dA = rb[\"mcA\"][\"replicas\"][\"E(Y)\"] - r[\"mcA\"][\"replicas\"][\"E(Y)\"]\n        dB = rb[\"mcB\"][\"replicas\"][\"Coste diario con tráfico\"] - r[\"mcB\"][\"replicas\"][\"Coste diario con tráfico\"]\n        dS = rb[\"mcB\"][\"replicas\"][\"Sobrecoste diario\"] - r[\"mcB\"][\"replicas\"][\"Sobrecoste diario\"]\n        tq = _tq(len(dA)); tqb = _tq(len(dB))\n        ic = lambda v, t_: (float(v.mean() - t_ * v.std(ddof=1) / math.sqrt(len(v))),\n                            float(v.mean() + t_ * v.std(ddof=1) / math.sqrt(len(v))))\n        ta, tb = rb[\"teoria\"], r[\"teoria\"]\n        impl = float(r[\"esc\"].get(\"coste_impl\") or 0.0)\n        filas.append({\"Escenario\": n,\n                      \"Ahorro por entrega · teórico (€)\": ta[\"A\"][\"EY\"] - tb[\"A\"][\"EY\"],\n                      \"Ahorro por entrega · simulado (€)\": float(dA.mean()),\n                      \"IC95 ahorro por entrega (€)\": ic(dA, tq),\n                      \"Ahorro anual · teórico (€)\": (ta[\"A\"][\"EY\"] - tb[\"A\"][\"EY\"]) * com[\"entregas_ano\"],\n                      \"Ahorro anual · simulado (€)\": float(dA.mean()) * com[\"entregas_ano\"],\n                      \"Ahorro diario · teórico (€)\": ta[\"B\"][\"dia_con\"] - tb[\"B\"][\"dia_con\"],\n                      \"Ahorro diario · simulado (€)\": float(dB.mean()),\n                      \"IC95 ahorro diario (€)\": ic(dB, tqb),\n                      \"Ahorro en sobrecoste diario · teórico (€)\": ta[\"B\"][\"dia_delta\"] - tb[\"B\"][\"dia_delta\"],\n                      \"Ahorro en sobrecoste diario · simulado (€)\": float(dS.mean()),\n                      \"Coste de implantación (€/día)\": impl,\n                      \"Ahorro diario neto · teórico (€)\": ta[\"B\"][\"dia_con\"] - tb[\"B\"][\"dia_con\"] - impl,\n                      \"Cambio en σ(Y) · teórico (€)\": tb[\"A\"][\"sdY\"] - ta[\"A\"][\"sdY\"],\n                      \"Cambio en P(Y > umbral) · teórico\": tb[\"A\"][\"Pcola\"] - ta[\"A\"][\"Pcola\"]})\n    return pd.DataFrame(filas).set_index(\"Escenario\") if filas else None\n\n\ndef tabla_comparativa(res, com):\n    cols = {}\n    u = num(com[\"umbral_Y\"], 0)\n    for n, r in res.items():\n        A, B, e = r[\"teoria\"][\"A\"], r[\"teoria\"][\"B\"], r[\"esc\"]\n        ra, rb = r[\"resA\"], r[\"resB\"]\n        cols[n] = {\n            \"Parámetro · p(Urbana / Regional / Premium)\": \" / \".join(num(x, 2) for x in A[\"p\"]),\n            \"Parámetro · P_fuel / C_labor\": f\"{num(e['P_fuel'], 2)} / {num(e['C_labor'], 1)}\",\n            \"Parámetro · peaje (K fijo / €/km sobre umbral)\": f\"{num(e['K'], 0)} / {num(e['tarifa_km'], 2)}\",\n            \"Parámetro · consumo del proveedor (×G)\": num(e[\"factor_G\"], 2),\n            \"Parámetro · urbanos de Punta a Valle\": pct(e[\"desplazar\"], 0),\n            \"Parámetro · Premium externalizado\": f\"sí ({eur(e['coste_ext'])})\" if e[\"externalizar\"] else \"no\",\n            \"Teórico · E(Y) por entrega (€)\": A[\"EY\"], \"Teórico · σ(Y) (€)\": A[\"sdY\"],\n            f\"Teórico · P(Y > {u} €)\": A[\"Pcola\"], \"Teórico · P90 de Y (€)\": A[\"P90\"],\n            \"Teórico · coste anual (€)\": A[\"anual\"],\n            \"Teórico · coste diario con tráfico (€)\": B[\"dia_con\"], \"Teórico · sobrecoste diario (€)\": B[\"dia_delta\"],\n            \"Teórico · % sobrecoste\": B[\"pct_sobre\"], \"Teórico · P95 coste diario (€)\": B[\"P95\"],\n            \"Teórico · P(coste diario > presupuesto)\": B[\"Ppres\"],\n            \"Simulado · E(Y) por entrega (€)\": ra.loc[\"Coste esperado E(Y) (€)\", \"Simulado · media\"],\n            f\"Simulado · P(Y > {u} €)\": ra.loc[f\"P(Y > {u} €)\", \"Simulado · media\"],\n            \"Simulado · coste diario con tráfico (€)\": rb.loc[\"Coste diario esperado con tráfico (€)\", \"Simulado · media\"],\n            \"Simulado · sobrecoste diario (€)\": rb.loc[\"Sobrecoste diario por tráfico (€)\", \"Simulado · media\"],\n            \"Simulado · P95 coste diario (€)\": rb.loc[\"Percentil 95 del coste diario (€) · aprox. normal\", \"Simulado · media\"],\n            \"Objetivos cumplidos\": f\"{(r['objetivos']['Cumple'] == 'Sí').sum()} de {len(r['objetivos'])}\",\n        }\n    return pd.DataFrame(cols)\n\n\ndef tabla_objetivos(res):\n    return pd.DataFrame({n: r[\"objetivos\"][\"Cumple\"] for n, r in res.items()})\n\n\n# ==============================================================================================\n# O3.1 · Optimización del vector de probabilidades de las rutas\n# ==============================================================================================\ndef optimizar_rutas(mu, p0, reduccion):\n    \"\"\"min ‖p − p₀‖²  s.a.  Σ pⱼ·μⱼ ≤ (1 − r)·Σ p₀ⱼ·μⱼ,  Σ pⱼ = 1,  pⱼ ≥ 0  (μⱼ = E(Y | T = j)).\n    Se resuelve sobre una rejilla fina del símplex (paso 0,001) y se devuelve la solución más cercana a p₀.\"\"\"\n    mu = np.asarray(mu, dtype=float); p0 = normalizar(p0)\n    objetivo = (1 - reduccion) * float(p0 @ mu)\n    paso = 0.001\n    g = np.arange(0, 1 + 1e-9, paso)\n    p1, p2 = np.meshgrid(g, g, indexing=\"ij\")\n    p3 = 1 - p1 - p2\n    ok = p3 >= -1e-12\n    E = p1 * mu[0] + p2 * mu[1] + np.clip(p3, 0, 1) * mu[2]\n    fact = ok & (E <= objetivo + 1e-9)\n    if not fact.any():\n        return None\n    dist = (p1 - p0[0]) ** 2 + (p2 - p0[1]) ** 2 + (p3 - p0[2]) ** 2\n    dist = np.where(fact, dist, np.inf)\n    i, j = np.unravel_index(int(np.argmin(dist)), dist.shape)\n    p = np.array([g[i], g[j], max(0.0, 1 - g[i] - g[j])])\n    return {\"p\": p, \"E\": float(p @ mu), \"objetivo\": objetivo, \"E0\": float(p0 @ mu), \"distancia\": float(math.sqrt(dist[i, j]))}\n\n\ndef analizar_optimizacion(com, esc, reduccion, mcA=None, nsim=10000, replicas=5, semilla=1000):\n    \"\"\"Resuelve O3.1 con las medias teóricas por ruta y con las estimadas por simulación, y verifica la solución\n    re-simulando con las mismas semillas.\"\"\"\n    tA = teoria_A(com, esc)\n    mu_teo = [tA[\"por_ruta\"][r][\"EY\"] for r in RUTAS]\n    sol_teo = optimizar_rutas(mu_teo, esc[\"p\"], reduccion)\n    if mcA is None:\n        mcA = simular_A(com, esc, nsim, replicas, semilla)\n    Y, T = mcA[\"Y\"], mcA[\"T\"]\n    mu_sim = [float(Y[T == r].mean()) for r in RUTAS]\n    sol_sim = optimizar_rutas(mu_sim, esc[\"p\"], reduccion)\n    verif = None\n    if sol_sim is not None:\n        e2 = dict(esc, p=list(sol_sim[\"p\"]))\n        m2 = simular_A(com, e2, nsim, replicas, semilla)\n        v = m2[\"replicas\"][\"E(Y)\"]\n        tq = _tq(len(v)); se = float(v.std(ddof=1)) / math.sqrt(len(v))\n        verif = {\"E\": float(v.mean()), \"lo\": float(v.mean()) - tq * se, \"hi\": float(v.mean()) + tq * se,\n                 \"E_teo\": teoria_A(com, e2)[\"EY\"]}\n    return {\"reduccion\": reduccion, \"mu_teo\": mu_teo, \"mu_sim\": mu_sim, \"teo\": sol_teo, \"sim\": sol_sim, \"verif\": verif,\n            \"p0\": normalizar(esc[\"p\"])}\n\n\n# ==============================================================================================\n# O2.2 · Sensibilidad de la varianza a los parámetros económicos; sensibilidad del estimador\n# ==============================================================================================\nPARAM_ECON = {\"P_fuel\": \"P_fuel (€/L)\", \"C_labor\": \"C_labor (€/h)\", \"K\": \"K (€)\"}\n\n\ndef sensibilidad_economica(com, esc, variaciones, nsim=20000, semilla=1000):\n    \"\"\"Var(Y) y E(Y) al variar cada parámetro económico manteniendo los demás fijos: teórico (exacto) y simulado con\n    números aleatorios comunes (una muestra de nsim entregas).\"\"\"\n    rng = np.random.default_rng(int(semilla))\n    U = rng.random((5, int(nsim)))\n    filas = []\n    for par in PARAM_ECON:\n        for v in variaciones:\n            e2 = dict(esc, **{par: esc[par] * (1 + v)})\n            E, cov, EY, VY = mezcla([(pp, tipo_pedido(com, e2, r)) for pp, r in zip(normalizar(e2[\"p\"]), RUTAS)])\n            Y = generar_pedidos(com, e2, U)[\"Ysin\"]\n            filas.append({\"Parámetro\": PARAM_ECON[par], \"Variación\": v, \"Valor\": e2[par],\n                          \"Teórico · Var(Y)\": VY, \"Simulado · Var(Y)\": float(Y.var(ddof=1)),\n                          \"Teórico · σ(Y)\": math.sqrt(VY), \"Teórico · E(Y)\": EY, \"Simulado · E(Y)\": float(Y.mean())})\n    df = pd.DataFrame(filas)\n    # elasticidad de Var(Y) en el punto base: d ln Var / d ln parámetro (diferencia centrada ±1 %)\n    elas = {}\n    for par in PARAM_ECON:\n        vs = []\n        for h in (-0.01, 0.01):\n            e2 = dict(esc, **{par: esc[par] * (1 + h)})\n            vs.append(mezcla([(pp, tipo_pedido(com, e2, r)) for pp, r in zip(normalizar(e2[\"p\"]), RUTAS)])[3])\n        elas[PARAM_ECON[par]] = (math.log(vs[1]) - math.log(vs[0])) / (math.log(1.01) - math.log(0.99)) if min(vs) > 0 else 0.0\n    return df, elas\n\n\ndef valores_barrido(vmin, vmax, puntos):\n    v = np.geomspace(max(1, vmin), max(vmin + 1, vmax), max(2, int(puntos)))\n    return sorted(set(int(round(x)) for x in v))\n\n\ndef sensibilidad_estimador(com, esc, metrica, valores, replicas, semilla, progreso=None):\n    \"\"\"E(Y) por entrega frente a nsim (Bloque A) o coste diario medio frente al nº de días (Bloque B).\"\"\"\n    t = teoria(com, esc)\n    teo = t[\"A\"][\"EY\"] if metrica == \"entrega\" else t[\"B\"][\"dia_con\"]\n    sd1 = t[\"A\"][\"sdY\"] if metrica == \"entrega\" else t[\"B\"][\"sd_dia_con\"]\n    tq = _tq(int(replicas))\n    filas, k, tot = [], 0, len(valores) * int(replicas)\n    for n in valores:\n        medias = []\n        for r in range(int(replicas)):\n            if metrica == \"entrega\":\n                rng = np.random.default_rng(int(semilla) + r)\n                medias.append(float(generar_pedidos(com, esc, rng.random((5, n)))[\"Ysin\"].mean()))\n            else:\n                m = simular_B(com, esc, n, 1, int(semilla) + r)\n                medias.append(float(m[\"replicas\"][\"Coste diario con tráfico\"].iloc[0]))\n            k += 1\n            if progreso:\n                progreso(k, tot)\n        m = float(np.mean(medias)); sdr = float(np.std(medias, ddof=1)) if len(medias) > 1 else 0.0\n        se = sdr / math.sqrt(len(medias))\n        filas.append({\"n\": n, \"Media de las réplicas\": m, \"IC95 inf\": m - tq * se, \"IC95 sup\": m + tq * se,\n                      \"σ entre réplicas\": sdr, \"σ teórica del estimador\": sd1 / math.sqrt(n), \"Teórico\": teo,\n                      \"Error relativo\": (m - teo) / teo, \"Medias por réplica\": medias})\n    return pd.DataFrame(filas).set_index(\"n\")\n\n\n# ==============================================================================================\n# Formato y textos\n# ==============================================================================================\ndef num(x, d=2):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    if isinstance(x, float) and math.isinf(x):\n        return \"∞\"\n    if round(float(x), d) == 0:\n        x = 0.0\n    s = f\"{x:,.{d}f}\"\n    return s.replace(\",\", \"X\").replace(\".\", \",\").replace(\"X\", \".\")\n\n\ndef pct(x, d=1):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    return num(100 * x, d) + \" %\"\n\n\ndef eur(x, d=0):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    return num(x, d) + \" €\"\n\n\ndef fmt_val(k, v):\n    \"\"\"Formato según el nombre del KPI (fila).\"\"\"\n    if isinstance(v, str) or v is None:\n        return \"—\" if v is None else v\n    if isinstance(v, tuple):\n        return f\"[{fmt_val(k, v[0])}; {fmt_val(k, v[1])}]\"\n    if \"(€)\" in k or \"(€/día)\" in k:\n        return eur(v, 0) if any(x in k for x in (\"anual\", \"diario\", \"P95\", \"CVaR\", \"Percentil 95\", \"día\")) else eur(v, 2)\n    if k.startswith((\"P(\", \"Teórico · P(\", \"Simulado · P(\")) or \"%\" in k or \"Cuota\" in k or \"Contribución\" in k \\\n            or \"Peso\" in k or \"Cambio en P\" in k:\n        return pct(v, 2)\n    if k.startswith(\"CV\") or \"CV(\" in k:\n        return num(v, 3)\n    if \"Varianza\" in k or \"Pedidos\" in k or \"pedidos\" in k or \"Rechazados\" in k:\n        return num(v, 1)\n    if \"anual\" in k or \"diario\" in k or \"P95\" in k or \"CVaR\" in k or \"Percentil 95\" in k:\n        return eur(v, 0)\n    return eur(v, 2) if \"€\" in k else num(v, 3)\n\n\ndef fmt_kpi(k, c, v):\n    return fmt_val(k, v)\n\n\ndef fmt_res(fila, col, v):\n    if col == \"Teórico en IC95\":\n        return \"—\" if v is None else (\"Sí\" if v else \"No\")\n    if col == \"Error relativo\":\n        return \"—\" if v is None or (isinstance(v, float) and math.isnan(v)) else pct(v, 2)\n    return fmt_val(fila, v)\n\n\ndef fmt_dif(fila, col, v):\n    return fmt_val(col, v)\n\n\ndef fmt_obj(fila, col, v):\n    if col == \"Valor\":\n        return pct(v, 2) if fila.startswith((\"Probabilidad\", \"P(\")) else eur(v, 2 if \"entrega\" in fila else 0)\n    return str(v)\n\n\ndef texto_escenario(nombre, r, com):\n    A, B = r[\"teoria\"][\"A\"], r[\"teoria\"][\"B\"]\n    okA = r[\"resA\"][\"Teórico en IC95\"].dropna(); okB = r[\"resB\"][\"Teórico en IC95\"].dropna()\n    fuera = list(okA[~okA].index) + list(okB[~okB].index)\n    n_kpi = len(okA) + len(okB)\n    val = (\"la simulación reproduce los valores teóricos (todos dentro del IC95 %)\" if not fuera else\n           f\"la simulación reproduce los valores teóricos en {n_kpi - len(fuera)} de los {n_kpi} KPIs; quedan fuera del \"\n           f\"IC95 % {', '.join(fuera)}, con errores relativos pequeños (con tantos KPIs es esperable que alguno quede \"\n           \"fuera por azar)\")\n    pr = A[\"por_ruta\"]\n    mayor_cola = max(RUTAS, key=lambda x: pr[x][\"peso_cola\"])\n    mayor_cv = max(RUTAS, key=lambda x: pr[x][\"CV\"])\n    dom = int(np.argmax(A[\"contrib\"]))\n    txt = (f\"{nombre}: una entrega cuesta en media E(Y) = {eur(A['EY'], 2)} (σ = {eur(A['sdY'], 2)}); el 10 % de las \"\n           f\"entregas cuesta más de {eur(A['P90'], 2)} y P(Y > {eur(com['umbral_Y'])}) = {pct(A['Pcola'], 2)}. La ruta \"\n           f\"{NOMBRE_RUTA[mayor_cola]} aporta el {pct(pr[mayor_cola]['peso_cola'], 0)} de las entregas caras y la \"\n           f\"{NOMBRE_RUTA[mayor_cv]} es la de mayor incertidumbre relativa (CV = {num(pr[mayor_cv]['CV'], 2)}); el término \"\n           f\"«{TERMINOS[dom]}» explica el {pct(A['contrib'][dom], 0)} de la varianza. Un día cuesta \"\n           f\"{eur(B['dia_con'])} con tráfico ({eur(B['dia_sin'])} sin él): el tráfico añade {eur(B['dia_delta'])} \"\n           f\"({pct(B['pct_sobre'], 1)}); P95 = {eur(B['P95'])} y P(coste > {eur(com['presupuesto'])}) = \"\n           f\"{pct(B['Ppres'], 2)} (valores teóricos); {val}.\")\n    n_ok = (r[\"objetivos\"][\"Cumple\"] == \"Sí\").sum()\n    txt += f\" Cumple {n_ok} de los {len(r['objetivos'])} objetivos.\"\n    return txt\n\n\ndef texto_recomendacion(res, base, com):\n    filas = [(n, (r[\"objetivos\"][\"Cumple\"] == \"Sí\").sum(), r[\"teoria\"], float(r[\"esc\"].get(\"coste_impl\") or 0.0))\n             for n, r in res.items()]\n    max_ok = max(f[1] for f in filas)\n    mejor = sorted([f for f in filas if f[1] == max_ok], key=lambda f: f[2][\"B\"][\"dia_con\"] + f[3])[0]\n    txt = (f\"Se recomienda «{mejor[0]}»: es el escenario que cumple más objetivos ({mejor[1]} de \"\n           f\"{len(res[mejor[0]]['objetivos'])}) y, entre ellos, el de menor coste diario ({eur(mejor[2]['B']['dia_con'])}\"\n           + (f\" más {eur(mejor[3])} de implantación\" if mejor[3] else \"\") + \").\")\n    if base in res and mejor[0] != base:\n        tb = res[base][\"teoria\"]\n        txt += (f\" Frente a «{base}», ahorra {eur(tb['B']['dia_con'] - mejor[2]['B']['dia_con'] - mejor[3])} netos al día y \"\n                f\"{eur(tb['A']['EY'] - mejor[2]['A']['EY'], 2)} por entrega \"\n                f\"({eur((tb['A']['EY'] - mejor[2]['A']['EY']) * com['entregas_ano'])} al año con \"\n                f\"{num(com['entregas_ano'], 0)} entregas).\")\n    barato = min(filas, key=lambda f: f[2][\"A\"][\"EY\"])\n    if barato[0] != mejor[0]:\n        txt += f\" El de menor coste por entrega es «{barato[0]}» ({eur(barato[2]['A']['EY'], 2)}).\"\n    return txt\n\n\nKPIS_CUADRO = [\n    (\"Coste medio por entrega E(Y) con IC95 %\", \"nivel de coste unitario; base de la tarificación\"),\n    (\"Percentil 90 por entrega y P(Y > umbral)\", \"riesgo de entregas caras; dimensiona márgenes y reclamaciones\"),\n    (\"Coste diario medio con y sin tráfico\", \"presupuesto operativo y peso de la congestión\"),\n    (\"Sobrecoste por tráfico (€/día y % del coste) por franja\", \"dónde actuar: Punta frente a Llano y Valle\"),\n    (\"Percentil 95 y CVaR 5 % del coste diario\", \"riesgo financiero de los días malos (colchón de tesorería)\"),\n    (\"P(coste diario > presupuesto)\", \"probabilidad de desviarse del presupuesto aprobado\"),\n    (\"Pedidos por día y por hora punta; pedidos rechazados\", \"dimensionamiento de flota y nivel de servicio\"),\n    (\"Mezcla de rutas (p Urbana / Regional / Premium) y coste por ruta\", \"palanca comercial y de externalización\"),\n]\n\n\ndef una_entrega(com, esc, uT, uD, uG, uM, franja=\"Punta\"):\n    \"\"\"Una entrega con uniformes dados (mecanismo de composición) y su coste por términos sin y con tráfico.\"\"\"\n    U = np.array([[uT], [uD], [uG], [uM], [1.0]])\n    o = generar_pedidos(com, esc, U)\n    T = int(o[\"T\"][0])\n    fG = com[\"f_consumo\"][franja][T]\n    fM = com[\"f_retraso\"][franja][T] * ((1 - esc[\"reduccion_punta\"]) if (franja == \"Punta\" and esc.get(\"reduccion_punta\")) else 1.0)\n    sin = [float(o[\"fuel\"][0]), float(o[\"labor\"][0]), float(o[\"peaje\"][0]), float(o[\"ext\"][0])]\n    con = [sin[0] * fG, sin[1] * fM, sin[2], sin[3]]\n    if esc.get(\"externalizar\") and T == 3:\n        con = sin\n    return {\"T\": T, \"D\": float(o[\"D\"][0]), \"G\": float(o[\"G\"][0]), \"M\": float(o[\"M\"][0]), \"sin\": sin, \"con\": con,\n            \"Ysin\": sum(sin), \"Ycon\": sum(con), \"fG\": fG, \"fM\": fM}\n",
 "graficos.py": "# -*- coding: utf-8 -*-\n\"\"\"Gráficos (matplotlib) de la aplicación Fly-Next. Cada función devuelve una Figure.\"\"\"\nimport io\nimport math\n\nimport matplotlib\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\nimport matplotlib.ticker as mticker\nimport numpy as np\n\nimport flynext as fx\n\n# Paleta categórica validada (orden fijo; el color sigue a la entidad, nunca a su posición)\nSERIES = [\"#2a78d6\", \"#eb6834\", \"#1baf7a\", \"#eda100\", \"#e87ba4\", \"#008300\", \"#6250d6\", \"#e34948\"]\nCOLOR_RUTA = {1: SERIES[0], 2: SERIES[3], 3: SERIES[6]}\nCOLOR_FRANJA = {\"Valle\": SERIES[2], \"Llano\": SERIES[3], \"Punta\": SERIES[7]}\nCOLOR_TERM = [SERIES[1], SERIES[0], SERIES[4], SERIES[5]]          # combustible, mano de obra, peaje, externalización\nSIN, CON = \"#8a8984\", SERIES[7]\nBUENO, CRITICO = \"#0b7a0b\", \"#b23232\"\nTEXTO, TEXTO2, REJILLA = \"#0b0b0b\", \"#52514e\", \"#e1e0d9\"\n\nplt.rcParams.update({\n    \"figure.dpi\": 110, \"savefig.dpi\": 150, \"font.size\": 9.5, \"axes.titlesize\": 10.5, \"axes.titleweight\": \"bold\",\n    \"axes.edgecolor\": \"#b9b8b2\", \"axes.labelcolor\": TEXTO2, \"xtick.color\": TEXTO2, \"ytick.color\": TEXTO2,\n    \"axes.grid\": True, \"grid.color\": REJILLA, \"grid.linewidth\": 0.8, \"axes.axisbelow\": True,\n    \"axes.spines.top\": False, \"axes.spines.right\": False, \"legend.frameon\": False,\n})\n_EUR0 = mticker.FuncFormatter(lambda y, _: fx.num(y, 0))\n_PCT = mticker.PercentFormatter(1.0, decimals=0)\n\n\ndef color_escenario(i):\n    return SERIES[i % len(SERIES)]\n\n\ndef fig_a_png(fig):\n    buf = io.BytesIO()\n    fig.savefig(buf, format=\"png\", bbox_inches=\"tight\", facecolor=\"white\")\n    plt.close(fig)\n    buf.seek(0)\n    return buf\n\n\ndef _etiquetas(ax, nombres):\n    ax.set_xticks(range(len(nombres)))\n    ax.set_xticklabels(nombres, rotation=30 if len(nombres) > 2 else 0, ha=\"right\" if len(nombres) > 2 else \"center\",\n                       fontsize=8)\n\n\n# ---------------------------------------------------------------------------------------------- mecanismo\ndef fig_mecanismo(p, uT, partes_sin, partes_con, titulo=None):\n    \"\"\"Izquierda: composición, la ruta se elige con U_T sobre las probabilidades acumuladas. Derecha: coste de la\n    entrega generada, por términos, sin y con tráfico.\"\"\"\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(10, 3.4), gridspec_kw={\"width_ratios\": [1.2, 1]})\n    F = np.cumsum(fx.normalizar(p)); esc = np.concatenate([[0], F])\n    for i, r in enumerate(fx.RUTAS):\n        a1.add_patch(plt.Rectangle((-0.6, esc[i]), 3.2, esc[i + 1] - esc[i], color=COLOR_RUTA[r], alpha=0.12, lw=0))\n        a1.plot([i - 0.5, i + 0.5], [F[i], F[i]], color=COLOR_RUTA[r], lw=3)\n        a1.text(2.62, (esc[i] + esc[i + 1]) / 2, f\"{fx.NOMBRE_RUTA[r]}\\n({fx.num(esc[i], 2)}, {fx.num(F[i], 2)}]\",\n                va=\"center\", fontsize=8, color=COLOR_RUTA[r])\n    k = int(np.searchsorted(F, uT))\n    k = min(k, 2)\n    a1.annotate(\"\", xy=(k, uT), xytext=(-0.55, uT), arrowprops=dict(arrowstyle=\"->\", color=TEXTO, lw=1.6))\n    a1.annotate(\"\", xy=(k, -0.02), xytext=(k, uT), arrowprops=dict(arrowstyle=\"->\", color=TEXTO, lw=1.6))\n    a1.text(-0.55, min(uT + 0.03, 1.0), f\"U_T = {fx.num(uT, 2)}\", fontsize=9)\n    a1.set_xlim(-0.6, 3.3); a1.set_ylim(-0.03, 1.05)\n    a1.set_xticks(range(3)); a1.set_xticklabels([fx.NOMBRE_RUTA[r] for r in fx.RUTAS])\n    a1.set_ylabel(\"F(T)\"); a1.set_title(\"Paso 1 · ruta por transformada inversa\", fontsize=9.5)\n    nombres = [\"sin tráfico\", \"con tráfico\"]\n    base = np.zeros(2)\n    for j, nom in enumerate(fx.TERMINOS):\n        v = np.array([partes_sin[j], partes_con[j]])\n        if v.max() <= 0:\n            continue\n        a2.bar(nombres, v, bottom=base, color=COLOR_TERM[j], width=0.55, label=nom.split(\" \")[0])\n        base += v\n    for i, b in enumerate(base):\n        a2.text(i, b, fx.eur(b, 2), ha=\"center\", va=\"bottom\", fontsize=8.5)\n    a2.set_ylim(0, max(base.max(), 1) * 1.2)\n    a2.set_ylabel(\"€\"); a2.set_title(\"Paso 2 · D, G, M y coste de la entrega\", fontsize=9.5)\n    a2.legend(loc=\"upper left\", fontsize=7.5)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- bloque A\ndef fig_hist_Y(tA, Y, umbral, titulo=None):\n    Y = np.asarray(Y)\n    hi = float(np.quantile(Y, 0.995))\n    bins = np.linspace(0, hi, 70)\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    ax.hist(Y[Y <= hi], bins=bins, density=True, color=SERIES[0], alpha=0.5, edgecolor=\"white\", label=\"simulación\")\n    Fb = np.interp(bins, tA[\"y\"], tA[\"F\"])\n    dens = np.diff(Fb) / np.diff(bins)\n    ax.step(bins[:-1], dens, where=\"post\", color=TEXTO, lw=1.6, label=\"teórica (integración numérica)\")\n    ax.axvline(tA[\"EY\"], color=SERIES[0], ls=\"--\", lw=1.4, label=f\"E(Y) = {fx.eur(tA['EY'], 2)}\")\n    ax.axvline(tA[\"P90\"], color=SERIES[3], ls=\"-.\", lw=1.4, label=f\"P90 = {fx.eur(tA['P90'], 2)}\")\n    ax.axvline(umbral, color=CRITICO, ls=\":\", lw=1.5, label=f\"umbral {fx.eur(umbral)}\")\n    ax.set_yscale(\"log\")\n    ax.set_xlabel(\"coste de una entrega Y (€) · hasta el percentil 99,5\"); ax.set_ylabel(\"densidad (escala log)\")\n    ax.set_title(titulo or \"Distribución del coste de una entrega\")\n    ax.legend(loc=\"upper right\", fontsize=8)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_por_ruta(tA, resA, umbral, titulo=None):\n    rutas = [fx.NOMBRE_RUTA[r] for r in fx.RUTAS]\n    pr = tA[\"por_ruta\"]\n    fig, axs = plt.subplots(1, 3, figsize=(11, 3.4))\n    u = fx.num(umbral, 0)\n    datos = [(\"E(Y | ruta) (€)\", [pr[r][\"EY\"] for r in fx.RUTAS], [resA.loc[f\"E(Y | {fx.NOMBRE_RUTA[r]}) (€)\", \"Simulado · media\"] for r in fx.RUTAS], 2),\n             (f\"P(Y > {u} € | ruta)\", [pr[r][\"Pcola\"] for r in fx.RUTAS], [resA.loc[f\"P(Y > {u} € | {fx.NOMBRE_RUTA[r]})\", \"Simulado · media\"] for r in fx.RUTAS], \"%\"),\n             (\"Coeficiente de variación\", [pr[r][\"CV\"] for r in fx.RUTAS], [resA.loc[f\"CV(Y | {fx.NOMBRE_RUTA[r]})\", \"Simulado · media\"] for r in fx.RUTAS], 3)]\n    for ax, (tit, v, s, d) in zip(axs, datos):\n        bars = ax.bar(range(3), v, color=[COLOR_RUTA[r] for r in fx.RUTAS], width=0.6)\n        ax.plot(range(3), s, \"D\", color=TEXTO, ms=6, label=\"simulado\")\n        for b_, x in zip(bars, v):\n            ax.text(b_.get_x() + b_.get_width() / 2, b_.get_height(), fx.pct(x, 1) if d == \"%\" else fx.num(x, d),\n                    ha=\"center\", va=\"bottom\", fontsize=8)\n        ax.set_xticks(range(3)); ax.set_xticklabels(rutas)\n        ax.set_title(tit, fontsize=9.5)\n        ax.set_ylim(0, max(max(v), max(s)) * 1.25)\n        if d == \"%\":\n            ax.yaxis.set_major_formatter(_PCT)\n    axs[0].legend(loc=\"upper left\", fontsize=8)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_descomposicion(tA, resA, titulo=None):\n    \"\"\"Contribución de cada término a Var(Y): Cov(Xᵢ, Y)/Var(Y), teórica (barras) y simulada (rombos).\"\"\"\n    v = list(tA[\"contrib\"])\n    s = [resA.loc[f\"Contribución a Var(Y) · {n}\", \"Simulado · media\"] for n in fx.TERMINOS]\n    keep = [i for i in range(4) if abs(v[i]) > 1e-9 or abs(s[i]) > 1e-9]\n    fig, ax = plt.subplots(figsize=(9, 3.0))\n    x = np.arange(len(keep))\n    ax.barh(x, [v[i] for i in keep], color=[COLOR_TERM[i] for i in keep], height=0.55)\n    ax.plot([s[i] for i in keep], x, \"D\", color=TEXTO, ms=6, label=\"simulado\")\n    for j, i in enumerate(keep):\n        ax.text(v[i], j, \"  \" + fx.pct(v[i], 1), va=\"center\", fontsize=8.5)\n    ax.set_yticks(x); ax.set_yticklabels([fx.TERMINOS[i] for i in keep])\n    ax.invert_yaxis()\n    ax.xaxis.set_major_formatter(_PCT)\n    ax.set_xlim(min(0, min(v)) * 1.2, max(v) * 1.25)\n    ax.set_title(titulo or \"Descomposición de Var(Y): Cov(término, Y) / Var(Y)\")\n    ax.legend(loc=\"lower right\", fontsize=8)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_traza_A(traza, esc, titulo=None):\n    \"\"\"Primeras entregas simuladas: coste por términos (combustible, mano de obra, peaje) y ruta asignada.\"\"\"\n    tr = traza\n    fuel = tr[\"D (km)\"] * tr[\"G (L/km)\"] * esc[\"P_fuel\"]\n    lab = tr[\"M (h)\"] * esc[\"C_labor\"]\n    otros = tr[\"Y (€)\"] - fuel - lab\n    if esc.get(\"externalizar\"):\n        prem = tr[\"Ruta\"] == \"Premium\"\n        fuel = np.where(prem, 0, fuel); lab = np.where(prem, 0, lab); otros = tr[\"Y (€)\"] - fuel - lab\n    fig, ax = plt.subplots(figsize=(9, 3.6))\n    x = tr[\"Entrega\"]\n    ax.bar(x, fuel, color=COLOR_TERM[0], width=0.8, label=\"combustible\")\n    ax.bar(x, lab, bottom=fuel, color=COLOR_TERM[1], width=0.8, label=\"mano de obra\")\n    ax.bar(x, otros, bottom=fuel + lab, color=COLOR_TERM[2], width=0.8, label=\"peaje / externalización\")\n    for r in fx.RUTAS:\n        mk = tr[\"Ruta\"] == fx.NOMBRE_RUTA[r]\n        ax.plot(x[mk], np.full(mk.sum(), -4), \"s\", color=COLOR_RUTA[r], ms=5, label=f\"ruta {fx.NOMBRE_RUTA[r]}\")\n    ax.set_xlabel(\"entrega simulada\"); ax.set_ylabel(\"€\")\n    ax.set_title(titulo or f\"Funcionamiento simulado · primeras {len(tr)} entregas\")\n    ax.legend(loc=\"upper center\", bbox_to_anchor=(0.5, -0.17), ncol=6, fontsize=7.5)\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- bloque B\ndef fig_hist_dias(tB, dias, presupuesto, titulo=None):\n    d = np.asarray(dias)\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    ax.hist(d, bins=35, density=True, color=CON, alpha=0.45, edgecolor=\"white\", label=\"días simulados\")\n    xx = np.linspace(min(d.min(), tB[\"dia_con\"] - 4 * tB[\"sd_dia_con\"]), max(d.max(), presupuesto * 1.02), 300)\n    ax.plot(xx, np.exp(-0.5 * ((xx - tB[\"dia_con\"]) / tB[\"sd_dia_con\"]) ** 2) / (tB[\"sd_dia_con\"] * math.sqrt(2 * math.pi)),\n            color=TEXTO, lw=2, label=\"teórica (aprox. normal)\")\n    ax.axvline(tB[\"dia_con\"], color=CON, ls=\"--\", lw=1.4, label=f\"E = {fx.eur(tB['dia_con'])}\")\n    ax.axvline(tB[\"P95\"], color=SERIES[3], ls=\"-.\", lw=1.4, label=f\"P95 = {fx.eur(tB['P95'])}\")\n    ax.axvline(tB[\"CVaR\"], color=SERIES[6], ls=\":\", lw=1.6, label=f\"CVaR 5 % = {fx.eur(tB['CVaR'])}\")\n    ax.axvline(presupuesto, color=CRITICO, lw=1.6, label=f\"presupuesto {fx.eur(presupuesto)}\")\n    ax.xaxis.set_major_formatter(_EUR0)\n    ax.set_xlabel(\"coste diario con tráfico (€)\"); ax.set_ylabel(\"densidad\")\n    ax.set_title(titulo or f\"Coste diario · {fx.num(len(d), 0)} días simulados\")\n    ax.legend(loc=\"upper left\", fontsize=7.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_franjas(tB, resB, titulo=None):\n    fr = tB[\"franjas\"]\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(10, 3.4), gridspec_kw={\"width_ratios\": [1.5, 1]})\n    x = np.arange(3)\n    a1.bar(x - 0.2, [fr[f][\"Ysin\"] for f in fx.FRANJAS], width=0.4, color=SIN, label=\"sin tráfico\")\n    a1.bar(x + 0.2, [fr[f][\"Ycon\"] for f in fx.FRANJAS], width=0.4, color=CON, label=\"con tráfico\")\n    s = [resB.loc[f\"E(Y_con) por pedido · {f} (€)\", \"Simulado · media\"] for f in fx.FRANJAS]\n    a1.plot(x + 0.2, s, \"D\", color=TEXTO, ms=5, label=\"simulado (con tráfico)\")\n    for i, f in enumerate(fx.FRANJAS):\n        a1.text(i + 0.2, fr[f][\"Ycon\"], f\"+{fx.num(fr[f]['delta'], 2)}\", ha=\"center\", va=\"bottom\", fontsize=8, color=CON)\n    a1.set_xticks(x); a1.set_xticklabels(fx.FRANJAS); a1.set_ylabel(\"€ por pedido\")\n    a1.set_title(\"Coste medio por pedido y sobrecoste (+) por franja\", fontsize=9.5)\n    a1.set_ylim(0, max(fr[f][\"Ycon\"] for f in fx.FRANJAS) * 1.25)\n    a1.legend(loc=\"upper left\", fontsize=7.5)\n    v = [fr[f][\"cuota_sobre\"] for f in fx.FRANJAS]\n    a2.bar(x, v, color=[COLOR_FRANJA[f] for f in fx.FRANJAS], width=0.6)\n    for i, y in enumerate(v):\n        a2.text(i, y, fx.pct(y, 1), ha=\"center\", va=\"bottom\", fontsize=8.5)\n    a2.set_xticks(x); a2.set_xticklabels(fx.FRANJAS); a2.yaxis.set_major_formatter(_PCT)\n    a2.set_ylim(0, max(max(v), 0.01) * 1.2)\n    a2.set_title(\"Cuota del sobrecoste diario\", fontsize=9.5)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_horas(com, tB, titulo=None):\n    \"\"\"Perfil horario teórico: pedidos esperados por hora y coste esperado por hora con y sin tráfico.\"\"\"\n    h = np.arange(24)\n    fran = [fx.HORAS_FRANJA[i] for i in h]\n    lam = np.array([float(com[\"lambda\"][f]) for f in fran])\n    ycon = np.array([tB[\"franjas\"][f][\"Ycon\"] for f in fran]); ysin = np.array([tB[\"franjas\"][f][\"Ysin\"] for f in fran])\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    ax.bar(h, lam * ysin, color=SIN, width=0.8, label=\"coste sin tráfico\")\n    ax.bar(h, lam * (ycon - ysin), bottom=lam * ysin, color=CON, width=0.8, label=\"sobrecoste por tráfico\")\n    for i in h:\n        ax.text(i, -60, fran[i][0], ha=\"center\", va=\"top\", fontsize=7, color=COLOR_FRANJA[fran[i]])\n    ax.yaxis.set_major_formatter(_EUR0)\n    ax.set_xticks(h); ax.set_xlabel(\"hora del día (V = Valle, L = Llano, P = Punta)\"); ax.set_ylabel(\"€ por hora\")\n    ax.set_title(titulo or \"Coste esperado por hora del día (λ_h · coste medio por pedido)\")\n    ax.legend(loc=\"upper left\", fontsize=8)\n    ax.set_ylim(-200, (lam * ycon).max() * 1.15)\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- comparativas\ndef fig_comparativa(res, com):\n    nombres = list(res)\n    cols = [color_escenario(i) for i in range(len(nombres))]\n    fig, axs = plt.subplots(1, 4, figsize=(12.5, 4.0))\n    x = np.arange(len(nombres))\n    A = [res[n][\"teoria\"][\"A\"] for n in nombres]; B = [res[n][\"teoria\"][\"B\"] for n in nombres]\n    vals = [a[\"EY\"] for a in A]\n    axs[0].bar(x, vals, color=cols, width=0.65)\n    for i, v in enumerate(vals):\n        axs[0].text(i, v, fx.num(v, 2), ha=\"center\", va=\"bottom\", fontsize=7.5)\n    lo, hi = min(vals), max(vals); m = (hi - lo) or 1\n    axs[0].set_ylim(lo - 1.2 * m, hi + 0.5 * m)\n    axs[0].set_title(\"E(Y) por entrega (€)\", fontsize=9)\n    vals = [a[\"Pcola\"] for a in A]\n    axs[1].bar(x, vals, color=cols, width=0.65)\n    for i, v in enumerate(vals):\n        axs[1].text(i, v, fx.num(100 * v, 2), ha=\"center\", va=\"bottom\", fontsize=7.5)\n    axs[1].yaxis.set_major_formatter(_PCT); axs[1].set_ylim(0, max(vals) * 1.25)\n    axs[1].set_title(f\"P(Y > {fx.num(com['umbral_Y'], 0)} €)\", fontsize=9)\n    s_ = [b[\"dia_sin\"] for b in B]; d_ = [b[\"dia_delta\"] for b in B]\n    axs[2].bar(x, s_, color=SIN, width=0.65, label=\"sin tráfico\")\n    axs[2].bar(x, d_, bottom=s_, color=CON, width=0.65, label=\"sobrecoste\")\n    for i in x:\n        axs[2].text(i, s_[i] + d_[i], fx.num((s_[i] + d_[i]) / 1000, 1) + \"k\", ha=\"center\", va=\"bottom\", fontsize=7.5)\n    axs[2].yaxis.set_major_formatter(_EUR0); axs[2].set_ylim(0, max(a + b for a, b in zip(s_, d_)) * 1.18)\n    axs[2].set_title(\"Coste diario esperado (€)\", fontsize=9); axs[2].legend(fontsize=7, loc=\"lower right\")\n    vals = [b[\"Ppres\"] for b in B]\n    axs[3].bar(x, vals, color=cols, width=0.65)\n    for i, v in enumerate(vals):\n        axs[3].text(i, v, fx.num(100 * v, 2), ha=\"center\", va=\"bottom\", fontsize=7.5)\n    axs[3].yaxis.set_major_formatter(mticker.PercentFormatter(1.0, decimals=1))\n    axs[3].set_ylim(0, max(max(vals), 0.001) * 1.25)\n    axs[3].set_title(f\"P(coste diario > {fx.num(com['presupuesto'] / 1000, 0)}k €)\", fontsize=9)\n    for ax in axs:\n        _etiquetas(ax, nombres)\n    fig.text(0.5, 0.005, \"El eje de E(Y) no empieza en 0 para que se aprecien las diferencias.\", ha=\"center\", fontsize=7.5,\n             color=TEXTO2)\n    fig.tight_layout(rect=(0, 0.03, 1, 1))\n    return fig\n\n\ndef fig_ahorros(dif, titulo=None):\n    \"\"\"Ahorro diario frente al escenario base (teórico, simulado con IC95 % pareado) y ahorro neto de implantación.\"\"\"\n    nombres = list(dif.index)\n    x = np.arange(len(nombres))\n    teo = dif[\"Ahorro diario · teórico (€)\"].to_numpy(float)\n    sim = dif[\"Ahorro diario · simulado (€)\"].to_numpy(float)\n    ic = np.array([list(v) for v in dif[\"IC95 ahorro diario (€)\"]])\n    neto = dif[\"Ahorro diario neto · teórico (€)\"].to_numpy(float)\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    ax.bar(x - 0.18, teo, width=0.36, color=[BUENO if v >= 0 else CRITICO for v in teo], alpha=0.8, label=\"teórico\")\n    ax.bar(x + 0.18, neto, width=0.36, color=SERIES[0], alpha=0.6, label=\"neto de implantación (teórico)\")\n    ax.errorbar(x - 0.18, sim, yerr=[sim - ic[:, 0], ic[:, 1] - sim], fmt=\"D\", color=TEXTO, ms=5, capsize=3,\n                label=\"simulado ± IC95 % (pareado)\")\n    for i, v in enumerate(teo):\n        ax.text(i - 0.18, v, fx.num(v, 0), ha=\"center\", va=\"bottom\" if v >= 0 else \"top\", fontsize=7.5)\n    ax.axhline(0, color=TEXTO2, lw=1)\n    ax.yaxis.set_major_formatter(_EUR0)\n    _etiquetas(ax, nombres)\n    ax.set_ylabel(\"€ por día\")\n    ax.set_title(titulo or \"Ahorro diario frente al escenario base\")\n    ax.legend(loc=\"best\", fontsize=7.5)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_validacion(res, com):\n    nombres = list(res)\n    u = fx.num(com[\"umbral_Y\"], 0)\n    kA = [(\"Coste esperado E(Y) (€)\", \"E(Y)\"), (f\"P(Y > {u} €)\", \"P(Y>umbral)\"), (\"Percentil 90 de Y (€)\", \"P90\")]\n    kB = [(\"Coste diario esperado con tráfico (€)\", \"coste diario\"), (\"Sobrecoste diario por tráfico (€)\", \"sobrecoste\"),\n          (\"Percentil 95 del coste diario (€) · aprox. normal\", \"P95 diario\")]\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    ks = kA + kB\n    ancho = 0.8 / len(nombres)\n    for i, n in enumerate(nombres):\n        v = []\n        for k, _ in ks:\n            tab = res[n][\"resA\"] if (k, _) in kA else res[n][\"resB\"]\n            e = tab.loc[k, \"Error relativo\"]\n            v.append(0.0 if e is None or e != e else 100 * e)\n        ax.bar(np.arange(len(ks)) + i * ancho - 0.4 + ancho / 2, v, width=ancho * 0.9, color=color_escenario(i), label=n)\n    ax.axhline(0, c=TEXTO2, lw=1)\n    ax.set_xticks(range(len(ks))); ax.set_xticklabels([e for _, e in ks], fontsize=8.5)\n    ax.set_ylabel(\"error relativo (%)\")\n    ax.set_title(\"Validación: error relativo de la simulación frente a la teoría\")\n    ax.legend(fontsize=7, ncol=min(3, len(nombres)))\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- O2.2 · O3.1\ndef fig_sens_econ(df, elas, titulo=None):\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(10, 3.5), gridspec_kw={\"width_ratios\": [2, 1]})\n    for i, (par, d) in enumerate(df.groupby(\"Parámetro\", sort=False)):\n        base = d.loc[d[\"Variación\"].abs().idxmin(), \"Teórico · Var(Y)\"]\n        a1.plot(100 * d[\"Variación\"], d[\"Teórico · Var(Y)\"] / base, \"-\", color=SERIES[i], lw=2, label=f\"{par} (teórico)\")\n        a1.plot(100 * d[\"Variación\"], d[\"Simulado · Var(Y)\"] / base, \"o\", color=SERIES[i], ms=5)\n    a1.axhline(1, color=TEXTO2, lw=0.8)\n    a1.set_xlabel(\"variación del parámetro (%)\"); a1.set_ylabel(\"Var(Y) relativa al escenario\")\n    a1.set_title(\"Var(Y) al variar cada parámetro (puntos: simulado)\", fontsize=9.5)\n    a1.legend(fontsize=7.5)\n    nombres = list(elas); v = [elas[k] for k in nombres]\n    a2.barh(nombres, v, color=SERIES[:len(v)], height=0.55)\n    for i, y in enumerate(v):\n        a2.text(y, i, \"  \" + fx.num(y, 2), va=\"center\", fontsize=8.5)\n    a2.invert_yaxis(); a2.set_xlim(0, max(v) * 1.35 if max(v) > 0 else 1)\n    a2.set_title(\"Elasticidad de Var(Y)\", fontsize=9.5)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_optimizacion(opt, titulo=None):\n    \"\"\"Símplex de probabilidades (p_Urbana, p_Regional): E(Y) por niveles, región factible y solución.\"\"\"\n    mu = np.array(opt[\"mu_teo\"])\n    g = np.linspace(0, 1, 201)\n    p1, p2 = np.meshgrid(g, g, indexing=\"ij\")\n    p3 = 1 - p1 - p2\n    E = np.where(p3 >= 0, p1 * mu[0] + p2 * mu[1] + np.clip(p3, 0, 1) * mu[2], np.nan)\n    fig, ax = plt.subplots(figsize=(7.5, 4.6))\n    cs = ax.contourf(p1, p2, E, levels=20, cmap=\"Blues_r\", alpha=0.8)\n    cb = fig.colorbar(cs, ax=ax); cb.set_label(\"E(Y) teórico (€)\")\n    if opt[\"teo\"] is not None:\n        ax.contour(p1, p2, E, levels=[opt[\"teo\"][\"objetivo\"]], colors=[CRITICO], linewidths=1.8)\n        ax.plot([], [], color=CRITICO, label=f\"E(Y) = {fx.eur(opt['teo']['objetivo'], 2)} (−{fx.pct(opt['reduccion'], 0)})\")\n    ax.plot(opt[\"p0\"][0], opt[\"p0\"][1], \"o\", color=TEXTO, ms=8, label=\"actual p₀\")\n    if opt[\"teo\"] is not None:\n        ax.plot(opt[\"teo\"][\"p\"][0], opt[\"teo\"][\"p\"][1], \"*\", color=SERIES[3], ms=15, mec=TEXTO, label=\"óptimo (teórico)\")\n    if opt[\"sim\"] is not None:\n        ax.plot(opt[\"sim\"][\"p\"][0], opt[\"sim\"][\"p\"][1], \"x\", color=CRITICO, ms=10, mew=2, label=\"óptimo (simulado)\")\n    ax.set_xlabel(\"p Urbana\"); ax.set_ylabel(\"p Regional  (p Premium = 1 − p Urbana − p Regional)\")\n    ax.set_xlim(0, 1); ax.set_ylim(0, 1)\n    ax.set_title(titulo or \"O3.1 · probabilidades de ruta más cercanas a las actuales con un 10 % menos de coste\")\n    ax.legend(loc=\"upper right\", fontsize=8)\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- estimador\ndef fig_sens_convergencia(df, metrica, titulo=None):\n    fig, ax = plt.subplots(figsize=(9, 3.6))\n    x = np.arange(len(df))\n    for i, (_, r) in enumerate(df.iterrows()):\n        ax.plot([i] * len(r[\"Medias por réplica\"]), r[\"Medias por réplica\"], \"o\", color=SERIES[0], alpha=0.3, ms=5)\n    m = df[\"Media de las réplicas\"]\n    ax.errorbar(x, m, yerr=[m - df[\"IC95 inf\"], df[\"IC95 sup\"] - m], fmt=\"o-\", color=SERIES[0], ms=7, capsize=4,\n                label=\"media de las réplicas ± IC95 %\")\n    ax.plot([], [], \"o\", color=SERIES[0], alpha=0.3, label=\"cada réplica\")\n    ax.axhline(df[\"Teórico\"].iloc[0], color=TEXTO, ls=\"--\", lw=1.4, label=f\"teórico {fx.eur(df['Teórico'].iloc[0], 2)}\")\n    ax.set_xticks(x); ax.set_xticklabels([fx.num(v, 0) for v in df.index])\n    ax.yaxis.set_major_formatter(mticker.FuncFormatter(lambda y, _: fx.num(y, 1 if metrica == \"entrega\" else 0)))\n    ax.set_xlabel(\"entregas simuladas\" if metrica == \"entrega\" else \"días simulados\"); ax.set_ylabel(\"€\")\n    ax.set_title(titulo or (\"Convergencia · E(Y) por entrega\" if metrica == \"entrega\" else \"Convergencia · coste diario\"))\n    ax.legend(loc=\"best\", fontsize=8)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_sens_variabilidad(df, metrica, titulo=None):\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    x = np.arange(len(df))\n    v = df[\"σ entre réplicas\"]\n    ax.bar(x, v, color=SERIES[0], width=0.6, label=\"σ entre réplicas (simulada)\")\n    ax.plot(x, df[\"σ teórica del estimador\"], color=TEXTO, marker=\"o\", lw=1.5, label=\"σ teórica del estimador\")\n    for i, y in enumerate(v):\n        ax.text(i, y, fx.num(y, 2 if metrica == \"entrega\" else 0), ha=\"center\", va=\"bottom\", fontsize=8)\n    ax.set_xticks(x); ax.set_xticklabels([fx.num(t, 0) for t in df.index])\n    ax.set_xlabel(\"entregas simuladas\" if metrica == \"entrega\" else \"días simulados\"); ax.set_ylabel(\"€\")\n    ax.set_title(titulo or \"Variabilidad de la estimación entre réplicas\")\n    ax.legend(loc=\"upper right\", fontsize=8)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n",
 "informe.py": "# -*- coding: utf-8 -*-\n\"\"\"Informe Word (.docx) del estudio de caso Fly-Next: coste de una entrega, coste diario con tráfico, escenarios, optimización y sensibilidad.\"\"\"\nimport datetime\nimport io\nimport math\n\nimport numpy as np\nimport pandas as pd\nimport docx\nfrom docx.shared import Pt, Cm, RGBColor\nfrom docx.enum.text import WD_ALIGN_PARAGRAPH\nfrom docx.enum.table import WD_TABLE_ALIGNMENT\nfrom docx.oxml.ns import qn\nfrom docx.oxml import OxmlElement\n\nimport flynext as fx\nfrom flynext import num, pct, eur, fmt_kpi, fmt_res, fmt_dif, fmt_obj\nimport graficos as gr\n\n\ndef _sombrear(celda, color):\n    tcPr = celda._tc.get_or_add_tcPr()\n    shd = OxmlElement(\"w:shd\")\n    shd.set(qn(\"w:val\"), \"clear\"); shd.set(qn(\"w:color\"), \"auto\"); shd.set(qn(\"w:fill\"), color)\n    tcPr.append(shd)\n\n\nANCHO_UTIL_CM = 17.0          # A4 con márgenes de 2 cm\n\n\ndef _cm_por_caracter(pt):\n    return 0.0205 * pt          # anchura media aproximada de un carácter de Calibri\n\n\ndef _anchos(cab, filas, pt):\n    \"\"\"Anchura de cada columna según su contenido; se reparte el ancho útil sin superar la página.\"\"\"\n    nat = []\n    for j, c in enumerate(cab):\n        palabras = max((len(w) for w in str(c).split()), default=1)\n        # los textos largos (con espacios) pueden partirse en varias líneas; los números, no\n        celdas = max((min(len(f[j]), 30) if \" \" in f[j].strip() and len(f[j]) > 30 else len(f[j]) for f in filas),\n                     default=1)\n        nat.append(max(palabras, celdas, 3) * _cm_por_caracter(pt) + 0.3)\n    total = sum(nat)\n    return nat, total\n\n\nclass Informe:\n    \"\"\"Envoltorio sencillo de python-docx con helpers para títulos, párrafos, tablas y figuras.\"\"\"\n\n    def __init__(self, titulo, subtitulo=\"\"):\n        self.doc = docx.Document()\n        sec = self.doc.sections[0]\n        sec.page_width, sec.page_height = Cm(21), Cm(29.7)\n        sec.left_margin = sec.right_margin = Cm(2)\n        sec.top_margin = sec.bottom_margin = Cm(2)\n        estilo = self.doc.styles[\"Normal\"]\n        estilo.font.name = \"Calibri\"; estilo.font.size = Pt(10.5)\n        self.n_tabla, self.n_fig = 0, 0\n        self.doc.add_heading(titulo, level=0)\n        if subtitulo:\n            p = self.doc.add_paragraph(subtitulo); p.runs[0].italic = True\n\n    def h(self, texto, nivel=1):\n        self.doc.add_heading(texto, level=nivel)\n\n    def p(self, texto, negrita_inicio=None):\n        par = self.doc.add_paragraph()\n        if negrita_inicio and texto.startswith(negrita_inicio):\n            par.add_run(negrita_inicio).bold = True\n            par.add_run(texto[len(negrita_inicio):])\n        else:\n            par.add_run(texto)\n        par.paragraph_format.space_after = Pt(6)\n        return par\n\n    def vinetas(self, items):\n        for it in items:\n            self.doc.add_paragraph(it, style=\"List Bullet\")\n\n    def tabla(self, df, titulo, formato=None, indice=True, ancho_fuente=9, nombre_indice=\"\"):\n        \"\"\"Tabla con anchos de columna calculados para que quepa siempre en el ancho de la página: si el contenido\n        no cabe se reduce la letra (hasta 7 pt) y se reparten las columnas proporcionalmente.\"\"\"\n        self.n_tabla += 1\n        cap = self.doc.add_paragraph()\n        cap.add_run(f\"Tabla {self.n_tabla}. {titulo}\").bold = True\n        cap.paragraph_format.keep_with_next = True\n        cols = list(df.columns)\n        cab = ([nombre_indice or (df.index.name or \"\")] if indice else []) + [str(c) for c in cols]\n        filas = []\n        for idx, fila in df.iterrows():\n            filas.append(([num(idx, 0) if isinstance(idx, (int, np.integer)) else str(idx)] if indice else []) +\n                         [formato(idx, c, fila[c]) if formato else _fmt(fila[c]) for c in cols])\n        pt = ancho_fuente\n        nat, total = _anchos(cab, filas, pt)\n        while total > ANCHO_UTIL_CM and pt > 7:\n            pt -= 0.5\n            nat, total = _anchos(cab, filas, pt)\n        anchos = [w * ANCHO_UTIL_CM / total for w in nat] if total > ANCHO_UTIL_CM else \\\n                 [w * min(ANCHO_UTIL_CM / total, 1.6) for w in nat]\n        t = self.doc.add_table(rows=1, cols=len(cab))\n        t.style = \"Table Grid\"; t.alignment = WD_TABLE_ALIGNMENT.CENTER\n        t.autofit = False\n        tblPr = t._tbl.tblPr\n        lay = OxmlElement(\"w:tblLayout\"); lay.set(qn(\"w:type\"), \"fixed\"); tblPr.append(lay)\n        # la fila de cabecera se repite si la tabla continúa en otra página\n        trPr = t.rows[0]._tr.get_or_add_trPr()\n        rep = OxmlElement(\"w:tblHeader\"); rep.set(qn(\"w:val\"), \"true\"); trPr.append(rep)\n        for j, col in enumerate(t.columns):          # rejilla de la tabla (la que usan Word y LibreOffice)\n            col.width = Cm(anchos[j])\n        for j, c in enumerate(cab):\n            cel = t.rows[0].cells[j]; cel.text = \"\"; cel.width = Cm(anchos[j])\n            r = cel.paragraphs[0].add_run(str(c)); r.bold = True; r.font.size = Pt(pt)\n            r.font.color.rgb = RGBColor(0xFF, 0xFF, 0xFF)\n            if j > 0 or not indice:\n                cel.paragraphs[0].alignment = WD_ALIGN_PARAGRAPH.RIGHT\n            _sombrear(cel, \"2F5496\")\n        for i, vals in enumerate(filas):\n            celdas = t.add_row().cells\n            for j, v in enumerate(vals):\n                celdas[j].text = \"\"; celdas[j].width = Cm(anchos[j])\n                r = celdas[j].paragraphs[0].add_run(v); r.font.size = Pt(pt)\n                if j > 0 or not indice:\n                    celdas[j].paragraphs[0].alignment = WD_ALIGN_PARAGRAPH.RIGHT\n                if i % 2 == 1:\n                    _sombrear(celdas[j], \"EAF0F8\")\n        self.doc.add_paragraph()\n\n    def figura(self, fig, titulo, ancho_cm=16.5):\n        self.n_fig += 1\n        self.doc.add_picture(gr.fig_a_png(fig), width=Cm(ancho_cm))\n        self.doc.paragraphs[-1].alignment = WD_ALIGN_PARAGRAPH.CENTER\n        self.doc.paragraphs[-1].paragraph_format.keep_with_next = True\n        cap = self.doc.add_paragraph(); cap.alignment = WD_ALIGN_PARAGRAPH.CENTER\n        r = cap.add_run(f\"Figura {self.n_fig}. {titulo}\"); r.italic = True; r.font.size = Pt(9)\n\n    def salto(self):\n        self.doc.add_page_break()\n\n    def guardar(self):\n        buf = io.BytesIO()\n        self.doc.save(buf)\n        return buf.getvalue()\n\n\ndef _fmt(v):\n    if isinstance(v, (bool, np.bool_)):\n        return \"Sí\" if v else \"No\"\n    if v is None:\n        return \"—\"\n    if isinstance(v, (int, np.integer)):\n        return num(v, 0)\n    if isinstance(v, (float, np.floating)):\n        return \"—\" if math.isnan(v) else num(v, 3)\n    return str(v)\n\n\ndef _sub(df, filas):\n    return df.loc[[f for f in filas if f in df.index]]\n\n\ndef filas_A_global(umbral):\n    u = num(umbral, 0)\n    return [\"Coste esperado E(Y) (€)\", \"Desviación típica σ(Y) (€)\", f\"P(Y > {u} €)\", \"Percentil 90 de Y (€)\"]\n\n\ndef tabla_A_rutas(t, resA, umbral):\n    \"\"\"O1.3 por ruta: teórico y simulado (media de las réplicas) en una tabla compacta.\"\"\"\n    u = num(umbral, 0)\n    pr = t[\"A\"][\"por_ruta\"]\n    filas = {}\n    for r in fx.RUTAS:\n        nr = fx.NOMBRE_RUTA[r]\n        g = lambda k: resA.loc[k, \"Simulado · media\"]\n        filas[nr] = {\"p\": pr[r][\"p\"], \"Teórico · E(Y)\": pr[r][\"EY\"], \"Simulado · E(Y)\": g(f\"E(Y | {nr}) (€)\"),\n                     f\"Teórico · P(Y > {u})\": pr[r][\"Pcola\"], f\"Simulado · P(Y > {u})\": g(f\"P(Y > {u} € | {nr})\"),\n                     \"Teórico · CV\": pr[r][\"CV\"], \"Simulado · CV\": g(f\"CV(Y | {nr})\"),\n                     \"Teórico · peso en la cola\": pr[r][\"peso_cola\"],\n                     \"Simulado · peso en la cola\": g(f\"Peso de {nr} en la cola Y > {u} €\")}\n    return pd.DataFrame(filas).T\n\n\ndef fmt_rutas(fila, col, v):\n    if col == \"p\" or \"P(\" in col or \"peso\" in col:\n        return pct(v, 2)\n    if \"CV\" in col:\n        return num(v, 3)\n    return eur(v, 2)\n\n\ndef tabla_franjas(t, resB):\n    fr = t[\"B\"][\"franjas\"]\n    filas = {}\n    for f in fx.FRANJAS:\n        g = lambda k: resB.loc[k, \"Simulado · media\"]\n        filas[f] = {\"Pedidos/día\": fr[f][\"n\"], \"Teórico · E(Y_sin)\": fr[f][\"Ysin\"], \"Teórico · E(Y_con)\": fr[f][\"Ycon\"],\n                    \"Simulado · E(Y_con)\": g(f\"E(Y_con) por pedido · {f} (€)\"), \"Teórico · E(Δ)\": fr[f][\"delta\"],\n                    \"Simulado · E(Δ)\": g(f\"E(Δ) sobrecoste por pedido · {f} (€)\"),\n                    \"Teórico · cuota del sobrecoste\": fr[f][\"cuota_sobre\"],\n                    \"Simulado · cuota del sobrecoste\": g(f\"Cuota del sobrecoste diario · {f}\")}\n    return pd.DataFrame(filas).T\n\n\ndef fmt_franjas(fila, col, v):\n    if \"cuota\" in col:\n        return pct(v, 1)\n    if \"Pedidos\" in col:\n        return num(v, 1)\n    return eur(v, 2)\n\n\ndef tabla_extras_B(t, mcB, com):\n    B = t[\"B\"]\n    req = t[\"r_equilibrio\"]\n    filas = {\n        \"Pedidos por día: Poisson(Σλ) (O8.1)\": f\"Poisson({num(B['pedidos_poisson'], 0)}): media y varianza {num(B['pedidos_poisson'], 0)}\",\n        \"Capacidad para una hora Punta con prob. ≥ 95 % (O6.1)\": f\"{num(B.get('cap95_hora', 0), 0)} pedidos/hora\",\n        \"Capacidad para todas las horas Punta del día con prob. ≥ 95 %\": f\"{num(B.get('cap95_dia', 0), 0)} pedidos/hora\",\n        \"Pedidos rechazados por día con la capacidad fijada (O6.3)\": (f\"{num(B['rechazados'], 2)} (capacidad {num(com['capacidad'], 0)} pedidos/hora)\"\n                                                                     if com.get(\"capacidad\") else \"sin límite de capacidad\"),\n        \"Var(Δ) por pedido · diseño pareado (O8.4)\": f\"{num(B['var_pareada'], 1)} teórico · {num(mcB['var_pareada'], 1)} simulado\",\n        \"Var(Y_con) + Var(Y_sin) · diseño independiente\": f\"{num(B['var_independiente'], 1)} teórico · {num(mcB['var_independiente'], 1)} simulado\",\n        \"Reducción de varianza del diseño pareado\": f\"× {num(B['var_independiente'] / B['var_pareada'], 1)}\" if B[\"var_pareada\"] > 0 else \"—\",\n        \"Reducción del factor de retraso en Punta que iguala Punta y Llano (O5.3)\": pct(req, 1) if req is not None and 0 <= req <= 1 else \"no alcanzable con 0–100 %\",\n    }\n    return pd.DataFrame({\"Valor\": filas})\n\n\ndef fmt_sens(fila, col, v):\n    if col == \"Error relativo\":\n        return pct(v, 3)\n    return eur(v, 2)\n\n\ndef tabla_sens(df):\n    return df.drop(columns=[\"Medias por réplica\"])\n\n\ndef tabla_sens_econ(df):\n    d = df.copy()\n    d[\"Variación\"] = d[\"Variación\"].map(lambda v: f\"{'+' if v > 0 else ''}{num(100 * v, 0)} %\")\n    d = d.set_index([\"Parámetro\", \"Variación\"])\n    return d\n\n\ndef fmt_sens_econ(fila, col, v):\n    if col == \"Valor\":\n        return num(v, 2)\n    if \"Var\" in col:\n        return num(v, 1)\n    return eur(v, 2)\n\n\ndef generar_informe(res, com, aj, base, opt=None, sens_econ=None, sens_est=None, titulo=\"Optimización de costes en Fly-Next\"):\n    inf = Informe(titulo, f\"Informe generado automáticamente el {datetime.datetime.now():%d/%m/%Y %H:%M} · coste de una \"\n                          \"entrega por composición, coste diario con franjas de tráfico, escenarios, optimización y sensibilidad\")\n    u = com[\"umbral_Y\"]\n    # 1. Planteamiento\n    inf.h(\"1. Planteamiento y parámetros\", 1)\n    inf.p(\"Bloque A · coste de una entrega. Cada paquete se asigna a una ruta T (Urbana, Regional o Premium) y, \"\n          \"condicionadas a la ruta, se simulan de forma independiente la distancia D, el consumo G y el retraso M \"\n          \"(método de composición, por transformada inversa). El coste es Y = D·G·P_fuel + M·C_labor + peaje(D), con \"\n          \"peaje(D) = K·I{D > umbral} + t·(D − umbral)⁺ (en el modelo actual t = 0).\")\n    dist = pd.DataFrame({fx.NOMBRE_RUTA[r]: {\n        \"Distancia D (km)\": (f\"Poisson(λ = {num(com['D'][r]['mu'], 1)})\" if com[\"D\"][r][\"tipo\"] == \"poisson\"\n                             else f\"N(μ = {num(com['D'][r]['mu'], 1)}; σ = {num(com['D'][r]['sd'], 1)})\"),\n        \"Consumo G (L/km)\": f\"U({num(com['G'][r][0], 3)}; {num(com['G'][r][1], 3)})\",\n        \"Retraso M (h)\": f\"Exp(media = {num(com['M'][r], 2)})\"} for r in fx.RUTAS})\n    inf.tabla(dist, \"Distribuciones condicionadas a la ruta\", nombre_indice=\"Variable\", formato=lambda f, c, v: v)\n    inf.p(\"Bloque B · franjas horarias. El día tiene 24 horas asignadas a tres franjas; en cada hora llegan \"\n          \"N_h ~ Poisson(λ_franja) pedidos. El tráfico multiplica el retraso y el consumo de cada pedido según la franja \"\n          \"y la ruta. Y_con e Y_sin se calculan con las mismas D, G, M (simulación pareada, números aleatorios comunes) y \"\n          \"Δ = Y_con − Y_sin es el sobrecoste por tráfico.\")\n    fran = pd.DataFrame({f: {\"Horas/día\": num(sum(1 for h in range(24) if fx.HORAS_FRANJA[h] == f), 0),\n                             \"λ (pedidos/hora)\": num(com[\"lambda\"][f], 1),\n                             \"Factor de retraso (U / R / P)\": \" / \".join(num(com[\"f_retraso\"][f][r], 2) for r in fx.RUTAS),\n                             \"Factor de consumo (U / R / P)\": \" / \".join(num(com[\"f_consumo\"][f][r], 2) for r in fx.RUTAS)}\n                         for f in fx.FRANJAS})\n    inf.tabla(fran, \"Franjas horarias, llegadas y factores de tráfico\", nombre_indice=\"Parámetro\", formato=lambda f, c, v: v)\n    esc = pd.DataFrame({n: {\"p (U / R / P)\": \" / \".join(num(x, 2) for x in r[\"teoria\"][\"A\"][\"p\"]),\n                            \"P_fuel / C_labor\": f\"{num(r['esc']['P_fuel'], 2)} / {num(r['esc']['C_labor'], 1)}\",\n                            \"K / t (€/km)\": f\"{num(r['esc']['K'], 0)} / {num(r['esc']['tarifa_km'], 2)}\",\n                            \"×G proveedor\": num(r[\"esc\"][\"factor_G\"], 2),\n                            \"Urbanos Punta → Valle\": pct(r[\"esc\"][\"desplazar\"], 0),\n                            \"Premium externalizado\": eur(r[\"esc\"][\"coste_ext\"]) if r[\"esc\"][\"externalizar\"] else \"no\",\n                            \"Coste de implantación (€/día)\": eur(r[\"esc\"].get(\"coste_impl\") or 0)}\n                        for n, r in res.items()})\n    inf.tabla(esc, \"Escenarios analizados\", nombre_indice=\"Parámetro\", formato=lambda f, c, v: v)\n    desc = [f\"{n}: {r['esc']['descripcion']}\" for n, r in res.items() if r[\"esc\"].get(\"descripcion\")]\n    if desc:\n        inf.vinetas(desc)\n    ob = com[\"objetivos\"]\n    o = lambda k, f: f(ob[k]) if ob.get(k) is not None else \"no se evalúa\"\n    tc = pd.DataFrame({\"Valor\": {\n        \"Umbral de entrega cara\": eur(u), \"Entregas al año (ahorros anuales)\": num(com[\"entregas_ano\"], 0),\n        \"Presupuesto diario\": eur(com[\"presupuesto\"]),\n        \"Capacidad máxima por hora\": num(com[\"capacidad\"], 0) if com.get(\"capacidad\") else \"sin límite\",\n        \"Objetivo · E(Y) máximo por entrega\": o(\"EY_MAX\", lambda v: eur(v, 2)),\n        \"Objetivo · P(Y > umbral) máxima\": o(\"PCOLA_MAX\", lambda v: pct(v, 1)),\n        \"Objetivo · coste diario máximo\": o(\"DIA_MAX\", lambda v: eur(v)),\n        \"Objetivo · P(coste diario > presupuesto) máxima\": o(\"PPRES_MAX\", lambda v: pct(v, 1)),\n        \"Simulación A · entregas por réplica × réplicas\": f\"{num(aj['nsim'], 0)} × {aj['replicas']} (semillas {aj['semilla']} …)\",\n        \"Simulación B · días por réplica × réplicas\": f\"{num(aj['ndias'], 0)} × {aj['replicas_B']} (semillas {aj['semilla'] + 1000} …)\"}})\n    inf.tabla(tc, \"Parámetros comunes, objetivos y ajustes de simulación\", nombre_indice=\"Parámetro\", formato=lambda f, c, v: v)\n\n    # 2. Síntesis\n    inf.h(\"2. Síntesis y recomendación (O7.1)\", 1)\n    for n, r in res.items():\n        inf.p(fx.texto_escenario(n, r, com), negrita_inicio=n + \":\")\n    inf.p(\"Recomendación: \" + fx.texto_recomendacion(res, base, com), negrita_inicio=\"Recomendación:\")\n    inf.tabla(fx.tabla_comparativa(res, com), \"Comparación de escenarios (filas «Teórico»: fórmulas e integración \"\n              \"numérica; filas «Simulado»: media de las macro-réplicas)\", formato=fmt_kpi, nombre_indice=\"KPI\")\n    inf.tabla(fx.tabla_objetivos(res), \"Cumplimiento de los objetivos (valores teóricos)\", nombre_indice=\"Objetivo\",\n              formato=lambda f, c, v: str(v))\n    inf.figura(gr.fig_comparativa(res, com), \"Coste por entrega, entregas caras, coste diario y riesgo presupuestario por escenario\")\n    dif = fx.diferencias(res, base, com)\n    if dif is not None:\n        inf.p(f\"Ahorros frente a «{base}» (O3.3, O3.4, O5.1 y O5.2). Las diferencias simuladas son pareadas: cada réplica \"\n              \"usa las mismas semillas en todos los escenarios, por lo que el IC95 % del ahorro es mucho más estrecho que \"\n              \"el de cada coste por separado.\")\n        cols_a = [\"Ahorro por entrega · teórico (€)\", \"Ahorro por entrega · simulado (€)\", \"IC95 ahorro por entrega (€)\",\n                  \"Ahorro anual · teórico (€)\", \"Cambio en σ(Y) · teórico (€)\", \"Cambio en P(Y > umbral) · teórico\"]\n        cols_b = [\"Ahorro diario · teórico (€)\", \"Ahorro diario · simulado (€)\", \"IC95 ahorro diario (€)\",\n                  \"Ahorro en sobrecoste diario · teórico (€)\", \"Coste de implantación (€/día)\", \"Ahorro diario neto · teórico (€)\"]\n        inf.tabla(dif[cols_a], f\"Ahorro por entrega y anual ({num(com['entregas_ano'], 0)} entregas) frente a «{base}»\",\n                  formato=fmt_dif, nombre_indice=\"Escenario\")\n        inf.tabla(dif[cols_b], f\"Ahorro diario frente a «{base}» (modelo con franjas)\", formato=fmt_dif, nombre_indice=\"Escenario\")\n        inf.figura(gr.fig_ahorros(dif), f\"Ahorro diario frente a «{base}»: teórico, simulado (IC95 % pareado) y neto de implantación\")\n    inf.figura(gr.fig_validacion(res, com), \"Error relativo de la simulación frente a los valores teóricos\")\n    inf.h(\"Cuadro de mando propuesto (KPIs mensuales para la Dirección)\", 2)\n    inf.tabla(pd.DataFrame({\"Por qué es relevante\": dict(fx.KPIS_CUADRO)}), \"Cuadro de mando conceptual\",\n              nombre_indice=\"KPI\", formato=lambda f, c, v: v)\n\n    # 3. Detalle por escenario\n    sec = 3\n    for n, r in res.items():\n        inf.salto()\n        t = r[\"teoria\"]\n        inf.h(f\"{sec}. Escenario «{n}»\", 1)\n        if r[\"esc\"].get(\"descripcion\"):\n            inf.p(r[\"esc\"][\"descripcion\"])\n        inf.h(f\"{sec}.1 Bloque A · coste de una entrega (O1 y O2.1)\", 2)\n        inf.tabla(_sub(r[\"resA\"], filas_A_global(u)), f\"Coste de una entrega: teórico y simulado con IC95 % · {n}\",\n                  formato=fmt_res, nombre_indice=\"KPI\")\n        inf.tabla(tabla_A_rutas(t, r[\"resA\"], u), f\"Coste por ruta (O1.3) · {n}\", formato=fmt_rutas, nombre_indice=\"Ruta\")\n        inf.figura(gr.fig_hist_Y(t[\"A\"], r[\"mcA\"][\"Y\"], u, f\"Distribución del coste de una entrega · {n}\"),\n                   f\"Coste simulado frente a la distribución teórica (escala logarítmica) · {n}\")\n        inf.figura(gr.fig_por_ruta(t[\"A\"], r[\"resA\"], u, f\"Coste por ruta · {n}\"), f\"Media, cola y variabilidad relativa por ruta · {n}\")\n        filas_d = [f\"Contribución a Var(Y) · {x}\" for x in fx.TERMINOS]\n        inf.tabla(_sub(r[\"resA\"], filas_d), f\"Descomposición de la varianza de Y (O2.1) · {n}\", formato=fmt_res, nombre_indice=\"Término\")\n        inf.figura(gr.fig_descomposicion(t[\"A\"], r[\"resA\"], f\"Descomposición de Var(Y) · {n}\"),\n                   f\"Parte de la varianza del coste atribuible a cada término · {n}\")\n        inf.h(f\"{sec}.2 Bloque B · coste diario con franjas de tráfico (O4, O5.3, O6 y O8)\", 2)\n        filas_b = [k for k in r[\"resB\"].index if \"por pedido\" not in k and \"Cuota\" not in k]\n        inf.tabla(_sub(r[\"resB\"], filas_b), f\"Coste diario: teórico y simulado con IC95 % · {n}\", formato=fmt_res,\n                  nombre_indice=\"KPI\")\n        inf.tabla(tabla_franjas(t, r[\"resB\"]), f\"Coste por pedido y sobrecoste por franja (O4.1 y O5.3) · {n}\",\n                  formato=fmt_franjas, nombre_indice=\"Franja\")\n        inf.figura(gr.fig_hist_dias(t[\"B\"], r[\"mcB\"][\"dias\"][\"Coste con tráfico\"], com[\"presupuesto\"],\n                                    f\"Coste diario · {n}\"),\n                   f\"Coste diario de los días simulados, percentil 95, CVaR 5 % y presupuesto · {n}\")\n        inf.figura(gr.fig_franjas(t[\"B\"], r[\"resB\"], f\"Franjas horarias · {n}\"),\n                   f\"Coste medio por pedido y cuota del sobrecoste por franja · {n}\")\n        inf.figura(gr.fig_horas(com, t[\"B\"], f\"Perfil horario del coste · {n}\"), f\"Coste esperado en cada hora del día · {n}\")\n        inf.tabla(tabla_extras_B(t, r[\"mcB\"], com), f\"Dimensionamiento, diseño pareado y equilibrio de franjas · {n}\",\n                  nombre_indice=\"Indicador\", formato=lambda f, c, v: v)\n        inf.h(f\"{sec}.3 Funcionamiento simulado\", 2)\n        tr = r[\"mcA\"][\"traza\"]\n        e1 = fx.una_entrega(com, r[\"esc\"], float(tr[\"U_T\"].iloc[0]), 0.5, 0.5, 0.5, \"Punta\")\n        inf.figura(gr.fig_mecanismo(t[\"A\"][\"p\"], float(tr[\"U_T\"].iloc[0]), e1[\"sin\"], e1[\"con\"],\n                                    f\"Composición · una entrega en hora Punta · {n}\"),\n                   f\"Ruta elegida con U_T = {num(float(tr['U_T'].iloc[0]), 2)} y coste por términos con U_D = U_G = U_M = 0,5 · {n}\")\n        inf.figura(gr.fig_traza_A(tr, r[\"esc\"], f\"Primeras {len(tr)} entregas · {n}\"),\n                   f\"Coste por términos y ruta de las primeras {len(tr)} entregas simuladas · {n}\")\n        sec += 1\n\n    if opt is not None:\n        inf.salto()\n        inf.h(f\"{sec}. Optimización de las probabilidades de ruta (O3.1)\", 1)\n        inf.p(f\"Problema: minimizar ‖p − p₀‖² sujeto a Σ pⱼ·μⱼ ≤ (1 − {num(opt['reduccion'], 2)})·Σ p₀ⱼ·μⱼ, Σ pⱼ = 1 y pⱼ ≥ 0, \"\n              \"con μⱼ = E(Y | T = j) y sin cambiar las distribuciones condicionadas. Como E(Y) es lineal en p, la región \"\n              \"factible es un semiplano del símplex; se resuelve sobre una rejilla de paso 0,001 con las medias teóricas y \"\n              \"con las estimadas por simulación, y la solución simulada se verifica re-simulando con las mismas semillas.\")\n        filas = {}\n        for k_, et in ((\"teo\", \"Con medias teóricas\"), (\"sim\", \"Con medias simuladas\")):\n            s = opt[k_]\n            if s is None:\n                filas[et] = {\"p (U / R / P)\": \"no factible\", \"E(Y) objetivo\": \"—\", \"E(Y) con p*\": \"—\", \"Distancia a p₀\": \"—\"}\n            else:\n                filas[et] = {\"p (U / R / P)\": \" / \".join(num(x, 3) for x in s[\"p\"]), \"E(Y) objetivo\": eur(s[\"objetivo\"], 2),\n                             \"E(Y) con p*\": eur(s[\"E\"], 2), \"Distancia a p₀\": num(s[\"distancia\"], 3)}\n        if opt.get(\"verif\"):\n            v = opt[\"verif\"]\n            filas[\"Verificación (re-simulación)\"] = {\"p (U / R / P)\": \"p* simulado\", \"E(Y) objetivo\": \"—\",\n                                                     \"E(Y) con p*\": f\"{eur(v['E'], 2)} [{eur(v['lo'], 2)}; {eur(v['hi'], 2)}]\",\n                                                     \"Distancia a p₀\": f\"teórico {eur(v['E_teo'], 2)}\"}\n        inf.tabla(pd.DataFrame(filas).T, \"Solución del problema de optimización\", nombre_indice=\"Cálculo\", formato=lambda f, c, v: v)\n        inf.figura(gr.fig_optimizacion(opt), \"Coste esperado en el símplex de probabilidades, región factible y solución\")\n        sec += 1\n    if sens_econ is not None:\n        df, elas = sens_econ\n        inf.salto()\n        inf.h(f\"{sec}. Sensibilidad de la varianza a los parámetros económicos (O2.2)\", 1)\n        mayor = max(elas, key=elas.get)\n        inf.p(\"Se varía cada parámetro económico manteniendo fijos los demás. La elasticidad es la variación porcentual de \"\n              f\"Var(Y) por cada 1 % de variación del parámetro. El parámetro con mayor impacto es {mayor} \"\n              f\"(elasticidad {num(elas[mayor], 2)}): es donde conviene concentrar los esfuerzos.\")\n        inf.figura(gr.fig_sens_econ(df, elas), \"Var(Y) relativa al variar cada parámetro y elasticidad en el punto base\")\n        inf.tabla(tabla_sens_econ(df), \"Barrido de los parámetros económicos (teórico y simulado con números aleatorios comunes)\",\n                  formato=fmt_sens_econ, nombre_indice=\"Parámetro · variación\")\n        sec += 1\n    if sens_est is not None:\n        df, cfg = sens_est[\"df\"], sens_est[\"cfg\"]\n        inf.salto()\n        inf.h(f\"{sec}. Sensibilidad del estimador Monte Carlo\", 1)\n        inf.p(sens_est[\"texto\"])\n        inf.figura(gr.fig_sens_convergencia(df, cfg[\"metrica\"]), \"Convergencia de la estimación hacia el valor teórico\")\n        inf.figura(gr.fig_sens_variabilidad(df, cfg[\"metrica\"]), \"Variabilidad entre réplicas y σ teórica del estimador\")\n        inf.tabla(tabla_sens(df), \"Barrido del tamaño de la simulación\", formato=fmt_sens, nombre_indice=\"n\")\n        sec += 1\n\n    inf.salto()\n    inf.h(\"Anexo. Metodología\", 1)\n    inf.vinetas([\n        \"Composición: T por transformada inversa sobre (p₁, p₂, p₃); D | T por la inversa de la Poisson o de la normal; \"\n        \"G | T = g₀ + (g₁ − g₀)·U; M | T = −media·ln(1 − U). Cada entrega usa 5 uniformes, de modo que todos los \"\n        \"escenarios comparten los mismos números aleatorios (diferencias pareadas).\",\n        \"Momentos exactos: E(Y | T) = P_fuel·E(D)·E(G) + C_labor·E(M) + E(peaje); Var(Y) y la descomposición por términos \"\n        \"usan E(D²), E[(D − c)⁺], E[D·I(D > c)]… (fórmulas cerradas para la normal y sumas exactas para la Poisson). \"\n        \"La contribución de cada término es Cov(término, Y)/Var(Y) y las contribuciones suman el 100 %.\",\n        \"Distribución de Y: P(Y ≤ y) se integra de forma exacta en G (uniforme) y M (exponencial) y numéricamente en D; de \"\n        \"ella salen P(Y > umbral) y los percentiles teóricos.\",\n        \"Coste diario: suma compuesta de Poisson. E = Σ_h E(N_h)·E(Y_h) y Var = Σ_h [E(N_h)·Var(Y_h) + Var(N_h)·E(Y_h)²]; \"\n        \"su percentil 95, el CVaR 5 % (μ + σ·φ(z₀.₉₅)/0,05) y P(coste > presupuesto) usan la aproximación normal.\",\n        \"Macro-réplicas: cada KPI se calcula en cada réplica (incluidos percentiles, CVaR y probabilidades) y se da la media \"\n        \"de las réplicas con IC95 % de la t de Student.\",\n        \"Material de Javier Morales, equipo IA4LEGOS (CC BY-SA 4.0).\",\n    ])\n    return inf.guardar()\n"
};
    const carga = document.getElementById("carga");
    const raiz = document.getElementById("root");
    new MutationObserver((_, obs) => { if (raiz.childElementCount) { carga.remove(); obs.disconnect(); } })
      .observe(raiz, { childList: true });
    mount(
      {
        requirements: ["numpy", "pandas", "scipy", "matplotlib", "python-docx", "openpyxl"],
        entrypoint: "app.py",
        files: ficheros,
      },
      raiz,
    );
  </script>
