    <h1>🌬️ Simulador del taller de mantenimiento y reacondicionamiento eólico</h1>
    <p>Cargando Python en el navegador e instalando los paquetes (SimPy, pandas, SciPy, matplotlib…).
       La primera vez puede tardar uno o dos minutos; después el navegador lo guarda en caché.</p>
    <div class="barra"><div></div></div>

  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
    const ficheros = {
 "app.py": "# -*- coding: utf-8 -*-\n\"\"\"Simulador del taller de mantenimiento y reacondicionamiento eólico · aplicación Streamlit.\n\nEjecutar con:   streamlit run app.py\n\"\"\"\nimport copy\nimport datetime\nimport io\nimport json\nimport math\nimport os\nimport sys\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\nimport matplotlib.pyplot as plt\n\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\nimport motor                      # noqa: E402\nimport kpis                       # noqa: E402\nimport validacion                 # noqa: E402\nimport graficos as gr             # noqa: E402\nimport informe                    # noqa: E402\n\nst.set_page_config(page_title=\"Simulador · Taller eólico\", page_icon=\"🌬️\", layout=\"wide\")\n\nTIPOS = motor.TIPOS\n# En el navegador (stlite/Pyodide, p. ej. GitHub Pages) no hay procesos paralelos y el cálculo es más lento\nEN_NAVEGADOR = sys.platform == \"emscripten\"\nDESCRIPCIONES = {\n    \"Línea base\": \"Protocolo actualmente vigente.\",\n    \"A · IA predictiva\": \"Mantenimiento predictivo con gemelo digital: −45% de tiempo en Ensayos No Destructivos, \"\n                         \"−35% en Consulta con el Ingeniero de Fiabilidad y mejores decisiones de alcance para \"\n                         \"Grave/Critico (menos baja definitiva y pérdida total). Licencia de 54.000 €/año.\",\n    \"B · Respuesta rápida\": \"Equipo técnico dedicado en exclusiva a las órdenes Critico, con su propia inspección \"\n                            \"técnica inicial. Coste de personal de 46.000 €/año.\",\n    \"C · Contención compartida\": \"Las 4 plazas de Contención de Emergencia pasan a una única bolsa con prioridad \"\n                                 \"Critico > Grave > Leve/Programado. Formación con coste único de 5.000 €.\",\n}\nNOMBRES_ESTACION = {(335, 59): \"Invierno\", (59, 151): \"Primavera\", (151, 243): \"Verano\", (243, 335): \"Otoño\"}\n\n\n# ==============================================================================================\n# Estado de la sesión\n# ==============================================================================================\ndef escenarios_por_defecto():\n    out = {}\n    for nombre, constructor in motor.ESCENARIOS_POR_DEFECTO.items():\n        cfg = constructor()\n        cfg.nombre = nombre\n        cfg.descripcion = DESCRIPCIONES.get(nombre, \"\")\n        out[nombre] = cfg.to_dict()\n    return out\n\n\ndef comunes_por_defecto():\n    param = copy.deepcopy(kpis.PARAM)\n    lleg = motor.llegadas_a_lista(motor.ESTACIONES_ANIO)\n    for r in lleg:\n        r[\"Nombre\"] = NOMBRES_ESTACION.get((r[\"Inicio\"], r[\"Fin\"]), \"\")\n    return {\"llegadas\": lleg, \"param\": param}\n\n\ndef ajustes_por_defecto():\n    return {\"n_sim\": 30, \"dias\": 1825, \"semilla\": 1000, \"warmup\": 60, \"cooldown\": 90,\n            \"paralelo\": not EN_NAVEGADOR, \"n_procesos\": max(1, (os.cpu_count() or 2) - 1)}\n\n\ndef iniciar_estado(forzar=False):\n    ss = st.session_state\n    if forzar or \"escenarios\" not in ss:\n        ss.escenarios = escenarios_por_defecto()\n        ss.comunes = comunes_por_defecto()\n        ss.ajustes = ajustes_por_defecto()\n        ss.version = ss.get(\"version\", 0) + 1\n        ss.esc_activo = \"Línea base\"\n    ss.setdefault(\"resultados\", None)\n    ss.setdefault(\"informe_bytes\", None)\n\n\niniciar_estado()\nss = st.session_state\n\n\ndef clave(*partes):\n    \"\"\"Clave de widget ligada a la versión del estado (al restablecer/importar, los widgets se reinician).\"\"\"\n    return f\"v{ss.version}__\" + \"__\".join(str(p) for p in partes)\n\n\ndef editor(key, factoria, **kw):\n    \"\"\"st.data_editor con datos iniciales estables (se crean una sola vez por clave).\"\"\"\n    k0 = \"ini__\" + key\n    if k0 not in ss:\n        ss[k0] = factoria()\n    return st.data_editor(ss[k0], key=key, **kw)\n\n\ndef _f(x, defecto=None):\n    try:\n        if x is None or (isinstance(x, float) and np.isnan(x)):\n            return defecto\n        return float(x)\n    except (TypeError, ValueError):\n        return defecto\n\n\n# ==============================================================================================\n# Barra lateral: ajustes de simulación, ejecución y gestión de la configuración\n# ==============================================================================================\nwith st.sidebar:\n    st.header(\"⚙️ Simulación\")\n    aj = ss.ajustes\n    aj[\"n_sim\"] = st.number_input(\"Nº de réplicas por escenario\", 1, 1000, aj[\"n_sim\"], key=clave(\"n_sim\"))\n    aj[\"dias\"] = st.number_input(\"Días por réplica\", 365, 36500, aj[\"dias\"], step=365, key=clave(\"dias\"),\n                                 help=\"Con unas 275 órdenes al año, cada réplica cubre varios años para disponer de una \"\n                                      \"muestra suficiente (por defecto 5 años = 1.825 días, como el histórico).\")\n    aj[\"semilla\"] = st.number_input(\"Semilla de inicialización\", 0, 10**9, aj[\"semilla\"], key=clave(\"semilla\"),\n                                    help=\"La réplica i de todos los escenarios usa la semilla + i (números aleatorios \"\n                                         \"comunes), lo que permite comparaciones pareadas.\")\n    c1, c2 = st.columns(2)\n    aj[\"warmup\"] = c1.number_input(\"Calentamiento (días)\", 0, 3650, aj[\"warmup\"], step=10, key=clave(\"warmup\"),\n                                   help=\"Días iniciales descartados (el taller arranca vacío).\")\n    aj[\"cooldown\"] = c2.number_input(\"Cierre (días)\", 0, 3650, aj[\"cooldown\"], step=10, key=clave(\"cooldown\"),\n                                     help=\"Días finales descartados: las órdenes que ingresan en ese periodo no \"\n                                          \"suelen terminar su episodio antes del final de la réplica.\")\n    if EN_NAVEGADOR:\n        aj[\"paralelo\"] = False\n        st.caption(\"🌐 Versión web: las réplicas se ejecutan en tu navegador, una tras otra. Cada réplica de 5 \"\n                   \"años tarda unos segundos; no cierres la pestaña mientras se simula.\")\n    else:\n        aj[\"paralelo\"] = st.checkbox(\"Ejecutar réplicas en paralelo\", aj[\"paralelo\"], key=clave(\"paralelo\"))\n    if aj[\"paralelo\"]:\n        aj[\"n_procesos\"] = st.slider(\"Procesos\", 1, max(1, os.cpu_count() or 1), min(aj[\"n_procesos\"], os.cpu_count() or 1),\n                                     key=clave(\"nproc\"))\n\n    st.divider()\n    nombres = list(ss.escenarios)\n    seleccion = st.multiselect(\"Escenarios a simular\", nombres, default=nombres, key=clave(\"sel\", len(nombres)))\n    ref = st.selectbox(\"Escenario de referencia\", seleccion or nombres,\n                       index=(seleccion or nombres).index(\"Línea base\") if \"Línea base\" in (seleccion or nombres) else 0,\n                       key=clave(\"ref\", len(nombres)), help=\"Base de todas las comparaciones pareadas.\")\n    total_rep = aj[\"n_sim\"] * len(seleccion)\n    st.caption(f\"Se simularán {total_rep} réplicas de {aj['dias']} días en total.\")\n    ejecutar = st.button(\"▶️ Ejecutar simulación\", type=\"primary\", use_container_width=True, disabled=not seleccion)\n\n    st.divider()\n    st.header(\"💾 Configuración\")\n    conf_json = json.dumps({\"version_app\": 1, \"ajustes\": ss.ajustes, \"comunes\": ss.comunes,\n                            \"escenarios\": ss.escenarios}, ensure_ascii=False, indent=1)\n    st.download_button(\"Descargar configuración (JSON)\", conf_json, \"configuracion_urgencias.json\",\n                       \"application/json\", use_container_width=True)\n    fichero = st.file_uploader(\"Cargar configuración (JSON)\", type=\"json\", key=clave(\"upload\"))\n    if fichero is not None and ss.get(\"ultimo_json\") != fichero.file_id:\n        try:\n            datos = json.load(fichero)\n            ss.escenarios = datos[\"escenarios\"]\n            ss.comunes = datos[\"comunes\"]\n            ss.ajustes = {**ajustes_por_defecto(), **datos.get(\"ajustes\", {})}\n            ss.ultimo_json = fichero.file_id\n            ss.version += 1\n            ss.esc_activo = next(iter(ss.escenarios))\n            st.rerun()\n        except Exception as e:\n            st.error(f\"No se pudo cargar el fichero: {e}\")\n    if st.button(\"Restablecer valores por defecto\", use_container_width=True):\n        iniciar_estado(forzar=True)\n        st.rerun()\n\n\n# ==============================================================================================\n# Cabecera\n# ==============================================================================================\nst.title(\"🌬️ Simulador del taller de mantenimiento y reacondicionamiento eólico\")\nst.caption(\"Taller Altavía · gemelo digital (SimPy) del protocolo de operación y mantenimiento de componentes eólicos y de \"\n           \"sus escenarios de mejora (tiempo en días). Configura los parámetros comunes y los de cada escenario, \"\n           \"ejecuta la simulación Monte Carlo desde la barra lateral y genera el informe Word.\")\n\ntab_com, tab_esc, tab_res, tab_inf = st.tabs([\"🌐 Parámetros comunes\", \"🏕️ Escenarios\", \"📊 Resultados\", \"📄 Informe\"])\n\n\n# ==============================================================================================\n# 1) Parámetros comunes\n# ==============================================================================================\nwith tab_com:\n    st.subheader(\"Parámetros comunes a todos los escenarios\")\n    st.caption(\"Estos parámetros (ingresos de órdenes de trabajo, tarifas, costes y SLAs) son los mismos para todos los \"\n               \"escenarios: así las diferencias entre escenarios se deben únicamente a sus cambios de protocolo.\")\n    com = ss.comunes\n    par = com[\"param\"]\n\n    st.markdown(\"#### 🍂 Ingresos por estación del año\")\n    st.caption(\"Tasa de ingresos (órdenes/día) y reparto por perfil (%) en cada periodo del año, indicado por \"\n               \"días del año (0–365). Los periodos deben cubrir el año completo sin solaparse; un periodo con \"\n               \"Inicio > Fin cruza el fin de año (p. ej., Invierno 335 → 59).\")\n    lleg = editor(clave(\"llegadas\"), lambda: pd.DataFrame(\n        [{\"Nombre\": r.get(\"Nombre\", \"\"), **{k: r[k] for k in (\"Inicio\", \"Fin\", \"Tasa\")},\n          **{f\"% {t}\": 100 * r[t] for t in TIPOS}} for r in com[\"llegadas\"]]),\n        num_rows=\"dynamic\", use_container_width=True, hide_index=True,\n        column_config={\"Inicio\": st.column_config.NumberColumn(\"Inicio (día)\", min_value=0, max_value=364, step=1),\n                       \"Fin\": st.column_config.NumberColumn(\"Fin (día)\", min_value=0, max_value=365, step=1),\n                       \"Tasa\": st.column_config.NumberColumn(\"Tasa (ind/día)\", min_value=0.0, step=0.01, format=\"%.3f\"),\n                       **{f\"% {t}\": st.column_config.NumberColumn(f\"% {t}\", min_value=0.0, max_value=100.0, format=\"%.1f\")\n                          for t in TIPOS}})\n    nueva = []\n    for _, r in lleg.dropna(subset=[\"Inicio\", \"Fin\", \"Tasa\"]).iterrows():\n        nueva.append({\"Nombre\": str(r.get(\"Nombre\") or \"\"), \"Inicio\": int(r[\"Inicio\"]), \"Fin\": int(r[\"Fin\"]),\n                      \"Tasa\": float(r[\"Tasa\"]), **{t: _f(r[f\"% {t}\"], 0.0) / 100 for t in TIPOS}})\n    com[\"llegadas\"] = nueva\n    err_lleg = validacion.validar_llegadas(nueva)\n    for e in err_lleg:\n        st.error(e)\n    if not err_lleg:\n        media = sum(r[\"Tasa\"] * ((r[\"Fin\"] - r[\"Inicio\"]) % 365) for r in nueva) / 365\n        st.success(f\"Periodos correctos · ingreso medio de {media:.3f} órdenes/día ({media * 365:.0f} al año).\")\n\n    st.markdown(\"#### 💶 Parámetros económicos\")\n    c1, c2, c3 = st.columns(3)\n    with c1:\n        st.markdown(\"**Tarifa por desenlace y penalización por pérdida total (€)**\")\n        sub = editor(clave(\"tarifa\"), lambda: pd.DataFrame({\n            \"Perfil\": TIPOS,\n            \"Operativo (€)\": [par[\"TARIFA\"][\"Operativo\"][t] for t in TIPOS],\n            \"Baja definitiva (€)\": [par[\"TARIFA\"][\"Baja_Definitiva\"][t] for t in TIPOS],\n            \"Penalización por pérdida total (€)\": [par[\"PEN_PERDIDA\"][t] for t in TIPOS]}),\n            hide_index=True, use_container_width=True, disabled=[\"Perfil\"])\n        par[\"TARIFA\"] = {\"Operativo\": {r[\"Perfil\"]: _f(r[\"Operativo (€)\"], 0.0) for _, r in sub.iterrows()},\n                             \"Baja_Definitiva\": {r[\"Perfil\"]: _f(r[\"Baja definitiva (€)\"], 0.0) for _, r in sub.iterrows()}}\n        par[\"PEN_PERDIDA\"] = {r[\"Perfil\"]: _f(r[\"Penalización por pérdida total (€)\"], 0.0) for _, r in sub.iterrows()}\n        st.markdown(\"**Margen operativo**\")\n        par[\"MARGEN_EXIGIDO\"] = st.number_input(\"Margen exigido (%)\", 0.0, 100.0, 100 * float(par[\"MARGEN_EXIGIDO\"]), 0.5,\n                                                key=clave(\"mexig\"),\n                                                help=\"Límite inferior del objetivo de la dirección del taller (15–20%).\") / 100\n        par[\"PEN_DEMORA\"] = st.number_input(\"Penalización por demora crítica (€ por orden Critico por encima de la latencia del SLA1)\",\n                                            0.0, value=float(par.get(\"PEN_DEMORA\", 0.0)), step=100.0, key=clave(\"pen_demora\"))\n    with c2:\n        st.markdown(\"**Coste por procedimiento realizado (€)**\")\n        cs = editor(clave(\"coste_serv\"), lambda: pd.DataFrame({\"Estación\": list(par[\"COSTE_SERVICIO\"]),\n                                                                \"Coste (€)\": list(par[\"COSTE_SERVICIO\"].values())}),\n                    hide_index=True, use_container_width=True, num_rows=\"dynamic\")\n        par[\"COSTE_SERVICIO\"] = {r[\"Estación\"]: _f(r[\"Coste (€)\"], 0.0) for _, r in cs.iterrows() if r[\"Estación\"]}\n    with c3:\n        st.markdown(\"**Coste por día de estancia (€/día)**\")\n        cd = editor(clave(\"coste_dia\"), lambda: pd.DataFrame({\"Estación\": list(par[\"COSTE_DIA\"]),\n                                                               \"Coste (€/día)\": list(par[\"COSTE_DIA\"].values())}),\n                    hide_index=True, use_container_width=True, num_rows=\"dynamic\")\n        par[\"COSTE_DIA\"] = {r[\"Estación\"]: _f(r[\"Coste (€/día)\"], 0.0) for _, r in cd.iterrows() if r[\"Estación\"]}\n\n    st.markdown(\"#### 🏆 Acuerdos de nivel de servicio (SLAs)\")\n    c1, c2, c3, c4, c5 = st.columns(5)\n    par[\"SLA_LATENCIA_D\"] = c1.number_input(\"SLA1 · latencia máx. Critico (horas)\", 0.5, 240.0,\n                                            par[\"SLA_LATENCIA_D\"] * 24, 0.5, key=clave(\"sla1\")) / 24\n    par[\"SLA_LATENCIA_CUMPL\"] = c1.number_input(\"SLA1 · % órdenes que deben cumplirla\", 1.0, 100.0,\n                                                par[\"SLA_LATENCIA_CUMPL\"] * 100, 1.0, key=clave(\"sla1b\")) / 100\n    par[\"SLA_RATIO_ESPERA\"] = c2.number_input(\"SLA2 · ratio de espera máx. Programado/Leve (%)\", 1.0, 100.0,\n                                              par[\"SLA_RATIO_ESPERA\"] * 100, 1.0, key=clave(\"sla2\")) / 100\n    par[\"SLA_OCUP_CONT\"] = c3.number_input(\"SLA3 · ocupación máx. Contención (%)\", 1.0, 100.0, par[\"SLA_OCUP_CONT\"] * 100, 1.0,\n                                          key=clave(\"sla3\")) / 100\n    par[\"SLA_SIN_CONT\"] = c4.number_input(\"SLA4 · pérdida Sin_Cont máx. Grave/Critico (%)\", 0.0, 100.0, par[\"SLA_SIN_CONT\"] * 100,\n                                         0.1, key=clave(\"sla4\")) / 100\n    par[\"SLA_OPERATIVO\"] = c5.number_input(\"SLA5 · retorno a servicio mínimo (%)\", 0.0, 100.0, par[\"SLA_OPERATIVO\"] * 100,\n                                            1.0, key=clave(\"sla5\")) / 100\n    st.caption(\"SLA6 · margen neto ≥ margen exigido (se define en los parámetros económicos).\")\n\n\n# ==============================================================================================\n# 2) Escenarios\n# ==============================================================================================\ndef tabla_tiempos(cfg_d, horas):\n    \"\"\"Tabla editable de tiempos de servicio. horas=True → estancias (días); False → atención (horas).\"\"\"\n    camas = set(cfg_d[\"BAHIAS_CAPACIDAD\"]) | set(cfg_d[\"BAHIA_ALIAS\"]) | {\"Contencion_Emergencia\"}\n    filas = []\n    for est, por_tipo in cfg_d[\"TIEMPOS_SERVICIO\"].items():\n        larga = est in camas or motor.es_observacion(est)\n        if larga != horas:\n            continue\n        filas.append({\"Estación\": est, **{t: (por_tipo.get(t) if horas else (None if por_tipo.get(t) is None else por_tipo[t] * 24))\n                                          for t in TIPOS}})\n    return pd.DataFrame(filas, columns=[\"Estación\"] + TIPOS)\n\n\ndef tabla_derivacion(cfg_d, estacion):\n    destinos = {}\n    for t, fila in cfg_d[\"PROB_DERIVACION\"].get(estacion, {}).items():\n        for dest, p in fila.items():\n            destinos.setdefault(dest, {})[t] = 100 * p\n    return pd.DataFrame([{\"Destino\": d, **{t: v.get(t) for t in TIPOS}} for d, v in destinos.items()],\n                        columns=[\"Destino\"] + TIPOS)\n\n\ndef editar_escenario(nombre):\n    d = ss.escenarios[nombre]\n    k = lambda *p: clave(\"esc\", nombre, *p)\n    errores, avisos = validacion.validar_config(motor.Config.from_dict(d))\n    if errores:\n        st.error(f\"La configuración tiene {len(errores)} error(es): revisa la pestaña «Validación».\")\n    elif avisos:\n        st.warning(f\"Configuración válida con {len(avisos)} aviso(s).\")\n    else:\n        st.success(\"Configuración válida.\")\n\n    t_gen, t_rec, t_cont, t_tiem, t_der, t_val = st.tabs(\n        [\"General y costes\", \"Recursos\", \"Contención y Bahía Urgente\", \"Tiempos de servicio\", \"Derivaciones\", \"Validación\"])\n\n    with t_gen:\n        d[\"descripcion\"] = st.text_area(\"Descripción del escenario\", d.get(\"descripcion\", \"\"), key=k(\"desc\"))\n        st.markdown(\"**Costes fijos del escenario**\")\n        st.caption(\"Marca «Anual» para los costes recurrentes (se prorratean a los días simulados); los no anuales \"\n                   \"son costes únicos (se imputan íntegros y se calcula su periodo de amortización).\")\n        cf = editor(k(\"costes\"), lambda: pd.DataFrame(\n            [{\"Concepto\": c.replace(\"_anual\", \"\"), \"Importe (€)\": v, \"Anual\": \"anual\" in c} for c, v in d.get(\"COSTES_FIJOS\", {}).items()],\n            columns=[\"Concepto\", \"Importe (€)\", \"Anual\"]), num_rows=\"dynamic\", hide_index=True, use_container_width=True,\n            column_config={\"Anual\": st.column_config.CheckboxColumn(\"Anual\", default=True),\n                           \"Importe (€)\": st.column_config.NumberColumn(min_value=0.0, step=1000.0, format=\"%.0f\")})\n        costes = {}\n        for _, r in cf.iterrows():\n            if r[\"Concepto\"] and _f(r[\"Importe (€)\"]) is not None:\n                base = str(r[\"Concepto\"]).strip().replace(\" \", \"_\")\n                costes[base + (\"_anual\" if bool(r[\"Anual\"]) else \"\")] = float(r[\"Importe (€)\"])\n        d[\"COSTES_FIJOS\"] = costes\n\n    with t_rec:\n        c1, c2 = st.columns(2)\n        with c1:\n            st.markdown(\"**Servidores** (el recurso se libera tras el servicio)\")\n            srv = editor(k(\"srv\"), lambda: pd.DataFrame({\"Servidor\": list(d[\"SERVIDORES_CAPACIDAD\"]),\n                                                          \"Capacidad\": list(d[\"SERVIDORES_CAPACIDAD\"].values())}),\n                         num_rows=\"dynamic\", hide_index=True, use_container_width=True,\n                         column_config={\"Capacidad\": st.column_config.NumberColumn(min_value=1, step=1)})\n            d[\"SERVIDORES_CAPACIDAD\"] = {str(r[\"Servidor\"]): int(r[\"Capacidad\"]) for _, r in srv.iterrows()\n                                         if r[\"Servidor\"] and _f(r[\"Capacidad\"]) is not None}\n            st.markdown(\"**Asignación estación → servidor** (si una estación no aparece, usa el servidor de su mismo nombre)\")\n            pool = editor(k(\"pool\"), lambda: pd.DataFrame({\"Estación\": list(d[\"POOL_ESTACION\"]),\n                                                            \"Servidor\": list(d[\"POOL_ESTACION\"].values())}),\n                          num_rows=\"dynamic\", hide_index=True, use_container_width=True)\n            d[\"POOL_ESTACION\"] = {str(r[\"Estación\"]): str(r[\"Servidor\"]) for _, r in pool.iterrows()\n                                  if r[\"Estación\"] and r[\"Servidor\"]}\n        with c2:\n            st.markdown(\"**Bahías** (se retienen durante toda la estancia)\")\n            cam = editor(k(\"camas\"), lambda: pd.DataFrame({\"Bahía\": list(d[\"BAHIAS_CAPACIDAD\"]),\n                                                            \"Capacidad\": list(d[\"BAHIAS_CAPACIDAD\"].values())}),\n                         num_rows=\"dynamic\", hide_index=True, use_container_width=True,\n                         column_config={\"Capacidad\": st.column_config.NumberColumn(min_value=1, step=1)})\n            d[\"BAHIAS_CAPACIDAD\"] = {str(r[\"Bahía\"]): int(r[\"Capacidad\"]) for _, r in cam.iterrows()\n                                     if r[\"Bahía\"] and _f(r[\"Capacidad\"]) is not None}\n            st.markdown(\"**Estaciones que comparten bahía** (alias → bahía física)\")\n            ali = editor(k(\"alias\"), lambda: pd.DataFrame({\"Estación\": list(d[\"BAHIA_ALIAS\"]), \"Bahía\": list(d[\"BAHIA_ALIAS\"].values())}),\n                         num_rows=\"dynamic\", hide_index=True, use_container_width=True)\n            d[\"BAHIA_ALIAS\"] = {str(r[\"Estación\"]): str(r[\"Bahía\"]) for _, r in ali.iterrows() if r[\"Estación\"] and r[\"Bahía\"]}\n\n    with t_cont:\n        c1, c2 = st.columns(2)\n        with c1:\n            st.markdown(\"**Bahía Urgente**\")\n            d[\"BAHIA_URGENTE_CAPACIDAD\"] = int(st.number_input(\"Plazas de la Bahía Urgente\", 1, 1000, int(d[\"BAHIA_URGENTE_CAPACIDAD\"]), key=k(\"box\")))\n            st.caption(\"Estación en la que cada perfil captura una plaza de la Bahía Urgente (la retiene hasta \"\n                       \"acceder a su primer recurso físico real: una bahía, la Contención o un desenlace final).\")\n            estaciones = sorted(set(d[\"PROB_DERIVACION\"]) - set(d[\"BAHIAS_CAPACIDAD\"]) - set(d[\"BAHIA_ALIAS\"]) - {\"Contencion_Emergencia\"})\n            opciones = [\"(no captura Bahía Urgente)\"] + estaciones\n            captura = {}\n            for t in TIPOS:\n                actual = d[\"BAHIA_URGENTE_CAPTURA\"].get(t)\n                sel = st.selectbox(f\"{t}\", opciones, index=opciones.index(actual) if actual in opciones else 0, key=k(\"cap\", t))\n                if sel != \"(no captura Bahía Urgente)\":\n                    captura[t] = sel\n            d[\"BAHIA_URGENTE_CAPTURA\"] = captura\n        with c2:\n            st.markdown(\"**Contención de Emergencia**\")\n            modo = st.radio(\"Gestión de plazas\", [\"Bolsas reservadas por gravedad\", \"Bolsa compartida con prioridad\"],\n                            index=0 if d[\"CONTENCION_MODE\"] != \"pooled\" else 1, key=k(\"contmodo\"),\n                            help=\"Reservadas: cada perfil solo puede usar su bolsa. Compartida: una única cola con \"\n                                 \"prioridad Critico > Grave > Leve/Programado.\")\n            d[\"CONTENCION_MODE\"] = \"pooled\" if modo.startswith(\"Bolsa compartida\") else \"partitioned\"\n            cc1, cc2, cc3 = st.columns(3)\n            d[\"CONTENCION_CRITICO_CAPACIDAD\"] = int(cc1.number_input(\"Plazas Critico\", 1, 1000, int(d[\"CONTENCION_CRITICO_CAPACIDAD\"]), key=k(\"ur\")))\n            d[\"CONTENCION_GRAVE_CAPACIDAD\"] = int(cc2.number_input(\"Plazas Grave\", 1, 1000, int(d[\"CONTENCION_GRAVE_CAPACIDAD\"]), key=k(\"un\")))\n            d[\"CONTENCION_BASE_CAPACIDAD\"] = int(cc3.number_input(\"Plazas Programado/Leve\", 1, 1000, int(d[\"CONTENCION_BASE_CAPACIDAD\"]), key=k(\"ub\")))\n            if d[\"CONTENCION_MODE\"] == \"pooled\":\n                st.caption(\"En modo compartido solo se usa el total de plazas (las bolsas se guardan por si se vuelve al modo reservado).\")\n                d[\"CONTENCION_TOTAL_CAPACIDAD\"] = int(st.number_input(\"Plazas totales de Contención\", 1, 3000, int(d[\"CONTENCION_TOTAL_CAPACIDAD\"]), key=k(\"ut\")))\n            else:\n                d[\"CONTENCION_TOTAL_CAPACIDAD\"] = d[\"CONTENCION_CRITICO_CAPACIDAD\"] + d[\"CONTENCION_GRAVE_CAPACIDAD\"] + d[\"CONTENCION_BASE_CAPACIDAD\"]\n                st.metric(\"Plazas totales de Contención\", d[\"CONTENCION_TOTAL_CAPACIDAD\"])\n            d[\"LIMITE_ESPERA_CONTENCION\"] = float(st.number_input(\"Límite de espera de plaza de Contención (días)\", 0.1, 60.0,\n                                                           float(d[\"LIMITE_ESPERA_CONTENCION\"]), 0.5, key=k(\"lim\")))\n\n    with t_tiem:\n        st.caption(\"Tiempo nominal de servicio por estación y perfil. El motor genera cada tiempo como \"\n                   \"U(0,75; 1,25) × valor nominal. Deja la celda vacía si el perfil no pasa por esa estación.\")\n        c1, c2 = st.columns(2)\n        with c1:\n            st.markdown(\"**Estaciones de atención (horas)**\")\n            ta = editor(k(\"t_min\"), lambda: tabla_tiempos(d, horas=False), num_rows=\"dynamic\", hide_index=True,\n                        use_container_width=True)\n        with c2:\n            st.markdown(\"**Estancias, bahías y monitorización (días)**\")\n            th = editor(k(\"t_h\"), lambda: tabla_tiempos(d, horas=True), num_rows=\"dynamic\", hide_index=True,\n                        use_container_width=True)\n        tiempos = {}\n        for tabla, factor in ((ta, 1 / 24), (th, 1.0)):\n            for _, r in tabla.iterrows():\n                if not r[\"Estación\"]:\n                    continue\n                est = str(r[\"Estación\"])\n                previo = d[\"TIEMPOS_SERVICIO\"].get(est, {})\n                fila = {}\n                for t in TIPOS:\n                    v = _f(r[t])\n                    if v is not None:\n                        v = v * factor\n                        fila[t] = previo[t] if t in previo and math.isclose(previo[t], v, rel_tol=1e-9) else v\n                if fila:\n                    tiempos[est] = fila\n        d[\"TIEMPOS_SERVICIO\"] = tiempos\n\n    with t_der:\n        st.caption(\"Probabilidades (%) de pasar de la estación de origen a cada destino, por perfil. Cada columna \"\n                   \"debe sumar 100 % (o quedar vacía si ese perfil no pasa por la estación). Destinos finales: \"\n                   \"«Operativo», «Baja_Definitiva» y «Perdida_Total».\")\n        origenes = list(d[\"PROB_DERIVACION\"])\n        c1, c2 = st.columns([2, 1])\n        origen = c1.selectbox(\"Estación de origen\", origenes, key=k(\"origen\"))\n        nueva_est = c2.text_input(\"Añadir estación de origen\", key=k(\"nueva_est\"), placeholder=\"nombre y pulsa Intro\")\n        if nueva_est and nueva_est not in d[\"PROB_DERIVACION\"]:\n            d[\"PROB_DERIVACION\"][nueva_est] = {}\n            st.rerun()\n        der = editor(k(\"der\", origen), lambda: tabla_derivacion(d, origen), num_rows=\"dynamic\", hide_index=True,\n                     use_container_width=True,\n                     column_config={t: st.column_config.NumberColumn(f\"{t} (%)\", min_value=0.0, max_value=100.0, format=\"%.1f\")\n                                    for t in TIPOS})\n        filas = {}\n        sumas = {}\n        previo_est = d[\"PROB_DERIVACION\"].get(origen, {})\n        for t in TIPOS:\n            col = {str(r[\"Destino\"]): _f(r[t]) for _, r in der.iterrows() if r[\"Destino\"] and _f(r[t]) is not None}\n            if col and sum(col.values()) > 0:\n                previo = previo_est.get(t, {})\n                filas[t] = {dest: (previo[dest] if dest in previo and math.isclose(previo[dest], p / 100, rel_tol=1e-9)\n                                   else p / 100) for dest, p in col.items() if p > 0}\n                sumas[t] = sum(col.values())\n        d[\"PROB_DERIVACION\"][origen] = filas\n        if sumas:\n            st.write(\"Suma por perfil: \" + \" · \".join(\n                f\"{'✅' if abs(s - 100) < 1e-6 else '❌'} {t}: {s:.1f} %\" for t, s in sumas.items()))\n        if st.button(\"Eliminar esta estación de origen\", key=k(\"del_origen\")):\n            d[\"PROB_DERIVACION\"].pop(origen, None)\n            st.rerun()\n\n    with t_val:\n        cfg = motor.Config.from_dict(d)\n        errores, avisos = validacion.validar_config(cfg)\n        if not errores and not avisos:\n            st.success(\"Sin errores ni avisos.\")\n        for e in errores:\n            st.error(e)\n        for a in avisos:\n            st.warning(a)\n        st.markdown(\"**Estaciones que puede recorrer cada perfil**\")\n        st.dataframe(pd.DataFrame({t: [\", \".join(sorted(validacion.estaciones_alcanzables(cfg, t)))] for t in TIPOS},\n                                  index=[\"Estaciones\"]).T, use_container_width=True)\n        if nombre != \"Línea base\" and \"Línea base\" in ss.escenarios:\n            st.markdown(\"**Diferencias frente a la Línea base**\")\n            dif = informe.diferencias_config(motor.Config.from_dict(ss.escenarios[\"Línea base\"]), cfg)\n            st.dataframe(dif, hide_index=True, use_container_width=True) if len(dif) else st.info(\"Sin diferencias.\")\n\n\nwith tab_esc:\n    st.subheader(\"Configuración de los escenarios\")\n    nombres = list(ss.escenarios)\n    if ss.esc_activo not in nombres:\n        ss.esc_activo = nombres[0]\n    c1, c2 = st.columns([3, 2])\n    activo = c1.selectbox(\"Escenario a configurar\", nombres, index=nombres.index(ss.esc_activo), key=clave(\"activo\", len(nombres)))\n    ss.esc_activo = activo\n\n    with c2.expander(\"➕ Crear, combinar, renombrar o eliminar escenarios\"):\n        st.markdown(\"**Nuevo escenario (copia de otro)**\")\n        n_nombre = st.text_input(\"Nombre del nuevo escenario\", key=clave(\"nuevo_nombre\"))\n        origen_copia = st.selectbox(\"Copiar de\", nombres, key=clave(\"copiar_de\", len(nombres)))\n        if st.button(\"Crear copia\", key=clave(\"crear\")):\n            if not n_nombre or n_nombre in ss.escenarios:\n                st.error(\"Indica un nombre nuevo y distinto de los existentes.\")\n            else:\n                ss.escenarios[n_nombre] = copy.deepcopy(ss.escenarios[origen_copia])\n                ss.escenarios[n_nombre][\"nombre\"] = n_nombre\n                ss.esc_activo = n_nombre\n                st.rerun()\n        st.markdown(\"**Combinación de escenarios**\")\n        st.caption(\"Aplica sobre la base elegida todos los cambios que cada escenario seleccionado introduce respecto a ella.\")\n        base_comb = st.selectbox(\"Base\", nombres, index=nombres.index(\"Línea base\") if \"Línea base\" in nombres else 0,\n                                 key=clave(\"base_comb\", len(nombres)))\n        a_combinar = st.multiselect(\"Escenarios a combinar\", [n for n in nombres if n != base_comb], key=clave(\"comb\", len(nombres)))\n        nombre_comb = st.text_input(\"Nombre de la combinación\", value=\" + \".join(n.split(\" \")[0] for n in a_combinar),\n                                    key=clave(\"nombre_comb\", \"-\".join(a_combinar)))\n        if st.button(\"Crear combinación\", key=clave(\"crear_comb\"), disabled=len(a_combinar) < 2):\n            if not nombre_comb or nombre_comb in ss.escenarios:\n                st.error(\"Indica un nombre nuevo y distinto de los existentes.\")\n            else:\n                base_cfg = motor.Config.from_dict(ss.escenarios[base_comb])\n                cfgs = [motor.Config.from_dict(ss.escenarios[n]) for n in a_combinar]\n                comb = motor.combinar_configs(*cfgs, nombre=nombre_comb, base=base_cfg)\n                comb.descripcion = f\"Combinación de {', '.join(a_combinar)} sobre {base_comb}.\"\n                ss.escenarios[nombre_comb] = comb.to_dict()\n                ss.esc_activo = nombre_comb\n                st.rerun()\n        st.markdown(\"**Renombrar / eliminar el escenario activo**\")\n        renombre = st.text_input(\"Nuevo nombre\", value=activo, key=clave(\"renombrar\", activo))\n        cc1, cc2, cc3 = st.columns(3)\n        if cc1.button(\"Renombrar\", key=clave(\"btn_ren\", activo)) and renombre and renombre != activo:\n            if renombre in ss.escenarios:\n                st.error(\"Ya existe un escenario con ese nombre.\")\n            else:\n                ss.escenarios = {(renombre if n == activo else n): v for n, v in ss.escenarios.items()}\n                ss.escenarios[renombre][\"nombre\"] = renombre\n                ss.esc_activo = renombre\n                st.rerun()\n        if cc2.button(\"Eliminar\", key=clave(\"btn_del\", activo), disabled=len(nombres) <= 1):\n            ss.escenarios.pop(activo)\n            ss.esc_activo = next(iter(ss.escenarios))\n            st.rerun()\n        if cc3.button(\"Restablecer\", key=clave(\"btn_rst\", activo), disabled=activo not in motor.ESCENARIOS_POR_DEFECTO,\n                      help=\"Vuelve a los valores por defecto (solo escenarios predefinidos).\"):\n            ss.escenarios[activo] = escenarios_por_defecto()[activo]\n            ss.version += 1\n            st.rerun()\n\n    # Estado de validación de todos los escenarios\n    estado = []\n    for n, dd in ss.escenarios.items():\n        e, a = validacion.validar_config(motor.Config.from_dict(dd))\n        estado.append(f\"{'❌' if e else ('⚠️' if a else '✅')} {n}\")\n    st.caption(\"Estado: \" + \" · \".join(estado))\n    st.divider()\n    editar_escenario(activo)\n\n\n# ==============================================================================================\n# Ejecución de la simulación\n# ==============================================================================================\ndef parametros_kpi():\n    p = copy.deepcopy(ss.comunes[\"param\"])\n    p[\"T_WARMUP\"] = ss.ajustes[\"warmup\"]\n    p[\"T_COOLDOWN\"] = ss.ajustes[\"cooldown\"]\n    return p\n\n\nif ejecutar:\n    aj = ss.ajustes\n    problemas = list(validacion.validar_llegadas(ss.comunes[\"llegadas\"]))\n    if aj[\"dias\"] <= aj[\"warmup\"] + aj[\"cooldown\"] + 5:\n        problemas.append(\"Los días por réplica deben superar ampliamente el calentamiento + el cierre.\")\n    for n in seleccion:\n        e, _ = validacion.validar_config(motor.Config.from_dict(ss.escenarios[n]))\n        problemas += [f\"{n}: {x}\" for x in e]\n    if problemas:\n        with tab_res:\n            st.error(\"No se puede simular: corrige primero estos problemas.\")\n            for p in problemas:\n                st.write(\"• \" + p)\n    else:\n        param = parametros_kpi()\n        llegadas = motor.lista_a_llegadas(ss.comunes[\"llegadas\"])\n        protocolos = {}\n        barra = st.sidebar.progress(0.0, text=\"Preparando…\")\n        total = aj[\"n_sim\"] * len(seleccion)\n        for j, n in enumerate(seleccion):\n            cfg = motor.Config.from_dict(ss.escenarios[n])\n            cfg.nombre = n\n            cfg.ESTACIONES_ANIO = llegadas\n\n            def prog(i, n_sim, j=j, n=n):\n                barra.progress(min(1.0, (j * n_sim + i) / total), text=f\"{n}: réplica {i}/{n_sim}\")\n\n            protocolos[n] = kpis.montecarlo(cfg, n_sim=aj[\"n_sim\"], dias=aj[\"dias\"], semilla_base=aj[\"semilla\"],\n                                            param=param, progreso=prog, paralelo=aj[\"paralelo\"],\n                                            n_procesos=aj.get(\"n_procesos\"))\n        barra.progress(1.0, text=\"Simulación terminada\")\n        ss.resultados = {\"protocolos\": protocolos, \"ref\": ref if ref in protocolos else seleccion[0],\n                         \"ajustes\": copy.deepcopy(aj), \"comunes\": {\"llegadas\": copy.deepcopy(ss.comunes[\"llegadas\"]),\n                                                                   \"param\": param},\n                         \"fecha\": datetime.datetime.now().strftime(\"%d/%m/%Y %H:%M\")}\n        ss.informe_bytes = None\n        st.toast(\"Simulación terminada: revisa la pestaña «Resultados».\", icon=\"✅\")\n\n\n# ==============================================================================================\n# 3) Resultados\n# ==============================================================================================\ndef tabla_fmt_filas(df, cols=None):\n    \"\"\"Formatea una tabla con KPIs en filas (mismo formato que el informe).\"\"\"\n    cols = cols or list(df.columns)\n    out = pd.DataFrame(index=df.index, columns=cols, dtype=object)\n    for f in df.index:\n        for c in cols:\n            out.loc[f, c] = informe.fmt_por_fila(f, c, df.loc[f, c])\n    return out\n\n\ndef negrita_inicial(p):\n    \"\"\"Pone en negrita el texto hasta el primer ': ' o '. '.\"\"\"\n    cortes = [x for x in (p.find(\": \"), p.find(\". \")) if x > 0]\n    if not cortes or min(cortes) > 60:\n        return p\n    c = min(cortes) + 1\n    return f\"**{p[:c]}**{p[c:]}\"\n\n\ndef mostrar(fig):\n    if fig is not None:\n        st.pyplot(fig, use_container_width=True)\n        plt.close(fig)\n\n\ndef tabla_fmt(df, fn):\n    out = df.copy().astype(object)\n    for f in df.index:\n        for c in df.columns:\n            out.loc[f, c] = fn(f, c, df.loc[f, c])\n    return out\n\n\nwith tab_res:\n    R = ss.resultados\n    if R is None:\n        st.info(\"Todavía no hay resultados. Configura los escenarios y pulsa «▶️ Ejecutar simulación» en la barra lateral.\")\n    else:\n        prot, ref_r, aj_r = R[\"protocolos\"], R[\"ref\"], R[\"ajustes\"]\n        st.caption(f\"Simulación del {R['fecha']} · {aj_r['n_sim']} réplicas de {aj_r['dias']} días · semilla {aj_r['semilla']} \"\n                   f\"· referencia: **{ref_r}** · escenarios: {', '.join(prot)}\")\n        r_res, r_graf, r_det, r_dat = st.tabs([\"Resumen comparativo\", \"Gráficos\", \"Detalle por escenario\", \"Datos\"])\n\n        with r_res:\n            recomendacion, ranking = kpis.texto_recomendacion(prot, ref_r)\n            with st.container(border=True):\n                st.markdown(\"##### Síntesis automática\")\n                for p in recomendacion:\n                    st.markdown(negrita_inicial(p))\n            medias, marcas = kpis.tabla_sintesis(prot, ref=ref_r)\n            sint = medias.copy().astype(object)\n            for c in sint.columns:\n                sint[c] = [kpis.fmt_kpi(k, medias.loc[k, c]) + (f\" {marcas.loc[k, c]}\" if marcas.loc[k, c] else \"\")\n                           for k in medias.index]\n            st.markdown(f\"**KPIs principales** (media de las réplicas · ▲ mejora / ▼ empeora significativamente frente a {ref_r})\")\n            st.dataframe(sint.rename(index=kpis.ETIQUETAS_KPI), use_container_width=True, height=36 * (len(sint) + 1))\n            c1, c2 = st.columns(2)\n            with c1:\n                st.markdown(\"**Cumplimiento de SLAs** (% de réplicas)\")\n                st.dataframe(tabla_fmt(kpis.tabla_slas(prot).rename(index=kpis.slas_mc(prot[ref_r])[\"Descripción\"]),\n                                       lambda f, c, v: kpis.pct(v, 0)), use_container_width=True)\n            with c2:\n                st.markdown(\"**Ranking de escenarios**\")\n                rk = ranking[[\"SLAs cumplidos\", \"Resultado neto anual (€)\", \"Retorno a servicio\", \"Pérdida total global\",\n                              \"Pérdida Sin_Cont G/C\", \"Margen neto\", \"Descartado\"]]\n                st.dataframe(tabla_fmt(rk, lambda f, c, v: kpis.eur(v) if \"€\" in c else (\n                    kpis.pct(v, 2) if (\"Pérdida\" in c or \"Margen\" in c or \"Retorno\" in c) else (\"Sí\" if v is True else (\"No\" if v is False else str(v))))),\n                    use_container_width=True)\n            if len(prot) > 1:\n                st.markdown(f\"**Resultado económico frente a {ref_r}**\")\n                eco = kpis.tabla_economica(prot, ref=ref_r)\n                st.dataframe(tabla_fmt(eco, lambda f, c, v: kpis.eur(v)), use_container_width=True)\n\n        with r_graf:\n            todas = sorted(set.intersection(*[set(m[\"resumen\"].columns) for m in prot.values()]) -\n                           {c for c in prot[ref_r][\"resumen\"].columns if c.startswith(\"Cumple_\")})\n            elegidos = st.multiselect(\"KPIs a comparar\", todas, default=[k for k in informe.KPIS_GRAFICOS if k in todas],\n                                      format_func=lambda k: kpis.ETIQUETAS_KPI.get(k, k), key=\"kpis_graf\")\n            if elegidos:\n                mostrar(gr.fig_comparativo(prot, elegidos, 3))\n            c1, c2 = st.columns(2)\n            with c1:\n                mostrar(gr.fig_utilizacion_comparada(prot))\n            with c2:\n                mostrar(gr.fig_sintesis(ranking, list(prot), ref_r))\n            mostrar(gr.fig_tsys_perfil(prot))\n            mostrar(gr.fig_ocupacion_cont(prot, R[\"comunes\"][\"param\"][\"SLA_OCUP_CONT\"]))\n\n        with r_det:\n            esc = st.selectbox(\"Escenario\", list(prot), key=\"det_esc\")\n            mc = prot[esc]\n            if esc != ref_r:\n                st.info(kpis.texto_escenario(esc, prot[ref_r], mc, ref=ref_r))\n            c1, c2 = st.columns([3, 2])\n            with c1:\n                st.markdown(\"**KPIs principales (Monte Carlo)**\")\n                st.dataframe(tabla_fmt_filas(kpis.resumen_mc(mc, kpis.KPIS_SINTESIS).rename(index=kpis.ETIQUETAS_KPI),\n                                             [\"Media\", \"SD\", \"IC95_inf\", \"IC95_sup\", \"P2.5\", \"P97.5\"]), use_container_width=True)\n            with c2:\n                st.markdown(\"**SLAs**\")\n                s = kpis.slas_mc(mc).set_index(\"Descripción\")\n                st.dataframe(tabla_fmt(s[[\"Valor_medio\", \"%Réplicas_cumple\", \"Veredicto\"]],\n                                       lambda f, c, v: v if isinstance(v, str) else (kpis.pct(v, 0) if c == \"%Réplicas_cumple\"\n                                                                                     else kpis.num(v, 4))),\n                             use_container_width=True)\n            st.markdown(\"**KPIs temporales por perfil (días)**\")\n            st.dataframe(kpis.tabla_media_mc(mc, \"operativos\").round(3), use_container_width=True)\n            st.markdown(\"**KPIs de fiabilidad y mantenimiento por perfil**\")\n            st.dataframe(tabla_fmt(kpis.tabla_media_mc(mc, \"fiabilidad\"),\n                                   lambda f, c, v: kpis.num(v, 1) if c in (\"Ordenes\", \"Operativos_anio\") else kpis.pct(v, 2)),\n                         use_container_width=True)\n            rec = kpis.tabla_media_mc(mc, \"recursos\")\n            c1, c2 = st.columns([3, 2])\n            with c1:\n                st.markdown(\"**Recursos**\")\n                st.dataframe(rec[[\"Tipo\", \"Capacidad\", \"Utilizacion\", \"Lq_media\", \"%Bloqueo\", \"Diagnostico\", \"%Réplicas_ρ≥0.85\"]]\n                             .round(3), use_container_width=True)\n            with c2:\n                mostrar(gr.fig_utilizacion(rec, f\"Utilización media · {esc}\"))\n            st.markdown(\"**Carga y espera por estación**\")\n            st.dataframe(kpis.tabla_media_mc(mc, \"estaciones\").round(3), use_container_width=True)\n            st.markdown(\"**Resultado económico por perfil (media por réplica)**\")\n            st.dataframe(tabla_fmt(kpis.tabla_media_mc(mc, \"economicos\"),\n                                   lambda f, c, v: kpis.num(v, 1) if c == \"Ordenes\" else (kpis.pct(v) if c == \"Margen\" else kpis.eur(v))),\n                         use_container_width=True)\n            if esc != ref_r:\n                c1, c2 = st.columns([3, 2])\n                with c1:\n                    st.markdown(f\"**Comparación pareada con {ref_r}**\")\n                    cmp_ = kpis.comparar_escenarios(prot[ref_r], mc, kpis.KPIS_SINTESIS)\n                    st.dataframe(tabla_fmt_filas(cmp_.rename(index=kpis.ETIQUETAS_KPI),\n                                                 [\"Base\", \"Escenario\", \"Δ%\", \"p_valor\", \"Significativo\"])\n                                 .rename(columns={\"Base\": ref_r, \"Escenario\": esc}), use_container_width=True)\n                with c2:\n                    st.markdown(\"**Viabilidad económica**\")\n                    viab = kpis.viabilidad_economica(prot[ref_r], mc)\n                    st.dataframe(tabla_fmt(viab, lambda f, c, v: kpis.pct(v) if (\"Margen\" in f or \"%\" in f) else (\n                        kpis.num(v, 2) if \"Cobertura\" in f else (kpis.num(v, 0) if \"días\" in f else kpis.eur(v)))),\n                        use_container_width=True)\n\n        with r_dat:\n            st.markdown(\"Valores de cada réplica (una fila por réplica y escenario).\")\n            largo = pd.concat([m[\"resumen\"].copy().assign(Escenario=n) for n, m in prot.items()]).reset_index()\n            st.dataframe(largo, use_container_width=True, height=350)\n            buf = io.BytesIO()\n            with pd.ExcelWriter(buf, engine=\"openpyxl\") as xw:\n                for n, m in prot.items():\n                    m[\"resumen\"].to_excel(xw, sheet_name=(\"\".join(ch for ch in n if ch.isalnum() or ch in \" +-_\"))[:31] or \"esc\")\n                kpis.resumen_mc(prot[ref_r], kpis.KPIS_SINTESIS).to_excel(xw, sheet_name=\"Resumen_referencia\")\n            st.download_button(\"Descargar réplicas (Excel)\", buf.getvalue(), \"replicas_simulacion.xlsx\",\n                               \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n\n\n# ==============================================================================================\n# 4) Informe\n# ==============================================================================================\nwith tab_inf:\n    R = ss.resultados\n    if R is None:\n        st.info(\"Ejecuta primero una simulación para poder generar el informe.\")\n    else:\n        st.markdown(\"El informe Word incluye: resumen ejecutivo, parámetros comunes y de cada escenario (con sus \"\n                    \"diferencias frente a la referencia), tablas comparativas de KPIs, SLAs y resultado económico, \"\n                    \"gráficas comparativas y un apartado de detalle por escenario con todas sus tablas y gráficas.\")\n        titulo = st.text_input(\"Título del informe\", \"Taller de mantenimiento y reacondicionamiento eólico\", key=\"tit_inf\")\n        if st.button(\"📄 Generar informe (.docx)\", type=\"primary\"):\n            barra = st.progress(0.0, text=\"Generando informe…\")\n            ss.informe_bytes = informe.generar_informe(\n                R[\"protocolos\"], R[\"ref\"],\n                {k: R[\"ajustes\"][k] for k in (\"n_sim\", \"dias\", \"semilla\", \"warmup\", \"cooldown\")},\n                R[\"comunes\"], titulo=titulo, progreso=lambda f, t: barra.progress(min(f, 1.0), text=t))\n            barra.progress(1.0, text=\"Informe listo\")\n        if ss.informe_bytes:\n            st.download_button(\"⬇️ Descargar informe\", ss.informe_bytes,\n                               f\"Informe_Taller_Eolico_{datetime.date.today():%Y%m%d}.docx\",\n                               \"application/vnd.openxmlformats-officedocument.wordprocessingml.document\",\n                               type=\"primary\")\n",
 "motor.py": "# -*- coding: utf-8 -*-\n\"\"\"Motor de simulación (SimPy) del taller de mantenimiento y reacondicionamiento eólico y\nconfiguraciones de los escenarios. Tiempo en días.\n\nEs el mismo gemelo digital del cuaderno '03 Taller Eólico', con dos cambios menores:\n* los ingresos por estación del año pueden ir dentro de la configuración (cfg.ESTACIONES_ANIO), para\n  que la aplicación los modifique como parámetro común a todos los escenarios;\n* cualquier estación cuyo nombre empiece por 'Monitorizacion_' se trata como estación de monitorización.\n\"\"\"\nimport copy\nimport random\n\nimport pandas as pd\nimport simpy\n\nclass Config:\n    \"\"\"Contenedor simple de los parámetros de un escenario (capacidades,\n    tiempos de servicio, probabilidades de derivación, costes...).\"\"\"\n\n    def to_dict(self):\n        \"\"\"Representación serializable (JSON) de la configuración.\"\"\"\n        d = copy.deepcopy(vars(self))\n        if \"ESTACIONES_ANIO\" in d:\n            d[\"ESTACIONES_ANIO\"] = llegadas_a_lista(d[\"ESTACIONES_ANIO\"])\n        return d\n\n    @classmethod\n    def from_dict(cls, d):\n        cfg = cls()\n        for k, v in copy.deepcopy(d).items():\n            setattr(cfg, k, v)\n        if isinstance(getattr(cfg, \"ESTACIONES_ANIO\", None), list):\n            cfg.ESTACIONES_ANIO = lista_a_llegadas(cfg.ESTACIONES_ANIO)\n        return cfg\n\n\n# --- Parámetros compartidos por TODOS los escenarios (no cambian) ---------\nTIPOS = [\"Programado\", \"Leve\", \"Grave\", \"Critico\"]\n\n# Estacionalidad meteorológica: (tasa_ordenes_dia, [pProgramado,pLeve,pGrave,pCritico])\nESTACIONES_ANIO = {\n    (335, 59):  (1.50, [0.30, 0.25, 0.30, 0.15]),   # Invierno: temporales -> más averías graves/críticas\n    (59, 151):  (1.05, [0.55, 0.25, 0.15, 0.05]),   # Primavera: revisiones programadas tras el invierno\n    (151, 243): (0.825, [0.35, 0.35, 0.20, 0.10]),  # Verano: menor actividad, sobrecalentamientos eléctricos\n    (243, 335): (1.125, [0.40, 0.30, 0.20, 0.10]),  # Otoño: mantenimiento preventivo previo al invierno\n}\n\n\ndef llegadas_a_lista(llegadas):\n    \"\"\"{(ini, fin): (tasa, probs)} -> lista de dicts (formato editable/JSON).\"\"\"\n    return [{\"Inicio\": i, \"Fin\": f, \"Tasa\": t, **{tp: p for tp, p in zip(TIPOS, probs)}}\n            for (i, f), (t, probs) in llegadas.items()]\n\n\ndef lista_a_llegadas(lista):\n    \"\"\"Lista de dicts -> {(ini, fin): (tasa, probs)} (formato del motor).\"\"\"\n    return {(int(r[\"Inicio\"]), int(r[\"Fin\"])): (float(r[\"Tasa\"]), [float(r[tp]) for tp in TIPOS]) for r in lista}\n\n\ndef obtener_perfil_temporada(reloj_dias, llegadas=None):\n    llegadas = ESTACIONES_ANIO if llegadas is None else llegadas\n    dia_anno = int(reloj_dias) % 365\n    for (inicio, fin), (tasa, probs) in llegadas.items():\n        if inicio > fin:\n            if dia_anno >= inicio or dia_anno < fin:\n                return tasa, probs\n        else:\n            if inicio <= dia_anno < fin:\n                return tasa, probs\n    raise RuntimeError(\"Día del año no cubierto\")\n\n\ndef generar_tiempo_servicio(cfg, estacion, tipo):\n    base = cfg.TIEMPOS_SERVICIO.get(estacion, {}).get(tipo)\n    if base is None:\n        raise KeyError(f\"Sin tiempo de servicio definido para {estacion}/{tipo}\")\n    return base * random.uniform(0.75, 1.25)\n\n\ndef determinar_destino(cfg, estacion, tipo):\n    opciones = cfg.PROB_DERIVACION[estacion][tipo]\n    destinos = list(opciones.keys())\n    pesos = list(opciones.values())\n    return random.choices(destinos, weights=pesos, k=1)[0]\n\n\ndef _verificar_filas(prob):\n    \"\"\"Comprueba que todas las filas de PROB_DERIVACION suman 1.0.\"\"\"\n    errores = []\n    for estacion, por_tipo in prob.items():\n        for tipo, destinos in por_tipo.items():\n            s = sum(destinos.values())\n            if abs(s - 1.0) > 1e-9:\n                errores.append((estacion, tipo, s))\n    return errores\n\n\nESTADOS_FINALES = {\"Operativo\", \"Baja_Definitiva\", \"Perdida_Total\"}\nOBS_ESTACIONES = {\"Monitorizacion_Leve\", \"Monitorizacion_Grave\", \"Monitorizacion_Critico\"}\n\n\ndef es_observacion(estacion):\n    \"\"\"Las estaciones de monitorización (sin recurso propio) son las que empiezan por 'Monitorizacion_'.\"\"\"\n    return estacion in OBS_ESTACIONES or estacion.startswith(\"Monitorizacion_\")\n\n\nclass Taller:\n    def __init__(self, env, cfg, simpy_module):\n        self.env = env\n        self.cfg = cfg\n        self.simpy = simpy_module\n        self.log_datos = []\n        self.activos = {}\n\n        self.servidores = {\n            nombre: simpy_module.Resource(env, capacity=cap)\n            for nombre, cap in cfg.SERVIDORES_CAPACIDAD.items()\n        }\n        self.bahias = {\n            nombre: simpy_module.Resource(env, capacity=cap)\n            for nombre, cap in cfg.BAHIAS_CAPACIDAD.items()\n        }\n        self.bahia_urgente = simpy_module.Resource(env, capacity=cfg.BAHIA_URGENTE_CAPACIDAD)\n\n        if cfg.CONTENCION_MODE == \"pooled\":\n            self.contencion = {\"POOL\": simpy_module.PriorityResource(env, capacity=cfg.CONTENCION_TOTAL_CAPACIDAD)}\n        else:\n            self.contencion = {\n                \"Critico\": simpy_module.Resource(env, capacity=cfg.CONTENCION_CRITICO_CAPACIDAD),\n                \"Grave\": simpy_module.Resource(env, capacity=cfg.CONTENCION_GRAVE_CAPACIDAD),\n                \"Base\": simpy_module.Resource(env, capacity=cfg.CONTENCION_BASE_CAPACIDAD),\n            }\n\n    def info_cola(self, resource):\n        q = len([r for r in resource.queue if not r.triggered and not getattr(r, \"_cancelled\", False)])\n        return q, q + resource.count\n\n    def recurso_de_bahia(self, nombre_logico):\n        alias = self.cfg.BAHIA_ALIAS.get(nombre_logico, nombre_logico)\n        return self.bahias[alias]\n\n    def pool_de_estacion(self, estacion):\n        return self.cfg.POOL_ESTACION.get(estacion, estacion)\n\n    def registrar(self, id_ord, tipo, t_in, estacion, t_wait, t_server, id_recurso,\n                  bahia, q_len, sys_len, destino):\n        self.log_datos.append({\n            \"Id_orden\": id_ord, \"Perfil\": tipo, \"T_in\": round(t_in, 4),\n            \"Station_in\": estacion, \"T_wait\": round(t_wait, 4),\n            \"T_server\": round(t_server, 4), \"ID_server\": id_recurso,\n            \"Bahia\": bahia, \"Ord_en_cola\": q_len, \"Ord_en_sistema\": sys_len,\n            \"T_out\": round(t_in + t_wait + t_server, 4), \"Station_out\": destino,\n            \"T_system\": round(t_wait + t_server, 4),\n        })\n\n    def finalizar_simulacion(self):\n        end_time = self.env.now\n        for ord_id, data in list(self.activos.items()):\n            t_transcurrido = end_time - data[\"t_llegada_estacion\"]\n            self.log_datos.append({\n                \"Id_orden\": ord_id, \"Perfil\": data[\"tipo\"], \"T_in\": round(data[\"t_llegada_estacion\"], 4),\n                \"Station_in\": data[\"estacion\"], \"T_wait\": round(t_transcurrido, 4),\n                \"T_server\": 0.0, \"ID_server\": data.get(\"id_recurso\", \"N/A\"),\n                \"Bahia\": data.get(\"bahia\", \"N/A\"), \"Ord_en_cola\": data.get(\"q_len\", 0),\n                \"Ord_en_sistema\": data.get(\"sys_len\", 0), \"T_out\": round(end_time, 4),\n                \"Station_out\": \"Fin_Simulacion\", \"T_system\": round(t_transcurrido, 4),\n            })\n\n\ndef liberar_bahia(taller, bahia_propia):\n    \"\"\"Libera una bahía propia: un recurso físico normal (registrado en\n    taller.bahias) o una plaza de Contención de Emergencia (clave especial\n    'CONT::<bolsa>').\"\"\"\n    if bahia_propia is None:\n        return\n    nombre, req = bahia_propia\n    if nombre.startswith(\"CONT::\"):\n        bolsa = nombre.split(\"::\", 1)[1]\n        taller.contencion[bolsa].release(req)\n    else:\n        taller.bahias[nombre].release(req)\n\n\ndef comportamiento_orden(env, taller, simpy, id_ord, tipo):\n    cfg = taller.cfg\n    estacion_actual = \"Recepcion\"\n    mi_bahia = \"Taller_Espera\"\n    urgente_propia = None     # request concedida de la Bahía Urgente, si la orden ya la ocupa\n    bahia_propia = None        # (nombre_logico, request) de la bahía o plaza de contención que ocupa\n    t_llegada = env.now\n\n    taller.activos[id_ord] = {\n        \"tipo\": tipo, \"t_llegada_estacion\": t_llegada, \"estacion\": estacion_actual, \"bahia\": mi_bahia,\n    }\n\n    # Captura inmediata de la Bahía Urgente para Critico desde Recepción\n    if cfg.BAHIA_URGENTE_CAPTURA.get(tipo) == \"Recepcion\":\n        req_urgente = taller.bahia_urgente.request()\n        yield req_urgente\n        urgente_propia = req_urgente\n        mi_bahia = \"Bahia_Urgente\"\n\n    while estacion_actual not in ESTADOS_FINALES:\n        taller.activos[id_ord].update({\n            \"t_llegada_estacion\": t_llegada, \"estacion\": estacion_actual, \"bahia\": mi_bahia,\n        })\n\n        # Captura de la Bahía Urgente en el momento indicado por la configuración\n        if urgente_propia is None and cfg.BAHIA_URGENTE_CAPTURA.get(tipo) == estacion_actual:\n            req_urgente = taller.bahia_urgente.request()\n            yield req_urgente\n            urgente_propia = req_urgente\n            mi_bahia = \"Bahia_Urgente\"\n            taller.activos[id_ord][\"bahia\"] = mi_bahia\n\n        t_wait = 0.0\n        id_recurso = \"N/A\"\n        q_len, sys_len = 0, 0\n\n        if es_observacion(estacion_actual):\n            # No hay recurso propio: se retiene la bahía ya ocupada.\n            id_recurso = mi_bahia\n            t_wait = 0.0\n\n        elif estacion_actual in cfg.BAHIAS_CAPACIDAD or estacion_actual in cfg.BAHIA_ALIAS:\n            recurso = taller.recurso_de_bahia(estacion_actual)\n            alias = cfg.BAHIA_ALIAS.get(estacion_actual, estacion_actual)\n            if bahia_propia is not None and bahia_propia[0] == alias:\n                t_wait = 0.0  # ya se encontraba en esa misma bahía\n            else:\n                q_len, sys_len = taller.info_cola(recurso)\n                t0 = env.now\n                req_bahia = recurso.request()\n                yield req_bahia\n                t_wait = env.now - t0\n                # libera la bahía anterior (si tenía una física distinta)\n                if bahia_propia is not None:\n                    liberar_bahia(taller, bahia_propia)\n                    bahia_propia = None\n                elif urgente_propia is not None:\n                    taller.bahia_urgente.release(urgente_propia)\n                    urgente_propia = None\n                bahia_propia = (alias, req_bahia)\n            id_recurso = alias\n            mi_bahia = alias\n            taller.activos[id_ord][\"bahia\"] = mi_bahia\n\n        elif estacion_actual == \"Contencion_Emergencia\":\n            prioridad = {\"Critico\": 0, \"Grave\": 1, \"Leve\": 2, \"Programado\": 2}[tipo]\n            if cfg.CONTENCION_MODE == \"pooled\":\n                pool = taller.contencion[\"POOL\"]\n                q_len, sys_len = taller.info_cola(pool)\n                t0 = env.now\n                req_cont = pool.request(priority=prioridad)\n            else:\n                bolsa = {\"Critico\": \"Critico\", \"Grave\": \"Grave\"}.get(tipo, \"Base\")\n                pool = taller.contencion[bolsa]\n                q_len, sys_len = taller.info_cola(pool)\n                t0 = env.now\n                req_cont = pool.request()\n\n            # Carrera entre conseguir plaza y agotar el límite de espera\n            resultado = yield req_cont | env.timeout(cfg.LIMITE_ESPERA_CONTENCION)\n            if req_cont in resultado:\n                t_wait = env.now - t0\n                if bahia_propia is not None:\n                    liberar_bahia(taller, bahia_propia)\n                    bahia_propia = None\n                elif urgente_propia is not None:\n                    taller.bahia_urgente.release(urgente_propia)\n                    urgente_propia = None\n                bahia_propia = (\"CONT::\" + (bolsa if cfg.CONTENCION_MODE != \"pooled\" else \"POOL\"), req_cont)\n                id_recurso = \"Contencion_Emergencia\"\n                mi_bahia = \"Contencion_Emergencia\"\n            else:\n                req_cont.cancel()\n                t_wait = env.now - t0\n                # sin plaza de contención disponible dentro del límite: pérdida total\n                taller.registrar(id_ord, tipo, t_llegada, estacion_actual,\n                                  t_wait, 0.0, \"Sin_Contencion_Disponible\", mi_bahia, q_len, sys_len,\n                                  \"Perdida_Total\")\n                estacion_actual = \"Perdida_Total\"\n                break\n            taller.activos[id_ord][\"bahia\"] = mi_bahia\n\n        else:\n            # Estación \"servidor\": el recurso se libera justo tras el servicio\n            pool_nombre = taller.pool_de_estacion(estacion_actual)\n            recurso = taller.servidores[pool_nombre]\n            q_len, sys_len = taller.info_cola(recurso)\n            t0 = env.now\n            req = recurso.request()\n            yield req\n            t_wait = env.now - t0\n            id_recurso = pool_nombre\n\n        t_servicio = generar_tiempo_servicio(cfg, estacion_actual, tipo)\n        yield env.timeout(t_servicio)\n\n        if (not es_observacion(estacion_actual)\n                and estacion_actual not in cfg.BAHIAS_CAPACIDAD\n                and estacion_actual not in cfg.BAHIA_ALIAS\n                and estacion_actual != \"Contencion_Emergencia\"):\n            taller.servidores[taller.pool_de_estacion(estacion_actual)].release(req)\n\n        destino = determinar_destino(cfg, estacion_actual, tipo)\n\n        if destino in ESTADOS_FINALES:\n            if urgente_propia is not None:\n                taller.bahia_urgente.release(urgente_propia)\n                urgente_propia = None\n            if bahia_propia is not None:\n                liberar_bahia(taller, bahia_propia)\n                bahia_propia = None\n\n        taller.registrar(id_ord, tipo, t_llegada, estacion_actual,\n                          t_wait, t_servicio, id_recurso, mi_bahia, q_len, sys_len, destino)\n\n        estacion_actual = destino\n        t_llegada = env.now\n\n    if id_ord in taller.activos:\n        del taller.activos[id_ord]\n    if urgente_propia is not None:\n        taller.bahia_urgente.release(urgente_propia)\n    if bahia_propia is not None:\n        liberar_bahia(taller, bahia_propia)\n\n\ndef generador_ordenes(env, taller, simpy, cfg):\n    id_ord = 1\n    llegadas = getattr(cfg, \"ESTACIONES_ANIO\", None)\n    while True:\n        tasa, probs = obtener_perfil_temporada(env.now, llegadas)\n        yield env.timeout(random.expovariate(tasa))\n        tipo = random.choices(TIPOS, weights=probs)[0]\n        env.process(comportamiento_orden(env, taller, simpy, f\"OT_{id_ord}\", tipo))\n        id_ord += 1\n\n\ndef simular(cfg, dias, semilla, simpy_module=None):\n    \"\"\"Ejecuta la simulación de `cfg` durante `dias` días con la semilla dada.\n    Devuelve un DataFrame de pandas con la traza completa (mismo formato que\n    `traza_taller_eolico.csv.gz`). `dias` es directamente la unidad de tiempo\n    de la simulación: no se aplica ningún factor de conversión adicional.\"\"\"\n    if simpy_module is None:\n        simpy_module = simpy\n    random.seed(semilla)\n    env = simpy_module.Environment()\n    taller = Taller(env, cfg, simpy_module)\n    env.process(generador_ordenes(env, taller, simpy_module, cfg))\n    env.run(until=dias)\n    taller.finalizar_simulacion()\n    df_sim = pd.DataFrame(taller.log_datos)\n    if len(df_sim):\n        df_sim = df_sim.sort_values(by=[\"T_in\"]).reset_index(drop=True)\n    return df_sim\n\n\ndef construir_config_base():\n    cfg = Config()\n    cfg.nombre = \"Línea Base (protocolo actual)\"\n\n    cfg.SERVIDORES_CAPACIDAD = {\n        \"Recepcion\": 1,\n        \"Equipo_Tecnico\": 1,                    # atiende Inspeccion_Tecnica y Valoracion_Preliminar\n        \"Diagnostico_Electrico\": 1,\n        \"Diagnostico_END\": 1,                   # único banco de Ensayos No Destructivos -> cuello de botella deliberado\n        \"Consulta_Ingeniero_Fiabilidad\": 1,\n        \"Puesta_En_Marcha\": 1,\n    }\n\n    # Capacidades \"bahía\" calibradas por Ley de Little: se midió la ocupación\n    # real (L = lambda * W) simulando con capacidad artificialmente ilimitada\n    # durante 40 años, y se dimensionó cada recurso por encima del percentil\n    # 90-95 de ocupación observada (no sólo de la media: los tiempos de\n    # reparación tienen varianza alta, y dimensionar sólo por la media\n    # produce inestabilidad -colas que crecen sin límite- a largo plazo).\n    cfg.BAHIA_URGENTE_CAPACIDAD = 12\n    cfg.BAHIAS_CAPACIDAD = {\n        \"Espera_Repuestos\": 20,\n        \"Banco_Ensayo_Sobrecarga\": 1,\n        \"Bahia_Reparacion\": 20,\n        \"Bahia_Reconstruccion_PostIncidente\": 3,\n    }\n    cfg.BAHIA_ALIAS = {\"Bahia_Reparacion_PostIncidente\": \"Bahia_Reparacion\"}\n    cfg.POOL_ESTACION = {\n        \"Inspeccion_Tecnica\": \"Equipo_Tecnico\",\n        \"Valoracion_Preliminar\": \"Equipo_Tecnico\",\n    }\n    cfg.BAHIA_URGENTE_CAPTURA = {\"Critico\": \"Recepcion\", \"Grave\": \"Inspeccion_Tecnica\"}\n\n    cfg.CONTENCION_MODE = \"partitioned\"     # \"partitioned\" (línea base) o \"pooled\" (Escenario C)\n    cfg.CONTENCION_CRITICO_CAPACIDAD = 2\n    cfg.CONTENCION_GRAVE_CAPACIDAD = 1\n    cfg.CONTENCION_BASE_CAPACIDAD = 1\n    cfg.CONTENCION_TOTAL_CAPACIDAD = (cfg.CONTENCION_CRITICO_CAPACIDAD\n                                       + cfg.CONTENCION_GRAVE_CAPACIDAD\n                                       + cfg.CONTENCION_BASE_CAPACIDAD)  # 4\n    cfg.LIMITE_ESPERA_CONTENCION = 1.0   # días\n\n    cfg.TIEMPOS_SERVICIO = {\n        \"Recepcion\":                     {t: 0.02 for t in TIPOS},\n        \"Inspeccion_Tecnica\":            {t: 0.25 for t in TIPOS},\n        \"Espera_Repuestos\": {\n            \"Programado\": 5.0, \"Leve\": 7.0, \"Grave\": 10.0, \"Critico\": 4.0,\n        },\n        \"Diagnostico_Electrico\":         {t: 0.15 for t in TIPOS},\n        \"Diagnostico_END\":               {t: 2.5 for t in TIPOS},\n        \"Consulta_Ingeniero_Fiabilidad\": {t: 0.25 for t in TIPOS},\n        \"Valoracion_Preliminar\":         {\"Programado\": 0.25, \"Leve\": 0.25, \"Grave\": 0.30, \"Critico\": 0.30},\n        \"Banco_Ensayo_Sobrecarga\":       {\"Grave\": 0.30, \"Critico\": 0.30},\n        \"Bahia_Reparacion\": {\n            \"Programado\": 3.0, \"Leve\": 6.0, \"Grave\": 15.0, \"Critico\": 20.0,\n        },\n        \"Bahia_Reparacion_PostIncidente\": {\n            \"Programado\": 2.0, \"Leve\": 3.0, \"Grave\": 5.0, \"Critico\": 7.0,\n        },\n        \"Contencion_Emergencia\": {\n            \"Programado\": 2.0, \"Leve\": 2.0, \"Grave\": 4.0, \"Critico\": 5.0,\n        },\n        \"Bahia_Reconstruccion_PostIncidente\": {t: 10.0 for t in TIPOS},\n        \"Puesta_En_Marcha\":              {t: 0.5 for t in TIPOS},\n        \"Monitorizacion_Leve\":           {\"Leve\": 2.0},\n        \"Monitorizacion_Grave\":          {\"Grave\": 3.0},\n        \"Monitorizacion_Critico\":        {\"Critico\": 5.0},\n    }\n\n    cfg.PROB_DERIVACION = {\n        \"Recepcion\": {t: {\"Inspeccion_Tecnica\": 1.0} for t in TIPOS},\n\n        \"Inspeccion_Tecnica\": {\n            \"Programado\": {\"Espera_Repuestos\": 1.0},\n            \"Leve\":       {\"Espera_Repuestos\": 1.0},\n            \"Grave\":      {\"Diagnostico_Electrico\": 0.40, \"Diagnostico_END\": 0.30,\n                            \"Consulta_Ingeniero_Fiabilidad\": 0.10, \"Banco_Ensayo_Sobrecarga\": 0.10,\n                            \"Contencion_Emergencia\": 0.10},\n            \"Critico\":    {\"Diagnostico_Electrico\": 0.25, \"Consulta_Ingeniero_Fiabilidad\": 0.10,\n                            \"Banco_Ensayo_Sobrecarga\": 0.25, \"Contencion_Emergencia\": 0.40},\n        },\n\n        # Espera_Repuestos cumple DOS papeles: espera de repuestos DE ENTRADA\n        # (Programado/Leve, antes de iniciar el diagnóstico) y espera de\n        # repuestos DE CIERRE (Grave/Critico, ya avanzada la reparación,\n        # antes de la puesta en marcha final o de una nueva intervención).\n        \"Espera_Repuestos\": {\n            \"Programado\": {\"Diagnostico_Electrico\": 1.0},\n            \"Leve\":       {\"Diagnostico_Electrico\": 1.0},\n            \"Grave\":      {\"Puesta_En_Marcha\": 0.55, \"Bahia_Reparacion\": 0.30, \"Baja_Definitiva\": 0.15},\n            \"Critico\":    {\"Puesta_En_Marcha\": 0.45, \"Bahia_Reparacion\": 0.25, \"Baja_Definitiva\": 0.30},\n        },\n\n        \"Diagnostico_Electrico\": {\n            \"Programado\": {\"Valoracion_Preliminar\": 0.85, \"Diagnostico_END\": 0.15},\n            \"Leve\":       {\"Valoracion_Preliminar\": 0.70, \"Diagnostico_END\": 0.30},\n            \"Grave\":      {\"Diagnostico_END\": 0.35, \"Consulta_Ingeniero_Fiabilidad\": 0.25,\n                            \"Valoracion_Preliminar\": 0.40},\n            \"Critico\":    {\"Diagnostico_END\": 0.20, \"Consulta_Ingeniero_Fiabilidad\": 0.15,\n                            \"Banco_Ensayo_Sobrecarga\": 0.25, \"Valoracion_Preliminar\": 0.40},\n        },\n\n        \"Diagnostico_END\": {t: {\"Valoracion_Preliminar\": 1.0} for t in TIPOS},\n\n        \"Consulta_Ingeniero_Fiabilidad\": {\n            \"Grave\":   {\"Valoracion_Preliminar\": 0.60, \"Banco_Ensayo_Sobrecarga\": 0.40},\n            \"Critico\": {\"Banco_Ensayo_Sobrecarga\": 0.50, \"Contencion_Emergencia\": 0.30,\n                        \"Valoracion_Preliminar\": 0.20},\n        },\n\n        \"Valoracion_Preliminar\": {\n            \"Programado\": {\"Bahia_Reparacion\": 0.55, \"Puesta_En_Marcha\": 0.45},\n            \"Leve\":       {\"Bahia_Reparacion\": 0.40, \"Puesta_En_Marcha\": 0.40, \"Monitorizacion_Leve\": 0.20},\n            \"Grave\":      {\"Bahia_Reparacion\": 0.35, \"Espera_Repuestos\": 0.15, \"Monitorizacion_Grave\": 0.20,\n                            \"Baja_Definitiva\": 0.20, \"Perdida_Total\": 0.05, \"Consulta_Ingeniero_Fiabilidad\": 0.05},\n            \"Critico\":    {\"Contencion_Emergencia\": 0.25, \"Bahia_Reparacion\": 0.20, \"Espera_Repuestos\": 0.10,\n                            \"Monitorizacion_Critico\": 0.15, \"Baja_Definitiva\": 0.20, \"Perdida_Total\": 0.05,\n                            \"Banco_Ensayo_Sobrecarga\": 0.05},\n        },\n\n        \"Banco_Ensayo_Sobrecarga\": {\n            \"Grave\":   {\"Contencion_Emergencia\": 0.15, \"Espera_Repuestos\": 0.59,\n                        \"Baja_Definitiva\": 0.20, \"Perdida_Total\": 0.06},\n            \"Critico\": {\"Contencion_Emergencia\": 0.45, \"Espera_Repuestos\": 0.27,\n                        \"Baja_Definitiva\": 0.20, \"Perdida_Total\": 0.08},\n        },\n\n        \"Monitorizacion_Leve\":    {\"Leve\": {\"Puesta_En_Marcha\": 0.65, \"Monitorizacion_Leve\": 0.20,\n                                             \"Bahia_Reparacion\": 0.15}},\n        \"Monitorizacion_Grave\":   {\"Grave\": {\"Puesta_En_Marcha\": 0.30, \"Monitorizacion_Grave\": 0.25,\n                                              \"Bahia_Reparacion\": 0.25, \"Baja_Definitiva\": 0.17,\n                                              \"Perdida_Total\": 0.03}},\n        \"Monitorizacion_Critico\": {\"Critico\": {\"Monitorizacion_Critico\": 0.10, \"Bahia_Reparacion\": 0.40,\n                                                \"Contencion_Emergencia\": 0.25, \"Baja_Definitiva\": 0.20,\n                                                \"Perdida_Total\": 0.05}},\n\n        \"Bahia_Reparacion\": {\n            \"Programado\": {\"Puesta_En_Marcha\": 0.55, \"Bahia_Reparacion\": 0.30,\n                            \"Espera_Repuestos\": 0.10, \"Baja_Definitiva\": 0.05},\n            \"Leve\":       {\"Puesta_En_Marcha\": 0.50, \"Bahia_Reparacion\": 0.26, \"Espera_Repuestos\": 0.10,\n                            \"Contencion_Emergencia\": 0.05, \"Baja_Definitiva\": 0.08, \"Perdida_Total\": 0.01},\n            \"Grave\":      {\"Puesta_En_Marcha\": 0.35, \"Bahia_Reparacion\": 0.26, \"Espera_Repuestos\": 0.12,\n                            \"Contencion_Emergencia\": 0.10, \"Baja_Definitiva\": 0.14, \"Perdida_Total\": 0.03},\n            \"Critico\":    {\"Puesta_En_Marcha\": 0.25, \"Bahia_Reparacion\": 0.20, \"Espera_Repuestos\": 0.10,\n                            \"Contencion_Emergencia\": 0.15, \"Baja_Definitiva\": 0.24, \"Perdida_Total\": 0.06},\n        },\n\n        \"Contencion_Emergencia\": {\n            \"Programado\": {\"Bahia_Reparacion_PostIncidente\": 0.90, \"Baja_Definitiva\": 0.05, \"Perdida_Total\": 0.05},\n            \"Leve\":       {\"Bahia_Reparacion_PostIncidente\": 0.90, \"Baja_Definitiva\": 0.05, \"Perdida_Total\": 0.05},\n            \"Grave\":      {\"Bahia_Reparacion_PostIncidente\": 0.73, \"Baja_Definitiva\": 0.15, \"Perdida_Total\": 0.12},\n            \"Critico\":    {\"Bahia_Reparacion_PostIncidente\": 0.62, \"Baja_Definitiva\": 0.20, \"Perdida_Total\": 0.18},\n        },\n\n        \"Bahia_Reparacion_PostIncidente\": {\n            \"Programado\": {\"Puesta_En_Marcha\": 0.40, \"Bahia_Reconstruccion_PostIncidente\": 0.60},\n            \"Leve\":       {\"Puesta_En_Marcha\": 0.55, \"Bahia_Reconstruccion_PostIncidente\": 0.45},\n            \"Grave\":      {\"Puesta_En_Marcha\": 0.45, \"Bahia_Reconstruccion_PostIncidente\": 0.55},\n            \"Critico\":    {\"Puesta_En_Marcha\": 0.35, \"Bahia_Reconstruccion_PostIncidente\": 0.65},\n        },\n\n        \"Bahia_Reconstruccion_PostIncidente\": {t: {\"Puesta_En_Marcha\": 0.80, \"Baja_Definitiva\": 0.20} for t in TIPOS},\n\n        \"Puesta_En_Marcha\": {t: {\"Operativo\": 1.0} for t in TIPOS},\n    }\n\n    cfg.COSTES_FIJOS = {}   # el protocolo actual no tiene coste fijo adicional\n    return cfg\n\n\ndef construir_config_ia_predictiva():\n    cfg = construir_config_base()\n    cfg.nombre = \"Escenario A - Mantenimiento Predictivo basado en IA\"\n\n    # 1) Tiempos de servicio: el gemelo digital acelera drásticamente los\n    #    ensayos no destructivos y agiliza la lectura del ingeniero de fiabilidad.\n    cfg.TIEMPOS_SERVICIO = copy.deepcopy(cfg.TIEMPOS_SERVICIO)\n    for tipo in cfg.TIEMPOS_SERVICIO[\"Diagnostico_END\"]:\n        cfg.TIEMPOS_SERVICIO[\"Diagnostico_END\"][tipo] *= 0.55\n    for tipo in cfg.TIEMPOS_SERVICIO[\"Consulta_Ingeniero_Fiabilidad\"]:\n        cfg.TIEMPOS_SERVICIO[\"Consulta_Ingeniero_Fiabilidad\"][tipo] *= 0.65\n\n    # 2) Derivaciones: el diagnóstico predictivo detecta antes el alcance real\n    #    de la avería -> menos Perdida_Total y menos Baja_Definitiva para\n    #    Grave/Critico.\n    cfg.PROB_DERIVACION = copy.deepcopy(cfg.PROB_DERIVACION)\n    cfg.PROB_DERIVACION[\"Valoracion_Preliminar\"][\"Grave\"] = {\n        \"Bahia_Reparacion\": 0.50, \"Espera_Repuestos\": 0.15, \"Monitorizacion_Grave\": 0.20,\n        \"Baja_Definitiva\": 0.10, \"Perdida_Total\": 0.02, \"Consulta_Ingeniero_Fiabilidad\": 0.03,\n    }\n    cfg.PROB_DERIVACION[\"Valoracion_Preliminar\"][\"Critico\"] = {\n        \"Contencion_Emergencia\": 0.25, \"Bahia_Reparacion\": 0.33, \"Espera_Repuestos\": 0.10,\n        \"Monitorizacion_Critico\": 0.15, \"Baja_Definitiva\": 0.10, \"Perdida_Total\": 0.02,\n        \"Banco_Ensayo_Sobrecarga\": 0.05,\n    }\n\n    # 3) Coste del escenario\n    cfg.COSTES_FIJOS = {\"licencia_gemelo_digital_anual\": 54_000}\n    return cfg\n\n\n\ndef construir_config_respuesta_rapida():\n    cfg = construir_config_base()\n    cfg.nombre = \"Escenario B - Equipo de Respuesta Rápida\"\n\n    # 1) Nuevo recurso: segundo equipo técnico, dedicado en exclusiva a las\n    #    averías críticas.\n    cfg.SERVIDORES_CAPACIDAD = copy.deepcopy(cfg.SERVIDORES_CAPACIDAD)\n    cfg.SERVIDORES_CAPACIDAD[\"Equipo_Respuesta_Rapida\"] = 1\n\n    # 2) Nueva estación de inspección inicial para Critico, atendida por este\n    #    equipo dedicado, independiente de \"Equipo_Tecnico\".\n    cfg.POOL_ESTACION = copy.deepcopy(cfg.POOL_ESTACION)\n    cfg.POOL_ESTACION[\"Inspeccion_Tecnica_RR\"] = \"Equipo_Respuesta_Rapida\"\n\n    cfg.TIEMPOS_SERVICIO = copy.deepcopy(cfg.TIEMPOS_SERVICIO)\n    cfg.TIEMPOS_SERVICIO[\"Inspeccion_Tecnica_RR\"] = {\"Critico\": 0.08}\n\n    # 3) Derivaciones: Critico entra ahora por la vía rápida en lugar de\n    #    compartir \"Equipo_Tecnico\" con el resto de perfiles.\n    cfg.PROB_DERIVACION = copy.deepcopy(cfg.PROB_DERIVACION)\n    cfg.PROB_DERIVACION[\"Recepcion\"][\"Critico\"] = {\"Inspeccion_Tecnica_RR\": 1.0}\n    cfg.PROB_DERIVACION[\"Inspeccion_Tecnica_RR\"] = {\n        \"Critico\": {\"Diagnostico_Electrico\": 0.20, \"Consulta_Ingeniero_Fiabilidad\": 0.10,\n                    \"Banco_Ensayo_Sobrecarga\": 0.25, \"Contencion_Emergencia\": 0.45},\n    }\n\n    # 4) Coste del escenario\n    cfg.COSTES_FIJOS = {\"personal_respuesta_rapida_anual\": 46_000}\n    return cfg\n\n\n\ndef construir_config_contencion_dinamica():\n    cfg = construir_config_base()\n    cfg.nombre = \"Escenario C - Gestión Dinámica de Contención de Emergencia\"\n    cfg.CONTENCION_MODE = \"pooled\"   # único cambio real: pool único con prioridad por gravedad\n    # cfg.CONTENCION_TOTAL_CAPACIDAD se mantiene IGUAL que en la línea base (4\n    # plazas): no se añade ninguna plaza nueva, sólo se reorganiza su gestión.\n    cfg.COSTES_FIJOS = {\"reorganizacion_unica\": 5_000}   # coste único, no anual\n    return cfg\n\nESCENARIOS_POR_DEFECTO = {\n    \"Línea base\": construir_config_base,\n    \"A · IA predictiva\": construir_config_ia_predictiva,\n    \"B · Respuesta rápida\": construir_config_respuesta_rapida,\n    \"C · Contención compartida\": construir_config_contencion_dinamica,\n}\n\n\ndef combinar_configs(*cfgs, nombre=None, base=None):\n    \"\"\"Configuración que aplica sobre `base` (línea base por defecto) todos los cambios que cada\n    escenario de `cfgs` introduce respecto a esa base (a nivel de fila de las tablas).\"\"\"\n    base = base if base is not None else construir_config_base()\n    out = Config.from_dict(base.to_dict())\n    for c in cfgs:\n        for attr, val in vars(c).items():\n            if attr in (\"nombre\", \"descripcion\"):\n                continue\n            if attr == \"COSTES_FIJOS\":\n                out.COSTES_FIJOS = {**out.COSTES_FIJOS, **val}\n                continue\n            bval = getattr(base, attr, None)\n            if isinstance(val, dict) and isinstance(bval, dict):\n                actual = getattr(out, attr)\n                for k, v in val.items():\n                    if k not in bval:\n                        actual[k] = copy.deepcopy(v)\n                    elif v != bval[k]:\n                        if isinstance(v, dict) and isinstance(bval[k], dict):\n                            for k2, v2 in v.items():\n                                if bval[k].get(k2) != v2:\n                                    actual[k][k2] = copy.deepcopy(v2)\n                        else:\n                            actual[k] = copy.deepcopy(v)\n            elif val != bval:\n                setattr(out, attr, copy.deepcopy(val))\n    out.nombre = nombre or \" + \".join(getattr(c, \"nombre\", \"?\") for c in cfgs)\n    return out\n",
