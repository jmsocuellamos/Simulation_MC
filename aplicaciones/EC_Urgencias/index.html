  <div id="carga">
    <h1>🏥 Simulador de la red de colas de Urgencias</h1>
    <p>Cargando Python en el navegador e instalando los paquetes (SimPy, pandas, SciPy, matplotlib…).
       La primera vez puede tardar uno o dos minutos; después el navegador lo guarda en caché.</p>
    <div class="barra"><div></div></div>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
    const ficheros = {
 "app.py": "# -*- coding: utf-8 -*-\n\"\"\"Simulador de la red de colas del Servicio de Urgencias · aplicación Streamlit.\n\nEjecutar con:   streamlit run app.py\n\"\"\"\nimport copy\nimport datetime\nimport io\nimport json\nimport math\nimport os\nimport sys\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\nimport matplotlib.pyplot as plt\n\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\nimport motor                      # noqa: E402\nimport kpis                       # noqa: E402\nimport validacion                 # noqa: E402\nimport graficos as gr             # noqa: E402\nimport informe                    # noqa: E402\n\nst.set_page_config(page_title=\"Simulador · Red de colas de Urgencias\", page_icon=\"🏥\", layout=\"wide\")\n\nTIPOS = motor.TIPOS\n# En el navegador (stlite/Pyodide, p. ej. GitHub Pages) no hay procesos paralelos y el cálculo es más lento\nEN_NAVEGADOR = sys.platform == \"emscripten\"\nDESCRIPCIONES = {\n    \"Línea base\": \"Protocolo actualmente vigente.\",\n    \"A · IA\": \"Asistente de diagnóstico por IA: −30% de tiempo en Diagnóstico Inicial, −25% en Diagnóstico \"\n              \"Preliminar y menos Pruebas Avanzadas para Verde/Amarillo/Naranja. Licencia de 480.000 €/año.\",\n    \"B · Fast-Track\": \"Circuito rápido con 3 facultativos propios para el 70% de los Verde y el 30% de los Amarillo. \"\n                      \"Coste de personal de 310.000 €/año.\",\n    \"C · UCI compartida\": \"Las 79 camas de UCI pasan a una única bolsa con prioridad Rojo > Naranja > Amarillo. \"\n                          \"Formación con coste único de 45.000 €.\",\n}\n\n\n# ==============================================================================================\n# Estado de la sesión\n# ==============================================================================================\ndef escenarios_por_defecto():\n    out = {}\n    for nombre, constructor in motor.ESCENARIOS_POR_DEFECTO.items():\n        cfg = constructor()\n        cfg.nombre = nombre\n        cfg.descripcion = DESCRIPCIONES.get(nombre, \"\")\n        out[nombre] = cfg.to_dict()\n    return out\n\n\ndef comunes_por_defecto():\n    param = copy.deepcopy(kpis.PARAM)\n    param[\"TRAMOS_MARGEN\"] = [list(t) for t in param[\"TRAMOS_MARGEN\"]]\n    return {\"llegadas\": motor.llegadas_a_lista(motor.LLEGADAS_HORARIAS), \"param\": param}\n\n\ndef ajustes_por_defecto():\n    return {\"n_sim\": 10 if EN_NAVEGADOR else 50, \"dias\": 180, \"semilla\": 1000, \"warmup\": 10, \"cooldown\": 10,\n            \"paralelo\": not EN_NAVEGADOR, \"n_procesos\": max(1, (os.cpu_count() or 2) - 1)}\n\n\ndef iniciar_estado(forzar=False):\n    ss = st.session_state\n    if forzar or \"escenarios\" not in ss:\n        ss.escenarios = escenarios_por_defecto()\n        ss.comunes = comunes_por_defecto()\n        ss.ajustes = ajustes_por_defecto()\n        ss.version = ss.get(\"version\", 0) + 1\n        ss.esc_activo = \"Línea base\"\n    ss.setdefault(\"resultados\", None)\n    ss.setdefault(\"informe_bytes\", None)\n\n\niniciar_estado()\nss = st.session_state\n\n\ndef clave(*partes):\n    \"\"\"Clave de widget ligada a la versión del estado (al restablecer/importar, los widgets se reinician).\"\"\"\n    return f\"v{ss.version}__\" + \"__\".join(str(p) for p in partes)\n\n\ndef editor(key, factoria, **kw):\n    \"\"\"st.data_editor con datos iniciales estables (se crean una sola vez por clave).\"\"\"\n    k0 = \"ini__\" + key\n    if k0 not in ss:\n        ss[k0] = factoria()\n    return st.data_editor(ss[k0], key=key, **kw)\n\n\ndef _f(x, defecto=None):\n    try:\n        if x is None or (isinstance(x, float) and np.isnan(x)):\n            return defecto\n        return float(x)\n    except (TypeError, ValueError):\n        return defecto\n\n\n# ==============================================================================================\n# Barra lateral: ajustes de simulación, ejecución y gestión de la configuración\n# ==============================================================================================\nwith st.sidebar:\n    st.header(\"⚙️ Simulación\")\n    aj = ss.ajustes\n    aj[\"n_sim\"] = st.number_input(\"Nº de réplicas por escenario\", 1, 1000, aj[\"n_sim\"], key=clave(\"n_sim\"))\n    aj[\"dias\"] = st.number_input(\"Días por réplica\", 30, 3650, aj[\"dias\"], key=clave(\"dias\"))\n    aj[\"semilla\"] = st.number_input(\"Semilla de inicialización\", 0, 10**9, aj[\"semilla\"], key=clave(\"semilla\"),\n                                    help=\"La réplica i de todos los escenarios usa la semilla + i (números aleatorios \"\n                                         \"comunes), lo que permite comparaciones pareadas.\")\n    c1, c2 = st.columns(2)\n    aj[\"warmup\"] = c1.number_input(\"Calentamiento (días)\", 0, 365, aj[\"warmup\"], key=clave(\"warmup\"),\n                                   help=\"Días iniciales descartados (el sistema arranca vacío).\")\n    aj[\"cooldown\"] = c2.number_input(\"Cierre (días)\", 0, 365, aj[\"cooldown\"], key=clave(\"cooldown\"),\n                                     help=\"Días finales descartados (episodios sin terminar).\")\n    if EN_NAVEGADOR:\n        aj[\"paralelo\"] = False\n        st.caption(\"🌐 Versión web: las réplicas se ejecutan en tu navegador, una tras otra. Cada réplica de 180 \"\n                   \"días tarda varios segundos; para estudios de 50 réplicas por escenario usa la versión local \"\n                   \"(streamlit run app.py) o ten paciencia y no cierres la pestaña.\")\n    else:\n        aj[\"paralelo\"] = st.checkbox(\"Ejecutar réplicas en paralelo\", aj[\"paralelo\"], key=clave(\"paralelo\"))\n    if aj[\"paralelo\"]:\n        aj[\"n_procesos\"] = st.slider(\"Procesos\", 1, max(1, os.cpu_count() or 1), min(aj[\"n_procesos\"], os.cpu_count() or 1),\n                                     key=clave(\"nproc\"))\n\n    st.divider()\n    nombres = list(ss.escenarios)\n    seleccion = st.multiselect(\"Escenarios a simular\", nombres, default=nombres, key=clave(\"sel\", len(nombres)))\n    ref = st.selectbox(\"Escenario de referencia\", seleccion or nombres,\n                       index=(seleccion or nombres).index(\"Línea base\") if \"Línea base\" in (seleccion or nombres) else 0,\n                       key=clave(\"ref\", len(nombres)), help=\"Base de todas las comparaciones pareadas.\")\n    total_rep = aj[\"n_sim\"] * len(seleccion)\n    st.caption(f\"Se simularán {total_rep} réplicas de {aj['dias']} días en total.\")\n    ejecutar = st.button(\"▶️ Ejecutar simulación\", type=\"primary\", use_container_width=True, disabled=not seleccion)\n\n    st.divider()\n    st.header(\"💾 Configuración\")\n    conf_json = json.dumps({\"version_app\": 1, \"ajustes\": ss.ajustes, \"comunes\": ss.comunes,\n                            \"escenarios\": ss.escenarios}, ensure_ascii=False, indent=1)\n    st.download_button(\"Descargar configuración (JSON)\", conf_json, \"configuracion_urgencias.json\",\n                       \"application/json\", use_container_width=True)\n    fichero = st.file_uploader(\"Cargar configuración (JSON)\", type=\"json\", key=clave(\"upload\"))\n    if fichero is not None and ss.get(\"ultimo_json\") != fichero.file_id:\n        try:\n            datos = json.load(fichero)\n            ss.escenarios = datos[\"escenarios\"]\n            ss.comunes = datos[\"comunes\"]\n            ss.ajustes = {**ajustes_por_defecto(), **datos.get(\"ajustes\", {})}\n            ss.ultimo_json = fichero.file_id\n            ss.version += 1\n            ss.esc_activo = next(iter(ss.escenarios))\n            st.rerun()\n        except Exception as e:\n            st.error(f\"No se pudo cargar el fichero: {e}\")\n    if st.button(\"Restablecer valores por defecto\", use_container_width=True):\n        iniciar_estado(forzar=True)\n        st.rerun()\n\n\n# ==============================================================================================\n# Cabecera\n# ==============================================================================================\nst.title(\"🏥 Simulador de la red de colas del Servicio de Urgencias\")\nst.caption(\"Hospital Universitario Vega del Segura · gemelo digital (SimPy) del protocolo de Urgencias y de sus \"\n           \"escenarios de mejora. Configura los parámetros comunes y los de cada escenario, ejecuta la simulación \"\n           \"Monte Carlo desde la barra lateral y genera el informe Word.\")\n\ntab_com, tab_esc, tab_res, tab_inf = st.tabs([\"🌐 Parámetros comunes\", \"🏥 Escenarios\", \"📊 Resultados\", \"📄 Informe\"])\n\n\n# ==============================================================================================\n# 1) Parámetros comunes\n# ==============================================================================================\nwith tab_com:\n    st.subheader(\"Parámetros comunes a todos los escenarios\")\n    st.caption(\"Estos parámetros (demanda de pacientes, tarifas, costes y SLAs) son los mismos para todos los \"\n               \"escenarios: así las diferencias entre escenarios se deben únicamente a sus cambios de protocolo.\")\n    com = ss.comunes\n    par = com[\"param\"]\n\n    st.markdown(\"#### 🕒 Llegadas por franja horaria\")\n    st.caption(\"Tasa de llegadas (pacientes/hora) y reparto por perfil (%). Las franjas deben cubrir las 24 horas \"\n               \"sin solaparse; una franja con Inicio > Fin cruza la medianoche (p. ej., 22 → 7).\")\n    lleg = editor(clave(\"llegadas\"), lambda: pd.DataFrame(\n        [{**{k: r[k] for k in (\"Inicio\", \"Fin\", \"Tasa\")}, **{f\"% {t}\": 100 * r[t] for t in TIPOS}} for r in com[\"llegadas\"]]),\n        num_rows=\"dynamic\", use_container_width=True, hide_index=True,\n        column_config={\"Inicio\": st.column_config.NumberColumn(\"Inicio (h)\", min_value=0, max_value=23, step=1),\n                       \"Fin\": st.column_config.NumberColumn(\"Fin (h)\", min_value=0, max_value=24, step=1),\n                       \"Tasa\": st.column_config.NumberColumn(\"Tasa (pac/h)\", min_value=0.0, step=0.1, format=\"%.2f\"),\n                       **{f\"% {t}\": st.column_config.NumberColumn(f\"% {t}\", min_value=0.0, max_value=100.0, format=\"%.1f\")\n                          for t in TIPOS}})\n    nueva = []\n    for _, r in lleg.dropna(subset=[\"Inicio\", \"Fin\", \"Tasa\"]).iterrows():\n        nueva.append({\"Inicio\": int(r[\"Inicio\"]), \"Fin\": int(r[\"Fin\"]), \"Tasa\": float(r[\"Tasa\"]),\n                      **{t: _f(r[f\"% {t}\"], 0.0) / 100 for t in TIPOS}})\n    com[\"llegadas\"] = nueva\n    err_lleg = validacion.validar_llegadas(nueva)\n    for e in err_lleg:\n        st.error(e)\n    if not err_lleg:\n        media = sum(r[\"Tasa\"] * ((r[\"Fin\"] - r[\"Inicio\"]) % 24) for r in nueva) / 24\n        st.success(f\"Franjas correctas · llegada media de {media:.2f} pacientes/hora ({media * 24:.0f} al día).\")\n\n    st.markdown(\"#### 💶 Parámetros económicos\")\n    c1, c2, c3 = st.columns(3)\n    with c1:\n        st.markdown(\"**Reembolso por alta (€)**\")\n        reem = editor(clave(\"reembolso\"), lambda: pd.DataFrame({\"Perfil\": TIPOS, \"Reembolso (€)\": [par[\"REEMBOLSO\"][t] for t in TIPOS]}),\n                      hide_index=True, use_container_width=True, disabled=[\"Perfil\"])\n        par[\"REEMBOLSO\"] = {r[\"Perfil\"]: _f(r[\"Reembolso (€)\"], 0.0) for _, r in reem.iterrows()}\n        st.markdown(\"**Penalizaciones (€)**\")\n        par[\"PEN_FALLECE\"] = st.number_input(\"Por fallecimiento\", 0.0, value=float(par[\"PEN_FALLECE\"]), step=500.0, key=clave(\"pen1\"))\n        par[\"PEN_SIN_UCI\"] = st.number_input(\"Adicional si es por falta de cama UCI\", 0.0, value=float(par[\"PEN_SIN_UCI\"]),\n                                             step=500.0, key=clave(\"pen2\"))\n    with c2:\n        st.markdown(\"**Coste por servicio o procedimiento (€)**\")\n        cs = editor(clave(\"coste_serv\"), lambda: pd.DataFrame({\"Estación\": list(par[\"COSTE_SERVICIO\"]),\n                                                                \"Coste (€)\": list(par[\"COSTE_SERVICIO\"].values())}),\n                    hide_index=True, use_container_width=True, num_rows=\"dynamic\")\n        par[\"COSTE_SERVICIO\"] = {r[\"Estación\"]: _f(r[\"Coste (€)\"], 0.0) for _, r in cs.iterrows() if r[\"Estación\"]}\n        st.markdown(\"**Coste por día de estancia (€/día)**\")\n        cd = editor(clave(\"coste_dia\"), lambda: pd.DataFrame({\"Estación\": list(par[\"COSTE_DIA\"]),\n                                                               \"Coste (€/día)\": list(par[\"COSTE_DIA\"].values())}),\n                    hide_index=True, use_container_width=True, num_rows=\"dynamic\")\n        par[\"COSTE_DIA\"] = {r[\"Estación\"]: _f(r[\"Coste (€/día)\"], 0.0) for _, r in cd.iterrows() if r[\"Estación\"]}\n    with c3:\n        st.markdown(\"**Margen exigido según la tasa de altas**\")\n        tr = editor(clave(\"tramos\"), lambda: pd.DataFrame({\"Tasa de altas > (%)\": [100 * u for u, _ in par[\"TRAMOS_MARGEN\"]],\n                                                            \"Margen exigido (%)\": [100 * m for _, m in par[\"TRAMOS_MARGEN\"]]}),\n                    hide_index=True, use_container_width=True, num_rows=\"dynamic\")\n        tr = tr.dropna()\n        par[\"TRAMOS_MARGEN\"] = sorted([[float(a) / 100, float(b) / 100] for a, b in zip(tr.iloc[:, 0], tr.iloc[:, 1])], reverse=True)\n        par[\"MARGEN_MINIMO\"] = st.number_input(\"Margen exigido en el resto de casos (%)\", 0.0, 100.0,\n                                               100 * float(par[\"MARGEN_MINIMO\"]), 0.5, key=clave(\"mmin\")) / 100\n\n    st.markdown(\"#### 🏆 Acuerdos de nivel de servicio (SLAs)\")\n    c1, c2, c3, c4, c5 = st.columns(5)\n    par[\"SLA_LATENCIA_H\"] = c1.number_input(\"SLA1 · latencia máx. N/R (min)\", 1.0, 600.0, par[\"SLA_LATENCIA_H\"] * 60, 1.0,\n                                            key=clave(\"sla1\")) / 60\n    par[\"SLA_LATENCIA_CUMPL\"] = c1.number_input(\"SLA1 · % pacientes que deben cumplirla\", 1.0, 100.0,\n                                                par[\"SLA_LATENCIA_CUMPL\"] * 100, 1.0, key=clave(\"sla1b\")) / 100\n    par[\"SLA_RATIO_ESPERA\"] = c2.number_input(\"SLA2 · ratio de espera máx. V/A (%)\", 1.0, 100.0, par[\"SLA_RATIO_ESPERA\"] * 100,\n                                              1.0, key=clave(\"sla2\")) / 100\n    par[\"SLA_OCUP_UCI\"] = c3.number_input(\"SLA3 · ocupación máx. UCI (%)\", 1.0, 100.0, par[\"SLA_OCUP_UCI\"] * 100, 1.0,\n                                          key=clave(\"sla3\")) / 100\n    par[\"SLA_SIN_UCI\"] = c4.number_input(\"SLA4 · mortalidad Sin_UCI máx. N/R (%)\", 0.0, 100.0, par[\"SLA_SIN_UCI\"] * 100, 0.1,\n                                         key=clave(\"sla4\")) / 100\n    c5.info(\"SLA5 · margen neto ≥ margen exigido (según los tramos de la tabla económica).\")\n\n\n# ==============================================================================================\n# 2) Escenarios\n# ==============================================================================================\ndef tabla_tiempos(cfg_d, horas):\n    \"\"\"Tabla editable de tiempos de servicio. horas=True → estancias (h); False → atención (min).\"\"\"\n    camas = set(cfg_d[\"CAMAS_CAPACIDAD\"]) | set(cfg_d[\"CAMA_ALIAS\"]) | {\"UCI\"}\n    filas = []\n    for est, por_tipo in cfg_d[\"TIEMPOS_SERVICIO\"].items():\n        larga = est in camas or motor.es_observacion(est)\n        if larga != horas:\n            continue\n        filas.append({\"Estación\": est, **{t: (por_tipo.get(t) if horas else (None if por_tipo.get(t) is None else por_tipo[t] * 60))\n                                          for t in TIPOS}})\n    return pd.DataFrame(filas, columns=[\"Estación\"] + TIPOS)\n\n\ndef tabla_derivacion(cfg_d, estacion):\n    destinos = {}\n    for t, fila in cfg_d[\"PROB_DERIVACION\"].get(estacion, {}).items():\n        for dest, p in fila.items():\n            destinos.setdefault(dest, {})[t] = 100 * p\n    return pd.DataFrame([{\"Destino\": d, **{t: v.get(t) for t in TIPOS}} for d, v in destinos.items()],\n                        columns=[\"Destino\"] + TIPOS)\n\n\ndef editar_escenario(nombre):\n    d = ss.escenarios[nombre]\n    k = lambda *p: clave(\"esc\", nombre, *p)\n    errores, avisos = validacion.validar_config(motor.Config.from_dict(d))\n    if errores:\n        st.error(f\"La configuración tiene {len(errores)} error(es): revisa la pestaña «Validación».\")\n    elif avisos:\n        st.warning(f\"Configuración válida con {len(avisos)} aviso(s).\")\n    else:\n        st.success(\"Configuración válida.\")\n\n    t_gen, t_rec, t_uci, t_tiem, t_der, t_val = st.tabs(\n        [\"General y costes\", \"Recursos\", \"UCI y Box\", \"Tiempos de servicio\", \"Derivaciones\", \"Validación\"])\n\n    with t_gen:\n        d[\"descripcion\"] = st.text_area(\"Descripción del escenario\", d.get(\"descripcion\", \"\"), key=k(\"desc\"))\n        st.markdown(\"**Costes fijos del escenario**\")\n        st.caption(\"Marca «Anual» para los costes recurrentes (se prorratean a los días simulados); los no anuales \"\n                   \"son costes únicos (se imputan íntegros y se calcula su periodo de amortización).\")\n        cf = editor(k(\"costes\"), lambda: pd.DataFrame(\n            [{\"Concepto\": c.replace(\"_anual\", \"\"), \"Importe (€)\": v, \"Anual\": \"anual\" in c} for c, v in d.get(\"COSTES_FIJOS\", {}).items()],\n            columns=[\"Concepto\", \"Importe (€)\", \"Anual\"]), num_rows=\"dynamic\", hide_index=True, use_container_width=True,\n            column_config={\"Anual\": st.column_config.CheckboxColumn(\"Anual\", default=True),\n                           \"Importe (€)\": st.column_config.NumberColumn(min_value=0.0, step=1000.0, format=\"%.0f\")})\n        costes = {}\n        for _, r in cf.iterrows():\n            if r[\"Concepto\"] and _f(r[\"Importe (€)\"]) is not None:\n                base = str(r[\"Concepto\"]).strip().replace(\" \", \"_\")\n                costes[base + (\"_anual\" if bool(r[\"Anual\"]) else \"\")] = float(r[\"Importe (€)\"])\n        d[\"COSTES_FIJOS\"] = costes\n\n    with t_rec:\n        c1, c2 = st.columns(2)\n        with c1:\n            st.markdown(\"**Servidores** (el recurso se libera tras el servicio)\")\n            srv = editor(k(\"srv\"), lambda: pd.DataFrame({\"Servidor\": list(d[\"SERVIDORES_CAPACIDAD\"]),\n                                                          \"Capacidad\": list(d[\"SERVIDORES_CAPACIDAD\"].values())}),\n                         num_rows=\"dynamic\", hide_index=True, use_container_width=True,\n                         column_config={\"Capacidad\": st.column_config.NumberColumn(min_value=1, step=1)})\n            d[\"SERVIDORES_CAPACIDAD\"] = {str(r[\"Servidor\"]): int(r[\"Capacidad\"]) for _, r in srv.iterrows()\n                                         if r[\"Servidor\"] and _f(r[\"Capacidad\"]) is not None}\n            st.markdown(\"**Asignación estación → servidor** (si una estación no aparece, usa el servidor de su mismo nombre)\")\n            pool = editor(k(\"pool\"), lambda: pd.DataFrame({\"Estación\": list(d[\"POOL_ESTACION\"]),\n                                                            \"Servidor\": list(d[\"POOL_ESTACION\"].values())}),\n                          num_rows=\"dynamic\", hide_index=True, use_container_width=True)\n            d[\"POOL_ESTACION\"] = {str(r[\"Estación\"]): str(r[\"Servidor\"]) for _, r in pool.iterrows()\n                                  if r[\"Estación\"] and r[\"Servidor\"]}\n        with c2:\n            st.markdown(\"**Camas** (se retienen durante toda la estancia)\")\n            cam = editor(k(\"camas\"), lambda: pd.DataFrame({\"Cama\": list(d[\"CAMAS_CAPACIDAD\"]),\n                                                            \"Capacidad\": list(d[\"CAMAS_CAPACIDAD\"].values())}),\n                         num_rows=\"dynamic\", hide_index=True, use_container_width=True,\n                         column_config={\"Capacidad\": st.column_config.NumberColumn(min_value=1, step=1)})\n            d[\"CAMAS_CAPACIDAD\"] = {str(r[\"Cama\"]): int(r[\"Capacidad\"]) for _, r in cam.iterrows()\n                                    if r[\"Cama\"] and _f(r[\"Capacidad\"]) is not None}\n            st.markdown(\"**Estaciones que comparten cama** (alias → cama física)\")\n            ali = editor(k(\"alias\"), lambda: pd.DataFrame({\"Estación\": list(d[\"CAMA_ALIAS\"]), \"Cama\": list(d[\"CAMA_ALIAS\"].values())}),\n                         num_rows=\"dynamic\", hide_index=True, use_container_width=True)\n            d[\"CAMA_ALIAS\"] = {str(r[\"Estación\"]): str(r[\"Cama\"]) for _, r in ali.iterrows() if r[\"Estación\"] and r[\"Cama\"]}\n\n    with t_uci:\n        c1, c2 = st.columns(2)\n        with c1:\n            st.markdown(\"**Box de Urgencias**\")\n            d[\"BOX_CAPACIDAD\"] = int(st.number_input(\"Plazas de Box\", 1, 1000, int(d[\"BOX_CAPACIDAD\"]), key=k(\"box\")))\n            st.caption(\"Estación en la que cada perfil captura un Box (lo retiene hasta salir de Urgencias).\")\n            estaciones = sorted(set(d[\"PROB_DERIVACION\"]) - set(d[\"CAMAS_CAPACIDAD\"]) - set(d[\"CAMA_ALIAS\"]) - {\"UCI\"})\n            opciones = [\"(no captura Box)\"] + estaciones\n            captura = {}\n            for t in TIPOS:\n                actual = d[\"BOX_CAPTURA\"].get(t)\n                sel = st.selectbox(f\"{t}\", opciones, index=opciones.index(actual) if actual in opciones else 0, key=k(\"cap\", t))\n                if sel != \"(no captura Box)\":\n                    captura[t] = sel\n            d[\"BOX_CAPTURA\"] = captura\n        with c2:\n            st.markdown(\"**UCI**\")\n            modo = st.radio(\"Gestión de camas\", [\"Bolsas reservadas por gravedad\", \"Bolsa compartida con prioridad\"],\n                            index=0 if d[\"UCI_MODE\"] != \"pooled\" else 1, key=k(\"ucimodo\"),\n                            help=\"Reservadas: cada perfil solo puede usar su bolsa. Compartida: una única cola con \"\n                                 \"prioridad Rojo > Naranja > Amarillo.\")\n            d[\"UCI_MODE\"] = \"pooled\" if modo.startswith(\"Bolsa compartida\") else \"partitioned\"\n            cc1, cc2, cc3 = st.columns(3)\n            d[\"UCI_ROJO_CAPACIDAD\"] = int(cc1.number_input(\"Camas Rojo\", 1, 1000, int(d[\"UCI_ROJO_CAPACIDAD\"]), key=k(\"ur\")))\n            d[\"UCI_NARANJA_CAPACIDAD\"] = int(cc2.number_input(\"Camas Naranja\", 1, 1000, int(d[\"UCI_NARANJA_CAPACIDAD\"]), key=k(\"un\")))\n            d[\"UCI_BASE_CAPACIDAD\"] = int(cc3.number_input(\"Camas Amarillo\", 1, 1000, int(d[\"UCI_BASE_CAPACIDAD\"]), key=k(\"ub\")))\n            if d[\"UCI_MODE\"] == \"pooled\":\n                st.caption(\"En modo compartido solo se usa el total de camas (las bolsas se guardan por si se vuelve al modo reservado).\")\n                d[\"UCI_TOTAL_CAPACIDAD\"] = int(st.number_input(\"Camas totales de UCI\", 1, 3000, int(d[\"UCI_TOTAL_CAPACIDAD\"]), key=k(\"ut\")))\n            else:\n                d[\"UCI_TOTAL_CAPACIDAD\"] = d[\"UCI_ROJO_CAPACIDAD\"] + d[\"UCI_NARANJA_CAPACIDAD\"] + d[\"UCI_BASE_CAPACIDAD\"]\n                st.metric(\"Camas totales de UCI\", d[\"UCI_TOTAL_CAPACIDAD\"])\n            d[\"LIMITE_ESPERA_UCI\"] = float(st.number_input(\"Límite de espera de cama UCI (h)\", 0.5, 240.0,\n                                                           float(d[\"LIMITE_ESPERA_UCI\"]), 0.5, key=k(\"lim\")))\n\n    with t_tiem:\n        st.caption(\"Tiempo nominal de servicio por estación y perfil. El motor genera cada tiempo como \"\n                   \"U(0,75; 1,25) × valor nominal. Deja la celda vacía si el perfil no pasa por esa estación.\")\n        c1, c2 = st.columns(2)\n        with c1:\n            st.markdown(\"**Estaciones de atención (minutos)**\")\n            ta = editor(k(\"t_min\"), lambda: tabla_tiempos(d, horas=False), num_rows=\"dynamic\", hide_index=True,\n                        use_container_width=True)\n        with c2:\n            st.markdown(\"**Estancias y observación (horas)**\")\n            th = editor(k(\"t_h\"), lambda: tabla_tiempos(d, horas=True), num_rows=\"dynamic\", hide_index=True,\n                        use_container_width=True)\n        tiempos = {}\n        for tabla, factor in ((ta, 1 / 60), (th, 1.0)):\n            for _, r in tabla.iterrows():\n                if not r[\"Estación\"]:\n                    continue\n                est = str(r[\"Estación\"])\n                previo = d[\"TIEMPOS_SERVICIO\"].get(est, {})\n                fila = {}\n                for t in TIPOS:\n                    v = _f(r[t])\n                    if v is not None:\n                        v = v * factor\n                        fila[t] = previo[t] if t in previo and math.isclose(previo[t], v, rel_tol=1e-9) else v\n                if fila:\n                    tiempos[est] = fila\n        d[\"TIEMPOS_SERVICIO\"] = tiempos\n\n    with t_der:\n        st.caption(\"Probabilidades (%) de pasar de la estación de origen a cada destino, por perfil. Cada columna \"\n                   \"debe sumar 100 % (o quedar vacía si ese perfil no pasa por la estación). Destinos finales: \"\n                   \"«Alta» y «Fallece».\")\n        origenes = list(d[\"PROB_DERIVACION\"])\n        c1, c2 = st.columns([2, 1])\n        origen = c1.selectbox(\"Estación de origen\", origenes, key=k(\"origen\"))\n        nueva_est = c2.text_input(\"Añadir estación de origen\", key=k(\"nueva_est\"), placeholder=\"nombre y pulsa Intro\")\n        if nueva_est and nueva_est not in d[\"PROB_DERIVACION\"]:\n            d[\"PROB_DERIVACION\"][nueva_est] = {}\n            st.rerun()\n        der = editor(k(\"der\", origen), lambda: tabla_derivacion(d, origen), num_rows=\"dynamic\", hide_index=True,\n                     use_container_width=True,\n                     column_config={t: st.column_config.NumberColumn(f\"{t} (%)\", min_value=0.0, max_value=100.0, format=\"%.1f\")\n                                    for t in TIPOS})\n        filas = {}\n        sumas = {}\n        previo_est = d[\"PROB_DERIVACION\"].get(origen, {})\n        for t in TIPOS:\n            col = {str(r[\"Destino\"]): _f(r[t]) for _, r in der.iterrows() if r[\"Destino\"] and _f(r[t]) is not None}\n            if col and sum(col.values()) > 0:\n                previo = previo_est.get(t, {})\n                filas[t] = {dest: (previo[dest] if dest in previo and math.isclose(previo[dest], p / 100, rel_tol=1e-9)\n                                   else p / 100) for dest, p in col.items() if p > 0}\n                sumas[t] = sum(col.values())\n        d[\"PROB_DERIVACION\"][origen] = filas\n        if sumas:\n            st.write(\"Suma por perfil: \" + \" · \".join(\n                f\"{'✅' if abs(s - 100) < 1e-6 else '❌'} {t}: {s:.1f} %\" for t, s in sumas.items()))\n        if st.button(\"Eliminar esta estación de origen\", key=k(\"del_origen\")):\n            d[\"PROB_DERIVACION\"].pop(origen, None)\n            st.rerun()\n\n    with t_val:\n        cfg = motor.Config.from_dict(d)\n        errores, avisos = validacion.validar_config(cfg)\n        if not errores and not avisos:\n            st.success(\"Sin errores ni avisos.\")\n        for e in errores:\n            st.error(e)\n        for a in avisos:\n            st.warning(a)\n        st.markdown(\"**Estaciones que puede recorrer cada perfil**\")\n        st.dataframe(pd.DataFrame({t: [\", \".join(sorted(validacion.estaciones_alcanzables(cfg, t)))] for t in TIPOS},\n                                  index=[\"Estaciones\"]).T, use_container_width=True)\n        if nombre != \"Línea base\" and \"Línea base\" in ss.escenarios:\n            st.markdown(\"**Diferencias frente a la Línea base**\")\n            dif = informe.diferencias_config(motor.Config.from_dict(ss.escenarios[\"Línea base\"]), cfg)\n            st.dataframe(dif, hide_index=True, use_container_width=True) if len(dif) else st.info(\"Sin diferencias.\")\n\n\nwith tab_esc:\n    st.subheader(\"Configuración de los escenarios\")\n    nombres = list(ss.escenarios)\n    if ss.esc_activo not in nombres:\n        ss.esc_activo = nombres[0]\n    c1, c2 = st.columns([3, 2])\n    activo = c1.selectbox(\"Escenario a configurar\", nombres, index=nombres.index(ss.esc_activo), key=clave(\"activo\", len(nombres)))\n    ss.esc_activo = activo\n\n    with c2.expander(\"➕ Crear, combinar, renombrar o eliminar escenarios\"):\n        st.markdown(\"**Nuevo escenario (copia de otro)**\")\n        n_nombre = st.text_input(\"Nombre del nuevo escenario\", key=clave(\"nuevo_nombre\"))\n        origen_copia = st.selectbox(\"Copiar de\", nombres, key=clave(\"copiar_de\", len(nombres)))\n        if st.button(\"Crear copia\", key=clave(\"crear\")):\n            if not n_nombre or n_nombre in ss.escenarios:\n                st.error(\"Indica un nombre nuevo y distinto de los existentes.\")\n            else:\n                ss.escenarios[n_nombre] = copy.deepcopy(ss.escenarios[origen_copia])\n                ss.escenarios[n_nombre][\"nombre\"] = n_nombre\n                ss.esc_activo = n_nombre\n                st.rerun()\n        st.markdown(\"**Combinación de escenarios**\")\n        st.caption(\"Aplica sobre la base elegida todos los cambios que cada escenario seleccionado introduce respecto a ella.\")\n        base_comb = st.selectbox(\"Base\", nombres, index=nombres.index(\"Línea base\") if \"Línea base\" in nombres else 0,\n                                 key=clave(\"base_comb\", len(nombres)))\n        a_combinar = st.multiselect(\"Escenarios a combinar\", [n for n in nombres if n != base_comb], key=clave(\"comb\", len(nombres)))\n        nombre_comb = st.text_input(\"Nombre de la combinación\", value=\" + \".join(n.split(\" \")[0] for n in a_combinar),\n                                    key=clave(\"nombre_comb\", \"-\".join(a_combinar)))\n        if st.button(\"Crear combinación\", key=clave(\"crear_comb\"), disabled=len(a_combinar) < 2):\n            if not nombre_comb or nombre_comb in ss.escenarios:\n                st.error(\"Indica un nombre nuevo y distinto de los existentes.\")\n            else:\n                base_cfg = motor.Config.from_dict(ss.escenarios[base_comb])\n                cfgs = [motor.Config.from_dict(ss.escenarios[n]) for n in a_combinar]\n                comb = motor.combinar_configs(*cfgs, nombre=nombre_comb, base=base_cfg)\n                comb.descripcion = f\"Combinación de {', '.join(a_combinar)} sobre {base_comb}.\"\n                ss.escenarios[nombre_comb] = comb.to_dict()\n                ss.esc_activo = nombre_comb\n                st.rerun()\n        st.markdown(\"**Renombrar / eliminar el escenario activo**\")\n        renombre = st.text_input(\"Nuevo nombre\", value=activo, key=clave(\"renombrar\", activo))\n        cc1, cc2, cc3 = st.columns(3)\n        if cc1.button(\"Renombrar\", key=clave(\"btn_ren\", activo)) and renombre and renombre != activo:\n            if renombre in ss.escenarios:\n                st.error(\"Ya existe un escenario con ese nombre.\")\n            else:\n                ss.escenarios = {(renombre if n == activo else n): v for n, v in ss.escenarios.items()}\n                ss.escenarios[renombre][\"nombre\"] = renombre\n                ss.esc_activo = renombre\n                st.rerun()\n        if cc2.button(\"Eliminar\", key=clave(\"btn_del\", activo), disabled=len(nombres) <= 1):\n            ss.escenarios.pop(activo)\n            ss.esc_activo = next(iter(ss.escenarios))\n            st.rerun()\n        if cc3.button(\"Restablecer\", key=clave(\"btn_rst\", activo), disabled=activo not in motor.ESCENARIOS_POR_DEFECTO,\n                      help=\"Vuelve a los valores por defecto (solo escenarios predefinidos).\"):\n            ss.escenarios[activo] = escenarios_por_defecto()[activo]\n            ss.version += 1\n            st.rerun()\n\n    # Estado de validación de todos los escenarios\n    estado = []\n    for n, dd in ss.escenarios.items():\n        e, a = validacion.validar_config(motor.Config.from_dict(dd))\n        estado.append(f\"{'❌' if e else ('⚠️' if a else '✅')} {n}\")\n    st.caption(\"Estado: \" + \" · \".join(estado))\n    st.divider()\n    editar_escenario(activo)\n\n\n# ==============================================================================================\n# Ejecución de la simulación\n# ==============================================================================================\ndef parametros_kpi():\n    p = copy.deepcopy(ss.comunes[\"param\"])\n    p[\"TRAMOS_MARGEN\"] = [tuple(t) for t in p[\"TRAMOS_MARGEN\"]]\n    p[\"T_WARMUP\"] = ss.ajustes[\"warmup\"] * 24\n    p[\"T_COOLDOWN\"] = ss.ajustes[\"cooldown\"] * 24\n    return p\n\n\nif ejecutar:\n    aj = ss.ajustes\n    problemas = list(validacion.validar_llegadas(ss.comunes[\"llegadas\"]))\n    if aj[\"dias\"] <= aj[\"warmup\"] + aj[\"cooldown\"] + 5:\n        problemas.append(\"Los días por réplica deben superar ampliamente el calentamiento + el cierre.\")\n    for n in seleccion:\n        e, _ = validacion.validar_config(motor.Config.from_dict(ss.escenarios[n]))\n        problemas += [f\"{n}: {x}\" for x in e]\n    if problemas:\n        with tab_res:\n            st.error(\"No se puede simular: corrige primero estos problemas.\")\n            for p in problemas:\n                st.write(\"• \" + p)\n    else:\n        param = parametros_kpi()\n        llegadas = motor.lista_a_llegadas(ss.comunes[\"llegadas\"])\n        protocolos = {}\n        barra = st.sidebar.progress(0.0, text=\"Preparando…\")\n        total = aj[\"n_sim\"] * len(seleccion)\n        for j, n in enumerate(seleccion):\n            cfg = motor.Config.from_dict(ss.escenarios[n])\n            cfg.nombre = n\n            cfg.LLEGADAS_HORARIAS = llegadas\n\n            def prog(i, n_sim, j=j, n=n):\n                barra.progress(min(1.0, (j * n_sim + i) / total), text=f\"{n}: réplica {i}/{n_sim}\")\n\n            protocolos[n] = kpis.montecarlo(cfg, n_sim=aj[\"n_sim\"], dias=aj[\"dias\"], semilla_base=aj[\"semilla\"],\n                                            param=param, progreso=prog, paralelo=aj[\"paralelo\"],\n                                            n_procesos=aj.get(\"n_procesos\"))\n        barra.progress(1.0, text=\"Simulación terminada\")\n        ss.resultados = {\"protocolos\": protocolos, \"ref\": ref if ref in protocolos else seleccion[0],\n                         \"ajustes\": copy.deepcopy(aj), \"comunes\": {\"llegadas\": copy.deepcopy(ss.comunes[\"llegadas\"]),\n                                                                   \"param\": param},\n                         \"fecha\": datetime.datetime.now().strftime(\"%d/%m/%Y %H:%M\")}\n        ss.informe_bytes = None\n        st.toast(\"Simulación terminada: revisa la pestaña «Resultados».\", icon=\"✅\")\n\n\n# ==============================================================================================\n# 3) Resultados\n# ==============================================================================================\ndef tabla_fmt_filas(df, cols=None):\n    \"\"\"Formatea una tabla con KPIs en filas (mismo formato que el informe).\"\"\"\n    cols = cols or list(df.columns)\n    out = pd.DataFrame(index=df.index, columns=cols, dtype=object)\n    for f in df.index:\n        for c in cols:\n            out.loc[f, c] = informe.fmt_por_fila(f, c, df.loc[f, c])\n    return out\n\n\ndef negrita_inicial(p):\n    \"\"\"Pone en negrita el texto hasta el primer ': ' o '. '.\"\"\"\n    cortes = [x for x in (p.find(\": \"), p.find(\". \")) if x > 0]\n    if not cortes or min(cortes) > 60:\n        return p\n    c = min(cortes) + 1\n    return f\"**{p[:c]}**{p[c:]}\"\n\n\ndef mostrar(fig):\n    if fig is not None:\n        st.pyplot(fig, use_container_width=True)\n        plt.close(fig)\n\n\ndef tabla_fmt(df, fn):\n    out = df.copy().astype(object)\n    for f in df.index:\n        for c in df.columns:\n            out.loc[f, c] = fn(f, c, df.loc[f, c])\n    return out\n\n\nwith tab_res:\n    R = ss.resultados\n    if R is None:\n        st.info(\"Todavía no hay resultados. Configura los escenarios y pulsa «▶️ Ejecutar simulación» en la barra lateral.\")\n    else:\n        prot, ref_r, aj_r = R[\"protocolos\"], R[\"ref\"], R[\"ajustes\"]\n        st.caption(f\"Simulación del {R['fecha']} · {aj_r['n_sim']} réplicas de {aj_r['dias']} días · semilla {aj_r['semilla']} \"\n                   f\"· referencia: **{ref_r}** · escenarios: {', '.join(prot)}\")\n        r_res, r_graf, r_det, r_dat = st.tabs([\"Resumen comparativo\", \"Gráficos\", \"Detalle por escenario\", \"Datos\"])\n\n        with r_res:\n            recomendacion, ranking = kpis.texto_recomendacion(prot, ref_r)\n            with st.container(border=True):\n                st.markdown(\"##### Síntesis automática\")\n                for p in recomendacion:\n                    st.markdown(negrita_inicial(p))\n            medias, marcas = kpis.tabla_sintesis(prot, ref=ref_r)\n            sint = medias.copy().astype(object)\n            for c in sint.columns:\n                sint[c] = [kpis.fmt_kpi(k, medias.loc[k, c]) + (f\" {marcas.loc[k, c]}\" if marcas.loc[k, c] else \"\")\n                           for k in medias.index]\n            st.markdown(f\"**KPIs principales** (media de las réplicas · ▲ mejora / ▼ empeora significativamente frente a {ref_r})\")\n            st.dataframe(sint.rename(index=kpis.ETIQUETAS_KPI), use_container_width=True, height=36 * (len(sint) + 1))\n            c1, c2 = st.columns(2)\n            with c1:\n                st.markdown(\"**Cumplimiento de SLAs** (% de réplicas)\")\n                st.dataframe(tabla_fmt(kpis.tabla_slas(prot).rename(index=kpis.slas_mc(prot[ref_r])[\"Descripción\"]),\n                                       lambda f, c, v: kpis.pct(v, 0)), use_container_width=True)\n            with c2:\n                st.markdown(\"**Ranking de escenarios**\")\n                rk = ranking[[\"SLAs cumplidos\", \"Resultado neto anual (€)\", \"Mortalidad global\", \"Mortalidad Sin_UCI N/R\",\n                              \"Margen neto\", \"Descartado\"]]\n                st.dataframe(tabla_fmt(rk, lambda f, c, v: kpis.eur(v) if \"€\" in c else (\n                    kpis.pct(v, 2) if (\"Mortalidad\" in c or \"Margen\" in c) else (\"Sí\" if v is True else (\"No\" if v is False else str(v))))),\n                    use_container_width=True)\n            if len(prot) > 1:\n                st.markdown(f\"**Resultado económico frente a {ref_r}**\")\n                eco = kpis.tabla_economica(prot, ref=ref_r)\n                st.dataframe(tabla_fmt(eco, lambda f, c, v: kpis.eur(v)), use_container_width=True)\n\n        with r_graf:\n            todas = sorted(set.intersection(*[set(m[\"resumen\"].columns) for m in prot.values()]) -\n                           {c for c in prot[ref_r][\"resumen\"].columns if c.startswith(\"Cumple_\")})\n            elegidos = st.multiselect(\"KPIs a comparar\", todas, default=[k for k in informe.KPIS_GRAFICOS if k in todas],\n                                      format_func=lambda k: kpis.ETIQUETAS_KPI.get(k, k), key=\"kpis_graf\")\n            if elegidos:\n                mostrar(gr.fig_comparativo(prot, elegidos, 3))\n            c1, c2 = st.columns(2)\n            with c1:\n                mostrar(gr.fig_utilizacion_comparada(prot))\n            with c2:\n                mostrar(gr.fig_sintesis(ranking, list(prot), ref_r))\n            mostrar(gr.fig_tsys_perfil(prot))\n            mostrar(gr.fig_ocupacion_uci(prot, R[\"comunes\"][\"param\"][\"SLA_OCUP_UCI\"]))\n\n        with r_det:\n            esc = st.selectbox(\"Escenario\", list(prot), key=\"det_esc\")\n            mc = prot[esc]\n            if esc != ref_r:\n                st.info(kpis.texto_escenario(esc, prot[ref_r], mc, ref=ref_r))\n            c1, c2 = st.columns([3, 2])\n            with c1:\n                st.markdown(\"**KPIs principales (Monte Carlo)**\")\n                st.dataframe(tabla_fmt_filas(kpis.resumen_mc(mc, kpis.KPIS_SINTESIS).rename(index=kpis.ETIQUETAS_KPI),\n                                             [\"Media\", \"SD\", \"IC95_inf\", \"IC95_sup\", \"P2.5\", \"P97.5\"]), use_container_width=True)\n            with c2:\n                st.markdown(\"**SLAs**\")\n                s = kpis.slas_mc(mc).set_index(\"Descripción\")\n                st.dataframe(tabla_fmt(s[[\"Valor_medio\", \"%Réplicas_cumple\", \"Veredicto\"]],\n                                       lambda f, c, v: v if isinstance(v, str) else (kpis.pct(v, 0) if c == \"%Réplicas_cumple\"\n                                                                                     else kpis.num(v, 4))),\n                             use_container_width=True)\n            st.markdown(\"**KPIs temporales por perfil (h)**\")\n            st.dataframe(kpis.tabla_media_mc(mc, \"operativos\").round(3), use_container_width=True)\n            st.markdown(\"**KPIs clínicos por perfil**\")\n            st.dataframe(tabla_fmt(kpis.tabla_media_mc(mc, \"clinicos\"),\n                                   lambda f, c, v: kpis.num(v, 1) if c in (\"Pacientes\", \"Altas_dia\") else kpis.pct(v, 2)),\n                         use_container_width=True)\n            rec = kpis.tabla_media_mc(mc, \"recursos\")\n            c1, c2 = st.columns([3, 2])\n            with c1:\n                st.markdown(\"**Recursos**\")\n                st.dataframe(rec[[\"Tipo\", \"Capacidad\", \"Utilizacion\", \"Lq_media\", \"%Bloqueo\", \"Diagnostico\", \"%Réplicas_ρ≥0.85\"]]\n                             .round(3), use_container_width=True)\n            with c2:\n                mostrar(gr.fig_utilizacion(rec, f\"Utilización media · {esc}\"))\n            st.markdown(\"**Carga y espera por estación**\")\n            st.dataframe(kpis.tabla_media_mc(mc, \"estaciones\").round(3), use_container_width=True)\n            st.markdown(\"**Resultado económico por perfil (media por réplica)**\")\n            st.dataframe(tabla_fmt(kpis.tabla_media_mc(mc, \"economicos\"),\n                                   lambda f, c, v: kpis.num(v, 0) if c == \"Pacientes\" else (kpis.pct(v) if c == \"Margen\" else kpis.eur(v))),\n                         use_container_width=True)\n            if esc != ref_r:\n                c1, c2 = st.columns([3, 2])\n                with c1:\n                    st.markdown(f\"**Comparación pareada con {ref_r}**\")\n                    cmp_ = kpis.comparar_escenarios(prot[ref_r], mc, kpis.KPIS_SINTESIS)\n                    st.dataframe(tabla_fmt_filas(cmp_.rename(index=kpis.ETIQUETAS_KPI),\n                                                 [\"Base\", \"Escenario\", \"Δ%\", \"p_valor\", \"Significativo\"])\n                                 .rename(columns={\"Base\": ref_r, \"Escenario\": esc}), use_container_width=True)\n                with c2:\n                    st.markdown(\"**Viabilidad económica**\")\n                    viab = kpis.viabilidad_economica(prot[ref_r], mc)\n                    st.dataframe(tabla_fmt(viab, lambda f, c, v: kpis.pct(v) if (\"Margen\" in f or \"%\" in f) else (\n                        kpis.num(v, 2) if \"Cobertura\" in f else (kpis.num(v, 0) if \"días\" in f else kpis.eur(v)))),\n                        use_container_width=True)\n\n        with r_dat:\n            st.markdown(\"Valores de cada réplica (una fila por réplica y escenario).\")\n            largo = pd.concat([m[\"resumen\"].assign(Escenario=n) for n, m in prot.items()]).reset_index()\n            st.dataframe(largo, use_container_width=True, height=350)\n            buf = io.BytesIO()\n            with pd.ExcelWriter(buf, engine=\"openpyxl\") as xw:\n                for n, m in prot.items():\n                    m[\"resumen\"].to_excel(xw, sheet_name=(\"\".join(ch for ch in n if ch.isalnum() or ch in \" +-_\"))[:31] or \"esc\")\n                kpis.resumen_mc(prot[ref_r], kpis.KPIS_SINTESIS).to_excel(xw, sheet_name=\"Resumen_referencia\")\n            st.download_button(\"Descargar réplicas (Excel)\", buf.getvalue(), \"replicas_simulacion.xlsx\",\n                               \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n\n\n# ==============================================================================================\n# 4) Informe\n# ==============================================================================================\nwith tab_inf:\n    R = ss.resultados\n    if R is None:\n        st.info(\"Ejecuta primero una simulación para poder generar el informe.\")\n    else:\n        st.markdown(\"El informe Word incluye: resumen ejecutivo, parámetros comunes y de cada escenario (con sus \"\n                    \"diferencias frente a la referencia), tablas comparativas de KPIs, SLAs y resultado económico, \"\n                    \"gráficas comparativas y un apartado de detalle por escenario con todas sus tablas y gráficas.\")\n        titulo = st.text_input(\"Título del informe\", \"Red de colas hospitalaria · Servicio de Urgencias\", key=\"tit_inf\")\n        if st.button(\"📄 Generar informe (.docx)\", type=\"primary\"):\n            barra = st.progress(0.0, text=\"Generando informe…\")\n            ss.informe_bytes = informe.generar_informe(\n                R[\"protocolos\"], R[\"ref\"],\n                {k: R[\"ajustes\"][k] for k in (\"n_sim\", \"dias\", \"semilla\", \"warmup\", \"cooldown\")},\n                R[\"comunes\"], titulo=titulo, progreso=lambda f, t: barra.progress(min(f, 1.0), text=t))\n            barra.progress(1.0, text=\"Informe listo\")\n        if ss.informe_bytes:\n            st.download_button(\"⬇️ Descargar informe\", ss.informe_bytes,\n                               f\"Informe_Urgencias_{datetime.date.today():%Y%m%d}.docx\",\n                               \"application/vnd.openxmlformats-officedocument.wordprocessingml.document\",\n                               type=\"primary\")\n",
 "motor.py": "# -*- coding: utf-8 -*-\n\"\"\"Motor de simulación (SimPy) de la red de colas hospitalaria y configuraciones de los escenarios.\n\nEs el mismo gemelo digital del cuaderno '01 Red de Colas Hospitalaria', con dos cambios menores:\n* las llegadas horarias pueden ir dentro de la configuración (cfg.LLEGADAS_HORARIAS), para que se\n  puedan modificar desde la aplicación como parámetro común a todos los escenarios;\n* cualquier estación cuyo nombre empiece por 'Obs_' se trata como estación de observación.\n\"\"\"\nimport copy\nimport random\n\nimport pandas as pd\nimport simpy\n\nclass Config:\n    \"\"\"Contenedor simple de los parámetros de un escenario (capacidades,\n    tiempos de servicio, probabilidades de derivación, costes...).\"\"\"\n\n    def to_dict(self):\n        \"\"\"Representación serializable (JSON) de la configuración.\"\"\"\n        d = copy.deepcopy(vars(self))\n        if \"LLEGADAS_HORARIAS\" in d:\n            d[\"LLEGADAS_HORARIAS\"] = llegadas_a_lista(d[\"LLEGADAS_HORARIAS\"])\n        return d\n\n    @classmethod\n    def from_dict(cls, d):\n        cfg = cls()\n        for k, v in copy.deepcopy(d).items():\n            setattr(cfg, k, v)\n        if isinstance(getattr(cfg, \"LLEGADAS_HORARIAS\", None), list):\n            cfg.LLEGADAS_HORARIAS = lista_a_llegadas(cfg.LLEGADAS_HORARIAS)\n        return cfg\n\n\n# --- Parámetros compartidos por TODOS los escenarios (no cambian) ---------\nTIPOS = [\"Verde\", \"Amarillo\", \"Naranja\", \"Rojo\"]\n\nLLEGADAS_HORARIAS = {\n    (22, 7):  (3.0, [0.15, 0.35, 0.35, 0.15]),\n    (7, 10):  (4.5, [0.30, 0.30, 0.25, 0.15]),\n    (10, 14): (6.0, [0.30, 0.35, 0.30, 0.05]),\n    (14, 17): (4.5, [0.40, 0.30, 0.25, 0.05]),\n    (17, 22): (7.0, [0.25, 0.30, 0.30, 0.15]),\n}\n\n\ndef llegadas_a_lista(llegadas):\n    \"\"\"{(ini, fin): (tasa, probs)} -> lista de dicts (formato editable/JSON).\"\"\"\n    return [{\"Inicio\": i, \"Fin\": f, \"Tasa\": t, **{tp: p for tp, p in zip(TIPOS, probs)}}\n            for (i, f), (t, probs) in llegadas.items()]\n\n\ndef lista_a_llegadas(lista):\n    \"\"\"Lista de dicts -> {(ini, fin): (tasa, probs)} (formato del motor).\"\"\"\n    return {(int(r[\"Inicio\"]), int(r[\"Fin\"])): (float(r[\"Tasa\"]), [float(r[tp]) for tp in TIPOS]) for r in lista}\n\n\ndef obtener_perfil_horario(reloj_horas, llegadas=None):\n    llegadas = LLEGADAS_HORARIAS if llegadas is None else llegadas\n    hora_dia = int(reloj_horas) % 24\n    for (inicio, fin), (tasa, probs) in llegadas.items():\n        if inicio > fin:\n            if hora_dia >= inicio or hora_dia < fin:\n                return tasa, probs\n        else:\n            if inicio <= hora_dia < fin:\n                return tasa, probs\n    raise RuntimeError(\"Franja horaria no cubierta\")\n\n\ndef generar_tiempo_servicio(cfg, estacion, tipo):\n    base = cfg.TIEMPOS_SERVICIO.get(estacion, {}).get(tipo)\n    if base is None:\n        raise KeyError(f\"Sin tiempo de servicio definido para {estacion}/{tipo}\")\n    return base * random.uniform(0.75, 1.25)\n\n\ndef determinar_destino(cfg, estacion, tipo):\n    opciones = cfg.PROB_DERIVACION[estacion][tipo]\n    destinos = list(opciones.keys())\n    pesos = list(opciones.values())\n    return random.choices(destinos, weights=pesos, k=1)[0]\n\n\ndef _verificar_filas(prob):\n    \"\"\"Comprueba que todas las filas de PROB_DERIVACION suman 1.0.\"\"\"\n    errores = []\n    for estacion, por_tipo in prob.items():\n        for tipo, destinos in por_tipo.items():\n            s = sum(destinos.values())\n            if abs(s - 1.0) > 1e-9:\n                errores.append((estacion, tipo, s))\n    return errores\n\n\nESTADOS_FINALES = {\"Alta\", \"Fallece\"}\nOBS_ESTACIONES = {\"Obs_Verde\", \"Obs_Amarillo\", \"Obs_Naranja\", \"Obs_Rojo\"}\n\n\ndef es_observacion(estacion):\n    \"\"\"Las estaciones de observación (sin recurso propio) son las que empiezan por 'Obs_'.\"\"\"\n    return estacion in OBS_ESTACIONES or estacion.startswith(\"Obs_\")\n\n\nclass Hospital:\n    def __init__(self, env, cfg, simpy_module):\n        self.env = env\n        self.cfg = cfg\n        self.simpy = simpy_module\n        self.log_datos = []\n        self.activos = {}\n\n        self.servidores = {\n            nombre: simpy_module.Resource(env, capacity=cap)\n            for nombre, cap in cfg.SERVIDORES_CAPACIDAD.items()\n        }\n        self.camas = {\n            nombre: simpy_module.Resource(env, capacity=cap)\n            for nombre, cap in cfg.CAMAS_CAPACIDAD.items()\n        }\n        self.box = simpy_module.Resource(env, capacity=cfg.BOX_CAPACIDAD)\n\n        if cfg.UCI_MODE == \"pooled\":\n            self.uci = {\"POOL\": simpy_module.PriorityResource(env, capacity=cfg.UCI_TOTAL_CAPACIDAD)}\n        else:\n            self.uci = {\n                \"Rojo\": simpy_module.Resource(env, capacity=cfg.UCI_ROJO_CAPACIDAD),\n                \"Naranja\": simpy_module.Resource(env, capacity=cfg.UCI_NARANJA_CAPACIDAD),\n                \"Base\": simpy_module.Resource(env, capacity=cfg.UCI_BASE_CAPACIDAD),\n            }\n\n    def info_cola(self, resource):\n        q = len([r for r in resource.queue if not r.triggered and not getattr(r, \"_cancelled\", False)])\n        return q, q + resource.count\n\n    def resource_de_cama(self, nombre_logico):\n        alias = self.cfg.CAMA_ALIAS.get(nombre_logico, nombre_logico)\n        return self.camas[alias]\n\n    def pool_de_estacion(self, estacion):\n        return self.cfg.POOL_ESTACION.get(estacion, estacion)\n\n    def registrar(self, id_pac, tipo, t_in, estacion, t_wait, t_server, id_recurso,\n                  sala, q_len, sys_len, destino):\n        self.log_datos.append({\n            \"Id_pat\": id_pac, \"Pat_type\": tipo, \"T_in\": round(t_in, 4),\n            \"Station_in\": estacion, \"T_wait\": round(t_wait, 4),\n            \"T_server\": round(t_server, 4), \"ID_server\": id_recurso,\n            \"Wait_room\": sala, \"Pat_in_queue\": q_len, \"Pat_in_system\": sys_len,\n            \"T_out\": round(t_in + t_wait + t_server, 4), \"Station_out\": destino,\n            \"T_system\": round(t_wait + t_server, 4),\n        })\n\n    def finalizar_simulacion(self):\n        end_time = self.env.now\n        for pac_id, data in list(self.activos.items()):\n            t_transcurrido = end_time - data[\"t_llegada_estacion\"]\n            self.log_datos.append({\n                \"Id_pat\": pac_id, \"Pat_type\": data[\"tipo\"], \"T_in\": round(data[\"t_llegada_estacion\"], 4),\n                \"Station_in\": data[\"estacion\"], \"T_wait\": round(t_transcurrido, 4),\n                \"T_server\": 0.0, \"ID_server\": data.get(\"id_recurso\", \"N/A\"),\n                \"Wait_room\": data.get(\"sala\", \"N/A\"), \"Pat_in_queue\": data.get(\"q_len\", 0),\n                \"Pat_in_system\": data.get(\"sys_len\", 0), \"T_out\": round(end_time, 4),\n                \"Station_out\": \"Fin_Simulacion\", \"T_system\": round(t_transcurrido, 4),\n            })\n\n\ndef liberar_cama(hosp, cama_propia):\n    \"\"\"Libera una 'cama' propia: un recurso físico normal (registrado en\n    hosp.camas) o una cama de UCI (clave especial 'UCI::<bolsa>').\"\"\"\n    if cama_propia is None:\n        return\n    nombre, req = cama_propia\n    if nombre.startswith(\"UCI::\"):\n        bolsa = nombre.split(\"::\", 1)[1]\n        hosp.uci[bolsa].release(req)\n    else:\n        hosp.camas[nombre].release(req)\n\n\ndef comportamiento_paciente(env, hosp, simpy, id_paciente, tipo_paciente):\n    cfg = hosp.cfg\n    estacion_actual = \"Admision\"\n    mi_sala = \"Sala_Espera_Urgencias\"\n    box_propio = None       # request concedida del Box, si el paciente ya lo ocupa\n    cama_propia = None      # (nombre_logico, request) de la cama que ocupa\n    t_llegada = env.now\n\n    hosp.activos[id_paciente] = {\n        \"tipo\": tipo_paciente, \"t_llegada_estacion\": t_llegada, \"estacion\": estacion_actual,\n        \"sala\": mi_sala,\n    }\n\n    # Captura inmediata de Box para Rojo desde Admisión (paciente crítico)\n    if cfg.BOX_CAPTURA.get(tipo_paciente) == \"Admision\":\n        req_box = hosp.box.request()\n        yield req_box\n        box_propio = req_box\n        mi_sala = \"Box_Urgencias\"\n\n    while estacion_actual not in ESTADOS_FINALES:\n        hosp.activos[id_paciente].update({\n            \"t_llegada_estacion\": t_llegada, \"estacion\": estacion_actual, \"sala\": mi_sala,\n        })\n\n        # Captura de Box en el momento indicado por la configuración\n        if box_propio is None and cfg.BOX_CAPTURA.get(tipo_paciente) == estacion_actual:\n            req_box = hosp.box.request()\n            yield req_box\n            box_propio = req_box\n            mi_sala = \"Box_Urgencias\"\n            hosp.activos[id_paciente][\"sala\"] = mi_sala\n\n        t_wait = 0.0\n        id_recurso = \"N/A\"\n        q_len, sys_len = 0, 0\n\n        if es_observacion(estacion_actual):\n            # No hay recurso propio: se retiene la sala/box ya ocupado.\n            id_recurso = mi_sala\n            t_wait = 0.0\n\n        elif estacion_actual in cfg.CAMAS_CAPACIDAD or estacion_actual in cfg.CAMA_ALIAS:\n            recurso = hosp.resource_de_cama(estacion_actual)\n            alias = cfg.CAMA_ALIAS.get(estacion_actual, estacion_actual)\n            if cama_propia is not None and cama_propia[0] == alias:\n                t_wait = 0.0  # ya se encontraba en esa misma cama\n            else:\n                q_len, sys_len = hosp.info_cola(recurso)\n                t0 = env.now\n                req_cama = recurso.request()\n                yield req_cama\n                t_wait = env.now - t0\n                # libera la cama/box anterior (si tenía una física distinta)\n                if cama_propia is not None:\n                    liberar_cama(hosp, cama_propia)\n                    cama_propia = None\n                elif box_propio is not None:\n                    hosp.box.release(box_propio)\n                    box_propio = None\n                cama_propia = (alias, req_cama)\n            id_recurso = alias\n            mi_sala = alias\n            hosp.activos[id_paciente][\"sala\"] = mi_sala\n\n        elif estacion_actual == \"UCI\":\n            prioridad = {\"Rojo\": 0, \"Naranja\": 1, \"Amarillo\": 2, \"Verde\": 2}[tipo_paciente]\n            if cfg.UCI_MODE == \"pooled\":\n                pool = hosp.uci[\"POOL\"]\n                q_len, sys_len = hosp.info_cola(pool)\n                t0 = env.now\n                req_uci = pool.request(priority=prioridad)\n            else:\n                bolsa = {\"Rojo\": \"Rojo\", \"Naranja\": \"Naranja\"}.get(tipo_paciente, \"Base\")\n                pool = hosp.uci[bolsa]\n                q_len, sys_len = hosp.info_cola(pool)\n                t0 = env.now\n                req_uci = pool.request()\n\n            # Carrera entre conseguir cama y agotar el límite de espera\n            resultado = yield req_uci | env.timeout(cfg.LIMITE_ESPERA_UCI)\n            if req_uci in resultado:\n                t_wait = env.now - t0\n                if cama_propia is not None:\n                    liberar_cama(hosp, cama_propia)\n                    cama_propia = None\n                elif box_propio is not None:\n                    hosp.box.release(box_propio)\n                    box_propio = None\n                cama_propia = (\"UCI::\" + (bolsa if cfg.UCI_MODE != \"pooled\" else \"POOL\"), req_uci)\n                id_recurso = \"UCI\"\n                mi_sala = \"UCI\"\n            else:\n                req_uci.cancel()\n                t_wait = env.now - t0\n                # sin cama de UCI disponible dentro del límite: desenlace fatal\n                hosp.registrar(id_paciente, tipo_paciente, t_llegada, estacion_actual,\n                                t_wait, 0.0, \"Sin_UCI_Disponible\", mi_sala, q_len, sys_len, \"Fallece\")\n                estacion_actual = \"Fallece\"\n                break\n            hosp.activos[id_paciente][\"sala\"] = mi_sala\n\n        else:\n            # Estación \"servidor\": el recurso se libera justo tras el servicio\n            pool_nombre = hosp.pool_de_estacion(estacion_actual)\n            recurso = hosp.servidores[pool_nombre]\n            q_len, sys_len = hosp.info_cola(recurso)\n            t0 = env.now\n            req = recurso.request()\n            yield req\n            t_wait = env.now - t0\n            id_recurso = pool_nombre\n\n        t_servicio = generar_tiempo_servicio(cfg, estacion_actual, tipo_paciente)\n        yield env.timeout(t_servicio)\n\n        if (not es_observacion(estacion_actual)\n                and estacion_actual not in cfg.CAMAS_CAPACIDAD\n                and estacion_actual not in cfg.CAMA_ALIAS\n                and estacion_actual != \"UCI\"):\n            hosp.servidores[hosp.pool_de_estacion(estacion_actual)].release(req)\n\n        destino = determinar_destino(cfg, estacion_actual, tipo_paciente)\n\n        if destino in ESTADOS_FINALES:\n            if box_propio is not None:\n                hosp.box.release(box_propio)\n                box_propio = None\n            if cama_propia is not None:\n                liberar_cama(hosp, cama_propia)\n                cama_propia = None\n\n        hosp.registrar(id_paciente, tipo_paciente, t_llegada, estacion_actual,\n                        t_wait, t_servicio, id_recurso, mi_sala, q_len, sys_len, destino)\n\n        estacion_actual = destino\n        t_llegada = env.now\n\n    if id_paciente in hosp.activos:\n        del hosp.activos[id_paciente]\n    if box_propio is not None:\n        hosp.box.release(box_propio)\n    if cama_propia is not None:\n        liberar_cama(hosp, cama_propia)\n\n\ndef generador_llegadas(env, hosp, simpy, cfg):\n    id_paciente = 1\n    llegadas = getattr(cfg, \"LLEGADAS_HORARIAS\", None)\n    while True:\n        tasa, probs = obtener_perfil_horario(env.now, llegadas)\n        yield env.timeout(random.expovariate(tasa))\n        tipo = random.choices(TIPOS, weights=probs)[0]\n        env.process(comportamiento_paciente(env, hosp, simpy, f\"PAC_{id_paciente}\", tipo))\n        id_paciente += 1\n\n\ndef simular(cfg, dias, semilla, simpy_module=None):\n    \"\"\"Ejecuta la simulación de `cfg` durante `dias` días con la semilla dada.\n    Devuelve un DataFrame de pandas con la traza completa (mismo formato que\n    `traza_urgencias_red.csv`).\"\"\"\n    if simpy_module is None:\n        simpy_module = simpy\n    random.seed(semilla)\n    env = simpy_module.Environment()\n    hosp = Hospital(env, cfg, simpy_module)\n    env.process(generador_llegadas(env, hosp, simpy_module, cfg))\n    env.run(until=dias * 24)\n    hosp.finalizar_simulacion()\n    df_sim = pd.DataFrame(hosp.log_datos)\n    if len(df_sim):\n        df_sim = df_sim.sort_values(by=[\"T_in\"]).reset_index(drop=True)\n    return df_sim\n\n\ndef construir_config_base():\n    cfg = Config()\n    cfg.nombre = \"Línea Base (protocolo actual)\"\n\n    cfg.SERVIDORES_CAPACIDAD = {\n        \"Admision\": 3, \"Triaje\": 4, \"Aislamiento\": 6, \"Medicos\": 7,\n        \"Pruebas_Basicas\": 4, \"Pruebas_Avanzadas\": 4,\n        \"Consulta_Especialista\": 3, \"Farmacia\": 3,\n    }\n\n    cfg.BOX_CAPACIDAD = 55\n    cfg.CAMAS_CAPACIDAD = {\n        \"Planta\": 120,\n        \"Quirofano\": 3,\n        \"Rehabilitacion\": 43,\n    }\n    cfg.CAMA_ALIAS = {\"Planta_PostUCI\": \"Planta\"}\n    cfg.POOL_ESTACION = {\"Diag_Inicial\": \"Medicos\", \"Diag_Preliminar\": \"Medicos\"}\n    cfg.BOX_CAPTURA = {\"Rojo\": \"Admision\", \"Naranja\": \"Diag_Inicial\"}\n\n    cfg.UCI_MODE = \"partitioned\"       # \"partitioned\" (línea base) o \"pooled\" (Escenario C)\n    cfg.UCI_ROJO_CAPACIDAD = 45\n    cfg.UCI_NARANJA_CAPACIDAD = 30\n    cfg.UCI_BASE_CAPACIDAD = 4\n    cfg.UCI_TOTAL_CAPACIDAD = cfg.UCI_ROJO_CAPACIDAD + cfg.UCI_NARANJA_CAPACIDAD + cfg.UCI_BASE_CAPACIDAD  # 79\n    cfg.LIMITE_ESPERA_UCI = 12.0        # horas\n\n    cfg.TIEMPOS_SERVICIO = {\n        \"Admision\":              {\"Verde\": 5/60,  \"Amarillo\": 5/60,  \"Naranja\": 4/60,  \"Rojo\": 2/60},\n        \"Triaje\":                {\"Verde\": 10/60, \"Amarillo\": 8/60,  \"Naranja\": 6/60,  \"Rojo\": 4/60},\n        \"Aislamiento\":           {\"Verde\": 20/60, \"Amarillo\": 20/60, \"Naranja\": 20/60, \"Rojo\": 20/60},\n        \"Diag_Inicial\":          {\"Verde\": 10/60, \"Amarillo\": 10/60, \"Naranja\": 10/60, \"Rojo\": 10/60},\n        \"Pruebas_Basicas\":       {\"Verde\": 15/60, \"Amarillo\": 15/60, \"Naranja\": 15/60, \"Rojo\": 15/60},\n        \"Pruebas_Avanzadas\":     {\"Verde\": 45/60, \"Amarillo\": 45/60, \"Naranja\": 60/60, \"Rojo\": 60/60},\n        \"Consulta_Especialista\": {\"Verde\": 30/60, \"Amarillo\": 30/60, \"Naranja\": 30/60, \"Rojo\": 30/60},\n        \"Diag_Preliminar\":       {\"Verde\": 10/60, \"Amarillo\": 10/60, \"Naranja\": 15/60, \"Rojo\": 20/60},\n        \"Farmacia\":              {\"Verde\": 8/60,  \"Amarillo\": 8/60,  \"Naranja\": 8/60,  \"Rojo\": 8/60},\n        \"Quirofano\":             {\"Naranja\": 2.5, \"Rojo\": 3.5},\n        \"Planta\":                {\"Amarillo\": 24.0, \"Naranja\": 48.0, \"Rojo\": 72.0},\n        \"UCI\":                   {\"Amarillo\": 24.0, \"Naranja\": 72.0, \"Rojo\": 96.0},\n        \"Planta_PostUCI\":        {\"Amarillo\": 24.0, \"Naranja\": 36.0, \"Rojo\": 48.0},\n        \"Rehabilitacion\":        {\"Amarillo\": 48.0, \"Naranja\": 72.0, \"Rojo\": 96.0},\n        \"Obs_Verde\":             {\"Verde\": 6.0},\n        \"Obs_Amarillo\":          {\"Amarillo\": 6.0},\n        \"Obs_Naranja\":           {\"Naranja\": 6.0},\n        \"Obs_Rojo\":              {\"Rojo\": 6.0},\n    }\n\n    cfg.PROB_DERIVACION = {\n        \"Admision\": {t: {\"Triaje\": 1.0} for t in TIPOS},\n\n        \"Triaje\": {\n            \"Verde\":    {\"Aislamiento\": 0.05, \"Diag_Inicial\": 0.95},\n            \"Amarillo\": {\"Aislamiento\": 0.10, \"Diag_Inicial\": 0.90},\n            \"Naranja\":  {\"Aislamiento\": 0.12, \"Diag_Inicial\": 0.88},\n            \"Rojo\":     {\"Diag_Inicial\": 1.0},\n        },\n\n        \"Aislamiento\": {t: {\"Diag_Inicial\": 1.0} for t in (\"Verde\", \"Amarillo\", \"Naranja\")},\n\n        \"Diag_Inicial\": {\n            \"Verde\":    {\"Farmacia\": 0.15, \"Pruebas_Basicas\": 0.65, \"Pruebas_Avanzadas\": 0.20},\n            \"Amarillo\": {\"Farmacia\": 0.05, \"Pruebas_Basicas\": 0.55, \"Pruebas_Avanzadas\": 0.40},\n            \"Naranja\":  {\"Pruebas_Basicas\": 0.40, \"Pruebas_Avanzadas\": 0.42, \"Consulta_Especialista\": 0.18},\n            \"Rojo\":     {\"Pruebas_Basicas\": 0.30, \"Pruebas_Avanzadas\": 0.30, \"Consulta_Especialista\": 0.15,\n                         \"Planta\": 0.10, \"Quirofano\": 0.15},\n        },\n\n        \"Pruebas_Basicas\": {\n            \"Verde\":    {\"Diag_Preliminar\": 0.85, \"Pruebas_Avanzadas\": 0.15},\n            \"Amarillo\": {\"Diag_Preliminar\": 0.45, \"Pruebas_Avanzadas\": 0.55},\n            \"Naranja\":  {\"Pruebas_Avanzadas\": 0.60, \"Diag_Preliminar\": 0.40},\n            \"Rojo\":     {\"Pruebas_Avanzadas\": 0.40, \"Diag_Preliminar\": 0.60},\n        },\n\n        \"Pruebas_Avanzadas\": {t: {\"Diag_Preliminar\": 1.0} for t in TIPOS},\n\n        \"Consulta_Especialista\": {\n            \"Amarillo\": {\"Planta\": 0.60, \"Farmacia\": 0.40},\n            \"Naranja\":  {\"Diag_Preliminar\": 0.55, \"Quirofano\": 0.45},\n            \"Rojo\":     {\"Quirofano\": 0.55, \"UCI\": 0.25, \"Planta\": 0.20},\n        },\n\n        \"Diag_Preliminar\": {\n            \"Verde\":    {\"Farmacia\": 0.85, \"Obs_Verde\": 0.15},\n            \"Amarillo\": {\"Farmacia\": 0.35, \"Obs_Amarillo\": 0.55, \"Consulta_Especialista\": 0.10},\n            \"Naranja\":  {\"Planta\": 0.30, \"Obs_Naranja\": 0.35, \"Consulta_Especialista\": 0.15, \"Quirofano\": 0.20},\n            \"Rojo\":     {\"UCI\": 0.25, \"Planta\": 0.30, \"Quirofano\": 0.20, \"Obs_Rojo\": 0.15, \"Consulta_Especialista\": 0.10},\n        },\n\n        \"Quirofano\": {\n            \"Naranja\": {\"UCI\": 0.35, \"Planta\": 0.55, \"Fallece\": 0.10},\n            \"Rojo\":    {\"UCI\": 0.65, \"Planta\": 0.25, \"Fallece\": 0.10},\n        },\n\n        \"Obs_Verde\":    {\"Verde\": {\"Farmacia\": 1.0}},\n        \"Obs_Amarillo\": {\"Amarillo\": {\"Farmacia\": 0.60, \"Obs_Amarillo\": 0.25, \"Planta\": 0.15}},\n        \"Obs_Naranja\":  {\"Naranja\": {\"Farmacia\": 0.29, \"Obs_Naranja\": 0.30, \"Planta\": 0.35, \"UCI\": 0.06}},\n        \"Obs_Rojo\":     {\"Rojo\": {\"Obs_Rojo\": 0.10, \"Planta\": 0.45, \"UCI\": 0.35, \"Farmacia\": 0.10}},\n\n        \"Planta\": {\n            \"Amarillo\": {\"Farmacia\": 0.65, \"Planta\": 0.10, \"UCI\": 0.12, \"Rehabilitacion\": 0.08, \"Fallece\": 0.05},\n            \"Naranja\":  {\"Farmacia\": 0.45, \"Planta\": 0.30, \"UCI\": 0.08, \"Fallece\": 0.07, \"Rehabilitacion\": 0.10},\n            \"Rojo\":     {\"Planta\": 0.20, \"UCI\": 0.35, \"Farmacia\": 0.20, \"Fallece\": 0.15, \"Rehabilitacion\": 0.10},\n        },\n\n        \"UCI\": {\n            \"Amarillo\": {\"Planta_PostUCI\": 0.90, \"Fallece\": 0.10},\n            \"Naranja\":  {\"Planta_PostUCI\": 0.75, \"Fallece\": 0.25},\n            \"Rojo\":     {\"Planta_PostUCI\": 0.65, \"Fallece\": 0.35},\n        },\n\n        \"Planta_PostUCI\": {\n            \"Amarillo\": {\"Farmacia\": 0.80, \"Rehabilitacion\": 0.20},\n            \"Naranja\":  {\"Farmacia\": 0.55, \"Rehabilitacion\": 0.45},\n            \"Rojo\":     {\"Farmacia\": 0.45, \"Rehabilitacion\": 0.55},\n        },\n\n        \"Rehabilitacion\": {t: {\"Farmacia\": 1.0} for t in (\"Amarillo\", \"Naranja\", \"Rojo\")},\n\n        \"Farmacia\": {t: {\"Alta\": 1.0} for t in TIPOS},\n    }\n\n    cfg.COSTES_FIJOS = {}   # el protocolo actual no tiene coste fijo adicional\n    return cfg\n\n\ndef construir_config_ia():\n    cfg = construir_config_base()\n    cfg.nombre = \"Escenario A - IA Diagnóstica\"\n\n    # 1) Tiempos de servicio: la IA acelera el diagnóstico inicial y preliminar\n    cfg.TIEMPOS_SERVICIO = copy.deepcopy(cfg.TIEMPOS_SERVICIO)\n    for tipo in cfg.TIEMPOS_SERVICIO[\"Diag_Inicial\"]:\n        cfg.TIEMPOS_SERVICIO[\"Diag_Inicial\"][tipo] *= 0.70\n    for tipo in cfg.TIEMPOS_SERVICIO[\"Diag_Preliminar\"]:\n        cfg.TIEMPOS_SERVICIO[\"Diag_Preliminar\"][tipo] *= 0.75\n\n    # 2) Derivaciones: menos necesidad de Pruebas Avanzadas (mejor precisión inicial).\n    #    \"Rojo\" no se modifica: protocolo diagnóstico completo siempre en emergencia vital.\n    cfg.PROB_DERIVACION = copy.deepcopy(cfg.PROB_DERIVACION)\n    cfg.PROB_DERIVACION[\"Diag_Inicial\"][\"Verde\"] = {\n        \"Farmacia\": 0.35, \"Pruebas_Basicas\": 0.55, \"Pruebas_Avanzadas\": 0.10,\n    }\n    cfg.PROB_DERIVACION[\"Diag_Inicial\"][\"Amarillo\"] = {\n        \"Farmacia\": 0.15, \"Pruebas_Basicas\": 0.60, \"Pruebas_Avanzadas\": 0.25,\n    }\n    cfg.PROB_DERIVACION[\"Diag_Inicial\"][\"Naranja\"] = {\n        \"Pruebas_Basicas\": 0.45, \"Pruebas_Avanzadas\": 0.32, \"Consulta_Especialista\": 0.23,\n    }\n\n    # 3) Coste del escenario\n    cfg.COSTES_FIJOS = {\"licencia_ia_anual\": 480_000}\n    return cfg\n\n\n\ndef construir_config_fasttrack():\n    cfg = construir_config_base()\n    cfg.nombre = \"Escenario B - Circuito Rápido (Fast-Track)\"\n\n    # 1) Nuevo recurso: equipo médico del circuito rápido\n    cfg.SERVIDORES_CAPACIDAD = copy.deepcopy(cfg.SERVIDORES_CAPACIDAD)\n    cfg.SERVIDORES_CAPACIDAD[\"Medicos_Rapidos\"] = 3\n\n    # 2) Nueva estación Diag_Rapido y su tiempo de servicio\n    cfg.TIEMPOS_SERVICIO = copy.deepcopy(cfg.TIEMPOS_SERVICIO)\n    cfg.TIEMPOS_SERVICIO[\"Diag_Rapido\"] = {\"Verde\": 6/60, \"Amarillo\": 8/60}\n\n    # 3) Diag_Rapido usa su propio equipo (Medicos_Rapidos), independiente\n    #    de la bolsa \"Medicos\" que atiende Diag_Inicial/Diag_Preliminar.\n    cfg.POOL_ESTACION = copy.deepcopy(cfg.POOL_ESTACION)\n    cfg.POOL_ESTACION[\"Diag_Rapido\"] = \"Medicos_Rapidos\"\n\n    # 4) Derivaciones: Triaje deriva una fracción de Verde/Amarillo al circuito\n    #    rápido; Naranja/Rojo no cambian.\n    cfg.PROB_DERIVACION = copy.deepcopy(cfg.PROB_DERIVACION)\n    cfg.PROB_DERIVACION[\"Triaje\"] = {\n        \"Verde\":    {\"Aislamiento\": 0.05, \"Diag_Rapido\": 0.70, \"Diag_Inicial\": 0.25},\n        \"Amarillo\": {\"Aislamiento\": 0.10, \"Diag_Rapido\": 0.30, \"Diag_Inicial\": 0.60},\n        \"Naranja\":  {\"Aislamiento\": 0.12, \"Diag_Inicial\": 0.88},\n        \"Rojo\":     {\"Diag_Inicial\": 1.0},\n    }\n    cfg.PROB_DERIVACION[\"Diag_Rapido\"] = {\n        \"Verde\":    {\"Farmacia\": 0.75, \"Pruebas_Basicas\": 0.25},\n        \"Amarillo\": {\"Farmacia\": 0.45, \"Pruebas_Basicas\": 0.50, \"Diag_Inicial\": 0.05},\n    }\n\n    # 5) Coste del escenario\n    cfg.COSTES_FIJOS = {\"personal_fasttrack_anual\": 310_000}\n    return cfg\n\n\n\ndef construir_config_bedpool():\n    cfg = construir_config_base()\n    cfg.nombre = \"Escenario C - Gestión Dinámica de Camas UCI\"\n    cfg.UCI_MODE = \"pooled\"   # único cambio real: pool único con prioridad por gravedad\n    # cfg.UCI_TOTAL_CAPACIDAD se mantiene IGUAL que en la línea base (79 camas):\n    # no se añade ninguna cama nueva, sólo se reorganiza su gestión.\n    cfg.COSTES_FIJOS = {\"reorganizacion_unica\": 45_000}   # coste único, no anual\n    return cfg\n\nESCENARIOS_POR_DEFECTO = {\n    \"Línea base\": construir_config_base,\n    \"A · IA\": construir_config_ia,\n    \"B · Fast-Track\": construir_config_fasttrack,\n    \"C · UCI compartida\": construir_config_bedpool,\n}\n\n\ndef combinar_configs(*cfgs, nombre=None, base=None):\n    \"\"\"Configuración que aplica sobre `base` (línea base por defecto) todos los cambios que cada\n    escenario de `cfgs` introduce respecto a esa base (a nivel de fila de las tablas).\"\"\"\n    base = base if base is not None else construir_config_base()\n    out = Config.from_dict(base.to_dict())\n    for c in cfgs:\n        for attr, val in vars(c).items():\n            if attr in (\"nombre\", \"descripcion\"):\n                continue\n            if attr == \"COSTES_FIJOS\":\n                out.COSTES_FIJOS = {**out.COSTES_FIJOS, **val}\n                continue\n            bval = getattr(base, attr, None)\n            if isinstance(val, dict) and isinstance(bval, dict):\n                actual = getattr(out, attr)\n                for k, v in val.items():\n                    if k not in bval:\n                        actual[k] = copy.deepcopy(v)\n                    elif v != bval[k]:\n                        if isinstance(v, dict) and isinstance(bval[k], dict):\n                            for k2, v2 in v.items():\n                                if bval[k].get(k2) != v2:\n                                    actual[k][k2] = copy.deepcopy(v2)\n                        else:\n                            actual[k] = copy.deepcopy(v)\n            elif val != bval:\n                setattr(out, attr, copy.deepcopy(val))\n    out.nombre = nombre or \" + \".join(getattr(c, \"nombre\", \"?\") for c in cfgs)\n    return out\n",
 "kpis.py": "# -*- coding: utf-8 -*-\n\"\"\"KPIs, SLAs, análisis Monte Carlo y comparación de escenarios de la red de colas hospitalaria.\n\nFunciones del cuaderno '01 Red de Colas Hospitalaria' (Tareas 1, 2 y 6), reorganizadas como módulo\npara la aplicación Streamlit.\"\"\"\nimport math\nimport sys\nimport time\n\nimport numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfrom motor import TIPOS, simular\n\nPARAM = {\n    # Reembolso por alta (€) según perfil\n    \"REEMBOLSO\": {\"Verde\": 420, \"Amarillo\": 1250, \"Naranja\": 6100, \"Rojo\": 15200},\n    # Coste por servicio/procedimiento realizado (€)\n    \"COSTE_SERVICIO\": {\"Pruebas_Basicas\": 40, \"Pruebas_Avanzadas\": 220,\n                       \"Consulta_Especialista\": 95, \"Quirofano\": 3500},\n    # Coste por día de estancia (€/día)\n    \"COSTE_DIA\": {\"Planta\": 550, \"Planta_PostUCI\": 550, \"UCI\": 2100, \"Rehabilitacion\": 380},\n    # Penalizaciones\n    \"PEN_FALLECE\": 3000,\n    \"PEN_SIN_UCI\": 10000,      # adicional a la anterior\n    # Tramos de margen exigido según tasa de altas: (umbral, margen)\n    \"TRAMOS_MARGEN\": [(0.90, 0.15), (0.80, 0.10), (0.75, 0.075)],\n    \"MARGEN_MINIMO\": 0.05,\n    # SLAs\n    \"SLA_LATENCIA_H\": 15 / 60,          # 15 minutos hasta Diag_Inicial (Naranja/Rojo)\n    \"SLA_LATENCIA_CUMPL\": 0.95,         # se exige que el 95% de los pacientes lo cumpla\n    \"SLA_RATIO_ESPERA\": 0.25,           # Verde/Amarillo\n    \"SLA_OCUP_UCI\": 0.90,\n    \"SLA_SIN_UCI\": 0.02,                # sobre pacientes Naranja/Rojo\n    # Ventanas de análisis (horas)\n    \"T_WARMUP\": 10 * 24,\n    \"T_COOLDOWN\": 10 * 24,\n}\n\n\nESTADOS_ABS = [\"Alta\", \"Fallece\"]\n\n\nESTACIONES_CAMA = {\"Planta\", \"Planta_PostUCI\", \"Quirofano\", \"Rehabilitacion\", \"UCI\"}\n\n\ndef estaciones_cama(cfg):\n    \"\"\"Estaciones que retienen una cama: camas físicas, sus alias y la UCI.\"\"\"\n    return set(cfg.CAMAS_CAPACIDAD) | set(getattr(cfg, \"CAMA_ALIAS\", {})) | {\"UCI\"}\n\n\nFRANJAS = [(\"22-07\", 22, 7), (\"07-10\", 7, 10), (\"10-14\", 10, 14), (\"14-17\", 14, 17), (\"17-22\", 17, 22)]\n\n\ndef franja_de_hora(h):\n    \"\"\"Devuelve la etiqueta de la franja horaria a la que pertenece la hora del día `h`.\"\"\"\n    for nombre, ini, fin in FRANJAS:\n        if (ini > fin and (h >= ini or h < fin)) or (ini < fin and ini <= h < fin):\n            return nombre\n\n\ndef margen_exigido(tasa_alta, param=PARAM):\n    \"\"\"Margen operativo exigido por el acuerdo de financiación según la tasa de altas.\"\"\"\n    for umbral, margen in param[\"TRAMOS_MARGEN\"]:\n        if tasa_alta > umbral:\n            return margen\n    return param[\"MARGEN_MINIMO\"]\n\n\ndef preparar_traza(df):\n    \"\"\"Ordena la traza por paciente y tiempo y añade columnas auxiliares:\n    * `T_end_real`: instante real de salida de la estación (= T_in de la fila siguiente).\n    * `T_hueco`: espera no registrada en T_wait (espera de Box).\n    * `Sala_prev`: sala física que ocupaba el paciente en la fila anterior.\n    * `Fin`: True si la fila está cortada por el final de la simulación.\"\"\"\n    d = df.sort_values([\"Id_pat\", \"T_in\", \"T_out\"], kind=\"mergesort\").reset_index(drop=True).copy()\n    g = d.groupby(\"Id_pat\", sort=False)\n    sig = g[\"T_in\"].shift(-1)\n    d[\"T_end_real\"] = sig.fillna(d[\"T_out\"])\n    d[\"T_end_real\"] = np.maximum(d[\"T_end_real\"], d[\"T_out\"])\n    d[\"T_hueco\"] = (d[\"T_end_real\"] - d[\"T_out\"]).clip(lower=0)\n    d.loc[d[\"T_hueco\"] < 1e-3, \"T_hueco\"] = 0.0\n    d[\"Sala_prev\"] = g[\"Wait_room\"].shift(1).fillna(\"Sala_Espera_Urgencias\")\n    d[\"Fin\"] = d[\"Station_out\"].eq(\"Fin_Simulacion\")\n    d[\"Sin_UCI\"] = d[\"ID_server\"].eq(\"Sin_UCI_Disponible\")\n    return d\n\n\ndef horizonte(df):\n    \"\"\"Duración total (horas) de la traza, redondeada al día.\"\"\"\n    return math.ceil(df[\"T_out\"].max() / 24) * 24\n\n\ndef tasa_llegadas_franja(df, dias=None):\n    \"\"\"Tasa de llegadas (pacientes/hora) y reparto por perfil en cada franja horaria.\"\"\"\n    adm = df.loc[df[\"Station_in\"] == \"Admision\", [\"Id_pat\", \"Pat_type\", \"T_in\"]].drop_duplicates(\"Id_pat\")\n    if dias is None:\n        dias = horizonte(df) / 24\n    adm[\"Franja\"] = (adm[\"T_in\"].astype(int) % 24).map(franja_de_hora)\n    horas_franja = {n: ((fin - ini) % 24) * dias for n, ini, fin in FRANJAS}\n    tab = adm.groupby(\"Franja\")[\"Id_pat\"].count().rename(\"Llegadas\").to_frame()\n    tab[\"Horas\"] = tab.index.map(horas_franja)\n    tab[\"Tasa_obs (pac/h)\"] = tab[\"Llegadas\"] / tab[\"Horas\"]\n    tab[\"Tasa_teórica\"] = tab.index.map(TASAS_TEORICAS)\n    mix = pd.crosstab(adm[\"Franja\"], adm[\"Pat_type\"], normalize=\"index\").reindex(columns=TIPOS)\n    tab = tab.join(mix.add_prefix(\"%\"))\n    tab = tab.reindex([n for n, _, _ in FRANJAS])\n    total = pd.Series({\"Llegadas\": len(adm), \"Horas\": 24 * dias,\n                       \"Tasa_obs (pac/h)\": len(adm) / (24 * dias)}, name=\"Total\")\n    mix_tot = adm[\"Pat_type\"].value_counts(normalize=True).reindex(TIPOS).add_prefix(\"%\")\n    total = pd.concat([total, mix_tot])\n    return pd.concat([tab, pd.DataFrame([total], index=[\"Total\"])])\n\n\ndef tiempos_servicio(df, cfg=None):\n    \"\"\"Estadísticos del tiempo de servicio (horas) por estación y perfil.\n    Si se pasa `cfg`, añade el valor teórico de la configuración para comparar.\"\"\"\n    d = df.loc[~df[\"Station_out\"].eq(\"Fin_Simulacion\") & ~df[\"ID_server\"].eq(\"Sin_UCI_Disponible\")]\n    tab = (d.groupby([\"Station_in\", \"Pat_type\"])[\"T_server\"]\n             .agg(n=\"count\", media=\"mean\", sd=\"std\", minimo=\"min\", maximo=\"max\").reset_index())\n    if cfg is not None:\n        tab[\"teorico\"] = [cfg.TIEMPOS_SERVICIO.get(e, {}).get(t, np.nan)\n                          for e, t in zip(tab[\"Station_in\"], tab[\"Pat_type\"])]\n        tab[\"media/teorico\"] = tab[\"media\"] / tab[\"teorico\"]\n    return tab\n\n\ndef tabla_tiempos_s
