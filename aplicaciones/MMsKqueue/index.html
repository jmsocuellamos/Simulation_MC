  <div id="carga">
    <h1>📶 Simulador de colas M/M/s/K</h1>
    <p>Cargando Python en el navegador e instalando los paquetes (pandas, SciPy, matplotlib…).
       La primera vez puede tardar uno o dos minutos; después el navegador lo guarda en caché.</p>
    <div class="barra"><div></div></div>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
    const ficheros = {
 "app.py": "# -*- coding: utf-8 -*-\n\"\"\"Simulador de colas M/M/s/K (capacidad finita K) · aplicación Streamlit.\n\nEjecutar con:   streamlit run app.py\n\"\"\"\nimport copy\nimport datetime\nimport io\nimport json\nimport math\nimport sys\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\nimport matplotlib.pyplot as plt\n\nimport mmsk\nimport graficos as gr\nimport informe\nfrom mmsk import num, pct, eur, unidad_larga, unidad_sing\n\nst.set_page_config(page_title=\"Simulador · Colas M/M/s/K\", page_icon=\"📶\", layout=\"wide\")\nEN_NAVEGADOR = sys.platform == \"emscripten\"\n\nESCENARIOS_DEF = {\n    \"Base · M/M/2/5\": {\"lambda\": 6.0, \"mu\": 4.0, \"s\": 2, \"K\": 5, \"cs\": None,\n                       \"descripcion\": \"Configuración actual: dos servidores (μ = 4 clientes/hora cada uno) y capacidad para \"\n                                      \"5 clientes en total (3 en cola).\"},\n    \"Más capacidad · K = 10\": {\"lambda\": 6.0, \"mu\": 4.0, \"s\": 2, \"K\": 10, \"cs\": None,\n                               \"descripcion\": \"Se amplía la sala de espera: capacidad total K = 10 con los mismos dos servidores.\"},\n    \"3 servidores\": {\"lambda\": 6.0, \"mu\": 4.0, \"s\": 3, \"K\": 5, \"cs\": None,\n                     \"descripcion\": \"Se añade un tercer servidor idéntico manteniendo la capacidad K = 5.\"},\n    \"Servicio más rápido\": {\"lambda\": 6.0, \"mu\": 5.0, \"s\": 2, \"K\": 5, \"cs\": 36.0,\n                            \"descripcion\": \"Dos servidores más rápidos (μ = 5) pero más caros (c_s = 36 €/hora), con K = 5.\"},\n}\nCOMUNES_DEF = {\"unidad\": \"h\", \"cq\": 10.0, \"cs\": 30.0, \"s_max\": 8, \"objetivos\": dict(mmsk.OBJETIVOS_DEF)}\nAJUSTES_DEF = {\"duracion\": 5000.0, \"replicas\": 8, \"semilla\": 1000}\n\n\n# ==============================================================================================\n# Estado de la sesión\n# ==============================================================================================\nss = st.session_state\nif \"escenarios\" not in ss:\n    ss.escenarios = copy.deepcopy(ESCENARIOS_DEF)\n    ss.comunes = copy.deepcopy(COMUNES_DEF)\n    ss.ajustes = copy.deepcopy(AJUSTES_DEF)\n    ss.resultados = None\n    ss.informe_bytes = None\n    ss.version = 0\n    ss.esc_activo = next(iter(ss.escenarios))\n\n\ndef ver_fig(contenedor, fig):\n    \"\"\"Muestra una figura de matplotlib y la cierra para no acumular memoria entre ejecuciones.\"\"\"\n    contenedor.pyplot(fig, use_container_width=True)\n    plt.close(fig)\n\n\ndef mostrar_probs(df):\n    \"\"\"Tabla de probabilidad de n clientes a todo el ancho, con n como primera columna y columnas compactas.\"\"\"\n    d = fmt_probs(df).reset_index()\n    cfg = {\"n\": st.column_config.NumberColumn(\"n\", width=\"small\"),\n           \"Región\": st.column_config.TextColumn(\"Región\", width=\"medium\"),\n           \"Clientes en cola\": st.column_config.NumberColumn(\"En cola\", width=\"small\", help=\"Clientes esperando en cola\"),\n           \"Servidores ocupados\": st.column_config.NumberColumn(\"Ocupados\", width=\"small\", help=\"Servidores ocupados\")}\n    for c in d.columns:\n        if c.startswith((\"Teórica\", \"Simulada\")):\n            ic = \"📐 \" if c.startswith(\"Teórica\") else \"🎲 \"\n            cfg[c] = st.column_config.TextColumn(ic + c, width=\"small\")\n    st.dataframe(d, use_container_width=True, hide_index=True, column_config=cfg,\n                 height=min(38 + 35 * len(d), 600))\n\n\ndef fmt_probs(df):\n    \"\"\"Formato de la tabla de probabilidades (porcentajes).\"\"\"\n    out = df.copy()\n    for c in out.columns:\n        if c.startswith((\"Teórica\", \"Simulada\")):\n            out[c] = out[c].map(lambda v: pct(v, 2))\n    return out\n\n\ndef clave(*partes):\n    \"\"\"Clave de widget ligada a la versión de la configuración (al cargar o restablecer se regeneran).\"\"\"\n    return \"__\".join(str(p) for p in partes) + f\"__v{ss.version}\"\n\n\ndef configuracion():\n    return {\"comunes\": ss.comunes, \"ajustes\": ss.ajustes, \"escenarios\": ss.escenarios}\n\n\ndef cargar_configuracion(d):\n    ss.comunes = {**copy.deepcopy(COMUNES_DEF), **d.get(\"comunes\", {})}\n    ss.comunes[\"objetivos\"] = {**mmsk.OBJETIVOS_DEF, **d.get(\"comunes\", {}).get(\"objetivos\", {})}\n    ss.ajustes = {**copy.deepcopy(AJUSTES_DEF), **{k: v for k, v in d.get(\"ajustes\", {}).items() if k in AJUSTES_DEF}}\n    ss.escenarios = d.get(\"escenarios\") or copy.deepcopy(ESCENARIOS_DEF)\n    ss.esc_activo = next(iter(ss.escenarios))\n    ss.resultados, ss.informe_bytes = None, None\n    ss.version += 1\n\n\ncom, aj = ss.comunes, ss.ajustes\nif clave(\"unidad\") in ss:            # la unidad elegida en «Parámetros comunes» rige también la barra lateral\n    com[\"unidad\"] = ss[clave(\"unidad\")]\nU, US, UL = com[\"unidad\"], unidad_sing(com[\"unidad\"]), unidad_larga(com[\"unidad\"])\n\n# ==============================================================================================\n# Barra lateral\n# ==============================================================================================\nwith st.sidebar:\n    st.header(\"⚙️ Simulación\")\n    aj[\"duracion\"] = float(st.number_input(\"Duración de cada réplica\", 1.0, 1e9, float(aj[\"duracion\"]),\n                                           step=100.0, key=clave(\"dur\"),\n                                           help=f\"Tiempo simulado por réplica, en la unidad de tiempo del modelo (ahora, {UL}). Se descarta el \"\n                                                f\"primer {mmsk.CALENTAMIENTO:.0%} como calentamiento. Cuanto más largo, más \"\n                                                \"precisa es la estimación de los KPIs.\"))\n    aj[\"replicas\"] = int(st.number_input(\"Réplicas (semillas)\", 2, 100, int(aj[\"replicas\"]), key=clave(\"rep\"),\n                                         help=\"Cada réplica usa una semilla distinta (semilla + i); el IC95 % se calcula \"\n                                              \"con la variabilidad entre réplicas.\"))\n    aj[\"semilla\"] = int(st.number_input(\"Semilla de inicialización\", 0, 10**9, int(aj[\"semilla\"]), key=clave(\"sem\")))\n    if ss.escenarios:\n        lam_max = max(float(e[\"lambda\"]) for e in ss.escenarios.values())\n        st.caption(f\"Con λ = {num(lam_max, 2)} clientes/{US}, cada réplica genera unas \"\n                   f\"{num(lam_max * aj['duracion'], 0)} llegadas.\")\n    nombres = list(ss.escenarios)\n    sel = st.multiselect(\"Escenarios a simular\", nombres, default=nombres, key=clave(\"sel\"))\n    if EN_NAVEGADOR:\n        st.caption(\"En el navegador la simulación es más lenta: con réplicas muy largas o muy numerosas puede tardar.\")\n    if st.button(\"▶️ Ejecutar análisis\", type=\"primary\", use_container_width=True, disabled=not sel):\n        barra = st.progress(0.0, text=\"Simulando…\")\n        res = {}\n        total = len(sel) * aj[\"replicas\"]\n        for i, n in enumerate(sel):\n            def prog(k, m, i=i, n=n):\n                barra.progress((i * aj[\"replicas\"] + k) / total, text=f\"{n}: réplica {k} de {m}\")\n            res[n] = mmsk.analizar_escenario(ss.escenarios[n], com, aj, prog)\n        ss.resultados = {\"res\": res, \"comunes\": copy.deepcopy(com), \"ajustes\": copy.deepcopy(aj),\n                         \"fecha\": f\"{datetime.datetime.now():%d/%m/%Y %H:%M}\"}\n        ss.informe_bytes = None\n        barra.progress(1.0, text=\"Análisis completado\")\n\n    st.divider()\n    st.subheader(\"💾 Configuración\")\n    st.download_button(\"Descargar configuración (JSON)\", json.dumps(configuracion(), ensure_ascii=False, indent=2),\n                       \"configuracion_mmsk.json\", \"application/json\", use_container_width=True)\n    fich = st.file_uploader(\"Cargar configuración (JSON)\", type=\"json\", key=clave(\"json\"))\n    if fich is not None and st.button(\"Aplicar configuración cargada\", use_container_width=True):\n        cargar_configuracion(json.loads(fich.getvalue().decode(\"utf-8\")))\n        st.rerun()\n    if st.button(\"↺ Restablecer valores por defecto\", use_container_width=True):\n        cargar_configuracion({})\n        st.rerun()\n\n# ==============================================================================================\n# Cabecera\n# ==============================================================================================\nst.title(\"📶 Simulador de colas M/M/s/K\")\nst.caption(\"Teoría de colas con capacidad finita K: distribución límite, probabilidad de bloqueo, validación por \"\n           \"simulación de eventos discretos, costes y dimensionamiento, con comparación de escenarios e informe Word. Basado en «D-190. Sistemas \"\n           \"de Colas», Javier Morales y Asun Martínez Mayoral, equipo IA4LEGOS (CC BY-SA 4.0).\")\ntab_com, tab_esc, tab_res, tab_inf = st.tabs([\"🌐 Parámetros comunes\", \"🏕️ Escenarios\", \"📊 Resultados\", \"📄 Informe\"])\n\n# ==============================================================================================\n# 1) Parámetros comunes\n# ==============================================================================================\nwith tab_com:\n    st.subheader(\"Parámetros comunes a todos los escenarios\")\n    c1, c2 = st.columns([2, 3])\n    with c1:\n        st.markdown(\"#### ⏱️ Unidad de tiempo\")\n        unidades = list(mmsk.UNIDADES)\n        com[\"unidad\"] = st.selectbox(\"Unidad de tiempo del modelo\", unidades, index=unidades.index(com[\"unidad\"]),\n                                     format_func=unidad_larga, key=clave(\"unidad\"),\n                                     help=\"Unidad en la que se expresan λ, μ, los tiempos (W, Wq, duración de las réplicas, \"\n                                          \"diagrama de funcionamiento) y los costes por unidad de tiempo (ut).\")\n        U, US, UL = com[\"unidad\"], unidad_sing(com[\"unidad\"]), unidad_larga(com[\"unidad\"])\n        st.markdown(\"#### 💶 Costes\")\n        com[\"cq\"] = float(st.number_input(\"Coste de espera (€/ut)\", 0.0, 1e9, float(com[\"cq\"]), 1.0,\n                                          key=clave(\"cq\"), help=f\"c_q: coste por cliente y unidad de tiempo (ut, ahora {US}) en el sistema, en cola o en servicio.\"))\n        com[\"cs\"] = float(st.number_input(\"Coste por servidor (€/ut)\", 0.0, 1e9,\n                                          float(com[\"cs\"]), 1.0, key=clave(\"cs\"),\n                                          help=f\"c_s: coste por servidor y unidad de tiempo (ut, ahora {US}); valor por defecto, cada escenario puede usar uno \"\n                                               \"propio en la pestaña Escenarios).\"))\n        com[\"s_max\"] = int(st.number_input(\"s máximo del dimensionamiento\", 1, 60, int(com[\"s_max\"]),\n                                           key=clave(\"smax\"), help=\"Se evalúa el coste total para s = 1 … min(s máximo, K), \"\n                                                                   \"manteniendo la capacidad K de cada escenario.\"))\n    with c2:\n        st.markdown(\"#### 🏆 Objetivos de servicio\")\n        st.caption(\"Criterios de calidad que deben cumplir los escenarios (se evalúan sobre los valores teóricos). \"\n                   \"Desmarca un objetivo para no evaluarlo.\")\n        ob = com[\"objetivos\"]\n        def objetivo(clave_obj, etiqueta, defecto, factor, paso, ayuda):\n            cc1, cc2 = st.columns([1, 2])\n            activo = cc1.checkbox(\"Evaluar\", value=ob.get(clave_obj) is not None, key=clave(\"obj_on\", clave_obj))\n            v = ob.get(clave_obj) if ob.get(clave_obj) is not None else defecto\n            x = cc2.number_input(etiqueta, 0.0, 1e9, float(v) * factor, paso, key=clave(\"obj\", clave_obj), help=ayuda,\n                                 disabled=not activo)\n            ob[clave_obj] = (x / factor) if activo else None\n        objetivo(\"RHO_MAX\", \"ρ̄ máxima (%)\", 0.85, 100, 1.0, \"Ocupación efectiva máxima admisible de cada servidor, ρ̄ = λ̄/(sμ).\")\n        objetivo(\"WQ_MAX\", f\"Wq máxima ({UL})\", 0.25, 1, 0.05, f\"Tiempo medio de espera en cola admisible, en {UL}.\")\n        objetivo(\"PBLOQ_MAX\", \"P(bloqueo) máxima (%)\", 0.05, 100, 0.5,\n                 \"Proporción máxima admisible de clientes rechazados por encontrar el sistema lleno (N = K).\")\n        objetivo(\"LQ_MAX\", \"Lq máxima (clientes)\", 1.0, 1, 0.5, \"Número medio de clientes en cola admisible.\")\n\n# ==============================================================================================\n# 2) Escenarios\n# ==============================================================================================\nwith tab_esc:\n    st.subheader(\"Escenarios\")\n    nombres = list(ss.escenarios)\n    if ss.esc_activo not in nombres:\n        ss.esc_activo = nombres[0]\n    c1, c2, c3, c4 = st.columns([3, 2, 1, 1])\n    activo = c1.selectbox(\"Escenario a editar\", nombres, index=nombres.index(ss.esc_activo), key=clave(\"activo\"))\n    ss.esc_activo = activo\n    nuevo = c2.text_input(\"Nombre para copiar / renombrar\", key=clave(\"nuevo_nombre\"), placeholder=\"nombre del escenario\")\n    if c3.button(\"Copiar\", use_container_width=True, help=\"Crea un escenario nuevo copiando el actual\"):\n        if nuevo and nuevo not in ss.escenarios:\n            ss.escenarios[nuevo] = copy.deepcopy(ss.escenarios[activo]); ss.esc_activo = nuevo; ss.version += 1; st.rerun()\n        else:\n            st.warning(\"Escribe un nombre nuevo que no exista.\")\n    if c4.button(\"Renombrar\", use_container_width=True):\n        if nuevo and nuevo not in ss.escenarios:\n            ss.escenarios = {(nuevo if k == activo else k): v for k, v in ss.escenarios.items()}\n            ss.esc_activo = nuevo; ss.version += 1; st.rerun()\n        else:\n            st.warning(\"Escribe un nombre nuevo que no exista.\")\n\n    e = ss.escenarios[activo]\n    st.markdown(f\"#### Parámetros de «{activo}»\")\n    e.setdefault(\"K\", max(int(e.get(\"s\", 1)), 5))\n    c1, c2, c3, c5, c4 = st.columns(5)\n    e[\"lambda\"] = float(c1.number_input(f\"λ · llegadas por {US}\", 1e-6, 1e9, float(e[\"lambda\"]), 0.1,\n                                        format=\"%.4f\", key=clave(\"lam\", activo),\n                                        help=f\"Tasa de llegadas (proceso de Poisson), en clientes por {US}.\"))\n    e[\"mu\"] = float(c2.number_input(f\"μ · servicios por {US}\", 1e-6, 1e9, float(e[\"mu\"]), 0.1,\n                                    format=\"%.4f\", key=clave(\"mu\", activo),\n                                    help=f\"Tasa de servicio de cada servidor, en clientes por {US} (tiempo medio de \"\n                                         \"servicio 1/μ, exponencial).\"))\n    e[\"s\"] = int(c3.number_input(\"s · servidores\", 1, 60, int(e[\"s\"]), 1, key=clave(\"s\", activo),\n                                 help=\"Número de servidores en paralelo.\"))\n    e[\"K\"] = int(c5.number_input(\"K · capacidad\", int(e[\"s\"]), 10_000, max(int(e[\"K\"]), int(e[\"s\"])), 1,\n                                 key=clave(\"K\", activo, e[\"s\"]),\n                                 help=f\"Clientes máximos en el sistema (en servicio + en cola), K ≥ s. Cola máxima: K − s = \"\n                                      f\"{max(int(e['K']), int(e['s'])) - int(e['s'])}. Las llegadas con el sistema lleno se pierden.\"))\n    propio = c4.checkbox(\"c_s propio del escenario\", value=e.get(\"cs\") is not None, key=clave(\"cs_on\", activo),\n                         help=\"Si se marca, el escenario usa su propio coste por servidor en lugar del común.\")\n    if propio:\n        e[\"cs\"] = float(c4.number_input(\"Coste por servidor (€/ut)\", 0.0, 1e9,\n                                        float(e[\"cs\"] if e.get(\"cs\") is not None else com[\"cs\"]), 1.0, key=clave(\"cs_esc\", activo)))\n    else:\n        e[\"cs\"] = None\n    e[\"descripcion\"] = st.text_area(\"Descripción\", e.get(\"descripcion\", \"\"), key=clave(\"desc\", activo), height=70)\n\n    t = mmsk.teoria(e[\"lambda\"], e[\"mu\"], e[\"s\"], e[\"K\"])\n    cs_e = e[\"cs\"] if e[\"cs\"] is not None else com[\"cs\"]\n    cst = mmsk.costes(t, com[\"cq\"], cs_e)\n    if t[\"rho\"] < 1:\n        st.success(f\"M/M/{t['s']}/{t['K']} · régimen subcrítico: ρ = {pct(t['rho'])} < 100 %. \"\n                   f\"Se rechaza el {pct(t['Pbloqueo'], 2)} de las llegadas.\")\n    else:\n        st.warning(f\"M/M/{t['s']}/{t['K']} · régimen saturado: ρ = {pct(t['rho'])} ≥ 100 %. Con capacidad infinita sería \"\n                   f\"inestable; aquí el sistema se llena y rechaza el {pct(t['Pbloqueo'], 2)} de las llegadas.\")\n    st.markdown(\"##### 📐 Vista previa teórica (fórmulas del modelo M/M/s/K, sin simular)\")\n    m = st.columns(6)\n    m[0].metric(\"ρ̄ (efectiva)\", pct(t[\"rho_eff\"]), help=\"Ocupación efectiva por servidor ρ̄ = λ̄/(sμ).\")\n    m[1].metric(\"P(bloqueo)\", pct(t[\"Pbloqueo\"], 2), help=\"Probabilidad de que una llegada encuentre el sistema lleno, p_K.\")\n    m[2].metric(\"L (en el sistema)\", num(t[\"L\"], 3), help=\"Número medio de clientes en el sistema.\")\n    m[3].metric(\"Lq (en cola)\", num(t[\"Lq\"], 3), help=\"Número medio de clientes en cola.\")\n    m[4].metric(f\"Wq ({UL})\", num(t[\"Wq\"], 4), help=\"Tiempo medio de espera en cola (clientes aceptados).\")\n    m[5].metric(f\"CT (€/{US})\", eur(cst[\"CT\"]), help=\"Coste total por unidad de tiempo.\")\n    ver_fig(st, gr.fig_pn(t, \"Probabilidad de n clientes en el sistema (teórica)\"))\n    with st.expander(\"Tabla de probabilidad de n clientes en el sistema (teórica)\", expanded=True):\n        mostrar_probs(mmsk.tabla_probabilidades(t))\n\n    st.divider()\n    c1, c2 = st.columns([3, 1])\n    c1.caption(\"Los cambios se aplican al pulsar «Ejecutar análisis» en la barra lateral.\")\n    if c2.button(\"🗑️ Eliminar este escenario\", use_container_width=True, disabled=len(ss.escenarios) <= 1):\n        ss.escenarios.pop(activo); ss.esc_activo = next(iter(ss.escenarios)); ss.version += 1; st.rerun()\n\n\n# ==============================================================================================\n# 3) Resultados\n# ==============================================================================================\ndef tabla_fmt(df, fn):\n    out = df.copy().astype(object)\n    for f in df.index:\n        for c in df.columns:\n            out.loc[f, c] = fn(f, c, df.loc[f, c])\n    return out\n\n\nwith tab_res:\n    R = ss.resultados\n    if R is None:\n        st.info(\"Todavía no hay resultados. Configura los escenarios y pulsa «▶️ Ejecutar análisis» en la barra lateral.\")\n    else:\n        res, Uc = R[\"res\"], R[\"comunes\"][\"unidad\"]\n        USc, ULc = unidad_sing(Uc), unidad_larga(Uc)\n        st.caption(f\"Análisis del {R['fecha']} · simulación: {R['ajustes']['replicas']} réplicas de \"\n                   f\"{num(R['ajustes']['duracion'], 0)} {ULc} · semilla {R['ajustes']['semilla']} · \"\n                   f\"escenarios: {', '.join(res)}\")\n        st.info(\"📐 **Teórico**: calculado con las fórmulas exactas del modelo M/M/s/K. \"\n                \"🎲 **Simulado**: estimado con la simulación de eventos discretos (media de las réplicas, con IC95 %).\")\n        r_sin, r_det, r_dat = st.tabs([\"Síntesis y comparación\", \"Detalle por escenario\", \"Datos de las réplicas (simulados)\"])\n        with r_sin:\n            st.markdown(\"#### Síntesis\")\n            for n, r in res.items():\n                st.markdown(f\"**{n}.** \" + mmsk.texto_escenario(n, r, Uc)[len(n) + 2:])\n            st.success(\"**Recomendación.** \" + mmsk.texto_recomendacion(res, Uc))\n            c1, c2 = st.columns([3, 2])\n            with c1:\n                st.markdown(\"**Comparación de escenarios** (filas «Teórico» = fórmulas; filas «Simulado» = Monte Carlo)\")\n                st.dataframe(tabla_fmt(mmsk.tabla_comparativa(res), mmsk.fmt_kpi), use_container_width=True, height=560)\n            with c2:\n                st.markdown(\"**Objetivos de servicio** (sobre los valores teóricos)\")\n                st.dataframe(mmsk.tabla_objetivos(res), use_container_width=True)\n                ver_fig(st, gr.fig_validacion(res))\n            ver_fig(st, gr.fig_comparativa(res, ULc))\n\n        with r_det:\n            n = st.selectbox(\"Escenario\", list(res), key=\"det_esc\")\n            r = res[n]\n            t, cst = r[\"teoria\"], r[\"costes\"]\n            mc = r[\"mc\"][\"replicas\"]\n            d_teo, d_sim, d_prob, d_cost = st.tabs([\"📐 Resultados teóricos\", \"🎲 Resultados simulados\",\n                                                   \"🔢 Probabilidad de n clientes\", \"💶 Costes y dimensionamiento\"])\n            with d_teo:\n                st.caption(f\"Valores exactos de las fórmulas del modelo M/M/{t['s']}/{t['K']} (distribución límite del \"\n                           \"proceso de nacimiento-muerte truncado en K).\")\n                m = st.columns(4)\n                m[0].metric(\"ρ (nominal)\", pct(t[\"rho\"]), \"subcrítico\" if t[\"rho\"] < 1 else \"saturado\",\n                            delta_color=\"normal\" if t[\"rho\"] < 1 else \"inverse\", help=\"Carga nominal por servidor ρ = λ/(sμ).\")\n                m[1].metric(\"ρ̄ (efectiva)\", pct(t[\"rho_eff\"]), help=\"Ocupación efectiva por servidor ρ̄ = λ̄/(sμ).\")\n                m[2].metric(\"a (Erlangs)\", num(t[\"a\"], 3), help=\"Carga ofrecida a = λ/μ.\")\n                m[3].metric(\"P0 (vacío)\", pct(t[\"P0\"]), help=\"Probabilidad de que el sistema esté vacío.\")\n                m = st.columns(4)\n                m[0].metric(\"P(bloqueo) = p_K\", pct(t[\"Pbloqueo\"], 2), help=\"Fracción de llegadas rechazadas.\")\n                m[1].metric(f\"λ̄ (aceptados/{USc})\", num(t[\"lambda_bar\"], 3), help=\"Tasa efectiva de entrada λ̄ = λ(1 − p_K).\")\n                m[2].metric(f\"Rechazos/{USc}\", num(t[\"lambda\"] - t[\"lambda_bar\"], 3), help=\"Clientes perdidos por unidad de tiempo, λ·p_K.\")\n                m[3].metric(\"P(espera) aceptados\", pct(t[\"Pespera\"]), help=\"Probabilidad de que un cliente aceptado tenga que esperar.\")\n                m = st.columns(4)\n                m[0].metric(\"L · en el sistema\", num(t[\"L\"], 3), help=\"Número medio de clientes en el sistema.\")\n                m[1].metric(\"Lq · en cola\", num(t[\"Lq\"], 3), help=\"Número medio de clientes en cola.\")\n                m[2].metric(f\"W ({ULc})\", num(t[\"W\"], 4), help=\"Tiempo medio en el sistema (W = L/λ̄).\")\n                m[3].metric(f\"Wq ({ULc})\", num(t[\"Wq\"], 4), help=\"Tiempo medio en cola (Wq = W − 1/μ).\")\n                st.markdown(\"**Objetivos de servicio** (evaluados sobre los valores teóricos)\")\n                st.dataframe(tabla_fmt(r[\"objetivos\"], informe.fmt_obj), use_container_width=True)\n            with d_sim:\n                st.caption(f\"Estimaciones de la simulación de eventos discretos: {R['ajustes']['replicas']} réplicas de \"\n                           f\"{num(R['ajustes']['duracion'], 0)} {ULc}, descartando el primer {mmsk.CALENTAMIENTO:.0%} como calentamiento \"\n                           f\"(unas {num(mc['Llegadas'].mean(), 0)} llegadas medidas por réplica, de las que se rechazan unas {num(mc['Rechazos'].mean(), 0)}). Se comparan con el valor teórico y su intervalo de confianza al 95 %.\")\n                m = st.columns(5)\n                for col, (k, d) in zip(m, [(\"L\", 3), (\"Lq\", 3), (\"W\", 4), (\"Wq\", 4), (\"P(bloqueo)\", None)]):\n                    v_sim, v_teo = mc[k].mean(), r[\"resumen_mc\"].loc[k, \"Teórico (fórmula)\"]\n                    et = k + (f\" sim. ({ULc})\" if k in (\"W\", \"Wq\") else \" simulado\")\n                    col.metric(et, pct(v_sim, 2) if d is None else num(v_sim, d),\n                               \"teórico \" + (pct(v_teo, 2) if d is None else num(v_teo, d)),\n                               delta_color=\"off\")\n                st.markdown(\"**KPIs simulados frente a teóricos**\")\n                st.dataframe(tabla_fmt(r[\"resumen_mc\"], informe.fmt_mc), use_container_width=True)\n                c1, c2 = st.columns(2)\n                ver_fig(c1, gr.fig_pn_comparada(r[\"mc\"][\"pn\"], t))\n                ver_fig(c2, gr.fig_traza(r[\"mc\"][\"traza\"], t[\"s\"], ULc, K=t[\"K\"]))\n                n_rech = int(r[\"clientes\"][\"Rechazado\"].sum())\n                st.markdown(f\"**Diagrama de funcionamiento (simulado)** · primeras {len(r['clientes'])} llegadas \"\n                            f\"({n_rech} rechazadas por encontrar el sistema lleno, marcadas con ✕)\")\n                ver_fig(st, gr.fig_diagrama(r[\"clientes\"], t[\"s\"], None, ULc))\n                with st.expander(\"Clientes del diagrama (llegada, inicio y fin de servicio, servidor, rechazo)\"):\n                    st.dataframe(r[\"clientes\"].round(4), use_container_width=True, hide_index=True)\n            with d_prob:\n                st.caption(\"Probabilidad de que haya exactamente n clientes en el sistema, P(N = n), su acumulada P(N ≤ n) y la \"\n                           \"probabilidad de superar n, P(N > n). Columnas «Teórica»: fórmulas exactas. Columnas «Simulada»: \"\n                           \"fracción del tiempo simulado con n clientes (todas las réplicas). n va de 0 a K; p_K es la probabilidad de bloqueo.\")\n                st.markdown(\"**Calculadora**\")\n                c1, c2, c3, c4 = st.columns(4)\n                tipo = c1.selectbox(\"Probabilidad\", [\"=\", \"≤\", \"≥\", \">\"], format_func=lambda x: f\"P(N {x} k)\", key=\"prob_tipo\")\n                k = int(c2.number_input(\"k (clientes)\", 0, int(t[\"K\"]), min(int(t[\"s\"]), int(t[\"K\"])), 1, key=f\"prob_k_{n}\"))\n                p_teo, p_sim = mmsk.prob_evento(t, r[\"mc\"][\"pn\"], tipo, k)\n                c3.metric(f\"📐 Teórica · P(N {tipo} {k})\", pct(p_teo, 2))\n                c4.metric(f\"🎲 Simulada · P(N {tipo} {k})\", pct(p_sim, 2))\n                tp = mmsk.tabla_probabilidades(t, r[\"mc\"][\"pn\"])\n                ver_fig(st, gr.fig_pn_comparada(r[\"mc\"][\"pn\"], t, \"Probabilidad de n clientes: simulada (barras) y teórica (línea)\"))\n                st.markdown(\"**Tabla de probabilidades**\")\n                mostrar_probs(tp)\n                st.download_button(\"Descargar la tabla (CSV)\", tp.to_csv().encode(\"utf-8\"), f\"probabilidades_{n}.csv\", \"text/csv\")\n            with d_cost:\n                st.caption(\"Costes por unidad de tiempo calculados con los valores teóricos (CTQ = λ·c_q·Wq con λ nominal). \"\n                           \"El coste de los clientes rechazados no se incluye.\")\n                m = st.columns(5)\n                m[0].metric(f\"c_t (€/{USc})\", eur(cst[\"c_t\"]), help=\"c_t = c_q + c_s\")\n                m[1].metric(\"CTS\", eur(cst[\"CTS\"]), help=\"Coste de los servidores ocupados.\")\n                m[2].metric(\"CTSn\", eur(cst[\"CTSn\"]), help=\"Coste de los servidores libres.\")\n                m[3].metric(\"CTQ\", eur(cst[\"CTQ\"]), help=\"Coste de espera de los clientes en cola.\")\n                m[4].metric(\"CT (total)\", eur(cst[\"CT\"]), help=\"CT = CTS + CTSn + CTQ.\")\n                c1, c2 = st.columns(2)\n                ver_fig(c1, gr.fig_costes(cst, USc))\n                ver_fig(c2, gr.fig_barrido(r[\"barrido\"], t[\"s\"], r[\"s_opt\"], USc))\n                if r[\"s_opt\"] is not None:\n                    st.info(f\"Con K = {t['K']}, número de servidores de menor coste total: **s = {r['s_opt']}** \"\n                            f\"(CT = {eur(r['barrido'].loc[r['s_opt'], 'CT'])}/{USc}).\")\n                st.dataframe(tabla_fmt(r[\"barrido\"], informe.fmt_barrido), use_container_width=True)\n\n        with r_dat:\n            st.markdown(\"Resultados **simulados** de cada réplica (una fila por réplica y escenario).\")\n            largo = pd.concat([r[\"mc\"][\"replicas\"].assign(Escenario=n) for n, r in res.items()]).reset_index()\n            st.dataframe(largo, use_container_width=True, hide_index=True)\n            buf = io.BytesIO()\n            try:\n                with pd.ExcelWriter(buf, engine=\"openpyxl\") as xw:\n                    largo.to_excel(xw, sheet_name=\"Replicas\", index=False)\n                    mmsk.tabla_comparativa(res).astype(str).to_excel(xw, sheet_name=\"Comparacion\")\n                    for i, (n, r) in enumerate(res.items(), 1):\n                        r[\"barrido\"].to_excel(xw, sheet_name=f\"Barrido {i}\")\n                        mmsk.tabla_probabilidades(r[\"teoria\"], r[\"mc\"][\"pn\"]).to_excel(xw, sheet_name=f\"Probabilidades {i}\")\n                st.download_button(\"Descargar Excel\", buf.getvalue(), \"resultados_mmsk.xlsx\",\n                                   \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n            except Exception as ex:  # openpyxl no disponible\n                st.download_button(\"Descargar CSV\", largo.to_csv(index=False).encode(\"utf-8\"), \"replicas_mmsk.csv\", \"text/csv\")\n\n# ==============================================================================================\n# 4) Informe\n# ==============================================================================================\nwith tab_inf:\n    R = ss.resultados\n    if R is None:\n        st.info(\"Ejecuta primero el análisis para poder generar el informe.\")\n    else:\n        st.markdown(\"El informe Word incluye los parámetros, la síntesis y la recomendación, la comparación de escenarios y, \"\n                    \"para cada escenario, la teoría (KPIs, bloqueo y distribución límite), la validación por simulación, el diagrama \"\n                    \"de funcionamiento y el análisis de costes y dimensionamiento.\")\n        titulo = st.text_input(\"Título del informe\", \"Sistema de colas M/M/s/K\", key=\"tit_inf\")\n        if st.button(\"📄 Generar informe (.docx)\", type=\"primary\"):\n            with st.spinner(\"Generando informe…\"):\n                ss.informe_bytes = informe.generar_informe(R[\"res\"], R[\"comunes\"], R[\"ajustes\"], titulo)\n        if ss.informe_bytes:\n            st.download_button(\"⬇️ Descargar informe\", ss.informe_bytes,\n                               f\"Informe_Colas_MMsK_{datetime.date.today():%Y%m%d}.docx\",\n                               \"application/vnd.openxmlformats-officedocument.wordprocessingml.document\")\n",
 "mmsk.py": "# -*- coding: utf-8 -*-\n\"\"\"Modelo de colas M/M/s/K (capacidad finita K): teoría, simulación de eventos discretos con bloqueo,\ncostes, dimensionamiento y comparación de escenarios.\n\nBasado en «D-190. Sistemas de Colas», Javier Morales y Asun Martínez Mayoral, equipo IA4LEGOS (CC BY-SA 4.0).\"\"\"\nimport math\nimport random\n\nimport numpy as np\nimport pandas as pd\n\ntry:\n    from scipy import stats as _stats\nexcept Exception:          # pragma: no cover - sin scipy se usa la aproximación normal\n    _stats = None\n\nUNIDADES = {\"s\": (\"segundos\", \"segundo\"), \"min\": (\"minutos\", \"minuto\"), \"h\": (\"horas\", \"hora\"),\n            \"días\": (\"días\", \"día\"), \"sem\": (\"semanas\", \"semana\")}\n\n\ndef unidad_larga(u):\n    return UNIDADES.get(u, (u, u))[0]\n\n\ndef unidad_sing(u):\n    return UNIDADES.get(u, (u, u))[1]\n\n\n# ==============================================================================================\n# Teoría: M/M/s/K (capacidad finita K = clientes en servicio + en cola)\n# ==============================================================================================\ndef teoria(lam, mu, s, K):\n    \"\"\"Distribución límite y KPIs del sistema M/M/s/K (proceso de nacimiento-muerte truncado en K).\n\n    a = λ/μ (carga ofrecida, Erlangs), ρ = a/s (carga nominal por servidor). Con capacidad finita SIEMPRE existe\n    régimen estacionario: si ρ ≥ 1 la cola no crece sin límite, sino que el sistema se llena y rechaza clientes.\n    Las llegadas que encuentran N = K se pierden: λ̄ = λ(1 − p_K) es la tasa efectiva de entrada.\"\"\"\n    lam, mu, s, K = float(lam), float(mu), int(s), int(K)\n    K = max(K, s)\n    a = lam / mu\n    rho = a / s\n    suma = sum(a ** n / math.factorial(n) for n in range(s))\n    term_s = a ** s / math.factorial(s)\n    geo = (K - s + 1) if abs(rho - 1) < 1e-9 else (1 - rho ** (K - s + 1)) / (1 - rho)\n    P0 = 1.0 / (suma + term_s * geo)\n    pn = np.array([P0 * a ** n / math.factorial(n) if n < s else P0 * term_s * rho ** (n - s)\n                   for n in range(K + 1)])\n    L = float(np.dot(np.arange(K + 1), pn))\n    Pbloq = float(pn[K])\n    lam_bar = lam * (1 - Pbloq)\n    Lq = max(0.0, L - lam_bar / mu)\n    W = L / lam_bar\n    Wq = max(0.0, W - 1 / mu)\n    # Probabilidad de que un cliente ACEPTADO tenga que esperar (PASTA: ve N = n con probabilidad p_n, n < K)\n    Pespera = float(pn[s:K].sum() / (1 - Pbloq)) if K > s else 0.0\n    return {\"lambda\": lam, \"mu\": mu, \"s\": s, \"K\": K, \"a\": a, \"rho\": rho, \"rho_eff\": lam_bar / (s * mu),\n            \"estable\": True, \"estado\": \"Subcrítico (ρ < 1)\" if rho < 1 else \"Saturado (ρ ≥ 1, lo contiene el bloqueo)\",\n            \"P0\": P0, \"Pbloqueo\": Pbloq, \"lambda_bar\": lam_bar, \"Pespera\": Pespera,\n            \"L\": L, \"Lq\": Lq, \"W\": W, \"Wq\": Wq, \"Ocupados\": L - Lq, \"pn\": pn}\n\n\ndef costes(sis, cq, cs):\n    \"\"\"Costes por unidad de tiempo (como en la clase M_M_s_K del cuaderno).\n    CTS: servidores ocupados (L − Lq), a c_t = c_q + c_s; CTSn: servidores desocupados, a c_s;\n    CTQ: espera en cola, λ·c_q·Wq (con λ nominal); CT = CTS + CTSn + CTQ.\"\"\"\n    ct = cq + cs\n    CTS = ct * sis[\"Ocupados\"]\n    CTSn = cs * (sis[\"s\"] - sis[\"Ocupados\"])\n    CTQ = sis[\"lambda\"] * cq * sis[\"Wq\"]\n    return {\"c_t\": ct, \"CTS\": CTS, \"CTSn\": CTSn, \"CTQ\": CTQ, \"CT\": CTS + CTSn + CTQ}\n\n\ndef barrido(lam, mu, cq, cs, s_max, K):\n    \"\"\"Coste total y KPIs para s = 1 … min(s_max, K), manteniendo la capacidad K.\"\"\"\n    filas = []\n    for s in range(1, min(int(s_max), int(K)) + 1):\n        t = teoria(lam, mu, s, K)\n        c = costes(t, cq, cs)\n        filas.append({\"s\": s, \"ρ\": t[\"rho\"], \"ρ̄\": t[\"rho_eff\"], \"P(bloqueo)\": t[\"Pbloqueo\"], \"λ̄\": t[\"lambda_bar\"],\n                      \"L\": t[\"L\"], \"Lq\": t[\"Lq\"], \"W\": t[\"W\"], \"Wq\": t[\"Wq\"], \"CTS\": c[\"CTS\"], \"CTSn\": c[\"CTSn\"],\n                      \"CTQ\": c[\"CTQ\"], \"CT\": c[\"CT\"]})\n    df = pd.DataFrame(filas).set_index(\"s\")\n    s_opt = int(df[\"CT\"].idxmin()) if len(df) else None\n    return df, s_opt\n\n\n# ==============================================================================================\n# Simulación de eventos discretos (relojes exponenciales exactos, sin discretizar el tiempo)\n# ==============================================================================================\nN_DIAGRAMA = 60          # clientes (llegadas) que se muestran en el diagrama de funcionamiento\nCALENTAMIENTO = 0.05      # fracción inicial de cada réplica que se descarta (el sistema arranca vacío)\n\n\ndef simular_replica(lam, mu, s, K, t_max, semilla, n_traza=0, calentamiento=CALENTAMIENTO):\n    \"\"\"Una réplica del proceso M/M/s/K durante `t_max` unidades de tiempo (las del modelo). Una llegada que encuentra\n    N = K clientes se rechaza (bloqueo). Las estadísticas se acumulan tras descartar el calentamiento inicial.\n    Devuelve L, Lq (áreas bajo N(t) y la cola), λ̄ observada, W = L/λ̄ y Wq = Lq/λ̄ (Little), P(bloqueo) y P(espera)\n    observadas, servidores ocupados medios, la distribución p_n ponderada por tiempo y la traza N(t).\"\"\"\n    rng = random.Random(semilla)\n    expo = rng.expovariate\n    K = max(int(K), int(s))\n    t0 = calentamiento * t_max\n    t = 0.0\n    n = 0\n    llegadas = rechazos = esperan = 0\n    area_n = area_q = 0.0\n    t_estado = np.zeros(K + 1)\n    traza = [(0.0, 0)] if n_traza else None\n    prox_lleg = expo(lam)\n    prox_sal = math.inf\n    while True:\n        t_sig = prox_lleg if prox_lleg <= prox_sal else prox_sal\n        fin = t_sig >= t_max\n        if fin:\n            t_sig = t_max\n        if t_sig > t0:\n            dt = t_sig - max(t, t0)\n            area_n += n * dt\n            if n > s:\n                area_q += (n - s) * dt\n            t_estado[n] += dt\n        t = t_sig\n        if fin:\n            break\n        if prox_lleg <= prox_sal:\n            medir = t >= t0\n            if medir:\n                llegadas += 1\n            if n >= K:                       # sistema lleno: el cliente se pierde\n                if medir:\n                    rechazos += 1\n            else:\n                if medir and n >= s:\n                    esperan += 1\n                n += 1\n                prox_sal = t + expo(min(n, s) * mu)      # reloj exponencial: se puede volver a muestrear\n            prox_lleg = t + expo(lam)\n        else:\n            n -= 1\n            prox_sal = t + expo(min(n, s) * mu) if n > 0 else math.inf\n        if traza is not None and len(traza) < n_traza:\n            traza.append((t, n))\n    T = t_max - t0\n    L, Lq = area_n / T, area_q / T\n    aceptadas = llegadas - rechazos\n    lam_bar = aceptadas / T\n    W = L / lam_bar if lam_bar > 0 else float(\"nan\")\n    Wq = Lq / lam_bar if lam_bar > 0 else float(\"nan\")\n    return {\"L\": L, \"Lq\": Lq, \"W\": W, \"Wq\": Wq, \"Pbloqueo\": rechazos / llegadas if llegadas else 0.0,\n            \"Pespera\": esperan / aceptadas if aceptadas else 0.0, \"lambda_bar\": lam_bar, \"Llegadas\": llegadas,\n            \"Rechazos\": rechazos, \"Ocupados\": L - Lq, \"T\": T, \"pn\": t_estado / T, \"traza\": traza}\n\n\ndef simular_clientes(lam, mu, s, K, n_clientes, semilla):\n    \"\"\"Simulación cliente a cliente (cola FIFO, s servidores, capacidad K) de las primeras `n_clientes` llegadas,\n    para el diagrama de funcionamiento. Una llegada que encuentra K clientes en el sistema se rechaza.\"\"\"\n    rng = random.Random(semilla)\n    K = max(int(K), int(s))\n    libre = [0.0] * s                  # instante en que queda libre cada servidor\n    salidas = []                       # instantes de salida de los clientes aceptados\n    clientes = []\n    t = rng.expovariate(lam)\n    for i in range(1, int(n_clientes) + 1):\n        en_sistema = sum(1 for f in salidas if f > t)\n        if en_sistema >= K:\n            clientes.append({\"Cliente\": i, \"Llegada\": t, \"Inicio\": float(\"nan\"), \"Fin\": float(\"nan\"), \"Servidor\": 0,\n                             \"Espera\": float(\"nan\"), \"Servicio\": float(\"nan\"), \"Rechazado\": True})\n        else:\n            k = min(range(s), key=lambda j: libre[j])\n            inicio = max(t, libre[k])\n            fin = inicio + rng.expovariate(mu)\n            libre[k] = fin\n            salidas.append(fin)\n            clientes.append({\"Cliente\": i, \"Llegada\": t, \"Inicio\": inicio, \"Fin\": fin, \"Servidor\": k + 1,\n                             \"Espera\": inicio - t, \"Servicio\": fin - inicio, \"Rechazado\": False})\n        t += rng.expovariate(lam)\n    return pd.DataFrame(clientes, columns=[\"Cliente\", \"Llegada\", \"Inicio\", \"Fin\", \"Servidor\", \"Espera\", \"Servicio\",\n                                           \"Rechazado\"])\n\n\ndef _tq(n, alpha=0.05):\n    if n < 2:\n        return float(\"nan\")\n    if _stats is not None:\n        return float(_stats.t.ppf(1 - alpha / 2, n - 1))\n    return 1.96\n\n\ndef montecarlo(lam, mu, s, K, t_max=5000.0, replicas=8, semilla=1000, progreso=None):\n    \"\"\"`replicas` réplicas independientes (réplica i -> semilla + i) y combinación de resultados.\"\"\"\n    filas, pn_list = [], []\n    traza = None\n    for r in range(replicas):\n        res = simular_replica(lam, mu, s, K, t_max, semilla + r, n_traza=400 if r == 0 else 0)\n        filas.append({\"Réplica\": r + 1, \"Semilla\": semilla + r, \"L\": res[\"L\"], \"Lq\": res[\"Lq\"], \"W\": res[\"W\"],\n                      \"Wq\": res[\"Wq\"], \"P(bloqueo)\": res[\"Pbloqueo\"], \"P(espera)\": res[\"Pespera\"],\n                      \"λ̄\": res[\"lambda_bar\"], \"Servidores ocupados\": res[\"Ocupados\"], \"Llegadas\": res[\"Llegadas\"],\n                      \"Rechazos\": res[\"Rechazos\"], \"Tiempo simulado\": res[\"T\"]})\n        pn_list.append((res[\"pn\"], res[\"T\"]))\n        if r == 0:\n            traza = res[\"traza\"]\n        if progreso:\n            progreso(r + 1, replicas)\n    rep = pd.DataFrame(filas).set_index(\"Réplica\")\n    pn = sum(p * T for p, T in pn_list) / sum(T for _, T in pn_list)\n    return {\"replicas\": rep, \"pn\": pn, \"traza\": traza}\n\n\nKPIS_MC = [\"L\", \"Lq\", \"W\", \"Wq\", \"P(bloqueo)\", \"λ̄\", \"P(espera)\", \"Servidores ocupados\"]\n\n\ndef resumen_mc(rep, sis):\n    \"\"\"Media Monte Carlo, IC95% (variabilidad entre réplicas) y valor teórico de cada KPI.\"\"\"\n    n = len(rep)\n    tq = _tq(n)\n    teo_d = {\"L\": sis[\"L\"], \"Lq\": sis[\"Lq\"], \"W\": sis[\"W\"], \"Wq\": sis[\"Wq\"], \"P(bloqueo)\": sis[\"Pbloqueo\"],\n             \"λ̄\": sis[\"lambda_bar\"], \"P(espera)\": sis[\"Pespera\"], \"Servidores ocupados\": sis[\"Ocupados\"]}\n    filas = []\n    for k in KPIS_MC:\n        teo = teo_d[k]\n        v = rep[k].astype(float)\n        m = v.mean()\n        se = v.std(ddof=1) / math.sqrt(n) if n > 1 else 0.0\n        lo, hi = m - tq * se, m + tq * se\n        filas.append({\"KPI\": k, \"Teórico (fórmula)\": teo, \"Simulado · media\": m, \"Simulado · IC95 inf\": lo,\n                      \"Simulado · IC95 sup\": hi,\n                      \"Error relativo\": (m - teo) / teo if teo > 1e-12 else None,\n                      \"Teórico dentro del IC95\": bool(lo - 1e-12 <= teo <= hi + 1e-12)})\n    return pd.DataFrame(filas).set_index(\"KPI\")\n\n\ndef p_mayor(sis, k):\n    \"\"\"P(N > k) teórica exacta (distribución finita n = 0 … K).\"\"\"\n    pn = np.asarray(sis[\"pn\"])\n    if k < 0:\n        return 1.0\n    return float(pn[k + 1:].sum()) if k + 1 < len(pn) else 0.0\n\n\ndef region(n, s, K):\n    if n == K:\n        return \"lleno · bloqueo (n = K)\"\n    return \"servidores (n < s)\" if n < s else \"cola (s ≤ n < K)\"\n\n\ndef tabla_probabilidades(sis, pn_mc=None, umbral=None, n_min=None):\n    \"\"\"Probabilidad de n clientes en el sistema, n = 0 … K: p_n = P(N = n), acumulada P(N ≤ n) y cola P(N > n),\n    teóricas y (si se indican) simuladas.\"\"\"\n    s, K = sis[\"s\"], sis[\"K\"]\n    idx = pd.Index(range(K + 1), name=\"n\")\n    df = pd.DataFrame(index=idx)\n    df[\"Región\"] = [region(n, s, K) for n in idx]\n    df[\"Clientes en cola\"] = [max(0, n - s) for n in idx]\n    df[\"Servidores ocupados\"] = [min(n, s) for n in idx]\n    teo = np.asarray(sis[\"pn\"])\n    df[\"Teórica · P(N = n)\"] = teo\n    df[\"Teórica · P(N ≤ n)\"] = np.minimum(1.0, np.cumsum(teo))\n    df[\"Teórica · P(N > n)\"] = [p_mayor(sis, n) for n in idx]\n    if pn_mc is not None:\n        w = np.zeros(K + 1); m = min(K + 1, len(pn_mc)); w[:m] = pn_mc[:m]\n        df[\"Simulada · P(N = n)\"] = w\n        df[\"Simulada · P(N ≤ n)\"] = np.minimum(1.0, np.cumsum(w))\n        df[\"Simulada · P(N > n)\"] = np.maximum(0.0, 1 - df[\"Simulada · P(N ≤ n)\"])\n    return df\n\n\ndef prob_evento(sis, pn_mc, tipo, k):\n    \"\"\"P(N = k), P(N ≤ k), P(N ≥ k) o P(N > k), teórica y simulada (sumas finitas exactas).\"\"\"\n    def calc(p):\n        if p is None:\n            return None\n        p = np.asarray(p)\n        tot = lambda a, b: float(p[max(a, 0):max(b, 0)].sum())\n        if tipo == \"=\":\n            return float(p[k]) if 0 <= k < len(p) else 0.0\n        if tipo == \"≤\":\n            return min(1.0, tot(0, k + 1))\n        if tipo == \"≥\":\n            return max(0.0, min(1.0, tot(k, len(p))))\n        return max(0.0, min(1.0, tot(k + 1, len(p))))\n    return calc(sis[\"pn\"]), calc(pn_mc)\n\n\n# ==============================================================================================\n# Objetivos de servicio (equivalentes a los SLAs de las aplicaciones de los casos de estudio)\n# ==============================================================================================\nOBJETIVOS_DEF = {\"RHO_MAX\": 0.85, \"WQ_MAX\": 0.25, \"PBLOQ_MAX\": 0.05, \"LQ_MAX\": 1.0}\n\n\ndef evaluar_objetivos(sis, obj):\n    \"\"\"Cumplimiento de los objetivos de servicio (sobre los valores teóricos). Un objetivo vacío (None) no se evalúa.\"\"\"\n    filas = []\n    def fila(nombre, valor, umbral, cumple, fmt):\n        filas.append({\"Objetivo\": nombre, \"Valor\": valor, \"Umbral\": fmt(umbral), \"Cumple\": \"Sí\" if cumple else \"No\"})\n    if obj.get(\"RHO_MAX\") is not None:\n        fila(\"Ocupación efectiva por servidor ρ̄\", sis[\"rho_eff\"], obj[\"RHO_MAX\"], sis[\"rho_eff\"] <= obj[\"RHO_MAX\"],\n             lambda u: f\"≤ {pct(u, 0)}\")\n    if obj.get(\"WQ_MAX\") is not None:\n        fila(\"Tiempo medio en cola Wq\", sis[\"Wq\"], obj[\"WQ_MAX\"], sis[\"Wq\"] <= obj[\"WQ_MAX\"], lambda u: f\"≤ {num(u, 3)}\")\n    if obj.get(\"PBLOQ_MAX\") is not None:\n        fila(\"Probabilidad de bloqueo P(bloqueo)\", sis[\"Pbloqueo\"], obj[\"PBLOQ_MAX\"], sis[\"Pbloqueo\"] <= obj[\"PBLOQ_MAX\"],\n             lambda u: f\"≤ {pct(u, 1)}\")\n    if obj.get(\"LQ_MAX\") is not None:\n        fila(\"Clientes medios en cola Lq\", sis[\"Lq\"], obj[\"LQ_MAX\"], sis[\"Lq\"] <= obj[\"LQ_MAX\"], lambda u: f\"≤ {num(u, 2)}\")\n    return pd.DataFrame(filas, columns=[\"Objetivo\", \"Valor\", \"Umbral\", \"Cumple\"]).set_index(\"Objetivo\")\n\n\n# ==============================================================================================\n# Análisis completo de un escenario y comparación\n# ==============================================================================================\ndef analizar_escenario(esc, comunes, ajustes, progreso=None):\n    lam, mu, s = float(esc[\"lambda\"]), float(esc[\"mu\"]), int(esc[\"s\"])\n    K = max(int(esc[\"K\"]), s)\n    cq = float(comunes[\"cq\"])\n    cs = float(esc[\"cs\"]) if esc.get(\"cs\") not in (None, \"\") else float(comunes[\"cs\"])\n    sis = teoria(lam, mu, s, K)\n    cst = costes(sis, cq, cs)\n    mc = montecarlo(lam, mu, s, K, float(ajustes[\"duracion\"]), int(ajustes[\"replicas\"]), int(ajustes[\"semilla\"]),\n                    progreso)\n    sw, s_opt = barrido(lam, mu, cq, cs, max(int(comunes[\"s_max\"]), s), K)\n    clientes = simular_clientes(lam, mu, s, K, N_DIAGRAMA, int(ajustes[\"semilla\"]))\n    return {\"esc\": dict(esc, cs=cs, cq=cq, K=K), \"teoria\": sis, \"costes\": cst, \"mc\": mc,\n            \"resumen_mc\": resumen_mc(mc[\"replicas\"], sis), \"barrido\": sw, \"s_opt\": s_opt,\n            \"objetivos\": evaluar_objetivos(sis, comunes[\"objetivos\"]), \"clientes\": clientes}\n\n\ndef tabla_comparativa(res):\n    \"\"\"KPIs de todos los escenarios (en columnas): parámetros, resultados TEÓRICOS (fórmulas), resultados SIMULADOS\n    (media de las réplicas Monte Carlo) y costes (teóricos).\"\"\"\n    cols = {}\n    for nombre, r in res.items():\n        t, c, m = r[\"teoria\"], r[\"costes\"], r[\"mc\"][\"replicas\"]\n        cols[nombre] = {\n            \"Parámetro · λ\": t[\"lambda\"], \"Parámetro · μ\": t[\"mu\"], \"Parámetro · s\": t[\"s\"], \"Parámetro · K\": t[\"K\"],\n            \"Parámetro · c_s (€/servidor)\": r[\"esc\"][\"cs\"],\n            \"Teórico · a (Erlangs)\": t[\"a\"], \"Teórico · ρ (nominal)\": t[\"rho\"], \"Teórico · ρ̄ (efectiva)\": t[\"rho_eff\"],\n            \"Teórico · estado\": t[\"estado\"].split(\" (\")[0],\n            \"Teórico · P0\": t[\"P0\"], \"Teórico · P(bloqueo)\": t[\"Pbloqueo\"], \"Teórico · λ̄\": t[\"lambda_bar\"],\n            \"Teórico · P(espera)\": t[\"Pespera\"], \"Teórico · L\": t[\"L\"], \"Teórico · Lq\": t[\"Lq\"],\n            \"Teórico · W\": t[\"W\"], \"Teórico · Wq\": t[\"Wq\"], \"Teórico · servidores ocupados\": t[\"Ocupados\"],\n            \"Simulado · P(bloqueo)\": m[\"P(bloqueo)\"].mean(), \"Simulado · λ̄\": m[\"λ̄\"].mean(),\n            \"Simulado · P(espera)\": m[\"P(espera)\"].mean(), \"Simulado · L\": m[\"L\"].mean(), \"Simulado · Lq\": m[\"Lq\"].mean(),\n            \"Simulado · W\": m[\"W\"].mean(), \"Simulado · Wq\": m[\"Wq\"].mean(),\n            \"Simulado · servidores ocupados\": m[\"Servidores ocupados\"].mean(),\n            \"Coste teórico · CTS\": c[\"CTS\"], \"Coste teórico · CTSn\": c[\"CTSn\"], \"Coste teórico · CTQ\": c[\"CTQ\"],\n            \"Coste teórico · CT\": c[\"CT\"],\n            \"Dimensionamiento · s óptimo (mín. CT)\": r[\"s_opt\"] if r[\"s_opt\"] is not None else \"—\",\n            \"Objetivos cumplidos (teóricos)\": f\"{(r['objetivos']['Cumple'] == 'Sí').sum()} de {len(r['objetivos'])}\",\n        }\n    return pd.DataFrame(cols)\n\n\ndef tabla_objetivos(res):\n    return pd.DataFrame({n: r[\"objetivos\"][\"Cumple\"] for n, r in res.items()})\n\n\n# ==============================================================================================\n# Formato y textos automáticos\n# ==============================================================================================\ndef num(x, d=2):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    if isinstance(x, float) and math.isinf(x):\n        return \"∞\"\n    s = f\"{x:,.{d}f}\"\n    return s.replace(\",\", \"X\").replace(\".\", \",\").replace(\"X\", \".\")\n\n\ndef pct(x, d=1):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    if isinstance(x, float) and math.isinf(x):\n        return \"∞\"\n    return num(100 * x, d) + \" %\"\n\n\ndef eur(x, d=2):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    if isinstance(x, float) and math.isinf(x):\n        return \"∞\"\n    return num(x, d) + \" €\"\n\n\ndef fmt_kpi(k, c, v):\n    \"\"\"Formato (fila, columna, valor) según la fila de la tabla comparativa.\"\"\"\n    if isinstance(v, str) or v is None:\n        return \"—\" if v is None else v\n    base = k.split(\" · \")[-1]\n    if base.startswith((\"ρ\", \"P0\", \"P(espera)\", \"P(bloqueo)\")) or k.startswith(\"Error\"):\n        return pct(v, 1)\n    if base in (\"CTS\", \"CTSn\", \"CTQ\", \"CT\") or \"€\" in k:\n        return eur(v)\n    if base in (\"s\", \"K\") or base.startswith(\"s óptimo\"):\n        return num(v, 0)\n    return num(v, 3)\n\n\ndef texto_escenario(nombre, r, unidad):\n    t, c = r[\"teoria\"], r[\"costes\"]\n    u = unidad\n    ok = r[\"resumen_mc\"][\"Teórico dentro del IC95\"].loc[[\"L\", \"Lq\", \"W\", \"Wq\", \"P(bloqueo)\"]]\n    val = (\"la simulación reproduce los valores teóricos (todos dentro del IC95 %)\" if ok.all() else\n           f\"la simulación reproduce los valores teóricos salvo en {', '.join(ok[~ok].index)} (fuera del IC95 %, \"\n           \"lo que puede deberse al azar o a una duración de réplica insuficiente)\")\n    sat = (\"\" if t[\"rho\"] < 1 else\n           f\" La carga nominal ρ = {pct(t['rho'])} ≥ 100 % sería inestable con capacidad infinita; aquí la capacidad \"\n           f\"K = {t['K']} la contiene a costa de rechazar clientes.\")\n    txt = (f\"{nombre}: M/M/{t['s']}/{t['K']} con ρ = {pct(t['rho'])} nominal y ρ̄ = {pct(t['rho_eff'])} efectiva por \"\n           f\"servidor; se rechaza el {pct(t['Pbloqueo'], 2)} de las llegadas (λ̄ = {num(t['lambda_bar'], 3)} clientes/\"\n           f\"{unidad_sing(u)} aceptados). L = {num(t['L'], 3)} y Lq = {num(t['Lq'], 3)} clientes, W = {num(t['W'], 4)} y \"\n           f\"Wq = {num(t['Wq'], 4)} {unidad_larga(u)} (valores teóricos); {val}.{sat} \"\n           f\"Coste total CT = {eur(c['CT'])}/{unidad_sing(u)} (CTS {eur(c['CTS'])}, CTSn {eur(c['CTSn'])}, \"\n           f\"CTQ {eur(c['CTQ'])}).\")\n    if r[\"s_opt\"] is not None:\n        txt += (\" Su número de servidores ya es el de menor coste total para esa capacidad.\" if r[\"s_opt\"] == t[\"s\"] else\n                f\" Con la misma capacidad, el número de servidores de menor coste total sería s = {r['s_opt']} \"\n                f\"(CT = {eur(r['barrido'].loc[r['s_opt'], 'CT'])}/{unidad_sing(u)}).\")\n    n_ok = (r[\"objetivos\"][\"Cumple\"] == \"Sí\").sum()\n    txt += f\" Cumple {n_ok} de los {len(r['objetivos'])} objetivos de servicio.\"\n    return txt\n\n\ndef texto_recomendacion(res, unidad):\n    filas = [(n, (r[\"objetivos\"][\"Cumple\"] == \"Sí\").sum(), r[\"costes\"][\"CT\"], r[\"teoria\"][\"Pbloqueo\"])\n             for n, r in res.items()]\n    max_ok = max(f[1] for f in filas)\n    mejor = sorted([f for f in filas if f[1] == max_ok], key=lambda f: f[2])[0]\n    barato = min(filas, key=lambda f: f[2])\n    txt = (f\"Se recomienda «{mejor[0]}»: es el escenario que cumple más objetivos de servicio ({mejor[1]} de \"\n           f\"{len(res[mejor[0]]['objetivos'])}) y, entre ellos, el de menor coste total ({eur(mejor[2])}/\"\n           f\"{unidad_sing(unidad)}), con un bloqueo del {pct(mejor[3], 2)}.\")\n    if barato[0] != mejor[0]:\n        txt += (f\" El escenario más barato es «{barato[0]}» ({eur(barato[2])}/{unidad_sing(unidad)}), pero cumple menos \"\n                f\"objetivos ({barato[1]}) y rechaza el {pct(barato[3], 2)} de las llegadas. Recuerde que el coste total \"\n                \"no incluye el coste de los clientes perdidos.\")\n    return txt\n",
 "graficos.py": "# -*- coding: utf-8 -*-\n\"\"\"Gráficos (matplotlib) de la aplicación M/M/s/K. Cada función devuelve una Figure.\"\"\"\nimport io\nimport math\n\nimport matplotlib\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\nimport numpy as np\n\n# Paleta categórica validada (orden fijo; el color sigue a la entidad, nunca a su posición)\nSERIES = [\"#2a78d6\", \"#eb6834\", \"#1baf7a\", \"#eda100\", \"#e87ba4\", \"#008300\", \"#6250d6\", \"#e34948\"]\nSERVIDORES, COLA, LLENO = SERIES[0], SERIES[1], SERIES[7]   # n < s, s ≤ n < K y n = K (bloqueo)\n# colores de servidor individuales en el diagrama de funcionamiento (sin el naranja ni el rojo, reservados)\nCOLORES_SERVIDOR = [c for c in SERIES if c not in (COLA, LLENO)]\nBUENO, CRITICO = \"#0b7a0b\", \"#b23232\"\nTEXTO, TEXTO2, REJILLA = \"#0b0b0b\", \"#52514e\", \"#e1e0d9\"\n\nplt.rcParams.update({\n    \"figure.dpi\": 110, \"savefig.dpi\": 150, \"font.size\": 9.5, \"axes.titlesize\": 10.5, \"axes.titleweight\": \"bold\",\n    \"axes.edgecolor\": \"#b9b8b2\", \"axes.labelcolor\": TEXTO2, \"xtick.color\": TEXTO2, \"ytick.color\": TEXTO2,\n    \"axes.grid\": True, \"grid.color\": REJILLA, \"grid.linewidth\": 0.8, \"axes.axisbelow\": True,\n    \"axes.spines.top\": False, \"axes.spines.right\": False, \"legend.frameon\": False,\n})\n\n\ndef color_escenario(i):\n    return SERIES[i % len(SERIES)]\n\n\ndef fig_a_png(fig):\n    buf = io.BytesIO()\n    fig.savefig(buf, format=\"png\", bbox_inches=\"tight\", facecolor=\"white\")\n    plt.close(fig)\n    buf.seek(0)\n    return buf\n\n\ndef _vacia(texto, figsize=(9, 3.2)):\n    fig, ax = plt.subplots(figsize=figsize)\n    ax.axis(\"off\")\n    ax.text(0.5, 0.5, texto, ha=\"center\", va=\"center\", color=TEXTO2, fontsize=11, transform=ax.transAxes)\n    return fig\n\n\ndef _color_n(k, s, K):\n    return LLENO if k == K else (SERVIDORES if k < s else COLA)\n\n\ndef _leyenda_regiones(ax, extra=()):\n    from matplotlib.patches import Patch\n    ax.legend(handles=[Patch(color=SERVIDORES, label=\"n < s (servidores)\"), Patch(color=COLA, label=\"s ≤ n < K (cola)\"),\n                       Patch(color=LLENO, label=\"n = K (lleno · bloqueo)\"), *extra], loc=\"upper center\",\n              bbox_to_anchor=(0.5, -0.2), ncol=4, fontsize=8)\n\n\ndef fig_pn(sis, titulo=None):\n    \"\"\"Distribución límite p_n, n = 0 … K: azul los servidores, naranja la cola y rojo el estado lleno (bloqueo).\"\"\"\n    pn, s, K = sis[\"pn\"], sis[\"s\"], sis[\"K\"]\n    n = np.arange(len(pn))\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    ax.bar(n, pn, width=0.8, color=[_color_n(k, s, K) for k in n], edgecolor=\"white\", linewidth=1)\n    ax.axvline(s - 0.5, ls=\":\", c=TEXTO2, lw=1)\n    ax.set_xlabel(\"n (clientes en el sistema)\"); ax.set_ylabel(\"p_n\")\n    if K <= 40:\n        ax.set_xticks(n)\n    ax.set_title(titulo or f\"Distribución límite p_n · M/M/{s}/{K}\")\n    _leyenda_regiones(ax)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_pn_comparada(pn_mc, sis, titulo=None):\n    \"\"\"p_n simulada (barras, ponderada por tiempo) frente a la teórica (línea con puntos).\"\"\"\n    s, K = sis[\"s\"], sis[\"K\"]\n    n = np.arange(K + 1)\n    a = np.zeros(K + 1); m = min(K + 1, len(pn_mc)); a[:m] = pn_mc[:m]\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    ax.bar(n, a, width=0.8, color=[_color_n(x, s, K) for x in n], alpha=0.55, edgecolor=\"white\", linewidth=1)\n    ax.plot(n, sis[\"pn\"], color=TEXTO, lw=2, marker=\"o\", ms=4)\n    ax.axvline(s - 0.5, ls=\":\", c=TEXTO2, lw=1)\n    ax.set_xlabel(\"n (clientes en el sistema)\"); ax.set_ylabel(\"p_n\")\n    if K <= 40:\n        ax.set_xticks(n)\n    ax.set_title(titulo or \"Distribución p_n: simulación (barras) frente a teoría (línea)\")\n    from matplotlib.lines import Line2D\n    _leyenda_regiones(ax, [Line2D([], [], color=TEXTO, lw=2, marker=\"o\", ms=4, label=\"teórica\")])\n    fig.tight_layout()\n    return fig\n\n\ndef fig_traza(traza, s, unidad, titulo=None, K=None):\n    \"\"\"Trayectoria N(t) de una réplica de ejemplo (función escalonada), con las líneas n = s y n = K.\"\"\"\n    if not traza:\n        return _vacia(\"Sin trayectoria\")\n    t = [p[0] for p in traza]; n = [p[1] for p in traza]\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    ax.step(t, n, where=\"post\", color=SERVIDORES, lw=1.6)\n    ax.axhline(s, ls=\":\", c=COLA, lw=1.5, label=f\"n = s = {s}\")\n    if K is not None:\n        ax.axhline(K, ls=\"--\", c=LLENO, lw=1.5, label=f\"n = K = {K} (lleno)\")\n        ax.set_ylim(-0.3, K + 0.8)\n    ax.set_xlabel(f\"tiempo ({unidad})\"); ax.set_ylabel(\"N(t)\")\n    ax.set_title(titulo or \"Trayectoria N(t) · clientes en el sistema (réplica de ejemplo)\")\n    ax.legend(loc=\"lower right\", fontsize=8)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_diagrama(clientes, s, horizonte, unidad, titulo=None, max_clientes=60):\n    \"\"\"Diagrama de funcionamiento: para cada llegada, su espera en cola (naranja) y su servicio en el servidor que le\n    atiende; las llegadas rechazadas (sistema lleno) se marcan con ✕ rojo. Debajo, el número de clientes en cola.\"\"\"\n    if clientes is None or len(clientes) == 0:\n        return _vacia(\"No llega ningún cliente en el horizonte simulado.\")\n    c = clientes.head(max_clientes)\n    fig, (ax, ax2) = plt.subplots(2, 1, figsize=(9, 5.2), sharex=True, gridspec_kw={\"height_ratios\": [3, 1.2]})\n    rech = c[c[\"Rechazado\"]] if \"Rechazado\" in c else c.iloc[0:0]\n    for _, r in c.iterrows():\n        y = r[\"Cliente\"]\n        if \"Rechazado\" in c and r[\"Rechazado\"]:\n            continue\n        if r[\"Espera\"] > 1e-12:\n            ax.barh(y, r[\"Espera\"], left=r[\"Llegada\"], height=0.7, color=COLA)\n        ax.barh(y, r[\"Servicio\"], left=r[\"Inicio\"], height=0.7,\n                color=COLORES_SERVIDOR[int(r[\"Servidor\"]) - 1] if s <= len(COLORES_SERVIDOR) else SERVIDORES)\n    if len(rech):\n        ax.plot(rech[\"Llegada\"], rech[\"Cliente\"], ls=\"none\", marker=\"x\", ms=7, mew=2, color=LLENO)\n    ax.invert_yaxis()\n    ax.set_ylabel(\"cliente (llegada)\")\n    ax.set_title(titulo or f\"Diagrama de funcionamiento · primeras {len(c)} llegadas (color de servicio = servidor)\")\n    from matplotlib.patches import Patch\n    hand = [Patch(color=COLA, label=\"espera en cola\")]\n    if s <= len(COLORES_SERVIDOR):\n        hand += [Patch(color=COLORES_SERVIDOR[k], label=f\"servicio · servidor {k + 1}\") for k in range(s)]\n    else:\n        hand += [Patch(color=SERVIDORES, label=\"servicio\")]\n    if len(rech):\n        from matplotlib.lines import Line2D\n        hand.append(Line2D([], [], ls=\"none\", marker=\"x\", ms=7, mew=2, color=LLENO, label=\"rechazado (sistema lleno)\"))\n    ax.legend(handles=hand, loc=\"lower left\", ncol=min(4, len(hand)), fontsize=8)\n    # número en cola a lo largo del tiempo\n    esperan = clientes[clientes[\"Espera\"] > 1e-12]       # solo los clientes que realmente pasan por la cola\n    ev = sorted([(t, +1) for t in esperan[\"Llegada\"]] + [(t, -1) for t in esperan[\"Inicio\"]], key=lambda x: (x[0], -x[1]))\n    tt, q, cur = [0.0], [0], 0\n    for t, d in ev:\n        cur += d; tt.append(t); q.append(cur)\n    ax2.step(tt, q, where=\"post\", color=COLA, lw=1.6)\n    ax2.set_ylabel(\"en cola\"); ax2.set_xlabel(f\"tiempo ({unidad})\")\n    t_fin = float(np.nanmax([c[\"Fin\"].max(), c[\"Llegada\"].max()])) if horizonte is None else min(horizonte, float(c[\"Fin\"].max()))\n    ax2.set_xlim(0, max(t_fin, 1e-9))\n    fig.tight_layout()\n    return fig\n\n\ndef fig_costes(cst, unidad_s, titulo=None):\n    \"\"\"Desglose del coste total por unidad de tiempo.\"\"\"\n    nombres = [\"CTS\\nservidores ocupados\", \"CTSn\\nservidores libres\", \"CTQ\\nespera en cola\"]\n    v = [cst[\"CTS\"], cst[\"CTSn\"], cst[\"CTQ\"]]\n    fig, ax = plt.subplots(figsize=(9, 3.0))\n    ax.barh(nombres, v, color=[SERIES[0], SERIES[2], SERIES[1]], height=0.6)\n    for i, x in enumerate(v):\n        ax.text(x, i, f\"  {x:,.2f} €\".replace(\",\", \"X\").replace(\".\", \",\").replace(\"X\", \".\"), va=\"center\", color=TEXTO)\n    ax.invert_yaxis()\n    ax.set_xlabel(f\"€ / {unidad_s}\")\n    ax.set_title(titulo or f\"Desglose de costes · CT = {cst['CT']:,.2f} €/{unidad_s}\".replace(\",\", \"X\").replace(\".\", \",\").replace(\"X\", \".\"))\n    ax.set_xlim(0, max(v) * 1.25 if max(v) > 0 else 1)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_barrido(df, s_actual, s_opt, unidad_s, titulo=None):\n    \"\"\"Coste total frente al número de servidores (s = 1 … min(s máx, K)) y probabilidad de bloqueo.\"\"\"\n    if df.empty:\n        return _vacia(\"No hay valores de s que explorar.\")\n    fig, (ax, ax2) = plt.subplots(1, 2, figsize=(10, 3.4), gridspec_kw={\"width_ratios\": [3, 2]})\n    ax.plot(df.index, df[\"CT\"], color=SERIES[0], lw=2, marker=\"o\", ms=6, label=\"CT (coste total)\")\n    ax.plot(df.index, df[\"CTQ\"], color=SERIES[1], lw=1.4, ls=\"--\", label=\"CTQ (espera)\")\n    ax.plot(df.index, df[\"CTS\"] + df[\"CTSn\"], color=SERIES[2], lw=1.4, ls=\"--\", label=\"CTS + CTSn (servidores)\")\n    if s_opt is not None:\n        ax.plot([s_opt], [df.loc[s_opt, \"CT\"]], marker=\"o\", ms=12, color=BUENO, ls=\"none\", label=f\"mínimo: s = {s_opt}\")\n    if s_actual in df.index:\n        ax.plot([s_actual], [df.loc[s_actual, \"CT\"]], marker=\"o\", ms=15, mfc=\"none\", mec=TEXTO, mew=1.5, ls=\"none\",\n                label=f\"actual: s = {s_actual}\")\n    ax.set_xticks(df.index)\n    ax.set_xlabel(\"s (número de servidores)\"); ax.set_ylabel(f\"€ / {unidad_s}\")\n    ax.set_title(titulo or \"Coste total frente al número de servidores (K fijo)\")\n    ax.legend(loc=\"best\", fontsize=7.5)\n    ax2.bar(df.index, 100 * df[\"P(bloqueo)\"], color=[LLENO if k == s_actual else \"#f0a3a3\" for k in df.index], width=0.6)\n    ax2.set_xticks(df.index)\n    ax2.set_xlabel(\"s (número de servidores)\"); ax2.set_ylabel(\"%\")\n    ax2.set_title(\"P(bloqueo) según s\")\n    fig.tight_layout()\n    return fig\n\n\ndef fig_comparativa(res, unidad):\n    \"\"\"Comparación de escenarios: ρ̄, P(bloqueo), Wq y coste total (un panel por medida, sin doble eje).\"\"\"\n    nombres = list(res)\n    cols = [color_escenario(i) for i in range(len(nombres))]\n    fig, axs = plt.subplots(1, 4, figsize=(12, 3.8))\n    medidas = [(\"ρ̄ (ocupación efectiva, %)\", [res[n][\"teoria\"][\"rho_eff\"] * 100 for n in nombres], \"%\"),\n               (\"P(bloqueo) (%)\", [res[n][\"teoria\"][\"Pbloqueo\"] * 100 for n in nombres], \"%2\"),\n               (f\"Wq (tiempo en cola, {unidad})\", [res[n][\"teoria\"][\"Wq\"] for n in nombres], \"\"),\n               (\"CT (coste total, €)\", [res[n][\"costes\"][\"CT\"] for n in nombres], \"€\")]\n    for ax, (tit, v, u) in zip(axs, medidas):\n        barras = ax.bar(range(len(nombres)), v, color=cols, width=0.65)\n        for b, x in zip(barras, v):\n            lab = f\"{x:.1f}\" if u == \"%\" else (f\"{x:.2f}\" if u == \"%2\" else (f\"{x:,.2f}\" if u == \"€\" else f\"{x:,.3f}\"))\n            ax.text(b.get_x() + b.get_width() / 2, b.get_height(), lab.replace(\",\", \"X\").replace(\".\", \",\").replace(\"X\", \".\"),\n                    ha=\"center\", va=\"bottom\", fontsize=8, color=TEXTO)\n        ax.set_title(tit, fontsize=9.5)\n        ax.set_xticks(range(len(nombres)))\n        ax.set_xticklabels(nombres, rotation=30 if len(nombres) > 2 else 0, ha=\"right\" if len(nombres) > 2 else \"center\",\n                           fontsize=8)\n        ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_validacion(res):\n    \"\"\"Error relativo de la simulación frente a la teoría (L, Lq, W, Wq, P(bloqueo)) en cada escenario.\"\"\"\n    nombres = list(res)\n    if not nombres:\n        return _vacia(\"No hay escenarios que validar.\")\n    kpis = [\"L\", \"Lq\", \"W\", \"Wq\", \"P(bloqueo)\"]\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    ancho = 0.8 / len(nombres)\n    for i, n in enumerate(nombres):\n        rm = res[n][\"resumen_mc\"]\n        v = [100 * (rm.loc[k, \"Error relativo\"] or 0) for k in kpis]\n        ax.bar(np.arange(len(kpis)) + i * ancho - 0.4 + ancho / 2, v, width=ancho * 0.9, color=color_escenario(list(res).index(n)),\n               label=n)\n    ax.axhline(0, c=TEXTO2, lw=1)\n    ax.set_xticks(range(len(kpis))); ax.set_xticklabels(kpis)\n    ax.set_ylabel(\"error relativo (%)\")\n    ax.set_title(\"Validación: error relativo de la simulación frente a la teoría\")\n    ax.legend(fontsize=8, ncol=min(4, len(nombres)))\n    fig.tight_layout()\n    return fig\n",
 "informe.py": "# -*- coding: utf-8 -*-\n\"\"\"Informe Word (.docx) del sistema M/M/s/K: teoría, validación por simulación, costes y comparación de escenarios.\"\"\"\nimport datetime\nimport io\nimport math\n\nimport numpy as np\nimport pandas as pd\nimport docx\nfrom docx.shared import Pt, Cm, RGBColor\nfrom docx.enum.text import WD_ALIGN_PARAGRAPH\nfrom docx.enum.table import WD_TABLE_ALIGNMENT\nfrom docx.oxml.ns import qn\nfrom docx.oxml import OxmlElement\n\nimport mmsk\nfrom mmsk import num, pct, eur, fmt_kpi, unidad_larga, unidad_sing\nimport graficos as gr\n\n\ndef _sombrear(celda, color):\n    tcPr = celda._tc.get_or_add_tcPr()\n    shd = OxmlElement(\"w:shd\")\n    shd.set(qn(\"w:val\"), \"clear\"); shd.set(qn(\"w:color\"), \"auto\"); shd.set(qn(\"w:fill\"), color)\n    tcPr.append(shd)\n\n\nclass Informe:\n    \"\"\"Envoltorio sencillo de python-docx con helpers para títulos, párrafos, tablas y figuras.\"\"\"\n\n    def __init__(self, titulo, subtitulo=\"\"):\n        self.doc = docx.Document()\n        sec = self.doc.sections[0]\n        sec.page_width, sec.page_height = Cm(21), Cm(29.7)\n        sec.left_margin = sec.right_margin = Cm(2)\n        sec.top_margin = sec.bottom_margin = Cm(2)\n        estilo = self.doc.styles[\"Normal\"]\n        estilo.font.name = \"Calibri\"; estilo.font.size = Pt(10.5)\n        self.n_tabla, self.n_fig = 0, 0\n        self.doc.add_heading(titulo, level=0)\n        if subtitulo:\n            p = self.doc.add_paragraph(subtitulo); p.runs[0].italic = True\n\n    def h(self, texto, nivel=1):\n        self.doc.add_heading(texto, level=nivel)\n\n    def p(self, texto, negrita_inicio=None):\n        par = self.doc.add_paragraph()\n        if negrita_inicio == \"auto\":\n            i = texto.find(\": \")\n            negrita_inicio = texto[:i + 1] if 0 < i < 70 else None\n        if negrita_inicio and texto.startswith(negrita_inicio):\n            par.add_run(negrita_inicio).bold = True\n            par.add_run(texto[len(negrita_inicio):])\n        else:\n            par.add_run(texto)\n        par.paragraph_format.space_after = Pt(6)\n        return par\n\n    def vinetas(self, items):\n        for it in items:\n            self.doc.add_paragraph(it, style=\"List Bullet\")\n\n    def tabla(self, df, titulo, formato=None, indice=True, ancho_fuente=8.5, nombre_indice=\"\"):\n        self.n_tabla += 1\n        cap = self.doc.add_paragraph()\n        cap.add_run(f\"Tabla {self.n_tabla}. {titulo}\").bold = True\n        cols = list(df.columns)\n        t = self.doc.add_table(rows=1, cols=len(cols) + (1 if indice else 0))\n        t.style = \"Table Grid\"; t.alignment = WD_TABLE_ALIGNMENT.CENTER\n        cab = ([nombre_indice or (df.index.name or \"\")] if indice else []) + [str(c) for c in cols]\n        for j, c in enumerate(cab):\n            cel = t.rows[0].cells[j]; cel.text = \"\"\n            r = cel.paragraphs[0].add_run(str(c)); r.bold = True; r.font.size = Pt(ancho_fuente)\n            r.font.color.rgb = RGBColor(0xFF, 0xFF, 0xFF)\n            _sombrear(cel, \"2F5496\")\n        for i, (idx, fila) in enumerate(df.iterrows()):\n            celdas = t.add_row().cells\n            vals = ([str(idx)] if indice else []) + [formato(idx, c, fila[c]) if formato else _fmt(fila[c]) for c in cols]\n            for j, v in enumerate(vals):\n                celdas[j].text = \"\"\n                r = celdas[j].paragraphs[0].add_run(v); r.font.size = Pt(ancho_fuente)\n                if j > 0 or not indice:\n                    celdas[j].paragraphs[0].alignment = WD_ALIGN_PARAGRAPH.RIGHT\n                if i % 2 == 1:\n                    _sombrear(celdas[j], \"EAF0F8\")\n        self.doc.add_paragraph()\n\n    def figura(self, fig, titulo, ancho_cm=16.5):\n        self.n_fig += 1\n        self.doc.add_picture(gr.fig_a_png(fig), width=Cm(ancho_cm))\n        self.doc.paragraphs[-1].alignment = WD_ALIGN_PARAGRAPH.CENTER\n        cap = self.doc.add_paragraph(); cap.alignment = WD_ALIGN_PARAGRAPH.CENTER\n        r = cap.add_run(f\"Figura {self.n_fig}. {titulo}\"); r.italic = True; r.font.size = Pt(9)\n\n    def salto(self):\n        self.doc.add_page_break()\n\n    def guardar(self):\n        buf = io.BytesIO()\n        self.doc.save(buf)\n        return buf.getvalue()\n\n\ndef _fmt(v):\n    if isinstance(v, (bool, np.bool_)):\n        return \"Sí\" if v else \"No\"\n    if v is None:\n        return \"—\"\n    if isinstance(v, (int, np.integer)):\n        return num(v, 0)\n    if isinstance(v, (float, np.floating)):\n        if math.isnan(v):\n            return \"—\"\n        if math.isinf(v):\n            return \"∞\"\n        return num(v, 3)\n    return str(v)\n\n\ndef fmt_mc(fila, col, v):\n    if col == \"Teórico dentro del IC95\":\n        return \"—\" if v is None else (\"Sí\" if v else \"No\")\n    if col == \"Error relativo\":\n        return \"—\" if v is None or (isinstance(v, float) and math.isnan(v)) else pct(v, 2)\n    if fila in (\"P(espera)\", \"P(bloqueo)\"):\n        return pct(v, 2)\n    return num(v, 4)\n\n\ndef fmt_obj(fila, col, v):\n    if col == \"Valor\":\n        if \"ρ\" in fila or \"Probabilidad\" in fila:\n            return pct(v, 2)\n        return num(v, 4)\n    return str(v)\n\n\ndef fmt_barrido(fila, col, v):\n    if col in (\"ρ\", \"ρ̄\"):\n        return pct(v, 1)\n    if col == \"P(bloqueo)\":\n        return pct(v, 2)\n    if col in (\"CTS\", \"CTSn\", \"CTQ\", \"CT\"):\n        return eur(v)\n    return num(v, 3)\n\n\ndef tabla_teoria(t, cst, unidad):\n    u = unidad\n    us = unidad_sing(u)\n    filas = [(\"a = λ/μ (carga ofrecida, Erlangs)\", num(t[\"a\"], 4)), (\"ρ = λ/(sμ) (carga nominal por servidor)\", pct(t[\"rho\"], 2)),\n             (\"Régimen\", t[\"estado\"]), (\"K (capacidad) · cola máxima K − s\", f\"{t['K']} · {t['K'] - t['s']}\"),\n             (\"P0 (sistema vacío)\", pct(t[\"P0\"], 2)), (\"P(bloqueo) = p_K (llegadas rechazadas)\", pct(t[\"Pbloqueo\"], 2)),\n             (f\"λ̄ = λ(1 − p_K) (clientes aceptados/{us})\", num(t[\"lambda_bar\"], 4)),\n             (\"ρ̄ = λ̄/(sμ) (ocupación efectiva por servidor)\", pct(t[\"rho_eff\"], 2)),\n             (\"P(espera) de un cliente aceptado\", pct(t[\"Pespera\"], 2)), (\"L (clientes en el sistema)\", num(t[\"L\"], 4)),\n             (\"Lq (clientes en cola)\", num(t[\"Lq\"], 4)), (f\"W (tiempo en el sistema, {unidad_larga(u)})\", num(t[\"W\"], 4)),\n             (f\"Wq (tiempo en cola, {unidad_larga(u)})\", num(t[\"Wq\"], 4)), (\"Servidores ocupados (L − Lq)\", num(t[\"Ocupados\"], 4)),\n             (f\"c_t = c_q + c_s (€/{us})\", eur(cst[\"c_t\"])), (f\"CTS (€/{us})\", eur(cst[\"CTS\"])),\n             (f\"CTSn (€/{us})\", eur(cst[\"CTSn\"])), (f\"CTQ (€/{us})\", eur(cst[\"CTQ\"])),\n             (f\"CT (€/{us})\", eur(cst[\"CT\"]))]\n    return pd.DataFrame(filas, columns=[\"Medida\", \"Valor\"]).set_index(\"Medida\")\n\n\ndef tabla_probs_informe(t, pn_mc, max_filas=41):\n    \"\"\"Tabla de probabilidad de n clientes, teórica y simulada, formateada para el informe.\"\"\"\n    df = mmsk.tabla_probabilidades(t, pn_mc).head(max_filas)\n    df = df.drop(columns=[\"Clientes en cola\", \"Servidores ocupados\"])\n    df[\"Región\"] = df[\"Región\"].str.split(\" \").str[0].str.replace(\"lleno\", \"lleno (K)\")\n    for c in df.columns:\n        if c.startswith((\"Teórica\", \"Simulada\")):\n            df[c] = df[c].map(lambda v: pct(v, 2))\n    return df\n\n\ndef generar_informe(res, comunes, ajustes, titulo=\"Sistema de colas M/M/s/K\", ref=None):\n    u = comunes[\"unidad\"]\n    us, ul = unidad_sing(u), unidad_larga(u)\n    inf = Informe(titulo, f\"Informe generado automáticamente el {datetime.datetime.now():%d/%m/%Y %H:%M} · \"\n                          f\"teoría M/M/s/K, simulación de eventos discretos y análisis de costes\")\n    # 1. Planteamiento\n    inf.h(\"1. Planteamiento y parámetros\", 1)\n    inf.p(\"Sistema de colas M/M/s/K: llegadas de Poisson a tasa λ, tiempos de servicio exponenciales de tasa μ por \"\n          \"servidor, s servidores en paralelo con una única cola FIFO y capacidad máxima de K clientes en el sistema (en \"\n          \"servicio y en cola). Una llegada que encuentra el sistema lleno (N = K) se pierde. El proceso N(t) es de \"\n          \"nacimiento-muerte con λ_n = λ para n < K, λ_K = 0 y μ_n = min(n, s)·μ; al ser finito, SIEMPRE tiene régimen \"\n          \"estacionario, incluso con ρ = λ/(sμ) ≥ 100 % (régimen saturado). La tasa efectiva de entrada es \"\n          f\"λ̄ = λ(1 − p_K). Todas las tasas y tiempos se expresan en {unidad_larga(u)}.\")\n    esc = pd.DataFrame({n: {\"λ (llegadas)\": r[\"esc\"][\"lambda\"], \"μ (servicio por servidor)\": r[\"esc\"][\"mu\"],\n                            \"s (servidores)\": r[\"esc\"][\"s\"], \"K (capacidad)\": r[\"esc\"][\"K\"], f\"c_s (€/{us}·servidor)\": r[\"esc\"][\"cs\"],\n                            \"Descripción\": r[\"esc\"].get(\"descripcion\", \"\") or \"—\"} for n, r in res.items()})\n    inf.tabla(esc, \"Escenarios analizados\", nombre_indice=\"Parámetro\",\n              formato=lambda f, c, v: v if isinstance(v, str) else num(v, 3 if \"λ\" in f or \"μ\" in f else (0 if f.startswith((\"s \", \"K \")) else 2)))\n    ob = comunes[\"objetivos\"]\n    com = pd.DataFrame({\"Valor\": {\n        f\"Coste de espera c_q (€/ut por cliente; ut = {us})\": eur(comunes[\"cq\"]),\n        f\"Coste por servidor c_s por defecto (€/ut; ut = {us})\": eur(comunes[\"cs\"]),\n        \"s máximo explorado en el dimensionamiento (≤ K)\": num(comunes[\"s_max\"], 0),\n        \"Objetivo · ρ̄ máxima (ocupación efectiva)\": pct(ob[\"RHO_MAX\"], 0) if ob.get(\"RHO_MAX\") is not None else \"no se evalúa\",\n        f\"Objetivo · Wq máxima ({ul})\": num(ob[\"WQ_MAX\"], 3) if ob.get(\"WQ_MAX\") is not None else \"no se evalúa\",\n        \"Objetivo · P(bloqueo) máxima\": pct(ob[\"PBLOQ_MAX\"], 1) if ob.get(\"PBLOQ_MAX\") is not None else \"no se evalúa\",\n        \"Objetivo · Lq máxima\": num(ob[\"LQ_MAX\"], 2) if ob.get(\"LQ_MAX\") is not None else \"no se evalúa\",\n        f\"Simulación · duración de cada réplica ({ul})\": num(ajustes[\"duracion\"], 0),\n        \"Simulación · réplicas (semillas)\": f\"{ajustes['replicas']} (semillas {ajustes['semilla']} … \"\n                                            f\"{int(ajustes['semilla']) + int(ajustes['replicas']) - 1})\",\n        \"Diagrama de funcionamiento\": f\"primeras {mmsk.N_DIAGRAMA} llegadas\"}})\n    inf.tabla(com, \"Parámetros comunes, objetivos de servicio y ajustes de simulación\", nombre_indice=\"Parámetro\",\n              formato=lambda f, c, v: v)\n\n    # 2. Síntesis\n    inf.h(\"2. Síntesis y recomendación\", 1)\n    for n, r in res.items():\n        inf.p(mmsk.texto_escenario(n, r, u), negrita_inicio=n + \":\")\n    inf.p(\"Recomendación: \" + mmsk.texto_recomendacion(res, u), negrita_inicio=\"Recomendación:\")\n    if len(res) > 1:\n        comp = mmsk.tabla_comparativa(res)\n        inf.tabla(comp, \"Comparación de escenarios (filas «Teórico»: fórmulas del modelo; filas «Simulado»: media de las \"\n                        \"réplicas Monte Carlo)\", formato=fmt_kpi, nombre_indice=\"KPI\",\n                  ancho_fuente=7.5)\n        inf.tabla(mmsk.tabla_objetivos(res), \"Cumplimiento de los objetivos de servicio (valores teóricos)\", nombre_indice=\"Objetivo\",\n                  formato=lambda f, c, v: str(v), ancho_fuente=8)\n        inf.figura(gr.fig_comparativa(res, ul), \"Ocupación efectiva, probabilidad de bloqueo, tiempo medio en cola y coste total por escenario (teóricos)\")\n        inf.figura(gr.fig_validacion(res), \"Error relativo de la simulación frente a los valores teóricos\")\n\n    # 3. Detalle por escenario\n    for k, (n, r) in enumerate(res.items(), start=3):\n        inf.salto()\n        t, cst = r[\"teoria\"], r[\"costes\"]\n        inf.h(f\"{k}. Escenario «{n}» · M/M/{t['s']}/{t['K']}\", 1)\n        if r[\"esc\"].get(\"descripcion\"):\n            inf.p(r[\"esc\"][\"descripcion\"])\n        in
