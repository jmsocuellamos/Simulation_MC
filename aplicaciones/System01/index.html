<div id="root"></div>
<script type="module">
  import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build/stlite.js";

  mount(
    {
      requirements: ["simpy", "pandas", "numpy"],
      entrypoint: "app.py",
      files: {
  "app.py": "# -*- coding: utf-8 -*-\n\"\"\"\nRed de Colas Hospitalaria — 4 escenarios (versión Streamlit)\n\nRéplica en Streamlit, centrada en el informe comparativo Monte Carlo, del\nArtifact HTML/JS \"Red de colas hospitalaria — 4 escenarios\" de este mismo\nproyecto: mismo motor de simulación (el SimPy original de Javier Morales,\nequipo IA4LEGOS), mismos 4 protocolos y el mismo informe comparativo\nMonte Carlo (KPIs operativos, clínicos, de recursos, económicos y SLAs).\n\nMaterial de partida (modelo, protocolo clínico, tarifas): Javier Morales,\nequipo IA4LEGOS (https://ia4legos.umh.es/). Licencia CC BY-SA 4.0.\n\"\"\"\n\nimport time\n\nimport pandas as pd\nimport streamlit as st\n\nimport sim_engine\nfrom montecarlo import agregar_muestras\nfrom kpis import calcular_kpis\nfrom diagram import STATION_LABELS\n\nst.set_page_config(page_title=\"Red de Colas Hospitalaria\", page_icon=\"🏥\", layout=\"wide\")\n\n# Reglas de impresión: al imprimir (o «Guardar como PDF») desde el navegador\n# (Ctrl+P / Cmd+P) se ocultan los controles interactivos (barra lateral,\n# deslizadores, campos numéricos, botones, avisos) para que sólo se imprima\n# el informe en sí — ver también el cambio de st.dataframe a st.table más\n# abajo, necesario porque el grid interactivo de st.dataframe no imprime\n# bien (se recorta a la parte visible en pantalla).\nst.markdown(\n    \"\"\"\n    <style>\n    @media print {\n        section[data-testid=\"stSidebar\"],\n        div[data-testid=\"stSlider\"],\n        div[data-testid=\"stNumberInput\"],\n        div[data-testid=\"stAlert\"],\n        .stButton {\n            display: none !important;\n        }\n    }\n    </style>\n    \"\"\",\n    unsafe_allow_html=True,\n)\n\nTIPOS = [\"Verde\", \"Amarillo\", \"Naranja\", \"Rojo\"]\n\n\n# ---------------------------------------------------------------------------\n# Estado de sesión\n# ---------------------------------------------------------------------------\nif \"overrides_global\" not in st.session_state:\n    # Un único conjunto de capacidades, aplicado por igual a los 4 escenarios\n    # (ya no hay un selector de \"escenario a editar\": ver la sección de la\n    # barra lateral más abajo).\n    st.session_state.overrides_global = {}\nif \"mc_resultados\" not in st.session_state:\n    st.session_state.mc_resultados = None\nif \"mc_progress\" not in st.session_state:\n    # Texto de estado de la última (o próxima) ejecución Monte Carlo,\n    # persistente entre reruns de Streamlit para que esté siempre visible\n    # (antes de la primera ejecución, durante ella, y después de terminar),\n    # no sólo mientras el bloque del botón se está ejecutando. Es un texto\n    # simple (no una barra de progreso) a propósito: evita depender del\n    # parámetro `text=` de st.progress(), que no está disponible en todas\n    # las versiones de Streamlit empaquetadas en stlite.\n    st.session_state.mc_progress = (\n        \"⏳ Sin ejecutar todavía. Pulsa «▶️ Ejecutar Monte Carlo comparativo» más abajo.\"\n    )\nif \"mc_run\" not in st.session_state:\n    # Estado de una ejecución Monte Carlo EN CURSO, dividida en pasos de\n    # una sola réplica cada uno (ver el \"motor de avance\" más abajo,\n    # justo antes de \"Informe Monte Carlo comparativo\"). None = no hay\n    # ninguna ejecución en curso en este momento.\n    st.session_state.mc_run = None\n\n\ndef overrides_tuple_global():\n    return tuple(sorted(st.session_state.overrides_global.items()))\n\n\ndef resumen_parametros(cfg):\n    \"\"\"Lista (etiqueta, valor) de los parámetros del sistema efectivamente\n    aplicados en `cfg`, en el mismo orden que el panel «⚙️ Parámetros del\n    sistema» de la barra lateral. Se usa para reflejar en la cabecera del\n    informe qué parámetros produjeron los resultados mostrados.\"\"\"\n    filas = [(STATION_LABELS.get(n, n), cap) for n, cap in cfg.SERVIDORES_CAPACIDAD.items()]\n    filas.append((\"Box de Urgencias (plazas)\", cfg.BOX_CAPACIDAD))\n    filas += [(STATION_LABELS.get(n, n), cap) for n, cap in cfg.CAMAS_CAPACIDAD.items()]\n    filas += [\n        (\"UCI — bolsa Rojo\", cfg.UCI_ROJO_CAPACIDAD),\n        (\"UCI — bolsa Naranja\", cfg.UCI_NARANJA_CAPACIDAD),\n        (\"UCI — bolsa Amarillo/Verde\", cfg.UCI_BASE_CAPACIDAD),\n        (\"Límite de espera a UCI (horas)\", cfg.LIMITE_ESPERA_UCI),\n    ]\n    return filas\n\n\ndef construir_informe_html(meta, tablas):\n    \"\"\"HTML autocontenido (sin dependencias externas) con la cabecera de\n    parámetros y todas las tablas del informe, para el botón de descarga —\n    un fichero que Javier puede guardar/compartir/imprimir independiente\n    de la app en sí.\"\"\"\n    generado = time.strftime(\"%Y-%m-%d %H:%M:%S\")\n    partes = [\n        \"<!doctype html><html lang='es'><head><meta charset='utf-8'>\",\n        \"<title>Informe Monte Carlo — Red de Colas Hospitalaria</title>\",\n        \"<style>\",\n        \"body{font-family:Arial,Helvetica,sans-serif;margin:24px;color:#222}\",\n        \"h1{font-size:20px} h2{font-size:16px;margin-top:28px}\",\n        \"table{border-collapse:collapse;margin-bottom:12px}\",\n        \"th,td{border:1px solid #ccc;padding:4px 8px;font-size:13px;text-align:left}\",\n        \"th{background:#f0f0f0}\",\n        \"</style></head><body>\",\n        \"<h1>🏥 Red de Colas Hospitalaria — informe Monte Carlo comparativo</h1>\",\n        f\"<p>Generado: {generado}</p>\",\n        f\"<p><b>Réplicas por escenario:</b> {meta['replicas']} &nbsp; \"\n        f\"<b>Días por réplica:</b> {meta['dias']} &nbsp; \"\n        f\"<b>Semilla base:</b> {meta.get('seed_base', '—')}</p>\",\n    ]\n    params_li = \"\".join(f\"<li>{etq}: {val}</li>\" for etq, val in meta.get(\"parametros\", []))\n    partes.append(f\"<p><b>Parámetros del sistema aplicados:</b></p><ul>{params_li}</ul>\")\n    for titulo, df in tablas:\n        partes.append(f\"<h2>{titulo}</h2>\")\n        partes.append(df.to_html(escape=False))\n    tiempo_total = meta.get(\"tiempo_total\")\n    if tiempo_total is not None:\n        partes.append(\n            f\"<p>Generado en {tiempo_total:.1f} s. Sin período de calentamiento \"\n            \"(la ventana simulada arranca con el hospital vacío).</p>\"\n        )\n    partes.append(\"</body></html>\")\n    return \"\\n\".join(partes)\n\n\n# ---------------------------------------------------------------------------\n# Sidebar: parámetros del sistema (un único conjunto para los 4 escenarios)\n# ---------------------------------------------------------------------------\nst.sidebar.title(\"🏥 Red de Colas Hospitalaria\")\nst.sidebar.caption(\"4 protocolos de Urgencias — simulación de eventos discretos (SimPy)\")\n\n# Ya no hay desplegable de escenario: un único conjunto de capacidades\n# compartidas se edita aquí y se aplica por igual a los 4 escenarios al\n# generar el próximo informe Monte Carlo (construir_cfg() ignora, para cada\n# escenario, cualquier clave de override que no le corresponda — p. ej. las\n# bolsas de UCI particionada no afectan al Escenario C, que usa un pool\n# único — así que un mismo diccionario de overrides es seguro para los 4).\n# Se toma el escenario \"base\" sólo como referencia para los valores por\n# defecto que se muestran en los campos.\ncfg_referencia = sim_engine.construir_cfg(\"base\", st.session_state.overrides_global)\n\nwith st.sidebar.expander(\"⚙️ Parámetros del sistema\", expanded=False):\n    st.caption(\n        \"Capacidades compartidas por los 4 escenarios: se aplican a los 4 a la vez en el próximo \"\n        \"informe Monte Carlo que generes (ya no se editan por separado).\"\n    )\n    nuevos = {}\n    st.markdown(\"**Personal / mesas**\")\n    for nombre, cap in cfg_referencia.SERVIDORES_CAPACIDAD.items():\n        nuevos[f\"SERVIDORES_CAPACIDAD.{nombre}\"] = st.number_input(\n            STATION_LABELS.get(nombre, nombre), min_value=1, max_value=200, value=int(cap), step=1,\n            key=f\"param_srv_{nombre}\",\n        )\n    st.markdown(\"**Box de Urgencias**\")\n    nuevos[\"BOX_CAPACIDAD\"] = st.number_input(\n        \"Box de Urgencias (plazas)\", min_value=1, max_value=500,\n        value=int(cfg_referencia.BOX_CAPACIDAD), step=1, key=\"param_box\",\n    )\n    st.markdown(\"**Camas**\")\n    for nombre, cap in cfg_referencia.CAMAS_CAPACIDAD.items():\n        nuevos[f\"CAMAS_CAPACIDAD.{nombre}\"] = st.number_input(\n            STATION_LABELS.get(nombre, nombre), min_value=1, max_value=1000, value=int(cap), step=1,\n            key=f\"param_cama_{nombre}\",\n        )\n    st.markdown(\"**UCI**\")\n    st.caption(\n        \"El Escenario C gestiona estas mismas camas como un pool único con prioridad por gravedad \"\n        \"en vez de 3 bolsas separadas; su capacidad total se iguala automáticamente a la suma de las \"\n        \"3 bolsas de abajo, para que represente las mismas camas con otra gestión, no camas distintas.\"\n    )\n    nuevos[\"UCI_ROJO_CAPACIDAD\"] = st.number_input(\n        \"UCI — bolsa Rojo\", min_value=0, max_value=300,\n        value=int(cfg_referencia.UCI_ROJO_CAPACIDAD), step=1, key=\"param_uci_rojo\",\n    )\n    nuevos[\"UCI_NARANJA_CAPACIDAD\"] = st.number_input(\n        \"UCI — bolsa Naranja\", min_value=0, max_value=300,\n        value=int(cfg_referencia.UCI_NARANJA_CAPACIDAD), step=1, key=\"param_uci_naranja\",\n    )\n    nuevos[\"UCI_BASE_CAPACIDAD\"] = st.number_input(\n        \"UCI — bolsa Amarillo/Verde\", min_value=0, max_value=300,\n        value=int(cfg_referencia.UCI_BASE_CAPACIDAD), step=1, key=\"param_uci_base\",\n    )\n    nuevos[\"UCI_TOTAL_CAPACIDAD\"] = (\n        nuevos[\"UCI_ROJO_CAPACIDAD\"] + nuevos[\"UCI_NARANJA_CAPACIDAD\"] + nuevos[\"UCI_BASE_CAPACIDAD\"]\n    )\n    nuevos[\"LIMITE_ESPERA_UCI\"] = st.number_input(\n        \"Límite de espera a UCI (horas)\", min_value=1.0, max_value=72.0,\n        value=float(cfg_referencia.LIMITE_ESPERA_UCI), step=1.0, key=\"param_uci_limite\",\n    )\n\n    if st.button(\"Aplicar cambios y regenerar\", key=\"aplicar_parametros\"):\n        st.session_state.overrides_global = nuevos\n        st.rerun()\n\n\n# ---------------------------------------------------------------------------\n# Cabecera\n# ---------------------------------------------------------------------------\nst.title(\"🏥 Red de Colas Hospitalaria — informe Monte Carlo comparativo\")\nst.caption(\n    \"Material de partida: Javier Morales, equipo IA4LEGOS. Réplica Streamlit del simulador \"\n    \"de red de colas hospitalaria — mismo motor SimPy, mismos 4 protocolos e informe Monte Carlo \"\n    \"que el Artifact HTML/JS de este proyecto.\"\n)\nst.info(\n    \"Panel **«⚙️ Parámetros del sistema»** (barra lateral): un único conjunto de capacidades que se aplica \"\n    \"a los 4 escenarios a la vez en el próximo informe Monte Carlo que generes. Particularidades propias \"\n    \"de un escenario concreto (el equipo del circuito rápido del Escenario B, el modo de gestión de la UCI \"\n    \"del Escenario C) no se editan aquí y mantienen su valor por defecto.\"\n)\n\n\n# ---------------------------------------------------------------------------\n# Informe Monte Carlo comparativo\n# ---------------------------------------------------------------------------\nst.markdown(\n    \"Ejecuta **N réplicas independientes** de cada uno de los 4 protocolos y agrega los KPIs \"\n    \"(media ± IC95% entre réplicas), igual criterio que el informe del Artifact HTML/JS de este proyecto.\"\n)\ncol1, col2, col3 = st.columns(3)\nwith col1:\n    n_replicas = st.slider(\"Réplicas por escenario\", min_value=5, max_value=50, value=12)\nwith col2:\n    dias_replica = st.slider(\"Días por réplica\", min_value=10, max_value=180, value=45)\nwith col3:\n    seed_base = st.number_input(\"Semilla base\", min_value=1, max_value=999999, value=1000)\n\nst.caption(\n    \"⚠️ Cada réplica es una simulación independiente completa (× 4 escenarios): con ajustes altos puede \"\n    \"tardar bastante, especialmente en la versión que corre en el propio navegador (stlite). Empieza con \"\n    \"valores moderados y súbelos si necesitas más precisión estadística.\"\n)\n\n# Texto de estado SIEMPRE visible (no sólo mientras se genera el informe):\n# se redibuja en cada rerun de Streamlit a partir del estado guardado en\n# session_state, así que se ve el mensaje inicial antes de la primera\n# ejecución, se actualiza réplica a réplica durante la ejecución, y se\n# queda en el mensaje final (\"✅ Completado...\") después de terminar, en\n# vez de desaparecer en el siguiente rerun. Se muestra dentro de un\n# recuadro de aviso (st.info, no texto plano) para que sea imposible de\n# pasar por alto — es el ÚNICO indicador de la réplica en curso.\nestado_ejecucion = st.empty()\nestado_ejecucion.info(st.session_state.mc_progress, icon=\"⏳\")\n\nif st.button(\"▶️ Ejecutar Monte Carlo comparativo\", type=\"primary\"):\n    # Sólo prepara el estado de la ejecución: el trabajo real (una réplica\n    # por rerun) lo hace el \"motor de avance\" de justo abajo, que se\n    # ejecuta en TODOS los reruns mientras `mc_run` no sea None.\n    st.session_state.mc_run = {\n        \"claves\": list(sim_engine.ESCENARIOS.keys()),\n        \"idx_escenario\": 0,\n        \"muestras_actual\": [],\n        \"resultados\": {},\n        \"overrides\": overrides_tuple_global(),\n        \"n_replicas\": n_replicas,\n        \"dias\": dias_replica,\n        \"seed_base\": seed_base,\n        \"t_inicio\": time.time(),\n    }\n    texto = \"⏳ Preparando la primera réplica…\"\n    st.session_state.mc_progress = texto\n    estado_ejecucion.info(texto, icon=\"⏳\")\n\n# Motor de avance: hace UNA ÚNICA réplica por rerun de Streamlit y llama a\n# `st.rerun()` para forzar un ciclo de rerender completo entre una réplica\n# y la siguiente — no se ejecutan las 4×N réplicas en un único bucle\n# síncrono como antes. Esto es necesario porque, a diferencia de un\n# servidor Streamlit normal, en stlite actualizar un `st.empty()` dentro\n# de un bucle Python largo no repinta la pantalla hasta que el script\n# entero termina de ejecutarse: el resultado visible era justo lo que\n# reportó Javier (\"la barra/el indicador sólo aparece al final\"). Forzando\n# un `st.rerun()` real por cada réplica, el navegador sí tiene ocasión de\n# repintar entre un paso y el siguiente.\nrun = st.session_state.mc_run\nif run is not None:\n    claves = run[\"claves\"]\n    idx = run[\"idx_escenario\"]\n    total_escenarios = len(claves)\n    n_replicas_run = run[\"n_replicas\"]\n    total_replicas_global = n_replicas_run * total_escenarios\n\n    if idx >= total_escenarios:\n        # Los 4 escenarios ya están completos: cerrar la ejecución y\n        # dejar que el script siga su curso normal (más abajo) para\n        # mostrar el informe en esta misma pasada, sin otro rerun más.\n        tiempo_total = time.time() - run[\"t_inicio\"]\n        texto_final = (\n            f\"✅ Completado: {total_replicas_global}/{total_replicas_global} réplicas \"\n            f\"(4 escenarios × {n_replicas_run}) en {tiempo_total:.1f} s.\"\n        )\n        st.session_state.mc_progress = texto_final\n        estado_ejecucion.info(texto_final, icon=\"✅\")\n        st.session_state.mc_resultados = run[\"resultados\"]\n        cfg_usado = sim_engine.construir_cfg(\"base\", dict(run[\"overrides\"]))\n        st.session_state.mc_meta = {\n            \"replicas\": n_replicas_run,\n            \"dias\": run[\"dias\"],\n            \"seed_base\": run[\"seed_base\"],\n            \"tiempo_total\": tiempo_total,\n            \"parametros\": resumen_parametros(cfg_usado),\n        }\n        st.session_state.mc_run = None\n    else:\n        clave = claves[idx]\n        i = len(run[\"muestras_actual\"])  # réplicas ya hechas de este escenario\n        if i >= n_replicas_run:\n            # Escenario actual completo: agregar sus réplicas (misma\n            # fórmula que montecarlo.ejecutar_monte_carlo, vía la misma\n            # función agregar_muestras) y pasar al siguiente escenario.\n            run[\"resultados\"][clave] = agregar_muestras(run[\"muestras_actual\"])\n            run[\"muestras_actual\"] = []\n            run[\"idx_escenario\"] += 1\n        else:\n            cfg = sim_engine.construir_cfg(clave, dict(run[\"overrides\"]))\n            seed = run[\"seed_base\"] + i * 97 + 1\n            df = sim_engine.simular(cfg, run[\"dias\"], seed)\n            run[\"muestras_actual\"].append(calcular_kpis(df, cfg, run[\"dias\"] * 24))\n            hechas = idx * n_replicas_run + (i + 1)\n            texto = (\n                f\"⏳ Réplica **{i + 1} de {n_replicas_run}** — escenario **{idx + 1}/{total_escenarios}** \"\n                f\"(«{sim_engine.NOMBRES_ESCENARIOS[clave]}») · {hechas}/{total_replicas_global} réplicas en total\"\n            )\n            st.session_state.mc_progress = texto\n            estado_ejecucion.info(texto, icon=\"⏳\")\n        st.rerun()\n\nresultados = st.session_state.mc_resultados\nif resultados:\n    claves = list(sim_engine.ESCENARIOS.keys())\n    nombres_cols = [sim_engine.NOMBRES_ESCENARIOS[c] for c in claves]\n    meta = st.session_state.mc_meta\n    dias_sim = meta[\"dias\"]\n\n    # Cabecera del informe: réplicas por escenario, días por réplica y\n    # parámetros del sistema con los que se generó ESTE informe (no los\n    # valores que puedan estar ahora mismo en la barra lateral, que\n    # podrían haber cambiado después de pulsar \"Ejecutar\").\n    st.subheader(\"📋 Parámetros de esta ejecución\")\n    col_meta1, col_meta2 = st.columns([1, 2])\n    with col_meta1:\n        st.markdown(\n            f\"- **Réplicas por escenario:** {meta['replicas']}\\n\"\n            f\"- **Días por réplica:** {meta['dias']}\\n\"\n            f\"- **Semilla base:** {meta.get('seed_base', '—')}\"\n        )\n    with col_meta2:\n        params_txt = \"\\n\".join(\n            f\"- **{etiqueta}:** {valor}\" for etiqueta, valor in meta.get(\"parametros\", [])\n        )\n        st.markdown(\"**Parámetros del sistema aplicados:**\\n\" + (params_txt or \"—\"))\n    st.caption(\n        \"🖨️ Para obtener una copia impresa (o en PDF) de este informe: usa Ctrl+P (Windows/Linux) \"\n        \"o ⌘+P (Mac) desde el navegador. Los controles (barra lateral, deslizadores, campos, botones \"\n        \"y avisos) se ocultan automáticamente al imprimir — sólo se imprime el informe.\"\n    )\n    st.divider()\n\n    # Tablas acumuladas (título, DataFrame) para el botón de descarga de\n    # más abajo: se recopilan a medida que se generan, en vez de\n    # reconstruirlas aparte, para que el fichero descargado sea\n    # exactamente lo mismo que se ve en pantalla/se imprime.\n    tablas_descarga = []\n\n    def fmt(clave, key):\n        v = resultados[clave][key]\n        return f\"{v['media']:.2f} ± {v['ci95']:.2f}\"\n\n    def tabla(filas, titulo):\n        st.subheader(titulo)\n        data = {nombre: [fmt(clave, key) for _, key in filas] for nombre, clave in zip(nombres_cols, claves)}\n        idx = [etiqueta for etiqueta, _ in filas]\n        df = pd.DataFrame(data, index=idx)\n        # st.table (HTML estático) en vez de st.dataframe (grid interactivo\n        # virtualizado): este último se recorta a la parte visible en\n        # pantalla al imprimir, st.table imprime todas las filas.\n        st.table(df)\n        tablas_descarga.append((titulo, df))\n\n    tabla([\n        (\"Tiempo en el sistema (h), global\", \"oper.Tsys_h.global\"),\n        *[(f\"Tiempo en el sistema (h), {t}\", f\"oper.Tsys_h.{t}\") for t in TIPOS],\n        (\"Tiempo en espera (h), global\", \"oper.Tq_h.global\"),\n        (\"Ratio de espera / T_sys (%), global\", \"oper.ratioEspera_pct.global\"),\n    ], \"⏱️ KPIs operativos\")\n\n    tabla([\n        (\"Tasa de altas (%)\", \"clin.tasaAltas_pct.global\"),\n        (\"Mortalidad global (%)\", \"clin.mortalidad_pct.global\"),\n        *[(f\"Mortalidad {t} (%)\", f\"clin.mortalidad_pct.{t}\") for t in TIPOS],\n        (\"Mortalidad por falta de UCI, Naranja/Rojo (%)\", \"clin.sinUCI_pct.naranjaRojo\"),\n        (\"Tasa de hospitalización (%)\", \"clin.tasaHospitalizacion_pct\"),\n        (\"Derivación a UCI desde Urgencias (%)\", \"clin.derivacionUCI_pct.desdeUrgencias\"),\n        (\"Derivación a UCI desde Planta (%)\", \"clin.derivacionUCI_pct.desdePlanta\"),\n    ], \"❤️‍🩹 KPIs clínicos\")\n\n    tabla([\n        (\"Recursos saturados (ρ≥1)\", \"rec.n_recursos_saturados\"),\n        (\"Recursos en alta congestión (0.85≤ρ<1)\", \"rec.n_recursos_alta_congestion\"),\n        (\"Bed-blocking total (h)\", \"rec.bedBlocking_h.total\"),\n    ], \"🛏️ KPIs de recursos\")\n\n    tabla([\n        (\"Ingresos por altas (€)\", \"econ.ingresos\"),\n        (\"Coste variable (€)\", \"econ.costeVariable\"),\n        (\"Penalizaciones (€)\", \"econ.costePenalizacion\"),\n        (\"Coste fijo del escenario (€, prorrateado a la ventana)\", \"econ.costeFijo\"),\n        (\"Coste total (€)\", \"econ.costeTotal\"),\n        (\"Coste medio por paciente (€)\", \"econ.costeMedioPorPaciente\"),\n        (\"Margen operativo (%)\", \"econ.margen_pct\"),\n        (\"Margen objetivo exigido (%)\", \"econ.margenObjetivo_pct\"),\n    ], \"💶 KPIs económicos\")\n\n    st.subheader(\"🏆 Cumplimiento de SLAs (Sección A.08)\")\n    filas_sla = [\n        (\"Door-to-doctor ≤15min (Naranja/Rojo), % que cumple\", \"sla.doorToDoctor_pctCumple\", None),\n        (\"Ratio de espera Verde/Amarillo <25% (media %)\", \"sla.ratioEsperaVA_pct.media\", \"sla.ratioEsperaVA_cumple\"),\n        (\"Ocupación UCI (media %)\", \"sla.ocupacionUCI_pct.media\", \"sla.ocupacionUCI_cumple\"),\n        (\"Mortalidad evitable (Sin UCI) <2%\", \"clin.sinUCI_pct.naranjaRojo\", \"sla.mortalidadEvitable_cumple\"),\n    ]\n    data_sla = {}\n    for nombre, clave in zip(nombres_cols, claves):\n        col_vals = []\n        for etiqueta, key_val, key_cumple in filas_sla:\n            val = fmt(clave, key_val)\n            if key_cumple:\n                ok = resultados[clave][key_cumple][\"media\"] >= 0.5\n                val += \"  ✅\" if ok else \"  ❌\"\n            col_vals.append(val)\n        data_sla[nombre] = col_vals\n    df_sla = pd.DataFrame(data_sla, index=[f for f, _, _ in filas_sla])\n    st.table(df_sla)\n    tablas_descarga.append((\"🏆 Cumplimiento de SLAs (Sección A.08)\", df_sla))\n\n    st.subheader(\"💰 Viabilidad económica frente a Línea Base\")\n    filas_amort = []\n    margen_base_dia = (\n        resultados[\"base\"][\"econ.ingresos\"][\"media\"]\n        - resultados[\"base\"][\"econ.costeVariable\"][\"media\"]\n        - resultados[\"base\"][\"econ.costePenalizacion\"][\"media\"]\n    ) / dias_sim\n    for clave in claves:\n        if clave == \"base\":\n            continue\n        cfg_tmp = sim_engine.ESCENARIOS[clave]()\n        margen_dia = (\n            resultados[clave][\"econ.ingresos\"][\"media\"]\n            - resultados[clave][\"econ.costeVariable\"][\"media\"]\n            - resultados[clave][\"econ.costePenalizacion\"][\"media\"]\n        ) / dias_sim\n        delta_dia = margen_dia - margen_base_dia\n        for concepto, valor in (cfg_tmp.COSTES_FIJOS or {}).items():\n            anual = concepto.endswith(\"_anual\")\n            if delta_dia > 0:\n                payback = valor / delta_dia if anual else valor / delta_dia\n                payback_txt = f\"{payback:,.0f} días\"\n            else:\n                payback_txt = \"No amortiza en este horizonte (margen incremental ≤ 0)\"\n            filas_amort.append({\n                \"Escenario\": sim_engine.NOMBRES_ESCENARIOS[clave],\n                \"Coste del escenario\": f\"{valor:,.0f} €{' /año' if anual else ' (único)'}\",\n                \"Margen operativo incremental vs Línea Base (€/día)\": f\"{delta_dia:,.2f}\",\n                \"Período de amortización\": payback_txt,\n            })\n    if filas_amort:\n        df_amort = pd.DataFrame(filas_amort).set_index(\"Escenario\")\n        st.table(df_amort)\n        tablas_descarga.append((\"💰 Viabilidad económica frente a Línea Base\", df_amort))\n    else:\n        st.caption(\"Ningún escenario alternativo tiene coste fijo que amortizar.\")\n\n    informe_html = construir_informe_html(meta, tablas_descarga)\n    st.download_button(\n        \"⬇️ Descargar informe (HTML)\",\n        data=informe_html,\n        file_name=f\"informe_red_colas_hospitalaria_{time.strftime('%Y%m%d_%H%M%S')}.html\",\n        mime=\"text/html\",\n    )\n\n    tiempo_total_txt = \"\"\n    if st.session_state.mc_meta.get(\"tiempo_total\") is not None:\n        tiempo_total_txt = f\" Generado en {st.session_state.mc_meta['tiempo_total']:.1f} s.\"\n    st.caption(\n        f\"Informe generado con {st.session_state.mc_meta['replicas']} réplicas de \"\n        f\"{st.session_state.mc_meta['dias']} días por escenario.{tiempo_total_txt} Sin período de \"\n        \"calentamiento (la ventana simulada arranca con el hospital vacío), igual criterio que el \"\n        \"Artifact HTML/JS.\"\n    )\nelse:\n    st.info(\"Pulsa **Ejecutar Monte Carlo comparativo** para generar el informe de los 4 escenarios.\")\n",
  "sim_engine.py": "# -*- coding: utf-8 -*-\n\"\"\"\nMotor de simulación de la Red de Colas Hospitalaria (4 protocolos).\n\nEste módulo es una copia fiel del motor SimPy original de Javier Morales\n(`01_red_de_colas_hospitalaria.py`, equipo IA4LEGOS) — la misma lógica que\nya se usó como fuente de verdad para el Artifact HTML/JS de este proyecto.\nNo se ha modificado ningún comportamiento del algoritmo: únicamente se ha\nextraído el código ejecutable del cuaderno de Colab (quitando las celdas de\ntexto/markdown y las ejecuciones de demostración) para reutilizarlo tal\ncual desde la aplicación Streamlit.\n\nLicencia del material original: CC BY-SA 4.0.\n\"\"\"\n\nimport random\nimport copy\n\nimport pandas as pd\nimport simpy\n\n\nclass Config:\n    \"\"\"Contenedor simple de los parámetros de un escenario (capacidades,\n    tiempos de servicio, probabilidades de derivación, costes...).\"\"\"\n    pass\n\n\n# --- Parámetros compartidos por TODOS los escenarios (no cambian) ---------\nTIPOS = [\"Verde\", \"Amarillo\", \"Naranja\", \"Rojo\"]\n\nLLEGADAS_HORARIAS = {\n    (22, 7):  (3.0, [0.15, 0.35, 0.35, 0.15]),\n    (7, 10):  (4.5, [0.30, 0.30, 0.25, 0.15]),\n    (10, 14): (6.0, [0.30, 0.35, 0.30, 0.05]),\n    (14, 17): (4.5, [0.40, 0.30, 0.25, 0.05]),\n    (17, 22): (7.0, [0.25, 0.30, 0.30, 0.15]),\n}\n\n\ndef obtener_perfil_horario(reloj_horas):\n    hora_dia = int(reloj_horas) % 24\n    for (inicio, fin), (tasa, probs) in LLEGADAS_HORARIAS.items():\n        if inicio > fin:\n            if hora_dia >= inicio or hora_dia < fin:\n                return tasa, probs\n        else:\n            if inicio <= hora_dia < fin:\n                return tasa, probs\n    raise RuntimeError(\"Franja horaria no cubierta\")\n\n\ndef generar_tiempo_servicio(cfg, estacion, tipo):\n    base = cfg.TIEMPOS_SERVICIO.get(estacion, {}).get(tipo)\n    if base is None:\n        raise KeyError(f\"Sin tiempo de servicio definido para {estacion}/{tipo}\")\n    return base * random.uniform(0.75, 1.25)\n\n\ndef determinar_destino(cfg, estacion, tipo):\n    opciones = cfg.PROB_DERIVACION[estacion][tipo]\n    destinos = list(opciones.keys())\n    pesos = list(opciones.values())\n    return random.choices(destinos, weights=pesos, k=1)[0]\n\n\ndef _verificar_filas(prob):\n    \"\"\"Comprueba que todas las filas de PROB_DERIVACION suman 1.0.\"\"\"\n    errores = []\n    for estacion, por_tipo in prob.items():\n        for tipo, destinos in por_tipo.items():\n            s = sum(destinos.values())\n            if abs(s - 1.0) > 1e-9:\n                errores.append((estacion, tipo, s))\n    return errores\n\n\nESTADOS_FINALES = {\"Alta\", \"Fallece\"}\nOBS_ESTACIONES = {\"Obs_Verde\", \"Obs_Amarillo\", \"Obs_Naranja\", \"Obs_Rojo\"}\n\n\nclass Hospital:\n    def __init__(self, env, cfg, simpy_module):\n        self.env = env\n        self.cfg = cfg\n        self.simpy = simpy_module\n        self.log_datos = []\n        self.activos = {}\n\n        self.servidores = {\n            nombre: simpy_module.Resource(env, capacity=cap)\n            for nombre, cap in cfg.SERVIDORES_CAPACIDAD.items()\n        }\n        self.camas = {\n            nombre: simpy_module.Resource(env, capacity=cap)\n            for nombre, cap in cfg.CAMAS_CAPACIDAD.items()\n        }\n        self.box = simpy_module.Resource(env, capacity=cfg.BOX_CAPACIDAD)\n\n        if cfg.UCI_MODE == \"pooled\":\n            self.uci = {\"POOL\": simpy_module.PriorityResource(env, capacity=cfg.UCI_TOTAL_CAPACIDAD)}\n        else:\n            self.uci = {\n                \"Rojo\": simpy_module.Resource(env, capacity=cfg.UCI_ROJO_CAPACIDAD),\n                \"Naranja\": simpy_module.Resource(env, capacity=cfg.UCI_NARANJA_CAPACIDAD),\n                \"Base\": simpy_module.Resource(env, capacity=cfg.UCI_BASE_CAPACIDAD),\n            }\n\n    def info_cola(self, resource):\n        q = len([r for r in resource.queue if not r.triggered and not getattr(r, \"_cancelled\", False)])\n        return q, q + resource.count\n\n    def resource_de_cama(self, nombre_logico):\n        alias = self.cfg.CAMA_ALIAS.get(nombre_logico, nombre_logico)\n        return self.camas[alias]\n\n    def pool_de_estacion(self, estacion):\n        return self.cfg.POOL_ESTACION.get(estacion, estacion)\n\n    def registrar(self, id_pac, tipo, t_in, estacion, t_wait, t_server, id_recurso,\n                  sala, q_len, sys_len, destino):\n        self.log_datos.append({\n            \"Id_pat\": id_pac, \"Pat_type\": tipo, \"T_in\": round(t_in, 4),\n            \"Station_in\": estacion, \"T_wait\": round(t_wait, 4),\n            \"T_server\": round(t_server, 4), \"ID_server\": id_recurso,\n            \"Wait_room\": sala, \"Pat_in_queue\": q_len, \"Pat_in_system\": sys_len,\n            \"T_out\": round(t_in + t_wait + t_server, 4), \"Station_out\": destino,\n            \"T_system\": round(t_wait + t_server, 4),\n        })\n\n    def finalizar_simulacion(self):\n        end_time = self.env.now\n        for pac_id, data in list(self.activos.items()):\n            t_transcurrido = end_time - data[\"t_llegada_estacion\"]\n            self.log_datos.append({\n                \"Id_pat\": pac_id, \"Pat_type\": data[\"tipo\"], \"T_in\": round(data[\"t_llegada_estacion\"], 4),\n                \"Station_in\": data[\"estacion\"], \"T_wait\": round(t_transcurrido, 4),\n                \"T_server\": 0.0, \"ID_server\": data.get(\"id_recurso\", \"N/A\"),\n                \"Wait_room\": data.get(\"sala\", \"N/A\"), \"Pat_in_queue\": data.get(\"q_len\", 0),\n                \"Pat_in_system\": data.get(\"sys_len\", 0), \"T_out\": round(end_time, 4),\n                \"Station_out\": \"Fin_Simulacion\", \"T_system\": round(t_transcurrido, 4),\n            })\n\n\ndef liberar_cama(hosp, cama_propia):\n    \"\"\"Libera una 'cama' propia: un recurso físico normal (registrado en\n    hosp.camas) o una cama de UCI (clave especial 'UCI::<bolsa>').\"\"\"\n    if cama_propia is None:\n        return\n    nombre, req = cama_propia\n    if nombre.startswith(\"UCI::\"):\n        bolsa = nombre.split(\"::\", 1)[1]\n        hosp.uci[bolsa].release(req)\n    else:\n        hosp.camas[nombre].release(req)\n\n\ndef comportamiento_paciente(env, hosp, simpy_module, id_paciente, tipo_paciente):\n    cfg = hosp.cfg\n    estacion_actual = \"Admision\"\n    mi_sala = \"Sala_Espera_Urgencias\"\n    box_propio = None       # request concedida del Box, si el paciente ya lo ocupa\n    cama_propia = None      # (nombre_logico, request) de la cama que ocupa\n    t_llegada = env.now\n\n    hosp.activos[id_paciente] = {\n        \"tipo\": tipo_paciente, \"t_llegada_estacion\": t_llegada, \"estacion\": estacion_actual,\n        \"sala\": mi_sala,\n    }\n\n    # Captura inmediata de Box para Rojo desde Admisión (paciente crítico)\n    if cfg.BOX_CAPTURA.get(tipo_paciente) == \"Admision\":\n        req_box = hosp.box.request()\n        yield req_box\n        box_propio = req_box\n        mi_sala = \"Box_Urgencias\"\n\n    while estacion_actual not in ESTADOS_FINALES:\n        hosp.activos[id_paciente].update({\n            \"t_llegada_estacion\": t_llegada, \"estacion\": estacion_actual, \"sala\": mi_sala,\n        })\n\n        # Captura de Box en el momento indicado por la configuración\n        if box_propio is None and cfg.BOX_CAPTURA.get(tipo_paciente) == estacion_actual:\n            req_box = hosp.box.request()\n            yield req_box\n            box_propio = req_box\n            mi_sala = \"Box_Urgencias\"\n            hosp.activos[id_paciente][\"sala\"] = mi_sala\n\n        t_wait = 0.0\n        id_recurso = \"N/A\"\n        q_len, sys_len = 0, 0\n\n        if estacion_actual in OBS_ESTACIONES:\n            # No hay recurso propio: se retiene la sala/box ya ocupado.\n            id_recurso = mi_sala\n            t_wait = 0.0\n\n        elif estacion_actual in cfg.CAMAS_CAPACIDAD or estacion_actual in cfg.CAMA_ALIAS:\n            recurso = hosp.resource_de_cama(estacion_actual)\n            alias = cfg.CAMA_ALIAS.get(estacion_actual, estacion_actual)\n            if cama_propia is not None and cama_propia[0] == alias:\n                t_wait = 0.0  # ya se encontraba en esa misma cama\n            else:\n                q_len, sys_len = hosp.info_cola(recurso)\n                t0 = env.now\n                req_cama = recurso.request()\n                yield req_cama\n                t_wait = env.now - t0\n                # libera la cama/box anterior (si tenía una física distinta)\n                if cama_propia is not None:\n                    liberar_cama(hosp, cama_propia)\n                    cama_propia = None\n                elif box_propio is not None:\n                    hosp.box.release(box_propio)\n                    box_propio = None\n                cama_propia = (alias, req_cama)\n            id_recurso = alias\n            mi_sala = alias\n            hosp.activos[id_paciente][\"sala\"] = mi_sala\n\n        elif estacion_actual == \"UCI\":\n            prioridad = {\"Rojo\": 0, \"Naranja\": 1, \"Amarillo\": 2, \"Verde\": 2}[tipo_paciente]\n            if cfg.UCI_MODE == \"pooled\":\n                pool = hosp.uci[\"POOL\"]\n                q_len, sys_len = hosp.info_cola(pool)\n                t0 = env.now\n                req_uci = pool.request(priority=prioridad)\n            else:\n                bolsa = {\"Rojo\": \"Rojo\", \"Naranja\": \"Naranja\"}.get(tipo_paciente, \"Base\")\n                pool = hosp.uci[bolsa]\n                q_len, sys_len = hosp.info_cola(pool)\n                t0 = env.now\n                req_uci = pool.request()\n\n            # Carrera entre conseguir cama y agotar el límite de espera\n            resultado = yield req_uci | env.timeout(cfg.LIMITE_ESPERA_UCI)\n            if req_uci in resultado:\n                t_wait = env.now - t0\n                if cama_propia is not None:\n                    liberar_cama(hosp, cama_propia)\n                    cama_propia = None\n                elif box_propio is not None:\n                    hosp.box.release(box_propio)\n                    box_propio = None\n                cama_propia = (\"UCI::\" + (bolsa if cfg.UCI_MODE != \"pooled\" else \"POOL\"), req_uci)\n                id_recurso = \"UCI\"\n                mi_sala = \"UCI\"\n            else:\n                req_uci.cancel()\n                t_wait = env.now - t0\n                # sin cama de UCI disponible dentro del límite: desenlace fatal\n                hosp.registrar(id_paciente, tipo_paciente, t_llegada, estacion_actual,\n                                t_wait, 0.0, \"Sin_UCI_Disponible\", mi_sala, q_len, sys_len, \"Fallece\")\n                estacion_actual = \"Fallece\"\n                break\n            hosp.activos[id_paciente][\"sala\"] = mi_sala\n\n        else:\n            # Estación \"servidor\": el recurso se libera justo tras el servicio\n            pool_nombre = hosp.pool_de_estacion(estacion_actual)\n            recurso = hosp.servidores[pool_nombre]\n            q_len, sys_len = hosp.info_cola(recurso)\n            t0 = env.now\n            req = recurso.request()\n            yield req\n            t_wait = env.now - t0\n            id_recurso = pool_nombre\n\n        t_servicio = generar_tiempo_servicio(cfg, estacion_actual, tipo_paciente)\n        yield env.timeout(t_servicio)\n\n        if (estacion_actual not in OBS_ESTACIONES\n                and estacion_actual not in cfg.CAMAS_CAPACIDAD\n                and estacion_actual not in cfg.CAMA_ALIAS\n                and estacion_actual != \"UCI\"):\n            hosp.servidores[hosp.pool_de_estacion(estacion_actual)].release(req)\n\n        destino = determinar_destino(cfg, estacion_actual, tipo_paciente)\n\n        if destino in ESTADOS_FINALES:\n            if box_propio is not None:\n                hosp.box.release(box_propio)\n                box_propio = None\n            if cama_propia is not None:\n                liberar_cama(hosp, cama_propia)\n                cama_propia = None\n\n        hosp.registrar(id_paciente, tipo_paciente, t_llegada, estacion_actual,\n                        t_wait, t_servicio, id_recurso, mi_sala, q_len, sys_len, destino)\n\n        estacion_actual = destino\n        t_llegada = env.now\n\n    if id_paciente in hosp.activos:\n        del hosp.activos[id_paciente]\n    if box_propio is not None:\n        hosp.box.release(box_propio)\n    if cama_propia is not None:\n        liberar_cama(hosp, cama_propia)\n\n\ndef generador_llegadas(env, hosp, simpy_module, cfg):\n    id_paciente = 1\n    while True:\n        tasa, probs = obtener_perfil_horario(env.now)\n        yield env.timeout(random.expovariate(tasa))\n        tipo = random.choices(TIPOS, weights=probs)[0]\n        env.process(comportamiento_paciente(env, hosp, simpy_module, f\"PAC_{id_paciente}\", tipo))\n        id_paciente += 1\n\n\ndef simular(cfg, dias, semilla, simpy_module=None):\n    \"\"\"Ejecuta la simulación de `cfg` durante `dias` días con la semilla dada.\n    Devuelve un DataFrame de pandas con la traza completa (mismo formato que\n    `traza_urgencias_red.csv`). Sin período de calentamiento (igual que el\n    Artifact HTML/JS de este mismo proyecto): la ventana simulada arranca\n    directamente con el hospital vacío.\"\"\"\n    if simpy_module is None:\n        simpy_module = simpy\n    random.seed(semilla)\n    env = simpy_module.Environment()\n    hosp = Hospital(env, cfg, simpy_module)\n    env.process(generador_llegadas(env, hosp, simpy_module, cfg))\n    env.run(until=dias * 24)\n    hosp.finalizar_simulacion()\n    df_sim = pd.DataFrame(hosp.log_datos)\n    if len(df_sim):\n        df_sim = df_sim.sort_values(by=[\"T_in\"]).reset_index(drop=True)\n    return df_sim\n\n\n# ============================================================================\n# CONFIGURACIONES DE LOS 4 PROTOCOLOS\n# ============================================================================\n\ndef construir_config_base():\n    cfg = Config()\n    cfg.nombre = \"Línea Base (protocolo actual)\"\n    cfg.clave = \"base\"\n\n    cfg.SERVIDORES_CAPACIDAD = {\n        \"Admision\": 3, \"Triaje\": 4, \"Aislamiento\": 6, \"Medicos\": 7,\n        \"Pruebas_Basicas\": 4, \"Pruebas_Avanzadas\": 4,\n        \"Consulta_Especialista\": 3, \"Farmacia\": 3,\n    }\n\n    cfg.BOX_CAPACIDAD = 55\n    cfg.CAMAS_CAPACIDAD = {\n        \"Planta\": 120,\n        \"Quirofano\": 3,\n        \"Rehabilitacion\": 43,\n    }\n    cfg.CAMA_ALIAS = {\"Planta_PostUCI\": \"Planta\"}\n    cfg.POOL_ESTACION = {\"Diag_Inicial\": \"Medicos\", \"Diag_Preliminar\": \"Medicos\"}\n    cfg.BOX_CAPTURA = {\"Rojo\": \"Admision\", \"Naranja\": \"Diag_Inicial\"}\n\n    cfg.UCI_MODE = \"partitioned\"       # \"partitioned\" (línea base) o \"pooled\" (Escenario C)\n    cfg.UCI_ROJO_CAPACIDAD = 45\n    cfg.UCI_NARANJA_CAPACIDAD = 30\n    cfg.UCI_BASE_CAPACIDAD = 4\n    cfg.UCI_TOTAL_CAPACIDAD = cfg.UCI_ROJO_CAPACIDAD + cfg.UCI_NARANJA_CAPACIDAD + cfg.UCI_BASE_CAPACIDAD  # 79\n    cfg.LIMITE_ESPERA_UCI = 12.0        # horas\n\n    cfg.TIEMPOS_SERVICIO = {\n        \"Admision\":              {\"Verde\": 5/60,  \"Amarillo\": 5/60,  \"Naranja\": 4/60,  \"Rojo\": 2/60},\n        \"Triaje\":                {\"Verde\": 10/60, \"Amarillo\": 8/60,  \"Naranja\": 6/60,  \"Rojo\": 4/60},\n        \"Aislamiento\":           {\"Verde\": 20/60, \"Amarillo\": 20/60, \"Naranja\": 20/60, \"Rojo\": 20/60},\n        \"Diag_Inicial\":          {\"Verde\": 10/60, \"Amarillo\": 10/60, \"Naranja\": 10/60, \"Rojo\": 10/60},\n        \"Pruebas_Basicas\":       {\"Verde\": 15/60, \"Amarillo\": 15/60, \"Naranja\": 15/60, \"Rojo\": 15/60},\n        \"Pruebas_Avanzadas\":     {\"Verde\": 45/60, \"Amarillo\": 45/60, \"Naranja\": 60/60, \"Rojo\": 60/60},\n        \"Consulta_Especialista\": {\"Verde\": 30/60, \"Amarillo\": 30/60, \"Naranja\": 30/60, \"Rojo\": 30/60},\n        \"Diag_Preliminar\":       {\"Verde\": 10/60, \"Amarillo\": 10/60, \"Naranja\": 15/60, \"Rojo\": 20/60},\n        \"Farmacia\":              {\"Verde\": 8/60,  \"Amarillo\": 8/60,  \"Naranja\": 8/60,  \"Rojo\": 8/60},\n        \"Quirofano\":             {\"Naranja\": 2.5, \"Rojo\": 3.5},\n        \"Planta\":                {\"Amarillo\": 24.0, \"Naranja\": 48.0, \"Rojo\": 72.0},\n        \"UCI\":                   {\"Amarillo\": 24.0, \"Naranja\": 72.0, \"Rojo\": 96.0},\n        \"Planta_PostUCI\":        {\"Amarillo\": 24.0, \"Naranja\": 36.0, \"Rojo\": 48.0},\n        \"Rehabilitacion\":        {\"Amarillo\": 48.0, \"Naranja\": 72.0, \"Rojo\": 96.0},\n        \"Obs_Verde\":             {\"Verde\": 6.0},\n        \"Obs_Amarillo\":          {\"Amarillo\": 6.0},\n        \"Obs_Naranja\":           {\"Naranja\": 6.0},\n        \"Obs_Rojo\":              {\"Rojo\": 6.0},\n    }\n\n    cfg.PROB_DERIVACION = {\n        \"Admision\": {t: {\"Triaje\": 1.0} for t in TIPOS},\n\n        \"Triaje\": {\n            \"Verde\":    {\"Aislamiento\": 0.05, \"Diag_Inicial\": 0.95},\n            \"Amarillo\": {\"Aislamiento\": 0.10, \"Diag_Inicial\": 0.90},\n            \"Naranja\":  {\"Aislamiento\": 0.12, \"Diag_Inicial\": 0.88},\n            \"Rojo\":     {\"Diag_Inicial\": 1.0},\n        },\n\n        \"Aislamiento\": {t: {\"Diag_Inicial\": 1.0} for t in (\"Verde\", \"Amarillo\", \"Naranja\")},\n\n        \"Diag_Inicial\": {\n            \"Verde\":    {\"Farmacia\": 0.15, \"Pruebas_Basicas\": 0.65, \"Pruebas_Avanzadas\": 0.20},\n            \"Amarillo\": {\"Farmacia\": 0.05, \"Pruebas_Basicas\": 0.55, \"Pruebas_Avanzadas\": 0.40},\n            \"Naranja\":  {\"Pruebas_Basicas\": 0.40, \"Pruebas_Avanzadas\": 0.42, \"Consulta_Especialista\": 0.18},\n            \"Rojo\":     {\"Pruebas_Basicas\": 0.30, \"Pruebas_Avanzadas\": 0.30, \"Consulta_Especialista\": 0.15,\n                         \"Planta\": 0.10, \"Quirofano\": 0.15},\n        },\n\n        \"Pruebas_Basicas\": {\n            \"Verde\":    {\"Diag_Preliminar\": 0.85, \"Pruebas_Avanzadas\": 0.15},\n            \"Amarillo\": {\"Diag_Preliminar\": 0.45, \"Pruebas_Avanzadas\": 0.55},\n            \"Naranja\":  {\"Pruebas_Avanzadas\": 0.60, \"Diag_Preliminar\": 0.40},\n            \"Rojo\":     {\"Pruebas_Avanzadas\": 0.40, \"Diag_Preliminar\": 0.60},\n        },\n\n        \"Pruebas_Avanzadas\": {t: {\"Diag_Preliminar\": 1.0} for t in TIPOS},\n\n        \"Consulta_Especialista\": {\n            \"Amarillo\": {\"Planta\": 0.60, \"Farmacia\": 0.40},\n            \"Naranja\":  {\"Diag_Preliminar\": 0.55, \"Quirofano\": 0.45},\n            \"Rojo\":     {\"Quirofano\": 0.55, \"UCI\": 0.25, \"Planta\": 0.20},\n        },\n\n        \"Diag_Preliminar\": {\n            \"Verde\":    {\"Farmacia\": 0.85, \"Obs_Verde\": 0.15},\n            \"Amarillo\": {\"Farmacia\": 0.35, \"Obs_Amarillo\": 0.55, \"Consulta_Especialista\": 0.10},\n            \"Naranja\":  {\"Planta\": 0.30, \"Obs_Naranja\": 0.35, \"Consulta_Especialista\": 0.15, \"Quirofano\": 0.20},\n            \"Rojo\":     {\"UCI\": 0.25, \"Planta\": 0.30, \"Quirofano\": 0.20, \"Obs_Rojo\": 0.15, \"Consulta_Especialista\": 0.10},\n        },\n\n        \"Quirofano\": {\n            \"Naranja\": {\"UCI\": 0.35, \"Planta\": 0.55, \"Fallece\": 0.10},\n            \"Rojo\":    {\"UCI\": 0.65, \"Planta\": 0.25, \"Fallece\": 0.10},\n        },\n\n        \"Obs_Verde\":    {\"Verde\": {\"Farmacia\": 1.0}},\n        \"Obs_Amarillo\": {\"Amarillo\": {\"Farmacia\": 0.60, \"Obs_Amarillo\": 0.25, \"Planta\": 0.15}},\n        \"Obs_Naranja\":  {\"Naranja\": {\"Farmacia\": 0.29, \"Obs_Naranja\": 0.30, \"Planta\": 0.35, \"UCI\": 0.06}},\n        \"Obs_Rojo\":     {\"Rojo\": {\"Obs_Rojo\": 0.10, \"Planta\": 0.45, \"UCI\": 0.35, \"Farmacia\": 0.10}},\n\n        \"Planta\": {\n            \"Amarillo\": {\"Farmacia\": 0.65, \"Planta\": 0.10, \"UCI\": 0.12, \"Rehabilitacion\": 0.08, \"Fallece\": 0.05},\n            \"Naranja\":  {\"Farmacia\": 0.45, \"Planta\": 0.30, \"UCI\": 0.08, \"Fallece\": 0.07, \"Rehabilitacion\": 0.10},\n            \"Rojo\":     {\"Planta\": 0.20, \"UCI\": 0.35, \"Farmacia\": 0.20, \"Fallece\": 0.15, \"Rehabilitacion\": 0.10},\n        },\n\n        \"UCI\": {\n            \"Amarillo\": {\"Planta_PostUCI\": 0.90, \"Fallece\": 0.10},\n            \"Naranja\":  {\"Planta_PostUCI\": 0.75, \"Fallece\": 0.25},\n            \"Rojo\":     {\"Planta_PostUCI\": 0.65, \"Fallece\": 0.35},\n        },\n\n        \"Planta_PostUCI\": {\n            \"Amarillo\": {\"Farmacia\": 0.80, \"Rehabilitacion\": 0.20},\n            \"Naranja\":  {\"Farmacia\": 0.55, \"Rehabilitacion\": 0.45},\n            \"Rojo\":     {\"Farmacia\": 0.45, \"Rehabilitacion\": 0.55},\n        },\n\n        \"Rehabilitacion\": {t: {\"Farmacia\": 1.0} for t in (\"Amarillo\", \"Naranja\", \"Rojo\")},\n\n        \"Farmacia\": {t: {\"Alta\": 1.0} for t in TIPOS},\n    }\n\n    cfg.COSTES_FIJOS = {}   # el protocolo actual no tiene coste fijo adicional\n    return cfg\n\n\ndef construir_config_ia():\n    cfg = construir_config_base()\n    cfg.nombre = \"Escenario A - IA Diagnóstica\"\n    cfg.clave = \"ia\"\n\n    # 1) Tiempos de servicio: la IA acelera el diagnóstico inicial y preliminar\n    cfg.TIEMPOS_SERVICIO = copy.deepcopy(cfg.TIEMPOS_SERVICIO)\n    for tipo in cfg.TIEMPOS_SERVICIO[\"Diag_Inicial\"]:\n        cfg.TIEMPOS_SERVICIO[\"Diag_Inicial\"][tipo] *= 0.70\n    for tipo in cfg.TIEMPOS_SERVICIO[\"Diag_Preliminar\"]:\n        cfg.TIEMPOS_SERVICIO[\"Diag_Preliminar\"][tipo] *= 0.75\n\n    # 2) Derivaciones: menos necesidad de Pruebas Avanzadas (mejor precisión inicial).\n    #    \"Rojo\" no se modifica: protocolo diagnóstico completo siempre en emergencia vital.\n    cfg.PROB_DERIVACION = copy.deepcopy(cfg.PROB_DERIVACION)\n    cfg.PROB_DERIVACION[\"Diag_Inicial\"][\"Verde\"] = {\n        \"Farmacia\": 0.35, \"Pruebas_Basicas\": 0.55, \"Pruebas_Avanzadas\": 0.10,\n    }\n    cfg.PROB_DERIVACION[\"Diag_Inicial\"][\"Amarillo\"] = {\n        \"Farmacia\": 0.15, \"Pruebas_Basicas\": 0.60, \"Pruebas_Avanzadas\": 0.25,\n    }\n    cfg.PROB_DERIVACION[\"Diag_Inicial\"][\"Naranja\"] = {\n        \"Pruebas_Basicas\": 0.45, \"Pruebas_Avanzadas\": 0.32, \"Consulta_Especialista\": 0.23,\n    }\n\n    # 3) Coste del escenario\n    cfg.COSTES_FIJOS = {\"licencia_ia_anual\": 480_000}\n    return cfg\n\n\ndef construir_config_fasttrack():\n    cfg = construir_config_base()\n    cfg.nombre = \"Escenario B - Circuito Rápido (Fast-Track)\"\n    cfg.clave = \"ft\"\n\n    # 1) Nuevo recurso: equipo médico del circuito rápido\n    cfg.SERVIDORES_CAPACIDAD = copy.deepcopy(cfg.SERVIDORES_CAPACIDAD)\n    cfg.SERVIDORES_CAPACIDAD[\"Medicos_Rapidos\"] = 3\n\n    # 2) Nueva estación Diag_Rapido y su tiempo de servicio\n    cfg.TIEMPOS_SERVICIO = copy.deepcopy(cfg.TIEMPOS_SERVICIO)\n    cfg.TIEMPOS_SERVICIO[\"Diag_Rapido\"] = {\"Verde\": 6/60, \"Amarillo\": 8/60}\n\n    # 3) Diag_Rapido usa su propio equipo (Medicos_Rapidos), independiente\n    #    de la bolsa \"Medicos\" que atiende Diag_Inicial/Diag_Preliminar.\n    cfg.POOL_ESTACION = copy.deepcopy(cfg.POOL_ESTACION)\n    cfg.POOL_ESTACION[\"Diag_Rapido\"] = \"Medicos_Rapidos\"\n\n    # 4) Derivaciones: Triaje deriva una fracción de Verde/Amarillo al circuito\n    #    rápido; Naranja/Rojo no cambian.\n    cfg.PROB_DERIVACION = copy.deepcopy(cfg.PROB_DERIVACION)\n    cfg.PROB_DERIVACION[\"Triaje\"] = {\n        \"Verde\":    {\"Aislamiento\": 0.05, \"Diag_Rapido\": 0.70, \"Diag_Inicial\": 0.25},\n        \"Amarillo\": {\"Aislamiento\": 0.10, \"Diag_Rapido\": 0.30, \"Diag_Inicial\": 0.60},\n        \"Naranja\":  {\"Aislamiento\": 0.12, \"Diag_Inicial\": 0.88},\n        \"Rojo\":     {\"Diag_Inicial\": 1.0},\n    }\n    cfg.PROB_DERIVACION[\"Diag_Rapido\"] = {\n        \"Verde\":    {\"Farmacia\": 0.75, \"Pruebas_Basicas\": 0.25},\n        \"Amarillo\": {\"Farmacia\": 0.45, \"Pruebas_Basicas\": 0.50, \"Diag_Inicial\": 0.05},\n    }\n\n    # 5) Coste del escenario\n    cfg.COSTES_FIJOS = {\"personal_fasttrack_anual\": 310_000}\n    return cfg\n\n\ndef construir_config_bedpool():\n    cfg = construir_config_base()\n    cfg.nombre = \"Escenario C - Gestión Dinámica de Camas UCI\"\n    cfg.clave = \"bp\"\n    cfg.UCI_MODE = \"pooled\"   # único cambio real: pool único con prioridad por gravedad\n    # cfg.UCI_TOTAL_CAPACIDAD se mantiene IGUAL que en la línea base (79 camas):\n    # no se añade ninguna cama nueva, sólo se reorganiza su gestión.\n    cfg.COSTES_FIJOS = {\"reorganizacion_unica\": 45_000}   # coste único, no anual\n    return cfg\n\n\nESCENARIOS = {\n    \"base\": construir_config_base,\n    \"ia\": construir_config_ia,\n    \"ft\": construir_config_fasttrack,\n    \"bp\": construir_config_bedpool,\n}\n\nNOMBRES_ESCENARIOS = {\n    \"base\": \"Línea Base\",\n    \"ia\": \"Escenario A · IA Diagnóstica\",\n    \"ft\": \"Escenario B · Fast-Track\",\n    \"bp\": \"Escenario C · Bed-Pool UCI\",\n}\n\n\ndef construir_cfg(escenario_clave, overrides=None):\n    \"\"\"Construye la configuración de `escenario_clave` ('base'/'ia'/'ft'/'bp')\n    y le aplica `overrides` (dict plano, p.ej. {'SERVIDORES_CAPACIDAD.Admision':\n    4, 'CAMAS_CAPACIDAD.Planta': 130, 'BOX_CAPACIDAD': 60,\n    'LIMITE_ESPERA_UCI': 10.0, 'UCI_ROJO_CAPACIDAD': 50,\n    'UCI_TOTAL_CAPACIDAD': 85} — este último sólo tiene efecto con\n    UCI_MODE='pooled', p.ej. en el Escenario C). Usada tanto por la app\n    (panel \"Parámetros del sistema\") como por el caché de Streamlit, que\n    necesita argumentos hashables en vez del objeto `Config` entero.\"\"\"\n    cfg = ESCENARIOS[escenario_clave]()\n    if not overrides:\n        return cfg\n    for clave, valor in overrides.items():\n        if clave.startswith(\"SERVIDORES_CAPACIDAD.\"):\n            nombre = clave.split(\".\", 1)[1]\n            if nombre in cfg.SERVIDORES_CAPACIDAD:\n                cfg.SERVIDORES_CAPACIDAD[nombre] = valor\n        elif clave.startswith(\"CAMAS_CAPACIDAD.\"):\n            nombre = clave.split(\".\", 1)[1]\n            if nombre in cfg.CAMAS_CAPACIDAD:\n                cfg.CAMAS_CAPACIDAD[nombre] = valor\n        elif clave == \"BOX_CAPACIDAD\":\n            cfg.BOX_CAPACIDAD = valor\n        elif clave == \"LIMITE_ESPERA_UCI\":\n            cfg.LIMITE_ESPERA_UCI = valor\n        elif clave == \"UCI_ROJO_CAPACIDAD\":\n            cfg.UCI_ROJO_CAPACIDAD = valor\n        elif clave == \"UCI_NARANJA_CAPACIDAD\":\n            cfg.UCI_NARANJA_CAPACIDAD = valor\n        elif clave == \"UCI_BASE_CAPACIDAD\":\n            cfg.UCI_BASE_CAPACIDAD = valor\n        elif clave == \"UCI_TOTAL_CAPACIDAD\":\n            cfg.UCI_TOTAL_CAPACIDAD = valor\n    if cfg.UCI_MODE != \"pooled\":\n        # Las 3 bolsas particionadas determinan la capacidad total; se\n        # recalcula por si se ha tocado alguna de ellas arriba.\n        cfg.UCI_TOTAL_CAPACIDAD = cfg.UCI_ROJO_CAPACIDAD + cfg.UCI_NARANJA_CAPACIDAD + cfg.UCI_BASE_CAPACIDAD\n    return cfg\n",
  "kpis.py": "# -*- coding: utf-8 -*-\n\"\"\"\nCálculo de KPIs (operativos, de recursos, clínicos, económicos, SLA) sobre\nuna traza de `sim_engine.simular()`, fiel a las Secciones A.07/A.08 del\ncuaderno original de Javier Morales.\n\nEsta es una traducción directa, estación por estación y fórmula por\nfórmula, de `kpis4.js` — el módulo de KPIs ya usado (y verificado con\nPlaywright) en el Artifact HTML/JS de este mismo proyecto — para que los\nnúmeros del informe Monte Carlo de la app Streamlit sean consistentes con\nlos del simulador animado. Devuelve un diccionario PLANO {clave: valor}\npara que la agregación Monte Carlo (media ± IC95% entre réplicas) sea\ntrivial.\n\"\"\"\n\nimport numpy as np\nimport pandas as pd\n\nTIPOS = [\"Verde\", \"Amarillo\", \"Naranja\", \"Rojo\"]\n\nBED_ESTACIONES = {\"Planta\", \"Quirofano\", \"Rehabilitacion\", \"Planta_PostUCI\"}\nTARIFA_ALTA = {\"Verde\": 420, \"Amarillo\": 1250, \"Naranja\": 6100, \"Rojo\": 15200}\nCOSTE_SERVICIO = {\"Pruebas_Basicas\": 40, \"Pruebas_Avanzadas\": 220, \"Consulta_Especialista\": 95}\nCOSTE_QUIROFANO_INTERVENCION = 3500\nCOSTE_DIA = {\"Planta\": 550, \"Planta_PostUCI\": 550, \"UCI\": 2100, \"Rehabilitacion\": 380}\nPENALIZACION_FALLECIMIENTO = 3000\nPENALIZACION_SIN_UCI_EXTRA = 10000\n\n\ndef margen_objetivo(tasa_alta):\n    if tasa_alta > 0.90:\n        return 0.15\n    if tasa_alta > 0.80:\n        return 0.10\n    if tasa_alta > 0.75:\n        return 0.075\n    return 0.05\n\n\ndef timeline_ocupacion(intervalos, capacidad, horizon_horas, umbral):\n    \"\"\"Integra una lista de intervalos [t0,t1] (ocupación +1 cada uno) con un\n    barrido de línea, devolviendo (media, pct_sobre_umbral) de nivel/capacidad\n    a lo largo de [0, horizon_horas].\"\"\"\n    if not intervalos or capacidad <= 0:\n        return 0.0, 0.0\n    eventos = []\n    for a, b in intervalos:\n        t0, t1 = max(0.0, a), min(horizon_horas, b)\n        if t1 > t0:\n            eventos.append((t0, 1))\n            eventos.append((t1, -1))\n    eventos.sort(key=lambda e: e[0])\n    nivel, t_prev, acum_media, acum_sobre = 0, 0.0, 0.0, 0.0\n    for t, delta in eventos:\n        dt = t - t_prev\n        if dt > 0:\n            acum_media += (nivel / capacidad) * dt\n            if nivel / capacidad > umbral:\n                acum_sobre += dt\n        nivel += delta\n        t_prev = t\n    if horizon_horas > t_prev:\n        acum_media += (nivel / capacidad) * (horizon_horas - t_prev)\n    return acum_media / horizon_horas, 100 * acum_sobre / horizon_horas\n\n\ndef _door_to_doctor(terminados_filas, tipos_por_pac):\n    minutos = []\n    for pid, filas in terminados_filas.items():\n        if tipos_por_pac[pid] not in (\"Naranja\", \"Rojo\"):\n            continue\n        adm = filas[filas[\"Station_in\"] == \"Admision\"]\n        di = filas[filas[\"Station_in\"] == \"Diag_Inicial\"]\n        if len(adm) and len(di):\n            adm0 = adm.iloc[0]\n            di0 = di.iloc[0]\n            contacto = di0[\"T_in\"] + di0[\"T_wait\"]\n            minutos.append((contacto - adm0[\"T_in\"]) * 60)\n    return minutos\n\n\ndef _derivacion_uci(terminados_filas):\n    desde_urgencias, desde_planta = 0, 0\n    for pid, filas in terminados_filas.items():\n        idx_uci = filas.index[filas[\"Station_in\"] == \"UCI\"]\n        if len(idx_uci) == 0:\n            continue\n        pos = filas.index.get_loc(idx_uci[0])\n        if pos > 0:\n            previa = filas.iloc[pos - 1]\n            if previa[\"Station_in\"] in (\"Planta\", \"Planta_PostUCI\"):\n                desde_planta += 1\n            else:\n                desde_urgencias += 1\n        else:\n            desde_urgencias += 1\n    return desde_urgencias, desde_planta\n\n\ndef calcular_kpis(df, cfg, horizon_horas):\n    k = {}\n\n    if df is None or len(df) == 0:\n        # Traza vacía (ventana demasiado corta / sin llegadas): KPIs a cero.\n        return _kpis_vacios(cfg)\n\n    df = df.reset_index(drop=True)\n\n    # --- Agrupar filas por paciente, ordenadas por T_in ------------------\n    df_sorted = df.sort_values([\"Id_pat\", \"T_in\"], kind=\"mergesort\").reset_index(drop=True)\n    por_paciente = {pid: g for pid, g in df_sorted.groupby(\"Id_pat\", sort=False)}\n\n    terminados_filas = {}\n    tipo_por_pac = {}\n    desenlace_por_pac = {}\n    for pid, filas in por_paciente.items():\n        ultima = filas.iloc[-1]\n        tipo_por_pac[pid] = filas.iloc[0][\"Pat_type\"]\n        if ultima[\"Station_out\"] in (\"Alta\", \"Fallece\"):\n            terminados_filas[pid] = filas\n            desenlace_por_pac[pid] = ultima[\"Station_out\"]\n\n    k[\"n_pacientes_terminados\"] = len(terminados_filas)\n    k[\"n_pacientes_totales_vistos\"] = len(por_paciente)\n    n_term = len(terminados_filas)\n\n    if n_term == 0:\n        base = _kpis_vacios(cfg)\n        base.update(k)\n        return base\n\n    # DataFrame con sólo las filas de pacientes terminados (todas sus estaciones)\n    df_term = df_sorted[df_sorted[\"Id_pat\"].isin(terminados_filas.keys())].copy()\n    df_term[\"tipo_pac\"] = df_term[\"Id_pat\"].map(tipo_por_pac)\n    df_term[\"desenlace_pac\"] = df_term[\"Id_pat\"].map(desenlace_por_pac)\n\n    # ---------------- A) KPIs operativos y temporales ---------------------\n    sTsysG = df_term[\"T_system\"].sum()\n    sTqG = df_term[\"T_wait\"].sum()\n    nG = n_term\n    k[\"oper.Tsys_h.global\"] = sTsysG / nG if nG else 0.0\n    k[\"oper.Tser_h.global\"] = df_term[\"T_server\"].sum() / nG if nG else 0.0\n    k[\"oper.Tq_h.global\"] = sTqG / nG if nG else 0.0\n    k[\"oper.ratioEspera_pct.global\"] = 100 * sTqG / sTsysG if sTsysG > 0 else 0.0\n\n    for t in TIPOS:\n        sub = df_term[df_term[\"tipo_pac\"] == t]\n        n_t = sub[\"Id_pat\"].nunique()\n        tsys_t = sub[\"T_system\"].sum()\n        tq_t = sub[\"T_wait\"].sum()\n        k[f\"oper.Tsys_h.{t}\"] = tsys_t / n_t if n_t else 0.0\n        k[f\"oper.Tq_h.{t}\"] = tq_t / n_t if n_t else 0.0\n        k[f\"oper.ratioEspera_pct.{t}\"] = 100 * tq_t / tsys_t if tsys_t > 0 else 0.0\n\n    # Carga/espera total por estación (sobre TODO el df, no sólo terminados)\n    por_estacion = df_sorted.groupby(\"Station_in\").agg(\n        carga=(\"T_server\", \"sum\"), espera=(\"T_wait\", \"sum\"), visitas=(\"Station_in\", \"size\"),\n    )\n    k[\"_porEstacion\"] = {\n        idx: {\"carga\": row[\"carga\"], \"espera\": row[\"espera\"], \"visitas\": int(row[\"visitas\"])}\n        for idx, row in por_estacion.iterrows()\n    }\n\n    # ---------------- B) KPIs de recursos ----------------------------------\n    servidor_busy = df_sorted[df_sorted[\"ID_server\"].isin(cfg.SERVIDORES_CAPACIDAD.keys())] \\\n        .groupby(\"ID_server\")[\"T_server\"].sum()\n    rho_claves_saturacion = []\n    for nombre, cap in cfg.SERVIDORES_CAPACIDAD.items():\n        val = servidor_busy.get(nombre, 0.0) / (horizon_horas * cap) if cap else 0.0\n        k[f\"rec.rho.{nombre}\"] = val\n        rho_claves_saturacion.append(f\"rec.rho.{nombre}\")\n\n    espera_por_recurso = df_sorted.groupby(\"ID_server\")[\"T_wait\"].sum()\n    for nombre in cfg.SERVIDORES_CAPACIDAD:\n        k[f\"rec.Lq.{nombre}\"] = espera_por_recurso.get(nombre, 0.0) / horizon_horas\n    k[\"rec.Lq.UCI\"] = espera_por_recurso.get(\"UCI\", 0.0) / horizon_horas\n    for nombre in cfg.CAMAS_CAPACIDAD:\n        k[f\"rec.Lq.{nombre}\"] = espera_por_recurso.get(nombre, 0.0) / horizon_horas\n\n    ocup_por_sala = df_sorted.groupby(\"Wait_room\")[\"T_system\"].sum()\n    k[\"rec.rho.Box\"] = ocup_por_sala.get(\"Box_Urgencias\", 0.0) / (horizon_horas * cfg.BOX_CAPACIDAD)\n    rho_claves_saturacion.append(\"rec.rho.Box\")\n    for nombre, cap in cfg.CAMAS_CAPACIDAD.items():\n        k[f\"rec.rhoFisico.{nombre}\"] = ocup_por_sala.get(nombre, 0.0) / (horizon_horas * cap)\n    k[\"rec.rhoFisico.UCI\"] = ocup_por_sala.get(\"UCI\", 0.0) / (horizon_horas * cfg.UCI_TOTAL_CAPACIDAD)\n\n    # Bed-blocking: al entrar en una estación de cama/UCI con T_wait>0, si la\n    # fila anterior del mismo paciente ya ocupaba una cama/UCI, ese tiempo de\n    # espera bloquea el recurso FÍSICO anterior (Wait_room de la fila previa).\n    df_bb = df_sorted.copy()\n    df_bb[\"prev_Wait_room\"] = df_bb.groupby(\"Id_pat\", sort=False)[\"Wait_room\"].shift(1)\n    es_cama_actual = df_bb[\"Station_in\"].isin(BED_ESTACIONES) | (df_bb[\"Station_in\"] == \"UCI\")\n    camas_fisicas = set(cfg.CAMAS_CAPACIDAD.keys())\n    sala_prev_era_cama = (\n        (df_bb[\"prev_Wait_room\"] != \"Box_Urgencias\")\n        & df_bb[\"prev_Wait_room\"].notna()\n        & (\n            df_bb[\"prev_Wait_room\"].isin(BED_ESTACIONES)\n            | (df_bb[\"prev_Wait_room\"] == \"UCI\")\n            | df_bb[\"prev_Wait_room\"].isin(camas_fisicas)\n        )\n    )\n    mask_bb = es_cama_actual & (df_bb[\"T_wait\"] > 0) & sala_prev_era_cama\n    bed_blocking = df_bb.loc[mask_bb].groupby(\"prev_Wait_room\")[\"T_wait\"].sum().to_dict()\n    k[\"_bedBlocking\"] = bed_blocking\n    k[\"rec.bedBlocking_h.total\"] = float(sum(bed_blocking.values())) if bed_blocking else 0.0\n\n    n_saturados = sum(1 for key in rho_claves_saturacion if k[key] >= 1)\n    n_alta_congestion = sum(1 for key in rho_claves_saturacion if 0.85 <= k[key] < 1)\n    k[\"rec.n_recursos_saturados\"] = n_saturados\n    k[\"rec.n_recursos_alta_congestion\"] = n_alta_congestion\n\n    # ---------------- C) KPIs clínicos --------------------------------------\n    altas = (df_term.groupby(\"Id_pat\")[\"desenlace_pac\"].first() == \"Alta\").sum()\n    fallece = (df_term.groupby(\"Id_pat\")[\"desenlace_pac\"].first() == \"Fallece\").sum()\n    k[\"clin.tasaAltas_pct.global\"] = 100 * altas / n_term\n    k[\"clin.mortalidad_pct.global\"] = 100 * fallece / n_term\n    for t in TIPOS:\n        ids_t = [pid for pid, tp in tipo_por_pac.items() if tp == t and pid in terminados_filas]\n        n_t = len(ids_t)\n        n_fallece_t = sum(1 for pid in ids_t if desenlace_por_pac[pid] == \"Fallece\")\n        k[f\"clin.mortalidad_pct.{t}\"] = 100 * n_fallece_t / n_t if n_t else 0.0\n\n    sin_uci_rows = df_sorted[df_sorted[\"ID_server\"] == \"Sin_UCI_Disponible\"]\n    naranja_rojo_term = sum(1 for pid, tp in tipo_por_pac.items()\n                             if pid in terminados_filas and tp in (\"Naranja\", \"Rojo\"))\n    k[\"clin.sinUCI_pct.global\"] = 100 * len(sin_uci_rows) / n_term\n    k[\"clin.sinUCI_pct.naranjaRojo\"] = 100 * len(sin_uci_rows) / naranja_rojo_term if naranja_rojo_term else 0.0\n\n    estaciones_hosp = {\"Planta\", \"Quirofano\", \"UCI\", \"Planta_PostUCI\"}\n    hospitalizados_ids = set(df_term.loc[df_term[\"Station_in\"].isin(estaciones_hosp), \"Id_pat\"].unique())\n    k[\"clin.tasaHospitalizacion_pct\"] = 100 * len(hospitalizados_ids) / n_term\n\n    desde_urg, desde_planta = _derivacion_uci(terminados_filas)\n    k[\"clin.derivacionUCI_pct.desdeUrgencias\"] = 100 * desde_urg / n_term\n    k[\"clin.derivacionUCI_pct.desdePlanta\"] = 100 * desde_planta / n_term\n\n    # ---------------- D) KPIs económicos ------------------------------------\n    ingresos = sum(TARIFA_ALTA[tipo_por_pac[pid]] for pid, d in desenlace_por_pac.items() if d == \"Alta\")\n\n    coste_servicio_mask = df_sorted[\"Station_in\"].isin(COSTE_SERVICIO.keys())\n    coste_servicio_total = sum(\n        COSTE_SERVICIO[est] * cnt\n        for est, cnt in df_sorted.loc[coste_servicio_mask, \"Station_in\"].value_counts().items()\n    )\n    n_quirofano = int((df_sorted[\"Station_in\"] == \"Quirofano\").sum())\n    coste_quirofano_total = n_quirofano * COSTE_QUIROFANO_INTERVENCION\n    coste_dia_total = 0.0\n    for est, tarifa_dia in COSTE_DIA.items():\n        coste_dia_total += tarifa_dia * (df_sorted.loc[df_sorted[\"Station_in\"] == est, \"T_server\"].sum() / 24)\n    coste_variable = coste_servicio_total + coste_quirofano_total + coste_dia_total\n\n    n_fallecidos_total = int(fallece)\n    coste_penalizacion = n_fallecidos_total * PENALIZACION_FALLECIMIENTO + len(sin_uci_rows) * PENALIZACION_SIN_UCI_EXTRA\n\n    coste_fijo = 0.0\n    for clave, valor in (cfg.COSTES_FIJOS or {}).items():\n        coste_fijo += valor * (horizon_horas / (365 * 24)) if clave.endswith(\"_anual\") else valor\n\n    coste_total = coste_variable + coste_penalizacion + coste_fijo\n    k[\"econ.ingresos\"] = float(ingresos)\n    k[\"econ.costeVariable\"] = float(coste_variable)\n    k[\"econ.costePenalizacion\"] = float(coste_penalizacion)\n    k[\"econ.costeFijo\"] = float(coste_fijo)\n    k[\"econ.costeTotal\"] = float(coste_total)\n    k[\"econ.costeMedioPorPaciente\"] = coste_total / n_term if n_term else 0.0\n    k[\"econ.margen_pct\"] = 100 * (ingresos - coste_total) / ingresos if ingresos > 0 else 0.0\n    k[\"econ.margenObjetivo_pct\"] = 100 * margen_objetivo(altas / max(1, n_term))\n    k[\"econ.cumpleMargenObjetivo\"] = 1 if k[\"econ.margen_pct\"] >= k[\"econ.margenObjetivo_pct\"] else 0\n\n    # ---------------- E) SLAs (Sección A.08) --------------------------------\n    door_to_doctor_min = sorted(_door_to_doctor(terminados_filas, tipo_por_pac))\n\n    def media(arr):\n        return float(np.mean(arr)) if len(arr) else 0.0\n\n    def pctl(arr, p):\n        return float(arr[min(len(arr) - 1, int(np.floor(p * len(arr))))]) if len(arr) else 0.0\n\n    k[\"sla.doorToDoctor_min.media\"] = media(door_to_doctor_min)\n    k[\"sla.doorToDoctor_min.p90\"] = pctl(door_to_doctor_min, 0.90)\n    k[\"sla.doorToDoctor_pctCumple\"] = (\n        100 * sum(1 for v in door_to_doctor_min if v <= 15) / len(door_to_doctor_min)\n        if door_to_doctor_min else 0.0\n    )\n\n    ratios_va = []\n    for t in (\"Verde\", \"Amarillo\"):\n        sub = df_term[df_term[\"tipo_pac\"] == t].groupby(\"Id_pat\").agg(\n            tsys=(\"T_system\", \"sum\"), tq=(\"T_wait\", \"sum\"))\n        sub = sub[sub[\"tsys\"] > 0]\n        ratios_va.extend((100 * sub[\"tq\"] / sub[\"tsys\"]).tolist())\n    k[\"sla.ratioEsperaVA_pct.media\"] = media(ratios_va)\n    k[\"sla.ratioEsperaVA_cumple\"] = 1 if k[\"sla.ratioEsperaVA_pct.media\"] < 25 else 0\n\n    uci_rows = df_sorted[(df_sorted[\"Station_in\"] == \"UCI\") & (df_sorted[\"ID_server\"] == \"UCI\")]\n    intervalos_uci = list(zip(\n        uci_rows[\"T_in\"] + uci_rows[\"T_wait\"],\n        uci_rows[\"T_in\"] + uci_rows[\"T_wait\"] + uci_rows[\"T_server\"],\n    ))\n    media_uci, pct_sobre = timeline_ocupacion(intervalos_uci, cfg.UCI_TOTAL_CAPACIDAD, horizon_horas, 0.90)\n    k[\"sla.ocupacionUCI_pct.media\"] = 100 * media_uci\n    k[\"sla.ocupacionUCI_pctTiempoSobre90\"] = pct_sobre\n    k[\"sla.ocupacionUCI_cumple\"] = 1 if pct_sobre < 100 and media_uci < 0.90 else 0\n\n    k[\"sla.mortalidadEvitable_cumple\"] = 1 if k[\"clin.sinUCI_pct.naranjaRojo\"] < 2 else 0\n\n    return k\n\n\n# Claves numéricas que debe llevar siempre el diccionario (incluso con traza\n# vacía), para que la agregación Monte Carlo nunca falle por clave ausente.\n_CLAVES_NUMERICAS_FIJAS = [\n    \"n_pacientes_terminados\", \"n_pacientes_totales_vistos\",\n    \"oper.Tsys_h.global\", \"oper.Tser_h.global\", \"oper.Tq_h.global\", \"oper.ratioEspera_pct.global\",\n    *(f\"oper.{campo}.{t}\" for campo in (\"Tsys_h\", \"Tq_h\", \"ratioEspera_pct\") for t in TIPOS),\n    \"clin.tasaAltas_pct.global\", \"clin.mortalidad_pct.global\",\n    *(f\"clin.mortalidad_pct.{t}\" for t in TIPOS),\n    \"clin.sinUCI_pct.global\", \"clin.sinUCI_pct.naranjaRojo\", \"clin.tasaHospitalizacion_pct\",\n    \"clin.derivacionUCI_pct.desdeUrgencias\", \"clin.derivacionUCI_pct.desdePlanta\",\n    \"econ.ingresos\", \"econ.costeVariable\", \"econ.costePenalizacion\", \"econ.costeFijo\",\n    \"econ.costeTotal\", \"econ.costeMedioPorPaciente\", \"econ.margen_pct\", \"econ.margenObjetivo_pct\",\n    \"econ.cumpleMargenObjetivo\",\n    \"sla.doorToDoctor_min.media\", \"sla.doorToDoctor_min.p90\", \"sla.doorToDoctor_pctCumple\",\n    \"sla.ratioEsperaVA_pct.media\", \"sla.ratioEsperaVA_cumple\",\n    \"sla.ocupacionUCI_pct.media\", \"sla.ocupacionUCI_pctTiempoSobre90\", \"sla.ocupacionUCI_cumple\",\n    \"sla.mortalidadEvitable_cumple\",\n    \"rec.n_recursos_saturados\", \"rec.n_recursos_alta_congestion\", \"rec.bedBlocking_h.total\",\n    \"rec.rho.Box\", \"rec.Lq.UCI\", \"rec.rhoFisico.UCI\",\n]\n\n\ndef _kpis_vacios(cfg):\n    \"\"\"Diccionario de KPIs a cero (ventana demasiado corta / sin llegadas),\n    incluyendo las claves dinámicas por recurso del escenario `cfg`, para que\n    la agregación Monte Carlo nunca falle por una clave ausente en alguna\n    réplica.\"\"\"\n    base = {k_: 0.0 for k_ in _CLAVES_NUMERICAS_FIJAS}\n    for nombre in cfg.SERVIDORES_CAPACIDAD:\n        base[f\"rec.rho.{nombre}\"] = 0.0\n        base[f\"rec.Lq.{nombre}\"] = 0.0\n    for nombre in cfg.CAMAS_CAPACIDAD:\n        base[f\"rec.Lq.{nombre}\"] = 0.0\n        base[f\"rec.rhoFisico.{nombre}\"] = 0.0\n    return base\n",
  "montecarlo.py": "# -*- coding: utf-8 -*-\n\"\"\"\nEjecuta N réplicas de un escenario y agrega los KPIs (media, desviación\ntípica, IC95%) entre réplicas. Descarta la traza de cada réplica tras\ncalcular sus KPIs (no se acumula en memoria), igual que `montecarlo4.js`\nen el Artifact HTML/JS de este mismo proyecto.\n\"\"\"\n\nimport math\n\nimport sim_engine\nfrom kpis import calcular_kpis\n\n\ndef agregar_muestras(muestras):\n    out = {}\n    n = len(muestras)\n    claves = [k for k, v in muestras[0].items() if isinstance(v, (int, float)) and not k.startswith(\"_\")]\n    for key in claves:\n        vals = [m.get(key, 0.0) for m in muestras]\n        mean = sum(vals) / n\n        variance = sum((v - mean) ** 2 for v in vals) / (n - 1) if n > 1 else 0.0\n        sd = math.sqrt(variance)\n        ci95 = 1.96 * sd / math.sqrt(n) if n > 1 else 0.0\n        out[key] = {\"media\": mean, \"sd\": sd, \"ci95\": ci95, \"n\": n}\n    # Conserva el detalle crudo (por estación / bed-blocking) sólo de la\n    # ÚLTIMA réplica, a título ilustrativo.\n    out[\"_ultima_replica_detalle\"] = {\n        \"porEstacion\": muestras[-1].get(\"_porEstacion\", {}),\n        \"bedBlocking\": muestras[-1].get(\"_bedBlocking\", {}),\n    }\n    return out\n\n\ndef ejecutar_monte_carlo(cfg, replicas=20, dias=90, seed_base=1000, on_progress=None):\n    \"\"\"Ejecuta `replicas` simulaciones independientes de `dias` días cada una\n    y agrega sus KPIs. `on_progress(i, replicas)` se llama tras cada réplica\n    (para una barra de progreso en Streamlit).\"\"\"\n    muestras = []\n    for i in range(replicas):\n        seed = seed_base + i * 97 + 1\n        df = sim_engine.simular(cfg, dias, seed)\n        muestras.append(calcular_kpis(df, cfg, dias * 24))\n        if on_progress:\n            on_progress(i + 1, replicas)\n    return agregar_muestras(muestras)\n",
  "diagram.py": "# -*- coding: utf-8 -*-\n\"\"\"\nDiagrama de red (Graphviz/DOT) y reconstrucción de \"foto\" instantánea del\nhospital a partir de una traza ya simulada, para la vista de estaciones de\nla app Streamlit.\n\nEsto es una reinterpretación para Streamlit del diagrama animado del\nArtifact HTML/JS de este mismo proyecto, no una réplica pixel a pixel: en\nvez de reproducir fotograma a fotograma (natural en una página que anima\npor sí sola), aquí se reconstruye la \"foto\" del hospital en el instante\n`t` elegido con un deslizador directamente a partir de la traza ya\nsimulada (quién tiene T_in<=t<T_out en cada fila), y Graphviz la redibuja\ncada vez que cambia el deslizador o la estación seleccionada.\n\"\"\"\n\nSTATION_LABELS = {\n    \"Admision\": \"Admisión\",\n    \"Triaje\": \"Triaje\",\n    \"Aislamiento\": \"Aislamiento\",\n    \"Diag_Inicial\": \"Diag. Inicial\",\n    \"Diag_Rapido\": \"Diag. Rápido\",\n    \"Pruebas_Basicas\": \"Pruebas Básicas\",\n    \"Diag_Preliminar\": \"Diag. Preliminar\",\n    \"Pruebas_Avanzadas\": \"Pruebas Avanzadas\",\n    \"Consulta_Especialista\": \"Consulta Esp.\",\n    \"Sala_Espera_Urgencias\": \"Sala de espera\",\n    \"Obs_Verde\": \"Obs. Verde\",\n    \"Obs_Amarillo\": \"Obs. Amarillo\",\n    \"Obs_Naranja\": \"Obs. Naranja\",\n    \"Obs_Rojo\": \"Obs. Rojo\",\n    \"Box_Urgencias\": \"Box urgencias\",\n    \"Planta\": \"Planta\",\n    \"Quirofano\": \"Quirófano\",\n    \"UCI\": \"UCI\",\n    \"Rehabilitacion\": \"Rehabilitación\",\n    \"Farmacia\": \"Farmacia\",\n    \"Alta\": \"Alta médica\",\n    \"Fallece\": \"Fallecimiento\",\n}\n\n# Mismos 5 bloques clínicos (y mismo orden de estaciones dentro de cada uno)\n# que el Artifact HTML/JS de este proyecto.\nGRUPOS = [\n    {\n        \"id\": \"entrada\", \"titulo\": \"Admisión, triaje y primer filtro clínico\",\n        \"color\": \"#dbeafe\",\n        \"items\": [\"Admision\", \"Triaje\", \"Aislamiento\", \"Diag_Inicial\", \"Diag_Rapido\"],\n    },\n    {\n        \"id\": \"diagnostico\", \"titulo\": \"Diagnóstico y pruebas complementarias\",\n        \"color\": \"#ede9fe\",\n        \"items\": [\"Pruebas_Basicas\", \"Diag_Preliminar\", \"Pruebas_Avanzadas\", \"Consulta_Especialista\"],\n    },\n    {\n        \"id\": \"urgencias\", \"titulo\": \"Espera y observación en Urgencias\",\n        \"color\": \"#cffafe\",\n        \"items\": [\"Sala_Espera_Urgencias\", \"Obs_Verde\", \"Obs_Amarillo\", \"Obs_Naranja\", \"Obs_Rojo\", \"Box_Urgencias\"],\n    },\n    {\n        \"id\": \"hospitalizacion\", \"titulo\": \"Hospitalización y cuidados críticos\",\n        \"color\": \"#fce7f3\",\n        \"items\": [\"Planta\", \"Quirofano\", \"UCI\"],\n    },\n    {\n        \"id\": \"salida\", \"titulo\": \"Recuperación y salida\",\n        \"color\": \"#fef3c7\",\n        \"items\": [\"Rehabilitacion\", \"Farmacia\", \"Alta\", \"Fallece\"],\n    },\n]\n\nSALAS_ESPERA = {\"Sala_Espera_Urgencias\", \"Box_Urgencias\"}\nOBS_IDS = {\"Obs_Verde\", \"Obs_Amarillo\", \"Obs_Naranja\", \"Obs_Rojo\"}\nNODOS_BIG = {\"Alta\", \"Fallece\"}\n\n\ndef estaciones_activas(cfg):\n    \"\"\"Devuelve el conjunto de ids de estación presentes en este escenario\n    concreto (p.ej. Diag_Rapido sólo existe en Fast-Track).\"\"\"\n    activas = set()\n    for g in GRUPOS:\n        for item in g[\"items\"]:\n            if item in (\"Alta\", \"Fallece\", \"Sala_Espera_Urgencias\", \"Box_Urgencias\"):\n                activas.add(item)\n                continue\n            if item in cfg.SERVIDORES_CAPACIDAD or item in cfg.CAMAS_CAPACIDAD or item in cfg.PROB_DERIVACION \\\n                    or item in OBS_IDS:\n                activas.add(item)\n    return activas\n\n\ndef capacidad_de(cfg, estacion):\n    \"\"\"(tipo, capacidad) de una estación: 'servidor'/'cama'/'uci'/'box'/None\n    (None = sin capacidad limitada en el modelo, p.ej. estaciones Obs_*).\"\"\"\n    pool = cfg.POOL_ESTACION.get(estacion, estacion)\n    if pool in cfg.SERVIDORES_CAPACIDAD:\n        return \"servidor\", cfg.SERVIDORES_CAPACIDAD[pool]\n    alias = cfg.CAMA_ALIAS.get(estacion, estacion)\n    if alias in cfg.CAMAS_CAPACIDAD:\n        return \"cama\", cfg.CAMAS_CAPACIDAD[alias]\n    if estacion == \"UCI\":\n        return \"uci\", cfg.UCI_TOTAL_CAPACIDAD\n    if estacion == \"Box_Urgencias\":\n        return \"box\", cfg.BOX_CAPACIDAD\n    return None, None\n\n\ndef nivel_ocupacion(ratio):\n    if ratio >= 0.90:\n        return \"#dc2626\"  # rojo\n    if ratio >= 0.60:\n        return \"#f97316\"  # naranja\n    if ratio >= 0.30:\n        return \"#eab308\"  # amarillo\n    return \"#16a34a\"       # verde\n\n\ndef snapshot_en_instante(df, t):\n    \"\"\"Reconstruye, a partir de la traza completa `df`, cuántos pacientes\n    tiene cada estación (Station_in) en el instante `t`: en espera\n    (T_in<=t<T_in+T_wait) y en servicio (T_in+T_wait<=t<T_out).\"\"\"\n    activos = df[(df[\"T_in\"] <= t) & (df[\"T_out\"] > t)]\n    inicio_servicio = activos[\"T_in\"] + activos[\"T_wait\"]\n    en_cola = activos[t < inicio_servicio]\n    en_servicio = activos[t >= inicio_servicio]\n    out = {}\n    for est, grp in en_cola.groupby(\"Station_in\"):\n        out.setdefault(est, {\"cola\": 0, \"servicio\": 0})[\"cola\"] = len(grp)\n    for est, grp in en_servicio.groupby(\"Station_in\"):\n        out.setdefault(est, {\"cola\": 0, \"servicio\": 0})[\"servicio\"] = len(grp)\n    # Planta_PostUCI comparte cama física con Planta: se fusiona en el conteo\n    # de Planta para que el aforo mostrado coincida con la capacidad real.\n    if \"Planta_PostUCI\" in out:\n        p = out.setdefault(\"Planta\", {\"cola\": 0, \"servicio\": 0})\n        p[\"cola\"] += out[\"Planta_PostUCI\"][\"cola\"]\n        p[\"servicio\"] += out[\"Planta_PostUCI\"][\"servicio\"]\n    return out\n\n\ndef edges_from_config(cfg):\n    \"\"\"Lista de aristas (origen, destino) deducidas de PROB_DERIVACION (igual\n    criterio que `edgesFromConfig()` del Artifact HTML/JS): cada escenario\n    dibuja sólo las aristas que realmente usa.\"\"\"\n    vistas = set()\n    edges = []\n    for est, por_tipo in cfg.PROB_DERIVACION.items():\n        for tipo, destinos in por_tipo.items():\n            for dest in destinos:\n                par = (est, dest)\n                if par not in vistas:\n                    vistas.add(par)\n                    edges.append(par)\n    return edges\n\n\ndef _nombre_nodo(nid):\n    return STATION_LABELS.get(nid, nid)\n\n\ndef build_dot(cfg, snap, estacion_seleccionada=None):\n    \"\"\"Construye el DOT (texto) del diagrama de red para el escenario `cfg`,\n    coloreado según la ocupación en la \"foto\" `snap` (ver\n    `snapshot_en_instante`). `st.graphviz_chart` acepta directamente esta\n    cadena de texto.\"\"\"\n    activas = estaciones_activas(cfg)\n    lines = [\n        \"digraph G {\",\n        \"  rankdir=LR;\",\n        \"  bgcolor=transparent;\",\n        \"  node [shape=box, style=\\\"filled,rounded\\\", fontname=\\\"Helvetica\\\", fontsize=11, margin=\\\"0.12,0.08\\\"];\",\n        \"  edge [color=\\\"#9ca3af\\\", arrowsize=0.6, penwidth=1.0];\",\n    ]\n\n    for g in GRUPOS:\n        items = [it for it in g[\"items\"] if it in activas]\n        if not items:\n            continue\n        lines.append(f'  subgraph cluster_{g[\"id\"]} {{')\n        lines.append(f'    label=\"{g[\"titulo\"]}\"; style=\"filled,rounded\"; color=\"#d1d5db\"; '\n                      f'fillcolor=\"{g[\"color\"]}\"; fontname=\"Helvetica-Bold\"; fontsize=12;')\n        for nid in items:\n            lines.append(_nodo_dot(cfg, snap, nid, estacion_seleccionada))\n        lines.append(\"  }\")\n\n    for origen, destino in edges_from_config(cfg):\n        if origen in activas and destino in activas:\n            lines.append(f'  \"{origen}\" -> \"{destino}\";')\n\n    lines.append(\"}\")\n    return \"\\n\".join(lines)\n\n\ndef _nodo_dot(cfg, snap, nid, seleccionada):\n    nombre = _nombre_nodo(nid)\n    cuenta = snap.get(nid, {\"cola\": 0, \"servicio\": 0})\n    total = cuenta[\"cola\"] + cuenta[\"servicio\"]\n    fontcolor = \"#111827\"\n\n    if nid in NODOS_BIG:\n        label = f\"{nombre}\"\n        fill = \"#ffffff\"\n    elif nid in OBS_IDS:\n        label = f\"{nombre}\\\\n{total} en observación\"\n        fill = \"#ffffff\"\n    elif nid in SALAS_ESPERA:\n        label = f\"{nombre}\\\\n{total} esperando\"\n        fill = \"#ffffff\"\n    else:\n        tipo, cap = capacidad_de(cfg, nid)\n        if cap:\n            ratio = total / cap if cap else 0\n            fill = nivel_ocupacion(ratio)\n            fontcolor = \"#ffffff\"\n            esp = f\" (+{cuenta['cola']} esp.)\" if cuenta[\"cola\"] else \"\"\n            label = f\"{nombre}\\\\n{cuenta['servicio']}/{cap}{esp}\"\n        else:\n            label = f\"{nombre}\\\\n{total}\"\n            fill = \"#ffffff\"\n\n    borde = \"#111827\"\n    penwidth = 1.2\n    if seleccionada == nid:\n        borde = \"#2563eb\"\n        penwidth = 3.0\n\n    return (f'    \"{nid}\" [label=\"{label}\", fillcolor=\"{fill}\", '\n            f'color=\"{borde}\", penwidth={penwidth}, fontcolor=\"{fontcolor}\"];')\n"
},
    },
    document.getElementById("root"),
  );
</script>
