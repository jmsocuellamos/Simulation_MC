  <div id="carga">
    <h1>📈 Riesgo y retorno de planes de inversión</h1>
    <p>Cargando Python en el navegador e instalando los paquetes (pandas, SciPy, matplotlib…).
       La primera vez puede tardar uno o dos minutos; después el navegador lo guarda en caché.</p>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
    const ficheros = {
 "app.py": "# -*- coding: utf-8 -*-\n\"\"\"Riesgo y retorno de planes de inversión · aplicación Streamlit.\nTransformada inversa, simulación Monte Carlo del retorno, comparación de planes (riesgo frente a retorno),\nsensibilidad del estimador e informe Word.\n\nEjecutar con:   streamlit run app.py\n\"\"\"\nimport copy\nimport datetime\nimport io\nimport json\nimport sys\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\nimport matplotlib.pyplot as plt\n\nimport inversion as iv\nimport graficos as gr\nimport informe\nfrom inversion import num, pct, eur\n\nst.set_page_config(page_title=\"Simulador · Riesgo y retorno\", page_icon=\"📈\", layout=\"wide\")\nEN_NAVEGADOR = sys.platform == \"emscripten\"\n\nESCENARIOS_DEF = {\n    \"A · fijo\": {\"valores\": [27500.0], \"probs\": [100.0],\n                 \"descripcion\": \"Retorno fijo y seguro: 27.500 € con probabilidad 1.\"},\n    \"B · moderado\": {\"valores\": [27000.0, 28000.0], \"probs\": [40.0, 60.0],\n                     \"descripcion\": \"Dos resultados posibles: 27.000 € (40 %) o 28.000 € (60 %).\"},\n    \"C · agresivo\": {\"valores\": [24000.0, 27000.0, 33000.0], \"probs\": [20.0, 50.0, 30.0],\n                     \"descripcion\": \"Tres escenarios: bajo 24.000 € (20 %), medio 27.000 € (50 %) y alto 33.000 € (30 %).\"},\n}\nCOMUNES_DEF = {\"I0\": 25000.0, \"objetivos\": dict(iv.OBJETIVOS_DEF)}\nAJUSTES_DEF = {\"nsim\": 10000, \"replicas\": 5, \"semilla\": 1000}\nSENS_DEF = {\"nsim_min\": 200, \"nsim_max\": 20000, \"puntos\": 6, \"replicas\": 5}\nCOL_V, COL_P = \"Retorno (€)\", \"Probabilidad (%)\"\n\n# ==============================================================================================\n# Estado de la sesión\n# ==============================================================================================\nss = st.session_state\nif \"escenarios\" not in ss:\n    ss.escenarios = copy.deepcopy(ESCENARIOS_DEF)\n    ss.comunes = copy.deepcopy(COMUNES_DEF)\n    ss.ajustes = copy.deepcopy(AJUSTES_DEF)\n    ss.sens_cfg = copy.deepcopy(SENS_DEF)\n    ss.resultados = None\n    ss.sens = None\n    ss.informe_bytes = None\n    ss.version = 0\n    ss.esc_activo = list(ss.escenarios)[-1]\n    ss.u_ejemplo = 0.55\n\n\ndef ver_fig(contenedor, fig):\n    \"\"\"Muestra una figura de matplotlib y la cierra para no acumular memoria entre ejecuciones.\"\"\"\n    contenedor.pyplot(fig, use_container_width=True)\n    plt.close(fig)\n\n\ndef tabla_fmt(df, fn):\n    out = df.copy().astype(object)\n    for f in df.index:\n        for c in df.columns:\n            out.loc[f, c] = fn(f, c, df.loc[f, c])\n    return out\n\n\ndef mostrar_tabla(df, fn=None, primera=\"\", ancho_primera=\"medium\", iconos=False):\n    \"\"\"Tabla a todo el ancho, con todos los valores ya formateados, la primera columna con el nombre de la fila y\n    una altura que muestra todas las filas sin barra de desplazamiento.\"\"\"\n    d = (tabla_fmt(df, fn) if fn else df.astype(object)).copy()\n    nombre = primera or df.index.name or \" \"\n    d.index = [num(i, 0) if isinstance(i, (int, np.integer)) else str(i) for i in d.index]\n    d.index.name = nombre\n    d = d.reset_index()\n    d.columns = [str(c) for c in d.columns]\n    cfg = {nombre: st.column_config.TextColumn(nombre, width=ancho_primera)}\n    for c in d.columns[1:]:\n        et = c\n        if iconos and c.startswith((\"Teóric\", \"Simulad\")):\n            et = (\"📐 \" if c.startswith(\"Teóric\") else \"🎲 \") + c\n        cfg[c] = st.column_config.TextColumn(et)\n    st.dataframe(d.astype(str), use_container_width=True, hide_index=True, column_config=cfg,\n                 height=38 + 35 * len(d))\n\n\ndef clave(*partes):\n    \"\"\"Clave de widget ligada a la versión de la configuración (al cargar o restablecer se regeneran).\"\"\"\n    return \"__\".join(str(p) for p in partes) + f\"__v{ss.version}\"\n\n\ndef configuracion():\n    return {\"comunes\": ss.comunes, \"ajustes\": ss.ajustes, \"escenarios\": ss.escenarios, \"sensibilidad\": ss.sens_cfg}\n\n\ndef cargar_configuracion(d):\n    ss.comunes = {**copy.deepcopy(COMUNES_DEF), **d.get(\"comunes\", {})}\n    ss.comunes[\"objetivos\"] = {**iv.OBJETIVOS_DEF, **d.get(\"comunes\", {}).get(\"objetivos\", {})}\n    ss.ajustes = {**copy.deepcopy(AJUSTES_DEF), **{k: v for k, v in d.get(\"ajustes\", {}).items() if k in AJUSTES_DEF}}\n    ss.sens_cfg = {**copy.deepcopy(SENS_DEF), **d.get(\"sensibilidad\", {})}\n    ss.escenarios = d.get(\"escenarios\") or copy.deepcopy(ESCENARIOS_DEF)\n    ss.esc_activo = list(ss.escenarios)[-1]\n    ss.resultados, ss.sens, ss.informe_bytes = None, None, None\n    ss.version += 1\n\n\ndef teoria_plan(e):\n    return iv.teoria(e[\"valores\"], e[\"probs\"], ss.comunes[\"I0\"])\n\n\ncom, aj = ss.comunes, ss.ajustes\n\n# ==============================================================================================\n# Barra lateral\n# ==============================================================================================\nwith st.sidebar:\n    st.header(\"⚙️ Simulación\")\n    aj[\"nsim\"] = int(st.number_input(\"Simulaciones por réplica (nsim)\", 10, 10_000_000, int(aj[\"nsim\"]), 1000,\n                                     key=clave(\"nsim\"), help=\"Número de retornos simulados en cada réplica.\"))\n    aj[\"replicas\"] = int(st.number_input(\"Réplicas (semillas)\", 2, 100, int(aj[\"replicas\"]), key=clave(\"rep\"),\n                                         help=\"Cada réplica usa una semilla distinta (semilla + i); el IC95 % se calcula \"\n                                              \"con la variabilidad entre réplicas. Todos los planes usan las mismas \"\n                                              \"semillas (números aleatorios comunes).\"))\n    aj[\"semilla\"] = int(st.number_input(\"Semilla de inicialización\", 0, 10**9, int(aj[\"semilla\"]), key=clave(\"sem\")))\n    st.caption(f\"Por plan: {num(aj['nsim'] * aj['replicas'], 0)} retornos generados por transformada inversa.\")\n    nombres = list(ss.escenarios)\n    sel = st.multiselect(\"Planes a simular\", nombres, default=nombres, key=clave(\"sel\"))\n    if EN_NAVEGADOR:\n        st.caption(\"En el navegador la simulación es más lenta: con muchas simulaciones o réplicas puede tardar.\")\n    if st.button(\"▶️ Ejecutar análisis\", type=\"primary\", use_container_width=True, disabled=not sel):\n        barra = st.progress(0.0, text=\"Simulando…\")\n        res = {}\n        total = len(sel) * aj[\"replicas\"]\n        for i, n in enumerate(sel):\n            def prog(k, m, i=i, n=n):\n                barra.progress((i * aj[\"replicas\"] + k) / total, text=f\"{n}: réplica {k} de {m}\")\n            res[n] = iv.analizar_escenario(ss.escenarios[n], com, aj, prog)\n        ss.resultados = {\"res\": res, \"comunes\": copy.deepcopy(com), \"ajustes\": copy.deepcopy(aj),\n                         \"fecha\": f\"{datetime.datetime.now():%d/%m/%Y %H:%M}\"}\n        ss.informe_bytes = None\n        barra.progress(1.0, text=\"Análisis completado\")\n\n    st.divider()\n    st.subheader(\"💾 Configuración\")\n    st.download_button(\"Descargar configuración (JSON)\", json.dumps(configuracion(), ensure_ascii=False, indent=2),\n                       \"configuracion_inversion.json\", \"application/json\", use_container_width=True)\n    fich = st.file_uploader(\"Cargar configuración (JSON)\", type=\"json\", key=clave(\"json\"))\n    if fich is not None and st.button(\"Aplicar configuración cargada\", use_container_width=True):\n        cargar_configuracion(json.loads(fich.getvalue().decode(\"utf-8\")))\n        st.rerun()\n    if st.button(\"↺ Restablecer valores por defecto\", use_container_width=True):\n        cargar_configuracion({})\n        st.rerun()\n\n# ==============================================================================================\n# Cabecera\n# ==============================================================================================\nst.title(\"📈 Riesgo y retorno de planes de inversión\")\nst.caption(\"Transformada inversa para el retorno de cada plan, simulación Monte Carlo, comparación de riesgo frente a \"\n           \"retorno, sensibilidad del estimador e informe Word. Basado en el Ejemplo 2 de «B-70. Distribuciones \"\n           \"derivadas», Javier Morales y Asun Martínez Mayoral, equipo IA4LEGOS (CC BY-SA 4.0).\")\ntab_com, tab_esc, tab_res, tab_sens, tab_inf = st.tabs([\"🌐 Parámetros comunes\", \"🏕️ Planes\", \"📊 Resultados\",\n                                                        \"🔬 Sensibilidad\", \"📄 Informe\"])\n\n# ==============================================================================================\n# 1) Parámetros comunes\n# ==============================================================================================\nwith tab_com:\n    st.subheader(\"Parámetros comunes a todos los planes\")\n    c1, c2 = st.columns([2, 3])\n    with c1:\n        st.markdown(\"#### 💶 Inversión\")\n        com[\"I0\"] = float(st.number_input(\"Inversión inicial I₀ (€)\", 0.0, 1e12, float(com[\"I0\"]), 500.0, key=clave(\"I0\"),\n                                          help=\"Capital invertido. Hay pérdida patrimonial si el retorno R es menor que I₀.\"))\n    with c2:\n        st.markdown(\"#### 🏆 Objetivos\")\n        st.caption(\"Criterios que deben cumplir los planes (se evalúan sobre los valores teóricos). \"\n                   \"Desmarca un objetivo para no evaluarlo.\")\n        ob = com[\"objetivos\"]\n        def objetivo(clave_obj, etiqueta, defecto, factor, paso, ayuda):\n            cc1, cc2 = st.columns([1, 2])\n            activo = cc1.checkbox(\"Evaluar\", value=ob.get(clave_obj) is not None, key=clave(\"obj_on\", clave_obj))\n            v = ob.get(clave_obj) if ob.get(clave_obj) is not None else defecto\n            x = cc2.number_input(etiqueta, -1e12, 1e12, float(v) * factor, paso, key=clave(\"obj\", clave_obj), help=ayuda,\n                                 disabled=not activo)\n            ob[clave_obj] = (x / factor) if activo else None\n        objetivo(\"RENT_MIN\", \"Rentabilidad esperada mín. (%)\", 0.102, 100, 0.1,\n                 \"Rentabilidad esperada mínima, (E(R) − I₀)/I₀.\")\n        objetivo(\"PLOSS_MAX\", \"P(pérdida) máxima (%)\", 0.05, 100, 1.0,\n                 \"Probabilidad máxima admisible de pérdida patrimonial, P(R < I₀).\")\n        objetivo(\"SIGMA_MAX\", \"Riesgo σ(R) máximo (€)\", 1000.0, 1, 100.0,\n                 \"Desviación típica máxima admisible del retorno.\")\n        objetivo(\"P5NETO_MIN\", \"Neto mínimo en el peor 5 % (€)\", 0.0, 1, 100.0,\n                 \"Resultado neto mínimo en el percentil 5, P5(R) − I₀: el peor resultado salvo en 1 de cada 20 casos.\")\n\n# ==============================================================================================\n# 2) Planes (escenarios)\n# ==============================================================================================\nwith tab_esc:\n    st.subheader(\"Planes de inversión\")\n    nombres = list(ss.escenarios)\n    if ss.esc_activo not in nombres:\n        ss.esc_activo = nombres[0]\n    c1, c2, c3, c4 = st.columns([3, 2, 1, 1])\n    activo = c1.selectbox(\"Plan a editar\", nombres, index=nombres.index(ss.esc_activo), key=clave(\"activo\"))\n    ss.esc_activo = activo\n    nuevo = c2.text_input(\"Nombre para copiar / renombrar\", key=clave(\"nuevo_nombre\"), placeholder=\"nombre del plan\")\n    if c3.button(\"Copiar\", use_container_width=True, help=\"Crea un plan nuevo copiando el actual\"):\n        if nuevo and nuevo not in ss.escenarios:\n            ss.escenarios[nuevo] = copy.deepcopy(ss.escenarios[activo]); ss.esc_activo = nuevo; ss.version += 1; st.rerun()\n        else:\n            st.warning(\"Escribe un nombre nuevo que no exista.\")\n    if c4.button(\"Renombrar\", use_container_width=True):\n        if nuevo and nuevo not in ss.escenarios:\n            ss.escenarios = {(nuevo if k == activo else k): v for k, v in ss.escenarios.items()}\n            ss.esc_activo = nuevo; ss.version += 1; st.rerun()\n        else:\n            st.warning(\"Escribe un nombre nuevo que no exista.\")\n\n    e = ss.escenarios[activo]\n    st.markdown(f\"#### Tramos de «{activo}»\")\n    c1, c2 = st.columns([2, 3])\n    with c1:\n        st.caption(f\"Cada fila es un retorno posible y su probabilidad (hasta {iv.MAX_TRAMOS} tramos). Añade o borra filas \"\n                   \"con los controles de la tabla; las probabilidades se normalizan si no suman 100 %.\")\n        k_df = clave(\"tramos\", activo)\n        k_base = \"base_\" + k_df\n        if k_base not in ss:          # datos de partida fijos para el editor (evita aplicar dos veces los cambios)\n            ss[k_base] = pd.DataFrame({COL_V: [float(x) for x in e[\"valores\"]], COL_P: [float(x) for x in e[\"probs\"]]})\n        ed = st.data_editor(ss[k_base], key=k_df, num_rows=\"dynamic\", use_container_width=True, hide_index=True,\n                            column_config={COL_V: st.column_config.NumberColumn(COL_V, step=100.0, format=\"%.0f\"),\n                                           COL_P: st.column_config.NumberColumn(COL_P, min_value=0.0, max_value=100.0,\n                                                                                step=1.0, format=\"%.1f\")})\n        ed = ed.dropna(how=\"any\").head(iv.MAX_TRAMOS)\n        if len(ed):\n            e[\"valores\"] = [float(x) for x in ed[COL_V]]\n            e[\"probs\"] = [float(x) for x in ed[COL_P]]\n        else:\n            st.error(\"El plan necesita al menos un tramo con retorno y probabilidad.\")\n        suma = sum(e[\"probs\"])\n        if abs(suma - 100) > 1e-9:\n            st.warning(f\"Las probabilidades suman {num(suma, 1)} %: se normalizan para sumar 100 %.\")\n        e[\"descripcion\"] = st.text_area(\"Descripción\", e.get(\"descripcion\", \"\"), key=clave(\"desc\", activo), height=90)\n\n    t = teoria_plan(e)\n    with c2:\n        st.markdown(\"##### 📐 Vista previa teórica (fórmulas exactas, sin simular)\")\n        m = st.columns(3)\n        m[0].metric(\"Retorno esperado E(R)\", eur(t[\"E\"]), help=\"Σ pᵢ·vᵢ\")\n        m[1].metric(\"Riesgo σ(R)\", eur(t[\"sd\"]), help=\"√(Σ pᵢ·(vᵢ − E(R))²)\")\n        m[2].metric(\"P(pérdida)\", pct(t[\"Ploss\"], 1), help=f\"P(R < I₀ = {eur(com['I0'])})\")\n        m = st.columns(3)\n        m[0].metric(\"Neto esperado E(R) − I₀\", eur(t[\"neto\"]))\n        m[1].metric(\"Rentabilidad esperada\", pct(t[\"rent\"], 2))\n        m[2].metric(\"Neto en el peor 5 %\", eur(t[\"P5_neto\"]), help=\"Percentil 5 de R menos I₀.\")\n        ver_fig(st, gr.fig_pmf(t))\n\n    with st.expander(\"🎯 Mecanismo · una tirada de la transformada inversa\", expanded=True):\n        st.caption(\"1 · Se genera U ~ Unif(0, 1).  2 · Se busca el menor índice i tal que U ≤ F(i) = p₁ + … + pᵢ (el \"\n                   \"tramo).  3 · Se devuelve el retorno R = vᵢ. Repetido muchas veces, reproduce las probabilidades del plan.\"\n                   + (\"  El plan es determinista: cualquier U cae en el único tramo.\" if t[\"tramos\"] == 1 else \"\"))\n        c1, c2 = st.columns([3, 1])\n        if c2.button(\"🎲 U aleatorio\", use_container_width=True):\n            ss.u_ejemplo = float(np.round(np.random.random(), 2))\n            ss.pop(\"u_slider\", None)\n        ss.u_ejemplo = c1.slider(\"U ~ Unif(0, 1)\", 0.0, 1.0, float(ss.u_ejemplo), 0.01, key=\"u_slider\")\n        k = int(iv.transformada_inversa(np.array([ss.u_ejemplo]), t[\"F\"])[0])\n        m = st.columns(3)\n        m[0].metric(\"U generado\", num(ss.u_ejemplo, 2))\n        m[1].metric(\"Retorno simulado R\", eur(t[\"v\"][k]), f\"tramo {k + 1} de {t['tramos']}\", delta_color=\"off\")\n        neto = t[\"v\"][k] - com[\"I0\"]\n        m[2].metric(\"Resultado neto R − I₀\", eur(neto), \"ganancia\" if neto >= 0 else \"pérdida\",\n                    delta_color=\"normal\" if neto >= 0 else \"inverse\")\n        ver_fig(st, gr.fig_escalera(t, ss.u_ejemplo))\n        mostrar_tabla(iv.tabla_tramos(t), informe.fmt_tramos, \"Tramo\", \"small\", iconos=True)\n\n    st.divider()\n    c1, c2 = st.columns([3, 1])\n    c1.caption(\"Los cambios se aplican al pulsar «Ejecutar análisis» en la barra lateral.\")\n    if c2.button(\"🗑️ Eliminar este plan\", use_container_width=True, disabled=len(ss.escenarios) <= 1):\n        ss.escenarios.pop(activo); ss.esc_activo = next(iter(ss.escenarios)); ss.version += 1; st.rerun()\n\n# ==============================================================================================\n# 3) Resultados\n# ==============================================================================================\nwith tab_res:\n    R = ss.resultados\n    if R is None:\n        st.info(\"Todavía no hay resultados. Configura los planes y pulsa «▶️ Ejecutar análisis» en la barra lateral.\")\n    else:\n        res = R[\"res\"]\n        st.caption(f\"Análisis del {R['fecha']} · {R['ajustes']['replicas']} réplicas de {num(R['ajustes']['nsim'], 0)} \"\n                   f\"simulaciones · I₀ = {eur(R['comunes']['I0'])} · semilla {R['ajustes']['semilla']} · \"\n                   f\"planes: {', '.join(res)}\")\n        st.info(\"📐 **Teórico**: fórmulas exactas de la distribución discreta del retorno (E(R) = Σ pᵢ·vᵢ). \"\n                \"🎲 **Simulado**: transformada inversa (media de las réplicas, con IC95 %).\")\n        r_sin, r_det, r_dat = st.tabs([\"Síntesis y comparación\", \"Detalle por plan\", \"Datos de las réplicas (simulados)\"])\n        with r_sin:\n            st.markdown(\"#### Síntesis\")\n            for n, r in res.items():\n                st.markdown(f\"**{n}.** \" + iv.texto_escenario(n, r)[len(n) + 2:])\n            st.success(\"**Recomendación.** \" + iv.texto_recomendacion(res))\n            c1, c2 = st.columns(2)\n            ver_fig(c1, gr.fig_riesgo_retorno(res))\n            with c2:\n                st.markdown(\"**Objetivos** (sobre los valores teóricos)\")\n                mostrar_tabla(iv.tabla_objetivos(res), None, \"Objetivo\", \"large\")\n            st.markdown(\"**Comparación de planes** (filas «Teórico» = fórmulas; filas «Simulado» = Monte Carlo)\")\n            mostrar_tabla(iv.tabla_comparativa(res), iv.fmt_kpi, \"KPI\", \"large\")\n            ver_fig(st, gr.fig_comparativa(res))\n            ver_fig(st, gr.fig_validacion(res))\n\n        with r_det:\n            n = st.selectbox(\"Plan\", list(res), index=len(res) - 1, key=\"det_esc\")\n            r = res[n]\n            t, mc, rm = r[\"teoria\"], r[\"mc\"], r[\"resumen_mc\"]\n            d_teo, d_sim, d_dis = st.tabs([\"📐 Resultados teóricos\", \"🎲 Resultados simulados\", \"🔢 Distribución del retorno\"])\n            with d_teo:\n                st.caption(\"Valores exactos de la distribución discreta del retorno.\")\n                m = st.columns(4)\n                m[0].metric(\"Retorno esperado E(R)\", eur(t[\"E\"]))\n                m[1].metric(\"Riesgo σ(R)\", eur(t[\"sd\"]))\n                m[2].metric(\"P(pérdida) P(R < I₀)\", pct(t[\"Ploss\"], 2))\n                m[3].metric(\"Pérdida esperada\", eur(t[\"perdida_media\"]), help=\"E[max(I₀ − R, 0)]\")\n                m = st.columns(4)\n                m[0].metric(\"Neto esperado E(R) − I₀\", eur(t[\"neto\"]))\n                m[1].metric(\"Rentabilidad esperada\", pct(t[\"rent\"], 2))\n                m[2].metric(\"Percentil 5 de R\", eur(t[\"P5\"]))\n                m[3].metric(\"Coef. de variación\", pct(t[\"CV\"], 2))\n                st.markdown(\"**Objetivos** (evaluados sobre los valores teóricos)\")\n                mostrar_tabla(r[\"objetivos\"], iv.fmt_obj, \"Objetivo\", \"large\")\n            with d_sim:\n                st.caption(f\"{R['ajustes']['replicas']} réplicas de {num(R['ajustes']['nsim'], 0)} simulaciones; cada KPI se \"\n                           \"calcula en cada réplica y se muestra la media de las réplicas con su IC95 %.\")\n                m = st.columns(4)\n                for col, (kpi, et, es_pct) in zip(m, [(\"Retorno medio E(R)\", \"E(R) simulado\",     x0 = float(c2.number_input(\"x (€)\", -1e12, 1e12, float(t[\"I0\"]), 500.0, key=f\"prob_x_{n}\"))\n                p_teo, p_sim = iv.prob_retorno(t, mc[\"R\"], tipo, x0)\n                c3.metric(f\"📐 Teórica · P(R {tipo} {num(x0, 0)})\", pct(p_teo, 2))\n                c4.metric(f\"🎲 Simulada · P(R {tipo} {num(x0, 0)})\", pct(p_sim, 2))\n                st.markdown(\"**Percentiles del retorno**\")\n                tq = iv.tabla_cuantiles(t, mc)\n                mostrar_tabla(tq, informe.fmt_euros, \"Percentil\", \"small\", iconos=True)\n\n        with r_dat:\n            st.markdown(\"Resultados **simulados** de cada réplica (una fila por réplica y plan).\")\n            largo = pd.concat([r[\"mc\"][\"replicas\"].assign(Plan=n) for n, r in res.items()]).reset_index()\n            st.dataframe(largo, use_container_width=True, hide_index=True)\n            buf = io.BytesIO()\n            try:\n                with pd.ExcelWriter(buf, engine=\"openpyxl\") as xw:\n                    largo.to_excel(xw, sheet_name=\"Replicas\", index=False)\n                    iv.tabla_comparativa(res).astype(str).to_excel(xw, sheet_name=\"Comparacion\")\n                    for i, (n, r) in enumerate(res.items(), 1):\n                        iv.tabla_tramos(r[\"teoria\"], r[\"mc\"]).to_excel(xw, sheet_name=f\"Tramos {i}\")\n                        iv.tabla_cuantiles(r[\"teoria\"], r[\"mc\"]).to_excel(xw, sheet_name=f\"Percentiles {i}\")\n                    if ss.sens is not None:\n                        informe.tabla_sens(ss.sens[\"df\"]).to_excel(xw, sheet_name=\"Sensibilidad\")\n                st.download_button(\"Descargar Excel\", buf.getvalue(), \"resultados_inversion.xlsx\",\n                                   \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n            except Exception:  # openpyxl no disponible\n                st.download_button(\"Descargar CSV\", largo.to_csv(index=False).encode(\"utf-8\"), \"replicas_inversion.csv\", \"text/cs red,\n                   \"cfg\": {\"replicas\": sc[\"replicas\"], \"plan\": pol, \"semilla\": aj[\"semilla\"]}}\n        ss.informe_bytes = None\n        barra.progress(1.0, text=\"Barrido completado\")\n    S = ss.sens\n    if S is None:\n        st.info(\"Pulsa «▶️ Analizar sensibilidad» para ejecutar el barrido.\")\n    else:\n        df, cfg = S[\"df\"], S[\"cfg\"]\n        m = st.columns(4)\n        m[0].metric(\"Plan analizado\", cfg[\"plan\"])\n        m[1].metric(\"Rango de nsim\", f\"{num(df.index.min(), 0)} – {num(df.index.max(), 0)}\", f\"{len(df)} puntos\", delta_color=\"off\")\n        m[2].metric(\"Réplicas por punto\", str(cfg[\"replicas\"]), \"semillas independientes\", delta_color=\"off\")\n        m[3].metric(\"Reducción de variabilidad\", (\"×\" + num(S[\"reduccion\"], 1)) if S[\"reduccion\"] else \"—\",\n                    help=\"σ entre réplicas del primer punto frente a la del último.\")\n        c1, c2 = st.columns(2)\n        ver_fig(c1, gr.fig_sens_convergencia(df))\n        ver_fig(c2, gr.fig_sens_variabilidad(df))\n        mostrar_tabla(informe.tabla_sens(df), informe.fmt_sens, \"nsim\", \"small\")\n        st.success(S[\"texto\"])\n\n# ==============================================================================================\n# 5) Informe\n# ==============================================================================================\nwith tab_inf:\n    R = ss.resultados\n    if R is None:\n        st.info(\"Ejecuta primero el análisis para poder generar el informe.\")\n    else:\n        st.markdown(\"El informe Word incluye los parámetros, la síntesis y la recomendación, la comparación de planes \"\n                    \"(riesgo frente a retorno) y, para cada plan, los resultados teóricos y simulados, la distribución \"\n                    \"del retorno y el funcionamiento de la transformada inversa.\")\n        titulo = st.text_input(\"Título del informe\", \"Riesgo y retorno de planes de inversión\", key=\"tit_inf\")\n        con_sens = st.checkbox(\"Incluir el análisis de sensibilidad\", value=ss.sens is not None,\n                               disabled=ss.sens is None, help=\"Disponible tras ejecutarlo en la pestaña Sensibilidad.\")\n        if st.button(\"📄 Generar informe (.docx)\", type=\"primary\"):\n            with st.spinner(\"Generando informe…\"):\n                ss.informe_bytes = informe.generar_informe(R[\"res\"], R[\"comunes\"], R[\"ajustes\"], titulo,\n                                                           ss.sens if con_sens else None)\n        if ss.informe_bytes:\n            st.download_button(\"⬇️ Descargar informe\", ss.informe_bytes,\n                               f\"Informe_Riesgo_Retorno_{datetime.date.today():%Y%m%d}.docx\",\n                               \"application/vnd.openxmlformats-officedocument.wordprocessingml.document\")\n",
 "inversion.py": "# -*- coding: utf-8 -*-\n\"\"\"Riesgo y retorno de planes de inversión: el retorno R de cada plan es una variable discreta (valores vᵢ con\nprobabilidades pᵢ) que se genera por el método de la transformada inversa.\n\nTeoría exacta (media, riesgo σ, probabilidad de pérdida, percentiles), simulación Monte Carlo con réplicas,\ncomparación de planes (escenarios) con objetivos y sensibilidad del estimador frente a nsim.\n\nBasado en el Ejemplo 2 de «B-70. Distribuciones derivadas», Javier Morales y Asun Martínez Mayoral, equipo IA4LEGOS\n(CC BY-SA 4.0).\"\"\"\nimport math\n\nimport numpy as np\nimport pandas as pd\n\ntry:\n    from scipy import stats as _stats\nexcept Exception:          # pragma: no cover\n    _stats = None\n\nCUANTILES = (0.01, 0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95, 0.99)\nN_DIAGRAMA = 60                 # simulaciones que se muestran en el diagrama de la transformada inversa\nMAX_TRAMOS = 8\nZ95 = 1.959963984540054\n\n\ndef normalizar(p):\n    p = np.clip(np.asarray(p, dtype=float), 0, None)\n    s = p.sum()\n    return p / s if s > 0 else np.full(len(p), 1 / len(p))\n\n\ndef limpiar_plan(valores, probs):\n    \"\"\"Quita los tramos vacíos y devuelve (valores, probabilidades normalizadas).\"\"\"\n    pares = [(float(v), float(p)) for v, p in zip(valores, probs)\n             if v is not None and p is not None and not (isinstance(v, float) and math.isnan(v))\n             and not (isinstance(p, float) and math.isnan(p))]\n    if not pares:\n        pares = [(0.0, 1.0)]\n    v = np.array([a for a, _ in pares]); p = normalizar([b for _, b in pares])\n    return v, p\n\n\n# ==============================================================================================\n# Teoría\n# ==============================================================================================\ndef _cuantil(v, p, q):\n    \"\"\"Cuantil de la distribución discreta: menor valor x con P(R ≤ x) ≥ q.\"\"\"\n    orden = np.argsort(v, kind=\"stable\")\n    vs, F = v[orden], np.cumsum(p[orden])\n    return float(vs[min(len(vs) - 1, int(np.searchsorted(F, q - 1e-12)))])\n\n\ndef teoria(valores, probs, I0):\n    \"\"\"KPIs teóricos de un plan: E(R) = Σ pᵢ·vᵢ, σ(R) = √(Σ pᵢ·(vᵢ − E(R))²), P(pérdida) = P(R < I₀),\n    resultado neto esperado E(R) − I₀ y rentabilidad esperada (E(R) − I₀)/I₀.\"\"\"\n    v, p = limpiar_plan(valores, probs)\n    I0 = float(I0)\n    m = float(p @ v)\n    sd = math.sqrt(max(0.0, float(p @ (v - m) ** 2)))\n    F = np.cumsum(p); F[-1] = 1.0\n    sis = {\"v\": tuple(float(x) for x in v), \"p\": tuple(float(x) for x in p), \"F\": tuple(float(x) for x in F),\n           \"I0\": I0, \"tramos\": len(v), \"E\": m, \"sd\": sd, \"CV\": sd / m if m else float(\"nan\"),\n           \"Ploss\": float(p[v < I0].sum()), \"neto\": m - I0, \"rent\": (m - I0) / I0 if I0 else float(\"nan\"),\n           \"perdida_media\": float((p * np.maximum(I0 - v, 0)).sum()),\n           \"min\": float(v[p > 0].min()), \"max\": float(v[p > 0].max())}\n    sis[\"cuantiles\"] = {q: _cuantil(v, p, q) for q in CUANTILES}\n    sis[\"P5\"] = sis[\"cuantiles\"][0.05]\n    sis[\"P5_neto\"] = sis[\"P5\"] - I0\n    return sis\n\n\ndef cdf(sis, x):\n    v, p = np.array(sis[\"v\"]), np.array(sis[\"p\"])\n    return float(p[v <= x].sum())\n\n\n# ==============================================================================================\n# Simulación: transformada inversa\n# ==============================================================================================\ndef transformada_inversa(u, F):\n    \"\"\"Índice del tramo: menor i tal que u ≤ F(i) (vectorizado).\"\"\"\n    return np.minimum(np.searchsorted(np.asarray(F), u, side=\"left\"), len(F) - 1)\n\n\ndef simular_plan(sis, nsim, semilla, n_traza=0):\n    \"\"\"nsim retornos del plan por transformada inversa. Devuelve los retornos, el tramo de cada simulación y, si se\n    pide, las primeras simulaciones (U, tramo, retorno, resultado neto).\"\"\"\n    rng = np.random.default_rng(int(semilla))\n    U = rng.random(int(nsim))\n    idx = transformada_inversa(U, sis[\"F\"])\n    R = np.asarray(sis[\"v\"])[idx]\n    traza = None\n    if n_traza:\n        k = min(n_traza, len(U))\n        traza = pd.DataFrame({\"Simulación\": np.arange(1, k + 1), \"U\": U[:k], \"Tramo\": idx[:k] + 1, \"Retorno\": R[:k],\n                              \"Neto\": R[:k] - sis[\"I0\"]})\n    return {\"R\": R, \"idx\": idx, \"traza\": traza}\n\n\ndef _tq(n, alpha=0.05):\n    if n < 2:\n        return float(\"nan\")\n    return float(_stats.t.ppf(1 - alpha / 2, n - 1)) if _stats is not None else 1.96\n\n\ndef montecarlo(sis, nsim, replicas, semilla, progreso=None):\n    \"\"\"`replicas` réplicas de `nsim` simulaciones (réplica i -> semilla + i). Las mismas semillas en todos los\n    planes (números aleatorios comunes).\"\"\"\n    filas, Rs, Is = [], [], []\n    traza = None\n    I0 = sis[\"I0\"]\n    for r in range(int(replicas)):\n        s = simular_plan(sis, nsim, int(semilla) + r, n_traza=N_DIAGRAMA if r == 0 else 0)\n        R = s[\"R\"]\n        if r == 0:\n            traza = s[\"traza\"]\n        m = float(R.mean()); sd = float(R.std(ddof=1)) if len(R) > 1 else 0.0\n        fila = {\"Réplica\": r + 1, \"Semilla\": int(semilla) + r, \"Simulaciones\": len(R), \"Media R\": m, \"σ(R)\": sd,\n                \"P(pérdida)\": float((R < I0).mean()), \"Neto medio\": m - I0,\n                \"Rentabilidad\": (m - I0) / I0 if I0 else float(\"nan\"), \"P5\": float(np.quantile(R, 0.05, method=\"inverted_cdf\"))}\n        fr = np.bincount(s[\"idx\"], minlength=sis[\"tramos\"]) / len(R)\n        for i in range(sis[\"tramos\"]):\n            fila[f\"Frec. tramo {i + 1}\"] = fr[i]\n        filas.append(fila)\n        Rs.append(R); Is.append(s[\"idx\"])\n        if progreso:\n            progreso(r + 1, replicas)\n    return {\"replicas\": pd.DataFrame(filas).set_index(\"Réplica\"), \"R\": np.concatenate(Rs),\n            \"idx\": np.concatenate(Is), \"traza\": traza}\n\n\ndef _kpis(sis):\n    k = [(\"Retorno medio E(R)\", \"Media R\", sis[\"E\"]), (\"Riesgo σ(R)\", \"σ(R)\", sis[\"sd\"]),\n         (\"Probabilidad de pérdida P(R < I₀)\", \"P(pérdida)\", sis[\"Ploss\"]),\n         (\"Resultado neto medio E(R) − I₀\", \"Neto medio\", sis[\"neto\"]),\n         (\"Rentabilidad esperada\", \"Rentabilidad\", sis[\"rent\"]), (\"Percentil 5 de R\", \"P5\", sis[\"P5\"])]\n    for i in range(sis[\"tramos\"]):\n        k.append((f\"Proporción del tramo {i + 1} (R = {eur(sis['v'][i])})\", f\"Frec. tramo {i + 1}\", sis[\"p\"][i]))\n    return k\n\n\ndef resumen_mc(mc, sis):\n    \"\"\"Media de las réplicas, IC95 % (t de Student con la variabilidad entre réplicas) y valor teórico.\"\"\"\n    rep = mc[\"replicas\"]\n    n = len(rep)\n    tq = _tq(n)\n    filas = []\n    for nombre, col, teo in _kpis(sis):\n        v = rep[col].astype(float)\n        m = float(v.mean())\n        se = float(v.std(ddof=1)) / math.sqrt(n) if n > 1 else float(\"nan\")\n        lo, hi = (m - tq * se, m + tq * se) if n > 1 else (float(\"nan\"), float(\"nan\"))\n        tol = 1e-9 * max(1.0, abs(teo))\n        filas.append({\"KPI\": nombre, \"Teórico\": teo, \"Simulado · media\": m, \"IC95 inf\": lo, \"IC95 sup\": hi,\n                      \"Error relativo\": (m - teo) / abs(teo) if abs(teo) > 1e-12 else None,\n                      \"Teórico en IC95\": bool(lo - tol <= teo <= hi + tol) if n > 1 else None})\n    return pd.DataFrame(filas).set_index(\"KPI\")\n\n\n# ==============================================================================================\n# Distribución del retorno\n# ==============================================================================================\ndef tabla_tramos(sis, mc=None):\n    \"\"\"Tramos del plan: retorno, resultado neto, probabilidad, acumulada F e intervalo de U que lo produce en la\n    transformada inversa; con la frecuencia simulada si se indica.\"\"\"\n    filas = []\n    for i in range(sis[\"tramos\"]):\n        lo = 0.0 if i == 0 else sis[\"F\"][i - 1]\n        filas.append({\"Tramo\": i + 1, \"Retorno R (€)\": sis[\"v\"][i], \"Neto R − I₀ (€)\": sis[\"v\"][i] - sis[\"I0\"],\n                      \"Intervalo de U\": f\"({num(lo, 2)}, {num(sis['F'][i], 2)}]\",\n                      \"Teórica · P(R = v)\": sis[\"p\"][i], \"Teórica · F\": sis[\"F\"][i]})\n    df = pd.DataFrame(filas).set_index(\"Tramo\")\n    if mc is not None:\n        fr = np.bincount(mc[\"idx\"], minlength=sis[\"tramos\"]) / len(mc[\"idx\"])\n        df[\"Simulada · P(R = v)\"] = fr\n        df[\"Simulada · F\"] = np.cumsum(fr)\n    return df\n\n\ndef tabla_cuantiles(sis, mc=None):\n    df = pd.DataFrame(index=pd.Index([f\"P{int(round(q * 100))}\" for q in CUANTILES], name=\"Percentil\"))\n    df[\"Teórico (€)\"] = [sis[\"cuantiles\"][q] for q in CUANTILES]\n    if mc is not None:\n        df[\"Simulado (€)\"] = [float(np.quantile(mc[\"R\"], q, method=\"inverted_cdf\")) for q in CUANTILES]\n    df[\"Teórico neto (€)\"] = df[\"Teórico (€)\"] - sis[\"I0\"]\n    return df\n\n\ndef prob_retorno(sis, R, tipo, x):\n    \"\"\"P(R ≤ x), P(R < x), P(R ≥ x) o P(R > x), teórica y simulada.\"\"\"\n    v, p = np.array(sis[\"v\"]), np.array(sis[\"p\"])\n    R = np.asarray(R) if R is not None else None\n    op = {\"≤\": np.less_equal, \"<\": np.less, \"≥\": np.greater_equal, \">\": np.greater}[tipo]\n    return float(p[op(v, x)].sum()), (float(op(R, x).mean()) if R is not None else None)\n\n\n# ==============================================================================================\n# Objetivos (equivalentes a los SLAs de los casos de estudio)\n# ==============================================================================================\nOBJETIVOS_DEF = {\"RENT_MIN\": 0.102, \"PLOSS_MAX\": 0.05, \"SIGMA_MAX\": 1000.0, \"P5NETO_MIN\": 0.0}\n\n\ndef evaluar_objetivos(sis, obj):\n    filas = []\n    def fila(nombre, valor, txt, cumple):\n        filas.append({\"Objetivo\": nombre, \"Valor\": valor, \"Umbral\": txt, \"Cumple\": \"Sí\" if cumple else \"No\"})\n    if obj.get(\"RENT_MIN\") is not None:\n        fila(\"Rentabilidad esperada\", sis[\"rent\"], f\"≥ {pct(obj['RENT_MIN'], 1)}\", sis[\"rent\"] >= obj[\"RENT_MIN\"] - 1e-12)\n    if obj.get(\"PLOSS_MAX\") is not None:\n        fila(\"Probabilidad de pérdida\", sis[\"Ploss\"], f\"≤ {pct(obj['PLOSS_MAX'], 1)}\", sis[\"Ploss\"] <= obj[\"PLOSS_MAX\"] + 1e-12)\n    if obj.get(\"SIGMA_MAX\") is not None:\n        fila(\"Riesgo σ(R)\", sis[\"sd\"], f\"≤ {eur(obj['SIGMA_MAX'])}\", sis[\"sd\"] <= obj[\"SIGMA_MAX\"] + 1e-9)\n    if obj.get(\"P5NETO_MIN\") is not None:\n        fila(\"Resultado neto en el peor 5 % (P5 − I₀)\", sis[\"P5_neto\"], f\"≥ {eur(obj['P5NETO_MIN'])}\",\n             sis[\"P5_neto\"] >= obj[\"P5NETO_MIN\"] - 1e-9)\n    return pd.DataFrame(filas, columns=[\"Objetivo\", \"Valor\", \"Umbral\", \"Cumple\"]).set_index(\"Objetivo\")\n\n\n# ==============================================================================================\n# Análisis de un escenario (plan) y comparación\n# ==============================================================================================\ndef analizar_escenario(esc, comunes, ajustes, progreso=None):\n    sis = teoria(esc[\"valores\"], esc[\"probs\"], comunes[\"I0\"])\n    mc = montecarlo(sis, ajustes[\"nsim\"], ajustes[\"replicas\"], ajustes[\"semilla\"], progreso)\n    return {\"esc\": dict(esc), \"teoria\": sis, \"mc\": mc, \"resumen_mc\": resumen_mc(mc, sis),\n            \"objetivos\": evaluar_objetivos(sis, comunes[\"objetivos\"])}\n\n\ndef tabla_comparativa(res):\n    cols = {}\n    for n, r in res.items():\n        t, rm = r[\"teoria\"], r[\"resumen_mc\"]\n        cols[n] = {\n            \"Parámetro · tramos\": t[\"tramos\"],\n            \"Parámetro · retornos posibles\": \" / \".join(num(x, 0) for x in t[\"v\"]),\n            \"Parámetro · probabilidades\": \" / \".join(pct(x, 0) for x in t[\"p\"]),\n            \"Teórico · E(R)\": t[\"E\"], \"Teórico · σ(R)\": t[\"sd\"], \"Teórico · P(pérdida)\": t[\"Ploss\"],\n            \"Teórico · neto E(R) − I₀\": t[\"neto\"], \"Teórico · rentabilidad\": t[\"rent\"],\n            \"Teórico · percentil 5 de R\": t[\"P5\"], \"Teórico · pérdida esperada\": t[\"perdida_media\"],\n            \"Simulado · E(R)\": rm.loc[\"Retorno medio E(R)\", \"Simulado · media\"],\n            \"Simulado · σ(R)\": rm.loc[\"Riesgo σ(R)\", \"Simulado · media\"],\n            \"Simulado · P(pérdida)\": rm.loc[\"Probabilidad de pérdida P(R < I₀)\", \"Simulado · media\"],\n            \"Simulado · rentabilidad\": rm.loc[\"Rentabilidad esperada\", \"Simulado · media\"],\n            \"Objetivos cumplidos\": f\"{(r['objetivos']['Cumple'] == 'Sí').sum()} de {len(r['objetivos'])}\",\n        }\n    return pd.DataFrame(cols)\n\n\ndef tabla_objetivos(res):\n    return pd.DataFrame({n: r[\"objetivos\"][\"Cumple\"] for n, r in res.items()})\n\n\n# ==============================================================================================\n# Sensibilidad del estimador Monte Carlo frente a nsim\n# ==============================================================================================\ndef valores_barrido(vmin, vmax, puntos):\n    v = np.geomspace(max(1, vmin), max(vmin + 1, vmax), max(2, int(puntos)))\n    return sorted(set(int(round(x)) for x in v))\n\n\ndef sensibilidad(sis, valores, replicas, semilla, progreso=None):\n    filas = []\n    tot = len(valores) * int(replicas)\n    k = 0\n    for nsim in valores:\n        medias, s1, s2, nt = [], 0.0, 0.0, 0\n        for r in range(int(replicas)):\n            R = simular_plan(sis, nsim, int(semilla) + r)[\"R\"]\n            medias.append(float(R.mean())); s1 += float(R.sum()); s2 += float((R ** 2).sum()); nt += len(R)\n            k += 1\n            if progreso:\n                progreso(k, tot)\n        m = s1 / nt\n        var = max(0.0, (s2 - nt * m * m) / max(1, nt - 1))\n        se = math.sqrt(var / nt)\n        filas.append({\"nsim\": nsim, \"Simulaciones totales\": nt, \"Media combinada\": m, \"IC95 inf\": m - Z95 * se,\n                      \"IC95 sup\": m + Z95 * se,\n                      \"σ entre réplicas\": float(np.std(medias, ddof=1)) if len(medias) > 1 else 0.0,\n                      \"σ teórica de la media\": sis[\"sd\"] / math.sqrt(nsim),\n                      \"Teórico\": sis[\"E\"], \"Error relativo\": (m - sis[\"E\"]) / abs(sis[\"E\"]) if sis[\"E\"] else None,\n                      \"Medias por réplica\": medias})\n    return pd.DataFrame(filas).set_index(\"nsim\")\n\n\ndef texto_sensibilidad(df, plan, sis):\n    if sis[\"sd\"] == 0:\n        return (f\"El plan «{plan}» es determinista (un único retorno con probabilidad 1): no hay variabilidad que \"\n                \"reducir y la σ entre réplicas es 0 para cualquier nsim.\"), None\n    a, z = df[\"σ entre réplicas\"].iloc[0], df[\"σ entre réplicas\"].iloc[-1]\n    red = a / z if a > 0 and z > 0 else None\n    dentro = ((df[\"IC95 inf\"] <= df[\"Teórico\"]) & (df[\"Teórico\"] <= df[\"IC95 sup\"])).sum()\n    txt = (\"A medida que crece nsim, la media combinada se acerca al retorno teórico y la dispersión entre semillas \"\n           \"se reduce\" + (f\" ({num(red, 1)} veces menor entre el primer y el último punto; la teoría, σ/√nsim, \"\n                          f\"predice {num(math.sqrt(df.index[-1] / df.index[0]), 1)} veces).\" if red else \".\"))\n    txt += f\" El valor teórico queda dentro del IC95 % en {dentro} de los {len(df)} puntos.\"\n    return txt, red\n\n\n# ==============================================================================================\n# Formato y textos\n# ==============================================================================================\ndef num(x, d=2):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    if isinstance(x, float) and math.isinf(x):\n        return \"∞\"\n    if round(float(x), d) == 0:\n        x = 0.0                      # evita «-0»\n    s = f\"{x:,.{d}f}\"\n    return s.replace(\",\", \"X\").replace(\".\", \",\").replace(\"X\", \".\")\n\n\ndef pct(x, d=1):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    return num(100 * x, d) + \" %\"\n\n\ndef eur(x, d=0):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    return num(x, d) + \" €\"\n\n\ndef fmt_kpi(k, c, v):\n    if isinstance(v, str) or v is None:\n        return \"—\" if v is None else v\n    if \"P(\" in k or \"rentabilidad\" in k:\n        return pct(v, 2)\n    if \"tramos\" in k:\n        return num(v, 0)\n    return eur(v, 0)\n\n\ndef fmt_mc(fila, col, v):\n    if col == \"Teórico en IC95\":\n        return \"—\" if v is None else (\"Sí\" if v else \"No\")\n    if col == \"Error relativo\":\n        return \"—\" if v is None or (isinstance(v, float) and math.isnan(v)) else pct(v, 2)\n    if \"Proporción\" in fila or \"Probabilidad\" in fila or \"Rentabilidad\" in fila:\n        return pct(v, 2)\n    return eur(v, 0)\n\n\ndef fmt_obj(fila, col, v):\n    if col == \"Valor\":\n        return pct(v, 2) if (\"Rentabilidad\" in fila or \"Probabilidad\" in fila) else eur(v, 0)\n    return str(v)\n\n\ndef texto_escenario(nombre, r):\n    t, rm = r[\"teoria\"], r[\"resumen_mc\"]\n    ok = rm[\"Teórico en IC95\"].dropna()\n    val = (\"la simulación reproduce los valores teóricos (todos dentro del IC95 %)\" if ok.all() else\n           f\"la simulación reproduce los valores teóricos salvo en {', '.join(ok[~ok].index)} (fuera del IC95 %, \"\n           \"lo que puede deberse al azar o a un número de simulaciones insuficiente)\")\n    tramos = \", \".join(f\"{eur(v)} ({pct(p, 0)})\" for v, p in zip(t[\"v\"], t[\"p\"]))\n    txt = (f\"{nombre}: retornos {tramos}. Retorno esperado E(R) = {eur(t['E'])} (resultado neto {eur(t['neto'])}, \"\n           f\"rentabilidad {pct(t['rent'], 2)}), riesgo σ(R) = {eur(t['sd'])} y probabilidad de pérdida \"\n           f\"P(R < I₀) = {pct(t['Ploss'], 1)} (valores teóricos); {val}.\")\n    if t[\"sd\"] == 0:\n        txt += \" Es un plan determinista: el retorno es siempre el mismo.\"\n    n_ok = (r[\"objetivos\"][\"Cumple\"] == \"Sí\").sum()\n    txt += f\" Cumple {n_ok} de los {len(r['objetivos'])} objetivos.\"\n    return txt\n\n\ndef texto_recomendacion(res):\n    filas = [(n, (r[\"objetivos\"][\"Cumple\"] == \"Sí\").sum(), r[\"teoria\"]) for n, r in res.items()]\n    max_ok = max(f[1] for f in filas)\n    mejor = sorted([f for f in filas if f[1] == max_ok], key=lambda f: (-f[2][\"E\"], f[2][\"sd\"]))[0]\n    rentable = max(filas, key=lambda f: f[2][\"E\"])\n    seguro = min(filas, key=lambda f: (f[2][\"sd\"], -f[2][\"E\"]))\n    txt = (f\"Se recomienda «{mejor[0]}»: es el plan que cumple más objetivos ({mejor[1]} de \"\n           f\"{len(res[mejor[0]]['objetivos'])}) y, entre ellos, el de mayor retorno esperado ({eur(mejor[2]['E'])}, \"\n           f\"rentabilidad {pct(mejor[2]['rent'], 2)}, σ = {eur(mejor[2]['sd'])}).\")\n    if rentable[0] != mejor[0]:\n        txt += (f\" El plan de mayor retorno medio es «{rentable[0]}» ({eur(rentable[2]['E'])}), pero con un riesgo \"\n                f\"σ = {eur(rentable[2]['sd'])} y una probabilidad de pérdida del {pct(rentable[2]['Ploss'], 1)}.\")\n    if seguro[0] != mejor[0]:\n        txt += f\" El más seguro es «{seguro[0]}» (σ = {eur(seguro[2]['sd'])}), con menor retorno ({eur(seguro[2]['E'])}).\"\n    txt += \" La elección final depende del perfil de riesgo de la empresa, no solo de maximizar la media.\"\n    return txt\n",
 "graficos.py": "# -*- coding: utf-8 -*-\n\"\"\"Gráficos (matplotlib) de la aplicación de riesgo y retorno. Cada función devuelve una Figure.\"\"\"\nimport io\nimport math\n\nimport matplotlib\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\nimport matplotlib.ticker as mticker\nimport numpy as np\n\nimport inversion as iv\n\n# Paleta categórica validada (orden fijo; el color sigue a la entidad, nunca a su posición)\nSERIES = [\"#2a78d6\", \"#eb6834\", \"#1baf7a\", \"#eda100\", \"#e87ba4\", \"#008300\", \"#6250d6\", \"#e34948\"]\nGANANCIA, PERDIDA = \"#1baf7a\", \"#e34948\"            # tramos con R ≥ I₀ y con R < I₀\nBUENO, CRITICO = \"#0b7a0b\", \"#b23232\"\nTEXTO, TEXTO2, REJILLA = \"#0b0b0b\", \"#52514e\", \"#e1e0d9\"\n\nplt.rcParams.update({\n    \"figure.dpi\": 110, \"savefig.dpi\": 150, \"font.size\": 9.5, \"axes.titlesize\": 10.5, \"axes.titleweight\": \"bold\",\n    \"axes.edgecolor\": \"#b9b8b2\", \"axes.labelcolor\": TEXTO2, \"xtick.color\": TEXTO2, \"ytick.color\": TEXTO2,\n    \"axes.grid\": True, \"grid.color\": REJILLA, \"grid.linewidth\": 0.8, \"axes.axisbelow\": True,\n    \"axes.spines.top\": False, \"axes.spines.right\": False, \"legend.frameon\": False,\n})\n\n\ndef _eur(x, d=0):\n    return iv.eur(x, d)\n\n\ndef _fmt_eur(ax, eje=\"y\"):\n    f = mticker.FuncFormatter(lambda v, _: iv.num(v, 0))\n    (ax.yaxis if eje == \"y\" else ax.xaxis).set_major_formatter(f)\n\n\ndef color_escenario(i):\n    return SERIES[i % len(SERIES)]\n\n\ndef _color_tramo(v, I0):\n    return PERDIDA if v < I0 else GANANCIA\n\n\ndef fig_a_png(fig):\n    buf = io.BytesIO()\n    fig.savefig(buf, format=\"png\", bbox_inches=\"tight\", facecolor=\"white\")\n    plt.close(fig)\n    buf.seek(0)\n    return buf\n\n\ndef _vacia(texto, figsize=(9, 3.2)):\n    fig, ax = plt.subplots(figsize=figsize)\n    ax.axis(\"off\")\n    ax.text(0.5, 0.5, texto, ha=\"center\", va=\"center\", color=TEXTO2, fontsize=11, transform=ax.transAxes)\n    return fig\n\n\ndef fig_escalera(sis, u=None, titulo=None):\n    \"\"\"Transformada inversa: probabilidades acumuladas F(i) de los tramos y, si se indica, la altura U y el tramo\n    donde cae.\"\"\"\n    F = np.array(sis[\"F\"]); v = sis[\"v\"]; n = len(F)\n    esc = np.concatenate([[0.0], F])\n    fig, ax = plt.subplots(figsize=(9, 3.6))\n    for i in range(n):\n        c = _color_tramo(v[i], sis[\"I0\"])\n        ax.add_patch(plt.Rectangle((-0.6, esc[i]), n + 0.2, esc[i + 1] - esc[i], color=c, alpha=0.08 + 0.06 * (i % 2), lw=0))\n        ax.plot([i - 0.5, i + 0.5], [F[i], F[i]], color=c, lw=3, solid_capstyle=\"butt\")\n        ax.hlines(F[i], i - 0.5, n - 0.4, color=c, lw=0.8, ls=\":\")\n        ax.text(n - 0.35, (esc[i] + esc[i + 1]) / 2, f\"tramo {i + 1}: {_eur(v[i])}\\n({iv.num(esc[i], 2)}, {iv.num(F[i], 2)}]\",\n                va=\"center\", fontsize=8, color=c)\n    if u is not None:\n        k = int(iv.transformada_inversa(np.array([u]), F)[0])\n        ax.annotate(\"\", xy=(k, u), xytext=(-0.55, u), arrowprops=dict(arrowstyle=\"->\", color=TEXTO, lw=1.6))\n        ax.annotate(\"\", xy=(k, -0.02), xytext=(k, u), arrowprops=dict(arrowstyle=\"->\", color=TEXTO, lw=1.6))\n        ax.plot([k], [u], \"o\", color=TEXTO, ms=6)\n        ax.text(-0.55, min(u + 0.025, 1.0), f\"U = {iv.num(u, 2)}\", fontsize=9, color=TEXTO)\n    ax.set_xlim(-0.6, n + 0.75); ax.set_ylim(-0.03, 1.05)\n    ax.set_xticks(range(n)); ax.set_xticklabels([f\"tramo {i + 1}\\n{_eur(v[i])}\" for i in range(n)])\n    ax.set_ylabel(\"F(i) = p₁ + … + pᵢ\")\n    ax.set_title(titulo or \"Transformada inversa: tramo = menor i tal que U ≤ F(i)\")\n    fig.tight_layout()\n    return fig\n\n\ndef fig_pmf(sis, mc=None, titulo=None):\n    \"\"\"Distribución del retorno: probabilidad teórica de cada valor (barras; rojo si hay pérdida, R < I₀) y\n    frecuencia simulada (rombos), con la inversión inicial I₀.\"\"\"\n    v, p, I0 = np.array(sis[\"v\"]), np.array(sis[\"p\"]), sis[\"I0\"]\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    x = np.arange(len(v))\n    ax.bar(x, p, width=0.6, color=[_color_tramo(a, I0) for a in v])\n    for i in x:\n        ax.text(i, p[i], iv.pct(p[i], 1), ha=\"center\", va=\"bottom\", fontsize=8.5, color=TEXTO)\n    if mc is not None:\n        fr = np.bincount(mc[\"idx\"], minlength=len(v)) / len(mc[\"idx\"])\n        ax.plot(x, fr, \"D\", color=TEXTO, ms=6, label=\"simulada\")\n    ax.set_xticks(x)\n    hueco = max(0, 3 - len(v)) * 0.5               # con 1 o 2 tramos, barras de anchura normal\n    ax.set_xlim(-0.6 - hueco, len(v) - 0.4 + hueco)\n    ax.set_xticklabels([f\"{_eur(a)}\\n(neto {_eur(a - I0)})\" for a in v])\n    ax.yaxis.set_major_formatter(mticker.PercentFormatter(1.0, decimals=0))\n    ax.set_ylim(0, 1.15)\n    from matplotlib.patches import Patch\n    h = [Patch(color=GANANCIA, label=\"teórica · R ≥ I₀\"), Patch(color=PERDIDA, label=\"teórica · R < I₀ (pérdida)\")]\n    if mc is not None:\n        from matplotlib.lines import Line2D\n        h.append(Line2D([], [], ls=\"none\", marker=\"D\", color=TEXTO, label=\"simulada\"))\n    ax.legend(handles=h, loc=\"upper center\", bbox_to_anchor=(0.5, -0.25), ncol=3, fontsize=8)\n    ax.set_title(titulo or f\"Distribución del retorno R · I₀ = {_eur(I0)}\")\n    fig.tight_layout()\n    return fig\n\n\ndef fig_cdf(sis, R=None, titulo=None):\n    \"\"\"Función de distribución del retorno: teórica (escalones) y empírica de la simulación, con I₀.\"\"\"\n    v, p, I0 = np.array(sis[\"v\"]), np.array(sis[\"p\"]), sis[\"I0\"]\n    o = np.argsort(v); vs, F = v[o], np.cumsum(p[o])\n    lo = min(vs.min(), I0); hi = max(vs.max(), I0); m = (hi - lo) * 0.08 or max(1.0, abs(hi) * 0.02)\n    xs = np.concatenate([[lo - m], vs, [hi + m]]); ys = np.concatenate([[0], F, [1]])\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    ax.step(xs, ys, where=\"post\", color=TEXTO, lw=2, label=\"teórica\")\n    if R is not None:\n        rs = np.sort(np.asarray(R)); ye = np.arange(1, len(rs) + 1) / len(rs)\n        ax.step(np.concatenate([[lo - m], rs, [hi + m]]), np.concatenate([[0], ye, [1]]), where=\"post\",\n                color=SERIES[0], lw=1.2, ls=\"--\", label=\"empírica (simulación)\")\n    ax.axvline(I0, color=CRITICO, ls=\":\", lw=1.5, label=f\"I₀ = {_eur(I0)}\")\n    _fmt_eur(ax, \"x\")\n    ax.yaxis.set_major_formatter(mticker.PercentFormatter(1.0, decimals=0))\n    ax.set_xlabel(\"retorno R (€)\"); ax.set_ylabel(\"P(R ≤ x)\")\n    ax.set_title(titulo or \"Función de distribución del retorno\")\n    ax.legend(loc=\"upper left\", fontsize=8)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_traza(traza, sis, titulo=None):\n    \"\"\"Diagrama de funcionamiento: U generado en cada una de las primeras simulaciones y tramo obtenido.\"\"\"\n    if traza is None or len(traza) == 0:\n        return _vacia(\"Sin simulaciones que mostrar\")\n    F = np.array(sis[\"F\"]); esc = np.concatenate([[0.0], F]); v = sis[\"v\"]\n    fig, ax = plt.subplots(figsize=(9, 3.6))\n    for i in range(len(F)):\n        c = _color_tramo(v[i], sis[\"I0\"])\n        ax.axhspan(esc[i], esc[i + 1], color=c, alpha=0.08 + 0.06 * (i % 2), lw=0)\n        ax.axhline(F[i], color=c, lw=0.8, ls=\":\")\n        d = traza[traza[\"Tramo\"] == i + 1]\n        if len(d):\n            ax.vlines(d[\"Simulación\"], 0, d[\"U\"], color=c, lw=1, alpha=0.5)\n            ax.plot(d[\"Simulación\"], d[\"U\"], \"o\" if i % 2 == 0 else \"s\", color=c, ms=5,\n                    label=f\"tramo {i + 1}: {_eur(v[i])} ({len(d)})\")\n    ax.set_xlim(0, len(traza) + 1); ax.set_ylim(0, 1.02)\n    ax.set_xlabel(\"simulación\"); ax.set_ylabel(\"U ~ Unif(0, 1)\")\n    ax.set_title(titulo or f\"Funcionamiento de la transformada inversa · primeras {len(traza)} simulaciones\")\n    ax.legend(loc=\"upper center\", bbox_to_anchor=(0.5, -0.17), ncol=min(4, len(F)), fontsize=8)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_replicas(mc, sis, titulo=None):\n    rep = mc[\"replicas\"]\n    se = rep[\"σ(R)\"] / np.sqrt(rep[\"Simulaciones\"])\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    ax.errorbar(rep.index, rep[\"Media R\"], yerr=iv.Z95 * se, fmt=\"o\", color=SERIES[0], ms=6, capsize=4,\n                label=\"media de la réplica ± IC95 %\")\n    ax.axhline(sis[\"E\"], color=TEXTO, ls=\"--\", lw=1.4, label=f\"teórico {_eur(sis['E'])}\")\n    _fmt_eur(ax)\n    if sis[\"sd\"] == 0:\n        ax.set_ylim(sis[\"E\"] - 100, sis[\"E\"] + 100)\n    ax.set_xticks(rep.index); ax.set_xlabel(\"réplica (semilla)\"); ax.set_ylabel(\"€\")\n    ax.set_title(titulo or \"Retorno medio en cada réplica\")\n    ax.legend(loc=\"best\", fontsize=8)\n    ax.margins(y=0.3)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_riesgo_retorno(res, titulo=None):\n    \"\"\"Riesgo σ(R) frente a retorno medio de cada plan: teórico (círculo) y simulado (cruz con IC95 %).\"\"\"\n    fig, ax = plt.subplots(figsize=(9, 3.8))\n    for i, (n, r) in enumerate(res.items()):\n        t, rm = r[\"teoria\"], r[\"resumen_mc\"]\n        c = color_escenario(i)\n        ax.scatter([t[\"sd\"]], [t[\"E\"]], s=260, color=c, alpha=0.25, lw=0)\n        ax.scatter([t[\"sd\"]], [t[\"E\"]], s=60, color=c, edgecolor=\"white\", lw=1.5, zorder=3)\n        ms, ss = rm.loc[\"Retorno medio E(R)\"], rm.loc[\"Riesgo σ(R)\"]\n        ax.errorbar([ss[\"Simulado · media\"]], [ms[\"Simulado · media\"]],\n                    xerr=[[ss[\"Simulado · media\"] - ss[\"IC95 inf\"]], [ss[\"IC95 sup\"] - ss[\"Simulado · media\"]]],\n                    yerr=[[ms[\"Simulado · media\"] - ms[\"IC95 inf\"]], [ms[\"IC95 sup\"] - ms[\"Simulado · media\"]]],\n                    fmt=\"x\", color=TEXTO, ms=7, capsize=3, zorder=4)\n        ax.annotate(f\"{n}\\nP(pérdida) {iv.pct(t['Ploss'], 0)}\", (t[\"sd\"], t[\"E\"]), xytext=(12, 0),\n                    textcoords=\"offset points\", va=\"center\", fontsize=8.5, color=c, fontweight=\"bold\")\n    from matplotlib.lines import Line2D\n    ax.legend(handles=[Line2D([], [], ls=\"none\", marker=\"o\", color=TEXTO2, label=\"teórico\"),\n                       Line2D([], [], ls=\"none\", marker=\"x\", color=TEXTO, label=\"simulado ± IC95 %\")],\n              loc=\"lower right\", fontsize=8)\n    sds = [r[\"teoria\"][\"sd\"] for r in res.values()]; es = [r[\"teoria\"][\"E\"] for r in res.values()]\n    ax.set_xlim(-0.05 * max(max(sds), 1), max(max(sds), 1) * 1.35)\n    m = (max(es) - min(es)) or max(1.0, abs(max(es)) * 0.02)\n    ax.set_ylim(min(es) - 0.3 * m, max(es) + 0.3 * m)\n    _fmt_eur(ax); _fmt_eur(ax, \"x\")\n    ax.set_xlabel(\"riesgo σ(R) (€) → menos seguro\"); ax.set_ylabel(\"retorno medio (€) → más rentable\")\n    ax.set_title(titulo or \"Riesgo frente a retorno de los planes\")\n    fig.tight_layout()\n    return fig\n\n\ndef fig_comparativa(res):\n    \"\"\"Comparación de planes: retorno esperado, riesgo, probabilidad de pérdida y rentabilidad esperada.\"\"\"\n    nombres = list(res)\n    cols = [color_escenario(i) for i in range(len(nombres))]\n    fig, axs = plt.subplots(1, 4, figsize=(12, 3.9))\n    med = [(\"Retorno esperado E(R) (€)\", [res[n][\"teoria\"][\"E\"] for n in nombres], \"€z\"),\n           (\"Riesgo σ(R) (€)\", [res[n][\"teoria\"][\"sd\"] for n in nombres], \"€\"),\n           (\"Probabilidad de pérdida (%)\", [100 * res[n][\"teoria\"][\"Ploss\"] for n in nombres], \"%\"),\n           (\"Rentabilidad esperada (%)\", [100 * res[n][\"teoria\"][\"rent\"] for n in nombres], \"%\")]\n    for ax, (tit, v, u) in zip(axs, med):\n        barras = ax.bar(range(len(nombres)), v, color=cols, width=0.65)\n        for bb, x in zip(barras, v):\n            ax.text(bb.get_x() + bb.get_width() / 2, bb.get_height(), iv.num(x, 1 if u == \"%\" else 0), ha=\"center\",\n                    va=\"bottom\", fontsize=7.5, color=TEXTO)\n        if u == \"€z\":                       # eje sin empezar en 0 para que se aprecien las diferencias\n            lo, hi = min(v), max(v); m = (hi - lo) or abs(hi) * 0.05 or 1\n            ax.set_ylim(lo - 1.2 * m, hi + 0.5 * m)\n        else:\n            ax.set_ylim(0, max(v) * 1.2 if max(v) > 0 else 1)\n        if u.startswith(\"€\"):\n            _fmt_eur(ax)\n        ax.set_title(tit, fontsize=9)\n        ax.set_xticks(range(len(nombres)))\n        ax.set_xticklabels(nombres, rotation=30 if len(nombres) > 2 else 0,\n                           ha=\"right\" if len(nombres) > 2 else \"center\", fontsize=8)\n    fig.text(0.5, 0.005, \"El eje del retorno esperado no empieza en 0 para que se aprecien las diferencias entre planes.\",\n             ha=\"center\", fontsize=7.5, color=TEXTO2)\n    fig.tight_layout(rect=(0, 0.03, 1, 1))\n    return fig\n\n\ndef fig_validacion(res):\n    \"\"\"Error relativo de la simulación frente a la teoría en E(R), σ(R) y P(pérdida) de cada plan.\"\"\"\n    nombres = list(res)\n    kpis = [(\"Retorno medio E(R)\", \"E(R)\"), (\"Riesgo σ(R)\", \"σ(R)\"), (\"Probabilidad de pérdida P(R < I₀)\", \"P(pérdida)\"),\n            (\"Rentabilidad esperada\", \"rentabilidad\")]\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    ancho = 0.8 / len(nombres)\n    for i, n in enumerate(nombres):\n        rm = res[n][\"resumen_mc\"]\n        v = []\n        for k, _ in kpis:\n            e = rm.loc[k, \"Error relativo\"]\n            v.append(0.0 if e is None or e != e else 100 * e)\n        ax.bar(np.arange(len(kpis)) + i * ancho - 0.4 + ancho / 2, v, width=ancho * 0.9, color=color_escenario(i), label=n)\n    ax.axhline(0, c=TEXTO2, lw=1)\n    ax.set_xticks(range(len(kpis))); ax.set_xticklabels([e for _, e in kpis])\n    ax.set_ylabel(\"error relativo (%)\")\n    ax.set_title(\"Validación: error relativo de la simulación frente a la teoría (0 si el teórico es 0)\")\n    ax.legend(fontsize=8, ncol=min(4, len(nombres)))\n    fig.tight_layout()\n    return fig\n\n\ndef fig_sens_convergencia(df, titulo=None):\n    \"\"\"Medias por réplica (puntos claros), media combinada con IC95 % (punto sólido) y retorno teórico.\"\"\"\n    fig, ax = plt.subplots(figsize=(9, 3.6))\n    x = np.arange(len(df))\n    for i, (_, f) in enumerate(df.iterrows()):\n        ax.plot([i] * len(f[\"Medias por réplica\"]), f[\"Medias por réplica\"], \"o\", color=SERIES[0], alpha=0.3, ms=5)\n    ax.errorbar(x, df[\"Media combinada\"], yerr=[df[\"Media combinada\"] - df[\"IC95 inf\"], df[\"IC95 sup\"] - df[\"Media combinada\"]],\n                fmt=\"o-\", color=SERIES[0], ms=7, capsize=4, label=\"media combinada ± IC95 %\")\n    ax.plot([], [], \"o\", color=SERIES[0], alpha=0.3, label=\"media de cada réplica\")\n    ax.axhline(df[\"Teórico\"].iloc[0], color=TEXTO, ls=\"--\", lw=1.4, label=f\"teórico {_eur(df['Teórico'].iloc[0])}\")\n    ax.set_xticks(x); ax.set_xticklabels([iv.num(v, 0) for v in df.index])\n    _fmt_eur(ax)\n    ax.set_xlabel(\"nsim (simulaciones por réplica)\"); ax.set_ylabel(\"€\")\n    ax.set_title(titulo or \"Convergencia de la estimación hacia el retorno teórico\")\n    ax.legend(loc=\"best\", fontsize=8)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_sens_variabilidad(df, titulo=None):\n    \"\"\"σ entre réplicas de la media estimada (barras) y la predicción teórica σ(R)/√nsim (línea).\"\"\"\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    x = np.arange(len(df))\n    v = df[\"σ entre réplicas\"]\n    ax.bar(x, v, color=SERIES[0], width=0.6, label=\"σ entre réplicas (simulada)\")\n    ax.plot(x, df[\"σ teórica de la media\"], color=TEXTO, marker=\"o\", lw=1.5, label=\"σ(R)/√nsim (teórica)\")\n    for i, y in enumerate(v):\n        ax.text(i, y, iv.num(y, 1), ha=\"center\", va=\"bottom\", fontsize=8, color=TEXTO)\n    ax.set_xticks(x); ax.set_xticklabels([iv.num(t, 0) for t in df.index])\n    ax.set_xlabel(\"nsim (simulaciones por réplica)\"); ax.set_ylabel(\"€\")\n    _fmt_eur(ax)\n    ax.set_title(titulo or \"Variabilidad de la media estimada entre réplicas\")\n    ax.legend(loc=\"upper right\", fontsize=8)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n",
 "informe.py": "# -*- coding: utf-8 -*-\n\"\"\"Informe Word (.docx) de riesgo y retorno de planes de inversión: teoría, simulación, planes y sensibilidad.\"\"\"\nimport datetime\nimport io\nimport math\n\nimport numpy as np\nimport pandas as pd\nimport docx\nfrom docx.shared import Pt, Cm, RGBColor\nfrom docx.enum.text import WD_ALIGN_PARAGRAPH\nfrom docx.enum.table import WD_TABLE_ALIGNMENT\nfrom docx.oxml.ns import qn\nfrom docx.oxml import OxmlElement\n\nimport inversion as iv\nfrom inversion import num, pct, eur, fmt_kpi, fmt_mc, fmt_obj\nimport graficos as gr\n\n\ndef _sombrear(celda, color):\n    tcPr = celda._tc.get_or_add_tcPr()\n    shd = OxmlElement(\"w:shd\")\n    shd.set(qn(\"w:val\"), \"clear\"); shd.set(qn(\"w:color\"), \"auto\"); shd.set(qn(\"w:fill\"), color)\n    tcPr.append(shd)\n\n\nANCHO_UTIL_CM = 17.0          # A4 con márgenes de 2 cm\n\n\ndef _cm_por_caracter(pt):\n    return 0.0205 * pt          # anchura media aproximada de un carácter de Calibri\n\n\ndef _anchos(cab, filas, pt):\n    \"\"\"Anchura de cada columna según su contenido; se reparte el ancho útil sin superar la página.\"\"\"\n    nat = []\n    for j, c in enumerate(cab):\n        palabras = max((len(w) for w in str(c).split()), default=1)\n        # los textos largos (con espacios) pueden partirse en varias líneas; los números, no\n        celdas = max((min(len(f[j]), 30) if \" \" in f[j].strip() and len(f[j]) > 30 else len(f[j]) for f in filas),\n                     default=1)\n        nat.append(max(palabras, celdas, 3) * _cm_por_caracter(pt) + 0.3)\n    total = sum(nat)\n    return nat, total\n\n\nclass Informe:\n    \"\"\"Envoltorio sencillo de python-docx con helpers para títulos, párrafos, tablas y figuras.\"\"\"\n\n    def __init__(self, titulo, subtitulo=\"\"):\n        self.doc = docx.Document()\n        sec = self.doc.sections[0]\n        sec.page_width, sec.page_height = Cm(21), Cm(29.7)\n        sec.left_margin = sec.right_margin = Cm(2)\n        sec.top_margin = sec.bottom_margin = Cm(2)\n        estilo = self.doc.styles[\"Normal\"]\n        estilo.font.name = \"Calibri\"; estilo.font.size = Pt(10.5)\n        self.n_tabla, self.n_fig = 0, 0\n        self.doc.add_heading(titulo, level=0)\n        if subtitulo:\n            p = self.doc.add_paragraph(subtitulo); p.runs[0].italic = True\n\n    def h(self, texto, nivel=1):\n        self.doc.add_heading(texto, level=nivel)\n\n    def p(self, texto, negrita_inicio=None):\n        par = self.doc.add_paragraph()\n        if negrita_inicio and texto.startswith(negrita_inicio):\n            par.add_run(negrita_inicio).bold = True\n            par.add_run(texto[len(negrita_inicio):])\n        else:\n            par.add_run(texto)\n        par.paragraph_format.space_after = Pt(6)\n        return par\n\n    def vinetas(self, items):\n        for it in items:\n            self.doc.add_paragraph(it, style=\"List Bullet\")\n\n    def tabla(self, df, titulo, formato=None, indice=True, ancho_fuente=9, nombre_indice=\"\"):\n        \"\"\"Tabla con anchos de columna calculados para que quepa siempre en el ancho de la página: si el contenido\n        no cabe se reduce la letra (hasta 7 pt) y se reparten las columnas proporcionalmente.\"\"\"\n        self.n_tabla += 1\n        cap = self.doc.add_paragraph()\n        cap.add_run(f\"Tabla {self.n_tabla}. {titulo}\").bold = True\n        cap.paragraph_format.keep_with_next = True\n        cols = list(df.columns)\n        cab = ([nombre_indice or (df.index.name or \"\")] if indice else []) + [str(c) for c in cols]\n        filas = []\n        for idx, fila in df.iterrows():\n            filas.append(([num(idx, 0) if isinstance(idx, (int, np.integer)) else str(idx)] if indice else []) +\n                         [formato(idx, c, fila[c]) if formato else _fmt(fila[c]) for c in cols])\n        pt = ancho_fuente\n        nat, total = _anchos(cab, filas, pt)\n        while total > ANCHO_UTIL_CM and pt > 7:\n            pt -= 0.5\n            nat, total = _anchos(cab, filas, pt)\n        anchos = [w * ANCHO_UTIL_CM / total for w in nat] if total > ANCHO_UTIL_CM else \\\n                 [w * min(ANCHO_UTIL_CM / total, 1.6) for w in nat]\n        t = self.doc.add_table(rows=1, cols=len(cab))\n        t.style = \"Table Grid\"; t.alignment = WD_TABLE_ALIGNMENT.CENTER\n        t.autofit = False\n        tblPr = t._tbl.tblPr\n        lay = OxmlElement(\"w:tblLayout\"); lay.set(qn(\"w:type\"), \"fixed\"); tblPr.append(lay)\n        # la fila de cabecera se repite si la tabla continúa en otra página\n        trPr = t.rows[0]._tr.get_or_add_trPr()\n        rep = OxmlElement(\"w:tblHeader\"); rep.set(qn(\"w:val\"), \"true\"); trPr.append(rep)\n        for j, col in enumerate(t.columns):          # rejilla de la tabla (la que usan Word y LibreOffice)\n            col.width = Cm(anchos[j])\n        for j, c in enumerate(cab):\n            cel = t.rows[0].cells[j]; cel.text = \"\"; cel.width = Cm(anchos[j])\n            r = cel.paragraphs[0].add_run(str(c)); r.bold = True; r.font.size = Pt(pt)\n            r.font.color.rgb = RGBColor(0xFF, 0xFF, 0xFF)\n            if j > 0 or not indice:\n                cel.paragraphs[0].alignment = WD_ALIGN_PARAGRAPH.RIGHT\n            _sombrear(cel, \"2F5496\")\n        for i, vals in enumerate(filas):\n            celdas = t.add_row().cells\n            for j, v in enumerate(vals):\n                celdas[j].text = \"\"; celdas[j].width = Cm(anchos[j])\n                r = celdas[j].paragraphs[0].add_run(v); r.font.size = Pt(pt)\n                if j > 0 or not indice:\n                    celdas[j].paragraphs[0].alignment = WD_ALIGN_PARAGRAPH.RIGHT\n                if i % 2 == 1:\n                    _sombrear(celdas[j], \"EAF0F8\")\n        self.doc.add_paragraph()\n\n    def figura(self, fig, titulo, ancho_cm=16.5):\n        self.n_fig += 1\n        self.doc.add_picture(gr.fig_a_png(fig), width=Cm(ancho_cm))\n        self.doc.paragraphs[-1].alignment = WD_ALIGN_PARAGRAPH.CENTER\n        self.doc.paragraphs[-1].paragraph_format.keep_with_next = True\n        cap = self.doc.add_paragraph(); cap.alignment = WD_ALIGN_PARAGRAPH.CENTER\n        r = cap.add_run(f\"Figura {self.n_fig}. {titulo}\"); r.italic = True; r.font.size = Pt(9)\n\n    def salto(self):\n        self.doc.add_page_break()\n\n    def guardar(self):\n        buf = io.BytesIO()\n        self.doc.save(buf)\n        return buf.getvalue()\n\n\ndef _fmt(v):\n    if isinstance(v, (bool, np.bool_)):\n        return \"Sí\" if v else \"No\"\n    if v is None:\n        return \"—\"\n    if isinstance(v, (int, np.integer)):\n        return num(v, 0)\n    if isinstance(v, (float, np.floating)):\n        return \"—\" if math.isnan(v) else num(v, 3)\n    return str(v)\n\n\ndef fmt_tramos(fila, col, v):\n    if col.startswith((\"Teórica\", \"Simulada\")):\n        return pct(v, 2)\n    if \"€\" in col:\n        return eur(v, 0)\n    return str(v)\n\n\ndef fmt_euros(fila, col, v):\n    return eur(v, 0)\n\n\ndef fmt_sens(fila, col, v):\n    if col == \"Simulaciones totales\":\n        return num(v, 0)\n    if col == \"Error relativo\":\n        return pct(v, 3)\n    return eur(v, 1) if \"σ\" in col else eur(v, 0)\n\n\ndef tabla_sens(df):\n    return df.drop(columns=[\"Medias por réplica\"])\n\n\ndef generar_informe(res, comunes, ajustes, titulo=\"Riesgo y retorno de planes de inversión\", sens=None):\n    inf = Informe(titulo, f\"Informe generado automáticamente el {datetime.datetime.now():%d/%m/%Y %H:%M} · \"\n                          \"transformada inversa, simulación Monte Carlo y comparación de planes de inversión\")\n    I0 = comunes[\"I0\"]\n    # 1. Planteamiento\n    inf.h(\"1. Planteamiento y parámetros\", 1)\n    inf.p(f\"Una empresa dispone de una inversión inicial I₀ = {eur(I0)} y puede elegir entre varios planes. El retorno R \"\n          \"de cada plan es una variable aleatoria discreta: toma los valores v₁, …, v_k con probabilidades p₁, …, p_k. \"\n          \"R se genera por el método de la transformada inversa: se lanza U ~ Unif(0, 1) y se toma el menor i con \"\n          \"U ≤ F(i) = p₁ + … + pᵢ. Para cada plan se estudian el retorno esperado E(R) = Σ pᵢ·vᵢ, el riesgo \"\n          \"σ(R) = √(Σ pᵢ·(vᵢ − E(R))²) y la probabilidad de pérdida patrimonial P(R < I₀).\")\n    esc = pd.DataFrame({n: {\"Tramos\": num(r[\"teoria\"][\"tramos\"], 0),\n                            \"Retornos posibles (€)\": \" / \".join(num(x, 0) for x in r[\"teoria\"][\"v\"]),\n                            \"Probabilidades\": \" / \".join(pct(x, 0) for x in r[\"teoria\"][\"p\"])}\n                        for n, r in res.items()})\n    inf.tabla(esc, \"Planes de inversión (escenarios) analizados\", nombre_indice=\"Parámetro\", formato=lambda f, c, v: v)\n    desc = [f\"{n}: {r['esc']['descripcion']}\" for n, r in res.items() if r[\"esc\"].get(\"descripcion\")]\n    if desc:\n        inf.vinetas(desc)\n    ob = comunes[\"objetivos\"]\n    def o(k, f):\n        return f(ob[k]) if ob.get(k) is not None else \"no se evalúa\"\n    com = pd.DataFrame({\"Valor\": {\n        \"Inversión inicial I₀\": eur(I0),\n        \"Objetivo · rentabilidad esperada mínima\": o(\"RENT_MIN\", lambda v: pct(v, 1)),\n        \"Objetivo · probabilidad de pérdida máxima\": o(\"PLOSS_MAX\", lambda v: pct(v, 1)),\n        \"Objetivo · riesgo σ(R) máximo\": o(\"SIGMA_MAX\", lambda v: eur(v)),\n        \"Objetivo · resultado neto mínimo en el peor 5 %\": o(\"P5NETO_MIN\", lambda v: eur(v)),\n        \"Simulación · simulaciones por réplica (nsim)\": num(ajustes[\"nsim\"], 0),\n        \"Simulación · réplicas (semillas)\": f\"{ajustes['replicas']} (semillas {ajustes['semilla']} … \"\n                                            f\"{int(ajustes['semilla']) + int(ajustes['replicas']) - 1})\"}})\n    inf.tabla(com, \"Parámetros comunes, objetivos y ajustes de simulación\", nombre_indice=\"Parámetro\",\n              formato=lambda f, c, v: v)\n\n    # 2. Síntesis\n    inf.h(\"2. Síntesis y recomendación\", 1)\n    for n, r in res.items():\n        inf.p(iv.texto_escenario(n, r), negrita_inicio=n + \":\")\n    inf.p(\"Recomendación: \" + iv.texto_recomendacion(res), negrita_inicio=\"Recomendación:\")\n    if len(res) > 1:\n        inf.tabla(iv.tabla_comparativa(res), \"Comparación de planes (filas «Teórico»: fórmulas exactas; filas \"\n                  \"«Simulado»: media de las réplicas)\", formato=fmt_kpi, nombre_indice=\"KPI\")\n        inf.tabla(iv.tabla_objetivos(res), \"Cumplimiento de los objetivos (valores teóricos)\", nombre_indice=\"Objetivo\",\n                  formato=lambda f, c, v: str(v))\n        inf.figura(gr.fig_riesgo_retorno(res), \"Riesgo frente a retorno: valores teóricos y simulados con su IC95 %\")\n        inf.figura(gr.fig_comparativa(res), \"Retorno esperado, riesgo, probabilidad de pérdida y rentabilidad por plan (teóricos)\")\n        inf.figura(gr.fig_validacion(res), \"Error relativo de la simulación frente a los valores teóricos\")\n\n    # 3. Detalle por plan\n    for k, (n, r) in enumerate(res.items(), start=3):\n        inf.salto()\n        t, mc = r[\"teoria\"], r[\"mc\"]\n        inf.h(f\"{k}. Plan «{n}»\", 1)\n        if r[\"esc\"].get(\"descripcion\"):\n            inf.p(r[\"esc\"][\"descripcion\"])\n        inf.h(f\"{k}.1 Resultados teóricos\", 2)\n        teo = pd.DataFrame({\"Valor\": {\n            \"Retorno esperado E(R) = Σ pᵢ·vᵢ\": eur(t[\"E\"]),\n            \"Riesgo σ(R)\": eur(t[\"sd\"], 1),\n            \"Coeficiente de variación σ(R)/E(R)\": pct(t[\"CV\"], 2),\n            \"Resultado neto esperado E(R) − I₀\": eur(t[\"neto\"]),\n            \"Rentabilidad esperada (E(R) − I₀)/I₀\": pct(t[\"rent\"], 2),\n            \"Probabilidad de pérdida P(R < I₀)\": pct(t[\"Ploss\"], 2),\n            \"Pérdida esperada E[max(I₀ − R, 0)]\": eur(t[\"perdida_media\"]),\n            \"Percentil 5 de R\": eur(t[\"P5\"]),\n            \"Resultado neto en el peor 5 % (P5 − I₀)\": eur(t[\"P5_neto\"]),\n            \"Retorno mínimo / máximo posible\": f\"{eur(t['min'])} / {eur(t['max'])}\"}})\n        inf.tabla(teo, f\"KPIs teóricos · {n}\", nombre_indice=\"Medida\", formato=lambda f, c, v: v)\n        inf.tabla(r[\"objetivos\"], f\"Objetivos (valores teóricos) · {n}\", formato=fmt_obj, nombre_indice=\"Objetivo\")\n\n        inf.h(f\"{k}.2 Resultados simulados\", 2)\n        inf.p(f\"{ajustes['replicas']} réplicas independientes de {num(ajustes['nsim'], 0)} simulaciones por \"\n              \"transformada inversa. Cada KPI se calcula en cada réplica; la tabla muestra la media de las réplicas y su \"\n              \"IC95 % (t de Student). Todos los planes usan las mismas semillas (números aleatorios comunes).\")\n        inf.tabla(r[\"resumen_mc\"], f\"KPIs simulados frente a teóricos · {n}\", formato=fmt_mc, nombre_indice=\"KPI\")\n        inf.figura(gr.fig_replicas(mc, t, f\"Retorno medio en cada réplica · {n}\"),\n                   f\"Media de cada réplica con su IC95 % y valor teórico · {n}\")\n\n        inf.h(f\"{k}.3 Distribución del retorno (teórica y simulada)\", 2)\n        inf.tabla(iv.tabla_tramos(t, mc), f\"Tramos del plan e intervalo de U de la transformada inversa · {n}\",\n                  formato=fmt_tramos, nombre_indice=\"Tramo\")\n        inf.figura(gr.fig_pmf(t, mc, f\"Distribución del retorno · {n}\"),\n                   f\"Probabilidad de cada retorno: teórica (barras) y simulada (rombos) · {n}\")\n        inf.figura(gr.fig_cdf(t, mc[\"R\"], f\"Función de distribución del retorno · {n}\"),\n                   f\"Función de distribución teórica y empírica del retorno, con la inversión inicial I₀ · {n}\")\n        inf.tabla(iv.tabla_cuantiles(t, mc), f\"Percentiles del retorno · {n}\", formato=fmt_euros, nombre_indice=\"Percentil\")\n\n        inf.h(f\"{k}.4 Funcionamiento simulado\", 2)\n        u0 = float(mc[\"traza\"][\"U\"].iloc[0])\n        inf.figura(gr.fig_escalera(t, u0, f\"Transformada inversa · {n}\"),\n                   f\"Probabilidades acumuladas F(i) y primera simulación (U = {num(u0, 2)}) · {n}\")\n        inf.figura(gr.fig_traza(mc[\"traza\"], t, f\"Primeras {len(mc['traza'])} simulaciones · {n}\"),\n                   f\"U generado y tramo obtenido en las primeras {len(mc['traza'])} simulaciones · {n}\")\n\n    if sens is not None:\n        inf.salto()\n        df, cfg = sens[\"df\"], sens[\"cfg\"]\n        inf.h(f\"{len(res) + 3}. Sensibilidad del estimador Monte Carlo\", 1)\n        inf.p(f\"Plan «{cfg['plan']}». Se varía nsim entre {num(df.index.min(), 0)} y {num(df.index.max(), 0)} \"\n              f\"({len(df)} puntos en escala logarítmica) con {cfg['replicas']} réplicas por punto (semillas \"\n              f\"{cfg['semilla']} … {cfg['semilla'] + cfg['replicas'] - 1}). \" + sens[\"texto\"])\n        inf.figura(gr.fig_sens_convergencia(df), \"Convergencia de la estimación hacia el retorno teórico\")\n        inf.figura(gr.fig_sens_variabilidad(df), \"Variabilidad de la media estimada entre réplicas y predicción σ(R)/√nsim\")\n        inf.tabla(tabla_sens(df), \"Barrido del número de simulaciones\", formato=fmt_sens, nombre_indice=\"nsim\")\n\n    inf.salto()\n    inf.h(\"Anexo. Metodología\", 1)\n    inf.vinetas([\n        \"Transformada inversa: F(i) = p₁ + … + pᵢ; con U ~ Unif(0, 1), R = vᵢ para el menor i tal que U ≤ F(i). Así \"\n        \"P(R = vᵢ) = P(F(i−1) < U ≤ F(i)) = pᵢ.\",\n        \"Retorno esperado E(R) = Σ pᵢ·vᵢ ; riesgo σ(R) = √(Σ pᵢ·(vᵢ − E(R))²) ; CV = σ(R)/E(R).\",\n        \"Probabilidad de pérdida P(R < I₀) = Σ_{vᵢ < I₀} pᵢ ; pérdida esperada = Σ pᵢ·max(I₀ − vᵢ, 0).\",\n        \"Rentabilidad esperada = (E(R) − I₀)/I₀ ; percentiles: menor valor x con P(R ≤ x) ≥ q.\",\n        \"IC95 % de los KPIs simulados: media de las réplicas ± t₀.₉₇₅·s/√R. En la sensibilidad, IC95 % de la media \"\n        \"combinada: media ± 1,96·s/√(simulaciones); la σ de la media de nsim simulaciones es σ(R)/√nsim.\",\n        \"Basado en el Ejemplo 2 de «B-70. Distribuciones derivadas», Javier Morales y Asun Martínez Mayoral, equipo \"\n        \"IA4LEGOS (CC BY-SA 4.0).\",\n    ])\n    return inf.guardar()\n"
};
