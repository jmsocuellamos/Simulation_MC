  <div id="carga">
    <h1>🛒 Beneficio esperado por mixtura</h1>
    <p>Cargando Python en el navegador e instalando los paquetes (pandas, SciPy, matplotlib…).
       La primera vez puede tardar uno o dos minutos; después el navegador lo guarda en caché.</p>
    <div class="barra"><div></div></div>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
    const ficheros = {
 "app.py": "# -*- coding: utf-8 -*-\n\"\"\"Beneficio esperado por mixtura (¿compra o no compra?) · aplicación Streamlit.\nMixtura en dos pasos, simulación Monte Carlo del beneficio por cliente, comparación de estrategias comerciales,\nsensibilidad del estimador e informe Word.\n\nEjecutar con:   streamlit run app.py\n\"\"\"\nimport copy\nimport datetime\nimport io\nimport json\nimport sys\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\nimport matplotlib.pyplot as plt\n\nimport mixtura as mx\nimport graficos as gr\nimport informe\nfrom mixtura import num, pct, eur\n\nst.set_page_config(page_title=\"Simulador · Mixtura\", page_icon=\"🛒\", layout=\"wide\")\nEN_NAVEGADOR = sys.platform == \"emscripten\"\n\nMODELOS_DEF = [\"Sencillo\", \"Estándar\", \"Lujo\"]\nESCENARIOS_DEF = {\n    \"Actual\": {\"pcompra\": 50.0, \"modelos\": MODELOS_DEF, \"valores\": [30.0, 60.0, 75.0], \"probs\": [25.0, 50.0, 25.0],\n               \"coste\": 0.0, \"descripcion\": \"Situación actual: compra la mitad de los clientes; sencillo 25 %, estándar 50 % y lujo 25 %.\"},\n    \"Captación\": {\"pcompra\": 60.0, \"modelos\": MODELOS_DEF, \"valores\": [30.0, 60.0, 75.0], \"probs\": [25.0, 50.0, 25.0],\n                  \"coste\": 3.0, \"descripcion\": \"Más vendedores en tienda: compra el 60 % de los clientes, con un coste de 3 € por cliente que entra.\"},\n    \"Promoción del lujo\": {\"pcompra\": 50.0, \"modelos\": MODELOS_DEF, \"valores\": [30.0, 60.0, 75.0],\n                           \"probs\": [15.0, 45.0, 40.0], \"coste\": 1.5,\n                           \"descripcion\": \"Exposición y financiación de la gama alta: el lujo sube al 40 % de las compras, con un coste de 1,5 € por cliente.\"},\n}\nCOMUNES_DEF = {\"visitantes\": 200, \"objetivos\": dict(mx.OBJETIVOS_DEF)}\nAJUSTES_DEF = {\"nsim\": 20000, \"replicas\": 5, \"semilla\": 1000}\nSENS_DEF = {\"nsim_min\": 200, \"nsim_max\": 50000, \"puntos\": 6, \"replicas\": 5, \"metrica\": \"compradores\"}\nCOL_M, COL_V, COL_P = \"Modelo\", \"Ganancia (€)\", \"Probabilidad (%)\"\n\n# ==============================================================================================\n# Estado de la sesión\n# ==============================================================================================\nss = st.session_state\nif \"escenarios\" not in ss:\n    ss.escenarios = copy.deepcopy(ESCENARIOS_DEF)\n    ss.comunes = copy.deepcopy(COMUNES_DEF)\n    ss.ajustes = copy.deepcopy(AJUSTES_DEF)\n    ss.sens_cfg = copy.deepcopy(SENS_DEF)\n    ss.resultados = None\n    ss.sens = None\n    ss.informe_bytes = None\n    ss.version = 0\n    ss.esc_activo = next(iter(ss.escenarios))\n    ss.u1, ss.u2 = 0.45, 0.55\n\n\ndef ver_fig(contenedor, fig):\n    \"\"\"Muestra una figura de matplotlib y la cierra para no acumular memoria entre ejecuciones.\"\"\"\n    contenedor.pyplot(fig, use_container_width=True)\n    plt.close(fig)\n\n\ndef tabla_fmt(df, fn):\n    out = df.copy().astype(object)\n    for f in df.index:\n        for c in df.columns:\n            out.loc[f, c] = fn(f, c, df.loc[f, c])\n    return out\n\n\ndef mostrar_tabla(df, fn=None, primera=\"\", ancho_primera=\"medium\", iconos=False):\n    \"\"\"Tabla a todo el ancho, con todos los valores ya formateados, la primera columna con el nombre de la fila y\n    una altura que muestra todas las filas sin barra de desplazamiento.\"\"\"\n    d = (tabla_fmt(df, fn) if fn else df.astype(object)).copy()\n    nombre = primera or df.index.name or \" \"\n    d.index = [num(i, 0) if isinstance(i, (int, np.integer)) else str(i) for i in d.index]\n    d.index.name = nombre\n    d = d.reset_index()\n    d.columns = [str(c) for c in d.columns]\n    cfg = {nombre: st.column_config.TextColumn(nombre, width=ancho_primera)}\n    for c in d.columns[1:]:\n        et = c\n        if iconos and c.startswith((\"Teóric\", \"Simulad\")):\n            et = (\"📐 \" if c.startswith(\"Teóric\") else \"🎲 \") + c\n        cfg[c] = st.column_config.TextColumn(et)\n    st.dataframe(d.astype(str), use_container_width=True, hide_index=True, column_config=cfg,\n                 height=38 + 35 * len(d))\n\n\ndef clave(*partes):\n    \"\"\"Clave de widget ligada a la versión de la configuración (al cargar o restablecer se regeneran).\"\"\"\n    return \"__\".join(str(p) for p in partes) + f\"__v{ss.version}\"\n\n\ndef configuracion():\n    return {\"comunes\": ss.comunes, \"ajustes\": ss.ajustes, \"escenarios\": ss.escenarios, \"sensibilidad\": ss.sens_cfg}\n\n\ndef cargar_configuracion(d):\n    ss.comunes = {**copy.deepcopy(COMUNES_DEF), **d.get(\"comunes\", {})}\n    ss.comunes[\"objetivos\"] = {**mx.OBJETIVOS_DEF, **d.get(\"comunes\", {}).get(\"objetivos\", {})}\n    ss.ajustes = {**copy.deepcopy(AJUSTES_DEF), **{k: v for k, v in d.get(\"ajustes\", {}).items() if k in AJUSTES_DEF}}\n    ss.sens_cfg = {**copy.deepcopy(SENS_DEF), **d.get(\"sensibilidad\", {})}\n    ss.escenarios = d.get(\"escenarios\") or copy.deepcopy(ESCENARIOS_DEF)\n    ss.esc_activo = next(iter(ss.escenarios))\n    ss.resultados, ss.sens, ss.informe_bytes = None, None, None\n    ss.version += 1\n\n\ndef teoria_plan(e):\n    return mx.teoria_escenario(e, ss.comunes)\n\n\ncom, aj = ss.comunes, ss.ajustes\n\n# ==============================================================================================\n# Barra lateral\n# ==============================================================================================\nwith st.sidebar:\n    st.header(\"⚙️ Simulación\")\n    aj[\"nsim\"] = int(st.number_input(\"Clientes por réplica (nsim)\", 10, 10_000_000, int(aj[\"nsim\"]), 1000,\n                                     key=clave(\"nsim\"), help=\"Número de clientes simulados en cada réplica.\"))\n    aj[\"replicas\"] = int(st.number_input(\"Réplicas (semillas)\", 2, 100, int(aj[\"replicas\"]), key=clave(\"rep\"),\n                                         help=\"Cada réplica usa una semilla distinta (semilla + i); el IC95 % se calcula \"\n                                              \"con la variabilidad entre réplicas. Todas las estrategias usan las mismas \"\n                                              \"semillas (números aleatorios comunes).\"))\n    aj[\"semilla\"] = int(st.number_input(\"Semilla de inicialización\", 0, 10**9, int(aj[\"semilla\"]), key=clave(\"sem\")))\n    st.caption(f\"Por estrategia: {num(aj['nsim'] * aj['replicas'], 0)} clientes simulados en dos pasos.\")\n    nombres = list(ss.escenarios)\n    sel = st.multiselect(\"Estrategias a simular\", nombres, default=nombres, key=clave(\"sel\"))\n    if EN_NAVEGADOR:\n        st.caption(\"En el navegador la simulación es más lenta: con muchas simulaciones o réplicas puede tardar.\")\n    if st.button(\"▶️ Ejecutar análisis\", type=\"primary\", use_container_width=True, disabled=not sel):\n        barra = st.progress(0.0, text=\"Simulando…\")\n        res = {}\n        total = len(sel) * aj[\"replicas\"]\n        for i, n in enumerate(sel):\n            def prog(k, m, i=i, n=n):\n                barra.progress((i * aj[\"replicas\"] + k) / total, text=f\"{n}: réplica {k} de {m}\")\n            res[n] = mx.analizar_escenario(ss.escenarios[n], com, aj, prog)\n        ss.resultados = {\"res\": res, \"comunes\": copy.deepcopy(com), \"ajustes\": copy.deepcopy(aj),\n                         \"fecha\": f\"{datetime.datetime.now():%d/%m/%Y %H:%M}\"}\n        ss.informe_bytes = None\n        barra.progress(1.0, text=\"Análisis completado\")\n\n    st.divider()\n    st.subheader(\"💾 Configuración\")\n    st.download_button(\"Descargar configuración (JSON)\", json.dumps(configuracion(), ensure_ascii=False, indent=2),\n                       \"configuracion_mixtura.json\", \"application/json\", use_container_width=True)\n    fich = st.file_uploader(\"Cargar configuración (JSON)\", type=\"json\", key=clave(\"json\"))\n    if fich is not None and st.button(\"Aplicar configuración cargada\", use_container_width=True):\n        cargar_configuracion(json.loads(fich.getvalue().decode(\"utf-8\")))\n        st.rerun()\n    if st.button(\"↺ Restablecer valores por defecto\", use_container_width=True):\n        cargar_configuracion({})\n        st.rerun()\n\n# ==============================================================================================\n# Cabecera\n# ==============================================================================================\nst.title(\"🛒 Beneficio esperado por mixtura\")\nst.caption(\"¿Compra o no compra? Mixtura en dos pasos (indicador de compra y transformada inversa para el modelo), \"\n           \"simulación Monte Carlo del beneficio por cliente, comparación de estrategias comerciales, sensibilidad del \"\n           \"estimador e informe Word. Basado en el Ejemplo 4 de «B-70. Distribuciones derivadas», Javier Morales y Asun \"\n           \"Martínez Mayoral, equipo IA4LEGOS (CC BY-SA 4.0).\")\ntab_com, tab_esc, tab_res, tab_sens, tab_inf = st.tabs([\"🌐 Parámetros comunes\", \"🏕️ Estrategias\", \"📊 Resultados\",\n                                                        \"🔬 Sensibilidad\", \"📄 Informe\"])\n\n# ==============================================================================================\n# 1) Parámetros comunes\n# ==============================================================================================\nwith tab_com:\n    st.subheader(\"Parámetros comunes a todas las estrategias\")\n    c1, c2 = st.columns([2, 3])\n    with c1:\n        st.markdown(\"#### 🏬 Tienda\")\n        com[\"visitantes\"] = int(st.number_input(\"Clientes que entran por día\", 1, 10_000_000, int(com[\"visitantes\"]), 10,\n                                                key=clave(\"vis\"), help=\"Para expresar el beneficio neto diario.\"))\n    with c2:\n        st.markdown(\"#### 🏆 Objetivos\")\n        st.caption(\"Criterios que deben cumplir las estrategias (se evalúan sobre los valores teóricos). \"\n                   \"Desmarca un objetivo para no evaluarlo.\")\n        ob = com[\"objetivos\"]\n        def objetivo(clave_obj, etiqueta, defecto, factor, paso, ayuda):\n            cc1, cc2 = st.columns([1, 2])\n            activo = cc1.checkbox(\"Evaluar\", value=ob.get(clave_obj) is not None, key=clave(\"obj_on\", clave_obj))\n            v = ob.get(clave_obj) if ob.get(clave_obj) is not None else defecto\n            x = cc2.number_input(etiqueta, -1e12, 1e12, float(v) * factor, paso, key=clave(\"obj\", clave_obj), help=ayuda,\n                                 disabled=not activo)\n            ob[clave_obj] = (x / factor) if activo else None\n        objetivo(\"BNETO_MIN\", \"Beneficio neto mín. (€/cliente)\", 29.0, 1, 0.5,\n                 \"Beneficio neto medio mínimo por cliente que entra (tras el coste comercial).\")\n        objetivo(\"PCOMPRA_MIN\", \"Proporción que compra mín. (%)\", 0.55, 100, 1.0,\n                 \"Proporción mínima de clientes que acaban comprando.\")\n        objetivo(\"BCOMPRA_MIN\", \"Beneficio por comprador mín. (€)\", 58.0, 1, 0.5,\n                 \"Beneficio medio mínimo por cliente que compra, E(B | compra).\")\n        objetivo(\"ALTA_MIN\", \"Compras de gama alta mín. (%)\", 0.80, 100, 1.0,\n                 \"Proporción mínima de compras que no son del primer modelo de la lista (gama básica).\")\n\n# ==============================================================================================\n# 2) Planes (escenarios)\n# ==============================================================================================\nwith tab_esc:\n    st.subheader(\"Estrategias comerciales\")\n    nombres = list(ss.escenarios)\n    if ss.esc_activo not in nombres:\n        ss.esc_activo = nombres[0]\n    c1, c2, c3, c4 = st.columns([3, 2, 1, 1])\n    activo = c1.selectbox(\"Estrategia a editar\", nombres, index=nombres.index(ss.esc_activo), key=clave(\"activo\"))\n    ss.esc_activo = activo\n    nuevo = c2.text_input(\"Nombre para copiar / renombrar\", key=clave(\"nuevo_nombre\"), placeholder=\"nombre de la estrategia\")\n    if c3.button(\"Copiar\", use_container_width=True, help=\"Crea una estrategia nueva copiando la actual\"):\n        if nuevo and nuevo not in ss.escenarios:\n            ss.escenarios[nuevo] = copy.deepcopy(ss.escenarios[activo]); ss.esc_activo = nuevo; ss.version += 1; st.rerun()\n        else:\n            st.warning(\"Escribe un nombre nuevo que no exista.\")\n    if c4.button(\"Renombrar\", use_container_width=True):\n        if nuevo and nuevo not in ss.escenarios:\n            ss.escenarios = {(nuevo if k == activo else k): v for k, v in ss.escenarios.items()}\n            ss.esc_activo = nuevo; ss.version += 1; st.rerun()\n        else:\n            st.warning(\"Escribe un nombre nuevo que no exista.\")\n\n    e = ss.escenarios[activo]\n    st.markdown(f\"#### Parámetros de «{activo}»\")\n    c1, c2 = st.columns([2, 3])\n    with c1:\n        cc = st.columns(2)\n        e[\"pcompra\"] = float(cc[0].number_input(\"Pr(compra) (%)\", 0.0, 100.0, float(e[\"pcompra\"]), 1.0, key=clave(\"pc\", activo),\n                                                help=\"De cada 100 clientes que entran, cuántos acaban comprando un horno.\"))\n        e[\"coste\"] = float(cc[1].number_input(\"Coste por cliente (€)\", 0.0, 1e9, float(e.get(\"coste\") or 0.0), 0.5,\n                                              key=clave(\"coste\", activo),\n                                              help=\"Coste comercial de la estrategia por cliente que entra (personal, \"\n                                                   \"publicidad, financiación…). Se descuenta para el beneficio neto.\"))\n        st.caption(f\"Modelos y probabilidades condicionadas a la compra (hasta {mx.MAX_MODELOS}); se normalizan si no \"\n                   \"suman 100 %. Añade o borra filas con los controles de la tabla.\")\n        k_df = clave(\"modelos\", activo)\n        k_base = \"base_\" + k_df\n        if k_base not in ss:          # datos de partida fijos para el editor (evita aplicar dos veces los cambios)\n            ss[k_base] = pd.DataFrame({COL_M: list(e[\"modelos\"]), COL_V: [float(x) for x in e[\"valores\"]],\n                                       COL_P: [float(x) for x in e[\"probs\"]]})\n        ed = st.data_editor(ss[k_base], key=k_df, num_rows=\"dynamic\", use_container_width=True, hide_index=True,\n                            column_config={COL_M: st.column_config.TextColumn(COL_M),\n                                           COL_V: st.column_config.NumberColumn(COL_V, step=1.0, format=\"%.2f\"),\n                                           COL_P: st.column_config.NumberColumn(COL_P, min_value=0.0, max_value=100.0,\n                                                                                step=1.0, format=\"%.1f\")})\n        ed = ed.dropna(subset=[COL_V, COL_P]).head(mx.MAX_MODELOS)\n        if len(ed):\n            e[\"modelos\"] = [str(x) if isinstance(x, str) and x.strip() else f\"Modelo {i + 1}\" for i, x in enumerate(ed[COL_M])]\n            e[\"valores\"] = [float(x) for x in ed[COL_V]]\n            e[\"probs\"] = [float(x) for x in ed[COL_P]]\n        else:\n            st.error(\"La estrategia necesita al menos un modelo con ganancia y probabilidad.\")\n        suma = sum(e[\"probs\"])\n        if abs(suma - 100) > 1e-9:\n            st.warning(f\"Las probabilidades de los modelos suman {num(suma, 1)} %: se normalizan para sumar 100 %.\")\n        e[\"descripcion\"] = st.text_area(\"Descripción\", e.get(\"descripcion\", \"\"), key=clave(\"desc\", activo), height=90)\n\n    t = teoria_plan(e)\n    with c2:\n        st.markdown(\"##### 📐 Vista previa teórica (fórmulas de la mixtura, sin simular)\")\n        m = st.columns(3)\n        m[0].metric(\"E(B | compra)\", eur(t[\"E_compra\"]), help=\"Σ pᵢ·bᵢ: beneficio medio por cliente que compra.\")\n        m[1].metric(\"E(B) por cliente\", eur(t[\"E\"]), help=\"Pr(compra)·E(B | compra): beneficio medio por cliente que entra.\")\n        m[2].metric(\"σ(B) por cliente\", eur(t[\"sd\"]))\n        m = st.columns(3)\n        m[0].metric(\"Beneficio neto por cliente\", eur(t[\"E_neto\"]), help=\"E(B) − coste por cliente.\")\n        m[1].metric(\"Beneficio neto diario\", eur(t[\"dia_neto\"], 0), help=f\"{num(com['visitantes'], 0)} clientes × beneficio neto.\")\n        m[2].metric(\"Compras de gama alta\", pct(t[\"gama_alta\"], 1), help=\"Todos los modelos salvo el primero de la lista.\")\n        ver_fig(st, gr.fig_descomposicion(t))\n\n    with st.expander(\"🎯 Mecanismo · un cliente, dos pasos\", expanded=True):\n        st.caption(\"1 · Se genera U₁ ~ Unif(0, 1): si U₁ < Pr(compra) el cliente compra; si no, B = 0 €.  2 · Solo si \"\n                   \"compra, se genera U₂ ~ Unif(0, 1) y la transformada inversa elige el modelo.  3 · B = ganancia del \"\n                   \"modelo. Repetido muchas veces, reproduce la mixtura.\")\n        c1, c2, c3 = st.columns([2, 2, 1])\n        if c3.button(\"🎲 U₁ y U₂ aleatorios\", use_container_width=True):\n            ss.u1, ss.u2 = float(np.round(np.random.random(), 2)), float(np.round(np.random.random(), 2))\n            ss.pop(\"u1_slider\", None); ss.pop(\"u2_slider\", None)\n        ss.u1 = c1.slider(\"U₁ ~ Unif(0, 1) · ¿compra?\", 0.0, 1.0, float(ss.u1), 0.01, key=\"u1_slider\")\n        ss.u2 = c2.slider(\"U₂ ~ Unif(0, 1) · modelo\", 0.0, 1.0, float(ss.u2), 0.01, key=\"u2_slider\")\n        compra, kmod, ben = mx.un_cliente(t, ss.u1, ss.u2)\n        m = st.columns(4)\n        m[0].metric(\"¿Compra?\", \"Sí\" if compra else \"No\", f\"U₁ {'<' if compra else '≥'} {num(t['pc'], 2)}\", delta_color=\"off\")\n        m[1].metric(\"U₂ usado\", num(ss.u2, 2) if compra else \"—\", \"solo si compra\", delta_color=\"off\")\n        m[2].metric(\"Modelo elegido\", t[\"modelos\"][kmod] if compra else \"—\")\n        m[3].metric(\"Beneficio B\", eur(ben))\n        ver_fig(st, gr.fig_mecanismo(t, ss.u1, ss.u2))\n        c1, c2 = st.columns(2)\n        with c1:\n            st.markdown(\"**Desenlaces de la mixtura** (teóricos)\")\n            mostrar_tabla(mx.tabla_desenlaces(t), informe.fmt_tabla, \"Desenlace\", \"medium\", iconos=True)\n        with c2:\n            st.markdown(\"**Modelos entre los compradores** (teóricos)\")\n            mostrar_tabla(mx.tabla_modelos(t), informe.fmt_tabla, \"Modelo\", \"small\", iconos=True)\n\n    st.divider()\n    c1, c2 = st.columns([3, 1])\n    c1.caption(\"Los cambios se aplican al pulsar «Ejecutar análisis» en la barra lateral.\")\n    if c2.button(\"🗑️ Eliminar esta estrategia\", use_container_width=True, disabled=len(ss.escenarios) <= 1):\n        ss.escenarios.pop(activo); ss.esc_activo = next(iter(ss.escenarios)); ss.version += 1; st.rerun()\n\n# ==============================================================================================\n# 3) Resultados\n# ==============================================================================================\nwith tab_res:\n    R = ss.resultados\n    if R is None:\n        st.info(\"Todavía no hay resultados. Configura las estrategias y pulsa «▶️ Ejecutar análisis» en la barra lateral.\")\n    else:\n        res = R[\"res\"]\n        st.caption(f\"Análisis del {R['fecha']} · {R['ajustes']['replicas']} réplicas de {num(R['ajustes']['nsim'], 0)} \"\n                   f\"clientes · {num(R['comunes']['visitantes'], 0)} clientes/día · semilla {R['ajustes']['semilla']} · \"\n                   f\"estrategias: {', '.join(res)}\")\n        st.info(\"📐 **Teórico**: fórmulas de la mixtura (E(B) = Pr(compra)·Σ pᵢ·bᵢ). \"\n                \"🎲 **Simulado**: simulación en dos pasos (media de las réplicas, con IC95 %).\")\n        r_sin, r_det, r_dat = st.tabs([\"Síntesis y comparación\", \"Detalle por estrategia\", \"Datos de las réplicas (simulados)\"])\n        with r_sin:\n            st.markdown(\"#### Síntesis\")\n            for n, r in res.items():\n                st.markdown(f\"**{n}.** \" + mx.texto_escenario(n, r)[len(n) + 2:])\n            st.success(\"**Recomendación.** \" + mx.texto_recomendacion(res))\n            st.markdown(\"**Comparación de estrategias** (filas «Teórico» = fórmulas; filas «Simulado» = Monte Carlo)\")\n            mostrar_tabla(mx.tabla_comparativa(res), mx.fmt_kpi, \"KPI\", \"large\")\n            c1, c2 = st.columns([2, 3])\n            with c1:\n                st.markdown(\"**Objetivos** (sobre los valores teóricos)\")\n                mostrar_tabla(mx.tabla_objetivos(res), None, \"Objetivo\", \"large\")\n            with c2:\n                ver_fig(st, gr.fig_validacion(res))\n            ver_fig(st, gr.fig_comparativa(res))\n\n        with r_det:\n            n = st.selectbox(\"Estrategia\", list(res), key=\"det_esc\")\n            r = res[n]\n            t, mc, rm = r[\"teoria\"], r[\"mc\"], r[\"resumen_mc\"]\n            d_teo, d_sim, d_dis = st.tabs([\"📐 Resultados teóricos\", \"🎲 Resultados simulados\", \"🔢 Distribución del beneficio\"])\n            with d_teo:\n                st.caption(\"Valores exactos de la mixtura.\")\n                m = st.columns(4)\n                m[0].metric(\"Pr(compra)\", pct(t[\"pc\"], 1))\n                m[1].metric(\"E(B | compra)\", eur(t[\"E_compra\"]))\n                m[2].metric(\"E(B) por cliente\", eur(t[\"E\"]))\n                m[3].metric(\"Pérdida por no compra\", eur(t[\"coste_no_compra\"]), help=\"E(B | compra) − E(B)\")\n                m = st.columns(4)\n                m[0].metric(\"σ(B) por cliente\", eur(t[\"sd\"]))\n                m[1].metric(\"Coste por cliente\", eur(t[\"coste\"]))\n                m[2].metric(\"Beneficio neto por cliente\", eur(t[\"E_neto\"]))\n                m[3].metric(\"Beneficio neto diario\", eur(t[\"dia_neto\"], 0))\n                st.markdown(\"**Objetivos** (evaluados sobre los valores teóricos)\")\n                mostrar_tabla(r[\"objetivos\"], mx.fmt_obj, \"Objetivo\", \"large\")\n                ver_fig(st, gr.fig_descomposicion(t))\n            with d_sim:\n                st.caption(f\"{R['ajustes']['replicas']} réplicas de {num(R['ajustes']['nsim'], 0)} clientes; cada KPI se \"\n                           \"calcula en cada réplica y se muestra la media de las réplicas con su IC95 %.\")\n                m = st.columns(4)\n                for col, (kpi, et, es_pct) in zip(m, [(\"Beneficio medio por cliente E(B)\", \"E(B) simulado\", False),\n                                                      (\"Beneficio medio por comprador E(B | compra)\", \"E(B | compra) simulado\", False),\n                                                      (\"Proporción que compra P(compra)\", \"P(compra) simulada\", True),\n                                                      (\"Beneficio neto por cliente E(B) − coste\", \"Neto simulado\", False)]):\n                    vs, vt = rm.loc[kpi, \"Simulado · media\"], rm.loc[kpi, \"Teórico\"]\n                    f = (lambda x: pct(x, 2)) if es_pct else eur\n                    col.metric(et, f(vs), \"teórico \" + f(vt), delta_color=\"off\")\n                st.markdown(\"**KPIs simulados frente a teóricos**\")\n                mostrar_tabla(rm, mx.fmt_mc, \"KPI\", \"large\")\n                c1, c2 = st.columns(2)\n                ver_fig(c1, gr.fig_replicas(mc, t))\n                ver_fig(c2, gr.fig_traza(mc[\"traza\"], t))\n                with st.expander(f\"Primeros {len(mc['traza'])} clientes (U₁, compra, U₂, modelo y beneficio)\"):\n                    tr = mc[\"traza\"].copy()\n                    tr[\"U1\"] = tr[\"U1\"].map(lambda v: num(v, 4)); tr[\"U2\"] = tr[\"U2\"].map(lambda v: num(v, 4))\n                    tr[\"Compra\"] = tr[\"Compra\"].map(lambda v: \"Sí\" if v else \"No\")\n                    tr[\"Beneficio\"] = tr[\"Beneficio\"].map(eur)\n                    st.dataframe(tr.astype(str), use_container_width=True, hide_index=True)\n            with d_dis:\n                st.markdown(\"**Desenlaces de la mixtura**\")\n                mostrar_tabla(mx.tabla_desenlaces(t, mc), informe.fmt_tabla, \"Desenlace\", \"medium\", iconos=True)\n                st.markdown(\"**Modelos entre los compradores** (intervalo de U₂ de la transformada inversa)\")\n                mostrar_tabla(mx.tabla_modelos(t, mc), informe.fmt_tabla, \"Modelo\", \"small\", iconos=True)\n                ver_fig(st, gr.fig_desenlaces(t, mc))\n\n        with r_dat:\n            st.markdown(\"Resultados **simulados** de cada réplica (una fila por réplica y estrategia).\")\n            largo = pd.concat([r[\"mc\"][\"replicas\"].assign(Estrategia=n) for n, r in res.items()]).reset_index()\n            st.dataframe(largo, use_container_width=True, hide_index=True)\n            buf = io.BytesIO()\n            try:\n                with pd.ExcelWriter(buf, engine=\"openpyxl\") as xw:\n                    largo.to_excel(xw, sheet_name=\"Replicas\", index=False)\n                    mx.tabla_comparativa(res).astype(str).to_excel(xw, sheet_name=\"Comparacion\")\n                    for i, (n, r) in enumerate(res.items(), 1):\n                        mx.tabla_desenlaces(r[\"teoria\"], r[\"mc\"]).to_excel(xw, sheet_name=f\"Desenlaces {i}\")\n                        mx.tabla_modelos(r[\"teoria\"], r[\"mc\"]).to_excel(xw, sheet_name=f\"Modelos {i}\")\n                    if ss.sens is not None:\n                        informe.tabla_sens(ss.sens[\"df\"]).to_excel(xw, sheet_name=\"Sensibilidad\")\n                st.download_button(\"Descargar Excel\", buf.getvalue(), \"resultados_mixtura.xlsx\",\n                                   \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n            except Exception:  # openpyxl no disponible\n                st.download_button(\"Descargar CSV\", largo.to_csv(index=False).encode(\"utf-8\"), \"replicas_mixtura.csv\", \"text/csv\")\n\n# ==============================================================================================\n# 4) Sensibilidad del estimador\n# ==============================================================================================\nwith tab_sens:\n    st.subheader(\"Sensibilidad del estimador Monte Carlo\")\n    st.caption(\"¿Cuánto «tiembla» la estimación según el número de clientes simulados? Para cada nsim se repite la \"\n               \"simulación con varias semillas (semilla de la barra lateral + i).\")\n    sc = ss.sens_cfg\n    c = st.columns(3)\n    sc[\"nsim_min\"] = int(c[0].number_input(\"nsim mínimo\", 10, 10_000_000, int(sc[\"nsim_min\"]), 50, key=clave(\"s_nmin\")))\n    sc[\"nsim_max\"] = int(c[1].number_input(\"nsim máximo\", 20, 10_000_000, int(sc[\"nsim_max\"]), 1000, key=clave(\"s_nmax\")))\n    met = list(mx.METRICAS)\n    sc[\"metrica\"] = c[2].selectbox(\"Métrica a analizar\", met, index=met.index(sc.get(\"metrica\", \"compradores\")),\n                                   format_func=lambda k: mx.METRICAS[k], key=clave(\"s_met\"))\n    c = st.columns(3)\n    sc[\"puntos\"] = int(c[0].slider(\"Puntos a evaluar\", 3, 10, int(sc[\"puntos\"]), key=clave(\"s_pts\")))\n    sc[\"replicas\"] = int(c[1].slider(\"Réplicas por punto\", 2, 20, int(sc[\"replicas\"]), key=clave(\"s_rep\")))\n    pol = c[2].selectbox(\"Estrategia\", list(ss.escenarios), key=clave(\"s_pol\"))\n    c1, c2 = st.columns([3, 1])\n    c1.caption(\"Los puntos se espacian logarítmicamente entre nsim mínimo y máximo. La estrategia toma sus parámetros \"\n               \"de la pestaña Estrategias.\")\n    lanzar = c2.button(\"▶️ Analizar sensibilidad\", type=\"primary\", use_container_width=True)\n    if lanzar:\n        vals = mx.valores_barrido(sc[\"nsim_min\"], sc[\"nsim_max\"], sc[\"puntos\"])\n        tp = teoria_plan(ss.escenarios[pol])\n        barra = st.progress(0.0, text=\"Simulando…\")\n        df = mx.sensibilidad(tp, sc[\"metrica\"], vals, sc[\"replicas\"], aj[\"semilla\"],\n                             lambda k, m: barra.progress(k / m, text=f\"Simulación {k} de {m}\"))\n        texto, red = mx.texto_sensibilidad(df, sc[\"metrica\"], pol)\n        ss.sens = {\"df\": df, \"texto\": texto, \"reduccion\": red,\n                   \"cfg\": {\"replicas\": sc[\"replicas\"], \"estrategia\": pol, \"semilla\": aj[\"semilla\"], \"metrica\": sc[\"metrica\"]}}\n        ss.informe_bytes = None\n        barra.progress(1.0, text=\"Barrido completado\")\n    S = ss.sens\n    if S is None:\n        st.info(\"Pulsa «▶️ Analizar sensibilidad» para ejecutar el barrido.\")\n    else:\n        df, cfg = S[\"df\"], S[\"cfg\"]\n        m = st.columns(4)\n        m[0].metric(\"Métrica analizada\", mx.METRICAS[cfg[\"metrica\"]].split(\" · \")[-1], f\"estrategia «{cfg['estrategia']}»\",\n                    delta_color=\"off\")\n        m[1].metric(\"Rango de nsim\", f\"{num(df.index.min(), 0)} – {num(df.index.max(), 0)}\", f\"{len(df)} puntos\", delta_color=\"off\")\n        m[2].metric(\"Réplicas por punto\", str(cfg[\"replicas\"]), \"semillas independientes\", delta_color=\"off\")\n        m[3].metric(\"Reducción de variabilidad\", (\"×\" + num(S[\"reduccion\"], 1)) if S[\"reduccion\"] else \"—\",\n                    help=\"σ entre réplicas del primer punto frente a la del último.\")\n        c1, c2 = st.columns(2)\n        ver_fig(c1, gr.fig_sens_convergencia(df, cfg[\"metrica\"]))\n        ver_fig(c2, gr.fig_sens_variabilidad(df, cfg[\"metrica\"]))\n        mostrar_tabla(informe.tabla_sens(df), informe.fmt_sens_factory(cfg[\"metrica\"]), \"nsim\", \"small\")\n        st.success(S[\"texto\"])\n\n# ==============================================================================================\n# 5) Informe\n# ==============================================================================================\nwith tab_inf:\n    R = ss.resultados\n    if R is None:\n        st.info(\"Ejecuta primero el análisis para poder generar el informe.\")\n    else:\n        st.markdown(\"El informe Word incluye los parámetros, la síntesis y la recomendación, la comparación de \"\n                    \"estrategias y, para cada estrategia, los resultados teóricos y simulados, la distribución del \"\n                    \"beneficio por cliente y el funcionamiento de la mixtura en dos pasos.\")\n        titulo = st.text_input(\"Título del informe\", \"Beneficio esperado por mixtura\", key=\"tit_inf\")\n        con_sens = st.checkbox(\"Incluir el análisis de sensibilidad\", value=ss.sens is not None,\n                               disabled=ss.sens is None, help=\"Disponible tras ejecutarlo en la pestaña Sensibilidad.\")\n        if st.button(\"📄 Generar informe (.docx)\", type=\"primary\"):\n            with st.spinner(\"Generando informe…\"):\n                ss.informe_bytes = informe.generar_informe(R[\"res\"], R[\"comunes\"], R[\"ajustes\"], titulo,\n                                                           ss.sens if con_sens else None)\n        if ss.informe_bytes:\n            st.download_button(\"⬇️ Descargar informe\", ss.informe_bytes,\n                               f\"Informe_Mixtura_{datetime.date.today():%Y%m%d}.docx\",\n                               \"application/vnd.openxmlformats-officedocument.wordprocessingml.document\")\n",
 "mixtura.py": "# -*- coding: utf-8 -*-\n\"\"\"Beneficio esperado por mixtura: cada cliente que entra en la tienda compra (T = 1) con probabilidad Pr(compra) y,\nsi compra, elige uno de varios modelos de horno (transformada inversa sobre sus probabilidades condicionadas). El\nbeneficio es B = 0 si no compra y B = ganancia del modelo si compra.\n\nTeoría exacta de la mixtura, simulación Monte Carlo en dos pasos con réplicas, comparación de estrategias\ncomerciales (escenarios) con objetivos y sensibilidad del estimador frente a nsim.\n\nBasado en el Ejemplo 4 de «B-70. Distribuciones derivadas», Javier Morales y Asun Martínez Mayoral, equipo IA4LEGOS\n(CC BY-SA 4.0).\"\"\"\nimport math\n\nimport numpy as np\nimport pandas as pd\n\ntry:\n    from scipy import stats as _stats\nexcept Exception:          # pragma: no cover\n    _stats = None\n\nN_DIAGRAMA = 60                 # clientes que se muestran en el diagrama de funcionamiento\nMAX_MODELOS = 8\nZ95 = 1.959963984540054\nNO_COMPRA = \"No compra\"\n\n\ndef normalizar(p):\n    p = np.clip(np.asarray(p, dtype=float), 0, None)\n    s = p.sum()\n    return p / s if s > 0 else np.full(len(p), 1 / len(p))\n\n\ndef limpiar_modelos(nombres, valores, probs):\n    filas = [(str(n), float(v), float(p)) for n, v, p in zip(nombres, valores, probs)\n             if v is not None and p is not None and not (isinstance(v, float) and math.isnan(v))\n             and not (isinstance(p, float) and math.isnan(p))]\n    if not filas:\n        filas = [(\"Modelo\", 0.0, 1.0)]\n    return [f[0] or f\"Modelo {i + 1}\" for i, f in enumerate(filas)], np.array([f[1] for f in filas]), \\\n        normalizar([f[2] for f in filas])\n\n\n# ==============================================================================================\n# Teoría de la mixtura\n# ==============================================================================================\ndef teoria(pcompra, nombres, valores, probs, coste=0.0, visitantes=200, gama_alta=None):\n    \"\"\"E(B|compra) = Σ pᵢ·bᵢ ; E(B) = Pr(compra)·E(B|compra) ; Var(B) = Pr(compra)·Σ pᵢ·bᵢ² − E(B)².\n    `coste` es el coste comercial por cliente que entra; `gama_alta` el número de modelos «de gama alta» (los\n    últimos de la lista) para el objetivo correspondiente.\"\"\"\n    nombres, b, p = limpiar_modelos(nombres, valores, probs)\n    pc = float(min(max(pcompra, 0.0), 1.0))\n    F = np.cumsum(p); F[-1] = 1.0\n    ec = float(p @ b)\n    e2c = float(p @ b ** 2)\n    E = pc * ec\n    var = max(0.0, pc * e2c - E ** 2)\n    sdc = math.sqrt(max(0.0, e2c - ec ** 2))\n    k_alta = len(b) - 1 if gama_alta is None else int(gama_alta)\n    alta = float(p[len(b) - k_alta:].sum()) if k_alta > 0 else 0.0\n    sis = {\"pc\": pc, \"modelos\": tuple(nombres), \"b\": tuple(float(x) for x in b), \"p\": tuple(float(x) for x in p),\n           \"F\": tuple(float(x) for x in F), \"coste\": float(coste), \"visitantes\": int(visitantes),\n           \"E_compra\": ec, \"sd_compra\": sdc, \"E\": E, \"sd\": math.sqrt(var), \"E_neto\": E - float(coste),\n           \"dia_neto\": (E - float(coste)) * int(visitantes), \"gama_alta\": alta,\n           \"contrib\": tuple(pc * float(pi) * float(bi) for pi, bi in zip(p, b)),\n           \"coste_no_compra\": ec - E}\n    sis[\"CV\"] = sis[\"sd\"] / E if E else float(\"nan\")\n    return sis\n\n\ndef resultados_posibles(sis):\n    \"\"\"Desenlaces de la mixtura: no compra (B = 0) o compra del modelo i (B = bᵢ), con su probabilidad\n    incondicional y su contribución a E(B).\"\"\"\n    filas = [{\"Desenlace\": NO_COMPRA, \"Beneficio B (€)\": 0.0, \"P(modelo | compra)\": None,\n              \"Teórica · P(desenlace)\": 1 - sis[\"pc\"], \"Contribución a E(B) (€)\": 0.0}]\n    for m, b, p, c in zip(sis[\"modelos\"], sis[\"b\"], sis[\"p\"], sis[\"contrib\"]):\n        filas.append({\"Desenlace\": f\"Compra · {m}\", \"Beneficio B (€)\": b, \"P(modelo | compra)\": p,\n                      \"Teórica · P(desenlace)\": sis[\"pc\"] * p, \"Contribución a E(B) (€)\": c})\n    return pd.DataFrame(filas).set_index(\"Desenlace\")\n\n\n# ==============================================================================================\n# Simulación en dos pasos\n# ==============================================================================================\ndef transformada_inversa(u, F):\n    return np.minimum(np.searchsorted(np.asarray(F), u, side=\"left\"), len(F) - 1)\n\n\ndef un_cliente(sis, u1, u2):\n    \"\"\"Camino de un cliente con U₁ y U₂ dados: (compra, índice del modelo o −1, beneficio).\"\"\"\n    if u1 < sis[\"pc\"]:\n        k = int(transformada_inversa(np.array([u2]), sis[\"F\"])[0])\n        return True, k, sis[\"b\"][k]\n    return False, -1, 0.0\n\n\ndef simular_clientes(sis, nsim, semilla, n_traza=0):\n    \"\"\"Paso 1: U₁ ~ Unif(0,1); compra si U₁ < Pr(compra). Paso 2 (solo si compra): U₂ ~ Unif(0,1) y transformada\n    inversa sobre las probabilidades de los modelos. Devuelve el beneficio, el indicador de compra y el modelo de\n    cada cliente (−1 si no compra).\"\"\"\n    rng = np.random.default_rng(int(semilla))\n    n = int(nsim)\n    U1 = rng.random(n)\n    U2 = rng.random(n)                     # se genera para todos, pero solo se usa si el cliente compra\n    T = U1 < sis[\"pc\"]\n    idx = np.where(T, transformada_inversa(U2, sis[\"F\"]), -1)\n    B = np.where(T, np.asarray(sis[\"b\"])[np.maximum(idx, 0)], 0.0)\n    traza = None\n    if n_traza:\n        k = min(n_traza, n)\n        traza = pd.DataFrame({\"Cliente\": np.arange(1, k + 1), \"U1\": U1[:k], \"Compra\": T[:k],\n                              \"U2\": np.where(T[:k], U2[:k], np.nan),\n                              \"Modelo\": [sis[\"modelos\"][i] if i >= 0 else \"—\" for i in idx[:k]], \"Beneficio\": B[:k]})\n    return {\"B\": B, \"T\": T, \"idx\": idx, \"traza\": traza}\n\n\ndef _tq(n, alpha=0.05):\n    if n < 2:\n        return float(\"nan\")\n    return float(_stats.t.ppf(1 - alpha / 2, n - 1)) if _stats is not None else 1.96\n\n\ndef montecarlo(sis, nsim, replicas, semilla, progreso=None):\n    \"\"\"`replicas` réplicas de `nsim` clientes (réplica i -> semilla + i); mismas semillas en todas las estrategias.\"\"\"\n    filas, Bs, Ts, Is = [], [], [], []\n    traza = None\n    for r in range(int(replicas)):\n        s = simular_clientes(sis, nsim, int(semilla) + r, n_traza=N_DIAGRAMA if r == 0 else 0)\n        B, T, idx = s[\"B\"], s[\"T\"], s[\"idx\"]\n        if r == 0:\n            traza = s[\"traza\"]\n        nc = int(T.sum())\n        m = float(B.mean())\n        fila = {\"Réplica\": r + 1, \"Semilla\": int(semilla) + r, \"Clientes\": len(B), \"Compradores\": nc,\n                \"E(B)\": m, \"E(B | compra)\": float(B[T].mean()) if nc else float(\"nan\"),\n                \"P(compra)\": nc / len(B), \"E(B) neto\": m - sis[\"coste\"],\n                \"σ(B)\": float(B.std(ddof=1)) if len(B) > 1 else 0.0}\n        fr = np.bincount(idx[T], minlength=len(sis[\"b\"])) / max(1, nc)\n        for i, mod in enumerate(sis[\"modelos\"]):\n            fila[f\"P({mod} | compra)\"] = fr[i]\n        filas.append(fila)\n        Bs.append(B); Ts.append(T); Is.append(idx)\n        if progreso:\n            progreso(r + 1, replicas)\n    return {\"replicas\": pd.DataFrame(filas).set_index(\"Réplica\"), \"B\": np.concatenate(Bs), \"T\": np.concatenate(Ts),\n            \"idx\": np.concatenate(Is), \"traza\": traza}\n\n\ndef _kpis(sis):\n    k = [(\"Beneficio medio por cliente E(B)\", \"E(B)\", sis[\"E\"]),\n         (\"Beneficio medio por comprador E(B | compra)\", \"E(B | compra)\", sis[\"E_compra\"]),\n         (\"Proporción que compra P(compra)\", \"P(compra)\", sis[\"pc\"]),\n         (\"Beneficio neto por cliente E(B) − coste\", \"E(B) neto\", sis[\"E_neto\"]),\n         (\"Desviación típica σ(B)\", \"σ(B)\", sis[\"sd\"])]\n    for m, p in zip(sis[\"modelos\"], sis[\"p\"]):\n        k.append((f\"Proporción de «{m}» entre compradores\", f\"P({m} | compra)\", p))\n    return k\n\n\ndef resumen_mc(mc, sis):\n    rep = mc[\"replicas\"]\n    n = len(rep)\n    tq = _tq(n)\n    filas = []\n    for nombre, col, teo in _kpis(sis):\n        v = rep[col].astype(float)\n        m = float(v.mean())\n        se = float(v.std(ddof=1)) / math.sqrt(n) if n > 1 else float(\"nan\")\n        lo, hi = (m - tq * se, m + tq * se) if n > 1 else (float(\"nan\"), float(\"nan\"))\n        tol = 1e-9 * max(1.0, abs(teo))\n        filas.append({\"KPI\": nombre, \"Teórico\": teo, \"Simulado · media\": m, \"IC95 inf\": lo, \"IC95 sup\": hi,\n                      \"Error relativo\": (m - teo) / abs(teo) if abs(teo) > 1e-12 else None,\n                      \"Teórico en IC95\": bool(lo - tol <= teo <= hi + tol) if n > 1 else None})\n    return pd.DataFrame(filas).set_index(\"KPI\")\n\n\ndef tabla_desenlaces(sis, mc=None):\n    df = resultados_posibles(sis)\n    if mc is not None:\n        n = len(mc[\"B\"])\n        sim = [float((~mc[\"T\"]).sum()) / n] + [float(((mc[\"idx\"] == i) & mc[\"T\"]).sum()) / n for i in range(len(sis[\"b\"]))]\n        df[\"Simulada · P(desenlace)\"] = sim\n        df[\"Simulada · contribución (€)\"] = [0.0] + [s * b for s, b in zip(sim[1:], sis[\"b\"])]\n    return df\n\n\ndef tabla_modelos(sis, mc=None):\n    \"\"\"Distribución condicionada a la compra: probabilidad, acumulada e intervalo de U₂ de cada modelo.\"\"\"\n    filas = []\n    for i, (m, b, p) in enumerate(zip(sis[\"modelos\"], sis[\"b\"], sis[\"p\"])):\n        lo = 0.0 if i == 0 else sis[\"F\"][i - 1]\n        filas.append({\"Modelo\": m, \"Ganancia (€)\": b, \"Intervalo de U₂\": f\"({num(lo, 2)}, {num(sis['F'][i], 2)}]\",\n                      \"Teórica · P(modelo | compra)\": p, \"Teórica · F\": sis[\"F\"][i]})\n    df = pd.DataFrame(filas).set_index(\"Modelo\")\n    if mc is not None:\n        T = mc[\"T\"]\n        fr = np.bincount(mc[\"idx\"][T], minlength=len(sis[\"b\"])) / max(1, int(T.sum()))\n        df[\"Simulada · P(modelo | compra)\"] = fr\n        df[\"Simulada · F\"] = np.cumsum(fr)\n    return df\n\n\n# ==============================================================================================\n# Objetivos (equivalentes a los SLAs de los casos de estudio)\n# ==============================================================================================\nOBJETIVOS_DEF = {\"BNETO_MIN\": 29.0, \"PCOMPRA_MIN\": 0.55, \"BCOMPRA_MIN\": 58.0, \"ALTA_MIN\": 0.80}\n\n\ndef evaluar_objetivos(sis, obj):\n    filas = []\n    def fila(nombre, valor, txt, cumple):\n        filas.append({\"Objetivo\": nombre, \"Valor\": valor, \"Umbral\": txt, \"Cumple\": \"Sí\" if cumple else \"No\"})\n    if obj.get(\"BNETO_MIN\") is not None:\n        fila(\"Beneficio neto por cliente\", sis[\"E_neto\"], f\"≥ {eur(obj['BNETO_MIN'], 2)}\", sis[\"E_neto\"] >= obj[\"BNETO_MIN\"] - 1e-9)\n    if obj.get(\"PCOMPRA_MIN\") is not None:\n        fila(\"Proporción que compra\", sis[\"pc\"], f\"≥ {pct(obj['PCOMPRA_MIN'], 1)}\", sis[\"pc\"] >= obj[\"PCOMPRA_MIN\"] - 1e-12)\n    if obj.get(\"BCOMPRA_MIN\") is not None:\n        fila(\"Beneficio medio por comprador\", sis[\"E_compra\"], f\"≥ {eur(obj['BCOMPRA_MIN'], 2)}\",\n             sis[\"E_compra\"] >= obj[\"BCOMPRA_MIN\"] - 1e-9)\n    if obj.get(\"ALTA_MIN\") is not None:\n        fila(\"Compras de gama alta (todos salvo el 1.er modelo)\", sis[\"gama_alta\"], f\"≥ {pct(obj['ALTA_MIN'], 1)}\",\n             sis[\"gama_alta\"] >= obj[\"ALTA_MIN\"] - 1e-12)\n    return pd.DataFrame(filas, columns=[\"Objetivo\", \"Valor\", \"Umbral\", \"Cumple\"]).set_index(\"Objetivo\")\n\n\n# ==============================================================================================\n# Análisis de un escenario (estrategia) y comparación\n# ==============================================================================================\ndef teoria_escenario(esc, comunes):\n    return teoria(esc[\"pcompra\"] / 100, esc[\"modelos\"], esc[\"valores\"], esc[\"probs\"], esc.get(\"coste\") or 0.0,\n                  comunes[\"visitantes\"])\n\n\ndef analizar_escenario(esc, comunes, ajustes, progreso=None):\n    sis = teoria_escenario(esc, comunes)\n    mc = montecarlo(sis, ajustes[\"nsim\"], ajustes[\"replicas\"], ajustes[\"semilla\"], progreso)\n    return {\"esc\": dict(esc), \"teoria\": sis, \"mc\": mc, \"resumen_mc\": resumen_mc(mc, sis),\n            \"objetivos\": evaluar_objetivos(sis, comunes[\"objetivos\"])}\n\n\ndef tabla_comparativa(res):\n    cols = {}\n    for n, r in res.items():\n        t, rm = r[\"teoria\"], r[\"resumen_mc\"]\n        cols[n] = {\n            \"Parámetro · P(compra)\": t[\"pc\"],\n            \"Parámetro · modelos\": \" / \".join(t[\"modelos\"]),\n            \"Parámetro · ganancias (€)\": \" / \".join(num(b, 0) for b in t[\"b\"]),\n            \"Parámetro · P(modelo | compra)\": \" / \".join(pct(p, 0) for p in t[\"p\"]),\n            \"Parámetro · coste por cliente (€)\": t[\"coste\"],\n            \"Teórico · E(B | compra)\": t[\"E_compra\"], \"Teórico · E(B) por cliente\": t[\"E\"],\n            \"Teórico · σ(B)\": t[\"sd\"], \"Teórico · beneficio neto por cliente\": t[\"E_neto\"],\n            \"Teórico · compras de gama alta\": t[\"gama_alta\"],\n            \"Teórico · beneficio neto diario\": t[\"dia_neto\"],\n            \"Simulado · P(compra)\": rm.loc[\"Proporción que compra P(compra)\", \"Simulado · media\"],\n            \"Simulado · E(B | compra)\": rm.loc[\"Beneficio medio por comprador E(B | compra)\", \"Simulado · media\"],\n            \"Simulado · E(B) por cliente\": rm.loc[\"Beneficio medio por cliente E(B)\", \"Simulado · media\"],\n            \"Simulado · beneficio neto por cliente\": rm.loc[\"Beneficio neto por cliente E(B) − coste\", \"Simulado · media\"],\n            \"Objetivos cumplidos\": f\"{(r['objetivos']['Cumple'] == 'Sí').sum()} de {len(r['objetivos'])}\",\n        }\n    return pd.DataFrame(cols)\n\n\ndef tabla_objetivos(res):\n    return pd.DataFrame({n: r[\"objetivos\"][\"Cumple\"] for n, r in res.items()})\n\n\n# ==============================================================================================\n# Sensibilidad del estimador Monte Carlo frente a nsim\n# ==============================================================================================\nMETRICAS = {\"total\": \"Beneficio medio · todos los clientes\", \"compradores\": \"Beneficio medio · solo compradores\",\n            \"proporcion\": \"Proporción que compra\"}\n\n\ndef valores_barrido(vmin, vmax, puntos):\n    v = np.geomspace(max(1, vmin), max(vmin + 1, vmax), max(2, int(puntos)))\n    return sorted(set(int(round(x)) for x in v))\n\n\ndef _teo_metrica(sis, metrica):\n    return {\"total\": sis[\"E\"], \"compradores\": sis[\"E_compra\"], \"proporcion\": sis[\"pc\"]}[metrica]\n\n\ndef _sd_teo(sis, metrica, nsim):\n    \"\"\"Desviación típica teórica del estimador con nsim clientes.\"\"\"\n    if metrica == \"total\":\n        return sis[\"sd\"] / math.sqrt(nsim)\n    if metrica == \"proporcion\":\n        return math.sqrt(sis[\"pc\"] * (1 - sis[\"pc\"]) / nsim)\n    return sis[\"sd_compra\"] / math.sqrt(max(1e-9, nsim * sis[\"pc\"]))      # nº de compradores ≈ nsim·Pr(compra)\n\n\ndef sensibilidad(sis, metrica, valores, replicas, semilla, progreso=None):\n    \"\"\"Para cada nsim, `replicas` simulaciones con semillas distintas; media de las réplicas, IC95 % con la\n    variabilidad entre réplicas (t de Student) y σ entre réplicas frente a la σ teórica del estimador.\"\"\"\n    filas = []\n    tot = len(valores) * int(replicas)\n    k = 0\n    tq = _tq(int(replicas))\n    teo = _teo_metrica(sis, metrica)\n    for nsim in valores:\n        medias = []\n        for r in range(int(replicas)):\n            s = simular_clientes(sis, nsim, int(semilla) + r)\n            B, T = s[\"B\"], s[\"T\"]\n            if metrica == \"total\":\n                medias.append(float(B.mean()))\n            elif metrica == \"compradores\":\n                medias.append(float(B[T].mean()) if T.any() else 0.0)\n            else:\n                medias.append(float(T.mean()))\n            k += 1\n            if progreso:\n                progreso(k, tot)\n        m = float(np.mean(medias))\n        sdr = float(np.std(medias, ddof=1)) if len(medias) > 1 else 0.0\n        se = sdr / math.sqrt(len(medias))\n        filas.append({\"nsim\": nsim, \"Media de las réplicas\": m, \"IC95 inf\": m - tq * se, \"IC95 sup\": m + tq * se,\n                      \"σ entre réplicas\": sdr, \"σ teórica del estimador\": _sd_teo(sis, metrica, nsim),\n                      \"Teórico\": teo, \"Error relativo\": (m - teo) / abs(teo) if teo else None,\n                      \"Medias por réplica\": medias})\n    return pd.DataFrame(filas).set_index(\"nsim\")\n\n\ndef texto_sensibilidad(df, metrica, estrategia):\n    a, z = df[\"σ entre réplicas\"].iloc[0], df[\"σ entre réplicas\"].iloc[-1]\n    red = a / z if a > 0 and z > 0 else None\n    dentro = ((df[\"IC95 inf\"] <= df[\"Teórico\"]) & (df[\"Teórico\"] <= df[\"IC95 sup\"])).sum()\n    txt = (f\"Estrategia «{estrategia}», métrica «{METRICAS[metrica]}». A medida que crece nsim, la media de las réplicas \"\n           \"se acerca al valor teórico y la dispersión entre semillas se reduce\")\n    txt += (f\" ({num(red, 1)} veces menor entre el primer y el último punto; la teoría, 1/√nsim, predice \"\n            f\"{num(math.sqrt(df.index[-1] / df.index[0]), 1)} veces).\" if red else \".\")\n    txt += f\" El valor teórico queda dentro del IC95 % en {dentro} de los {len(df)} puntos.\"\n    return txt, red\n\n\n# ==============================================================================================\n# Formato y textos\n# ==============================================================================================\ndef num(x, d=2):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    if isinstance(x, float) and math.isinf(x):\n        return \"∞\"\n    if round(float(x), d) == 0:\n        x = 0.0\n    s = f\"{x:,.{d}f}\"\n    return s.replace(\",\", \"X\").replace(\".\", \",\").replace(\"X\", \".\")\n\n\ndef pct(x, d=1):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    return num(100 * x, d) + \" %\"\n\n\ndef eur(x, d=2):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    return num(x, d) + \" €\"\n\n\ndef fmt_kpi(k, c, v):\n    if isinstance(v, str) or v is None:\n        return \"—\" if v is None else v\n    if \"P(\" in k or \"gama alta\" in k:\n        return pct(v, 2)\n    if \"diario\" in k:\n        return eur(v, 0)\n    return eur(v, 2)\n\n\ndef fmt_mc(fila, col, v):\n    if col == \"Teórico en IC95\":\n        return \"—\" if v is None else (\"Sí\" if v else \"No\")\n    if col == \"Error relativo\":\n        return \"—\" if v is None or (isinstance(v, float) and math.isnan(v)) else pct(v, 2)\n    if \"Proporción\" in fila:\n        return pct(v, 2)\n    return eur(v, 2)\n\n\ndef fmt_obj(fila, col, v):\n    if col == \"Valor\":\n        return pct(v, 2) if (\"Proporción\" in fila or \"gama\" in fila) else eur(v, 2)\n    return str(v)\n\n\ndef fmt_metrica(metrica):\n    return (lambda v: pct(v, 2)) if metrica == \"proporcion\" else (lambda v: eur(v, 2))\n\n\ndef texto_escenario(nombre, r):\n    t, rm = r[\"teoria\"], r[\"resumen_mc\"]\n    ok = rm[\"Teórico en IC95\"].dropna()\n    val = (\"la simulación reproduce los valores teóricos (todos dentro del IC95 %)\" if ok.all() else\n           f\"la simulación reproduce los valores teóricos salvo en {', '.join(ok[~ok].index)} (fuera del IC95 %, \"\n           \"lo que puede deberse al azar o a un número de clientes insuficiente)\")\n    txt = (f\"{nombre}: compra el {pct(t['pc'], 0)} de los clientes; entre los compradores, \"\n           + \", \".join(f\"{m} {pct(p, 0)}\" for m, p in zip(t[\"modelos\"], t[\"p\"])) +\n           f\". Beneficio medio por comprador E(B|compra) = {eur(t['E_compra'])} y por cliente que entra \"\n           f\"E(B) = {eur(t['E'])} (valores teóricos); {val}.\")\n    if t[\"coste\"]:\n        txt += f\" Descontado el coste comercial ({eur(t['coste'])} por cliente), el beneficio neto es {eur(t['E_neto'])} por cliente\"\n    else:\n        txt += f\" Beneficio neto por cliente: {eur(t['E_neto'])}\"\n    txt += f\" y {eur(t['dia_neto'], 0)} al día ({num(t['visitantes'], 0)} clientes).\"\n    n_ok = (r[\"objetivos\"][\"Cumple\"] == \"Sí\").sum()\n    txt += f\" Cumple {n_ok} de los {len(r['objetivos'])} objetivos.\"\n    return txt\n\n\ndef texto_recomendacion(res):\n    filas = [(n, (r[\"objetivos\"][\"Cumple\"] == \"Sí\").sum(), r[\"teoria\"]) for n, r in res.items()]\n    max_ok = max(f[1] for f in filas)\n    mejor = sorted([f for f in filas if f[1] == max_ok], key=lambda f: -f[2][\"E_neto\"])[0]\n    rentable = max(filas, key=lambda f: f[2][\"E_neto\"])\n    peor = min(filas, key=lambda f: f[2][\"E_neto\"])\n    txt = (f\"Se recomienda «{mejor[0]}»: es la estrategia que cumple más objetivos ({mejor[1]} de \"\n           f\"{len(res[mejor[0]]['objetivos'])}) y, entre ellas, la de mayor beneficio neto por cliente \"\n           f\"({eur(mejor[2]['E_neto'])}, {eur(mejor[2]['dia_neto'], 0)} al día).\")\n    if rentable[0] != mejor[0]:\n        txt += (f\" La de mayor beneficio neto es «{rentable[0]}» ({eur(rentable[2]['E_neto'])} por cliente), pero \"\n                f\"cumple menos objetivos ({rentable[1]}).\")\n    if peor[0] != mejor[0]:\n        g = mejor[2][\"E_neto\"] - peor[2][\"E_neto\"]\n        if g > 0:\n            txt += (f\" Frente a «{peor[0]}», aporta {eur(g)} más por cliente ({eur(g * mejor[2]['visitantes'], 0)} al día).\")\n    t = mejor[2]\n    txt += (f\" En la estrategia recomendada, que no todos los clientes compren reduce el beneficio medio de \"\n            f\"{eur(t['E_compra'])} (compradores) a {eur(t['E'])} (todos los clientes).\")\n    return txt\n",
 "graficos.py": "# -*- coding: utf-8 -*-\n\"\"\"Gráficos (matplotlib) de la aplicación de beneficio por mixtura. Cada función devuelve una Figure.\"\"\"\nimport io\nimport math\n\nimport matplotlib\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\nimport matplotlib.ticker as mticker\nimport numpy as np\n\nimport mixtura as mx\n\n# Paleta categórica validada (orden fijo; el color sigue a la entidad, nunca a su posición)\nSERIES = [\"#2a78d6\", \"#eb6834\", \"#1baf7a\", \"#eda100\", \"#e87ba4\", \"#008300\", \"#6250d6\", \"#e34948\"]\nNO_COMPRA_COLOR = \"#8a8984\"                 # «no compra» (0 €): no es un riesgo, solo la otra rama de la mixtura\nCOLORES_MODELO = [c for c in SERIES]         # un color por modelo, en orden\nBUENO, CRITICO = \"#0b7a0b\", \"#b23232\"\nTEXTO, TEXTO2, REJILLA = \"#0b0b0b\", \"#52514e\", \"#e1e0d9\"\n\nplt.rcParams.update({\n    \"figure.dpi\": 110, \"savefig.dpi\": 150, \"font.size\": 9.5, \"axes.titlesize\": 10.5, \"axes.titleweight\": \"bold\",\n    \"axes.edgecolor\": \"#b9b8b2\", \"axes.labelcolor\": TEXTO2, \"xtick.color\": TEXTO2, \"ytick.color\": TEXTO2,\n    \"axes.grid\": True, \"grid.color\": REJILLA, \"grid.linewidth\": 0.8, \"axes.axisbelow\": True,\n    \"axes.spines.top\": False, \"axes.spines.right\": False, \"legend.frameon\": False,\n})\n\n\ndef _eur(x, d=2):\n    return mx.eur(x, d)\n\n\ndef color_modelo(i):\n    return COLORES_MODELO[i % len(COLORES_MODELO)]\n\n\ndef color_escenario(i):\n    return SERIES[i % len(SERIES)]\n\n\ndef fig_a_png(fig):\n    buf = io.BytesIO()\n    fig.savefig(buf, format=\"png\", bbox_inches=\"tight\", facecolor=\"white\")\n    plt.close(fig)\n    buf.seek(0)\n    return buf\n\n\ndef _vacia(texto, figsize=(9, 3.2)):\n    fig, ax = plt.subplots(figsize=figsize)\n    ax.axis(\"off\")\n    ax.text(0.5, 0.5, texto, ha=\"center\", va=\"center\", color=TEXTO2, fontsize=11, transform=ax.transAxes)\n    return fig\n\n\ndef fig_mecanismo(sis, u1=None, u2=None, titulo=None):\n    \"\"\"Mixtura en dos pasos. Izquierda: U₁ frente a Pr(compra) (¿compra?). Derecha: U₂ y la escalera F de los\n    modelos (qué modelo, solo si compra).\"\"\"\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(10, 3.6), gridspec_kw={\"width_ratios\": [1, 2.2]})\n    pc = sis[\"pc\"]\n    a1.bar([0], [pc], width=0.6, color=BUENO, alpha=0.35)\n    a1.bar([0], [1 - pc], bottom=[pc], width=0.6, color=NO_COMPRA_COLOR, alpha=0.35)\n    a1.text(0, pc / 2, f\"compra\\nU₁ < {mx.num(pc, 2)}\", ha=\"center\", va=\"center\", fontsize=8.5, color=BUENO)\n    a1.text(0, pc + (1 - pc) / 2, \"no compra\\nB = 0 €\", ha=\"center\", va=\"center\", fontsize=8.5, color=TEXTO2)\n    a1.axhline(pc, color=TEXTO2, lw=1, ls=\":\")\n    if u1 is not None:\n        a1.annotate(\"\", xy=(0.3, u1), xytext=(-0.55, u1), arrowprops=dict(arrowstyle=\"->\", color=TEXTO, lw=1.6))\n        a1.text(-0.55, min(u1 + 0.03, 1.0), f\"U₁ = {mx.num(u1, 2)}\", fontsize=9, color=TEXTO)\n    a1.set_xlim(-0.6, 0.6); a1.set_ylim(0, 1.04); a1.set_xticks([])\n    a1.set_ylabel(\"U₁ ~ Unif(0, 1)\")\n    a1.set_title(\"Paso 1 · ¿compra?\")\n    F = np.array(sis[\"F\"]); esc = np.concatenate([[0.0], F]); n = len(F)\n    compra = u1 is not None and u1 < pc\n    for i in range(n):\n        c = color_modelo(i)\n        a2.add_patch(plt.Rectangle((-0.6, esc[i]), n + 0.2, esc[i + 1] - esc[i], color=c, alpha=0.10, lw=0))\n        a2.plot([i - 0.5, i + 0.5], [F[i], F[i]], color=c, lw=3, solid_capstyle=\"butt\")\n        a2.text(n - 0.35, (esc[i] + esc[i + 1]) / 2, f\"{sis['modelos'][i]}: {_eur(sis['b'][i], 0)}\\n\"\n                f\"({mx.num(esc[i], 2)}, {mx.num(F[i], 2)}]\", va=\"center\", fontsize=8, color=c)\n    if u2 is not None:\n        k = int(mx.transformada_inversa(np.array([u2]), F)[0])\n        col = TEXTO if compra else \"#b9b8b2\"\n        a2.annotate(\"\", xy=(k, u2), xytext=(-0.55, u2), arrowprops=dict(arrowstyle=\"->\", color=col, lw=1.6))\n        a2.annotate(\"\", xy=(k, -0.02), xytext=(k, u2), arrowprops=dict(arrowstyle=\"->\", color=col, lw=1.6))\n        a2.text(-0.55, min(u2 + 0.03, 1.0), f\"U₂ = {mx.num(u2, 2)}\" + (\"\" if compra else \" (no se usa)\"), fontsize=9,\n                color=col)\n    a2.set_xlim(-0.6, n + 0.9); a2.set_ylim(-0.03, 1.05)\n    a2.set_xticks(range(n)); a2.set_xticklabels(sis[\"modelos\"])\n    a2.set_ylabel(\"F(i) = p₁ + … + pᵢ\")\n    a2.set_title(\"Paso 2 · qué modelo (solo si compra)\")\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_desenlaces(sis, mc=None, titulo=None):\n    \"\"\"Distribución del beneficio por cliente B: probabilidad de cada desenlace (barras teóricas; rombos simulados).\"\"\"\n    nombres = [mx.NO_COMPRA] + list(sis[\"modelos\"])\n    p = [1 - sis[\"pc\"]] + [sis[\"pc\"] * q for q in sis[\"p\"]]\n    cols = [NO_COMPRA_COLOR] + [color_modelo(i) for i in range(len(sis[\"modelos\"]))]\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    x = np.arange(len(nombres))\n    ax.bar(x, p, width=0.6, color=cols)\n    for i in x:\n        ax.text(i, p[i], mx.pct(p[i], 1), ha=\"center\", va=\"bottom\", fontsize=8.5, color=TEXTO)\n    if mc is not None:\n        n = len(mc[\"B\"])\n        sim = [float((~mc[\"T\"]).sum()) / n] + [float(((mc[\"idx\"] == i) & mc[\"T\"]).sum()) / n for i in range(len(sis[\"b\"]))]\n        ax.plot(x, sim, \"D\", color=TEXTO, ms=6, label=\"simulada\")\n        ax.legend(loc=\"upper right\", fontsize=8)\n    ax.set_xticks(x)\n    ax.set_xticklabels([f\"{nm}\\nB = {_eur(b, 0)}\" for nm, b in zip(nombres, [0.0] + list(sis[\"b\"]))])\n    ax.yaxis.set_major_formatter(mticker.PercentFormatter(1.0, decimals=0))\n    ax.set_ylim(0, max(p) * 1.25)\n    ax.set_title(titulo or \"Distribución del beneficio por cliente B (barras: teórica)\")\n    fig.tight_layout()\n    return fig\n\n\ndef fig_descomposicion(sis, titulo=None):\n    \"\"\"Contribución de cada desenlace a E(B) = Σ Pr(compra)·pᵢ·bᵢ, con E(B) y E(B | compra) de referencia.\"\"\"\n    nombres = [mx.NO_COMPRA] + list(sis[\"modelos\"])\n    v = [0.0] + list(sis[\"contrib\"])\n    cols = [NO_COMPRA_COLOR] + [color_modelo(i) for i in range(len(sis[\"modelos\"]))]\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    x = np.arange(len(nombres))\n    ax.bar(x, v, width=0.6, color=cols)\n    for i, y in enumerate(v):\n        ax.text(i, y, _eur(y), ha=\"center\", va=\"bottom\", fontsize=8.5, color=TEXTO)\n    ax.axhline(sis[\"E\"], color=TEXTO, ls=\"--\", lw=1.3, label=f\"E(B) = {_eur(sis['E'])} (suma de las barras)\")\n    ax.set_xticks(x); ax.set_xticklabels(nombres)\n    ax.set_ylabel(\"€ por cliente\")\n    ax.set_ylim(0, max(max(v), sis[\"E\"]) * 1.25)\n    ax.set_title(titulo or \"Descomposición del beneficio esperado: Pr(desenlace) × beneficio\")\n    ax.legend(loc=\"upper left\", fontsize=8)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_traza(traza, sis, titulo=None):\n    \"\"\"Funcionamiento simulado: U₁ de los primeros clientes (compran si U₁ < Pr(compra)); color = modelo elegido.\"\"\"\n    if traza is None or len(traza) == 0:\n        return _vacia(\"Sin clientes que mostrar\")\n    fig, ax = plt.subplots(figsize=(9, 3.6))\n    pc = sis[\"pc\"]\n    ax.axhspan(0, pc, color=BUENO, alpha=0.07, lw=0)\n    ax.axhline(pc, color=TEXTO2, lw=1, ls=\":\", label=f\"Pr(compra) = {mx.num(pc, 2)}\")\n    nc = traza[~traza[\"Compra\"]]\n    ax.vlines(nc[\"Cliente\"], 0, nc[\"U1\"], color=NO_COMPRA_COLOR, lw=1, alpha=0.5)\n    ax.plot(nc[\"Cliente\"], nc[\"U1\"], \"x\", color=NO_COMPRA_COLOR, ms=6, mew=1.8, label=f\"no compra ({len(nc)})\")\n    for i, m in enumerate(sis[\"modelos\"]):\n        d = traza[traza[\"Modelo\"] == m]\n        if len(d):\n            ax.vlines(d[\"Cliente\"], 0, d[\"U1\"], color=color_modelo(i), lw=1, alpha=0.5)\n            ax.plot(d[\"Cliente\"], d[\"U1\"], \"o\", color=color_modelo(i), ms=5, label=f\"compra · {m} ({len(d)})\")\n    ax.set_xlim(0, len(traza) + 1); ax.set_ylim(0, 1.02)\n    ax.set_xlabel(\"cliente\"); ax.set_ylabel(\"U₁ ~ Unif(0, 1)\")\n    ax.set_title(titulo or f\"Funcionamiento de la mixtura · primeros {len(traza)} clientes\")\n    ax.legend(loc=\"upper center\", bbox_to_anchor=(0.5, -0.17), ncol=min(5, len(sis[\"modelos\"]) + 2), fontsize=8)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_replicas(mc, sis, titulo=None):\n    \"\"\"E(B) y E(B | compra) de cada réplica con su IC95 % y los valores teóricos.\"\"\"\n    rep = mc[\"replicas\"]\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    se1 = rep[\"σ(B)\"] / np.sqrt(rep[\"Clientes\"])\n    ax.errorbar(rep.index - 0.08, rep[\"E(B)\"], yerr=mx.Z95 * se1, fmt=\"o\", color=SERIES[0], ms=6, capsize=4,\n                label=\"E(B) · todos ± IC95 %\")\n    ax.axhline(sis[\"E\"], color=SERIES[0], ls=\"--\", lw=1.3, label=f\"teórico {_eur(sis['E'])}\")\n    se2 = sis[\"sd_compra\"] / np.sqrt(rep[\"Compradores\"].clip(lower=1))\n    ax.errorbar(rep.index + 0.08, rep[\"E(B | compra)\"], yerr=mx.Z95 * se2, fmt=\"s\", color=BUENO, ms=6, capsize=4,\n                label=\"E(B | compra) ± IC95 %\")\n    ax.axhline(sis[\"E_compra\"], color=BUENO, ls=\"--\", lw=1.3, label=f\"teórico {_eur(sis['E_compra'])}\")\n    ax.set_xticks(rep.index); ax.set_xlabel(\"réplica (semilla)\"); ax.set_ylabel(\"€ por cliente\")\n    ax.set_title(titulo or \"Beneficio medio en cada réplica: todos los clientes y solo compradores\")\n    ax.legend(loc=\"center left\", bbox_to_anchor=(1.0, 0.5), fontsize=8)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_comparativa(res):\n    \"\"\"Comparación de estrategias: P(compra), E(B | compra), beneficio neto por cliente y beneficio neto diario.\"\"\"\n    nombres = list(res)\n    cols = [color_escenario(i) for i in range(len(nombres))]\n    fig, axs = plt.subplots(1, 4, figsize=(12, 3.9))\n    med = [(\"Proporción que compra (%)\", [100 * res[n][\"teoria\"][\"pc\"] for n in nombres], \"%\"),\n           (\"E(B | compra) (€)\", [res[n][\"teoria\"][\"E_compra\"] for n in nombres], \"€z\"),\n           (\"Beneficio neto por cliente (€)\", [res[n][\"teoria\"][\"E_neto\"] for n in nombres], \"€z\"),\n           (\"Beneficio neto diario (€)\", [res[n][\"teoria\"][\"dia_neto\"] for n in nombres], \"€z0\")]\n    for ax, (tit, v, u) in zip(axs, med):\n        barras = ax.bar(range(len(nombres)), v, color=cols, width=0.65)\n        for bb, x in zip(barras, v):\n            ax.text(bb.get_x() + bb.get_width() / 2, bb.get_height(), mx.num(x, 0 if u == \"€z0\" else (1 if u == \"%\" else 2)),\n                    ha=\"center\", va=\"bottom\", fontsize=7.5, color=TEXTO)\n        if u.startswith(\"€z\"):\n            lo, hi = min(v), max(v); m = (hi - lo) or abs(hi) * 0.05 or 1\n            ax.set_ylim(lo - 1.2 * m, hi + 0.5 * m)\n            ax.yaxis.set_major_formatter(mticker.FuncFormatter(lambda y, _: mx.num(y, 0 if u == \"€z0\" else 1)))\n        else:\n            ax.set_ylim(0, max(v) * 1.2 if max(v) > 0 else 1)\n        ax.set_title(tit, fontsize=9)\n        ax.set_xticks(range(len(nombres)))\n        ax.set_xticklabels(nombres, rotation=30 if len(nombres) > 2 else 0,\n                           ha=\"right\" if len(nombres) > 2 else \"center\", fontsize=8)\n    fig.text(0.5, 0.005, \"Los ejes en € no empiezan en 0 para que se aprecien las diferencias entre estrategias.\",\n             ha=\"center\", fontsize=7.5, color=TEXTO2)\n    fig.tight_layout(rect=(0, 0.03, 1, 1))\n    return fig\n\n\ndef fig_validacion(res):\n    nombres = list(res)\n    kpis = [(\"Beneficio medio por cliente E(B)\", \"E(B)\"), (\"Beneficio medio por comprador E(B | compra)\", \"E(B | compra)\"),\n            (\"Proporción que compra P(compra)\", \"P(compra)\"), (\"Desviación típica σ(B)\", \"σ(B)\")]\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    ancho = 0.8 / len(nombres)\n    for i, n in enumerate(nombres):\n        rm = res[n][\"resumen_mc\"]\n        v = []\n        for k, _ in kpis:\n            e = rm.loc[k, \"Error relativo\"]\n            v.append(0.0 if e is None or e != e else 100 * e)\n        ax.bar(np.arange(len(kpis)) + i * ancho - 0.4 + ancho / 2, v, width=ancho * 0.9, color=color_escenario(i), label=n)\n    ax.axhline(0, c=TEXTO2, lw=1)\n    ax.set_xticks(range(len(kpis))); ax.set_xticklabels([e for _, e in kpis])\n    ax.set_ylabel(\"error relativo (%)\")\n    ax.set_title(\"Validación: error relativo de la simulación frente a la teoría\")\n    ax.legend(fontsize=8, ncol=min(4, len(nombres)))\n    fig.tight_layout()\n    return fig\n\n\ndef fig_sens_convergencia(df, metrica, titulo=None):\n    f = mx.fmt_metrica(metrica)\n    fig, ax = plt.subplots(figsize=(9, 3.6))\n    x = np.arange(len(df))\n    for i, (_, r) in enumerate(df.iterrows()):\n        ax.plot([i] * len(r[\"Medias por réplica\"]), r[\"Medias por réplica\"], \"o\", color=SERIES[0], alpha=0.3, ms=5)\n    ax.errorbar(x, df[\"Media de las réplicas\"],\n                yerr=[df[\"Media de las réplicas\"] - df[\"IC95 inf\"], df[\"IC95 sup\"] - df[\"Media de las réplicas\"]],\n                fmt=\"o-\", color=SERIES[0], ms=7, capsize=4, label=\"media de las réplicas ± IC95 %\")\n    ax.plot([], [], \"o\", color=SERIES[0], alpha=0.3, label=\"cada réplica\")\n    ax.axhline(df[\"Teórico\"].iloc[0], color=TEXTO, ls=\"--\", lw=1.4, label=f\"teórico {f(df['Teórico'].iloc[0])}\")\n    ax.set_xticks(x); ax.set_xticklabels([mx.num(v, 0) for v in df.index])\n    if metrica == \"proporcion\":\n        ax.yaxis.set_major_formatter(mticker.PercentFormatter(1.0, decimals=1))\n    ax.set_xlabel(\"nsim (clientes simulados por réplica)\"); ax.set_ylabel(\"%\" if metrica == \"proporcion\" else \"€\")\n    ax.set_title(titulo or f\"Convergencia · {mx.METRICAS[metrica]}\")\n    ax.legend(loc=\"best\", fontsize=8)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_sens_variabilidad(df, metrica, titulo=None):\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    x = np.arange(len(df))\n    k = 100 if metrica == \"proporcion\" else 1\n    v = df[\"σ entre réplicas\"] * k\n    ax.bar(x, v, color=SERIES[0], width=0.6, label=\"σ entre réplicas (simulada)\")\n    ax.plot(x, df[\"σ teórica del estimador\"] * k, color=TEXTO, marker=\"o\", lw=1.5, label=\"σ teórica del estimador\")\n    for i, y in enumerate(v):\n        ax.text(i, y, mx.num(y, 3 if metrica == \"proporcion\" else 2), ha=\"center\", va=\"bottom\", fontsize=8, color=TEXTO)\n    ax.set_xticks(x); ax.set_xticklabels([mx.num(t, 0) for t in df.index])\n    ax.set_xlabel(\"nsim (clientes simulados por réplica)\")\n    ax.set_ylabel(\"puntos porcentuales\" if metrica == \"proporcion\" else \"€\")\n    ax.set_title(titulo or \"Variabilidad de la estimación entre réplicas\")\n    ax.legend(loc=\"upper right\", fontsize=8)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n",
 "informe.py": "# -*- coding: utf-8 -*-\n\"\"\"Informe Word (.docx) del beneficio esperado por mixtura: teoría, simulación, estrategias y sensibilidad.\"\"\"\nimport datetime\nimport io\nimport math\n\nimport numpy as np\nimport pandas as pd\nimport docx\nfrom docx.shared import Pt, Cm, RGBColor\nfrom docx.enum.text import WD_ALIGN_PARAGRAPH\nfrom docx.enum.table import WD_TABLE_ALIGNMENT\nfrom docx.oxml.ns import qn\nfrom docx.oxml import OxmlElement\n\nimport mixtura as mx\nfrom mixtura import num, pct, eur, fmt_kpi, fmt_mc, fmt_obj\nimport graficos as gr\n\n\ndef _sombrear(celda, color):\n    tcPr = celda._tc.get_or_add_tcPr()\n    shd = OxmlElement(\"w:shd\")\n    shd.set(qn(\"w:val\"), \"clear\"); shd.set(qn(\"w:color\"), \"auto\"); shd.set(qn(\"w:fill\"), color)\n    tcPr.append(shd)\n\n\nANCHO_UTIL_CM = 17.0          # A4 con márgenes de 2 cm\n\n\ndef _cm_por_caracter(pt):\n    return 0.0205 * pt          # anchura media aproximada de un carácter de Calibri\n\n\ndef _anchos(cab, filas, pt):\n    \"\"\"Anchura de cada columna según su contenido; se reparte el ancho útil sin superar la página.\"\"\"\n    nat = []\n    for j, c in enumerate(cab):\n        palabras = max((len(w) for w in str(c).split()), default=1)\n        # los textos largos (con espacios) pueden partirse en varias líneas; los números, no\n        celdas = max((min(len(f[j]), 30) if \" \" in f[j].strip() and len(f[j]) > 30 else len(f[j]) for f in filas),\n                     default=1)\n        nat.append(max(palabras, celdas, 3) * _cm_por_caracter(pt) + 0.3)\n    total = sum(nat)\n    return nat, total\n\n\nclass Informe:\n    \"\"\"Envoltorio sencillo de python-docx con helpers para títulos, párrafos, tablas y figuras.\"\"\"\n\n    def __init__(self, titulo, subtitulo=\"\"):\n        self.doc = docx.Document()\n        sec = self.doc.sections[0]\n        sec.page_width, sec.page_height = Cm(21), Cm(29.7)\n        sec.left_margin = sec.right_margin = Cm(2)\n        sec.top_margin = sec.bottom_margin = Cm(2)\n        estilo = self.doc.styles[\"Normal\"]\n        estilo.font.name = \"Calibri\"; estilo.font.size = Pt(10.5)\n        self.n_tabla, self.n_fig = 0, 0\n        self.doc.add_heading(titulo, level=0)\n        if subtitulo:\n            p = self.doc.add_paragraph(subtitulo); p.runs[0].italic = True\n\n    def h(self, texto, nivel=1):\n        self.doc.add_heading(texto, level=nivel)\n\n    def p(self, texto, negrita_inicio=None):\n        par = self.doc.add_paragraph()\n        if negrita_inicio and texto.startswith(negrita_inicio):\n            par.add_run(negrita_inicio).bold = True\n            par.add_run(texto[len(negrita_inicio):])\n        else:\n            par.add_run(texto)\n        par.paragraph_format.space_after = Pt(6)\n        return par\n\n    def vinetas(self, items):\n        for it in items:\n            self.doc.add_paragraph(it, style=\"List Bullet\")\n\n    def tabla(self, df, titulo, formato=None, indice=True, ancho_fuente=9, nombre_indice=\"\"):\n        \"\"\"Tabla con anchos de columna calculados para que quepa siempre en el ancho de la página: si el contenido\n        no cabe se reduce la letra (hasta 7 pt) y se reparten las columnas proporcionalmente.\"\"\"\n        self.n_tabla += 1\n        cap = self.doc.add_paragraph()\n        cap.add_run(f\"Tabla {self.n_tabla}. {titulo}\").bold = True\n        cap.paragraph_format.keep_with_next = True\n        cols = list(df.columns)\n        cab = ([nombre_indice or (df.index.name or \"\")] if indice else []) + [str(c) for c in cols]\n        filas = []\n        for idx, fila in df.iterrows():\n            filas.append(([num(idx, 0) if isinstance(idx, (int, np.integer)) else str(idx)] if indice else []) +\n                         [formato(idx, c, fila[c]) if formato else _fmt(fila[c]) for c in cols])\n        pt = ancho_fuente\n        nat, total = _anchos(cab, filas, pt)\n        while total > ANCHO_UTIL_CM and pt > 7:\n            pt -= 0.5\n            nat, total = _anchos(cab, filas, pt)\n        anchos = [w * ANCHO_UTIL_CM / total for w in nat] if total > ANCHO_UTIL_CM else \\\n                 [w * min(ANCHO_UTIL_CM / total, 1.6) for w in nat]\n        t = self.doc.add_table(rows=1, cols=len(cab))\n        t.style = \"Table Grid\"; t.alignment = WD_TABLE_ALIGNMENT.CENTER\n        t.autofit = False\n        tblPr = t._tbl.tblPr\n        lay = OxmlElement(\"w:tblLayout\"); lay.set(qn(\"w:type\"), \"fixed\"); tblPr.append(lay)\n        # la fila de cabecera se repite si la tabla continúa en otra página\n        trPr = t.rows[0]._tr.get_or_add_trPr()\n        rep = OxmlElement(\"w:tblHeader\"); rep.set(qn(\"w:val\"), \"true\"); trPr.append(rep)\n        for j, col in enumerate(t.columns):          # rejilla de la tabla (la que usan Word y LibreOffice)\n            col.width = Cm(anchos[j])\n        for j, c in enumerate(cab):\n            cel = t.rows[0].cells[j]; cel.text = \"\"; cel.width = Cm(anchos[j])\n            r = cel.paragraphs[0].add_run(str(c)); r.bold = True; r.font.size = Pt(pt)\n            r.font.color.rgb = RGBColor(0xFF, 0xFF, 0xFF)\n            if j > 0 or not indice:\n                cel.paragraphs[0].alignment = WD_ALIGN_PARAGRAPH.RIGHT\n            _sombrear(cel, \"2F5496\")\n        for i, vals in enumerate(filas):\n            celdas = t.add_row().cells\n            for j, v in enumerate(vals):\n                celdas[j].text = \"\"; celdas[j].width = Cm(anchos[j])\n                r = celdas[j].paragraphs[0].add_run(v); r.font.size = Pt(pt)\n                if j > 0 or not indice:\n                    celdas[j].paragraphs[0].alignment = WD_ALIGN_PARAGRAPH.RIGHT\n                if i % 2 == 1:\n                    _sombrear(celdas[j], \"EAF0F8\")\n        self.doc.add_paragraph()\n\n    def figura(self, fig, titulo, ancho_cm=16.5):\n        self.n_fig += 1\n        self.doc.add_picture(gr.fig_a_png(fig), width=Cm(ancho_cm))\n        self.doc.paragraphs[-1].alignment = WD_ALIGN_PARAGRAPH.CENTER\n        self.doc.paragraphs[-1].paragraph_format.keep_with_next = True\n        cap = self.doc.add_paragraph(); cap.alignment = WD_ALIGN_PARAGRAPH.CENTER\n        r = cap.add_run(f\"Figura {self.n_fig}. {titulo}\"); r.italic = True; r.font.size = Pt(9)\n\n    def salto(self):\n        self.doc.add_page_break()\n\n    def guardar(self):\n        buf = io.BytesIO()\n        self.doc.save(buf)\n        return buf.getvalue()\n\n\ndef _fmt(v):\n    if isinstance(v, (bool, np.bool_)):\n        return \"Sí\" if v else \"No\"\n    if v is None:\n        return \"—\"\n    if isinstance(v, (int, np.integer)):\n        return num(v, 0)\n    if isinstance(v, (float, np.floating)):\n        return \"—\" if math.isnan(v) else num(v, 3)\n    return str(v)\n\n\ndef fmt_tabla(fila, col, v):\n    if v is None or (isinstance(v, float) and math.isnan(v)):\n        return \"—\"\n    if \"€\" in col:\n        return eur(v, 2)\n    if col.startswith((\"Teórica\", \"Simulada\")) or col.startswith(\"P(\"):\n        return pct(v, 2)\n    return str(v)\n\n\ndef fmt_sens_factory(metrica):\n    f = mx.fmt_metrica(metrica)\n    def fmt(fila, col, v):\n        if col == \"Error relativo\":\n            return pct(v, 3)\n        if metrica == \"proporcion\" and col.startswith(\"σ\"):\n            return pct(v, 3)\n        if col.startswith(\"σ\"):\n            return eur(v, 3)\n        return f(v)\n    return fmt\n\n\ndef tabla_sens(df):\n    return df.drop(columns=[\"Medias por réplica\"])\n\n\ndef generar_informe(res, comunes, ajustes, titulo=\"Beneficio esperado por mixtura\", sens=None):\n    inf = Informe(titulo, f\"Informe generado automáticamente el {datetime.datetime.now():%d/%m/%Y %H:%M} · \"\n                          \"mixtura en dos pasos, simulación Monte Carlo y comparación de estrategias comerciales\")\n    V = comunes[\"visitantes\"]\n    # 1. Planteamiento\n    inf.h(\"1. Planteamiento y parámetros\", 1)\n    inf.p(\"Cada cliente que entra en la tienda compra un horno (T = 1) con probabilidad Pr(compra) o se va sin \"\n          \"comprar (T = 0, beneficio 0 €). Si compra, elige uno de los modelos con las probabilidades condicionadas \"\n          \"pᵢ = P(modelo i | compra), y la tienda gana bᵢ. El beneficio por cliente B es, por tanto, una mixtura: \"\n          \"B = 0 con probabilidad 1 − Pr(compra) y B = bᵢ con probabilidad Pr(compra)·pᵢ. Se simula en dos pasos: \"\n          \"U₁ ~ Unif(0, 1) decide si compra (U₁ < Pr(compra)) y, solo si compra, U₂ ~ Unif(0, 1) elige el modelo \"\n          \"por transformada inversa. E(B | compra) = Σ pᵢ·bᵢ y E(B) = Pr(compra)·E(B | compra). El beneficio neto \"\n          \"descuenta el coste comercial por cliente que entra de cada estrategia.\")\n    esc = pd.DataFrame({n: {\"P(compra)\": pct(r[\"teoria\"][\"pc\"], 0),\n                            \"Modelos (ganancia)\": \" / \".join(f\"{m} {eur(b, 0)}\" for m, b in zip(r[\"teoria\"][\"modelos\"], r[\"teoria\"][\"b\"])),\n                            \"P(modelo | compra)\": \" / \".join(pct(p, 0) for p in r[\"teoria\"][\"p\"]),\n                            \"Coste por cliente\": eur(r[\"teoria\"][\"coste\"], 2)} for n, r in res.items()})\n    inf.tabla(esc, \"Estrategias comerciales (escenarios) analizadas\", nombre_indice=\"Parámetro\", formato=lambda f, c, v: v)\n    desc = [f\"{n}: {r['esc']['descripcion']}\" for n, r in res.items() if r[\"esc\"].get(\"descripcion\")]\n    if desc:\n        inf.vinetas(desc)\n    ob = comunes[\"objetivos\"]\n    def o(k, f):\n        return f(ob[k]) if ob.get(k) is not None else \"no se evalúa\"\n    com = pd.DataFrame({\"Valor\": {\n        \"Clientes que entran por día\": num(V, 0),\n        \"Objetivo · beneficio neto mínimo por cliente\": o(\"BNETO_MIN\", lambda v: eur(v, 2)),\n        \"Objetivo · proporción mínima que compra\": o(\"PCOMPRA_MIN\", lambda v: pct(v, 1)),\n        \"Objetivo · beneficio mínimo por comprador\": o(\"BCOMPRA_MIN\", lambda v: eur(v, 2)),\n        \"Objetivo · compras de gama alta mínimas\": o(\"ALTA_
