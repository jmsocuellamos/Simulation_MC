 | {nf})\"] = (f\"CV({nf})\", pf[\"CV\"])\n        d[f\"P(Y < 0 | {nf})\"] = (f\"P(Y < 0 | {nf})\", pf[\"Pperd\"])\n        d[f\"Peso de {nf} en las pérdidas\"] = (f\"Peso en las pérdidas · {nf}\", pf[\"peso_perd\"])\n    for k_, nom in enumerate(TERMINOS):\n        d[f\"Contribución a Var(Y) · {nom}\"] = (f\"Contrib. {nom}\", float(tA[\"contrib\"][k_]))\n    return resumen(mc[\"replicas\"], d)\n\n\ndef resumen_B(mc, tB):\n    d = {\"VAN esperado con mantenimiento (k€)\": (\"E(VAN) con\", tB[\"E_con\"]),\n         \"VAN esperado sin mantenimiento (k€)\": (\"E(VAN) sin\", tB[\"E_sin\"]),\n         \"Ganancia media pareada E(Δ) (k€)\": (\"Ganancia E(Δ)\", tB[\"E_gan\"]),\n         \"P(el mantenimiento compensa) P(Δ > 0)\": (\"P(Δ > 0)\", tB[\"P_gan\"]),\n         \"VaR 95 % del VAN con mantenimiento (k€)\": (\"VaR 5 % con\", tB[\"VaR_con\"]),\n         \"VaR 95 % del VAN sin mantenimiento (k€)\": (\"VaR 5 % sin\", tB[\"VaR_sin\"]),\n         \"CVaR 5 % del VAN con mantenimiento (k€)\": (\"CVaR 5 % con\", tB[\"CVaR_con\"]),\n         \"CVaR 5 % del VAN sin mantenimiento (k€)\": (\"CVaR 5 % sin\", tB[\"CVaR_sin\"]),\n         \"σ(Δ) por centro · diseño pareado (k€)\": (\"σ(Δ) pareado\", tB[\"sd_gan\"]),\n         \"σ(Δ) por centro · diseño independiente (k€)\": (\"σ(Δ) independiente\", math.sqrt(tB[\"var_independiente\"]))}\n    for f in PROYECTOS:\n        nf = NOMBRE[f]\n        d[f\"E(Δ | {nf}) (k€)\"] = (f\"E(Δ | {nf})\", tB[\"por_tipo\"][f][\"E_gan\"])\n    return resumen(mc[\"replicas\"], d)\n\n\n# ==============================================================================================\n# Objetivos, análisis de escenarios y diferencias\n# ==============================================================================================\nOBJ_NOMBRES = {\"EY_MIN\": \"Beneficio esperado por proyecto E(Y)\", \"PPERD_MAX\": \"Probabilidad de pérdida P(Y < 0)\",\n               \"VAN_MIN\": \"VAN esperado del programa (política elegida)\",\n               \"CVAR_MIN\": \"CVaR 5 % del VAN (política elegida)\"}\n\n\ndef evaluar_objetivos(t, obj):\n    A, B = t[\"A\"], t[\"B\"]\n    filas = []\n    def fila(c, valor, txt, cumple):\n        filas.append({\"Objetivo\": OBJ_NOMBRES[c], \"Valor\": valor, \"Umbral\": txt, \"Cumple\": \"Sí\" if cumple else \"No\"})\n    if obj.get(\"EY_MIN\") is not None:\n        fila(\"EY_MIN\", A[\"EY\"], f\"≥ {keur(obj['EY_MIN'])}\", A[\"EY\"] >= obj[\"EY_MIN\"] - 1e-9)\n    if obj.get(\"PPERD_MAX\") is not None:\n        fila(\"PPERD_MAX\", A[\"Pperd\"], f\"≤ {pct(obj['PPERD_MAX'], 1)}\", A[\"Pperd\"] <= obj[\"PPERD_MAX\"] + 1e-12)\n    if obj.get(\"VAN_MIN\") is not None:\n        fila(\"VAN_MIN\", B[\"E_pol\"], f\"≥ {keur(obj['VAN_MIN'])}\", B[\"E_pol\"] >= obj[\"VAN_MIN\"] - 1e-9)\n    if obj.get(\"CVAR_MIN\") is not None:\n        fila(\"CVAR_MIN\", B[\"CVaR_pol\"], f\"≥ {keur(obj['CVAR_MIN'])}\", B[\"CVaR_pol\"] >= obj[\"CVAR_MIN\"] - 1e-9)\n    return pd.DataFrame(filas, columns=[\"Objetivo\", \"Valor\", \"Umbral\", \"Cumple\"]).set_index(\"Objetivo\")\n\n\ndef analizar_escenario(esc, com, aj, progreso=None):\n    t = teoria(com, esc)\n    mA = simular_A(com, esc, aj[\"nsim\"], aj[\"replicas\"], aj[\"semilla\"], progreso)\n    mB = simular_B(com, esc, aj[\"centros\"], aj[\"replicas_B\"], aj[\"semilla\"], progreso)\n    return {\"esc\": dict(esc), \"teoria\": t, \"mcA\": mA, \"mcB\": mB, \"resA\": resumen_A(mA, t[\"A\"]),\n            \"resB\": resumen_B(mB, t[\"B\"]), \"objetivos\": evaluar_objetivos(t, com[\"objetivos\"])}\n\n\ndef diferencias(res, base):\n    \"\"\"Diferencias frente al escenario base (positivo = mejora): pareadas réplica a réplica.\"\"\"\n    if base not in res:\n        return None\n    rb = res[base]\n    filas = []\n    for n, r in res.items():\n        if n == base:\n            continue\n        ta, tb = rb[\"teoria\"], r[\"teoria\"]\n        dA = r[\"mcA\"][\"replicas\"][\"E(Y)\"] - rb[\"mcA\"][\"replicas\"][\"E(Y)\"]\n        dB = r[\"mcB\"][\"replicas\"][\"E(VAN) política\"] - rb[\"mcB\"][\"replicas\"][\"E(VAN) política\"]\n        mA, loA, hiA = _ic_media(dA); mB, loB, hiB = _ic_media(dB)\n        filas.append({\"Escenario\": n,\n                      \"ΔE(Y) por proyecto · teórico (k€)\": tb[\"A\"][\"EY\"] - ta[\"A\"][\"EY\"],\n                      \"ΔE(Y) por proyecto · simulado (k€)\": mA, \"IC95 ΔE(Y) (k€)\": (loA, hiA),\n                      \"ΔP(Y < 0) · teórico\": tb[\"A\"][\"Pperd\"] - ta[\"A\"][\"Pperd\"],\n                      \"ΔVaR 95 % · teórico (k€)\": tb[\"A\"][\"VaR\"] - ta[\"A\"][\"VaR\"],\n                      \"ΔCVaR 5 % · teórico (k€)\": tb[\"A\"][\"CVaR\"] - ta[\"A\"][\"CVaR\"],\n                      \"ΔE(VAN) política · teórico (k€)\": tb[\"B\"][\"E_pol\"] - ta[\"B\"][\"E_pol\"],\n                      \"ΔE(VAN) política · simulado (k€)\": mB, \"IC95 ΔE(VAN) (k€)\": (loB, hiB),\n                      \"ΔCVaR 5 % del VAN · teórico (k€)\": tb[\"B\"][\"CVaR_pol\"] - ta[\"B\"][\"CVaR_pol\"],\n                      \"Ganancia del mantenimiento · teórico (k€)\": tb[\"B\"][\"E_gan\"]})\n    return pd.DataFrame(filas).set_index(\"Escenario\") if filas else None\n\n\ndef tabla_comparativa(res):\n    cols = {}\n    for n, r in res.items():\n        A, B, e = r[\"teoria\"][\"A\"], r[\"teoria\"][\"B\"], r[\"esc\"]\n        ra, rb = r[\"resA\"], r[\"resB\"]\n        cols[n] = {\n            \"Teórico · E(Y) por proyecto (k€)\": A[\"EY\"], \"Teórico · P(Y < 0)\": A[\"Pperd\"],\n            \"Teórico · VaR 95 % de Y (k€)\": A[\"VaR\"], \"Teórico · CVaR 5 % de Y (k€)\": A[\"CVaR\"],\n            \"Teórico · E(VAN) con mantenimiento (k€)\": B[\"E_con\"], \"Teórico · E(VAN) sin mantenimiento (k€)\": B[\"E_sin\"],\n            \"Teórico · ganancia E(Δ) (k€)\": B[\"E_gan\"], \"Teórico · P(Δ > 0)\": B[\"P_gan\"],\n            \"Teórico · CVaR 5 % VAN política (k€)\": B[\"CVaR_pol\"],\n            \"Teórico · C_mant de indiferencia (k€/año)\": B[\"C_ind\"],\n            \"Simulado · E(Y) por proyecto (k€)\": ra.loc[\"Beneficio esperado E(Y) (k€)\", \"Simulado · media\"],\n            \"Simulado · P(Y < 0)\": ra.loc[\"Probabilidad de pérdida P(Y < 0)\", \"Simulado · media\"],\n            \"Simulado · ganancia E(Δ) (k€)\": rb.loc[\"Ganancia media pareada E(Δ) (k€)\", \"Simulado · media\"],\n            \"Simulado · E(VAN) política (k€)\": r[\"mcB\"][\"replicas\"][\"E(VAN) política\"].mean(),\n            \"Política elegida\": POLITICAS.get(e.get(\"politica\", \"con\"), \"—\"),\n            \"Objetivos cumplidos\": f\"{(r['objetivos']['Cumple'] == 'Sí').sum()} de {len(r['objetivos'])}\",\n        }\n    return pd.DataFrame(cols)\n\n\ndef tabla_objetivos(res):\n    return pd.DataFrame({n: r[\"objetivos\"][\"Cumple\"] for n, r in res.items()})\n\n\n# ==============================================================================================\n# Mantenimiento: barridos (O5.1, O5.2, O6.1, O6.3, O8.5) y racha (O6.2)\n# ==============================================================================================\nPARAM_BARRIDO = {\"delta\": \"Tasa de degradación δ\", \"C_mant\": \"Coste de mantenimiento C_mant (k€/año)\",\n                 \"H\": \"Horizonte H (años)\", \"subvencion\": \"Subvención del mantenimiento X\"}\n\n\ndef barrido(com, esc, par, valores, centros, replicas, semilla, progreso=None):\n    \"\"\"Ganancia del mantenimiento al variar un parámetro: teórica y simulada con los mismos números aleatorios.\"\"\"\n    filas = []\n    for v in valores:\n        e2 = dict(esc); e2[par] = int(v) if par == \"H\" else float(v)\n        tB = teoria_B(com, e2, con_rejilla=False)\n        gs = []\n        for r in range(int(replicas)):\n            b = base_programa(com, e2, int(centros), int(semilla) + 1000 + r)\n            gs.append(float((van(e2, aplicar_politica(com, e2, b, \"con\")[\"Y\"]) -\n                             van(e2, aplicar_politica(com, e2, b, \"sin\")[\"Y\"])).mean()))\n        m, lo, hi = _ic_media(gs)\n        fila = {PARAM_BARRIDO[par]: v, \"Teórico · E(Δ) (k€)\": tB[\"E_gan\"], \"Simulado · E(Δ) (k€)\": m,\n                \"IC95 E(Δ) (k€)\": (lo, hi), \"Teórico · P(Δ > 0)\": tB[\"P_gan\"],\n                \"Teórico · E(VAN) con (k€)\": tB[\"E_con\"], \"Teórico · E(VAN) sin (k€)\": tB[\"E_sin\"],\n                \"Teórico · C_mant de indiferencia (k€/año)\": tB[\"C_ind\"]}\n        for f in PROYECTOS:\n            fila[f\"Teórico · E(Δ | {NOMBRE[f]}) (k€)\"] = tB[\"por_tipo\"][f][\"E_gan\"]\n        filas.append(fila)\n        if progreso:\n            progreso()\n    return pd.DataFrame(filas).set_index(PARAM_BARRIDO[par])\n\n\ndef experimento_racha(com, esc, tipo, inicio=2, anyos=3, n=20000, semilla=1000):\n    \"\"\"O6.2 · centros de un tipo con R⁰ en el 10 % inferior durante `anyos` años desde `inicio`, frente a los mismos\n    centros sin racha (mismos uniformes en el resto). Evolución año a año de R, S y VAN acumulado por política.\"\"\"\n    H = int(esc[\"H\"]); d = descuentos(esc)\n    out = {}\n    for nom, rch in ((\"Sin racha\", None), (\"Con racha\", (tipo, inicio, anyos))):\n        b = base_programa(com, esc, int(n), int(semilla) + 777, racha=rch if rch else (tipo, 1, 0))\n        for pol in (\"con\", \"sin\"):\n            p = aplicar_politica(com, esc, b, pol)\n            out[(nom, pol)] = {\"R\": p[\"R\"].mean(axis=0), \"S\": p[\"S\"].mean(axis=0), \"Y\": p[\"Y\"].mean(axis=0),\n                               \"VAN acumulado\": np.cumsum(p[\"Y\"].mean(axis=0) * d),\n                               \"Ppen\": (p[\"R\"] < float(esc[\"umbral_R\"])).mean(axis=0)}\n    filas = []\n    for t in range(H):\n        f = {\"Año\": t + 1}\n        for nom in (\"Sin racha\", \"Con racha\"):\n            f[f\"{nom} · R medio\"] = out[(nom, \"con\")][\"R\"][t]\n            f[f\"{nom} · P(penalización)\"] = out[(nom, \"con\")][\"Ppen\"][t]\n            f[f\"{nom} · S con mant. (k€)\"] = out[(nom, \"con\")][\"S\"][t]\n            f[f\"{nom} · S sin mant. (k€)\"] = out[(nom, \"sin\")][\"S\"][t]\n            f[f\"{nom} · VAN acum. con (k€)\"] = out[(nom, \"con\")][\"VAN acumulado\"][t]\n            f[f\"{nom} · VAN acum. sin (k€)\"] = out[(nom, \"sin\")][\"VAN acumulado\"][t]\n        filas.append(f)\n    return pd.DataFrame(filas).set_index(\"Año\"), out\n\n\n# ==============================================================================================\n# Sensibilidad (O2.2, O3.3) y estimador\n# ==============================================================================================\nPARAM_SENS = {\"p_Emp\": \"p de Empaque (cartera)\", \"mu_I\": \"μ de ln I (todos)\", \"sigma_I\": \"σ de ln I (todos)\",\n              \"a_R\": \"α de la Beta de R (todos)\", \"b_R\": \"β de la Beta de R (todos)\", \"k_S\": \"k de la Gamma de S (todos)\",\n              \"theta_S\": \"θ de la Gamma de S (todos)\", \"V\": \"V_stock\"}\n\n\ndef _aplicar(com, esc, par, v):\n    c2, e2 = copy.deepcopy(com), dict(esc)\n    if par == \"p_Emp\":\n        p = list(normalizar(esc[\"p\"])); p3 = min(0.99, p[2] * (1 + v)); s = (1 - p3) / (1 - p[2])\n        e2[\"p\"] = [p[0] * s, p[1] * s, p3, p[3] * s]\n    elif par == \"V\":\n        e2[\"V\"] = float(esc[\"V\"]) * (1 + v)\n    else:\n        for f in PROYECTOS:\n            c2[\"dist\"][f][par] = float(com[\"dist\"][f][par]) * (1 + v)\n    return c2, e2\n\n\ndef sensibilidad_parametros(com, esc, variaciones):\n    filas = []\n    for par, nom in PARAM_SENS.items():\n        for v in variaciones:\n            t = teoria_A(*_aplicar(com, esc, par, v), con_rejilla=False)\n            filas.append({\"Parámetro\": nom, \"Variación\": v, \"Teórico · E(Y) (k€)\": t[\"EY\"], \"Teórico · Var(Y)\": t[\"VY\"],\n                          \"Teórico · σ(Y) (k€)\": t[\"sdY\"]})\n    elas = {}\n    for par, nom in PARAM_SENS.items():\n        vs = [teoria_A(*_aplicar(com, esc, par, h), con_rejilla=False)[\"VY\"] for h in (-0.01, 0.01)]\n        elas[nom] = (math.log(vs[1]) - math.log(vs[0])) / (math.log(1.01) - math.log(0.99)) if min(vs) > 0 else 0.0\n    return pd.DataFrame(filas), elas\n\n\ndef indices_sobol(com, esc, n=20000, semilla=1000):\n    \"\"\"Índices de Sobol (Saltelli/Jansen) de las entradas aleatorias T, I, R y S sobre Y.\"\"\"\n    rng = np.random.default_rng(int(semilla) + 7)\n    UA, UB = rng.random((4, n)), rng.random((4, n))\n    yA = generar_proyectos(com, esc, UA)[\"Y\"]; yB = generar_proyectos(com, esc, UB)[\"Y\"]\n    V = float(np.var(np.concatenate([yA, yB]), ddof=1))\n    filas = []\n    for i, nom in enumerate((\"Tipo de proyecto T\", \"Inversión I\", \"Reducción R\", \"Ahorro S\")):\n        UAB = UA.copy(); UAB[i] = UB[i]\n        yAB = generar_proyectos(com, esc, UAB)[\"Y\"]\n        filas.append({\"Entrada\": nom, \"Índice de primer orden S₁\": float(np.mean(yB * (yAB - yA)) / V),\n                      \"Índice total S_T\": float(0.5 * np.mean((yA - yAB) ** 2) / V)})\n    df = pd.DataFrame(filas).set_index(\"Entrada\")\n    df.loc[\"Tipo de proyecto T\", \"Teórico · S₁\"] = teoria_A(com, esc, con_rejilla=False)[\"S_T\"]\n    return df\n\n\ndef v_equilibrio(com, esc, tipo=3, objetivo=0.0):\n    \"\"\"O3.3 · V_stock con el que el tipo dado alcanza E(Y | tipo) = objetivo (E(Y | T) es lineal en V).\"\"\"\n    m = momentos_anyo(com, esc, tipo)\n    resto = m[\"EY\"] - float(esc[\"V\"]) * m[\"ER\"]\n    filas = []\n    def fila(nombre, obj):\n        Vx = (obj - resto) / m[\"ER\"]\n        filas.append({\"Meta para el Empaque\" if tipo == 3 else \"Meta\": nombre, \"E(Y) objetivo (k€)\": obj,\n                      \"V_stock necesario (k€)\": Vx, \"Cambio frente al actual\": Vx / float(esc[\"V\"]) - 1})\n    fila(f\"E(Y | {NOMBRE[tipo]}) ≥ {num(objetivo, 0)}\", objetivo)\n    tA = teoria_A(com, esc, con_rejilla=False)\n    fila(\"Igualar el beneficio medio de la cartera\", tA[\"EY\"])\n    for f in PROYECTOS:\n        if f != tipo:\n            fila(f\"Igualar a {NOMBRE[f]}\", tA[\"por_tipo\"][f][\"EY\"])\n    return pd.DataFrame(filas).set_index(filas[0] and list(filas[0])[0]), m[\"EY\"], m[\"ER\"]\n\n\ndef valores_barrido(vmin, vmax, puntos):\n    v = np.geomspace(max(1, vmin), max(vmin + 1, vmax), max(2, int(puntos)))\n    return sorted(set(int(round(x)) for x in v))\n\n\ndef sensibilidad_estimador(com, esc, metrica, valores, replicas, semilla, progreso=None):\n    \"\"\"E(Y) frente al nº de proyectos (Bloque A) o E(VAN) con mantenimiento frente al nº de centros (Bloque B).\"\"\"\n    if metrica == \"proyecto\":\n        t = teoria_A(com, esc, con_rejilla=False); teo, sd1 = t[\"EY\"], t[\"sdY\"]\n    else:\n        t = teoria_B(com, esc, con_rejilla=False); teo, sd1 = t[\"E_con\"], t[\"sd_con\"]\n    tq = _tq(int(replicas))\n    filas, k, tot = [], 0, len(valores) * int(replicas)\n    for n in valores:\n        medias = []\n        for r in range(int(replicas)):\n            if metrica == \"proyecto\":\n                rng = np.random.default_rng(int(semilla) + r)\n                medias.append(float(generar_proyectos(com, esc, rng.random((4, n)))[\"Y\"].mean()))\n            else:\n                b = base_programa(com, esc, n, int(semilla) + 50_000 * (r + 1))\n                medias.append(float(van(esc, aplicar_politica(com, esc, b, \"con\")[\"Y\"]).mean()))\n            k += 1\n            if progreso:\n                progreso(k, tot)\n        m = float(np.mean(medias)); sdr = float(np.std(medias, ddof=1)) if len(medias) > 1 else 0.0\n        se = sdr / math.sqrt(len(medias))\n        filas.append({\"n\": n, \"Media de las réplicas\": m, \"IC95 inf\": m - tq * se, \"IC95 sup\": m + tq * se,\n                      \"σ entre réplicas\": sdr, \"σ teórica del estimador\": sd1 / math.sqrt(n), \"Teórico\": teo,\n                      \"Error relativo\": (m - teo) / teo, \"Medias por réplica\": medias})\n    return pd.DataFrame(filas).set_index(\"n\")\n\n\n# ==============================================================================================\n# Ampliación optativa (O8)\n# ==============================================================================================\ndef contraste_ganancia(mcB, tB):\n    \"\"\"O8.1 · contraste H₀: E(Δ) = 0 con los Δ pareados de todos los centros simulados (t de Student y signo).\"\"\"\n    g = mcB[\"VAN_con\"] - mcB[\"VAN_sin\"]\n    T = mcB[\"T\"]\n    filas = []\n    def fila(nom, x, teo):\n        n = len(x); m = float(x.mean()); s = float(x.std(ddof=1)); se = s / math.sqrt(n)\n        t = m / se if se > 0 else float(\"inf\")\n        pv = float(2 * _stats.t.sf(abs(t), n - 1))\n        filas.append({\"Grupo\": nom, \"Centros\": n, \"Media de Δ (k€)\": m, \"IC95 de Δ (k€)\": (m - _tq(n) * se, m + _tq(n) * se),\n                      \"Estadístico t\": t, \"p-valor\": pv, \"Teórico · E(Δ) (k€)\": teo,\n                      \"Decisión (5 %)\": \"se rechaza E(Δ) = 0\" if pv < 0.05 else \"no se rechaza E(Δ) = 0\"})\n    fila(\"Toda la red\", g, tB[\"E_gan\"])\n    for f in PROYECTOS:\n        mk = T == f\n        if mk.sum() > 2:\n            fila(NOMBRE[f], g[mk], tB[\"por_tipo\"][f][\"E_gan\"])\n    return pd.DataFrame(filas).set_index(\"Grupo\")\n\n\ndef comparar_experiencia(com, esc, t0s=(1, 3), centros=300, replicas=20, semilla=1000):\n    \"\"\"O8.2 · VAN esperado si el centro empieza en el punto t0 de la curva de aprendizaje (mismos números aleatorios).\"\"\"\n    filas = []\n    for t0 in t0s:\n        e2 = dict(esc, t0=int(t0))\n        tB = teoria_B(com, e2, con_rejilla=False)\n        vs = []\n        for r in range(int(replicas)):\n            b = base_programa(com, e2, int(centros), int(semilla) + 1000 + r)\n            vs.append(float(van(e2, aplicar_politica(com, e2, b, \"con\")[\"Y\"]).mean()))\n        m, lo, hi = _ic_media(vs)\n        filas.append({\"Punto de partida de la curva\": f\"t = {t0}\", \"Teórico · E(VAN) con (k€)\": tB[\"E_con\"],\n                      \"Simulado · E(VAN) con (k€)\": m, \"IC95 (k€)\": (lo, hi), \"Teórico · E(VAN) sin (k€)\": tB[\"E_sin\"],\n                      \"Teórico · ganancia E(Δ) (k€)\": tB[\"E_gan\"]})\n    df = pd.DataFrame(filas).set_index(\"Punto de partida de la curva\")\n    return df\n\n\ndef politica_adaptativa(com, esc, umbrales, centros=300, replicas=20, semilla=1000):\n    \"\"\"O8.3 · mantener el año t solo si el ahorro que se observaría sin mantener cae por debajo del umbral.\"\"\"\n    filas = []\n    for u in list(umbrales):\n        vs, mf = [], []\n        for r in range(int(replicas)):\n            b = base_programa(com, esc, int(centros), int(semilla) + 1000 + r)\n            p = aplicar_politica(com, esc, b, \"adaptativa\", umbral_S=u)\n            vs.append(float(van(esc, p[\"Y\"]).mean())); mf.append(float(p[\"M\"].mean()))\n        m, lo, hi = _ic_media(vs)\n        filas.append({\"Umbral de ahorro (k€)\": u, \"Simulado · E(VAN) (k€)\": m, \"IC95 (k€)\": (lo, hi),\n                      \"Años con mantenimiento\": float(np.mean(mf))})\n    df = pd.DataFrame(filas).set_index(\"Umbral de ahorro (k€)\")\n    tB = teoria_B(com, esc, con_rejilla=False)\n    return df, tB[\"E_con\"], tB[\"E_sin\"]\n\n\ndef actualizacion_bayesiana(com, esc, lam_min=0.6, lam_max=0.95, n=4000, semilla=1000, rejilla=200):\n    \"\"\"O8.4 · cada centro tiene su propia λ ~ U(lam_min, lam_max); tras observar R₁ y R₂ se actualiza la creencia\n    sobre λ con la verosimilitud exacta de R₂ = 1 − (1 − R⁰₂)·λ (R₁ no informa sobre λ). Se mide cuánto se reduce la\n    incertidumbre y se decide continuar si el VAN esperado de los años restantes es positivo.\"\"\"\n    rng = np.random.default_rng(int(semilla) + 31)\n    T = tipo_desde_U(rng.random(n), esc[\"p\"])\n    lam_true = lam_min + (lam_max - lam_min) * rng.random(n)\n    U = rng.random((3, n))\n    TT = T\n    I, R0, S0 = variables(com, TT, U[0], U[1], U[2])\n    R2 = 1 - (1 - R0) * lam_true\n    g = np.linspace(lam_min, lam_max, rejilla)\n    post_m = np.zeros(n); post_sd = np.zeros(n)\n    for f in PROYECTOS:\n        mk = T == f\n        if not mk.any():\n            continue\n        a, b = _dist(com, f)[2:4]\n        r0 = 1 - (1 - R2[mk])[:, None] / g[None, :]\n        ok = (r0 > 0) & (r0 < 1)\n        lik = np.where(ok, _stats.beta.pdf(np.clip(r0, 1e-12, 1 - 1e-12), a, b) / g[None, :], 0.0)\n        w = lik / np.maximum(lik.sum(axis=1, keepdims=True), 1e-300)\n        post_m[mk] = w @ g\n        post_sd[mk] = np.sqrt(np.maximum(w @ g ** 2 - post_m[mk] ** 2, 0))\n    sd_prior = (lam_max - lam_min) / math.sqrt(12)\n    filas = []\n    for f in PROYECTOS:\n        mk = T == f\n        if mk.sum() < 3:\n            continue\n        filas.append({\"Tipo\": NOMBRE[f], \"Centros\": int(mk.sum()), \"σ a priori de λ\": sd_prior,\n                      \"σ a posteriori media\": float(post_sd[mk].mean()),\n                      \"Reducción de la incertidumbre\": 1 - float(post_sd[mk].mean()) / sd_prior,\n                      \"Correlación (λ real, media a posteriori)\": float(np.corrcoef(lam_true[mk], post_m[mk])[0, 1])})\n    df = pd.DataFrame(filas).set_index(\"Tipo\")\n    # decisión: VAN esperado de los años 3..H con λ = media a posteriori (con mantenimiento)\n    H = int(esc[\"H\"])\n    van_rest = []\n    for lam_ in (lam_min, (lam_min + lam_max) / 2, lam_max):\n        e2 = dict(esc, lam=lam_)\n        d = descuentos(e2)\n        p = normalizar(esc[\"p\"])\n        v = sum(pi * sum(d[t - 1] * momentos_anyo(com, e2, f, _exponente(e2, t), 1.0, 1)[\"EY\"] for t in range(3, H + 1))\n                for pi, f in zip(p, PROYECTOS))\n        van_rest.append({\"λ supuesta\": lam_, \"VAN esperado de los años 3 a H (k€)\": v,\n                         \"Decisión\": \"continuar\" if v > 0 else \"abandonar\"})\n    return df, pd.DataFrame(van_rest).set_index(\"λ supuesta\")\n\n\ndef sustitucion(com, esc, centros=300, replicas=20, semilla=1000):\n    \"\"\"O8.6 · mantener el proyecto con mantenimiento frente a sustituirlo a mitad del horizonte por uno nuevo del mismo\n    tipo (se paga otra inversión I y la curva de aprendizaje vuelve a t = 1).\"\"\"\n    H = int(esc[\"H\"]); m = H // 2 + 1\n    res = {\"Con mantenimiento\": [], \"Sin mantenimiento\": [], f\"Sustituir en el año {m} (con mantenimiento)\": []}\n    cv = {k: [] for k in res}\n    for r in range(int(replicas)):\n        b = base_programa(com, esc, int(centros), int(semilla) + 1000 + r)\n        for k, (pol, sus) in zip(res, ((\"con\", None), (\"sin\", None), (\"con\", m))):\n            v = van(esc, aplicar_politica(com, esc, b, pol, sustituir=sus)[\"Y\"])\n            res[k].append(float(v.mean())); cv[k].append(_cvar_muestra(v))\n    filas = []\n    for k in res:\n        mm, lo, hi = _ic_media(res[k])\n        filas.append({\"Alternativa\": k, \"Simulado · E(VAN) (k€)\": mm, \"IC95 (k€)\": (lo, hi),\n                      \"Simulado · CVaR 5 % (k€)\": float(np.mean(cv[k]))})\n    return pd.DataFrame(filas).set_index(\"Alternativa\")\n\n\n# ==============================================================================================\n# Mecanismo\n# ==============================================================================================\ndef un_proyecto(com, esc, uT, uI, uR, uS):\n    U = np.array([[uT], [uI], [uR], [uS]])\n    o = generar_proyectos(com, esc, U)\n    t = [float(x[0]) for x in o[\"terminos\"]]\n    return {\"T\": int(o[\"T\"][0]), \"I\": float(o[\"I\"][0]), \"R\": float(o[\"R\"][0]), \"S\": float(o[\"S\"][0]),\n            \"Y\": float(o[\"Y\"][0]), \"terminos\": t}\n\n\ndef trayectoria(com, esc, uT, uI, uR, uS):\n    \"\"\"Un centro con los mismos U todos los años: R_t, S_t y Y_t con y sin mantenimiento.\"\"\"\n    H = int(esc[\"H\"])\n    T = tipo_desde_U(np.array([uT]), esc[\"p\"])\n    b = {\"T\": T, \"I\": None}\n    TT = np.repeat(T[:, None], H, axis=1)\n    I, R0, S0 = variables(com, TT, np.full((1, H), uI), np.full((1, H), uR), np.full((1, H), uS))\n    b.update({\"I\": I, \"R0\": R0, \"S0\": S0, \"extra\": np.full((2, 1), 0.5)})\n    pc, ps = aplicar_politica(com, esc, b, \"con\"), aplicar_politica(com, esc, b, \"sin\")\n    return {\"T\": int(T[0]), \"R\": pc[\"R\"][0], \"Sc\": pc[\"S\"][0], \"Ss\": ps[\"S\"][0], \"Yc\": pc[\"Y\"][0], \"Ys\": ps[\"Y\"][0],\n            \"VANc\": float(van(esc, pc[\"Y\"])[0]), \"VANs\": float(van(esc, ps[\"Y\"])[0])}\n\n\n# ==============================================================================================\n# Formato y textos\n# ==============================================================================================\ndef num(x, d=2):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    if isinstance(x, float) and math.isinf(x):\n        return \"∞\"\n    if round(float(x), d) == 0:\n        x = 0.0\n    s = f\"{x:,.{d}f}\"\n    return s.replace(\",\", \"X\").replace(\".\", \",\").replace(\"X\", \".\")\n\n\ndef pct(x, d=1):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    return num(100 * x, d) + \" %\"\n\n\ndef keur(x, d=1):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    return num(x, d) + \" k€\"\n\n\ndef fmt_val(k, v):\n    if isinstance(v, str) or v is None:\n        return \"—\" if v is None else v\n    if isinstance(v, tuple):\n        return f\"[{fmt_val(k, v[0])}; {fmt_val(k, v[1])}]\"\n    if \"(k€\" in k or k.endswith(\"k€\"):\n        return keur(v, 2 if abs(v) < 10 else 1)\n    if \"P(\" in k or \"%\" in k or \"Contribución\" in k or \"Peso\" in k or \"Cuota\" in k or \"Reducción de la\" in k \\\n            or \"probabilidad\" in k.lower() or \"S₁\" in k or \"S_T\" in k or \"Cambio\" in k or \"Años con\" in k \\\n            or \"subvención\" in k.lower():\n        return pct(v, 2)\n    if \"CV\" in k or \"σ\" in k or \"λ\" in k or \"Correlación\" in k or \"δ\" in k:\n        return num(v, 3)\n    if \"p-valor\" in k:\n        return num(v, 4) if v >= 1e-4 else \"< 0,0001\"\n    if \"Centros\" in k or \"Proyectos\" in k:\n        return num(v, 0)\n    return num(v, 3)\n\n\ndef fmt_kpi(k, c, v):\n    return fmt_val(k, v)\n\n\ndef fmt_res(fila, col, v):\n    if col == \"Teórico en IC95\":\n        return \"—\" if v is None else (\"Sí\" if v else \"No\")\n    if col == \"Error relativo\":\n        return \"—\" if v is None or (isinstance(v, float) and math.isnan(v)) else pct(v, 2)\n    return fmt_val(fila, v)\n\n\ndef fmt_col(fila, col, v):\n    return fmt_val(col, v)\n\n\ndef fmt_obj(fila, col, v):\n    if col == \"Valor\":\n        return pct(v, 2) if fila.startswith(\"Probabilidad\") else keur(v)\n    return str(v)\n\n\ndef texto_escenario(nombre, r):\n    A, B = r[\"teoria\"][\"A\"], r[\"teoria\"][\"B\"]\n    okA = r[\"resA\"][\"Teórico en IC95\"].dropna().astype(bool); okB = r[\"resB\"][\"Teórico en IC95\"].dropna().astype(bool)\n    fuera = list(okA[~okA].index) + list(okB[~okB].index)\n    n_kpi = len(okA) + len(okB)\n    val = (\"la simulación reproduce los valores teóricos (todos dentro del IC95 %)\" if not fuera else\n           f\"la simulación reproduce los valores teóricos en {n_kpi - len(fuera)} de los {n_kpi} KPIs (fuera del IC95 %: \"\n           f\"{', '.join(fuera)}; con tantos KPIs es esperable que alguno quede fuera por azar)\")\n    pf = A[\"por_tipo\"]\n    mayor_cv = max(PROYECTOS, key=lambda f: pf[f][\"CV\"] if pf[f][\"p\"] > 0 else -1)\n    dom = int(np.argmax(np.abs(A[\"contrib\"])))\n    pol = POLITICAS.get(r[\"esc\"].get(\"politica\", \"con\"))\n    gan = B[\"E_gan\"]\n    txt = (f\"{nombre}: un proyecto rinde en media E(Y) = {keur(A['EY'])} (σ = {keur(A['sdY'])}); P(Y < 0) = \"\n           f\"{pct(A['Pperd'], 2)}, VaR 95 % = {keur(A['VaR'])} y CVaR 5 % = {keur(A['CVaR'])}. El proyecto \"\n           f\"{NOMBRE[mayor_cv]} tiene la mayor incertidumbre relativa (CV = {num(pf[mayor_cv]['CV'], 3)}) y el término \"\n           f\"«{TERMINOS[dom]}» explica el {pct(A['contrib'][dom], 0)} de Var(Y). En el programa de {B['H']} años, \"\n           f\"E(VAN) = {keur(B['E_con'])} con mantenimiento y {keur(B['E_sin'])} sin él: el mantenimiento \"\n           f\"{'gana' if gan > 0 else 'pierde'} {keur(abs(gan))} por centro (P(Δ > 0) = {pct(B['P_gan'], 1)}; compensa si \"\n           f\"C_mant < {keur(B['C_ind'], 2)}/año). Política elegida: {pol} (valores teóricos); {val}.\")\n    n_ok = (r[\"objetivos\"][\"Cumple\"] == \"Sí\").sum()\n    txt += f\" Cumple {n_ok} de los {len(r['objetivos'])} objetivos.\"\n    return txt\n\n\ndef recomendaciones(res, base, com):\n    \"\"\"O7.1 · recomendación sobre la política de mantenimiento con sus condiciones.\"\"\"\n    rec = []\n    if base in res:\n        r = res[base]; B = r[\"teoria\"][\"B\"]; esc = r[\"esc\"]\n        ic = r[\"resB\"].loc[\"Ganancia media pareada E(Δ) (k€)\", [\"IC95 inf\", \"IC95 sup\"]]\n        gan = B[\"E_gan\"]\n        verbo = \"No mantener\" if gan < 0 else \"Mantener\"\n        rec.append(f\"{verbo} con carácter general en «{base}»: la ganancia media del mantenimiento es {keur(gan, 2)} por \"\n                   f\"centro (IC95 % simulado [{keur(ic.iloc[0], 2)}; {keur(ic.iloc[1], 2)}]) y solo compensa en el \"\n                   f\"{pct(B['P_gan'], 0)} de los centros; el coste de indiferencia es {keur(B['C_ind'], 2)}/año frente a \"\n                   f\"{keur(c_efectivo(esc), 2)}/año.\")\n        pt = B[\"por_tipo\"]\n        activos = [f for f in PROYECTOS if pt[f][\"p\"] > 0] or list(PROYECTOS)\n        mx = max(pt[f][\"E_gan\"] for f in activos)\n        mejores = [f for f in activos if abs(pt[f][\"E_gan\"] - mx) < 1e-9]\n        peor = min(activos, key=lambda f: pt[f][\"E_gan\"])\n        nm = \" e \".join(NOMBRE[f] for f in mejores)\n        rec.append(f\"Decidir por tipo de proyecto: el mantenimiento es más valioso en {nm} (E(Δ) = \"\n                   f\"{keur(pt[mejores[0]]['E_gan'], 2)}, compensa si C_mant < {keur(pt[mejores[0]]['C_ind'], 2)}/año; ahorro \"\n                   f\"S medio {keur(pt[mejores[0]]['ES'], 1)}) y el menos valioso en {NOMBRE[peor]} \"\n                   f\"({keur(pt[peor]['E_gan'], 2)}; S medio {keur(pt[peor]['ES'], 1)}): su valor es proporcional al \"\n                   \"ahorro que protege, así que solo podría justificarse en los proyectos de ahorro alto\"\n                   + (\" y con un coste algo menor.\" if pt[mejores[0]][\"E_gan\"] < 0 else \".\"))\n        largo = [n for n, x in res.items() if int(x[\"esc\"][\"H\"]) > int(esc[\"H\"])]\n        caro = [n for n, x in res.items() if float(x[\"esc\"][\"C_mant\"]) > float(esc[\"C_mant\"])]\n        severo = [n for n, x in res.items() if float(x[\"esc\"][\"delta\"]) < float(esc[\"delta\"])]\n        barato = [n for n, x in res.items() if float(x[\"esc\"][\"C_mant\"]) < float(esc[\"C_mant\"])]\n        txt = \"Revisar la decisión si cambian las condiciones: \"\n        partes = []\n        if largo:\n            x = res[largo[0]][\"teoria\"][\"B\"]\n            partes.append(f\"con H = {res[largo[0]]['esc']['H']} años la ganancia pasa a {keur(x['E_gan'], 2)} (indiferencia \"\n                          f\"{keur(x['C_ind'], 2)}/año)\")\n        if severo:\n            x = res[severo[0]][\"teoria\"][\"B\"]\n            partes.append(f\"con δ = {num(res[severo[0]]['esc']['delta'], 2)} la ganancia es {keur(x['E_gan'], 2)}\")\n        if barato:\n            x = res[barato[0]][\"teoria\"][\"B\"]\n            partes.append(f\"con C_mant = {keur(res[barato[0]]['esc']['C_mant'], 1)}/año, {keur(x['E_gan'], 2)}\")\n        if B[\"X_ind\"] > 0:\n            partes.append(f\"una subvención del {pct(B['X_ind'], 0)} del coste lo haría rentable en promedio\")\n        if caro:\n            x = res[caro[0]][\"teoria\"][\"B\"]\n            partes.append(f\"con C_mant = {keur(res[caro[0]]['esc']['C_mant'], 1)}/año la pérdida sube a {keur(x['E_gan'], 2)}\")\n        rec.append(txt + \"; \".join(partes) + \".\" if partes else txt + \"horizontes más largos y degradaciones más severas \"\n                   \"aumentan el valor del mantenimiento.\")\n    filas = [(n, (r[\"objetivos\"][\"Cumple\"] == \"Sí\").sum(), r[\"teoria\"]) for n, r in res.items()]\n    max_ok = max(f[1] for f in filas)\n    mejor = sorted([f for f in filas if f[1] == max_ok], key=lambda f: -f[2][\"B\"][\"E_pol\"])[0]\n    rec.append(f\"Entre los escenarios analizados, «{mejor[0]}» cumple más objetivos ({mejor[1]} de \"\n               f\"{len(res[mejor[0]]['objetivos'])}): E(Y) = {keur(mejor[2]['A']['EY'])} por proyecto, P(Y < 0) = \"\n               f\"{pct(mejor[2]['A']['Pperd'], 2)} y E(VAN) = {keur(mejor[2]['B']['E_pol'])} por centro con la política elegida.\")\n    return rec\n\n\ndef texto_recomendacion(res, base, com):\n    return \" \".join(f\"({i + 1}) {r}\" for i, r in enumerate(recomendaciones(res, base, com)))\n\n\nKPIS_CUADRO = [\n    (\"Beneficio esperado por proyecto E(Y) y por tipo\", \"rentabilidad media de la cartera de proyectos\"),\n    (\"Probabilidad de pérdida P(Y < 0)\", \"frecuencia de proyectos que destruyen valor\"),\n    (\"VaR 95 % y CVaR 5 % del beneficio\", \"tamaño del peor caso para provisionar el riesgo\"),\n    (\"VAN esperado del programa con y sin mantenimiento\", \"valor del programa plurianual por centro\"),\n    (\"Ganancia del mantenimiento E(Δ) y P(Δ > 0)\", \"si compensa reinvertir y en cuántos centros\"),\n    (\"C_mant de indiferencia por tipo de proyecto\", \"precio máximo a negociar con el proveedor de mantenimiento\"),\n    (\"CVaR 5 % del VAN por política\", \"protección frente a los centros con peor resultado\"),\n]\n",
 "graficos.py": "# -*- coding: utf-8 -*-\n\"\"\"Gráficos (matplotlib) de la aplicación Bio-Distri. Cada función devuelve una Figure.\"\"\"\nimport io\n\nimport matplotlib\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\nimport matplotlib.ticker as mticker\nimport numpy as np\n\nimport biodistri as bd\n\n# Paleta categórica validada (orden fijo; el color sigue a la entidad, nunca a su posición)\nSERIES = [\"#2a78d6\", \"#eb6834\", \"#1baf7a\", \"#eda100\", \"#e87ba4\", \"#008300\", \"#6250d6\", \"#e34948\"]\nCOLOR_TIPO = {1: SERIES[0], 2: SERIES[6], 3: SERIES[3], 4: SERIES[2]}\nCOLOR_TERM = [SERIES[2], SERIES[0], SERIES[7], SERIES[1], SERIES[6]]      # V·R, S, −I, −Pen, garantía\nCON, SIN = SERIES[0], SERIES[1]\nBUENO, CRITICO = \"#0b7a0b\", \"#b23232\"\nTEXTO, TEXTO2, REJILLA = \"#0b0b0b\", \"#52514e\", \"#e1e0d9\"\n\nplt.rcParams.update({\n    \"figure.dpi\": 110, \"savefig.dpi\": 150, \"font.size\": 9.5, \"axes.titlesize\": 10.5, \"axes.titleweight\": \"bold\",\n    \"axes.edgecolor\": \"#b9b8b2\", \"axes.labelcolor\": TEXTO2, \"xtick.color\": TEXTO2, \"ytick.color\": TEXTO2,\n    \"axes.grid\": True, \"grid.color\": REJILLA, \"grid.linewidth\": 0.8, \"axes.axisbelow\": True,\n    \"axes.spines.top\": False, \"axes.spines.right\": False, \"legend.frameon\": False,\n})\n_K0 = mticker.FuncFormatter(lambda y, _: bd.num(y, 0))\n_PCT = mticker.PercentFormatter(1.0, decimals=0)\n\n\ndef color_escenario(i):\n    return SERIES[i % len(SERIES)]\n\n\ndef fig_a_png(fig):\n    buf = io.BytesIO()\n    fig.savefig(buf, format=\"png\", bbox_inches=\"tight\", facecolor=\"white\")\n    plt.close(fig)\n    buf.seek(0)\n    return buf\n\n\ndef _etiquetas(ax, nombres):\n    ax.set_xticks(range(len(nombres)))\n    ax.set_xticklabels(nombres, rotation=30 if len(nombres) > 2 else 0, ha=\"right\" if len(nombres) > 2 else \"center\",\n                       fontsize=7.5)\n\n\ndef _densidad(rej, bins):\n    \"\"\"Densidad de una distribución en rejilla promediada en los intervalos `bins`.\"\"\"\n    F = np.concatenate([[0.0], np.cumsum(rej.p)]) / rej.masa()\n    xe = np.concatenate([[rej.x[0] - rej.h / 2], rej.x + rej.h / 2])\n    Fb = np.interp(bins, xe, F)\n    return np.diff(Fb) / np.diff(bins)\n\n\n# ---------------------------------------------------------------------------------------------- mecanismo\ndef fig_mecanismo(p, uT, pr, titulo=None):\n    \"\"\"Izquierda: el tipo de proyecto se elige con U_T. Derecha: beneficio del proyecto por términos (cascada).\"\"\"\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 3.6), gridspec_kw={\"width_ratios\": [1.2, 1]})\n    F = np.cumsum(bd.normalizar(p)); esc = np.concatenate([[0], F])\n    for i, f in enumerate(bd.PROYECTOS):\n        if esc[i + 1] - esc[i] <= 0:\n            continue\n        a1.add_patch(plt.Rectangle((-0.6, esc[i]), 4.2, esc[i + 1] - esc[i], color=COLOR_TIPO[f], alpha=0.12, lw=0))\n        a1.plot([i - 0.5, i + 0.5], [F[i], F[i]], color=COLOR_TIPO[f], lw=3)\n        a1.text(3.65, (esc[i] + esc[i + 1]) / 2, f\"{bd.NOMBRE[f]} ({bd.num(esc[i], 2)}, {bd.num(F[i], 2)}]\",\n                va=\"center\", fontsize=7.5, color=COLOR_TIPO[f])\n    k = min(int(np.searchsorted(F, uT)), 3)\n    a1.annotate(\"\", xy=(k, uT), xytext=(-0.55, uT), arrowprops=dict(arrowstyle=\"->\", color=TEXTO, lw=1.6))\n    a1.annotate(\"\", xy=(k, -0.02), xytext=(k, uT), arrowprops=dict(arrowstyle=\"->\", color=TEXTO, lw=1.6))\n    a1.text(-0.55, min(uT + 0.03, 1.0), f\"U_T = {bd.num(uT, 2)}\", fontsize=9)\n    a1.set_xlim(-0.6, 5.6); a1.set_ylim(-0.03, 1.05)\n    a1.set_xticks(range(4)); a1.set_xticklabels([bd.NOMBRE[f] for f in bd.PROYECTOS], fontsize=8)\n    a1.set_ylabel(\"F(T)\"); a1.set_title(\"Paso 1 · tipo de proyecto por transformada inversa\", fontsize=9.5)\n    t = pr[\"terminos\"]; noms = [\"V·R\", \"S\", \"−I\", \"−Pen\", \"garantía\"]\n    acum = 0.0; x = 0\n    for j in range(5):\n        if abs(t[j]) < 1e-9 and j >= 3:\n            continue\n        a2.bar([x], [t[j]], bottom=[acum], color=COLOR_TERM[j], width=0.6)\n        a2.text(x, acum + t[j] if t[j] >= 0 else acum + t[j], bd.num(t[j], 1), ha=\"center\",\n                va=\"bottom\" if t[j] >= 0 else \"top\", fontsize=8)\n        acum += t[j]; x += 1\n    a2.bar([x], [pr[\"Y\"]], color=TEXTO2, width=0.6)\n    a2.text(x, max(pr[\"Y\"], 0), f\"Y = {bd.num(pr['Y'], 1)}\", ha=\"center\", va=\"bottom\", fontsize=8.5)\n    usados = [noms[j] for j in range(5) if not (abs(t[j]) < 1e-9 and j >= 3)]\n    a2.set_xticks(range(x + 1)); a2.set_xticklabels(usados + [\"Y\"])\n    a2.axhline(0, color=TEXTO2, lw=0.8)\n    a2.set_ylabel(\"k€\"); a2.set_title(\"Paso 2 · beneficio del proyecto por términos\", fontsize=9.5)\n    a2.margins(y=0.15)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_trayectoria(tr, esc, titulo=None):\n    \"\"\"Un centro con los mismos U todos los años: aprendizaje de R, ahorro S y beneficio anual por política.\"\"\"\n    H = len(tr[\"R\"]); t = np.arange(1, H + 1)\n    fig, (a1, a2, a3) = plt.subplots(1, 3, figsize=(11, 3.2))\n    a1.plot(t, tr[\"R\"], \"o-\", color=SERIES[2], lw=2)\n    a1.axhline(float(esc[\"umbral_R\"]), color=CRITICO, ls=\"--\", lw=1.2, label=\"umbral de penalización\")\n    a1.set_ylim(0, 1.05); a1.yaxis.set_major_formatter(_PCT)\n    a1.set_title(\"R_t · curva de aprendizaje\", fontsize=9.5); a1.legend(fontsize=7.5, loc=\"lower right\")\n    a2.plot(t, tr[\"Sc\"], \"o-\", color=CON, lw=2, label=\"con mantenimiento\")\n    a2.plot(t, tr[\"Ss\"], \"s--\", color=SIN, lw=2, label=\"sin mantenimiento\")\n    a2.set_ylim(0, max(tr[\"Sc\"].max(), 1e-9) * 1.25)\n    a2.set_title(\"S_t · ahorro operativo (k€)\", fontsize=9.5); a2.legend(fontsize=7.5)\n    a3.bar(t - 0.2, tr[\"Yc\"], width=0.4, color=CON, label=f\"con (VAN {bd.num(tr['VANc'], 1)})\")\n    a3.bar(t + 0.2, tr[\"Ys\"], width=0.4, color=SIN, label=f\"sin (VAN {bd.num(tr['VANs'], 1)})\")\n    a3.set_title(\"Y_t · beneficio anual (k€)\", fontsize=9.5); a3.legend(fontsize=7.5, loc=\"lower right\")\n    a3.yaxis.set_major_formatter(_K0)\n    for ax in (a1, a2, a3):\n        ax.set_xticks(t); ax.set_xlabel(\"año\")\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- bloque A\ndef fig_hist_Y(tA, Y, titulo=None):\n    Y = np.asarray(Y)\n    lo, hi = float(np.quantile(Y, 0.001)), float(np.quantile(Y, 0.999))\n    bins = np.linspace(lo, hi, 90)\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    ax.hist(Y[(Y >= lo) & (Y <= hi)], bins=bins, density=True, color=SERIES[0], alpha=0.45, edgecolor=\"white\",\n            label=\"simulación\")\n    ax.step(bins[:-1], _densidad(tA[\"rejilla\"], bins), where=\"post\", color=TEXTO, lw=1.4, label=\"teórica\")\n    ax.axvline(0, color=CRITICO, lw=1.4, label=f\"pérdida (P(Y < 0) = {bd.pct(tA['Pperd'], 2)})\")\n    ax.axvline(tA[\"CVaR\"], color=SERIES[6], ls=\":\", lw=1.6, label=f\"CVaR 5 % = {bd.keur(tA['CVaR'])}\")\n    ax.axvline(tA[\"VaR\"], color=SERIES[3], ls=\"-.\", lw=1.4, label=f\"VaR 95 % = {bd.keur(tA['VaR'])}\")\n    ax.axvline(tA[\"EY\"], color=SERIES[0], ls=\"--\", lw=1.4, label=f\"E(Y) = {bd.keur(tA['EY'])}\")\n    ax.xaxis.set_major_formatter(_K0)\n    ax.set_xlabel(\"beneficio neto de un proyecto Y (k€) · del percentil 0,1 al 99,9\"); ax.set_ylabel(\"densidad\")\n    ax.set_title(titulo or \"Distribución del beneficio de un proyecto\")\n    ax.legend(loc=\"upper left\", fontsize=7.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_por_tipo(tA, resA, titulo=None):\n    tipos = [f for f in bd.PROYECTOS if tA[\"por_tipo\"][f][\"p\"] > 0]\n    noms = [bd.NOMBRE[f] for f in tipos]\n    pf = tA[\"por_tipo\"]\n    g = lambda k: resA.loc[k, \"Simulado · media\"]\n    datos = [(\"E(Y | tipo) (k€)\", [pf[f][\"EY\"] for f in tipos], [g(f\"E(Y | {n}) (k€)\") for n in noms], 1),\n             (\"P(Y < 0 | tipo)\", [pf[f][\"Pperd\"] for f in tipos], [g(f\"P(Y < 0 | {n})\") for n in noms], \"%\"),\n             (\"Coeficiente de variación\", [pf[f][\"CV\"] for f in tipos], [g(f\"CV(Y | {n})\") for n in noms], 3)]\n    fig, axs = plt.subplots(1, 3, figsize=(11, 3.4))\n    x = np.arange(len(tipos))\n    for ax, (tit, v, s, d) in zip(axs, datos):\n        bars = ax.bar(x, v, color=[COLOR_TIPO[f] for f in tipos], width=0.6)\n        ax.plot(x, s, \"D\", color=TEXTO, ms=6, label=\"simulado\")\n        for b_, y in zip(bars, v):\n            ax.text(b_.get_x() + b_.get_width() / 2, b_.get_height(), bd.pct(y, 1) if d == \"%\" else bd.num(y, d),\n                    ha=\"center\", va=\"bottom\", fontsize=8)\n        ax.set_xticks(x); ax.set_xticklabels(noms)\n        ax.set_title(tit, fontsize=9.5)\n        ax.set_ylim(0, max(max(v), np.nanmax(s), 1e-9) * 1.25)\n        if d == \"%\":\n            ax.yaxis.set_major_formatter(mticker.PercentFormatter(1.0, decimals=1))\n    axs[0].legend(loc=\"upper right\", fontsize=8)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_descomposicion(tA, resA, titulo=None):\n    v = list(tA[\"contrib\"])\n    s = [resA.loc[f\"Contribución a Var(Y) · {n}\", \"Simulado · media\"] for n in bd.TERMINOS]\n    keep = [i for i in range(5) if abs(v[i]) > 1e-9 or abs(s[i]) > 1e-9]\n    fig, ax = plt.subplots(figsize=(9, 0.6 + 0.55 * len(keep)))\n    x = np.arange(len(keep))\n    ax.barh(x, [v[i] for i in keep], color=[COLOR_TERM[i] for i in keep], height=0.55)\n    ax.plot([s[i] for i in keep], x, \"D\", color=TEXTO, ms=6, label=\"simulado\")\n    for j, i in enumerate(keep):\n        ax.text(max(v[i], 0), j, \"  \" + bd.pct(v[i], 1), va=\"center\", fontsize=8.5)\n    ax.set_yticks(x); ax.set_yticklabels([bd.TERMINOS[i] for i in keep])\n    ax.invert_yaxis()\n    ax.xaxis.set_major_formatter(_PCT)\n    ax.set_xlim(min(0, min(v)) * 1.3 - 0.02, max(v) * 1.2)\n    ax.axvline(0, color=TEXTO2, lw=0.8)\n    ax.set_title(titulo or \"Descomposición de Var(Y): Cov(término, Y) / Var(Y)\")\n    ax.legend(loc=\"lower right\", fontsize=8)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_traza_A(traza, titulo=None):\n    tr = traza\n    x = tr[\"Proyecto\"].to_numpy()\n    Y = tr[\"Y (k€)\"].to_numpy()\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    ax.bar(x, Y, color=[COLOR_TIPO[[k for k, v in bd.NOMBRE.items() if v == t][0]] for t in tr[\"Tipo\"]], width=0.8)\n    pen = tr[\"Penalización (k€)\"].to_numpy() > 0\n    ax.plot(x[pen], Y[pen], \"v\", color=CRITICO, ms=7, label=\"penalización (R < umbral)\")\n    for f in bd.PROYECTOS:\n        ax.bar([], [], color=COLOR_TIPO[f], label=bd.NOMBRE[f])\n    ax.axhline(0, color=TEXTO2, lw=0.8)\n    ax.set_xlabel(\"proyecto simulado\"); ax.set_ylabel(\"Y (k€)\")\n    ax.set_title(titulo or f\"Funcionamiento simulado · primeros {len(tr)} proyectos\")\n    from matplotlib.patches import Patch\n    h = [Patch(color=COLOR_TIPO[f]) for f in bd.PROYECTOS]; l = [bd.NOMBRE[f] for f in bd.PROYECTOS]\n    hh, ll = ax.get_legend_handles_labels()\n    ax.legend(h + hh[:1], l + ll[:1], loc=\"upper center\", bbox_to_anchor=(0.5, -0.17), ncol=5, fontsize=7.5)\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- bloque B\ndef fig_hist_van(tB, mcB, titulo=None):\n    vc, vs = mcB[\"VAN_con\"], mcB[\"VAN_sin\"]\n    lo = float(min(np.quantile(vc, 0.001), np.quantile(vs, 0.001))); hi = float(max(np.quantile(vc, 0.999), np.quantile(vs, 0.999)))\n    bins = np.linspace(lo, hi, 70)\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    ax.hist(vc, bins=bins, density=True, color=CON, alpha=0.35, edgecolor=\"white\", label=\"con mantenimiento (simulado)\")\n    ax.hist(vs, bins=bins, density=True, color=SIN, alpha=0.35, edgecolor=\"white\", label=\"sin mantenimiento (simulado)\")\n    ax.step(bins[:-1], _densidad(tB[\"rejilla_con\"], bins), where=\"post\", color=CON, lw=1.5, label=\"teórica · con\")\n    ax.step(bins[:-1], _densidad(tB[\"rejilla_sin\"], bins), where=\"post\", color=SIN, lw=1.5, ls=\"--\", label=\"teórica · sin\")\n    ax.axvline(tB[\"CVaR_con\"], color=CON, ls=\":\", lw=1.4, label=f\"CVaR 5 % con = {bd.keur(tB['CVaR_con'], 0)}\")\n    ax.axvline(tB[\"CVaR_sin\"], color=SIN, ls=\":\", lw=1.4, label=f\"CVaR 5 % sin = {bd.keur(tB['CVaR_sin'], 0)}\")\n    ax.xaxis.set_major_formatter(_K0)\n    ax.set_xlabel(\"VAN del programa de un centro (k€)\"); ax.set_ylabel(\"densidad\")\n    ax.set_title(titulo or \"Distribución del VAN por centro\")\n    ax.legend(loc=\"upper left\", fontsize=7)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_ganancia(tB, mcB, titulo=None):\n    g = mcB[\"VAN_con\"] - mcB[\"VAN_sin\"]; T = mcB[\"T\"]\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(10.5, 3.4), gridspec_kw={\"width_ratios\": [1.3, 1]})\n    for f in bd.PROYECTOS:\n        mk = T == f\n        if mk.sum():\n            a1.hist(g[mk], bins=40, color=COLOR_TIPO[f], alpha=0.55, label=bd.NOMBRE[f], edgecolor=\"white\")\n    a1.axvline(0, color=CRITICO, lw=1.4)\n    a1.axvline(tB[\"E_gan\"], color=TEXTO, ls=\"--\", lw=1.4, label=f\"E(Δ) = {bd.keur(tB['E_gan'], 2)}\")\n    a1.set_xlabel(\"Δ = VAN_con − VAN_sin por centro (k€)\"); a1.set_ylabel(\"centros simulados\")\n    a1.set_title(f\"Ganancia del mantenimiento · P(Δ > 0) = {bd.pct(tB['P_gan'], 1)}\", fontsize=9.5)\n    a1.legend(fontsize=7.5)\n    tipos = [f for f in bd.PROYECTOS if tB[\"por_tipo\"][f][\"p\"] > 0]\n    x = np.arange(len(tipos))\n    v = [tB[\"por_tipo\"][f][\"E_gan\"] for f in tipos]\n    s = [mcB[\"replicas\"][f\"E(Δ | {bd.NOMBRE[f]})\"].mean() for f in tipos]\n    a2.bar(x, v, color=[BUENO if y > 0 else CRITICO for y in v], width=0.6, alpha=0.85)\n    a2.plot(x, s, \"D\", color=TEXTO, ms=6, label=\"simulado\")\n    for i, f in enumerate(tipos):\n        a2.text(i, v[i], f\"{bd.num(v[i], 2)}\\nS̄ = {bd.num(tB['por_tipo'][f]['ES'], 1)}\", ha=\"center\",\n                va=\"bottom\" if v[i] >= 0 else \"top\", fontsize=7.5)\n    a2.axhline(0, color=TEXTO2, lw=0.8)\n    a2.set_xticks(x); a2.set_xticklabels([bd.NOMBRE[f] for f in tipos])\n    a2.set_title(\"E(Δ | tipo) (k€) y ahorro medio S̄ (O5.3)\", fontsize=9.5)\n    a2.legend(fontsize=7.5, loc=\"lower left\")\n    a2.margins(y=0.3)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_ejemplo_B(ej, esc, titulo=None):\n    \"\"\"Primeros centros simulados: ahorro S_t con y sin mantenimiento y beneficio medio por año.\"\"\"\n    H = ej[\"Sc\"].shape[1]; t = np.arange(1, H + 1)\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(10.5, 3.3))\n    for i in range(min(12, len(ej[\"T\"]))):\n        c = COLOR_TIPO[int(ej[\"T\"][i])]\n        a1.plot(t, ej[\"Sc\"][i], \"-\", color=c, lw=1, alpha=0.7)\n        a1.plot(t, ej[\"Ss\"][i], \":\", color=c, lw=1.3, alpha=0.9)\n    a1.plot([], [], \"-\", color=TEXTO2, label=\"con mantenimiento\"); a1.plot([], [], \":\", color=TEXTO2, label=\"sin mantenimiento\")\n    a1.set_xticks(t); a1.set_xlabel(\"año\"); a1.set_ylabel(\"S_t (k€)\")\n    a1.set_title(\"Ahorro de 12 centros simulados (color = tipo)\", fontsize=9.5); a1.legend(fontsize=7.5)\n    a2.plot(t, ej[\"Yc\"].mean(axis=0), \"o-\", color=CON, lw=2, label=\"con mantenimiento\")\n    a2.plot(t, ej[\"Ys\"].mean(axis=0), \"s--\", color=SIN, lw=2, label=\"sin mantenimiento\")\n    a2.set_xticks(t); a2.set_xlabel(\"año\"); a2.set_ylabel(\"k€\")\n    a2.set_title(f\"Beneficio medio por año ({len(ej['T'])} centros)\", fontsize=9.5); a2.legend(fontsize=7.5)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- comparativas\ndef fig_comparativa(res):\n    nombres = list(res)\n    cols = [color_escenario(i) for i in range(len(nombres))]\n    fig, axs = plt.subplots(2, 2, figsize=(11, 7.6))\n    axs = axs.ravel()\n    x = np.arange(len(nombres))\n    A = [res[n][\"teoria\"][\"A\"] for n in nombres]; B = [res[n][\"teoria\"][\"B\"] for n in nombres]\n    vals = [a[\"EY\"] for a in A]\n    axs[0].bar(x, vals, color=cols, width=0.65)\n    for i, v in enumerate(vals):\n        axs[0].text(i, v, bd.num(v, 1), ha=\"center\", va=\"bottom\", fontsize=7)\n    lo, hi = min(vals), max(vals); m = (hi - lo) or 1\n    axs[0].set_ylim(max(0, lo - 1.2 * m), hi + 0.4 * m)\n    axs[0].set_title(\"E(Y) por proyecto (k€)\", fontsize=9)\n    vals = [a[\"Pperd\"] for a in A]\n    axs[1].bar(x, vals, color=cols, width=0.65)\n    for i, v in enumerate(vals):\n        axs[1].text(i, v, bd.num(100 * v, 2), ha=\"center\", va=\"bottom\", fontsize=7)\n    axs[1].yaxis.set_major_formatter(mticker.PercentFormatter(1.0, decimals=1)); axs[1].set_ylim(0, max(vals) * 1.25)\n    axs[1].set_title(\"P(Y < 0)\", fontsize=9)\n    c_ = np.array([b[\"E_con\"] for b in B]); s_ = np.array([b[\"E_sin\"] for b in B])\n    axs[2].bar(x - 0.2, c_, width=0.4, color=CON, label=\"con mantenimiento\")\n    axs[2].bar(x + 0.2, s_, width=0.4, color=SIN, label=\"sin mantenimiento\")\n    lo, hi = min(c_.min(), s_.min()), max(c_.max(), s_.max()); m = (hi - lo) or 1\n    axs[2].set_ylim(max(0, lo - 0.3 * m), hi + 0.25 * m); axs[2].yaxis.set_major_formatter(_K0)\n    axs[2].set_title(\"E(VAN) por centro (k€)\", fontsize=9); axs[2].legend(fontsize=7, loc=\"upper left\")\n    vals = [b[\"E_gan\"] for b in B]\n    axs[3].bar(x, vals, color=[BUENO if v > 0 else CRITICO for v in vals], width=0.65)\n    for i, v in enumerate(vals):\n        axs[3].text(i, v, bd.num(v, 2), ha=\"center\", va=\"bottom\" if v >= 0 else \"top\", fontsize=7)\n    axs[3].axhline(0, color=TEXTO2, lw=0.8); axs[3].margins(y=0.2)\n    axs[3].set_title(\"Ganancia del mantenimiento E(Δ) (k€)\", fontsize=9)\n    for ax in axs:\n        _etiquetas(ax, nombres)\n    fig.text(0.5, 0.005, \"Los ejes de E(Y) y E(VAN) no empiezan en 0 para que se aprecien las diferencias.\",\n             ha=\"center\", fontsize=7.5, color=TEXTO2)\n    fig.tight_layout(rect=(0, 0.02, 1, 1))\n    return fig\n\n\ndef fig_diferencias(dif, titulo=None):\n    nombres = list(dif.index)\n    x = np.arange(len(nombres))\n    teo = dif[\"ΔE(VAN) política · teórico (k€)\"].to_numpy(float)\n    sim = dif[\"ΔE(VAN) política · simulado (k€)\"].to_numpy(float)\n    ic = np.array([list(v) for v in dif[\"IC95 ΔE(VAN) (k€)\"]])\n    fig, ax = plt.subplots(figsize=(9, 3.6))\n    ax.bar(x, teo, width=0.55, color=[BUENO if v >= 0 else CRITICO for v in teo], alpha=0.8, label=\"teórico\")\n    ax.errorbar(x, sim, yerr=[sim - ic[:, 0], ic[:, 1] - sim], fmt=\"D\", color=TEXTO, ms=5, capsize=3,\n                label=\"simulado ± IC95 % (pareado)\")\n    for i, v in enumerate(teo):\n        ax.text(i + 0.3, v, bd.num(v, 1), ha=\"left\", va=\"center\", fontsize=7.5)\n    ax.axhline(0, color=TEXTO2, lw=1)\n    ax.yaxis.set_major_formatter(_K0)\n    _etiquetas(ax, nombres)\n    ax.set_ylabel(\"k€ por centro\")\n    ax.set_title(titulo or \"Diferencia de E(VAN) (política elegida) frente al escenario base\")\n    ax.legend(loc=\"best\", fontsize=7.5)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_validacion(res):\n    nombres = list(res)\n    kA = [(\"Beneficio esperado E(Y) (k€)\", \"E(Y)\"), (\"Probabilidad de pérdida P(Y < 0)\", \"P(Y < 0)\"),\n          (\"VaR 95 % · percentil 5 de Y (k€)\", \"VaR Y\")]\n    kB = [(\"VAN esperado con mantenimiento (k€)\", \"E(VAN) con\"), (\"Ganancia media pareada E(Δ) (k€)\", \"E(Δ)\"),\n          (\"P(el mantenimiento compensa) P(Δ > 0)\", \"P(Δ > 0)\"), (\"CVaR 5 % del VAN con mantenimiento (k€)\", \"CVaR VAN\")]\n    fig, ax = plt.subplots(figsize=(9, 3.3))\n    ks = kA + kB\n    ancho = 0.8 / len(nombres)\n    for i, n in enumerate(nombres):\n        v = []\n        for k, e_ in ks:\n            tab = res[n][\"resA\"] if (k, e_) in kA else res[n][\"resB\"]\n            lo, hi, m, teo = (tab.loc[k, \"IC95 inf\"], tab.loc[k, \"IC95 sup\"], tab.loc[k, \"Simulado · media\"],\n                              tab.loc[k, \"Teórico\"])\n            se = (hi - lo) / (2 * 1.96)\n            v.append(0.0 if tab.loc[k, \"Teórico en IC95\"] is None or not se > 0 else (m - teo) / se)\n        ax.bar(np.arange(len(ks)) + i * ancho - 0.4 + ancho / 2, v, width=ancho * 0.9, color=color_escenario(i), label=n)\n    ax.axhline(0, c=TEXTO2, lw=1)\n    for y in (-2, 2):\n        ax.axhline(y, c=CRITICO, lw=1, ls=\"--\")\n    ax.set_xticks(range(len(ks))); ax.set_xticklabels([e for _, e in ks], fontsize=8.5)\n    ax.set_ylabel(\"(simulado − teórico) / error estándar\")\n    ax.set_ylim(min(-3, ax.get_ylim()[0]), max(3, ax.get_ylim()[1]))\n    ax.set_title(\"Validación: error estandarizado de la simulación (±2 ≈ IC95 %)\")\n    ax.legend(fontsize=6.5, ncol=min(3, len(nombres)))\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- mantenimiento\ndef fig_barrido(df, titulo=None, marca=None):\n    par = df.index.name\n    x = df.index.to_numpy(float)\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(10.5, 3.4))\n    a1.plot(x, df[\"Teórico · E(Δ) (k€)\"], \"-\", color=TEXTO, lw=2, label=\"teórico (red)\")\n    m = df[\"Simulado · E(Δ) (k€)\"].to_numpy(float); ic = np.array([list(v) for v in df[\"IC95 E(Δ) (k€)\"]])\n    a1.errorbar(x, m, yerr=[m - ic[:, 0], ic[:, 1] - m], fmt=\"D\", color=SERIES[0], ms=5, capsize=3, label=\"simulado ± IC95 %\")\n    for f in bd.PROYECTOS:\n        a1.plot(x, df[f\"Teórico · E(Δ | {bd.NOMBRE[f]}) (k€)\"], \"--\", color=COLOR_TIPO[f], lw=1.2, label=bd.NOMBRE[f])\n    a1.axhline(0, color=CRITICO, lw=1)\n    if marca is not None:\n        a1.axvline(marca, color=TEXTO2, ls=\":\", lw=1)\n    a1.set_xlabel(par); a1.set_ylabel(\"E(Δ) (k€ por centro)\")\n    a1.set_title(\"Ganancia del mantenimiento\", fontsize=9.5); a1.legend(fontsize=7, ncol=2)\n    a2.plot(x, df[\"Teórico · P(Δ > 0)\"], \"o-\", color=SERIES[6], lw=2)\n    a2.yaxis.set_major_formatter(_PCT); a2.set_ylim(0, 1.05)\n    a2.set_xlabel(par); a2.set_title(\"P(Δ > 0): centros en los que compensa\", fontsize=9.5)\n    if marca is not None:\n        a2.axvline(marca, color=TEXTO2, ls=\":\", lw=1)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_racha(df, titulo=None):\n    t = df.index.to_numpy()\n    fig, (a1, a2, a3) = plt.subplots(1, 3, figsize=(11.5, 3.3))\n    for nom, ls in ((\"Sin racha\", \"-\"), (\"Con racha\", \"--\")):\n        a1.plot(t, df[f\"{nom} · R medio\"], ls, marker=\"o\", color=SERIES[2] if nom == \"Sin racha\" else CRITICO, label=nom)\n        a2.plot(t, df[f\"{nom} · S con mant. (k€)\"], ls, marker=\"o\", color=CON, label=f\"{nom} · con\")\n        a2.plot(t, df[f\"{nom} · S sin mant. (k€)\"], ls, marker=\"s\", color=SIN, label=f\"{nom} · sin\")\n        a3.plot(t, df[f\"{nom} · VAN acum. con (k€)\"], ls, marker=\"o\", color=CON, label=f\"{nom} · con\")\n        a3.plot(t, df[f\"{nom} · VAN acum. sin (k€)\"], ls, marker=\"s\", color=SIN, label=f\"{nom} · sin\")\n    a1.yaxis.set_major_formatter(_PCT); a1.set_ylim(0, 1.05)\n    a1.set_title(\"R medio\", fontsize=9.5); a1.legend(fontsize=7)\n    a2.set_title(\"Ahorro S medio (k€)\", fontsize=9.5); a2.legend(fontsize=6.5)\n    a3.set_title(\"VAN acumulado medio (k€)\", fontsize=9.5); a3.legend(fontsize=6.5)\n    a3.yaxis.set_major_formatter(_K0)\n    for ax in (a1, a2, a3):\n        ax.set_xticks(t); ax.set_xlabel(\"año\")\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- sensibilidad\ndef fig_sens_param(df, elas, titulo=None):\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 3.7), gridspec_kw={\"width_ratios\": [1.6, 1]})\n    for i, (par, d) in enumerate(df.groupby(\"Parámetro\", sort=False)):\n        a1.plot(100 * d[\"Variación\"], d[\"Teórico · Var(Y)\"], \"o-\", color=SERIES[i % 8], lw=1.8, ms=4, label=par)\n    a1.yaxis.set_major_formatter(_K0)\n    a1.set_xlabel(\"variación del parámetro (%)\"); a1.set_ylabel(\"Var(Y) teórica (k€²)\")\n    a1.set_title(\"Var(Y) al variar cada parámetro (resto fijo)\", fontsize=9.5)\n    a1.legend(fontsize=6.5, ncol=2)\n    nombres = list(elas); v = [elas[k] for k in nombres]\n    a2.barh(nombres, [abs(y) for y in v], color=[SERIES[i % 8] for i in range(len(v))], height=0.55)\n    for i, y in enumerate(v):\n        a2.text(abs(y), i, \"  \" + bd.num(y, 2), va=\"center\", fontsize=8)\n    a2.invert_yaxis(); a2.set_xlim(0, max(abs(y) for y in v) * 1.35)\n    a2.tick_params(axis=\"y\", labelsize=7.5)\n    a2.set_title(\"|Elasticidad| de Var(Y) (signo en la etiqueta)\", fontsize=9.5)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_sobol(df, titulo=None):\n    fig, ax = plt.subplots(figsize=(8.5, 3.0))\n    x = np.arange(len(df))\n    ax.bar(x - 0.2, df[\"Índice de primer orden S₁\"], width=0.4, color=SERIES[0], label=\"S₁ (primer orden)\")\n    ax.bar(x + 0.2, df[\"Índice total S_T\"], width=0.4, color=SERIES[1], label=\"S_T (total, con interacciones)\")\n    if \"Teórico · S₁\" in df:\n        t = df[\"Teórico · S₁\"].to_numpy(float); ok = ~np.isnan(t)\n        ax.plot(x[ok] - 0.2, t[ok], \"D\", color=TEXTO, ms=6, label=\"S₁ teórico del tipo de proyecto\")\n    for i, (a, b) in enumerate(zip(df[\"Índice de primer orden S₁\"], df[\"Índice total S_T\"])):\n        ax.text(i - 0.2, max(a, 0), bd.pct(a, 0), ha=\"center\", va=\"bottom\", fontsize=7.5)\n        ax.text(i + 0.2, b, bd.pct(b, 0), ha=\"center\", va=\"bottom\", fontsize=7.5)\n    ax.set_xticks(x); ax.set_xticklabels(df.index)\n    ax.yaxis.set_major_formatter(_PCT); ax.set_ylim(min(0, df[\"Índice de primer orden S₁\"].min()) - 0.02, 1.15)\n    ax.set_title(titulo or \"O2.2 · índices de Sobol de las entradas aleatorias sobre Y\")\n    ax.legend(fontsize=7.5, loc=\"upper right\")\n    fig.tight_layout()\n    return fig\n\n\ndef fig_vequilibrio(df, Vact, titulo=None):\n    fig, ax = plt.subplots(figsize=(8.5, 3.0))\n    y = np.arange(len(df))\n    v = df[\"V_stock necesario (k€)\"].to_numpy(float)\n    ax.barh(y, v, color=SERIES[3], height=0.55)\n    ax.axvline(Vact, color=TEXTO, ls=\"--\", lw=1.4, label=f\"V_stock actual = {bd.keur(Vact, 0)}\")\n    for i, x_ in enumerate(v):\n        ax.text(x_, i, \"  \" + bd.keur(x_, 1), va=\"center\", fontsize=8)\n    ax.set_yticks(y); ax.set_yticklabels(df.index, fontsize=8); ax.invert_yaxis()\n    ax.xaxis.set_major_formatter(_K0); ax.set_xlim(0, max(v.max(), Vact) * 1.25)\n    ax.set_title(titulo or \"O3.3 · V_stock que necesita el Empaque para cada meta\")\n    ax.legend(fontsize=7.5, loc=\"lower right\")\n    fig.tight_layout()\n    return fig\n\n\ndef fig_adaptativa(df, Ec, Es, titulo=None):\n    fig, ax = plt.subplots(figsize=(8.5, 3.2))\n    x = df.index.to_numpy(float)\n    m = df[\"Simulado · E(VAN) (k€)\"].to_numpy(float); ic = np.array([list(v) for v in df[\"IC95 (k€)\"]])\n    ax.errorbar(x, m, yerr=[m - ic[:, 0], ic[:, 1] - m], fmt=\"D-\", color=SERIES[6], ms=5, capsize=3,\n                label=\"política adaptativa (simulada)\")\n    ax.axhline(Ec, color=CON, ls=\"--\", lw=1.4, label=f\"siempre mantener · {bd.keur(Ec, 1)}\")\n    ax.axhline(Es, color=SIN, ls=\":\", lw=1.6, label=f\"nunca mantener · {bd.keur(Es, 1)}\")\n    ax.set_xlabel(\"umbral de ahorro observado para mantener (k€)\"); ax.set_ylabel(\"E(VAN) (k€)\")\n    ax.set_title(titulo or \"O8.3 · política adaptativa de mantenimiento\")\n    ax.legend(fontsize=7.5); ax.margins(y=0.25)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_sens_convergencia(df, metrica, titulo=None):\n    fig, ax = plt.subplots(figsize=(9, 3.6))\n    x = np.arange(len(df))\n    for i, (_, r) in enumerate(df.iterrows()):\n        ax.plot([i] * len(r[\"Medias por réplica\"]), r[\"Medias por réplica\"], \"o\", color=SERIES[0], alpha=0.3, ms=5)\n    m = df[\"Media de las réplicas\"]\n    ax.errorbar(x, m, yerr=[m - df[\"IC95 inf\"], df[\"IC95 sup\"] - m], fmt=\"o-\", color=SERIES[0], ms=7, capsize=4,\n                label=\"media de las réplicas ± IC95 %\")\n    ax.plot([], [], \"o\", color=SERIES[0], alpha=0.3, label=\"cada réplica\")\n    ax.axhline(df[\"Teórico\"].iloc[0], color=TEXTO, ls=\"--\", lw=1.4, label=f\"teórico {bd.keur(df['Teórico'].iloc[0])}\")\n    ax.set_xticks(x); ax.set_xticklabels([bd.num(v, 0) for v in df.index])\n    ax.set_xlabel(\"proyectos simulados\" if metrica == \"proyecto\" else \"centros simulados\"); ax.set_ylabel(\"k€\")\n    ax.set_title(titulo or (\"Convergencia · E(Y) por proyecto\" if metrica == \"proyecto\" else \"Convergencia · E(VAN) con mantenimiento\"))\n    ax.legend(loc=\"best\", fontsize=8)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_sens_variabilidad(df, metrica, titulo=None):\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    x = np.arange(len(df))\n    v = df[\"σ entre réplicas\"]\n    ax.bar(x, v, color=SERIES[0], width=0.6, label=\"σ entre réplicas (simulada)\")\n    ax.plot(x, df[\"σ teórica del estimador\"], color=TEXTO, marker=\"o\", lw=1.5, label=\"σ teórica del estimador\")\n    for i, y in enumerate(v):\n        ax.text(i, y, bd.num(y, 2), ha=\"center\", va=\"bottom\", fontsize=8)\n    ax.set_xticks(x); ax.set_xticklabels([bd.num(t, 0) for t in df.index])\n    ax.set_xlabel(\"proyectos simulados\" if metrica == \"proyecto\" else \"centros simulados\"); ax.set_ylabel(\"k€\")\n    ax.set_title(titulo or \"Variabilidad de la estimación entre réplicas\")\n    ax.legend(loc=\"upper right\", fontsize=8)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n",
 "informe.py": "# -*- coding: utf-8 -*-\n\"\"\"Informe Word (.docx) del estudio de caso Bio-Distri: beneficio de un proyecto de calidad, programa plurianual con y\nsin mantenimiento, escenarios, mantenimiento, sensibilidad y ampliación.\"\"\"\nimport datetime\nimport io\nimport math\n\nimport numpy as np\nimport pandas as pd\nimport docx\nfrom docx.shared import Pt, Cm, RGBColor\nfrom docx.enum.text import WD_ALIGN_PARAGRAPH\nfrom docx.enum.table import WD_TABLE_ALIGNMENT\nfrom docx.oxml.ns import qn\nfrom docx.oxml import OxmlElement\n\nimport biodistri as bd\nfrom biodistri import num, pct, keur, fmt_kpi, fmt_res, fmt_col, fmt_obj, fmt_val\nimport graficos as gr\n\n\ndef _sombrear(celda, color):\n    tcPr = celda._tc.get_or_add_tcPr()\n    shd = OxmlElement(\"w:shd\")\n    shd.set(qn(\"w:val\"), \"clear\"); shd.set(qn(\"w:color\"), \"auto\"); shd.set(qn(\"w:fill\"), color)\n    tcPr.append(shd)\n\n\nANCHO_UTIL_CM = 17.0          # A4 con márgenes de 2 cm\nMAX_COLS_ESC = 5              # escenarios por tabla cuando las columnas son escenarios\n\n\ndef _cm_por_caracter(pt):\n    return 0.0205 * pt          # anchura media aproximada de un carácter de Calibri\n\n\ndef _anchos(cab, filas, pt):\n    \"\"\"Anchura de cada columna según su contenido; se reparte el ancho útil sin superar la página.\"\"\"\n    nat = []\n    for j, c in enumerate(cab):\n        palabras = max((len(w) for w in str(c).split()), default=1) + 1      # cabecera en negrita\n        # los textos largos (con espacios) pueden partirse en varias líneas; los números, no\n        celdas = max((min(len(f[j]), 30) if \" \" in f[j].strip() and len(f[j]) > 30 else len(f[j]) for f in filas),\n                     default=1)\n        nat.append(max(palabras, celdas, 3) * _cm_por_caracter(pt) + 0.3)\n    total = sum(nat)\n    return nat, total\n\n\nclass Informe:\n    \"\"\"Envoltorio sencillo de python-docx con helpers para títulos, párrafos, tablas y figuras.\"\"\"\n\n    def __init__(self, titulo, subtitulo=\"\"):\n        self.doc = docx.Document()\n        sec = self.doc.sections[0]\n        sec.page_width, sec.page_height = Cm(21), Cm(29.7)\n        sec.left_margin = sec.right_margin = Cm(2)\n        sec.top_margin = sec.bottom_margin = Cm(2)\n        estilo = self.doc.styles[\"Normal\"]\n        estilo.font.name = \"Calibri\"; estilo.font.size = Pt(10.5)\n        self.n_tabla, self.n_fig = 0, 0\n        self.doc.add_heading(titulo, level=0)\n        if subtitulo:\n            p = self.doc.add_paragraph(subtitulo); p.runs[0].italic = True\n\n    def h(self, texto, nivel=1):\n        self.doc.add_heading(texto, level=nivel)\n\n    def p(self, texto, negrita_inicio=None):\n        par = self.doc.add_paragraph()\n        if negrita_inicio and texto.startswith(negrita_inicio):\n            par.add_run(negrita_inicio).bold = True\n            par.add_run(texto[len(negrita_inicio):])\n        else:\n            par.add_run(texto)\n        par.paragraph_format.space_after = Pt(6)\n        return par\n\n    def vinetas(self, items, numeradas=False):\n        for it in items:\n            self.doc.add_paragraph(it, style=\"List Number\" if numeradas else \"List Bullet\")\n\n    def tabla(self, df, titulo, formato=None, indice=True, ancho_fuente=9, nombre_indice=\"\"):\n        \"\"\"Tabla con anchos de columna calculados para que quepa siempre en el ancho de la página: si el contenido\n        no cabe se reduce la letra (hasta 7 pt) y se reparten las columnas proporcionalmente.\"\"\"\n        self.n_tabla += 1\n        cap = self.doc.add_paragraph()\n        cap.add_run(f\"Tabla {self.n_tabla}. {titulo}\").bold = True\n        cap.paragraph_format.keep_with_next = True\n        cols = list(df.columns)\n        cab = ([nombre_indice or (df.index.name or \"\")] if indice else []) + [str(c) for c in cols]\n        filas = []\n        for idx, fila in df.iterrows():\n            filas.append(([num(idx, 0) if isinstance(idx, (int, np.integer)) else str(idx)] if indice else []) +\n                         [formato(idx, c, fila[c]) if formato else _fmt(fila[c]) for c in cols])\n        pt = ancho_fuente\n        nat, total = _anchos(cab, filas, pt)\n        while total > ANCHO_UTIL_CM and pt > 7:\n            pt -= 0.5\n            nat, total = _anchos(cab, filas, pt)\n        if total > ANCHO_UTIL_CM:\n            # la primera columna (nombre de la fila) conserva su anchura natural para no partir palabras\n            w0 = min(nat[0], 0.4 * ANCHO_UTIL_CM) if indice else 0.0\n            resto = sum(nat[1:]) if indice else total\n            f_ = (ANCHO_UTIL_CM - w0) / resto\n            anchos = ([w0] + [w * f_ for w in nat[1:]]) if indice else [w * f_ for w in nat]\n        else:\n            anchos = [w * min(ANCHO_UTIL_CM / total, 1.6) for w in nat]\n        t = self.doc.add_table(rows=1, cols=len(cab))\n        t.style = \"Table Grid\"; t.alignment = WD_TABLE_ALIGNMENT.CENTER\n        t.autofit = False\n        tblPr = t._tbl.tblPr\n        lay = OxmlElement(\"w:tblLayout\"); lay.set(qn(\"w:type\"), \"fixed\"); tblPr.append(lay)\n        trPr = t.rows[0]._tr.get_or_add_trPr()\n        rep = OxmlElement(\"w:tblHeader\"); rep.set(qn(\"w:val\"), \"true\"); trPr.append(rep)\n        for j, col in enumerate(t.columns):\n            col.width = Cm(anchos[j])\n        for j, c in enumerate(cab):\n            cel = t.rows[0].cells[j]; cel.text = \"\"; cel.width = Cm(anchos[j])\n            r = cel.paragraphs[0].add_run(str(c)); r.bold = True; r.font.size = Pt(pt)\n            r.font.color.rgb = RGBColor(0xFF, 0xFF, 0xFF)\n            if j > 0 or not indice:\n                cel.paragraphs[0].alignment = WD_ALIGN_PARAGRAPH.RIGHT\n            _sombrear(cel, \"2F5496\")\n        for i, vals in enumerate(filas):\n            celdas = t.add_row().cells\n            for j, v in enumerate(vals):\n                celdas[j].text = \"\"; celdas[j].width = Cm(anchos[j])\n                r = celdas[j].paragraphs[0].add_run(v); r.font.size = Pt(pt)\n                if j > 0 or not indice:\n                    celdas[j].paragraphs[0].alignment = WD_ALIGN_PARAGRAPH.RIGHT\n                if i % 2 == 1:\n                    _sombrear(celdas[j], \"EAF0F8\")\n        self.doc.add_paragraph()\n\n    def tabla_escenarios(self, df, titulo, formato=None, nombre_indice=\"\"):\n        \"\"\"Tabla cuyas columnas son escenarios: se parte en bloques de MAX_COLS_ESC columnas para que quepa.\"\"\"\n        cols = list(df.columns)\n        if len(cols) <= MAX_COLS_ESC:\n            self.tabla(df, titulo, formato, nombre_indice=nombre_indice)\n            return\n        n = math.ceil(len(cols) / MAX_COLS_ESC)\n        tam = math.ceil(len(cols) / n)\n        for k in range(n):\n            self.tabla(df[cols[k * tam:(k + 1) * tam]], f\"{titulo} ({k + 1}/{n})\", formato, nombre_indice=nombre_indice)\n\n    def figura(self, fig, titulo, ancho_cm=16.5):\n        self.n_fig += 1\n        self.doc.add_picture(gr.fig_a_png(fig), width=Cm(ancho_cm))\n        self.doc.paragraphs[-1].alignment = WD_ALIGN_PARAGRAPH.CENTER\n        self.doc.paragraphs[-1].paragraph_format.keep_with_next = True\n        cap = self.doc.add_paragraph(); cap.alignment = WD_ALIGN_PARAGRAPH.CENTER\n        r = cap.add_run(f\"Figura {self.n_fig}. {titulo}\"); r.italic = True; r.font.size = Pt(9)\n\n    def salto(self):\n        self.doc.add_page_break()\n\n    def guardar(self):\n        buf = io.BytesIO()\n        self.doc.save(buf)\n        return buf.getvalue()\n\n\ndef _fmt(v):\n    if isinstance(v, (bool, np.bool_)):\n        return \"Sí\" if v else \"No\"\n    if v is None:\n        return \"—\"\n    if isinstance(v, (int, np.integer)):\n        return num(v, 0)\n    if isinstance(v, (float, np.floating)):\n        return \"—\" if math.isnan(v) else num(v, 3)\n    return str(v)\n\n\ndef _sub(df, filas):\n    return df.loc[[f for f in filas if f in df.index]]\n\n\ndef _txt(f, c, v):\n    return v if isinstance(v, str) else _fmt(v)\n\n\n\n\n# ---------------------------------------------------------------------------------------------- tablas\nFILAS_A = [\"Beneficio esperado E(Y) (k€)\", \"Desviación típica σ(Y) (k€)\", \"Probabilidad de pérdida P(Y < 0)\",\n           \"VaR 95 % · percentil 5 de Y (k€)\", \"CVaR 5 % · media del 5 % peor (k€)\",\n           \"Probabilidad de penalización P(R < umbral)\"]\nFILAS_B = [\"VAN esperado con mantenimiento (k€)\", \"VAN esperado sin mantenimiento (k€)\",\n           \"Ganancia media pareada E(Δ) (k€)\", \"P(el mantenimiento compensa) P(Δ > 0)\",\n           \"VaR 95 % del VAN con mantenimiento (k€)\", \"VaR 95 % del VAN sin mantenimiento (k€)\",\n           \"CVaR 5 % del VAN con mantenimiento (k€)\", \"CVaR 5 % del VAN sin mantenimiento (k€)\",\n           \"σ(Δ) por centro · diseño pareado (k€)\", \"σ(Δ) por centro · diseño independiente (k€)\"]\n\n\ndef tabla_tipos(t, resA):\n    \"\"\"O1.3 por tipo de proyecto: teórico y simulado (media de las réplicas).\"\"\"\n    pf = t[\"A\"][\"por_tipo\"]\n    filas = {}\n    for f in bd.PROYECTOS:\n        nf = bd.NOMBRE[f]\n        g = lambda k: resA.loc[k, \"Simulado · media\"]\n        filas[nf] = {\"Teórico · E(Y)\": pf[f][\"EY\"], \"Simulado · E(Y)\": g(f\"E(Y | {nf}) (k€)\"),\n                     \"Teórico · CV\": pf[f][\"CV\"], \"Simulado · CV\": g(f\"CV(Y | {nf})\"),\n                     \"Teórico · P(Y < 0)\": pf[f][\"Pperd\"], \"Simulado · P(Y < 0)\": g(f\"P(Y < 0 | {nf})\"),\n                     \"Teórico · VaR 95 %\": pf[f][\"VaR\"], \"Teórico · peso en las pérdidas\": pf[f][\"peso_perd\"]}\n    return pd.DataFrame(filas).T\n\n\ndef fmt_tipos(fila, col, v):\n    if col == \"p\" or \"P(\" in col or \"peso\" in col:\n        return pct(v, 2)\n    if \"CV\" in col:\n        return num(v, 3)\n    return keur(v)\n\n\ndef tabla_tipos_B(t, mcB):\n    pt = t[\"B\"][\"por_tipo\"]; rep = mcB[\"replicas\"]\n    filas = {}\n    for f in bd.PROYECTOS:\n        nf = bd.NOMBRE[f]\n        filas[nf] = {\"p\": pt[f][\"p\"], \"Teórico · E(VAN) con\": pt[f][\"E_con\"],\n                     \"Teórico · E(Δ)\": pt[f][\"E_gan\"], \"Simulado · E(Δ)\": rep[f\"E(Δ | {nf})\"].mean(),\n                     \"Teórico · P(Δ > 0)\": pt[f][\"P_gan\"], \"Ahorro medio S̄\": pt[f][\"ES\"],\n                     \"C_mant de indiferencia\": pt[f][\"C_ind\"]}\n    return pd.DataFrame(filas).T\n\n\ndef fmt_tipos_B(fila, col, v):\n    if col == \"p\" or \"P(\" in col or \"Cuota\" in col:\n        return pct(v, 1)\n    return keur(v, 2)\n\n\ndef tabla_extras_B(t, mcB, esc):\n    B = t[\"B\"]\n    filas = {\n        \"Factores de descuento d_t\": \" / \".join(num(x, 3) for x in bd.descuentos(esc)),\n        \"Peso del ahorro perdido Σ d_t·(1 − δ^(t−1))\": num(float((bd.descuentos(esc) * (1 - float(esc['delta']) ** np.arange(int(esc['H'])))).sum()), 3),\n        \"Coste de mantenimiento descontado C·Σ d_t (k€)\": keur(bd.c_efectivo(esc) * bd.descuentos(esc).sum(), 2),\n        \"C_mant de indiferencia (O6.1)\": f\"{keur(B['C_ind'], 3)}/año (actual {keur(float(esc['C_mant']), 2)}/año)\",\n        \"Subvención que iguala las políticas (O8.5)\": pct(B[\"X_ind\"], 1) if B[\"X_ind\"] > 0 else \"no hace falta (ya compensa)\",\n        \"Reducción de varianza del diseño pareado (O4.1)\": f\"× {num(B['var_independiente'] / B['var_pareada'], 0)}\" if B[\"var_pareada\"] > 0 else \"—\",\n        \"P(VAN < 0) con mantenimiento\": pct(B[\"Pperd_con\"], 4),\n    }\n    return pd.DataFrame({\"Valor\": filas})\n\n\ndef tabla_parametros(res):\n    filas = {}\n    for n, r in res.items():\n        e = r[\"esc\"]\n        filas[n] = {\"p (IoT / IA / Emp. / Aud.)\": \" / \".join(num(x, 2) for x in bd.normalizar(e[\"p\"])),\n                    \"V_stock (k€)\": num(e[\"V\"], 0),\n                    \"Penalización K / c / umbral\": f\"{num(e['K'], 0)} / {num(e['c_pen'], 0)} / {pct(e['umbral_R'], 0)}\",\n                    \"Garantía (% de I)\": pct(e[\"garantia\"], 0),\n                    \"H / λ / δ\": f\"{e['H']} / {num(e['lam'], 2)} / {num(e['delta'], 2)}\",\n                    \"C_mant (k€) / subvención\": f\"{num(e['C_mant'], 1)} / {pct(e.get('subvencion') or 0, 0)}\",\n                    \"r / t₀\": f\"{pct(e['r'], 0)} / {e.get('t0', 1)}\",\n                    \"Política\": bd.POLITICAS.get(e.get(\"politica\", \"con\"), \"—\")}\n    return pd.DataFrame(filas)\n\n\ndef tabla_dif(dif, cols):\n    return dif[[c for c in cols if c in dif.columns]]\n\n\nCOLS_DIF_A = [\"ΔE(Y) por proyecto · teórico (k€)\", \"ΔE(Y) por proyecto · simulado (k€)\", \"IC95 ΔE(Y) (k€)\",\n              \"ΔP(Y < 0) · teórico\", \"ΔVaR 95 % · teórico (k€)\", \"ΔCVaR 5 % · teórico (k€)\"]\nCOLS_DIF_B = [\"ΔE(VAN) política · teórico (k€)\", \"ΔE(VAN) política · simulado (k€)\", \"IC95 ΔE(VAN) (k€)\",\n              \"ΔCVaR 5 % del VAN · teórico (k€)\", \"Ganancia del mantenimiento · teórico (k€)\"]\n\n\ndef fmt_sens(fila, col, v):\n    if col == \"Error relativo\":\n        return pct(v, 3)\n    return keur(v, 2)\n\n\ndef tabla_sens(df):\n    return df.drop(columns=[\"Medias por réplica\"])\n\n\ndef tabla_sens_param(df):\n    d = df.copy()\n    d[\"Variación\"] = d[\"Variación\"].map(lambda v: f\"{'+' if v > 0 else ''}{num(100 * v, 0)} %\")\n    return d.set_index([\"Parámetro\", \"Variación\"])\n\n\ndef fmt_sens_param(fila, col, v):\n    if \"Var(Y)\" in col:\n        return num(v, 0)\n    return keur(v)\n\n\ndef fmt_tabla(fila, col, v):\n    if isinstance(v, (bool, np.bool_)):\n        return \"Sí\" if v else \"No\"\n    return fmt_val(col, v)\n\n\ndef indice_fmt(df, fn):\n    out = df.copy(); out.index = [fn(i) for i in df.index]; return out\n\n\ndef tabla_racha(df):\n    \"\"\"Tabla compacta de la racha: R medio, S y VAN acumulado por política (con racha).\"\"\"\n    cols = [\"Sin racha · R medio\", \"Con racha · R medio\", \"Con racha · P(penalización)\", \"Con racha · S con mant. (k€)\",\n            \"Con racha · S sin mant. (k€)\", \"Sin racha · VAN acum. con (k€)\", \"Con racha · VAN acum. con (k€)\",\n            \"Con racha · VAN acum. sin (k€)\"]\n    d = df[cols].copy()\n    d.columns = [\"R sin racha\", \"R con racha\", \"P(penalización) con racha\", \"S con mant. (k€)\", \"S sin mant. (k€)\",\n                 \"VAN acum. con · sin racha (k€)\", \"VAN acum. con · con racha (k€)\", \"VAN acum. sin · con racha (k€)\"]\n    return d\n\n\ndef fmt_racha(fila, col, v):\n    if col.startswith(\"R \") or \"P(\" in col:\n        return pct(v, 1)\n    return keur(v, 1)\n\n\nFMT_IDX = {\"delta\": lambda v: num(v, 2), \"C_mant\": lambda v: keur(v, 2), \"H\": lambda v: f\"{int(v)} años\",\n           \"subvencion\": lambda v: pct(v, 0)}\n\nTEXTO_O86 = (\"Para completar la comparación haría falta información que el simulador no contiene: el valor residual o \"\n             \"de desmantelamiento del proyecto antiguo, si el proyecto nuevo incorpora mejoras tecnológicas (otra \"\n             \"distribución de R o S), los costes de transición e interrupción del servicio, la posible transferencia de \"\n             \"la experiencia acumulada al proyecto nuevo y la evolución del coste de mantenimiento con la antigüedad.\")\n\n\n# ---------------------------------------------------------------------------------------------- informe\ndef generar_informe(res, com, aj, base, mant=None, sens=None, ampliacion=None, sens_est=None,\n                    titulo=\"Rentabilidad de los proyectos de calidad en Bio-Distri\"):\n    inf = Informe(titulo, f\"Informe generado automáticamente el {datetime.datetime.now():%d/%m/%Y %H:%M} · beneficio de un \"\n                          \"proyecto por composición, programa plurianual con y sin mantenimiento, escenarios, \"\n                          \"sensibilidad y ampliación · cantidades en miles de € (k€)\")\n    inf.h(\"1. Planteamiento y parámetros\", 1)\n    inf.p(\"Bloque A · un proyecto. Cada centro elige un tipo de proyecto T (IoT, IA, Empaque o Auditoría) y, condicionadas \"\n          \"a T, se simulan de forma independiente la inversión I ~ LN(μ, σ), l
