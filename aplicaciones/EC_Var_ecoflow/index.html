os` años de 365 días; ambas políticas sobre la misma base. Cada año es una macro-réplica (las\n    estimaciones son medias por día; los años solo sirven para el intervalo de confianza).\"\"\"\n    base = base_anual(com, esc, anyos, semilla)\n    bat = simular_bateria(esc, base)\n    Ys, Yc = base[\"Y\"], bat[\"Y\"]\n    G = Yc - Ys\n    T = base[\"T\"]\n    filas = []\n    for r in range(int(anyos)):\n        def_dias = base[\"Bp\"][r] < 0\n        fila = {\"Año\": r + 1, \"Semilla\": int(semilla) + 1000 + r, \"E(Y) sin batería\": float(Ys[r].mean()),\n                \"E(Y) con batería\": float(Yc[r].mean()), \"Ganancia E(Δ)\": float(G[r].mean()),\n                \"P(compra) sin batería\": float(def_dias.mean()), \"P(compra) con batería\": float((bat[\"res\"][r] > 1e-12).mean()),\n                \"Déficits cubiertos por completo\": float(((bat[\"res\"][r] <= 1e-12) & def_dias).sum() / max(def_dias.sum(), 1)),\n                \"VaR 5 % sin batería\": float(np.quantile(Ys[r], 0.05)), \"VaR 5 % con batería\": float(np.quantile(Yc[r], 0.05)),\n                \"CVaR 5 % sin batería\": _cvar_muestra(Ys[r]), \"CVaR 5 % con batería\": _cvar_muestra(Yc[r]),\n                \"Estado de carga medio\": float(bat[\"E_ini\"][r].mean()), \"LOLE sin batería\": float(def_dias.sum()),\n                \"LOLE con batería\": float((bat[\"res\"][r] > 1e-12).sum()), \"σ(Δ) diario\": float(G[r].std(ddof=1)),\n                \"Ganancia anual\": float(G[r].sum())}\n        for f in ESCENARIOS:\n            mk = T[r] == f\n            fila[f\"E(Δ | {NOMBRE[f]})\"] = float(G[r][mk].mean()) if mk.any() else float(\"nan\")\n        filas.append(fila)\n        if progreso:\n            progreso()\n    ind = Yc - np.roll(Ys, 1, axis=0)\n    return {\"replicas\": pd.DataFrame(filas).set_index(\"Año\"), \"Ys\": Ys, \"Yc\": Yc, \"T\": T, \"base\": base, \"bat\": bat,\n            \"sd_par\": float(G.std(ddof=1)), \"sd_ind\": float(ind.std(ddof=1))}\n\n\n# ==============================================================================================\n# Resúmenes (teórico frente a simulado)\n# ==============================================================================================\ndef _ic_media(v):\n    v = np.asarray(v, dtype=float); v = v[~np.isnan(v)]\n    if len(v) == 0:\n        return float(\"nan\"), float(\"nan\"), float(\"nan\")\n    m = float(v.mean())\n    if len(v) < 2:\n        return m, float(\"nan\"), float(\"nan\")\n    se = float(v.std(ddof=1)) / math.sqrt(len(v)); tq = _tq(len(v))\n    return m, m - tq * se, m + tq * se\n\n\ndef resumen(rep, filas, agregados=None):\n    \"\"\"filas: {KPI: (columna de réplicas, teórico)}; agregados: {KPI: valor con todos los días} (para VaR y CVaR,\n    cuyo IC se toma de la variabilidad entre réplicas).\"\"\"\n    out = []\n    agregados = agregados or {}\n    for nombre, (col, teo) in filas.items():\n        m, lo, hi = _ic_media(rep[col])\n        if nombre in agregados and lo == lo:\n            c = agregados[nombre]; lo, hi = c - (m - lo), c + (hi - m); m = c\n        ok = None\n        if teo is not None and lo == lo and hi - lo > 1e-12:\n            tol = 1e-9 * max(1.0, abs(teo))\n            ok = bool(lo - tol <= teo <= hi + tol)\n        out.append({\"KPI\": nombre, \"Teórico\": teo, \"Simulado · media\": m, \"IC95 inf\": lo, \"IC95 sup\": hi,\n                    \"Error relativo\": (m - teo) / abs(teo) if (teo is not None and abs(teo) > 1e-12) else None,\n                    \"Teórico en IC95\": ok})\n    return pd.DataFrame(out).set_index(\"KPI\")\n\n\ndef resumen_A(mc, tA):\n    d = {\"Beneficio diario esperado E(Y) (€)\": (\"E(Y)\", tA[\"EY\"]),\n         \"Desviación típica σ(Y) (€)\": (\"σ(Y)\", tA[\"sdY\"]),\n         \"Probabilidad de déficit P(B < 0)\": (\"P(B < 0)\", tA[\"Pdef\"]),\n         \"Probabilidad de comprar en el mercado\": (\"P(compra en el mercado)\", tA[\"Pspot\"]),\n         \"VaR 95 % · percentil 5 de Y (€)\": (\"VaR 5 %\", tA[\"VaR\"]),\n         \"CVaR 5 % · media del 5 % peor (€)\": (\"CVaR 5 %\", tA[\"CVaR\"]),\n         \"Déficit medio comprado (MWh)\": (\"E(déficit)\", tA[\"Edef\"]),\n         \"Generación media E(G) (MWh)\": (\"E(G)\", tA[\"EG\"])}\n    for f in ESCENARIOS:\n        nf = NOMBRE[f]; pf = tA[\"por_tipo\"][f]\n        d[f\"E(Y | {nf}) (€)\"] = (f\"E(Y | {nf})\", pf[\"EY\"])\n        d[f\"CV(Y | {nf})\"] = (f\"CV({nf})\", pf[\"CV\"])\n        d[f\"P(B < 0 | {nf})\"] = (f\"P(B < 0 | {nf})\", pf[\"Pdef\"])\n    for k_, nom in enumerate(TERMINOS):\n        d[f\"Contribución a Var(Y) · {nom}\"] = (f\"Contrib. {nom}\", float(tA[\"contrib\"][k_]))\n    Y = mc[\"Y\"]\n    return resumen(mc[\"replicas\"], d, {\"VaR 95 % · percentil 5 de Y (€)\": float(np.quantile(Y, 0.05)),\n                                        \"CVaR 5 % · media del 5 % peor (€)\": _cvar_muestra(Y)})\n\n\ndef resumen_B(mc, tB, tA):\n    d = {\"Beneficio diario esperado sin batería (€)\": (\"E(Y) sin batería\", tB[\"EY_sin\"]),\n         \"Beneficio diario esperado con batería (€)\": (\"E(Y) con batería\", tB[\"EY_con\"]),\n         \"Ganancia media diaria pareada E(Δ) (€)\": (\"Ganancia E(Δ)\", tB[\"E_gan\"]),\n         \"P(comprar en el mercado) sin batería\": (\"P(compra) sin batería\", tB[\"Pspot_sin\"]),\n         \"P(comprar en el mercado) con batería\": (\"P(compra) con batería\", tB[\"Pspot_con\"]),\n         \"Déficits cubiertos por completo por la batería\": (\"Déficits cubiertos por completo\", tB[\"cubiertos\"]),\n         \"VaR 95 % diario sin batería (€)\": (\"VaR 5 % sin batería\", tA.get(\"VaR\")),\n         \"VaR 95 % diario con batería (€)\": (\"VaR 5 % con batería\", None),\n         \"CVaR 5 % diario sin batería (€)\": (\"CVaR 5 % sin batería\", tA.get(\"CVaR\")),\n         \"CVaR 5 % diario con batería (€)\": (\"CVaR 5 % con batería\", None),\n         \"Estado de carga medio (MWh)\": (\"Estado de carga medio\", tB[\"SOC_medio\"]),\n         \"LOLE sin batería (días/año)\": (\"LOLE sin batería\", tB[\"LOLE_sin\"]),\n         \"LOLE con batería (días/año)\": (\"LOLE con batería\", tB[\"LOLE_con\"]),\n         \"σ(Δ) diario (€)\": (\"σ(Δ) diario\", tB[\"sd_gan\"])}\n    for f in ESCENARIOS:\n        nf = NOMBRE[f]\n        d[f\"E(Δ | {nf}) (€)\"] = (f\"E(Δ | {nf})\", tB[\"por_tipo\"][f][\"E_gan\"])\n    Ys, Yc = mc[\"Ys\"], mc[\"Yc\"]\n    agr = {\"VaR 95 % diario sin batería (€)\": float(np.quantile(Ys, 0.05)), \"VaR 95 % diario con batería (€)\": float(np.quantile(Yc, 0.05)),\n           \"CVaR 5 % diario sin batería (€)\": _cvar_muestra(Ys), \"CVaR 5 % diario con batería (€)\": _cvar_muestra(Yc),\n           \"σ(Δ) diario (€)\": float((Yc - Ys).std(ddof=1))}\n    return resumen(mc[\"replicas\"], d, agr)\n\n\n# ==============================================================================================\n# Objetivos, análisis de escenarios y diferencias\n# ==============================================================================================\nOBJ_NOMBRES = {\"EY_MIN\": \"Beneficio diario esperado E(Y) (con batería)\", \"PDEF_MAX\": \"Probabilidad de comprar en el mercado (con batería)\",\n               \"CVAR_MIN\": \"CVaR 5 % diario (sin batería)\", \"NETO_MIN\": \"Ganancia neta anual de la batería\"}\n\n\ndef evaluar_objetivos(t, obj):\n    A, B = t[\"A\"], t[\"B\"]\n    filas = []\n    def fila(c, valor, txt, cumple):\n        filas.append({\"Objetivo\": OBJ_NOMBRES[c], \"Valor\": valor, \"Umbral\": txt, \"Cumple\": \"Sí\" if cumple else \"No\"})\n    if obj.get(\"EY_MIN\") is not None:\n        fila(\"EY_MIN\", B[\"EY_con\"], f\"≥ {eur(obj['EY_MIN'])}\", B[\"EY_con\"] >= obj[\"EY_MIN\"] - 1e-9)\n    if obj.get(\"PDEF_MAX\") is not None:\n        fila(\"PDEF_MAX\", B[\"Pspot_con\"], f\"≤ {pct(obj['PDEF_MAX'], 1)}\", B[\"Pspot_con\"] <= obj[\"PDEF_MAX\"] + 1e-12)\n    if obj.get(\"CVAR_MIN\") is not None:\n        fila(\"CVAR_MIN\", A[\"CVaR\"], f\"≥ {eur(obj['CVAR_MIN'])}\", A[\"CVaR\"] >= obj[\"CVAR_MIN\"] - 1e-9)\n    if obj.get(\"NETO_MIN\") is not None:\n        fila(\"NETO_MIN\", B[\"neto_anual\"], f\"≥ {eur(obj['NETO_MIN'])}\", B[\"neto_anual\"] >= obj[\"NETO_MIN\"] - 1e-9)\n    return pd.DataFrame(filas, columns=[\"Objetivo\", \"Valor\", \"Umbral\", \"Cumple\"]).set_index(\"Objetivo\")\n\n\ndef analizar_escenario(esc, com, aj, progreso=None):\n    t = teoria(com, esc)\n    mA = simular_A(com, esc, aj[\"nsim\"], aj[\"replicas\"], aj[\"semilla\"], progreso)\n    mB = simular_B(com, esc, aj[\"anyos\"], aj[\"semilla\"], progreso)\n    return {\"esc\": dict(esc), \"teoria\": t, \"mcA\": mA, \"mcB\": mB, \"resA\": resumen_A(mA, t[\"A\"]),\n            \"resB\": resumen_B(mB, t[\"B\"], t[\"A\"]), \"objetivos\": evaluar_objetivos(t, com[\"objetivos\"])}\n\n\ndef diferencias(res, base):\n    \"\"\"Diferencias frente al escenario base (positivo = mejora), pareadas réplica a réplica.\"\"\"\n    if base not in res:\n        return None\n    rb = res[base]\n    filas = []\n    for n, r in res.items():\n        if n == base:\n            continue\n        ta, tb = rb[\"teoria\"], r[\"teoria\"]\n        dA = r[\"mcA\"][\"replicas\"][\"E(Y)\"] - rb[\"mcA\"][\"replicas\"][\"E(Y)\"]\n        dB = r[\"mcB\"][\"replicas\"][\"E(Y) con batería\"] - rb[\"mcB\"][\"replicas\"][\"E(Y) con batería\"]\n        mA, loA, hiA = _ic_media(dA); mB, loB, hiB = _ic_media(dB)\n        filas.append({\"Escenario\": n,\n                      \"ΔE(Y) diario sin batería · teórico (€)\": tb[\"A\"][\"EY\"] - ta[\"A\"][\"EY\"],\n                      \"ΔE(Y) diario sin batería · simulado (€)\": mA, \"IC95 ΔE(Y) (€)\": (loA, hiA),\n                      \"ΔP(B < 0) · teórico\": tb[\"A\"][\"Pdef\"] - ta[\"A\"][\"Pdef\"],\n                      \"ΔVaR 95 % · teórico (€)\": tb[\"A\"][\"VaR\"] - ta[\"A\"][\"VaR\"],\n                      \"ΔCVaR 5 % · teórico (€)\": tb[\"A\"][\"CVaR\"] - ta[\"A\"][\"CVaR\"],\n                      \"ΔE(Y) diario con batería · teórico (€)\": tb[\"B\"][\"EY_con\"] - ta[\"B\"][\"EY_con\"],\n                      \"ΔE(Y) diario con batería · simulado (€)\": mB, \"IC95 ΔE(Y) con batería (€)\": (loB, hiB),\n                      \"Ganancia de la batería · teórico (€/día)\": tb[\"B\"][\"E_gan\"],\n                      \"Δ ganancia neta anual de la batería · teórico (€)\": tb[\"B\"][\"neto_anual\"] - ta[\"B\"][\"neto_anual\"]})\n    return pd.DataFrame(filas).set_index(\"Escenario\") if filas else None\n\n\ndef tabla_comparativa(res):\n    cols = {}\n    for n, r in res.items():\n        A, B, e = r[\"teoria\"][\"A\"], r[\"teoria\"][\"B\"], r[\"esc\"]\n        ra, rb = r[\"resA\"], r[\"resB\"]\n        cols[n] = {\n            \"Teórico · E(Y) diario sin batería (€)\": A[\"EY\"], \"Teórico · P(B < 0)\": A[\"Pdef\"],\n            \"Teórico · VaR 95 % (€)\": A[\"VaR\"], \"Teórico · CVaR 5 % (€)\": A[\"CVaR\"],\n            \"Teórico · E(Y) diario con batería (€)\": B[\"EY_con\"], \"Teórico · ganancia de la batería (€/día)\": B[\"E_gan\"],\n            \"Teórico · P(compra) con batería\": B[\"Pspot_con\"], \"Teórico · LOLE con batería (días/año)\": B[\"LOLE_con\"],\n            \"Teórico · ganancia neta anual de la batería (€)\": B[\"neto_anual\"],\n            \"Simulado · E(Y) diario sin batería (€)\": ra.loc[\"Beneficio diario esperado E(Y) (€)\", \"Simulado · media\"],\n            \"Simulado · ganancia de la batería (€/día)\": rb.loc[\"Ganancia media diaria pareada E(Δ) (€)\", \"Simulado · media\"],\n            \"Simulado · CVaR 5 % con batería (€)\": rb.loc[\"CVaR 5 % diario con batería (€)\", \"Simulado · media\"],\n            \"Objetivos cumplidos\": f\"{(r['objetivos']['Cumple'] == 'Sí').sum()} de {len(r['objetivos'])}\",\n        }\n    return pd.DataFrame(cols)\n\n\ndef tabla_objetivos(res):\n    return pd.DataFrame({n: r[\"objetivos\"][\"Cumple\"] for n, r in res.items()})\n\n\n# ==============================================================================================\n# Batería: barridos (O5.1, O5.2, O6.1, O8.5), racha (O6.2), estado inicial (O8.2)\n# ==============================================================================================\nPARAM_BARRIDO = {\"cap\": \"Capacidad de la batería (MWh)\", \"eta\": \"Eficiencia η\"}\n\n\ndef barrido(com, esc, par, valores, anyos, semilla, tA=None, progreso=None):\n    \"\"\"Ganancia de la batería al variar su capacidad o su eficiencia: teórica (cadena) y simulada (misma base).\"\"\"\n    tA = tA or teoria_A(com, esc)\n    base = base_anual(com, esc, anyos, semilla)\n    filas = []\n    for v in valores:\n        e2 = dict(esc); e2[par] = float(v)\n        tB = teoria_bateria(com, e2, tA)\n        bat = simular_bateria(e2, base)\n        gr_ = (bat[\"Y\"] - base[\"Y\"]).mean(axis=1)\n        m, lo, hi = _ic_media(gr_)\n        fila = {PARAM_BARRIDO[par]: float(v), \"Teórico · E(Δ) (€/día)\": tB[\"E_gan\"], \"Simulado · E(Δ) (€/día)\": m,\n                \"IC95 E(Δ) (€/día)\": (lo, hi), \"Teórico · P(compra) con batería\": tB[\"Pspot_con\"],\n                \"Teórico · LOLE con batería (días/año)\": tB[\"LOLE_con\"], \"Teórico · ganancia anual (€)\": tB[\"gan_anual\"],\n                \"Amortización anual (€)\": tB[\"amortizacion\"], \"Teórico · ganancia neta anual (€)\": tB[\"neto_anual\"]}\n        if par == \"cap\":\n            fila[\"Ganancia por MWh de capacidad (€/año)\"] = tB[\"gan_anual\"] / v if v > 0 else float(\"nan\")\n        filas.append(fila)\n        if progreso:\n            progreso()\n    df = pd.DataFrame(filas).set_index(PARAM_BARRIDO[par])\n    if par == \"cap\":\n        prev = df[\"Teórico · ganancia anual (€)\"].shift(1); cprev = df.index.to_series().shift(1)\n        df[\"Ganancia marginal por MWh (€/año)\"] = (df[\"Teórico · ganancia anual (€)\"] - prev) / (df.index.to_series() - cprev)\n    return df\n\n\ndef capacidad_optima(df):\n    return float(df[\"Teórico · ganancia neta anual (€)\"].idxmax())\n\n\ndef experimento_racha(com, esc, inicio=100, dias=20, anyos=200, semilla=1000, tA=None):\n    \"\"\"O6.2 · 20 días seguidos Anticiclónicos desde `inicio`: estado de carga medio día a día (teórico y simulado),\n    frente al mismo año sin racha (misma base).\"\"\"\n    tA = tA or teoria_A(com, esc)\n    t0 = teoria_bateria(com, esc, tA); t1 = teoria_bateria(com, esc, tA, racha=(inicio, dias))\n    b0 = base_anual(com, esc, anyos, semilla + 5000); b1 = base_anual(com, esc, anyos, semilla + 5000, racha=(inicio, dias))\n    s0 = simular_bateria(esc, b0); s1 = simular_bateria(esc, b1)\n    df = pd.DataFrame({\"Día\": np.arange(1, N_DIAS + 1),\n                       \"Teórico · carga media sin racha (MWh)\": t0[\"E_soc\"], \"Teórico · carga media con racha (MWh)\": t1[\"E_soc\"],\n                       \"Simulado · carga media sin racha (MWh)\": s0[\"E_ini\"].mean(axis=0),\n                       \"Simulado · carga media con racha (MWh)\": s1[\"E_ini\"].mean(axis=0),\n                       \"Teórico · ganancia con racha (€)\": t1[\"E_gan_dia\"],\n                       \"Simulado · Y con batería, racha (€)\": s1[\"Y\"].mean(axis=0),\n                       \"Simulado · Y sin batería, racha (€)\": b1[\"Y\"].mean(axis=0)}).set_index(\"Día\")\n    fin = inicio + dias - 1\n    sin_, con_ = t0[\"E_soc\"], t1[\"E_soc\"]\n    rec = None\n    for t in range(fin, N_DIAS):\n        if con_[t] >= 0.95 * sin_[t]:\n            rec = t + 1 - fin\n            break\n    resumen_ = {\"Carga media al empezar la racha (MWh)\": float(con_[inicio - 1]),\n                \"Carga media al acabar la racha (MWh)\": float(con_[fin]),\n                \"Días de racha hasta vaciar el 90 % de la carga\": next((t - inicio + 1 for t in range(inicio - 1, fin + 1)\n                                                                        if con_[t] <= 0.1 * con_[inicio - 1]), float(\"nan\")),\n                \"Días hasta recuperar el 95 % de la carga habitual\": rec if rec is not None else float(\"nan\"),\n                \"Pérdida media durante la racha sin batería (€/día)\": float(b1[\"Y\"][:, inicio - 1:fin].mean()),\n                \"Pérdida media durante la racha con batería (€/día)\": float(s1[\"Y\"][:, inicio - 1:fin].mean()),\n                \"Pérdida del año por la racha, con batería (€)\": float((s0[\"Y\"] - s1[\"Y\"]).sum(axis=1).mean())}\n    return df, resumen_\n\n\ndef estado_inicial(com, esc, valores=(0.0, 0.5, 1.0), anyos=200, semilla=1000, tA=None):\n    \"\"\"O8.2 · beneficio anual esperado con batería según el estado de carga inicial (misma base).\"\"\"\n    tA = tA or teoria_A(com, esc)\n    base = base_anual(com, esc, anyos, semilla)\n    filas = []\n    for v in valores:\n        tB = teoria_bateria(com, dict(esc, E1=float(v)), tA)\n        s = simular_bateria(esc, base, E1=float(v))\n        m, lo, hi = _ic_media(s[\"Y\"].sum(axis=1))\n        filas.append({\"Carga inicial\": float(v), \"Teórico · beneficio anual con batería (€)\": N_DIAS * tB[\"EY_con\"],\n                      \"Simulado · beneficio anual con batería (€)\": m, \"IC95 (€)\": (lo, hi),\n                      \"Teórico · ganancia anual de la batería (€)\": tB[\"gan_anual\"]})\n    return pd.DataFrame(filas).set_index(\"Carga inicial\")\n\n\ndef contraste_ganancia(mcB, tB):\n    \"\"\"O8.1 · H₀: E(Δ) = 0. Los días de un año están correlacionados (la batería tiene memoria), así que el contraste\n    válido usa las medias anuales (macro-réplicas); se muestra también el ingenuo que trata los días como independientes.\"\"\"\n    G = mcB[\"Yc\"] - mcB[\"Ys\"]\n    filas = []\n    for nom, x, n_ef in ((\"Medias por año (macro-réplicas)\", G.mean(axis=1), None), (\"Días tratados como independientes\", G.ravel(), None)):\n        n = len(x); m = float(x.mean()); se = float(x.std(ddof=1)) / math.sqrt(n)\n        t = m / se if se > 0 else float(\"inf\")\n        pv = float(2 * _stats.t.sf(abs(t), n - 1))\n        filas.append({\"Procedimiento\": nom, \"n\": n, \"Media de Δ (€/día)\": m, \"Error estándar (€/día)\": se,\n                      \"IC95 (€/día)\": (m - _tq(n) * se, m + _tq(n) * se), \"Estadístico t\": t, \"p-valor\": pv,\n                      \"Decisión (5 %)\": \"se rechaza H₀\" if pv < 0.05 else \"no se rechaza H₀\"})\n    df = pd.DataFrame(filas).set_index(\"Procedimiento\")\n    x = G[:, :-1].ravel(); y = G[:, 1:].ravel()\n    rho = float(np.corrcoef(x, y)[0, 1])\n    return df, rho, tB[\"E_gan\"]\n\n\ndef gestion_activa(com, esc, cv_exp=0.3, umbrales=(60.0, 70.0, 80.0, 90.0, 100.0), anyos=100, semilla=1000):\n    \"\"\"O8.3 · precio de exportación diario aleatorio (lognormal de media P_exp y CV dado); si supera el umbral, además\n    de vender el excedente se vende lo almacenado. Comparación con la regla reactiva bajo los mismos precios.\"\"\"\n    base = base_anual(com, esc, anyos, semilla)\n    rng = np.random.default_rng(int(semilla) + 999)\n    s2 = math.log(1 + cv_exp ** 2)\n    pr = np.exp(math.log(float(esc[\"P_exp\"])) - s2 / 2 + math.sqrt(s2) * rng.standard_normal(base[\"Bp\"].shape))\n    filas = []\n    react = simular_bateria(esc, base, activa=(pr, np.inf))\n    m0 = react[\"Y\"].mean(axis=1)\n    for u in [None] + list(umbrales):\n        s = react if u is None else simular_bateria(esc, base, activa=(pr, float(u)))\n        m, lo, hi = _ic_media(s[\"Y\"].mean(axis=1) - m0)\n        filas.append({\"Regla\": \"reactiva (sin vender lo almacenado)\" if u is None else f\"vender lo almacenado si P_exp > {num(u, 0)} €/MWh\",\n                      \"Simulado · E(Y) con batería (€/día)\": float(s[\"Y\"].mean()),\n                      \"Diferencia frente a la reactiva (€/día)\": m, \"IC95 diferencia (€/día)\": (lo, hi),\n                      \"P(compra en el mercado)\": float((s[\"res\"] > 1e-12).mean())})\n    return pd.DataFrame(filas).set_index(\"Regla\")\n\n\ndef bateria_vs_solar(com, esc, coste_solar=9000.0, tA=None):\n    \"\"\"O8.6 · con el mismo coste anual que la batería, ampliar la solar en Δ MWh/día de media (escalando G_s).\"\"\"\n    tA = tA or teoria_A(com, esc)\n    tB = teoria_bateria(com, esc, tA)\n    presupuesto = tB[\"amortizacion\"]\n    ms = sum(pi * momentos_fuentes(com, esc, f)[\"Gs\"][0] for pi, f in zip(normalizar(esc[\"p\"]), ESCENARIOS))\n    extra = presupuesto / coste_solar if coste_solar > 0 else 0.0\n    e2 = dict(esc, solar_factor=float(esc[\"solar_factor\"]) * (1 + extra / ms) if ms > 0 else 1.0)\n    tA2 = teoria_A(com, e2)\n    filas = {\"Batería de \" + num(float(esc[\"cap\"]), 0) + \" MWh\": {\n                 \"Coste anual (€)\": presupuesto, \"Ganancia anual (€)\": tB[\"gan_anual\"], \"Ganancia neta anual (€)\": tB[\"neto_anual\"],\n                 \"CVaR 5 % diario (€)\": float(\"nan\"), \"P(compra en el mercado)\": tB[\"Pspot_con\"]},\n             f\"Solar +{num(extra, 1)} MWh/día de media\": {\n                 \"Coste anual (€)\": presupuesto, \"Ganancia anual (€)\": N_DIAS * (tA2[\"EY\"] - tA[\"EY\"]),\n                 \"Ganancia neta anual (€)\": N_DIAS * (tA2[\"EY\"] - tA[\"EY\"]) - presupuesto, \"CVaR 5 % diario (€)\": tA2[\"CVaR\"],\n                 \"P(compra en el mercado)\": tA2[\"Pspot\"]}}\n    return pd.DataFrame(filas).T, extra\n\n\n# ==============================================================================================\n# Sensibilidad (O2.2, O3.3) y estimador\n# ==============================================================================================\nPARAM_SENS = {\"p4\": \"p del escenario Anticiclónico\", \"tri\": \"Solar G_s (a, m, b)\", \"weib_l\": \"Eólica · escala λ\",\n              \"weib_k\": \"Eólica · forma k\", \"ln_mu\": \"Hidro · μ de ln G_h\", \"ln_sg\": \"Hidro · σ de ln G_h\",\n              \"norm_mu\": \"Demanda · media\", \"norm_sd\": \"Demanda · desv. típica\", \"P_exp\": \"P_exp\", \"P_pen\": \"P_pen\"}\n\n\ndef _aplicar(com, esc, par, v):\n    c2, e2 = copy.deepcopy(com), dict(esc)\n    if par == \"p4\":\n        p = list(normalizar(esc[\"p\"])); p4 = min(0.99, p[3] * (1 + v)); s = (1 - p4) / (1 - p[3])\n        e2[\"p\"] = [p[0] * s, p[1] * s, p[2] * s, p4]\n    elif par in (\"P_exp\", \"P_pen\"):\n        e2[par] = float(esc[par]) * (1 + v)\n    else:\n        for f in ESCENARIOS:\n            d = c2[\"dist\"][f]\n            if par == \"tri\":\n                d[\"tri\"] = [x * (1 + v) for x in d[\"tri\"]]\n            elif par == \"weib_l\":\n                d[\"weib\"] = [d[\"weib\"][0], d[\"weib\"][1] * (1 + v)]\n            elif par == \"weib_k\":\n                d[\"weib\"] = [d[\"weib\"][0] * (1 + v), d[\"weib\"][1]]\n            elif par == \"ln_mu\":\n                d[\"ln\"] = [d[\"ln\"][0] * (1 + v), d[\"ln\"][1]]\n            elif par == \"ln_sg\":\n                d[\"ln\"] = [d[\"ln\"][0], d[\"ln\"][1] * (1 + v)]\n            elif par == \"norm_mu\":\n                d[\"norm\"] = [d[\"norm\"][0] * (1 + v), d[\"norm\"][1]]\n            elif par == \"norm_sd\":\n                d[\"norm\"] = [d[\"norm\"][0], d[\"norm\"][1] * (1 + v)]\n    return c2, e2\n\n\ndef sensibilidad_parametros(com, esc, variaciones):\n    filas = []\n    for par, nom in PARAM_SENS.items():\n        for v in variaciones:\n            t = teoria_A(*_aplicar(com, esc, par, v), con_dist=False)\n            filas.append({\"Parámetro\": nom, \"Variación\": v, \"Teórico · E(Y) (€)\": t[\"EY\"], \"Teórico · Var(Y)\": t[\"VY\"],\n                          \"Teórico · σ(Y) (€)\": t[\"sdY\"]})\n    elas = {}\n    for par, nom in PARAM_SENS.items():\n        vs = [teoria_A(*_aplicar(com, esc, par, h), con_dist=False)[\"VY\"] for h in (-0.01, 0.01)]\n        elas[nom] = (math.log(vs[1]) - math.log(vs[0])) / (math.log(1.01) - math.log(0.99)) if min(vs) > 0 else 0.0\n    return pd.DataFrame(filas), elas\n\n\ndef indices_sobol(com, esc, n=20000, semilla=1000):\n    \"\"\"Índices de Sobol (Saltelli/Jansen) de las entradas aleatorias T, G_s, G_w, G_h y D sobre Y.\"\"\"\n    rng = np.random.default_rng(int(semilla) + 7)\n    UA, UB = rng.random((6, n)), rng.random((6, n))\n    yA = generar_dias(com, esc, UA)[\"Y\"]; yB = generar_dias(com, esc, UB)[\"Y\"]\n    V = float(np.var(np.concatenate([yA, yB]), ddof=1))\n    filas = []\n    for i, nom in enumerate((\"Escenario T\", \"Solar G_s\", \"Eólica G_w\", \"Hidráulica G_h\", \"Demanda D\")):\n        UAB = UA.copy(); UAB[i] = UB[i]\n        yAB = generar_dias(com, esc, UAB)[\"Y\"]\n        filas.append({\"Entrada\": nom, \"Índice de primer orden S₁\": float(np.mean(yB * (yAB - yA)) / V),\n                      \"Índice total S_T\": float(0.5 * np.mean((yA - yAB) ** 2) / V)})\n    df = pd.DataFrame(filas).set_index(\"Entrada\")\n    df.loc[\"Escenario T\", \"Teórico · S₁\"] = teoria_A(com, esc, con_dist=False)[\"S_T\"]\n    return df\n\n\ndef solar_necesaria(com, esc, objetivo=0.0):\n    \"\"\"O3.3 · ampliación solar con la que E(Y) = objetivo: (a) desplazamiento fijo de Δ MWh todos los días;\n    (b) más capacidad (G_s escalada), expresada en MWh/día de media. Bisección sobre la teoría exacta.\"\"\"\n    ms = sum(pi * momentos_fuentes(com, esc, f)[\"Gs\"][0] for pi, f in zip(normalizar(esc[\"p\"]), ESCENARIOS))\n    def EY(kind, x):\n        e2 = dict(esc, solar_extra=float(esc[\"solar_extra\"]) + x) if kind == \"despl\" else \\\n            dict(esc, solar_factor=float(esc[\"solar_factor\"]) * (1 + x / ms))\n        return teoria_A(com, e2, con_dist=False)[\"EY\"]\n    filas = []\n    for kind, nom in ((\"despl\", \"Desplazamiento fijo de G_s (mismos MWh todos los días)\"),\n                      (\"escala\", \"Más capacidad solar (G_s escalada, MWh/día de media)\")):\n        lo, hi = 0.0, 50.0\n        while EY(kind, hi) < objetivo and hi < 5000:\n            hi *= 2\n        for _ in range(40):\n            mid = (lo + hi) / 2\n            if EY(kind, mid) < objetivo:\n                lo = mid\n            else:\n                hi = mid\n        filas.append({\"Forma de la ampliación\": nom, \"MWh/día de media adicionales\": hi,\n                      \"Aumento de la solar media\": hi / ms, \"E(Y) resultante (€)\": EY(kind, hi),\n                      \"Ganancia por MWh/día añadido (€/día)\": (EY(kind, 1.0) - EY(kind, 0.0))})\n    return pd.DataFrame(filas).set_index(\"Forma de la ampliación\"), ms\n\n\ndef valores_barrido(vmin, vmax, puntos):\n    v = np.geomspace(max(1, vmin), max(vmin + 1, vmax), max(2, int(puntos)))\n    return sorted(set(int(round(x)) for x in v))\n\n\ndef sensibilidad_estimador(com, esc, metrica, valores, replicas, semilla, progreso=None):\n    \"\"\"E(Y) frente al nº de días (Bloque A) o ganancia de la batería frente al nº de años simulados (Bloque B).\"\"\"\n    tA = teoria_A(com, esc, con_dist=metrica != \"dia\")\n    if metrica == \"dia\":\n        teo, sd1 = tA[\"EY\"], tA[\"sdY\"]\n    else:\n        tB = teoria_bateria(com, esc, tA); teo, sd1 = tB[\"E_gan\"], float(\"nan\")\n    tq = _tq(int(replicas))\n    filas, k, tot = [], 0, len(valores) * int(replicas)\n    for n in valores:\n        medias = []\n        for r in range(int(replicas)):\n            if metrica == \"dia\":\n                rng = np.random.default_rng(int(semilla) + r)\n                medias.append(float(generar_dias(com, esc, rng.random((6, n)))[\"Y\"].mean()))\n            else:\n                b = base_anual(com, esc, n, int(semilla) + 50_000 * (r + 1))\n                medias.append(float((simular_bateria(esc, b)[\"Y\"] - b[\"Y\"]).mean()))\n            k += 1\n            if progreso:\n                progreso(k, tot)\n        m = float(np.mean(medias)); sdr = float(np.std(medias, ddof=1)) if len(medias) > 1 else 0.0\n        se = sdr / math.sqrt(len(medias))\n        filas.append({\"n\": n, \"Media de las réplicas\": m, \"IC95 inf\": m - tq * se, \"IC95 sup\": m + tq * se,\n                      \"σ entre réplicas\": sdr, \"σ teórica del estimador\": sd1 / math.sqrt(n) if sd1 == sd1 else float(\"nan\"),\n                      \"Teórico\": teo, \"Error relativo\": (m - teo) / abs(teo), \"Medias por réplica\": medias})\n    return pd.DataFrame(filas).set_index(\"n\")\n\n\n# ==============================================================================================\n# Mecanismo\n# ==============================================================================================\ndef un_dia(com, esc, uT, us, uw, uh, ud):\n    U = np.array([[uT], [us], [uw], [uh], [ud], [0.5]])\n    o = generar_dias(com, esc, U)\n    return {k: (float(v[0]) if hasattr(v, \"__len__\") else v) for k, v in o.items() if k != \"terminos\"} | \\\n        {\"terminos\": [float(x[0]) for x in o[\"terminos\"]]}\n\n\n# ==============================================================================================\n# Formato y textos\n# ==============================================================================================\ndef num(x, d=2):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    if isinstance(x, float) and math.isinf(x):\n        return \"∞\"\n    if round(float(x), d) == 0:\n        x = 0.0\n    s = f\"{x:,.{d}f}\"\n    return s.replace(\",\", \"X\").replace(\".\", \",\").replace(\"X\", \".\")\n\n\ndef pct(x, d=1):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    return num(100 * x, d) + \" %\"\n\n\ndef eur(x, d=0):\n    if isinstance(x, str):\n        return x\n    if x is None or (isinstance(x, float) and math.isnan(x)):\n        return \"—\"\n    return num(x, d) + \" €\"\n\n\ndef fmt_val(k, v):\n    if isinstance(v, str) or v is None:\n        return \"—\" if v is None else v\n    if isinstance(v, (bool, np.bool_)):\n        return \"Sí\" if v else \"No\"\n    if isinstance(v, tuple):\n        return f\"[{fmt_val(k, v[0])}; {fmt_val(k, v[1])}]\"\n    if \"(€\" in k or k.endswith(\"€\"):\n        return eur(v, 1 if abs(v) < 100 else 0)\n    if \"(MWh\" in k or \"MWh/día\" in k or \"(días\" in k or \"Días\" in k:\n        return num(v, 2)\n    if \"P(\" in k or \"%\" in k or \"Contribución\" in k or \"Peso\" in k or \"Cuota\" in k or \"Aumento\" in k \\\n            or \"probabilidad\" in k.lower() or \"S₁\" in k or \"S_T\" in k or \"cubiertos\" in k or \"Carga inicial\" in k:\n        return pct(v, 2)\n    if \"p-valor\" in k:\n        return num(v, 4) if v >= 1e-4 else \"< 0,0001\"\n    if \"CV\" in k or \"σ\" in k or \"η\" in k or \"Eficiencia\" in k or \"Estadístico\" in k:\n        return num(v, 3)\n    if k == \"n\":\n        return num(v, 0)\n    return num(v, 3)\n\n\ndef fmt_kpi(k, c, v):\n    return fmt_val(k, v)\n\n\ndef fmt_res(fila, col, v):\n    if col == \"Teórico en IC95\":\n        return \"—\" if v is None else (\"Sí\" if v else \"No\")\n    if col == \"Error relativo\":\n        return \"—\" if v is None or (isinstance(v, float) and math.isnan(v)) else pct(v, 2)\n    if col == \"Teórico\" and v is not None and isinstance(v, float) and math.isnan(v):\n        return \"solo simulación\"\n    if col == \"Teórico\" and v is None:\n        return \"solo simulación\"\n    return fmt_val(fila, v)\n\n\ndef fmt_col(fila, col, v):\n    return fmt_val(col, v)\n\n\ndef fmt_obj(fila, col, v):\n    if col == \"Valor\":\n        return pct(v, 2) if fila.startswith(\"Probabilidad\") else eur(v)\n    return str(v)\n\n\ndef texto_escenario(nombre, r):\n    A, B = r[\"teoria\"][\"A\"], r[\"teoria\"][\"B\"]\n    okA = r[\"resA\"][\"Teórico en IC95\"].dropna().astype(bool); okB = r[\"resB\"][\"Teórico en IC95\"].dropna().astype(bool)\n    fuera = list(okA[~okA].index) + list(okB[~okB].index)\n    n_kpi = len(okA) + len(okB)\n    val = (\"la simulación reproduce los valores teóricos (todos dentro del IC95 %)\" if not fuera else\n           f\"la simulación reproduce los valores teóricos en {n_kpi - len(fuera)} de los {n_kpi} KPIs (fuera del IC95 %: \"\n           f\"{', '.join(fuera)}; con tantos KPIs es esperable que alguno quede fuera por azar)\")\n    pf = A[\"por_tipo\"]\n    act = [f for f in ESCENARIOS if pf[f][\"p\"] > 0]\n    mayor_cv = max(act, key=lambda f: pf[f][\"CV\"])\n    dom = int(np.argmax(np.abs(A[\"contrib\"])))\n    cvar_con = r[\"resB\"].loc[\"CVaR 5 % diario con batería (€)\", \"Simulado · media\"]\n    txt = (f\"{nombre}: un día deja en media E(Y) = {eur(A['EY'])} (σ = {eur(A['sdY'])}); P(B < 0) = {pct(A['Pdef'], 1)}, \"\n           f\"VaR 95 % = {eur(A['VaR'])} y CVaR 5 % = {eur(A['CVaR'])}. El escenario {NOMBRE[mayor_cv]} es el de mayor \"\n           f\"incertidumbre relativa (CV = {num(pf[mayor_cv]['CV'], 3)}) y el término «{TERMINOS[dom]}» explica el \"\n           f\"{pct(A['contrib'][dom], 0)} de Var(Y). La batería de {num(float(r['esc']['cap']), 0)} MWh gana {eur(B['E_gan'], 1)} \"\n           f\"al día ({eur(B['gan_anual'])} al año, {eur(B['neto_anual'])} netos de amortización), reduce los días de compra \"\n           f\"en el mercado de {num(B['LOLE_sin'], 0)} a {num(B['LOLE_con'], 0)} al año y lleva el CVaR 5 % diario a \"\n           f\"{eur(cvar_con)} (simulado) (valores teóricos salvo indicación); {val}.\")\n    n_ok = (r[\"objetivos\"][\"Cumple\"] == \"Sí\").sum()\n    txt += f\" Cumple {n_ok} de los {len(r['objetivos'])} objetivos.\"\n    return txt\n\n\ndef recomendaciones(res, base, com, barr_cap=None):\n    \"\"\"O7.1 · recomendación de inversión en la batería y condiciones que la cambiarían.\"\"\"\n    rec = []\n    if base in res:\n        r = res[base]; B = r[\"teoria\"][\"B\"]; e = r[\"esc\"]\n        ic = r[\"resB\"].loc[\"Ganancia media diaria pareada E(Δ) (€)\", [\"IC95 inf\", \"IC95 sup\"]]\n        verbo = \"Instalar\" if B[\"neto_anual\"] > 0 else \"No instalar\"\n        rec.append(f\"{verbo} la batería de {num(float(e['cap']), 0)} MWh: gana {eur(B['E_gan'], 1)} al día (IC95 % simulado \"\n                   f\"[{eur(ic.iloc[0], 1)}; {eur(ic.iloc[1], 1)}]), es decir {eur(B['gan_anual'])} al año frente a una \"\n                   f\"amortización de {eur(B['amortizacion'])} ({eur(float(e['amort']))} por MWh y año): neto \"\n                   f\"{eur(B['neto_anual'])} al año. Compensa mientras la amortización no supere \"\n                   f\"{eur(B['gan_anual'] / float(e['cap']) if float(e['cap']) > 0 else 0)} por MWh y año.\")\n        if barr_cap is not None and len(barr_cap):\n            cst = capacidad_optima(barr_cap)\n            rec.append(f\"Dimensionar la batería en {num(cst, 0)} MWh: maximiza la ganancia neta anual \"\n                       f\"({eur(barr_cap.loc[cst, 'Teórico · ganancia neta anual (€)'])}); la ganancia crece con rendimientos \"\n                       \"decrecientes, porque una batería grande rara vez se llena con superávits tan escasos.\")\n        rec.append(f\"La batería no resuelve el problema de fondo: incluso con ella E(Y) = {eur(B['EY_con'])} al día y se compra \"\n                   f\"en el mercado el {pct(B['Pspot_con'], 0)} de los días. La palanca principal es la generación (o la demanda): \"\n                   \"véanse la solar necesaria para E(Y) ≥ 0 y la comparación batería frente a solar.\")\n    filas = [(n, (r[\"objetivos\"][\"Cumple\"] == \"Sí\").sum(), r[\"teoria\"]) for n, r in res.items()]\n    max_ok = max(f[1] for f in filas)\n    mejor = sorted([f for f in filas if f[1] == max_ok], key=lambda f: -f[2][\"B\"][\"EY_con\"])[0]\n    rec.append(f\"Entre los escenarios analizados, «{mejor[0]}» cumple más objetivos ({mejor[1]} de \"\n               f\"{len(res[mejor[0]]['objetivos'])}), con E(Y) = {eur(mejor[2]['B']['EY_con'])} al día con batería.\")\n    return rec\n\n\ndef texto_recomendacion(res, base, com, barr_cap=None):\n    return \" \".join(f\"({i + 1}) {r}\" for i, r in enumerate(recomendaciones(res, base, com, barr_cap)))\n\n\nKPIS_CUADRO = [\n    (\"Beneficio diario esperado E(Y), con y sin batería\", \"rentabilidad media de la micro-red\"),\n    (\"Probabilidad de déficit y de compra en el mercado\", \"frecuencia con que la generación no cubre la demanda\"),\n    (\"VaR 95 % y CVaR 5 % diarios\", \"tamaño de las pérdidas en los días malos para provisionar liquidez\"),\n    (\"LOLE (días al año con compra en el mercado)\", \"nivel de servicio y dependencia del mercado spot\"),\n    (\"Ganancia de la batería y ganancia neta de amortización\", \"rentabilidad de la inversión en almacenamiento\"),\n    (\"Estado de carga medio y recuperación tras rachas\", \"robustez frente a rachas de mal tiempo\"),\n    (\"Coste por escenario climático\", \"qué clima concentra las pérdidas (Anticiclónico)\"),\n]\n",
 "graficos.py": "# -*- coding: utf-8 -*-\n\"\"\"Gráficos (matplotlib) de la aplicación Eco-Flow. Cada función devuelve una Figure.\"\"\"\nimport io\n\nimport matplotlib\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\nimport matplotlib.ticker as mticker\nimport numpy as np\n\nimport ecoflow as ef\n\n# Paleta categórica validada (orden fijo; el color sigue a la entidad, nunca a su posición)\nSERIES = [\"#2a78d6\", \"#eb6834\", \"#1baf7a\", \"#eda100\", \"#e87ba4\", \"#008300\", \"#6250d6\", \"#e34948\"]\nCOLOR_TIPO = {1: SERIES[3], 2: SERIES[0], 3: SERIES[2], 4: \"#8a8984\"}\nCOLOR_TERM = [SERIES[0], SERIES[1], SERIES[6]]          # mercado, coste variable, descuento\nCOLOR_FUENTE = {\"Solar\": SERIES[3], \"Eólica\": SERIES[0], \"Hidráulica\": SERIES[2]}\nCON, SIN = SERIES[6], SERIES[1]\nBUENO, CRITICO = \"#0b7a0b\", \"#b23232\"\nTEXTO, TEXTO2, REJILLA = \"#0b0b0b\", \"#52514e\", \"#e1e0d9\"\n\nplt.rcParams.update({\n    \"figure.dpi\": 110, \"savefig.dpi\": 150, \"font.size\": 9.5, \"axes.titlesize\": 10.5, \"axes.titleweight\": \"bold\",\n    \"axes.edgecolor\": \"#b9b8b2\", \"axes.labelcolor\": TEXTO2, \"xtick.color\": TEXTO2, \"ytick.color\": TEXTO2,\n    \"axes.grid\": True, \"grid.color\": REJILLA, \"grid.linewidth\": 0.8, \"axes.axisbelow\": True,\n    \"axes.spines.top\": False, \"axes.spines.right\": False, \"legend.frameon\": False,\n})\n_K0 = mticker.FuncFormatter(lambda y, _: ef.num(y, 0))\n_PCT = mticker.PercentFormatter(1.0, decimals=0)\n\n\ndef color_escenario(i):\n    return SERIES[i % len(SERIES)]\n\n\ndef fig_a_png(fig):\n    buf = io.BytesIO()\n    fig.savefig(buf, format=\"png\", bbox_inches=\"tight\", facecolor=\"white\")\n    plt.close(fig)\n    buf.seek(0)\n    return buf\n\n\ndef _etiquetas(ax, nombres):\n    ax.set_xticks(range(len(nombres)))\n    ax.set_xticklabels(nombres, rotation=30 if len(nombres) > 2 else 0, ha=\"right\" if len(nombres) > 2 else \"center\",\n                       fontsize=7.5)\n\n\ndef _densidad(rej, bins):\n    \"\"\"Densidad de una distribución en rejilla promediada en los intervalos `bins`.\"\"\"\n    F = np.concatenate([[0.0], np.cumsum(rej.p)]) / rej.masa()\n    xe = np.concatenate([[rej.x[0] - rej.h / 2], rej.x + rej.h / 2])\n    Fb = np.interp(bins, xe, F)\n    return np.diff(Fb) / np.diff(bins)\n\n\n# ---------------------------------------------------------------------------------------------- mecanismo\ndef fig_sens_param(df, elas, titulo=None):\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 3.7), gridspec_kw={\"width_ratios\": [1.6, 1]})\n    for i, (par, d) in enumerate(df.groupby(\"Parámetro\", sort=False)):\n        a1.plot(100 * d[\"Variación\"], d[\"Teórico · Var(Y)\"], \"o-\", color=SERIES[i % 8], lw=1.8, ms=4, label=par)\n    a1.yaxis.set_major_formatter(mticker.FuncFormatter(lambda y, _: ef.num(y / 1e6, 1) + \"M\"))\n    a1.set_xlabel(\"variación del parámetro (%)\"); a1.set_ylabel(\"Var(Y) teórica (€²)\")\n    a1.set_title(\"Var(Y) al variar cada parámetro (resto fijo)\", fontsize=9.5)\n    a1.legend(fontsize=6.5, ncol=2)\n    nombres = list(elas); v = [elas[k] for k in nombres]\n    a2.barh(nombres, [abs(y) for y in v], color=[SERIES[i % 8] for i in range(len(v))], height=0.55)\n    for i, y in enumerate(v):\n        a2.text(abs(y), i, \"  \" + ef.num(y, 2), va=\"center\", fontsize=8)\n    a2.invert_yaxis(); a2.set_xlim(0, max(abs(y) for y in v) * 1.35)\n    a2.tick_params(axis=\"y\", labelsize=7.5)\n    a2.set_title(\"|Elasticidad| de Var(Y) (signo en la etiqueta)\", fontsize=9.5)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_sobol(df, titulo=None):\n    fig, ax = plt.subplots(figsize=(8.5, 3.0))\n    x = np.arange(len(df))\n    ax.bar(x - 0.2, df[\"Índice de primer orden S₁\"], width=0.4, color=SERIES[0], label=\"S₁ (primer orden)\")\n    ax.bar(x + 0.2, df[\"Índice total S_T\"], width=0.4, color=SERIES[1], label=\"S_T (total, con interacciones)\")\n    if \"Teórico · S₁\" in df:\n        t = df[\"Teórico · S₁\"].to_numpy(float); ok = ~np.isnan(t)\n        ax.plot(x[ok] - 0.2, t[ok], \"D\", color=TEXTO, ms=6, label=\"S₁ teórico del escenario climático\")\n    for i, (a, b) in enumerate(zip(df[\"Índice de primer orden S₁\"], df[\"Índice total S_T\"])):\n        ax.text(i - 0.2, max(a, 0), ef.pct(a, 0), ha=\"center\", va=\"bottom\", fontsize=7.5)\n        ax.text(i + 0.2, b, ef.pct(b, 0), ha=\"center\", va=\"bottom\", fontsize=7.5)\n    ax.set_xticks(x); ax.set_xticklabels(df.index)\n    ax.yaxis.set_major_formatter(_PCT); ax.set_ylim(min(0, df[\"Índice de primer orden S₁\"].min()) - 0.02, 1.15)\n    ax.set_title(titulo or \"O2.2 · índices de Sobol de las entradas aleatorias sobre Y\")\n    ax.legend(fontsize=7.5, loc=\"upper right\")\n    fig.tight_layout()\n    return fig\n\n\ndef fig_sens_convergencia(df, metrica, titulo=None):\n    fig, ax = plt.subplots(figsize=(9, 3.6))\n    x = np.arange(len(df))\n    for i, (_, r) in enumerate(df.iterrows()):\n        ax.plot([i] * len(r[\"Medias por réplica\"]), r[\"Medias por réplica\"], \"o\", color=SERIES[0], alpha=0.3, ms=5)\n    m = df[\"Media de las réplicas\"]\n    ax.errorbar(x, m, yerr=[m - df[\"IC95 inf\"], df[\"IC95 sup\"] - m], fmt=\"o-\", color=SERIES[0], ms=7, capsize=4,\n                label=\"media de las réplicas ± IC95 %\")\n    ax.plot([], [], \"o\", color=SERIES[0], alpha=0.3, label=\"cada réplica\")\n    ax.axhline(df[\"Teórico\"].iloc[0], color=TEXTO, ls=\"--\", lw=1.4, label=f\"teórico {ef.eur(df['Teórico'].iloc[0])}\")\n    ax.set_xticks(x); ax.set_xticklabels([ef.num(v, 0) for v in df.index])\n    ax.set_xlabel(\"días simulados\" if metrica == \"dia\" else \"años simulados\"); ax.set_ylabel(\"€\")\n    ax.set_title(titulo or (\"Convergencia · E(Y) diario\" if metrica == \"dia\" else \"Convergencia · ganancia diaria de la batería\"))\n    ax.legend(loc=\"best\", fontsize=8)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_sens_variabilidad(df, metrica, titulo=None):\n    fig, ax = plt.subplots(figsize=(9, 3.2))\n    x = np.arange(len(df))\n    v = df[\"σ entre réplicas\"]\n    ax.bar(x, v, color=SERIES[0], width=0.6, label=\"σ entre réplicas (simulada)\")\n    ax.plot(x, df[\"σ teórica del estimador\"], color=TEXTO, marker=\"o\", lw=1.5, label=\"σ teórica del estimador\")\n    for i, y in enumerate(v):\n        ax.text(i, y, ef.num(y, 2), ha=\"center\", va=\"bottom\", fontsize=8)\n    ax.set_xticks(x); ax.set_xticklabels([ef.num(t, 0) for t in df.index])\n    ax.set_xlabel(\"días simulados\" if metrica == \"dia\" else \"años simulados\"); ax.set_ylabel(\"€\")\n    ax.set_title(titulo or \"Variabilidad de la estimación entre réplicas\")\n    ax.legend(loc=\"upper right\", fontsize=8)\n    ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- mecanismo\ndef fig_mecanismo(p, uT, dia, titulo=None):\n    \"\"\"Izquierda: el escenario climático se elige con U_T. Centro: generación por fuente frente a la demanda.\n    Derecha: beneficio del día por términos.\"\"\"\n    fig, (a1, a2, a3) = plt.subplots(1, 3, figsize=(11.5, 3.6), gridspec_kw={\"width_ratios\": [1.4, 0.9, 1]})\n    F = np.cumsum(ef.normalizar(p)); esc = np.concatenate([[0], F])\n    for i, f in enumerate(ef.ESCENARIOS):\n        if esc[i + 1] - esc[i] <= 0:\n            continue\n        a1.add_patch(plt.Rectangle((-0.6, esc[i]), 4.2, esc[i + 1] - esc[i], color=COLOR_TIPO[f], alpha=0.15, lw=0))\n        a1.plot([i - 0.5, i + 0.5], [F[i], F[i]], color=COLOR_TIPO[f], lw=3)\n        a1.text(3.65, (esc[i] + esc[i + 1]) / 2, f\"{ef.NOMBRE[f]} ({ef.num(esc[i], 2)}, {ef.num(F[i], 2)}]\",\n                va=\"center\", fontsize=7.5, color=TEXTO2)\n    k = min(int(np.searchsorted(F, uT)), 3)\n    a1.annotate(\"\", xy=(k, uT), xytext=(-0.55, uT), arrowprops=dict(arrowstyle=\"->\", color=TEXTO, lw=1.6))\n    a1.annotate(\"\", xy=(k, -0.02), xytext=(k, uT), arrowprops=dict(arrowstyle=\"->\", color=TEXTO, lw=1.6))\n    a1.text(-0.55, min(uT + 0.03, 1.0), f\"U_T = {ef.num(uT, 2)}\", fontsize=9)\n    a1.set_xlim(-0.6, 6.2); a1.set_ylim(-0.03, 1.05)\n    a1.set_xticks(range(4)); a1.set_xticklabels([ef.NOMBRE[f][:5] + \".\" for f in ef.ESCENARIOS], fontsize=8)\n    a1.set_ylabel(\"F(T)\"); a1.set_title(\"Paso 1 · escenario climático\", fontsize=9.5)\n    base = 0.0\n    for nom, v in ((\"Solar\", dia[\"Gs\"]), (\"Eólica\", dia[\"Gw\"]), (\"Hidráulica\", dia[\"Gh\"])):\n        a2.bar([0], [v], bottom=[base], color=COLOR_FUENTE[nom], width=0.5, label=nom); base += v\n    a2.bar([1], [dia[\"D\"]], color=TEXTO2, width=0.5, label=\"demanda\")\n    a2.text(0, base, ef.num(base, 1), ha=\"center\", va=\"bottom\", fontsize=8)\n    a2.text(1, dia[\"D\"], ef.num(dia[\"D\"], 1), ha=\"center\", va=\"bottom\", fontsize=8)\n    a2.set_xticks([0, 1]); a2.set_xticklabels([\"G\", \"D\"]); a2.set_ylabel(\"MWh\")\n    a2.set_title(f\"Paso 2 · balance B = {ef.num(dia['Bp'], 1)} MWh\", fontsize=9.5)\n    a2.legend(fontsize=7, loc=\"upper right\"); a2.margins(y=0.25)\n    t = dia[\"terminos\"]; noms = [\"mercado\", \"coste var.\", \"descuento\"]\n    x = 0; acum = 0.0; usados = []\n    for j in range(3):\n        if j == 2 and abs(t[j]) < 1e-9:\n            continue\n        a3.bar([x], [t[j]], bottom=[acum], color=COLOR_TERM[j], width=0.6)\n        a3.text(x, acum + t[j], ef.num(t[j], 0), ha=\"center\", va=\"bottom\" if t[j] >= 0 else \"top\", fontsize=7.5)\n        acum += t[j]; x += 1; usados.append(noms[j])\n    cf = dia[\"Y\"] - acum\n    a3.bar([x], [cf], bottom=[acum], color=\"#b9b8b2\", width=0.6); usados.append(\"fijo\"); acum += cf; x += 1\n    a3.bar([x], [dia[\"Y\"]], color=TEXTO, width=0.6); usados.append(\"Y\")\n    a3.text(x, dia[\"Y\"], ef.num(dia[\"Y\"], 0), ha=\"center\", va=\"bottom\" if dia[\"Y\"] >= 0 else \"top\", fontsize=8)\n    a3.axhline(0, color=TEXTO2, lw=0.8)\n    a3.set_xticks(range(len(usados))); a3.set_xticklabels(usados, fontsize=7.5)\n    a3.yaxis.set_major_formatter(_K0); a3.set_ylabel(\"€\"); a3.margins(y=0.2)\n    a3.set_title(\"Paso 3 · beneficio del día\", fontsize=9.5)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- bloque A\ndef fig_hist_Y(tA, Y, titulo=None):\n    Y = np.asarray(Y)\n    lo, hi = float(np.quantile(Y, 0.001)), float(np.quantile(Y, 0.999))\n    bins = np.linspace(lo, hi, 90)\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    ax.hist(Y[(Y >= lo) & (Y <= hi)], bins=bins, density=True, color=SERIES[0], alpha=0.45, edgecolor=\"white\",\n            label=\"simulación\")\n    ax.step(bins[:-1], _densidad(tA[\"rejilla\"], bins), where=\"post\", color=TEXTO, lw=1.4, label=\"teórica\")\n    ax.axvline(tA[\"CVaR\"], color=SERIES[6], ls=\":\", lw=1.6, label=f\"CVaR 5 % = {ef.eur(tA['CVaR'])}\")\n    ax.axvline(tA[\"VaR\"], color=SERIES[3], ls=\"-.\", lw=1.4, label=f\"VaR 95 % = {ef.eur(tA['VaR'])}\")\n    ax.axvline(tA[\"EY\"], color=SERIES[0], ls=\"--\", lw=1.4, label=f\"E(Y) = {ef.eur(tA['EY'])}\")\n    ax.axvline(0, color=CRITICO, lw=1.2, label=\"beneficio 0\")\n    ax.xaxis.set_major_formatter(_K0)\n    ax.set_xlabel(\"beneficio de un día Y (€) · del percentil 0,1 al 99,9\"); ax.set_ylabel(\"densidad\")\n    ax.set_title(titulo or \"Distribución del beneficio diario\")\n    ax.legend(loc=\"upper right\", fontsize=7.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_por_tipo(tA, resA, titulo=None):\n    tipos = [f for f in ef.ESCENARIOS if tA[\"por_tipo\"][f][\"p\"] > 0]\n    noms = [ef.NOMBRE[f] for f in tipos]\n    pf = tA[\"por_tipo\"]\n    g = lambda k: resA.loc[k, \"Simulado · media\"]\n    datos = [(\"E(Y | escenario) (€)\", [pf[f][\"EY\"] for f in tipos], [g(f\"E(Y | {n}) (€)\") for n in noms], 0),\n             (\"P(B < 0 | escenario)\", [pf[f][\"Pdef\"] for f in tipos], [g(f\"P(B < 0 | {n})\") for n in noms], \"%\"),\n             (\"Coeficiente de variación\", [pf[f][\"CV\"] for f in tipos], [g(f\"CV(Y | {n})\") for n in noms], 3)]\n    fig, axs = plt.subplots(1, 3, figsize=(11, 3.4))\n    x = np.arange(len(tipos))\n    for ax, (tit, v, s, d) in zip(axs, datos):\n        bars = ax.bar(x, v, color=[COLOR_TIPO[f] for f in tipos], width=0.6)\n        ax.plot(x, s, \"D\", color=TEXTO, ms=6, label=\"simulado\")\n        for b_, y in zip(bars, v):\n            ax.text(b_.get_x() + b_.get_width() / 2, b_.get_height(), ef.pct(y, 1) if d == \"%\" else ef.num(y, d),\n                    ha=\"center\", va=\"bottom\" if y >= 0 else \"top\", fontsize=7.5)\n        ax.set_xticks(x); ax.set_xticklabels([n[:6] + \".\" if len(n) > 7 else n for n in noms], fontsize=8)\n        ax.set_title(tit, fontsize=9.5)\n        if d == \"%\":\n            ax.yaxis.set_major_formatter(_PCT); ax.set_ylim(0, 1.15)\n        elif d == 0:\n            ax.yaxis.set_major_formatter(_K0); ax.margins(y=0.15)\n        else:\n            ax.set_ylim(0, max(max(v), np.nanmax(s)) * 1.25)\n    axs[0].axhline(0, color=TEXTO2, lw=0.8)\n    axs[0].legend(loc=\"lower left\", fontsize=7.5)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_descomposicion(tA, resA, titulo=None):\n    v = list(tA[\"contrib\"])\n    s = [resA.loc[f\"Contribución a Var(Y) · {n}\", \"Simulado · media\"] for n in ef.TERMINOS]\n    keep = [i for i in range(3) if abs(v[i]) > 1e-9 or abs(s[i]) > 1e-9]\n    fig, ax = plt.subplots(figsize=(9, 0.7 + 0.6 * len(keep)))\n    x = np.arange(len(keep))\n    ax.barh(x, [v[i] for i in keep], color=[COLOR_TERM[i] for i in keep], height=0.55)\n    ax.plot([s[i] for i in keep], x, \"D\", color=TEXTO, ms=6, label=\"simulado\")\n    for j, i in enumerate(keep):\n        ax.text(max(v[i], 0), j, \"  \" + ef.pct(v[i], 1), va=\"center\", fontsize=8.5)\n    ax.set_yticks(x); ax.set_yticklabels([ef.TERMINOS[i] for i in keep])\n    ax.invert_yaxis(); ax.xaxis.set_major_formatter(_PCT)\n    ax.set_xlim(min(0, min(v)) * 1.3 - 0.05, max(v) * 1.2)\n    ax.axvline(0, color=TEXTO2, lw=0.8)\n    ax.set_title(titulo or \"Descomposición de Var(Y): Cov(término, Y) / Var(Y)\")\n    ax.legend(loc=\"lower right\", fontsize=8)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_traza_A(traza, titulo=None):\n    tr = traza; x = tr[\"Día\"].to_numpy()\n    fig, (a1, a2) = plt.subplots(2, 1, figsize=(9, 4.6), sharex=True, gridspec_kw={\"height_ratios\": [1.3, 1]})\n    base = np.zeros(len(x))\n    for nom, col in ((\"Solar\", \"Solar (MWh)\"), (\"Eólica\", \"Eólica (MWh)\"), (\"Hidráulica\", \"Hidráulica (MWh)\")):\n        a1.bar(x, tr[col], bottom=base, color=COLOR_FUENTE[nom], width=0.8, label=nom); base += tr[col].to_numpy()\n    a1.plot(x, tr[\"Demanda (MWh)\"], \"o-\", color=TEXTO, ms=3, lw=1.2, label=\"demanda\")\n    a1.set_ylabel(\"MWh\"); a1.legend(fontsize=7, ncol=4, loc=\"upper right\")\n    a1.set_title(titulo or f\"Funcionamiento simulado · primeros {len(tr)} días\")\n    Y = tr[\"Y (€)\"].to_numpy()\n    tipos = [[k for k, v in ef.NOMBRE.items() if v == t][0] for t in tr[\"Escenario\"]]\n    a2.bar(x, Y, color=[COLOR_TIPO[t] for t in tipos], width=0.8)\n    a2.axhline(0, color=TEXTO2, lw=0.8); a2.set_ylabel(\"Y (€)\"); a2.yaxis.set_major_formatter(_K0)\n    from matplotlib.patches import Patch\n    a2.legend([Patch(color=COLOR_TIPO[f]) for f in ef.ESCENARIOS], [ef.NOMBRE[f] for f in ef.ESCENARIOS],\n              fontsize=7, ncol=4, loc=\"lower right\")\n    a2.set_xlabel(\"día simulado\")\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- bloque B\ndef fig_soc(tB, mcB, esc, titulo=None):\n    t = np.arange(1, ef.N_DIAS + 1)\n    E = mcB[\"bat\"][\"E_ini\"]\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 3.4), gridspec_kw={\"width_ratios\": [1.6, 1]})\n    a1.plot(t, E[0], color=SERIES[2], lw=0.7, alpha=0.6, label=\"un año simulado\")\n    a1.plot(t, E.mean(axis=0), color=SERIES[0], lw=1.5, label=\"media simulada\")\n    a1.plot(t, tB[\"E_soc\"], \"--\", color=TEXTO, lw=1.5, label=\"teórica (cadena de Markov)\")\n    a1.set_xlim(1, ef.N_DIAS); a1.set_ylim(0, max(float(esc[\"cap\"]), 1) * 1.05)\n    a1.set_xlabel(\"día del año\"); a1.set_ylabel(\"estado de carga (MWh)\")\n    a1.set_title(f\"Estado de carga de la batería ({ef.num(float(esc['cap']), 0)} MWh)\", fontsize=9.5)\n    a1.legend(fontsize=7, ncol=2, loc=\"upper right\")\n    e = tB[\"estados\"]; pb = tB[\"pibar\"]\n    if len(e) > 1:\n        a2.bar(e, pb / (e[1] - e[0]), width=(e[1] - e[0]), color=SERIES[6], alpha=0.8)\n        a2.set_yscale(\"log\")\n    a2.set_xlabel(\"estado de carga (MWh)\"); a2.set_ylabel(\"densidad media del año (log)\")\n    a2.set_title(f\"Distribución teórica · vacía el {ef.pct(pb[0], 0)} de los días\", fontsize=9.5)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_hist_bat(tA, mcB, titulo=None):\n    ys, yc = mcB[\"Ys\"].ravel(), mcB[\"Yc\"].ravel()\n    lo, hi = float(np.quantile(ys, 0.001)), float(np.quantile(yc, 0.999))\n    bins = np.linspace(lo, hi, 80)\n    fig, ax = plt.subplots(figsize=(9, 3.4))\n    ax.hist(ys, bins=bins, density=True, color=SIN, alpha=0.35, label=\"sin batería (simulado)\")\n    ax.hist(yc, bins=bins, density=True, color=CON, alpha=0.35, label=\"con batería (simulado)\")\n    ax.step(bins[:-1], _densidad(tA[\"rejilla\"], bins), where=\"post\", color=SIN, lw=1.4, label=\"teórica sin batería\")\n    cs, cc = ef._cvar_muestra(ys), ef._cvar_muestra(yc)\n    ax.axvline(cs, color=SIN, ls=\":\", lw=1.6, label=f\"CVaR 5 % sin = {ef.eur(cs)}\")\n    ax.axvline(cc, color=CON, ls=\":\", lw=1.6, label=f\"CVaR 5 % con = {ef.eur(cc)}\")\n    ax.xaxis.set_major_formatter(_K0)\n    ax.set_xlabel(\"beneficio diario (€)\"); ax.set_ylabel(\"densidad\")\n    ax.set_title(titulo or \"Beneficio diario con y sin batería (misma base climática)\")\n    ax.legend(loc=\"upper right\", fontsize=7)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_ganancia_tipo(tB, mcB, titulo=None):\n    tipos = [f for f in ef.ESCENARIOS if tB[\"por_tipo\"][f][\"p\"] > 0]\n    x = np.arange(len(tipos))\n    v = [tB[\"por_tipo\"][f][\"E_gan\"] for f in tipos]\n    s = [mcB[\"replicas\"][f\"E(Δ | {ef.NOMBRE[f]})\"].mean() for f in tipos]\n    pdf = [tB[\"por_tipo\"][f][\"Pdef\"] for f in tipos]\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(10.5, 3.3))\n    a1.bar(x, v, color=[COLOR_TIPO[f] for f in tipos], width=0.6)\n    a1.plot(x, s, \"D\", color=TEXTO, ms=6, label=\"simulado\")\n    for i, f in enumerate(tipos):\n        a1.text(i, v[i], f\"{ef.num(v[i], 1)} €\\n({ef.pct(tB['por_tipo'][f]['cuota_gan'], 0)} del total)\", ha=\"center\",\n                va=\"bottom\", fontsize=7.5)\n    a1.set_xticks(x); a1.set_xticklabels([ef.NOMBRE[f] for f in tipos], fontsize=8)\n    a1.set_title(\"Ganancia de la batería por escenario (€/día) (O5.3)\", fontsize=9.5)\n    a1.legend(fontsize=7.5, loc=\"upper left\"); a1.margins(y=0.3)\n    w = 0.38\n    a2.bar(x - w / 2, [tB[\"por_tipo\"][f][\"Edef\"] for f in tipos], width=w, color=CRITICO, alpha=0.8, label=\"déficit medio (MWh)\")\n    a2.bar(x + w / 2, [tB[\"por_tipo\"][f][\"Esup\"] for f in tipos], width=w, color=BUENO, alpha=0.8, label=\"superávit medio (MWh)\")\n    for i, p_ in enumerate(pdf):\n        a2.text(i, max(tB[\"por_tipo\"][tipos[i]][\"Edef\"], tB[\"por_tipo\"][tipos[i]][\"Esup\"]), f\"P(B<0) = {ef.pct(p_, 0)}\",\n                ha=\"center\", va=\"bottom\", fontsize=7)\n    a2.set_xticks(x); a2.set_xticklabels([ef.NOMBRE[f] for f in tipos], fontsize=8)\n    a2.set_title(\"Déficit y superávit medios por escenario\", fontsize=9.5); a2.legend(fontsize=7.5); a2.margins(y=0.2)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- comparativas\ndef fig_comparativa(res):\n    nombres = list(res)\n    cols = [color_escenario(i) for i in range(len(nombres))]\n    fig, axs = plt.subplots(2, 2, figsize=(11, 7.6))\n    axs = axs.ravel()\n    x = np.arange(len(nombres))\n    A = [res[n][\"teoria\"][\"A\"] for n in nombres]; B = [res[n][\"teoria\"][\"B\"] for n in nombres]\n    s_ = np.array([a[\"EY\"] for a in A]); c_ = np.array([b[\"EY_con\"] for b in B])\n    axs[0].bar(x - 0.2, s_, width=0.4, color=SIN, label=\"sin batería\")\n    axs[0].bar(x + 0.2, c_, width=0.4, color=CON, label=\"con batería\")\n    axs[0].axhline(0, color=TEXTO2, lw=0.8); axs[0].yaxis.set_major_formatter(_K0)\n    axs[0].set_title(\"E(Y) diario (€)\", fontsize=9); axs[0].legend(fontsize=7, loc=\"lower right\")\n    s_ = [a[\"Pdef\"] for a in A]; c_ = [b[\"Pspot_con\"] for b in B]\n    axs[1].bar(x - 0.2, s_, width=0.4, color=SIN, label=\"P(B < 0)\")\n    axs[1].bar(x + 0.2, c_, width=0.4, color=CON, label=\"P(compra) con batería\")\n    axs[1].yaxis.set_major_formatter(_PCT); axs[1].set_ylim(0, 1); axs[1].legend(fontsize=7, loc=\"lower right\")\n    axs[1].set_title(\"Días de déficit y de compra en el mercado\", fontsize=9)\n    vals = [a[\"CVaR\"] for a in A]\n    axs[2].bar(x, vals, color=cols, width=0.65)\n    for i, v in enumerate(vals):\n        axs[2].text(i, v, ef.num(v, 0), ha=\"center\", va=\"top\", fontsize=6.5)\n    axs[2].yaxis.set_major_formatter(_K0); axs[2].margins(y=0.15)\n    axs[2].set_title(\"CVaR 5 % diario sin batería (€)\", fontsize=9)\n    vals = [b[\"neto_anual\"] for b in B]\n    axs[3].bar(x, vals, color=[BUENO if v > 0 else CRITICO for v in vals], width=0.65)\n    for i, v in enumerate(vals):\n        axs[3].text(i, v, ef.num(v / 1000, 1) + \"k\", ha=\"center\", va=\"bottom\" if v >= 0 else \"top\", fontsize=7)\n    axs[3].axhline(0, color=TEXTO2, lw=0.8); axs[3].margins(y=0.2); axs[3].yaxis.set_major_formatter(_K0)\n    axs[3].set_title(\"Ganancia neta anual de la batería (€)\", fontsize=9)\n    for ax in axs:\n        _etiquetas(ax, nombres)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_diferencias(dif, titulo=None):\n    nombres = list(dif.index)\n    x = np.arange(len(nombres))\n    teo = dif[\"ΔE(Y) diario con batería · teórico (€)\"].to_numpy(float)\n    sim = dif[\"ΔE(Y) diario con batería · simulado (€)\"].to_numpy(float)\n    ic = np.array([list(v) for v in dif[\"IC95 ΔE(Y) con batería (€)\"]])\n    fig, ax = plt.subplots(figsize=(9, 3.6))\n    ax.bar(x, teo, width=0.55, color=[BUENO if v >= 0 else CRITICO for v in teo], alpha=0.8, label=\"teórico\")\n    ax.errorbar(x, sim, yerr=[sim - ic[:, 0], ic[:, 1] - sim], fmt=\"D\", color=TEXTO, ms=5, capsize=3,\n                label=\"simulado ± IC95 % (pareado)\")\n    for i, v in enumerate(teo):\n        ax.text(i + 0.3, v, ef.num(v, 0), ha=\"left\", va=\"center\", fontsize=7.5)\n    ax.axhline(0, color=TEXTO2, lw=1)\n    ax.yaxis.set_major_formatter(_K0)\n    _etiquetas(ax, nombres)\n    ax.set_ylabel(\"€ por día\")\n    ax.set_title(titulo or \"Diferencia de E(Y) diario con batería frente al escenario base\")\n    ax.legend(loc=\"best\", fontsize=7.5); ax.margins(y=0.15)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_validacion(res):\n    nombres = list(res)\n    kA = [(\"Beneficio diario esperado E(Y) (€)\", \"E(Y)\"), (\"Probabilidad de déficit P(B < 0)\", \"P(B<0)\"),\n          (\"VaR 95 % · percentil 5 de Y (€)\", \"VaR\"), (\"CVaR 5 % · media del 5 % peor (€)\", \"CVaR\")]\n    kB = [(\"Ganancia media diaria pareada E(Δ) (€)\", \"E(Δ)\"), (\"P(comprar en el mercado) con batería\", \"P(compra) con\"),\n          (\"Estado de carga medio (MWh)\", \"carga media\")]\n    fig, ax = plt.subplots(figsize=(9, 3.3))\n    ks = kA + kB\n    ancho = 0.8 / len(nombres)\n    for i, n in enumerate(nombres):\n        v = []\n        for k, e_ in ks:\n            tab = res[n][\"resA\"] if (k, e_) in kA else res[n][\"resB\"]\n            lo, hi, m, teo = tab.loc[k, \"IC95 inf\"], tab.loc[k, \"IC95 sup\"], tab.loc[k, \"Simulado · media\"], tab.loc[k, \"Teórico\"]\n            se = (hi - lo) / (2 * 1.96)\n            v.append(0.0 if tab.loc[k, \"Teórico en IC95\"] is None or not se > 0 else (m - teo) / se)\n        ax.bar(np.arange(len(ks)) + i * ancho - 0.4 + ancho / 2, v, width=ancho * 0.9, color=color_escenario(i), label=n)\n    ax.axhline(0, c=TEXTO2, lw=1)\n    for y in (-2, 2):\n        ax.axhline(y, c=CRITICO, lw=1, ls=\"--\")\n    ax.set_xticks(range(len(ks))); ax.set_xticklabels([e for _, e in ks], fontsize=8.5)\n    ax.set_ylabel(\"(simulado − teórico) / error estándar\")\n    ax.set_ylim(min(-3, ax.get_ylim()[0]), max(3, ax.get_ylim()[1]))\n    ax.set_title(\"Validación: error estandarizado de la simulación (±2 ≈ IC95 %)\")\n    ax.legend(fontsize=6.5, ncol=min(3, len(nombres)))\n    fig.tight_layout()\n    return fig\n\n\n# ---------------------------------------------------------------------------------------------- batería\ndef fig_barrido(df, par, opt=None, titulo=None):\n    x = df.index.to_numpy(float)\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(10.5, 3.4))\n    m = df[\"Simulado · E(Δ) (€/día)\"].to_numpy(float); ic = np.array([list(v) for v in df[\"IC95 E(Δ) (€/día)\"]])\n    a1.plot(x, df[\"Teórico · E(Δ) (€/día)\"], \"-\", color=TEXTO, lw=2, label=\"teórico (cadena de Markov)\")\n    a1.errorbar(x, m, yerr=[m - ic[:, 0], ic[:, 1] - m], fmt=\"D\", color=SERIES[0], ms=5, capsize=3, label=\"simulado ± IC95 %\")\n    if par == \"cap\" and len(x) > 1:\n        a1.plot(x, x * (df[\"Teórico · E(Δ) (€/día)\"].iloc[1] / x[1]) if x[1] > 0 else x * 0, \":\", color=TEXTO2,\n                label=\"proporcional a la capacidad\")\n    a1.set_xlabel(df.index.name); a1.set_ylabel(\"€/día\"); a1.set_title(\"Ganancia diaria de la batería\", fontsize=9.5)\n    a1.legend(fontsize=7.5)\n    if par == \"cap\":\n        a2.plot(x, df[\"Teórico · ganancia anual (€)\"], \"o-\", color=CON, lw=2, label=\"ganancia anual\")\n        a2.plot(x, df[\"Amortización anual (€)\"], \"s-\", color=SIN, lw=2, label=\"amortización anual\")\n        a2.plot(x, df[\"Teórico · ganancia neta anual (€)\"], \"D-\", color=SERIES[0], lw=2.4, label=\"ganancia neta\")\n        if opt is not None:\n            a2.plot([opt], [df.loc[opt, \"Teórico · ganancia neta anual (€)\"]], \"*\", color=SERIES[3], ms=16, mec=TEXTO,\n                    label=f\"óptimo: {ef.num(opt, 0)} MWh\")\n        a2.axhline(0, color=TEXTO2, lw=0.8)\n        a2.set_title(\"Ganancia, amortización y ganancia neta anual (O6.1)\", fontsize=9.5)\n        a2.yaxis.set_major_formatter(_K0)\n    else:\n        a2.plot(x, df[\"Teórico · LOLE con batería (días/año)\"], \"o-\", color=SERIES[6], lw=2)\n        a2.set_title(\"LOLE con batería (días/año)\", fontsize=9.5)\n    a2.set_xlabel(df.index.name); a2.legend(fontsize=7.5) if par == \"cap\" else None\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n\n\ndef fig_racha(df, inicio, dias, titulo=None):\n    t = df.index.to_numpy()\n    lo, hi = max(1, inicio - 15), min(ef.N_DIAS, inicio + dias + 40)\n    mk = (t >= lo) & (t <= hi)\n    fig, (a1, a2) = plt.subplots(1, 2, figsize=(11, 3.4))\n    a1.axvspan(inicio, inicio + dias - 1, color=\"#8a8984\", alpha=0.18, label=\"racha Anticiclónica\")\n    a1.plot(t[mk], df[\"Teórico · carga media sin racha (MWh)\"][mk], \"--\", color=TEXTO2, lw=1.4, label=\"sin racha · teórico\")\n    a1.plot(t[mk], df[\"Teórico · carga media con racha (MWh)\"][mk], \"-\", color=CON, lw=2, label=\"con racha · teórico\")\n    a1.plot(t[mk], df[\"Simulado · carga media con racha (MWh)\"][mk], \"o\", color=CON, ms=3, alpha=0.6, label=\"con racha · simulado\")\n    a1.set_xlabel(\"día del año\"); a1.set_ylabel(\"estado de carga medio (MWh)\")\n    a1.set_title(\"Vaciado y recuperación de la batería (O6.2)\", fontsize=9.5); a1.legend(fontsize=7)\n    a2.axvspan(inicio, inicio + dias - 1, color=\"#8a8984\", alpha=0.18)\n    a2.plot(t[mk], df[\"Simulado · Y sin batería, racha (€)\"][mk], \"-\", color=SIN, lw=1.5, label=\"sin batería\")\n    a2.plot(t[mk], df[\"Simulado · Y con batería, racha (€)\"][mk], \"-\", color=CON, lw=1.5, label=\"con batería\")\n    a2.yaxis.set_major_formatter(_K0)\n    a2.set_xlabel(\"día del año\"); a2.set_ylabel(\"€\"); a2.set_title(\"Beneficio medio diario (simulado)\", fontsize=9.5)\n    a2.legend(fontsize=7.5)\n    if titulo:\n        fig.suptitle(titulo, fontweight=\"bold\", fontsize=10.5)\n    fig.tight_layout()\n    return fig\n",
 "informe.py": "# -*- coding: utf-8 -*-\n\"\"\"Informe Word (.docx) del estudio de caso Eco-Flow: beneficio diario de la micro-red, batería de almacenamiento,\nescenarios, dimensionamiento, sensibilidad y ampliación.\"\"\"\nimport datetime\nimport io\nimport math\n\nimport numpy as np\nimport pandas as pd\nimport docx\nfrom docx.shared import Pt, Cm, RGBColor\nfrom docx.enum.text import WD_ALIGN_PARAGRAPH\nfrom docx.enum.table import WD_TABLE_ALIGNMENT\nfrom docx.oxml.ns import qn\nfrom docx.oxml import OxmlElement\n\nimport ecoflow as ef\nfrom ecoflow import num, pct, eur, fmt_kpi, fmt_res, fmt_col, fmt_obj, fmt_val\nimport graficos as gr\n\n\ndef _sombrear(celda, color):\n    tcPr = celda._tc.get_or_add_tcPr()\n    shd = OxmlElement(\"w:shd\")\n    shd.set(qn(\"w:val\"), \"clear\"); shd.set(qn(\"w:color\"), \"auto\"); shd.set(qn(\"w:fill\"), color)\n    tcPr.append(shd)\n\n\nANCHO_UTIL_CM = 17.0          # A4 con márgenes de 2 cm\nMAX_COLS_ESC = 5              # escenarios por tabla cuando las columnas son escenarios\n\n\ndef _cm_por_caracter(pt):\n    return 0.0205 * pt          # anchura media aproximada de un carácter de Calibri\n\n\ndef _anchos(cab, filas, pt):\n    \"\"\"Anchura de cada columna según su contenido; se reparte el ancho útil sin superar la página.\"\"\"\n    nat = []\n    for j, c in enumerate(cab):\n        palabras = max((len(w) for w in str(c).split()), default=1) + 1      # cabecera en negrita\n        # los textos largos (con espacios) pueden partirse en varias líneas; los números, no\n        celdas = max((min(len(f[j]), 30) if \" \" in f[j].strip() and len(f[j]) > 30 else len(f[j]) for f in filas),\n                     default=1)\n        nat.append(max(palabras, celdas, 3) * _cm_por_caracter(pt) + 0.3)\n    total = sum(nat)\n    return nat, total\n\n\nclass Informe:\n    \"\"\"Envoltorio sencillo de python-docx con helpers para títulos, párrafos, tablas y figuras.\"\"\"\n\n    def __init__(self, titulo, subtitulo=\"\"):\n        self.doc = docx.Document()\n        sec = self.doc.sections[0]\n        sec.page_width, sec.page_height = Cm(21), Cm(29.7)\n        sec.left_margin = sec.right_margin = Cm(2)\n        sec.top_margin = sec.bottom_margin = Cm(2)\n        estilo = self.doc.styles[\"Normal\"]\n        estilo.font.name = \"Calibri\"; estilo.font.size = Pt(10.5)\n        self.n_tabla, self.n_fig = 0, 0\n        self.doc.add_heading(titulo, level=0)\n        if subtitulo:\n            p = self.doc.add_paragraph(subtitulo); p.runs[0].italic = True\n\n    def h(self, texto, nivel=1):\n        self.doc.add_heading(texto, level=nivel)\n\n    def p(self, texto, negrita_inicio=None):\n        par = self.doc.add_paragraph()\n        if negrita_inicio and texto.startswith(negrita_inicio):\n            par.add_run(negrita_inicio).bold = True\n            par.add_run(texto[len(negrita_inicio):])\n        else:\n            par.add_run(texto)\n        par.paragraph_format.space_after = Pt(6)\n        return par\n\n    def vinetas(self, items, numeradas=False):\n        for it in items:\n            self.doc.add_paragraph(it, style=\"List Number\" if numeradas else \"List Bullet\")\n\n    def tabla(self, df, titulo, formato=None, indice=True, ancho_fuente=9, nombre_indice=\"\"):\n        \"\"\"Tabla con anchos de columna calculados para que quepa siempre en el ancho de la página: si el contenido\n        no cabe se reduce la letra (hasta 7 pt) y se reparten las columnas proporcionalmente.\"\"\"\n        self.n_tabla += 1\n        cap = self.doc.add_paragraph()\n        cap.add_run(f\"Tabla {self.n_tabla}. {titulo}\").bold = True\n        cap.paragraph_format.keep_with_next = True\n        cols = list(df.columns)\n        cab = ([nombre_indice or (df.index.name or \"\")] if indice else []) + [str(c) for c in cols]\n        filas = []\n        for idx, fila in df.iterrows():\n            filas.append(([num(idx, 0) if isinstance(idx, (int, np.integer)) else str(idx)] if indice else []) +\n                         [formato(idx, c, fila[c]) if formato else _fmt(fila[c]) for c in cols])\n        pt = ancho_fuente\n        nat, total = _anchos(cab, filas, pt)\n        while total > ANCHO_UTIL_CM and pt > 7:\n            pt -= 0.5\n            nat, total = _anchos(cab, filas, pt)\n        if total > ANCHO_UTIL_CM:\n            # la primera columna (nombre de la fila) conserva su anchura natural para no partir palabras\n            w0 = min(nat[0], 0.4 * ANCHO_UTIL_CM) if indice else 0.0\n            resto = sum(nat[1:]) if indice else total\n            f_ = (ANCHO_UTIL_CM - w0) / resto\n            anchos = ([w0] + [w * f_ for w in nat[1:]]) if indice else [w * f_ for w in nat]\n        else:\n            anchos = [w * min(ANCHO_UTIL_CM / total, 1.6) for w in nat]\n        t = self.doc.add_table(rows=1, cols=len(cab))\n        t.style = \"Table Grid\"; t.alignment = WD_TABLE_ALIGNMENT.CENTER\n        t.autofit = False\n        tblPr = t._tbl.tblPr\n        lay = OxmlElement(\"w:tblLayout\"); lay.set(qn(\"w:type\"), \"fixed\"); tblPr.append(lay)\n        trPr = t.rows[0]._tr.get_or_add_trPr()\n        rep = OxmlElement(\"w:tblHeader\"); rep.set(qn(\"w:val\"), \"true\"); trPr.append(rep)\n        for j, col in enumerate(t.columns):\n            col.width = Cm(anchos[j])\n        for j, c in enumerate(cab):\n            cel = t.rows[0].cells[j]; cel.text = \"\"; cel.width = Cm(anchos[j])\n            r = cel.paragraphs[0].add_run(str(c)); r.bold = True; r.font.size = Pt(pt)\n            r.font.color.rgb = RGBColor(0xFF, 0xFF, 0xFF)\n            if j > 0 or not indice:\n                cel.paragraphs[0].alignment = WD_ALIGN_PARAGRAPH.RIGHT\n            _sombrear(cel, \"2F5496\")\n        for i, vals in enumerate(filas):\n            celdas = t.add_row().cells\n            for j, v in enumerate(vals):\n                celdas[j].text = \"\"; celdas[j].width = Cm(anchos[j])\n                r = celdas[j].paragraphs[0].add_run(v); r.font.size = Pt(pt)\n                if j > 0 or not indice:\n                    celdas[j].paragraphs[0].alignment = WD_ALIGN_PARAGRAPH.RIGHT\n                if i % 2 == 1:\n                    _sombrear(celdas[j], \"EAF0F8\")\n        self.doc.add_paragraph()\n\n    def tabla_escenarios(self, df, titulo, formato=None, nombre_indice=\"\"):\n        \"\"\"Tabla cuyas columnas son escenarios: se parte en bloques de MAX_COLS_ESC columnas para que quepa.\"\"\"\n        cols = list(df.columns)\n        if len(cols) <= MAX_COLS_ESC:\n            self.tabla(df, titulo, formato, nombre_indice=nombre_indice)\n            return\n        n = math.ceil(len(cols) / MAX_COLS_ESC)\n        tam = math.ceil(len(cols) / n)\n        for k in range(n):\n            self.tabla(df[cols[k * tam:(k + 1) * tam]], f\"{titulo} ({k + 1}/{n})\", formato, nombre_indice=nombre_indice)\n\n    def figura(self, fig, titulo, ancho_cm=16.5):\n        self.n_fig += 1\n        self.doc.add_picture(gr.fig_a_png(fig), width=Cm(ancho_cm))\n        self.doc.paragraphs[-1].alignment = WD_ALIGN_PARAGRAPH.CENTER\n        self.doc.paragraphs[-1].paragraph_format.keep_with_next = True\n        cap = self.doc.add_paragraph(); cap.alignment = WD_ALIGN_PARAGRAPH.CENTER\n        r = cap.add_run(f\"Figura {self.n_fig}. {titulo}\"); r.italic = True; r.font.size = Pt(9)\n\n    def salto(self):\n        self.doc.add_page_break()\n\n    def guardar(self):\n        buf = io.BytesIO()\n        self.doc.save(buf)\n        return buf.getvalue()\n\n\ndef _fmt(v):\n    if isinstance(v, (bool, np.bool_)):\n        return \"Sí\" if v else \"No\"\n    if v is None:\n        return \"—\"\n    if isinstance(v, (int, np.integer)):\n        return num(v, 0)\n    if isinstance(v, (float, np.floating)):\n        return \"—\" if math.isnan(v) else num(v, 3)\n    return str(v)\n\n\ndef _sub(df, filas):\n    return df.loc[[f for f in filas if f in df.index]]\n\n\ndef _txt(f, c, v):\n    return v if isinstance(v, str) else _fmt(v)\n\n\n\n\n# ---------------------------------------------------------------------------------------------- tablas\nFILAS_A = [\"Beneficio diario esperado E(Y) (€)\", \"Desviación típica σ(Y) (€)\", \"Probabilidad de déficit P(B < 0)\",\n           \"Probabilidad de comprar en el mercado\", \"VaR 95 % · percentil 5 de Y (€)\", \"CVaR 5 % · media del 5 % peor (€)\",\n           \"Déficit medio comprado (MWh)\", \"Generación media E(G) (MWh)\"]\nFILAS_B = [\"Beneficio diario esperado sin batería (€)\", \"Beneficio diario esperado con batería (€)\",\n           \"Ganancia media diaria pareada E(Δ) (€)\", \"P(comprar en el mercado) sin batería\",\n           \"P(comprar en el mercado) con batería\", \"Déficits cubiertos por completo por la batería\",\n           \"VaR 95 % diario sin batería (€)\", \"VaR 95 % diario con batería (€)\", \"CVaR 5 % diario sin batería (€)\",\n           \"CVaR 5 % diario con batería (€)\", \"Estado de carga medio (MWh)\", \"LOLE sin batería (días/año)\",\n           \"LOLE con batería (días/año)\", \"σ(Δ) diario (€)\"]\n\n\ndef tabla_tipos(t, resA):\n    pf = t[\"A\"][\"por_tipo\"]\n    filas = {}\n    for f in ef.ESCENARIOS:\n        nf = ef.NOMBRE[f]\n        g = lambda k: resA.loc[k, \"Simulado · media\"]\n        filas[nf] = {\"Teórico · E(Y)\": pf[f][\"EY\"], \"Simulado · E(Y)\": g(f\"E(Y | {nf}) (€)\"),\n                     \"Teórico · CV\": pf[f][\"CV\"], \"Simulado · CV\": g(f\"CV(Y | {nf})\"),\n                     \"Teórico · P(B < 0)\": pf[f][\"Pdef\"], \"Simulado · P(B < 0)\": g(f\"P(B < 0 | {nf})\"),\n                     \"Teórico · VaR 95 %\": pf[f][\"VaR\"], \"Teórico · peso en la cola 5 %\": pf[f][\"peso_cola\"]}\n    return pd.DataFrame(filas).T\n\n\ndef fmt_tipos(fila, col, v):\n    if \"P(\" in col or \"peso\" in col:\n        return pct(v, 1)\n    if \"CV\" in col:\n        return num(v, 3)\n    return eur(v)\n\n\ndef tabla_fuentes(com, esc):\n    filas = {}\n    for f in ef.ESCENARIOS:\n        m = ef.momentos_fuentes(com, esc, f)\n        filas[ef.NOMBRE[f]] = {\"Solar E / σ\": f\"{num(m['Gs'][0], 1)} / {num(m['Gs'][1], 1)}\",\n                               \"Eólica E / σ\": f\"{num(m['Gw'][0], 1)} / {num(m['Gw'][1], 1)}\",\n                               \"Hidráulica E / σ\": f\"{num(m['Gh'][0], 1)} / {num(m['Gh'][1], 1)}\",\n                               \"Demanda E / σ\": f\"{num(m['D'][0], 1)} / {num(m['D'][1], 1)}\",\n                               \"Balance medio E(B)\": num(m[\"Gs\"][0] + m[\"Gw\"][0] + m[\"Gh\"][0] - m[\"D\"][0], 1)}\n    return pd.DataFrame(filas).T\n\n\ndef tabla_tipos_B(t, mcB):\n    pt = t[\"B\"][\"por_tipo\"]; rep = mcB[\"replicas\"]\n    filas = {}\n    for f in ef.ESCENARIOS:\n        nf = ef.NOMBRE[f]\n        filas[nf] = {\"p\": pt[f][\"p\"], \"Teórico · E(Δ) (€/día)\": pt[f][\"E_gan\"], \"Simulado · E(Δ) (€/día)\": rep[f\"E(Δ | {nf})\"].mean(),\n                     \"Cuota de la ganancia\": pt[f][\"cuota_gan\"], \"P(B < 0)\": pt[f][\"Pdef\"],\n                     \"Teórico · P(compra) con batería\": pt[f][\"Pspot_con\"], \"Déficit medio (MWh)\": pt[f][\"Edef\"],\n                     \"Superávit medio (MWh)\": pt[f][\"Esup\"]}\n    return pd.DataFrame(filas).T\n\n\ndef fmt_tipos_B(fila, col, v):\n    if col == \"p\" or \"P(\" in col or \"Cuota\" in col:\n        return pct(v, 1)\n    if \"MWh\" in col:\n        return num(v, 2)\n    return eur(v, 1)\n\n\ndef tabla_extras_B(t, mcB, esc):\n    B = t[\"B\"]\n    filas = {\n        \"Ganancia anual de la batería (365 × E(Δ))\": eur(B[\"gan_anual\"]),\n        \"Amortización anual de la batería\": f\"{eur(B['amortizacion'])} ({eur(float(esc['amort']))} por MWh y año)\",\n        \"Ingreso por servicios de red (O8.5)\": eur(B[\"ingreso_red\"]),\n        \"Ganancia neta anual\": eur(B[\"neto_anual\"]),\n        \"Tarifa de servicios de red para cubrir la amortización (O8.5)\": (f\"{eur(max(B['tarifa_equilibrio'], 0), 2)} por MWh y día\"\n                                                                          + (\" (ya es rentable sin tarifa)\" if B[\"tarifa_equilibrio\"] <= 0 else \"\")),\n        \"Tarifa que cubre la amortización por sí sola\": f\"{eur(B['tarifa_sola'], 2)} por MWh y día\",\n        \"Días al año que la batería evita comprar en el mercado (O6.3)\": num(B[\"LOLE_sin\"] - B[\"LOLE_con\"], 1),\n        \"σ(Δ) diario · diseño pareado (O4.1)\": f\"{eur(mcB['sd_par'])} simulado · {eur(B['sd_gan'])} teórico\",\n        \"σ(Y_con − Y_sin) · diseño independiente\": eur(mcB[\"sd_ind\"]) + \" simulado\",\n        \"Reducción de varianza del diseño pareado\": f\"× {num((mcB['sd_ind'] / mcB['sd_par']) ** 2, 0)}\" if mcB[\"sd_par\"] > 0 else \"—\",\n    }\n    return pd.DataFrame({\"Valor\": filas})\n\n\ndef tabla_parametros(res):\n    filas = {}\n    for n, r in res.items():\n        e = r[\"esc\"]\n        filas[n] = {\"p (Est. / Fro. / Mon. / Ant.)\": \" / \".join(num(x, 2) for x in ef.normalizar(e[\"p\"])),\n                    \"P_exp / P_pen (€/MWh)\": f\"{num(e['P_exp'], 0)} / {num(e['P_pen'], 0)}\" + (f\" (CV {pct(e['cv_pen'], 0)})\" if float(e.get('cv_pen') or 0) > 0 else \"\"),\n                    \"C_fijo (€) / c (€/MWh)\": f\"{num(e['C_fijo'], 0)} / {num(e['c_var'], 1)}\",\n                    \"Solar ×factor / +MWh\": f\"{num(e['solar_factor'], 2)} / {num(e['solar_extra'], 1)}\",\n                    \"Contrato (€/MWh; prima €/día)\": f\"{num(e['P_contrato'], 0)}; {num(e['prima'], 0)}\" if e.get(\"contrato\") else \"no\",\n                    \"Respuesta de demanda\": f\"−{pct(e['dr_red'], 0)} si B < −{num(e['dr_umbral'], 0)} ({num(e['dr_desc'], 0)} €/MWh)\" if float(e[\"dr_red\"]) > 0 else \"no\",\n                    \"Batería Cap / η / E₁\": f\"{num(e['cap'], 0)} / {num(e['eta'], 2)} / {pct(e['E1'], 0)}\",\n                    \"Amortización (€/MWh·año) / tarifa (€/MWh·día)\": f\"{num(e['amort'], 0)} / {num(e.get('tarifa') or 0, 2)}\"}\n    return pd.DataFrame(filas)\n\n\ndef tabla_dif(dif, cols):\n    return dif[[c for c in cols if c in dif.columns]]\n\n\nCOLS_DIF_A = [\"ΔE(Y) diario sin ba
